[package]
name = "flowsight-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Static execution flow analyzer for Linux kernel code"
repository = "https://github.com/TbusOS/flowsight"
homepage = "https://github.com/TbusOS/flowsight"
keywords = ["linux", "kernel", "analysis", "execution-flow", "static-analysis"]
categories = ["command-line-utilities", "development-tools"]
readme = "../README.md"

[[bin]]
name = "flowsight"
path = "src/main.rs"

[dependencies]
# Internal crates
flowsight-core = { workspace = true }
flowsight-parser = { workspace = true }
flowsight-cfg = { workspace = true }
flowsight-cpg = { workspace = true }
flowsight-llm = { workspace = true }
flowsight-analysis = { workspace = true }
flowsight-knowledge = { workspace = true }
flowsight-index = { workspace = true }
flowsight-query = { workspace = true }

# CLI framework
clap = { workspace = true }
clap_complete = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Config
toml = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
anyhow = { workspace = true }

# File walking (for batch analysis)
walkdir = { workspace = true }
globset = { workspace = true }

# Parallelism
rayon = { workspace = true }

# Database
rusqlite = { workspace = true }

# REPL / Interactive
rustyline = { workspace = true }
crossterm = { workspace = true }

# Async runtime (for LLM API calls)
tokio = { workspace = true }
futures = "0.3"

# Regex
regex = { workspace = true }

# AST-level analysis
tree-sitter = { workspace = true }
tree-sitter-c = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
regex = { workspace = true }


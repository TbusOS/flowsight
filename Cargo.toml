[workspace]
resolver = "2"
members = [
    "crates/flowsight-core",
    "crates/flowsight-parser",
    "crates/flowsight-index",
    "crates/flowsight-analysis",
    "crates/flowsight-knowledge",
    "crates/flowsight-query",
    "crates/flowsight-symbolic",
    "crates/flowsight-llvm",
    "crates/flowsight-ai",
    "crates/flowsight-learning",
    "cli",
    "app/src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["FlowSight Team"]
license = "MIT"
repository = "https://github.com/TbusOS/flowsight"
homepage = "https://github.com/TbusOS/flowsight"
description = "Static execution flow analyzer for Linux kernel code"

[workspace.dependencies]
# Internal crates
flowsight-core = { path = "crates/flowsight-core" }
flowsight-parser = { path = "crates/flowsight-parser" }
flowsight-index = { path = "crates/flowsight-index" }
flowsight-analysis = { path = "crates/flowsight-analysis" }
flowsight-knowledge = { path = "crates/flowsight-knowledge" }
flowsight-query = { path = "crates/flowsight-query" }
flowsight-symbolic = { path = "crates/flowsight-symbolic" }
flowsight-llvm = { path = "crates/flowsight-llvm" }
flowsight-ai = { path = "crates/flowsight-ai" }
flowsight-learning = { path = "crates/flowsight-learning" }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Parsing
tree-sitter = "0.22"
tree-sitter-c = "0.21"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }
sled = "0.34"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.4", features = ["derive"] }
clap_complete = "4.4"

# Config
toml = "0.8"

# Regex
regex = "1.10"

# Path handling
walkdir = "2.4"
globset = "0.4"

# Parallelism
rayon = "1.8"

# REPL / Interactive
rustyline = "15.0"
crossterm = "0.28"

[profile.release]
lto = true
codegen-units = 1
strip = true


name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  CARGO_INCREMENTAL: 0

jobs:
  #=====================================================================#
  # Rust 后端检查                                                       #
  #=====================================================================#
  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-src

      - name: Setup LLVM
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: llvm-17 llvm-17-dev clang-17
          version: 1.0

      - name: Configure LLVM
        run: |
          echo "LLVM_SYS_170_PREFIX=/usr/lib/llvm-17" >> $GITHUB_ENV

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true

      - name: Build
        run: cargo build --workspace --all-targets

  #=====================================================================#
  # Rust 测试                                                           #
  #=====================================================================#
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    needs: rust-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src

      - name: Setup LLVM
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: llvm-17 llvm-17-dev clang-17
          version: 1.0

      - name: Configure LLVM
        run: echo "LLVM_SYS_170_PREFIX=/usr/lib/llvm-17" >> $GITHUB_ENV

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --workspace --all-targets -- --test-threads=4

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./target/coverage/flags
          fail_ci_if_error: true

  #=====================================================================#
  # 前端检查                                                            #
  #=====================================================================#
  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm exec prettier --check src

      - name: Build
        run: pnpm build

  #=====================================================================#
  # 跨平台构建测试                                                      #
  #=====================================================================#
  cross-platform-build:
    name: Build on ${{ matrix.os }}
    needs: [rust-check, frontend-check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            llvm-17 \
            llvm-17-dev \
            clang-17

      - name: Build Rust
        run: cargo build --workspace --release

      - name: Build frontend
        working-directory: ./app
        run: pnpm build

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: app
          args: --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flowsight-${{ matrix.os }}-${{ github.sha }}
          path: |
            target/release/bundle/**
          retention-days: 7

  #=====================================================================#
  # 安全扫描                                                            #
  #=====================================================================#
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Cargo Audit
        uses: actions-rs/audit@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: --deny warnings

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  #=====================================================================#
  # 依赖更新检查                                                        #
  #=====================================================================#
  dependency-check:
    name: Dependency Update Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cargo outdated
        uses: actions-rs/cargo@v1
        with:
          command: outdated
          args: --workspace --root

      - name: Check npm outdated
        working-directory: ./app
        run: |
          npx npm-check-updates --minimal --silent || true

name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: false

permissions:
  contents: write

jobs:
  #=====================================================================#
  # 准备发布                                                            #
  #=====================================================================#
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          if [[ ${{ github.event_name }} == 'workflow_dispatch' && -n '${{ github.event.inputs.version }}' ]]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          elif [[ ${{ github.ref }} == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "version=$TAG" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Display version
        run: echo "Building version: ${{ steps.version.outputs.version }}"

  #=====================================================================#
  # 多平台构建                                                          #
  #=====================================================================#
  build:
    name: Build ${{ matrix.platform }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb.AppImage
            extra-deps: libwebkit2gtk-4.1-dev|libgtk-3-dev|libappindicator3-dev
          - platform: macOS-ARM
            os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            extra-deps: ""
          - platform: macOS-Intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
            extra-deps: ""
          - platform: Windows
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: msi
            extra-deps: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Linux dependencies
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            llvm-17 llvm-17-dev clang-17

      - name: Configure LLVM
        if: matrix.platform == 'Linux'
        run: echo "LLVM_SYS_170_PREFIX=/usr/lib/llvm-17" >> $GITHUB_ENV

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build Rust
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Build frontend
        working-directory: ./app
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: --release --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flowsight-${{ matrix.platform }}-${{ needs.prepare-release.outputs.version }}
          path: |
            target/${{ matrix.target }}/release/bundle/**
          retention-days: 30

  #=====================================================================#
  # 安全验证                                                            #
  #=====================================================================#
  security-verify:
    name: Security Verification
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify signatures
        run: |
          echo "Verifying signatures..."
          ls -la artifacts/

      - name: Run Trivy on artifacts
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'artifacts'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: 1

  #=====================================================================#
  # 创建 GitHub Release (仅标签触发)                                     #
  #=====================================================================#
  release-github:
    name: Create GitHub Release
    needs: [build, security-verify]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare-release.outputs.version }}
          name: FlowSight ${{ needs.prepare-release.outputs.version }}
          body: |
            ## What's New

            See [CHANGELOG.md](./CHANGELOG.md) for details.

            ## Downloads

            | Platform | File |
            |----------|------|
            | Linux | `.AppImage`, `.deb` |
            | macOS | `.dmg` (Apple Silicon & Intel) |
            | Windows | `.msi` |
          files: release-assets/**
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SHA256 checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt
          gh release upload ${{ needs.prepare-release.outputs.version }} checksums.txt --clobber

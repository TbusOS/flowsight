# File: /home/parallels/github/flowsight/.github/dependabot.yml

version: 2
updates:
  # Rust 依赖
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "rust"
    ignore: []
    commit-message:
      prefix: "chore(deps): rust"
      prefix-development: "chore(deps-dev): rust"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"

  # Node.js 依赖
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "javascript"
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps): node"
      prefix-development: "chore(deps-dev): node"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(actions)"
    ignore: []

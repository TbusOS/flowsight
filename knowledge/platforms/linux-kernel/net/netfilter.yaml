          - name: "priority"
            description: "优先级"
          - name: "policy"
            description: "默认策略 (accept/drop)"
      regular_chain:
        description: "常规链 (通过 jump/goto 调用)"
    registration:
      - pattern: 'nf_tables_newchain'
        description: "创建链"
        context: "process (netlink)"
      - pattern: 'nf_tables_delchain'
        description: "删除链"
        context: "process (netlink)"

  rule:
    description: "struct nft_rule - nftables 规则"
    fields:
      - name: "handle"
        type: "u64"
        description: "规则句柄"
      - name: "expressions"
        description: "表达式列表"
      - name: "comment"
        type: "const char *"
        description: "规则注释"
    registration:
      - pattern: 'nf_tables_newrule'
        description: "创建规则"
        context: "process (netlink)"
      - pattern: 'nf_tables_delrule'
        description: "删除规则"
        context: "process (netlink)"

  set:
    description: "struct nft_set - nftables 集合"
    fields:
      - name: "name"
        type: "const char *"
        description: "集合名称"
      - name: "dtype"
        type: "u32"
        description: "数据类型"
      - name: "ktype"

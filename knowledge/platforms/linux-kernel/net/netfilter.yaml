    nat:
      description: "NAT 链类型"
      hooks: "prerouting, input, output, postrouting"
      action: "地址转换"
    route:
      description: "路由链类型"
      hooks: "output"
      action: "标记路由"

  verdicts:
    description: "nftables 判定"
    values:
      NFT_CONTINUE:
        value: -1
        description: "继续下一条表达式/规则"
      NFT_BREAK:
        value: -2
        description: "停止当前规则，继续下一条规则"

        description: "表名称"
      - name: "family"
        type: "u32"
        description: "协议族 (NFPROTO_*)"
      - name: "flags"
        type: "u32"
        description: "表标志"
      - name: "chains"
        type: "struct list_head"
        description: "链列表"
      - name: "sets"
        type: "struct list_head"
        description: "集合列表"
      - name: "objects"
        type: "struct list_head"
        description: "对象列表"
    registration:
      - pattern: 'nf_tables_newtable'

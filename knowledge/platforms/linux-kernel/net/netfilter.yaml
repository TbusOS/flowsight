      NFT_RETURN:
        value: -5
        description: "返回上级链"

# ============================================================
# CONNECTION TRACKING
# ============================================================
nf_conntrack:
  description: "Connection Tracking - 连接跟踪"
  header: "net/netfilter/nf_conntrack.h"
  icon: "🔗"
  kernel_version: "5.0+"

  context:
    type: "softirq"
    can_sleep: false
    description: "连接跟踪在 softirq 上下文处理"

  helpers:
    - pattern: 'nf_conntrack_alloc\s*\(\s*(?P<net>\w+)\s*,\s*(?P<zone>\w+)\s*,\s*(?P<tuple>\w+)\s*,\s*(?P<gfp>\w+)\s*\)'
      description: "分配连接跟踪条目"
      context: "softirq/process"
      can_sleep: "depends on GFP"

    - pattern: 'nf_conntrack_free\s*\(\s*(?P<ct>\w+)\s*\)'
      description: "释放连接跟踪条目"
      context: "any"
      can_sleep: false

    - pattern: 'nf_ct_get\s*\(\s*(?P<skb>\w+)\s*,\s*(?P<ctinfo>\w+)\s*\)'
      description: "获取 SKB 的连接跟踪"
      context: "any"
      can_sleep: false
      return_type: "struct nf_conn *"

    - pattern: 'nf_ct_put\s*\(\s*(?P<ct>\w+)\s*\)'
      description: "释放连接跟踪引用"
      context: "any"
      can_sleep: false

    - pattern: 'nf_ct_is_confirmed\s*\(\s*(?P<ct>\w+)\s*\)'
      description: "检查连接是否已确认"
      context: "any"
      can_sleep: false
      return_type: "bool"

    - pattern: 'nf_ct_is_dying\s*\(\s*(?P<ct>\w+)\s*\)'
      description: "检查连接是否正在销毁"
      context: "any"
      can_sleep: false
      return_type: "bool"

  states:
    description: "连接跟踪状态"
    values:
      IP_CT_NEW:
        description: "新连接"
      IP_CT_ESTABLISHED:
        description: "已建立的连接"
      IP_CT_RELATED:
        description: "相关连接 (如 FTP 数据连接)"
      IP_CT_IS_REPLY:
        description: "回复方向"
      IP_CT_ESTABLISHED_REPLY:
        description: "已建立连接的回复"
      IP_CT_RELATED_REPLY:
        description: "相关连接的回复"

  protocol_tracker:
    pattern: 'nf_conntrack_l4proto_register\s*\(\s*(?P<net>\w+)\s*,\s*&(?P<proto>\w+)\s*\)'
    description: "注册 L4 协议跟踪器"
    context: "process"
    can_sleep: true

  structure:
    name: "nf_conn"
    description: "连接跟踪条目"
    fields:
      - name: "tuplehash"
        description: "原始/回复方向 tuple"
      - name: "status"
        description: "连接状态位"
      - name: "timeout"
        description: "超时时间"
      - name: "master"
        description: "主连接 (相关连接)"
      - name: "mark"
        description: "连接 mark (CONNMARK)"
      - name: "ct_general"
        description: "通用引用计数"

# ============================================================
# NAT
# ============================================================
nf_nat:
  description: "Network Address Translation - 网络地址转换"
  header: "net/netfilter/nf_nat.h"
  icon: "🔄"
  kernel_version: "5.0+"

  helpers:
    - pattern: 'nf_nat_setup_info\s*\(\s*(?P<ct>\w+)\s*,\s*(?P<range>\w+)\s*,\s*(?P<manip>\w+)\s*\)'
      description: "设置 NAT 信息"
      context: "softirq"
      can_sleep: false

    - pattern: 'nf_nat_packet\s*\(\s*(?P<ct>\w+)\s*,\s*(?P<ctinfo>\w+)\s*,\s*(?P<hooknum>\w+)\s*,\s*(?P<skb>\w+)\s*\)'
      description: "NAT 数据包处理"
      context: "softirq"
      can_sleep: false

    - pattern: 'nf_nat_mangle_udp_packet\s*\('
      description: "修改 UDP 数据包"
      context: "softirq"
      can_sleep: false

    - pattern: 'nf_nat_mangle_tcp_packet\s*\('
      description: "修改 TCP 数据包"
      context: "softirq"
      can_sleep: false

  manip_types:
    NF_NAT_MANIP_SRC:
      description: "源地址转换 (SNAT)"
    NF_NAT_MANIP_DST:
      description: "目标地址转换 (DNAT)"

  range_flags:
    NF_NAT_RANGE_MAP_IPS:
      description: "映射 IP 地址"
    NF_NAT_RANGE_PROTO_SPECIFIED:
      description: "指定端口范围"
    NF_NAT_RANGE_PROTO_RANDOM:
      description: "随机端口"
    NF_NAT_RANGE_PERSISTENT:
      description: "持久映射"

# ============================================================
# CALL CHAINS
# ============================================================
call_chains:
  nf_hook_slow:
    description: "Netfilter Hook 处理"
    trigger: "数据包经过 hook 点"
    chain:
      - function: "NF_HOOK (宏)"
        file: "include/linux/netfilter.h"
        description: "Netfilter 入口"
      - function: "nf_hook"
        file: "include/linux/netfilter.h"
        description: "检查 hook 是否存在"
      - function: "nf_hook_slow"
        file: "net/netfilter/core.c"
        description: "慢路径处理"
        context: "softirq"
      - function: "nf_hook_entry_hookfn"
        description: "调用每个注册的 hook"
      - function: "user_hook_fn"
        description: "用户 hook 函数"
        is_user_entry: true

  conntrack_in:
    description: "连接跟踪输入处理"
    trigger: "PRE_ROUTING hook"
    chain:
      - function: "nf_conntrack_in"
        file: "net/netfilter/nf_conntrack_core.c"
        description: "连接跟踪入口"
        context: "softirq"
      - function: "resolve_normal_ct"
        file: "net/netfilter/nf_conntrack_core.c"
        description: "解析连接"
      - function: "nf_conntrack_find_get"
        description: "查找现有连接"
      - function: "init_conntrack"
        description: "创建新连接"
      - function: "__nf_ct_expect_find"
        description: "检查期望连接"

  iptables_do_table:
    description: "iptables 规则匹配"
    trigger: "表处理"
    chain:
      - function: "ipt_do_table"
        file: "net/ipv4/netfilter/ip_tables.c"
        description: "iptables 入口"
        context: "softirq"
      - function: "遍历规则"
        description: "检查每条规则"
      - function: "match->match"
        description: "调用 match 函数"
        is_user_entry: true
      - function: "target->target"
        description: "调用 target 函数"
        is_user_entry: true

# ============================================================
# EXAMPLES
# ============================================================
examples:
  - description: "简单 Netfilter hook 模块"
    kernel_version: "5.0+"
    code: |
      #include <linux/module.h>
      #include <linux/netfilter.h>
      #include <linux/netfilter_ipv4.h>
      #include <linux/ip.h>
      #include <linux/tcp.h>
      
      static unsigned int my_hook_fn(void *priv,
                                     struct sk_buff *skb,
                                     const struct nf_hook_state *state)
      {
          struct iphdr *iph;
          struct tcphdr *tcph;
          
          if (!skb)
              return NF_ACCEPT;
          
          iph = ip_hdr(skb);
          if (!iph)
              return NF_ACCEPT;
          
          /* 只处理 TCP */
          if (iph->protocol != IPPROTO_TCP)
              return NF_ACCEPT;
          
          tcph = tcp_hdr(skb);
          if (!tcph)
              return NF_ACCEPT;
          
          /* 阻止目标端口 8080 */
          if (ntohs(tcph->dest) == 8080) {
              pr_info("Blocked packet to port 8080 from %pI4\n",
                      &iph->saddr);
              return NF_DROP;
          }
          
          return NF_ACCEPT;
      }
      
      static struct nf_hook_ops my_hook_ops = {
          .hook     = my_hook_fn,
          .pf       = NFPROTO_IPV4,
          .hooknum  = NF_INET_PRE_ROUTING,
          .priority = NF_IP_PRI_FIRST,
      };
      
      static int __init my_hook_init(void)
      {
          int ret;
          
          ret = nf_register_net_hook(&init_net, &my_hook_ops);
          if (ret) {
              pr_err("Failed to register hook\n");
              return ret;
          }
          
          pr_info("Hook registered\n");
          return 0;
      }
      
      static void __exit my_hook_exit(void)
      {
          nf_unregister_net_hook(&init_net, &my_hook_ops);
          pr_info("Hook unregistered\n");
      }
      
      module_init(my_hook_init);
      module_exit(my_hook_exit);
      MODULE_LICENSE("GPL");

  - description: "xtables target 模块"
    kernel_version: "5.0+"
    code: |
      #include <linux/module.h>
      #include <linux/netfilter/x_tables.h>
      #include <linux/netfilter_ipv4/ip_tables.h>
      
      struct xt_mytarget_info {
          __u32 value;
      };
      
      static unsigned int mytarget_tg(struct sk_buff *skb,
                                      const struct xt_action_param *par)
      {
          const struct xt_mytarget_info *info = par->targinfo;
          
          /* 设置 skb mark */
          skb->mark = info->value;
          
          pr_debug("Set mark to %u\n", info->value);
          
          return XT_CONTINUE;
      }
      
      static int mytarget_tg_check(const struct xt_tgchk_param *par)
      {
          const struct xt_mytarget_info *info = par->targinfo;
          
          if (info->value == 0) {
              pr_err("Invalid value\n");
              return -EINVAL;
          }
          
          return 0;
      }
      
      static struct xt_target mytarget_tg_reg = {
          .name       = "MYTARGET",
          .revision   = 0,
          .family     = NFPROTO_IPV4,
          .target     = mytarget_tg,
          .checkentry = mytarget_tg_check,
          .targetsize = sizeof(struct xt_mytarget_info),
          .me         = THIS_MODULE,
      };
      
      static int __init mytarget_init(void)
      {
          return xt_register_target(&mytarget_tg_reg);
      }
      
      static void __exit mytarget_exit(void)
      {
          xt_unregister_target(&mytarget_tg_reg);
      }
      
      module_init(mytarget_init);
      module_exit(mytarget_exit);
      MODULE_LICENSE("GPL");
      MODULE_ALIAS("ipt_MYTARGET");

  - description: "nftables 表达式模块"
    kernel_version: "5.0+"
    code: |
      #include <linux/module.h>
      #include <net/netfilter/nf_tables.h>
      
      struct nft_myexpr {
          u32 value;
      };
      
      static void nft_myexpr_eval(const struct nft_expr *expr,
                                  struct nft_regs *regs,
                                  const struct nft_pktinfo *pkt)
      {
          const struct nft_myexpr *priv = nft_expr_priv(expr);
          
          /* 设置目标寄存器 */
          regs->verdict.code = priv->value ? NFT_CONTINUE : NFT_BREAK;
      }
      
      static const struct nla_policy nft_myexpr_policy[NFTA_MYEXPR_MAX + 1] = {
          [NFTA_MYEXPR_VALUE] = { .type = NLA_U32 },
      };
      
      static int nft_myexpr_init(const struct nft_ctx *ctx,
                                 const struct nft_expr *expr,
                                 const struct nlattr * const tb[])
      {
          struct nft_myexpr *priv = nft_expr_priv(expr);
          
          if (!tb[NFTA_MYEXPR_VALUE])
              return -EINVAL;
          
          priv->value = ntohl(nla_get_be32(tb[NFTA_MYEXPR_VALUE]));
          
          return 0;
      }
      
      static int nft_myexpr_dump(struct sk_buff *skb,
                                 const struct nft_expr *expr)
      {
          const struct nft_myexpr *priv = nft_expr_priv(expr);
          
          if (nla_put_be32(skb, NFTA_MYEXPR_VALUE, htonl(priv->value)))
              return -ENOSPC;
          
          return 0;
      }
      
      static const struct nft_expr_ops nft_myexpr_ops = {
          .type       = &nft_myexpr_type,
          .size       = NFT_EXPR_SIZE(sizeof(struct nft_myexpr)),
          .eval       = nft_myexpr_eval,
          .init       = nft_myexpr_init,
          .dump       = nft_myexpr_dump,
      };
      
      static struct nft_expr_type nft_myexpr_type __read_mostly = {
          .name       = "myexpr",
          .ops        = &nft_myexpr_ops,
          .policy     = nft_myexpr_policy,
          .maxattr    = NFTA_MYEXPR_MAX,
          .owner      = THIS_MODULE,
      };
      
      static int __init nft_myexpr_module_init(void)
      {
          return nft_register_expr(&nft_myexpr_type);
      }
      
      static void __exit nft_myexpr_module_exit(void)
      {
          nft_unregister_expr(&nft_myexpr_type);
      }
      
      module_init(nft_myexpr_module_init);
      module_exit(nft_myexpr_module_exit);
      MODULE_LICENSE("GPL");
      MODULE_ALIAS_NFT_EXPR("myexpr");

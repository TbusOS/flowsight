# ============================================================
# EXAMPLES
# ============================================================

examples:
  - description: "TCP 拥塞控制算法注册示例"
    kernel_version: "5.0+"
    code: |
      #include <linux/module.h>
      #include <net/tcp.h>
      
      /* 拥塞控制状态 */
      struct my_cc_state {
          u32 last_cwnd;
          u32 last_rtt;
      };
      
      /* 初始化 */
      static void my_cc_init(struct sock *sk)
      {
          struct my_cc_state *ca = inet_csk_ca(sk);
          struct tcp_sock *tp = tcp_sk(sk);
          
          ca->last_cwnd = tp->snd_cwnd;
          ca->last_rtt = 0;
      }
      
      /* 计算 ssthresh */
      static u32 my_cc_ssthresh(struct sock *sk)
      {
          const struct tcp_sock *tp = tcp_sk(sk);
          
          /* 丢包后减半 */
          return max(tp->snd_cwnd >> 1U, 2U);
      }
      
      /* 拥塞避免 */
      static void my_cc_cong_avoid(struct sock *sk, u32 ack, u32 acked)
      {
          struct tcp_sock *tp = tcp_sk(sk);
          
          if (!tcp_is_cwnd_limited(sk))
              return;
          
          if (tcp_in_slow_start(tp)) {
              /* 慢启动：指数增长 */
              tcp_slow_start(tp, acked);
          } else {
              /* 拥塞避免：线性增长 */
              tcp_cong_avoid_ai(tp, tp->snd_cwnd, acked);
          }
      }
      
      /* 状态变化 */
      static void my_cc_state(struct sock *sk, u8 new_state)
      {
          if (new_state == TCP_CA_Loss) {
              /* 进入丢包状态 */
              pr_debug("my_cc: entering loss state\n");
          }
      }
      
      /* 拥塞控制操作结构 */
      static struct tcp_congestion_ops my_cc_ops __read_mostly = {
          .name       = "my_cc",
          .owner      = THIS_MODULE,
          .init       = my_cc_init,
          .ssthresh   = my_cc_ssthresh,
          .cong_avoid = my_cc_cong_avoid,
          .set_state  = my_cc_state,
      };
      
      static int __init my_cc_register(void)
      {
          BUILD_BUG_ON(sizeof(struct my_cc_state) > ICSK_CA_PRIV_SIZE);
          return tcp_register_congestion_control(&my_cc_ops);
      }
      
      static void __exit my_cc_unregister(void)
      {
          tcp_unregister_congestion_control(&my_cc_ops);
      }
      
      module_init(my_cc_register);
      module_exit(my_cc_unregister);
      MODULE_LICENSE("GPL");
      MODULE_DESCRIPTION("My TCP Congestion Control");

  - description: "TCP socket 选项示例"
    kernel_version: "5.0+"
    code: |
      /* 用户空间代码 */
      #include <sys/socket.h>
      #include <netinet/tcp.h>
      
      int setup_tcp_socket(int sockfd)
      {
          int optval;
          socklen_t optlen;
          
          /* 设置 TCP_NODELAY (禁用 Nagle 算法) */
          optval = 1;
          if (setsockopt(sockfd, IPPROTO_TCP, TCP_NODELAY,
                        &optval, sizeof(optval)) < 0)
              return -1;
          
          /* 设置 TCP_QUICKACK (禁用延迟 ACK) */
          optval = 1;
          if (setsockopt(sockfd, IPPROTO_TCP, TCP_QUICKACK,
                        &optval, sizeof(optval)) < 0)
              return -1;
          
          /* 设置拥塞控制算法 */
          const char *cc = "bbr";
          if (setsockopt(sockfd, IPPROTO_TCP, TCP_CONGESTION,
                        cc, strlen(cc)) < 0)
              return -1;
          
          /* 获取当前拥塞控制算法 */
          char cc_name[16];
          optlen = sizeof(cc_name);
          if (getsockopt(sockfd, IPPROTO_TCP, TCP_CONGESTION,
                        cc_name, &optlen) < 0)
              return -1;
          
          /* 设置 TCP keepalive */
          optval = 1;
          setsockopt(sockfd, SOL_SOCKET, SO_KEEPALIVE,
                    &optval, sizeof(optval));
          
          optval = 60;  /* 空闲 60 秒后开始探测 */
          setsockopt(sockfd, IPPROTO_TCP, TCP_KEEPIDLE,
                    &optval, sizeof(optval));
          
          optval = 10;  /* 探测间隔 10 秒 */
          setsockopt(sockfd, IPPROTO_TCP, TCP_KEEPINTVL,
                    &optval, sizeof(optval));
          
          optval = 5;   /* 探测 5 次 */
          setsockopt(sockfd, IPPROTO_TCP, TCP_KEEPCNT,
                    &optval, sizeof(optval));
          
          return 0;
      }

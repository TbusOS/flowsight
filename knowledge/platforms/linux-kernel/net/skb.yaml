# ============================================================
# EXAMPLES
# ============================================================

examples:
  - description: "典型 NAPI 接收处理"
    code: |
      static int my_poll(struct napi_struct *napi, int budget)
      {
          struct my_priv *priv = container_of(napi, struct my_priv, napi);
          int work_done = 0;
          
          while (work_done < budget) {
              struct my_rx_desc *desc;
              struct sk_buff *skb;
              unsigned int len;
              
              desc = &priv->rx_ring[priv->rx_head];
              if (!(desc->status & DESC_DONE))
                  break;
              
              len = desc->len;
              skb = priv->rx_skb[priv->rx_head];
              
              /* 取消 DMA 映射 */
              dma_unmap_single(&priv->pdev->dev, desc->buf_addr,
                              RX_BUF_SIZE, DMA_FROM_DEVICE);
              
              /* 设置 skb 长度 */
              skb_put(skb, len);
              
              /* 解析以太网类型 */
              skb->protocol = eth_type_trans(skb, priv->netdev);
              
              /* 传递给协议栈 (GRO 优化) */
              napi_gro_receive(napi, skb);
              
              /* 分配新 buffer */
              priv->rx_skb[priv->rx_head] = netdev_alloc_skb(priv->netdev, RX_BUF_SIZE);
              
              priv->rx_head = (priv->rx_head + 1) % RX_RING_SIZE;
              work_done++;
          }
          
          if (work_done < budget) {
              napi_complete_done(napi, work_done);
              my_enable_rx_irq(priv);
          }
          
          return work_done;
      }

  - description: "发送路径 skb 处理"
    code: |
      static netdev_tx_t my_start_xmit(struct sk_buff *skb, struct net_device *dev)
      {
          struct my_priv *priv = netdev_priv(dev);
          struct my_tx_desc *desc;
          dma_addr_t dma_addr;
          
          /* 检查线性化需求 */
          if (skb_is_nonlinear(skb)) {
              if (skb_linearize(skb)) {
                  dev->stats.tx_dropped++;
                  dev_kfree_skb_any(skb);
                  return NETDEV_TX_OK;
              }
          }
          
          /* 确保有足够 headroom 添加硬件头 */
          if (skb_headroom(skb) < MY_HDR_LEN) {
              struct sk_buff *skb2;
              skb2 = skb_realloc_headroom(skb, MY_HDR_LEN);
              dev_consume_skb_any(skb);
              if (!skb2) {
                  dev->stats.tx_dropped++;
                  return NETDEV_TX_OK;
              }
              skb = skb2;
          }
          
          /* 添加硬件头 */
          skb_push(skb, MY_HDR_LEN);
          my_build_header(skb->data, skb->len);
          
          /* DMA 映射 */
          dma_addr = dma_map_single(&priv->pdev->dev, skb->data,
                                    skb->len, DMA_TO_DEVICE);
          if (dma_mapping_error(&priv->pdev->dev, dma_addr)) {
              dev->stats.tx_dropped++;
              dev_kfree_skb_any(skb);
              return NETDEV_TX_OK;
          }
          
          /* 设置描述符并发送 */
          desc = &priv->tx_ring[priv->tx_head];
          desc->buf_addr = dma_addr;
          desc->len = skb->len;
          wmb();
          desc->status = DESC_OWN_HW;
          
          priv->tx_skb[priv->tx_head] = skb;
          priv->tx_head = (priv->tx_head + 1) % TX_RING_SIZE;
          
          /* 触发发送 */
          my_trigger_tx(priv);
          
          return NETDEV_TX_OK;
      }

  - description: "协议头访问示例"
    code: |
      /* 安全访问可能跨越分片的协议头 */
      static int my_parse_headers(struct sk_buff *skb)
      {
          struct iphdr _iph;
          struct iphdr *iph;
          struct tcphdr _tcph;
          struct tcphdr *tcph;
          int offset;
          
          /* 获取 IP 头 (可能在分片中) */
          iph = skb_header_pointer(skb, 0, sizeof(_iph), &_iph);
          if (!iph)
              return -EINVAL;
          
          /* 检查协议 */
          if (iph->protocol != IPPROTO_TCP)
              return -EPROTONOSUPPORT;
          
          /* 计算 TCP 头偏移 */
          offset = iph->ihl * 4;
          
          /* 获取 TCP 头 */
          tcph = skb_header_pointer(skb, offset, sizeof(_tcph), &_tcph);
          if (!tcph)
              return -EINVAL;
          
          pr_info("TCP src=%u dst=%u\n",
                  ntohs(tcph->source), ntohs(tcph->dest));
          
          return 0;
      }
      
      /* 直接访问线性数据中的头 */
      static void my_fast_path(struct sk_buff *skb)
      {
          struct iphdr *iph = ip_hdr(skb);
          struct tcphdr *tcph = tcp_hdr(skb);
          
          /* 只有确定数据在线性区域才能这样用 */
          pr_info("IP src=%pI4 dst=%pI4\n",
                  &iph->saddr, &iph->daddr);
      }


# ============================================================
# NOTES
# ============================================================

notes:
  - "sk_buff 是 Linux 网络子系统最核心的数据结构"
  - "理解 head/data/tail/end 指针关系是关键"
  - "skb_push 用于添加协议头，skb_pull 用于剥离协议头"
  - "分片数据 (data_len > 0) 需要特殊处理"
  - "共享的 skb 修改前必须复制 (skb_share_check/skb_cow)"
  - "使用 napi_gro_receive 而非 netif_receive_skb 可获得 GRO 优化"
  - "释放 skb 时区分错误路径 (kfree_skb) 和正常路径 (consume_skb)"
  - "NAPI 上下文使用 napi_alloc_skb 效率更高"

# ============================================================
# BEST PRACTICES
# ============================================================
best_practices:
  description: "热补丁最佳实践"
  icon: "📚"

  guidelines:
    - title: "最小化补丁范围"
      description: "只修改必要的函数"
      reason: "减少风险和过渡时间"

    - title: "使用累积补丁"
      description: "新补丁应包含所有之前的修复"
      reason: "简化补丁管理"

    - title: "测试补丁过渡"

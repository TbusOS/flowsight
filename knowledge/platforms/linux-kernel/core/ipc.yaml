# ============================================================
# IPC EXAMPLES
# ============================================================

examples:
  - description: "System V 共享内存示例"
    kernel_version: "2.6+"
    code: |
      #include <sys/shm.h>
      #include <sys/ipc.h>
      #include <stdio.h>
      #include <string.h>
      
      int main() {
          key_t key = ftok("/tmp", 65);
          
          /* 创建共享内存段 */
          int shmid = shmget(key, 1024, IPC_CREAT | 0666);
          if (shmid < 0) {
              perror("shmget");
              return 1;
          }
          
          /* 附加到进程地址空间 */
          char *str = shmat(shmid, NULL, 0);
          if (str == (char *)-1) {
              perror("shmat");
              return 1;
          }
          
          /* 写入数据 */
          strcpy(str, "Hello, Shared Memory!");
          printf("Written: %s\n", str);
          
          /* 分离共享内存 */
          shmdt(str);
          
          /* 删除共享内存 (可选) */
          /* shmctl(shmid, IPC_RMID, NULL); */
          
          return 0;
      }

  - description: "POSIX 共享内存示例"
    kernel_version: "2.6+"
    code: |
      #include <sys/mman.h>
      #include <sys/stat.h>
      #include <fcntl.h>
      #include <unistd.h>
      #include <stdio.h>
      #include <string.h>
      
      int main() {
          const char *name = "/my_shm";
          const size_t size = 4096;
          
          /* 创建共享内存对象 */
          int fd = shm_open(name, O_CREAT | O_RDWR, 0666);
          if (fd < 0) {
              perror("shm_open");
              return 1;
          }
          
          /* 设置大小 */
          ftruncate(fd, size);
          
          /* 映射到进程地址空间 */
          void *ptr = mmap(NULL, size, PROT_READ | PROT_WRITE,
                          MAP_SHARED, fd, 0);
          if (ptr == MAP_FAILED) {
              perror("mmap");
              return 1;
          }
          
          /* 使用共享内存 */
          strcpy(ptr, "Hello from POSIX shm!");
          printf("Written: %s\n", (char *)ptr);
          
          /* 清理 */
          munmap(ptr, size);
          close(fd);
          /* shm_unlink(name); */  /* 删除共享内存对象 */
          
          return 0;
      }

  - description: "Unix 域套接字文件描述符传递 (SCM_RIGHTS)"
    kernel_version: "2.6+"
    code: |
      #include <sys/socket.h>
      #include <sys/un.h>
      #include <unistd.h>
      #include <stdio.h>
      #include <string.h>
      
      /* 发送文件描述符 */
      int send_fd(int socket, int fd_to_send) {
          struct msghdr msg = {0};
          struct cmsghdr *cmsg;
          char buf[CMSG_SPACE(sizeof(fd_to_send))];
          struct iovec io = { .iov_base = "x", .iov_len = 1 };
          
          msg.msg_iov = &io;
          msg.msg_iovlen = 1;
          msg.msg_control = buf;
          msg.msg_controllen = sizeof(buf);
          
          cmsg = CMSG_FIRSTHDR(&msg);
          cmsg->cmsg_level = SOL_SOCKET;
          cmsg->cmsg_type = SCM_RIGHTS;
          cmsg->cmsg_len = CMSG_LEN(sizeof(fd_to_send));
          
          memcpy(CMSG_DATA(cmsg), &fd_to_send, sizeof(fd_to_send));
          
          return sendmsg(socket, &msg, 0);
      }
      
      /* 接收文件描述符 */
      int recv_fd(int socket) {
          struct msghdr msg = {0};
          struct cmsghdr *cmsg;
          char buf[CMSG_SPACE(sizeof(int))];
          char dummy;
          struct iovec io = { .iov_base = &dummy, .iov_len = 1 };
          int fd;
          
          msg.msg_iov = &io;
          msg.msg_iovlen = 1;
          msg.msg_control = buf;
          msg.msg_controllen = sizeof(buf);
          
          if (recvmsg(socket, &msg, 0) < 0)
              return -1;
          
          cmsg = CMSG_FIRSTHDR(&msg);
          memcpy(&fd, CMSG_DATA(cmsg), sizeof(fd));
          
          return fd;
      }

  - description: "eventfd 与 epoll 配合使用"
    kernel_version: "2.6.22+"
    code: |
      #include <sys/eventfd.h>
      #include <sys/epoll.h>
      #include <unistd.h>
      #include <stdint.h>
      #include <stdio.h>
      
      int main() {
          /* 创建 eventfd */
          int efd = eventfd(0, EFD_NONBLOCK);
          if (efd < 0) {
              perror("eventfd");
              return 1;
          }
          
          /* 创建 epoll */
          int epfd = epoll_create1(0);
          struct epoll_event ev = {
              .events = EPOLLIN,
              .data.fd = efd
          };
          epoll_ctl(epfd, EPOLL_CTL_ADD, efd, &ev);
          
          /* 在另一线程或进程中发信号 */
          uint64_t val = 1;
          write(efd, &val, sizeof(val));
          
          /* 等待事件 */
          struct epoll_event events[10];
          int nfds = epoll_wait(epfd, events, 10, -1);
          
          for (int i = 0; i < nfds; i++) {
              if (events[i].data.fd == efd) {
                  uint64_t count;
                  read(efd, &count, sizeof(count));
                  printf("Event received, count: %lu\n", count);
              }
          }
          
          close(efd);
          close(epfd);
          return 0;
      }

  - description: "futex 用户空间互斥锁"
    kernel_version: "2.6+"
    code: |
      #include <linux/futex.h>
      #include <sys/syscall.h>
      #include <unistd.h>
      #include <stdatomic.h>
      #include <limits.h>
      
      /* 简化的 futex 互斥锁 */
      typedef struct {
          atomic_int state;  /* 0=unlocked, 1=locked, 2=contended */
      } futex_mutex_t;
      
      static int futex_wait(int *uaddr, int val) {
          return syscall(SYS_futex, uaddr, FUTEX_WAIT, val, NULL, NULL, 0);
      }
      
      static int futex_wake(int *uaddr, int n) {
          return syscall(SYS_futex, uaddr, FUTEX_WAKE, n, NULL, NULL, 0);
      }
      
      void futex_mutex_lock(futex_mutex_t *m) {
          int c = 0;
          /* 尝试从 0 -> 1 (无竞争获取) */
          if (atomic_compare_exchange_strong(&m->state, &c, 1))
              return;
          
          /* 有竞争，进入慢路径 */
          if (c != 2)
              c = atomic_exchange(&m->state, 2);
          
          while (c != 0) {
              futex_wait((int *)&m->state, 2);
              c = atomic_exchange(&m->state, 2);
          }
      }
      
      void futex_mutex_unlock(futex_mutex_t *m) {
          /* 从 1 -> 0 (无竞争释放) 或从 2 -> 0 (有等待者) */
          if (atomic_fetch_sub(&m->state, 1) != 1) {
              atomic_store(&m->state, 0);
              futex_wake((int *)&m->state, 1);
          }
      }

  - description: "timerfd 周期定时器"
    kernel_version: "2.6.25+"
    code: |
      #include <sys/timerfd.h>
      #include <unistd.h>
      #include <stdint.h>
      #include <stdio.h>
      #include <time.h>
      
      int main() {
          /* 创建 timerfd */
          int tfd = timerfd_create(CLOCK_MONOTONIC, 0);
          if (tfd < 0) {
              perror("timerfd_create");
              return 1;
          }
          
          /* 设置 1 秒后开始，每 500ms 触发一次 */
          struct itimerspec its = {
              .it_value = { .tv_sec = 1, .tv_nsec = 0 },
              .it_interval = { .tv_sec = 0, .tv_nsec = 500000000 }
          };
          
          if (timerfd_settime(tfd, 0, &its, NULL) < 0) {
              perror("timerfd_settime");
              return 1;
          }
          
          /* 读取定时器过期 */
          for (int i = 0; i < 10; i++) {
              uint64_t expirations;
              read(tfd, &expirations, sizeof(expirations));
              
              struct timespec now;
              clock_gettime(CLOCK_MONOTONIC, &now);
              printf("Timer expired %lu times at %ld.%09ld\n",
                     expirations, now.tv_sec, now.tv_nsec);
          }
          
          close(tfd);
          return 0;
      }

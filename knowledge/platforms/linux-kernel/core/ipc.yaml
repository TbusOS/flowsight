timerfd:
  description: "Timer File Descriptor"
  header: "linux/timerfd.h"
  icon: "⏰"
  kernel_version: "2.6.25+"
  source_file: "fs/timerfd.c"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  syscalls:
    timerfd_create:
      pattern: 'timerfd_create\s*\(\s*(?P<clockid>[^,]+)\s*,\s*(?P<flags>[^)]+)\s*\)'
      description: "创建 timerfd"
      signature: "int timerfd_create(int clockid, int flags)"
      return_value:
        success: "文件描述符"
        failure: "-1"

    timerfd_settime:
      pattern: 'timerfd_settime\s*\(\s*(?P<fd>[^,]+)\s*,\s*(?P<flags>[^,]+)\s*,\s*(?P<new_value>[^,]+)\s*,\s*(?P<old_value>[^)]+)\s*\)'
      description: "设置定时器"
      signature: "int timerfd_settime(int fd, int flags, const struct itimerspec *new_value, struct itimerspec *old_value)"
      flags:
        - "TFD_TIMER_ABSTIME - 绝对时间"
        - "TFD_TIMER_CANCEL_ON_SET - CLOCK_REALTIME 变化时取消"

    timerfd_gettime:

  icon: "🔧"

  common_helpers:
    bpf_map_lookup_elem:
      description: "查找 map 元素"
      signature: "void *bpf_map_lookup_elem(map, key)"

    bpf_map_update_elem:
      description: "更新 map 元素"
      signature: "int bpf_map_update_elem(map, key, value, flags)"

    bpf_map_delete_elem:
      description: "删除 map 元素"
      signature: "int bpf_map_delete_elem(map, key)"

    bpf_probe_read:
      description: "安全读取内核内存"
      signature: "int bpf_probe_read(dst, size, src)"
      deprecated: "使用 bpf_probe_read_kernel"

    bpf_probe_read_kernel:
      description: "读取内核内存"
      kernel_version: "5.5"
      signature: "int bpf_probe_read_kernel(dst, size, src)"

    bpf_probe_read_user:
      description: "读取用户空间内存"
      kernel_version: "5.5"
      signature: "int bpf_probe_read_user(dst, size, src)"

    bpf_ktime_get_ns:
      description: "获取内核时间（纳秒）"
      signature: "u64 bpf_ktime_get_ns(void)"

    bpf_trace_printk:
      description: "调试打印"
      signature: "int bpf_trace_printk(fmt, fmt_size, ...)"
      notes: "仅用于调试"

    bpf_get_current_pid_tgid:
      description: "获取当前 PID/TGID"
      signature: "u64 bpf_get_current_pid_tgid(void)"

    bpf_get_current_uid_gid:
      description: "获取当前 UID/GID"
      signature: "u64 bpf_get_current_uid_gid(void)"

    bpf_get_current_comm:
      description: "获取当前进程名"
      signature: "int bpf_get_current_comm(buf, buf_size)"

    bpf_perf_event_output:
      description: "输出到 perf 缓冲区"
      signature: "int bpf_perf_event_output(ctx, map, flags, data, size)"

    bpf_ringbuf_output:
      description: "输出到环形缓冲区"
      kernel_version: "5.8"
      signature: "int bpf_ringbuf_output(ringbuf, data, size, flags)"

    bpf_ringbuf_reserve:
      description: "预留环形缓冲区空间"
      kernel_version: "5.8"
      signature: "void *bpf_ringbuf_reserve(ringbuf, size, flags)"

    bpf_ringbuf_submit:
      description: "提交预留的数据"
      kernel_version: "5.8"
      signature: "void bpf_ringbuf_submit(data, flags)"

# ============================================================
# BPF VERIFIER
# ============================================================
bpf_verifier:
  description: "BPF 验证器"
  header: "kernel/bpf/verifier.c"
  icon: "✅"

  checks:
    - "程序不会崩溃或挂起内核"
    - "程序会终止（无无限循环）"
    - "内存访问是安全的"
    - "不会泄露内核指针"
    - "只调用允许的辅助函数"
    - "寄存器使用正确"

  limitations:
    max_instructions:
      description: "最大指令数"
      value: "1M (4096 在早期版本)"
    
    max_stack:
      description: "最大栈大小"
      value: "512 字节"
    
    max_complexity:
      description: "最大复杂度"
      notes: "验证路径数限制"

# ============================================================
# BPF IN KERNEL DRIVERS
# ============================================================
driver_integration:
  description: "驱动中的 BPF 使用"
  icon: "🔌"

  xdp_driver:
    description: "XDP 驱动支持"
    modes:
      native:
        description: "原生 XDP"
        notes: "驱动直接支持，最高性能"
      offload:
        description: "XDP 卸载"
        notes: "硬件执行 BPF"
      generic:
        description: "通用 XDP"
        notes: "内核软件实现"

    driver_ops:
      ndo_bpf:
        description: "BPF 操作回调"
        pattern: '\.ndo_bpf\s*=\s*(?P<handler>\w+)'
      
      ndo_xdp_xmit:
        description: "XDP 发送回调"
        pattern: '\.ndo_xdp_xmit\s*=\s*(?P<handler>\w+)'

# ============================================================
# CALL CHAINS
# ============================================================
call_chains:
  bpf_prog_load_flow:
    description: "BPF 程序加载流程"
    chain:
      - caller: "bpf() syscall"
        callee: "bpf_prog_load"
        context: "process"
        description: "加载程序"
      - caller: "bpf_prog_load"
        callee: "bpf_prog_alloc"
        description: "分配程序结构"
      - caller: "bpf_prog_load"
        callee: "bpf_check"
        description: "验证程序"
      - caller: "bpf_check"
        callee: "do_check"
        description: "执行验证"
      - caller: "bpf_prog_load"
        callee: "bpf_prog_select_runtime"
        description: "JIT 编译"

  xdp_execution_flow:
    description: "XDP 执行流程"
    chain:
      - caller: "driver rx handler"
        callee: "bpf_prog_run_xdp"
        context: "softirq/NAPI"
        description: "运行 XDP 程序"
      - caller: "bpf_prog_run_xdp"
        callee: "执行 JIT 代码"
        description: "执行 BPF 字节码"
      - caller: "driver"
        callee: "根据返回值处理"
        description: "XDP_DROP/PASS/TX/REDIRECT"

# ============================================================
# EXAMPLES
# ============================================================
examples:
  - description: "内核模块中运行 BPF 程序"
    kernel_version: "4.4+"
    code: |
      #include <linux/bpf.h>
      #include <linux/filter.h>
      
      /* 定义简单的 BPF 程序 */
      static struct bpf_insn my_prog[] = {
          /* r0 = 0 (返回值) */
          BPF_MOV64_IMM(BPF_REG_0, 0),
          /* return r0 */
          BPF_EXIT_INSN(),
      };
      
      /* 加载并运行 BPF 程序 */
      int run_bpf_prog(struct sk_buff *skb)
      {
          struct bpf_prog *prog;
          int ret;
          
          prog = bpf_prog_alloc(sizeof(my_prog), 0);
          if (!prog)
              return -ENOMEM;
          
          prog->len = ARRAY_SIZE(my_prog);
          memcpy(prog->insnsi, my_prog, sizeof(my_prog));
          prog->type = BPF_PROG_TYPE_SOCKET_FILTER;
          
          /* 验证并 JIT 编译 */
          ret = bpf_prog_select_runtime(prog, NULL);
          if (ret) {
              bpf_prog_free(prog);
              return ret;
          }
          
          /* 运行程序 */
          ret = BPF_PROG_RUN(prog, skb);
          
          bpf_prog_free(prog);
          return ret;
      }

  - description: "XDP 驱动支持示例"
    kernel_version: "4.8+"
    code: |
      #include <linux/bpf.h>
      #include <linux/netdevice.h>
      
      static int my_xdp_setup(struct net_device *dev,
                              struct netdev_bpf *bpf)
      {
          struct bpf_prog *prog = bpf->prog;
          struct my_adapter *adapter = netdev_priv(dev);
          
          switch (bpf->command) {
          case XDP_SETUP_PROG:
              /* 保存旧程序 */
              struct bpf_prog *old = adapter->xdp_prog;
              
              /* 设置新程序 */
              adapter->xdp_prog = prog;
              if (prog)
                  bpf_prog_add(prog, 1);
              
              /* 释放旧程序 */
              if (old)
                  bpf_prog_put(old);
              
              return 0;
              
          case XDP_QUERY_PROG:
              bpf->prog_id = adapter->xdp_prog ?
                             adapter->xdp_prog->aux->id : 0;
              return 0;
              
          default:
              return -EINVAL;
          }
      }
      
      /* 在 NAPI poll 中运行 XDP */
      static int my_napi_poll(struct napi_struct *napi, int budget)
      {
          struct my_adapter *adapter = ...;
          struct bpf_prog *xdp_prog = adapter->xdp_prog;
          
          while (packets_to_process) {
              struct xdp_buff xdp;
              u32 act;
              
              /* 设置 xdp_buff */
              xdp.data = packet_data;
              xdp.data_end = packet_data + len;
              xdp.data_hard_start = ...;
              
              if (xdp_prog) {
                  act = bpf_prog_run_xdp(xdp_prog, &xdp);
                  switch (act) {
                  case XDP_DROP:
                      /* 丢弃数据包 */
                      continue;
                  case XDP_TX:
                      /* 发送回同一接口 */
                      my_xdp_xmit(dev, &xdp);
                      continue;
                  case XDP_REDIRECT:
                      /* 重定向到其他接口 */
                      xdp_do_redirect(dev, &xdp, xdp_prog);
                      continue;
                  case XDP_PASS:
                  default:
                      /* 传递到网络栈 */
                      break;
                  }
              }
              
              /* 正常处理数据包 */
              process_packet(adapter, packet_data, len);
          }
          
          return processed;
      }
      
      static const struct net_device_ops my_netdev_ops = {
          .ndo_bpf      = my_xdp_setup,
          .ndo_xdp_xmit = my_xdp_xmit,
          /* ... */
      };

# ============================================================
# TOOLS AND ECOSYSTEM
# ============================================================
ecosystem:
  description: "BPF 工具生态"
  icon: "🛠️"

  tools:
    bpftool:
      description: "BPF 管理工具"
      commands:
        - "bpftool prog list"
        - "bpftool map show"
        - "bpftool feature probe"

    bpftrace:
      description: "高级跟踪语言"
      example: "bpftrace -e 'kprobe:vfs_read { @[comm] = count(); }'"

    libbpf:
      description: "BPF 用户空间库"
      features:
        - "CO-RE (Compile Once, Run Everywhere)"
        - "BTF 支持"
        - "BPF skeleton"

    bcc:
      description: "BPF Compiler Collection"
      language: "Python/C"
      use_case: "快速原型开发"

  frameworks:
    cilium:
      description: "Kubernetes 网络和安全"
      use_case: "容器网络策略"

    falco:
      description: "运行时安全"
      use_case: "异常检测"

    katran:
      description: "负载均衡器"
      use_case: "高性能 L4 LB"


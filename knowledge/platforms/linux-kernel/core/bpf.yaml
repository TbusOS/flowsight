      description: "创建 BPF map"
      
    BPF_MAP_LOOKUP_ELEM:
      description: "查找 map 元素"
      
    BPF_MAP_UPDATE_ELEM:
      description: "更新 map 元素"
      
    BPF_MAP_DELETE_ELEM:
      description: "删除 map 元素"
      
    BPF_MAP_GET_NEXT_KEY:
      description: "遍历 map"
      
    BPF_PROG_LOAD:
      description: "加载 BPF 程序"
      
    BPF_OBJ_PIN:
      description: "将对象固定到文件系统"
      
    BPF_OBJ_GET:
      description: "从文件系统获取对象"
      

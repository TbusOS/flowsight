# Linux Kernel BPF/eBPF Knowledge Base
#
# Reference: https://www.kernel.org/doc/html/latest/bpf/
# Reference: https://ebpf.io/
# Kernel source: kernel/bpf/, include/linux/bpf.h
# Kernel Version: 3.15+ (cBPF), 3.18+ (eBPF)
# ============================================================

# ============================================================
# BPF OVERVIEW
# ============================================================
bpf_overview:
  description: "Linux eBPF (Extended Berkeley Packet Filter)"
  header: "linux/bpf.h"
  icon: "🐝"
  kernel_version: "3.18+"
  
  purpose:
    - "内核可编程性"
    - "安全的内核扩展机制"
    - "高性能数据包处理"
    - "系统可观测性（跟踪、监控）"
    - "安全策略执行"

  key_concepts:
    program:
      description: "BPF 程序"
      notes: "在内核中安全运行的字节码"
    
    map:
      description: "BPF Map"
      notes: "内核与用户空间共享的数据结构"
    
    verifier:
      description: "BPF 验证器"
      notes: "确保程序安全性"
    
    helper:
      description: "BPF 辅助函数"
      notes: "程序可调用的内核函数"

# ============================================================
# BPF PROGRAM TYPES
# ============================================================
program_types:
  description: "BPF 程序类型"
  header: "include/uapi/linux/bpf.h"
  icon: "📋"

  types:
    BPF_PROG_TYPE_SOCKET_FILTER:
      description: "套接字过滤器"
      kernel_version: "3.18"
      attach_to: "socket"
      use_case: "数据包过滤、流量监控"

    BPF_PROG_TYPE_KPROBE:
      description: "内核探针"
      kernel_version: "4.1"
      attach_to: "kprobe/kretprobe"
      use_case: "内核函数跟踪"

    BPF_PROG_TYPE_TRACEPOINT:
      description: "跟踪点"
      kernel_version: "4.7"
      attach_to: "tracepoint"
      use_case: "静态内核跟踪点"

    BPF_PROG_TYPE_XDP:
      description: "XDP (eXpress Data Path)"
      kernel_version: "4.8"
      attach_to: "网络设备"
      use_case: "高性能数据包处理"
      actions:
        XDP_ABORTED: "错误，丢弃"
        XDP_DROP: "丢弃数据包"
        XDP_PASS: "传递到网络栈"
        XDP_TX: "从同一接口发送"
        XDP_REDIRECT: "重定向到其他接口"

    BPF_PROG_TYPE_PERF_EVENT:
      description: "性能事件"
      kernel_version: "4.9"
      attach_to: "perf_event"
      use_case: "性能监控"

    BPF_PROG_TYPE_CGROUP_SKB:
      description: "Cgroup 套接字缓冲区"
      kernel_version: "4.10"
      attach_to: "cgroup"
      use_case: "Cgroup 级网络策略"

    BPF_PROG_TYPE_SCHED_CLS:
      description: "流量分类器"
      kernel_version: "4.1"
      attach_to: "tc (traffic control)"
      use_case: "数据包分类、修改"

    BPF_PROG_TYPE_SCHED_ACT:
      description: "流量动作"
      kernel_version: "4.1"
      attach_to: "tc action"
      use_case: "数据包动作"

    BPF_PROG_TYPE_RAW_TRACEPOINT:
      description: "原始跟踪点"
      kernel_version: "4.17"
      attach_to: "raw_tracepoint"
      use_case: "低开销跟踪"

    BPF_PROG_TYPE_CGROUP_SOCK_ADDR:
      description: "Cgroup 套接字地址"
      kernel_version: "4.17"
      attach_to: "cgroup"
      use_case: "connect/bind 拦截"

    BPF_PROG_TYPE_LSM:
      description: "LSM (Linux Security Module)"
      kernel_version: "5.7"
      attach_to: "LSM 钩子"
      use_case: "安全策略"

    BPF_PROG_TYPE_STRUCT_OPS:
      description: "结构体操作"
      kernel_version: "5.3"
      attach_to: "内核结构体回调"
      use_case: "替换内核回调（如 TCP 拥塞控制）"

    BPF_PROG_TYPE_SYSCALL:
      description: "系统调用"
      kernel_version: "5.14"
      use_case: "从用户空间发起 BPF 操作"


  icon: "🗺️"

  types:
    BPF_MAP_TYPE_HASH:
      description: "哈希表"
      kernel_version: "3.18"
      use_case: "键值存储"

    BPF_MAP_TYPE_ARRAY:
      description: "数组"
      kernel_version: "3.18"
      use_case: "固定大小数组，键为索引"

    BPF_MAP_TYPE_PROG_ARRAY:
      description: "程序数组"
      kernel_version: "4.2"
      use_case: "尾调用"

    BPF_MAP_TYPE_PERF_EVENT_ARRAY:
      description: "性能事件数组"
      kernel_version: "4.3"
      use_case: "向用户空间发送事件"

    BPF_MAP_TYPE_PERCPU_HASH:
      description: "每 CPU 哈希表"
      kernel_version: "4.6"
      use_case: "无锁统计"

    BPF_MAP_TYPE_PERCPU_ARRAY:
      description: "每 CPU 数组"
      kernel_version: "4.6"
      use_case: "每 CPU 计数器"

    BPF_MAP_TYPE_STACK_TRACE:
      description: "堆栈跟踪"
      kernel_version: "4.6"

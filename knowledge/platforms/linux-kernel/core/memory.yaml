# ============================================================
# MEMORY MANAGEMENT EXAMPLES
# ============================================================

examples:
  - description: "内存分配示例"
    kernel_version: "4.0+"
    code: |
      #include <linux/slab.h>
      #include <linux/mm.h>
      #include <linux/vmalloc.h>

      static int my_init(void)
      {
          struct my_data *data;
          void *buffer;
          struct page *page;

          /* kmalloc 分配 - 小块连续物理内存 */
          data = kmalloc(sizeof(*data), GFP_KERNEL);
          if (!data)
              return -ENOMEM;

          /* kzalloc 零初始化分配 */
          buffer = kzalloc(1024, GFP_KERNEL);
          if (!buffer) {
              kfree(data);
              return -ENOMEM;
          }

          /* vmalloc 分配 - 大块虚拟连续内存 */
          void *vbuf = vmalloc(1024 * 1024);
          if (!vbuf) {
              kfree(buffer);
              kfree(data);
              return -ENOMEM;
          }

          /* 分配单个页框 */
          page = alloc_page(GFP_KERNEL);
          if (!page) {
              vfree(vbuf);
              kfree(buffer);
              kfree(data);
              return -ENOMEM;
          }

          /* 使用页 */
          void *page_addr = page_address(page);
          memset(page_addr, 0, PAGE_SIZE);

          /* 释放资源 */
          __free_page(page);
          vfree(vbuf);
          kfree(buffer);
          kfree(data);

          return 0;
      }

  - description: "SLAB 缓存示例"
    kernel_version: "2.6+"
    code: |
      #include <linux/slab.h>
      #include <linux/module.h>

      struct my_object {
          int id;
          char name[32];
          struct list_head list;
      };

      static struct kmem_cache *my_cache;

      static int __init my_cache_init(void)
      {
          /* 创建专用缓存 */
          my_cache = kmem_cache_create("my_object_cache",
                                       sizeof(struct my_object),
                                       0,  /* align */
                                       SLAB_HWCACHE_ALIGN | SLAB_PANIC,
                                       NULL);  /* constructor */
          if (!my_cache)
              return -ENOMEM;

          /* 从缓存分配 */
          struct my_object *obj = kmem_cache_alloc(my_cache, GFP_KERNEL);
          if (!obj)
              return -ENOMEM;

          obj->id = 1;
          strncpy(obj->name, "test", sizeof(obj->name));

          /* 释放回缓存 */
          kmem_cache_free(my_cache, obj);

          return 0;
      }

      static void __exit my_cache_exit(void)
      {
          /* 销毁缓存 */
          kmem_cache_destroy(my_cache);
      }

      module_init(my_cache_init);
      module_exit(my_cache_exit);

  - description: "页表操作示例"
    kernel_version: "4.0+"
    code: |
      #include <linux/mm.h>
      #include <linux/pgtable.h>
      #include <asm/pgtable.h>

      /* 遍历页表查找物理地址 */
      static unsigned long virt_to_phys_via_pagetable(
          struct mm_struct *mm, unsigned long vaddr)
      {
          pgd_t *pgd;
          p4d_t *p4d;
          pud_t *pud;
          pmd_t *pmd;
          pte_t *pte;

          /* 遍历 PGD */
          pgd = pgd_offset(mm, vaddr);
          if (pgd_none(*pgd) || pgd_bad(*pgd))
              return 0;

          /* 遍历 P4D (5级页表) */
          p4d = p4d_offset(pgd, vaddr);
          if (p4d_none(*p4d) || p4d_bad(*p4d))
              return 0;

          /* 遍历 PUD */
          pud = pud_offset(p4d, vaddr);
          if (pud_none(*pud) || pud_bad(*pud))
              return 0;

          /* 遍历 PMD */
          pmd = pmd_offset(pud, vaddr);
          if (pmd_none(*pmd) || pmd_bad(*pmd))
              return 0;

          /* 获取 PTE */
          pte = pte_offset_map(pmd, vaddr);
          if (!pte || pte_none(*pte)) {
              if (pte)
                  pte_unmap(pte);
              return 0;
          }

          /* 计算物理地址 */
          unsigned long phys = (pte_pfn(*pte) << PAGE_SHIFT) |
                               (vaddr & ~PAGE_MASK);
          pte_unmap(pte);

          return phys;
      }

  - description: "VMA 操作结构示例"
    kernel_version: "4.0+"
    code: |
      #include <linux/mm.h>
      #include <linux/fs.h>

      static vm_fault_t my_fault(struct vm_fault *vmf)
      {
          struct vm_area_struct *vma = vmf->vma;
          struct page *page;

          /* 分配新页 */
          page = alloc_page(GFP_KERNEL | __GFP_ZERO);
          if (!page)
              return VM_FAULT_OOM;

          /* 设置页 */
          vmf->page = page;
          get_page(page);

          return 0;
      }

      static void my_open(struct vm_area_struct *vma)
      {
          pr_info("VMA opened: %lx-%lx\n", vma->vm_start, vma->vm_end);
      }

      static void my_close(struct vm_area_struct *vma)
      {
          pr_info("VMA closed: %lx-%lx\n", vma->vm_start, vma->vm_end);
      }

      static const struct vm_operations_struct my_vm_ops = {
          .open   = my_open,
          .close  = my_close,
          .fault  = my_fault,
      };

      static int my_mmap(struct file *file, struct vm_area_struct *vma)
      {
          vma->vm_ops = &my_vm_ops;
          vma->vm_flags |= VM_DONTEXPAND | VM_DONTDUMP;
          my_open(vma);
          return 0;
      }

  - description: "页缓存操作示例"
    kernel_version: "4.0+"
    code: |
      #include <linux/fs.h>
      #include <linux/pagemap.h>
      #include <linux/writeback.h>

      static int my_readpage(struct file *file, struct page *page)
      {
          void *buf = kmap(page);

          /* 从设备/文件读取数据到 buf */
          memset(buf, 0, PAGE_SIZE);

          kunmap(page);

          SetPageUptodate(page);
          unlock_page(page);
          return 0;
      }

      static int my_writepage(struct page *page,
                              struct writeback_control *wbc)
      {
          void *buf = kmap(page);

          /* 将 buf 写入设备/文件 */

          kunmap(page);

          set_page_writeback(page);
          unlock_page(page);
          end_page_writeback(page);
          return 0;
      }

      static const struct address_space_operations my_aops = {
          .readpage   = my_readpage,
          .writepage  = my_writepage,
          .set_page_dirty = __set_page_dirty_nobuffers,
      };

  - description: "OOM 评分调整示例"
    kernel_version: "4.0+"
    code: |
      #include <linux/oom.h>

      /*
       * 调整进程的 OOM 分数
       * -1000: 禁用 OOM killer
       * 0: 默认
       * 1000: 优先被杀
       */
      static void adjust_oom_score(struct task_struct *task, int adj)
      {
          struct mm_struct *mm = task->mm;

          if (!mm)
              return;

          /* 范围检查 */
          if (adj < OOM_SCORE_ADJ_MIN)
              adj = OOM_SCORE_ADJ_MIN;
          else if (adj > OOM_SCORE_ADJ_MAX)
              adj = OOM_SCORE_ADJ_MAX;

          task->signal->oom_score_adj = adj;
      }

      /* 用户空间通过 /proc/PID/oom_score_adj 调整 */
      /* echo -1000 > /proc/PID/oom_score_adj  # 禁止 OOM 杀死此进程 */
      /* echo 1000 > /proc/PID/oom_score_adj   # 优先杀死此进程 */

  - description: "NUMA 感知分配示例"
    kernel_version: "4.0+"
    code: |
      #include <linux/mm.h>
      #include <linux/numa.h>
      #include <linux/slab.h>

      static int numa_aware_alloc(void)
      {
          int node;
          void *buf;
          struct page *page;

          /* 获取当前 CPU 的 NUMA 节点 */
          node = numa_node_id();
          pr_info("Current NUMA node: %d\n", node);

          /* 从指定节点分配内存 */
          buf = kmalloc_node(1024, GFP_KERNEL, node);
          if (!buf)
              return -ENOMEM;

          /* 从指定节点分配页 */
          page = alloc_pages_node(node, GFP_KERNEL, 0);
          if (!page) {
              kfree(buf);
              return -ENOMEM;
          }

          /* 遍历所有在线节点 */
          for_each_online_node(node) {
              pr_info("Node %d is online\n", node);
          }

          __free_page(page);
          kfree(buf);
          return 0;
      }

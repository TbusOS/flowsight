# Linux Security Module (LSM) Knowledge Base
# Reference: https://www.kernel.org/doc/html/latest/admin-guide/LSM/

# ============================================================
# LSM FRAMEWORK
# ============================================================

lsm_framework:
  description: "Linux Security Module Framework - 内核安全框架"
  header: "linux/lsm_hooks.h"
  icon: "🔒"
  kernel_version: "2.6+"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  registration:
    - pattern: 'DEFINE_LSM\s*\(\s*(?P<name>\w+)\s*\)'
      description: "定义 LSM 模块"
    - pattern: 'security_add_hooks\s*\(\s*(?P<hooks>\w+)\s*,\s*(?P<count>\w+)\s*,\s*"(?P<lsm>\w+)"\s*\)'
      description: "注册 LSM 钩子数组"
    - pattern: 'LSM_HOOK_INIT\s*\(\s*(?P<hook>\w+)\s*,\s*(?P<handler>\w+)\s*\)'
      description: "初始化单个 LSM 钩子"

  major_lsms:
    - name: "SELinux"
      config: "CONFIG_SECURITY_SELINUX"
      description: "强制访问控制 (MAC)"
      file: "security/selinux/"
    - name: "AppArmor"
      config: "CONFIG_SECURITY_APPARMOR"
      description: "路径名访问控制"
      file: "security/apparmor/"
    - name: "Smack"
      config: "CONFIG_SECURITY_SMACK"
      description: "简化的强制访问控制"
      file: "security/smack/"
    - name: "TOMOYO"
      config: "CONFIG_SECURITY_TOMOYO"
      description: "路径名访问控制"
      file: "security/tomoyo/"
    - name: "Yama"
      config: "CONFIG_SECURITY_YAMA"
      description: "ptrace 限制"
      file: "security/yama/"
    - name: "LoadPin"
      config: "CONFIG_SECURITY_LOADPIN"
      description: "限制内核模块加载源"
      file: "security/loadpin/"

  # ========================================
  # DATA STRUCTURES (数据结构)
  # ========================================
  data_structures:
    security_hook_list:
      pattern: 'struct security_hook_list\s*\{'
      description: "LSM 钩子列表项"
      file: "include/linux/lsm_hooks.h"
      fields:
        - name: "list"
          type: "struct hlist_node"
          description: "钩子链表节点"
        - name: "head"
          type: "struct hlist_head *"
          description: "钩子头指针"
        - name: "hook"
          type: "union security_list_options"
          description: "钩子函数联合体"
        - name: "lsm"
          type: "const char *"
          description: "LSM 名称"

    security_hook_heads:
      pattern: 'struct security_hook_heads\s*\{'
      description: "所有 LSM 钩子头集合"
      file: "include/linux/lsm_hooks.h"
      fields:
        - name: "binder_set_context_mgr"
          type: "struct hlist_head"
          description: "Binder 钩子"
        - name: "binder_transaction"
          type: "struct hlist_head"
          description: "Binder 事务钩子"
        - name: "ptrace_access_check"
          type: "struct hlist_head"
          description: "ptrace 访问检查"
        - name: "file_permission"
          type: "struct hlist_head"
          description: "文件权限检查"
        - name: "inode_permission"
          type: "struct hlist_head"
          description: "inode 权限检查"
        - name: "task_alloc"
          type: "struct hlist_head"
          description: "任务分配钩子"
        - name: "socket_create"
          type: "struct hlist_head"
          description: "socket 创建钩子"

    cred:
      pattern: 'struct cred\s*\{'
      description: "进程凭证结构"
      file: "include/linux/cred.h"
      fields:
        - name: "usage"
          type: "atomic_t"
          description: "引用计数"
        - name: "uid"
          type: "kuid_t"
          description: "真实用户 ID"
        - name: "gid"
          type: "kgid_t"
          description: "真实组 ID"
        - name: "euid"
          type: "kuid_t"
          description: "有效用户 ID"
        - name: "egid"
          type: "kgid_t"
          description: "有效组 ID"
        - name: "fsuid"
          type: "kuid_t"
          description: "文件系统用户 ID"
        - name: "fsgid"
          type: "kgid_t"
          description: "文件系统组 ID"
        - name: "cap_inheritable"
          type: "kernel_cap_t"
          description: "可继承能力集"
        - name: "cap_permitted"
          type: "kernel_cap_t"
          description: "允许能力集"
        - name: "cap_effective"
          type: "kernel_cap_t"
          description: "有效能力集"
        - name: "cap_bset"
          type: "kernel_cap_t"
          description: "能力边界集"
        - name: "cap_ambient"
          type: "kernel_cap_t"
          description: "环境能力集"
        - name: "security"
          type: "void *"
          description: "LSM 安全 blob"

    seccomp_filter:
      pattern: 'struct seccomp_filter\s*\{'
      description: "Seccomp BPF 过滤器"
      file: "kernel/seccomp.c"
      fields:
        - name: "refs"
          type: "refcount_t"
          description: "引用计数"
        - name: "users"
          type: "refcount_t"
          description: "用户计数"
        - name: "log"
          type: "bool"
          description: "是否记录日志"
        - name: "prev"
          type: "struct seccomp_filter *"
          description: "前一个过滤器"
        - name: "prog"
          type: "struct bpf_prog *"
          description: "BPF 程序"
        - name: "notif"
          type: "struct seccomp_notif_filter *"
          description: "通知过滤器"

    audit_context:
      pattern: 'struct audit_context\s*\{'
      description: "审计上下文"
      file: "kernel/audit.h"
      fields:
        - name: "dummy"
          type: "int"
          description: "是否为虚拟上下文"
        - name: "state"
          type: "enum audit_state"
          description: "审计状态"
        - name: "serial"
          type: "unsigned int"
          description: "审计序列号"
        - name: "major"
          type: "int"
          description: "系统调用号"
        - name: "ctime"
          type: "struct timespec64"
          description: "时间戳"
        - name: "arch"
          type: "int"
          description: "架构"
        - name: "return_code"
          type: "long"
          description: "返回值"
        - name: "prio"
          type: "int"
          description: "优先级"
        - name: "filterkey"
          type: "char *"
          description: "过滤器键"

    lsm_blob_sizes:
      pattern: 'struct lsm_blob_sizes\s*\{'
      description: "LSM blob 大小配置"
      file: "include/linux/lsm_hooks.h"
      fields:
        - name: "lbs_cred"
          type: "int"
          description: "凭证 blob 大小"
        - name: "lbs_file"
          type: "int"
          description: "文件 blob 大小"
        - name: "lbs_inode"
          type: "int"
          description: "inode blob 大小"
        - name: "lbs_ipc"
          type: "int"
          description: "IPC blob 大小"
        - name: "lbs_msg_msg"
          type: "int"
          description: "消息 blob 大小"
        - name: "lbs_task"
          type: "int"
          description: "任务 blob 大小"

  # ========================================
  # HELPER FUNCTIONS (辅助函数)
  # ========================================
  helper_functions:
    # 钩子调用辅助
    - pattern: 'call_int_hook\s*\(\s*(?P<hook>\w+)\s*,'
      variable_capture: "hook"
      description: "调用返回 int 的 LSM 钩子"
      context: "varies"

    - pattern: 'call_void_hook\s*\(\s*(?P<hook>\w+)\s*,'
      variable_capture: "hook"
      description: "调用返回 void 的 LSM 钩子"
      context: "varies"

    # 凭证辅助
    - pattern: 'current_cred\s*\(\s*\)'
      description: "获取当前进程凭证"
      return: "const struct cred *"
      context: "any"

    - pattern: 'current_security\s*\(\s*\)'
      description: "获取当前进程安全上下文"
      return: "void *"

    - pattern: 'prepare_creds\s*\(\s*\)'
      description: "准备新凭证"
      return: "struct cred *"
      context: "process"
      can_sleep: true

    - pattern: 'commit_creds\s*\(\s*(?P<cred>[^)]+)\s*\)'
      variable_capture: "cred"
      description: "提交新凭证"
      context: "process"

    - pattern: 'abort_creds\s*\(\s*(?P<cred>[^)]+)\s*\)'
      variable_capture: "cred"
      description: "放弃新凭证"
      context: "process"

    # 审计辅助
    - pattern: 'audit_context\s*\(\s*\)'
      description: "获取当前审计上下文"
      return: "struct audit_context *"

    - pattern: 'audit_getname\s*\(\s*(?P<name>[^)]+)\s*\)'
      variable_capture: "name"
      description: "获取审计名称"
      context: "process"

    - pattern: 'audit_log_name\s*\(\s*(?P<context>[^,]+)\s*,\s*(?P<n>[^)]+)\s*\)'
      variable_capture: "context"
      description: "记录审计名称"
      context: "process"

    # SELinux 辅助
    - pattern: 'selinux_is_enabled\s*\(\s*\)'
      description: "检查 SELinux 是否启用"
      return: "bool"

    - pattern: 'selinux_enabled_boot'
      description: "启动时是否启用 SELinux"

  # ========================================
  # FILE HOOKS (文件操作安全钩子)
  # ========================================
  file_hooks:
    security_file_permission:
      pattern: '\.file_permission\s*=\s*(?P<handler>\w+)'
      description: "文件访问权限检查"
      context: "process"
      can_sleep: true
      trigger: "read/write/ioctl 等文件操作"
      signature: "int (*)(struct file *file, int mask)"
      return_value:
        success: "0"
        failure: "-EACCES, -EPERM"
      typical_actions:
        - "检查文件访问权限"
        - "记录审计日志"
        - "SELinux 类型检查"

    security_file_open:
      pattern: '\.file_open\s*=\s*(?P<handler>\w+)'
      description: "文件打开权限检查"
      context: "process"
      can_sleep: true
      trigger: "open() 系统调用"
      signature: "int (*)(struct file *file)"
      return_value:
        success: "0"
        failure: "-EACCES, -EPERM"
      typical_actions:
        - "检查打开权限"
        - "分配安全上下文"
        - "检查 DAC 和 MAC"

    security_file_alloc:
      pattern: '\.file_alloc_security\s*=\s*(?P<handler>\w+)'
      description: "分配文件安全结构"
      context: "process"
      can_sleep: true
      trigger: "文件结构分配时"
      signature: "int (*)(struct file *file)"

    security_file_free:
      pattern: '\.file_free_security\s*=\s*(?P<handler>\w+)'
      description: "释放文件安全结构"
      context: "process"
      trigger: "文件结构释放时"
      signature: "void (*)(struct file *file)"

    security_file_mmap:
      pattern: '\.mmap_file\s*=\s*(?P<handler>\w+)'
      description: "内存映射权限检查"
      context: "process"
      can_sleep: true
      trigger: "mmap() 系统调用"
      signature: "int (*)(struct file *file, unsigned long reqprot, unsigned long prot, unsigned long flags)"
      return_value:
        success: "0"
        failure: "-EACCES, -EPERM"
      typical_actions:
        - "检查执行权限 (PROT_EXEC)"
        - "检查写权限 (PROT_WRITE)"
        - "W^X 策略检查"

    security_file_mprotect:
      pattern: '\.file_mprotect\s*=\s*(?P<handler>\w+)'
      description: "内存保护修改权限检查"
      context: "process"
      can_sleep: true
      trigger: "mprotect() 系统调用"
      signature: "int (*)(struct vm_area_struct *vma, unsigned long reqprot, unsigned long prot)"

    security_file_lock:
      pattern: '\.file_lock\s*=\s*(?P<handler>\w+)'
      description: "文件锁定权限检查"
      context: "process"
      trigger: "flock(), fcntl(F_SETLK)"
      signature: "int (*)(struct file *file, unsigned int cmd)"

    security_file_fcntl:
      pattern: '\.file_fcntl\s*=\s*(?P<handler>\w+)'
      description: "fcntl 操作权限检查"
      context: "process"
      trigger: "fcntl() 系统调用"
      signature: "int (*)(struct file *file, unsigned int cmd, unsigned long arg)"

    security_file_ioctl:
      pattern: '\.file_ioctl\s*=\s*(?P<handler>\w+)'
      description: "ioctl 操作权限检查"
      context: "process"
      trigger: "ioctl() 系统调用"
      signature: "int (*)(struct file *file, unsigned int cmd, unsigned long arg)"

    security_file_receive:
      pattern: '\.file_receive\s*=\s*(?P<handler>\w+)'
      description: "通过 SCM_RIGHTS 接收文件权限检查"
      context: "process"
      trigger: "recvmsg() with SCM_RIGHTS"
      signature: "int (*)(struct file *file)"

  # ========================================
  # INODE HOOKS (inode 操作安全钩子)
  # ========================================
  inode_hooks:
    security_inode_create:
      pattern: '\.inode_create\s*=\s*(?P<handler>\w+)'
      description: "创建文件权限检查"
      context: "process"
      can_sleep: true
      trigger: "create(), open(O_CREAT)"
      signature: "int (*)(struct inode *dir, struct dentry *dentry, umode_t mode)"
      return_value:
        success: "0"
        failure: "-EACCES, -EPERM"

    security_inode_link:
      pattern: '\.inode_link\s*=\s*(?P<handler>\w+)'
      description: "创建硬链接权限检查"
      context: "process"
      can_sleep: true
      trigger: "link() 系统调用"
      signature: "int (*)(struct dentry *old_dentry, struct inode *dir, struct dentry *new_dentry)"

    security_inode_unlink:
      pattern: '\.inode_unlink\s*=\s*(?P<handler>\w+)'
      description: "删除文件权限检查"
      context: "process"
      can_sleep: true
      trigger: "unlink() 系统调用"
      signature: "int (*)(struct inode *dir, struct dentry *dentry)"

    security_inode_symlink:
      pattern: '\.inode_symlink\s*=\s*(?P<handler>\w+)'
      description: "创建符号链接权限检查"
      context: "process"
      can_sleep: true
      trigger: "symlink() 系统调用"
      signature: "int (*)(struct inode *dir, struct dentry *dentry, const char *old_name)"

    security_inode_mkdir:
      pattern: '\.inode_mkdir\s*=\s*(?P<handler>\w+)'
      description: "创建目录权限检查"
      context: "process"
      can_sleep: true
      trigger: "mkdir() 系统调用"
      signature: "int (*)(struct inode *dir, struct dentry *dentry, umode_t mode)"

    security_inode_rmdir:
      pattern: '\.inode_rmdir\s*=\s*(?P<handler>\w+)'
      description: "删除目录权限检查"
      context: "process"
      can_sleep: true
      trigger: "rmdir() 系统调用"
      signature: "int (*)(struct inode *dir, struct dentry *dentry)"

    security_inode_mknod:
      pattern: '\.inode_mknod\s*=\s*(?P<handler>\w+)'
      description: "创建设备节点权限检查"
      context: "process"
      can_sleep: true
      trigger: "mknod() 系统调用"
      signature: "int (*)(struct inode *dir, struct dentry *dentry, umode_t mode, dev_t dev)"

    security_inode_rename:
      pattern: '\.inode_rename\s*=\s*(?P<handler>\w+)'
      description: "重命名文件权限检查"
      context: "process"
      can_sleep: true
      trigger: "rename() 系统调用"
      signature: "int (*)(struct inode *old_dir, struct dentry *old_dentry, struct inode *new_dir, struct dentry *new_dentry, unsigned int flags)"

    security_inode_readlink:
      pattern: '\.inode_readlink\s*=\s*(?P<handler>\w+)'
      description: "读取符号链接权限检查"
      context: "process"
      trigger: "readlink() 系统调用"
      signature: "int (*)(struct dentry *dentry)"

    security_inode_follow_link:
      pattern: '\.inode_follow_link\s*=\s*(?P<handler>\w+)'
      description: "跟随符号链接权限检查"
      context: "process"
      trigger: "路径解析时"
      signature: "int (*)(struct dentry *dentry, struct inode *inode, bool rcu)"

    security_inode_permission:
      pattern: '\.inode_permission\s*=\s*(?P<handler>\w+)'
      description: "inode 访问权限检查"
      context: "process or RCU"
      can_sleep: "depends on rcu flag"
      trigger: "任何 inode 访问"
      signature: "int (*)(struct inode *inode, int mask)"
      return_value:
        success: "0"
        failure: "-EACCES"
      typical_actions:
        - "MAC 权限检查"
        - "SELinux 类型强制"
        - "AppArmor 配置文件检查"

    security_inode_setattr:
      pattern: '\.inode_setattr\s*=\s*(?P<handler>\w+)'
      description: "修改 inode 属性权限检查"
      context: "process"
      can_sleep: true
      trigger: "chmod, chown, truncate 等"
      signature: "int (*)(struct dentry *dentry, struct iattr *attr)"

    security_inode_getattr:
      pattern: '\.inode_getattr\s*=\s*(?P<handler>\w+)'
      description: "获取 inode 属性权限检查"
      context: "process"
      trigger: "stat() 系统调用"
      signature: "int (*)(const struct path *path)"

    security_inode_setxattr:
      pattern: '\.inode_setxattr\s*=\s*(?P<handler>\w+)'
      description: "设置扩展属性权限检查"
      context: "process"
      can_sleep: true
      trigger: "setxattr() 系统调用"
      signature: "int (*)(struct dentry *dentry, const char *name, const void *value, size_t size, int flags)"

    security_inode_getxattr:
      pattern: '\.inode_getxattr\s*=\s*(?P<handler>\w+)'
      description: "获取扩展属性权限检查"
      context: "process"
      trigger: "getxattr() 系统调用"
      signature: "int (*)(struct dentry *dentry, const char *name)"

    security_inode_listxattr:
      pattern: '\.inode_listxattr\s*=\s*(?P<handler>\w+)'
      description: "列出扩展属性权限检查"
      context: "process"
      trigger: "listxattr() 系统调用"
      signature: "int (*)(struct dentry *dentry)"

    security_inode_removexattr:
      pattern: '\.inode_removexattr\s*=\s*(?P<handler>\w+)'
      description: "删除扩展属性权限检查"
      context: "process"
      can_sleep: true
      trigger: "removexattr() 系统调用"
      signature: "int (*)(struct dentry *dentry, const char *name)"

  # ========================================
  # TASK HOOKS (进程操作安全钩子)
  # ========================================
  task_hooks:
    security_task_alloc:
      pattern: '\.task_alloc\s*=\s*(?P<handler>\w+)'
      description: "进程创建安全检查"
      context: "process"
      can_sleep: true
      trigger: "fork()/clone()"
      signature: "int (*)(struct task_struct *task, unsigned long clone_flags)"
      return_value:
        success: "0"
        failure: "-ENOMEM, -EPERM"
      typical_actions:
        - "分配任务安全结构"
        - "继承父进程安全上下文"

    security_task_free:
      pattern: '\.task_free\s*=\s*(?P<handler>\w+)'
      description: "进程销毁清理"
      context: "process"
      trigger: "进程退出"
      signature: "void (*)(struct task_struct *task)"

    security_task_setuid:
      pattern: '\.task_fix_setuid\s*=\s*(?P<handler>\w+)'
      description: "setuid 操作安全检查"
      context: "process"
      trigger: "setuid/setreuid/setresuid"
      signature: "int (*)(struct cred *new, const struct cred *old, int flags)"
      return_value:
        success: "0"
        failure: "-EPERM"

    security_task_setgid:
      pattern: '\.task_fix_setgid\s*=\s*(?P<handler>\w+)'
      description: "setgid 操作安全检查"
      context: "process"
      trigger: "setgid/setregid/setresgid"
      signature: "int (*)(struct cred *new, const struct cred *old, int flags)"

    security_task_setpgid:
      pattern: '\.task_setpgid\s*=\s*(?P<handler>\w+)'
      description: "设置进程组 ID 权限检查"
      context: "process"
      trigger: "setpgid() 系统调用"
      signature: "int (*)(struct task_struct *p, pid_t pgid)"

    security_task_getpgid:
      pattern: '\.task_getpgid\s*=\s*(?P<handler>\w+)'
      description: "获取进程组 ID 权限检查"
      context: "process"
      trigger: "getpgid() 系统调用"
      signature: "int (*)(struct task_struct *p)"

    security_task_getsid:
      pattern: '\.task_getsid\s*=\s*(?P<handler>\w+)'
      description: "获取会话 ID 权限检查"
      context: "process"
      trigger: "getsid() 系统调用"
      signature: "int (*)(struct task_struct *p)"

    security_task_setnice:
      pattern: '\.task_setnice\s*=\s*(?P<handler>\w+)'
      description: "修改优先级权限检查"
      context: "process"
      trigger: "nice(), setpriority()"
      signature: "int (*)(struct task_struct *p, int nice)"
      return_value:
        success: "0"
        failure: "-EPERM"

    security_task_setioprio:
      pattern: '\.task_setioprio\s*=\s*(?P<handler>\w+)'
      description: "设置 I/O 优先级权限检查"
      context: "process"
      trigger: "ioprio_set() 系统调用"
      signature: "int (*)(struct task_struct *p, int ioprio)"

    security_task_getioprio:
      pattern: '\.task_getioprio\s*=\s*(?P<handler>\w+)'
      description: "获取 I/O 优先级权限检查"
      context: "process"
      trigger: "ioprio_get() 系统调用"
      signature: "int (*)(struct task_struct *p)"

    security_task_setscheduler:
      pattern: '\.task_setscheduler\s*=\s*(?P<handler>\w+)'
      description: "设置调度策略权限检查"
      context: "process"
      trigger: "sched_setscheduler()"
      signature: "int (*)(struct task_struct *p)"

    security_task_getscheduler:
      pattern: '\.task_getscheduler\s*=\s*(?P<handler>\w+)'
      description: "获取调度策略权限检查"
      context: "process"
      trigger: "sched_getscheduler()"
      signature: "int (*)(struct task_struct *p)"

    security_task_kill:
      pattern: '\.task_kill\s*=\s*(?P<handler>\w+)'
      description: "信号发送权限检查"
      context: "process"
      trigger: "kill(), tkill(), tgkill()"
      signature: "int (*)(struct task_struct *p, struct siginfo *info, int sig, const struct cred *cred)"
      return_value:
        success: "0"
        failure: "-EPERM"

    security_task_prctl:
      pattern: '\.task_prctl\s*=\s*(?P<handler>\w+)'
      description: "prctl 操作权限检查"
      context: "process"
      trigger: "prctl() 系统调用"
      signature: "int (*)(int option, unsigned long arg2, unsigned long arg3, unsigned long arg4, unsigned long arg5)"

    security_task_to_inode:
      pattern: '\.task_to_inode\s*=\s*(?P<handler>\w+)'
      description: "进程到 inode 映射"
      context: "process"
      trigger: "/proc/<pid>/ 访问"
      signature: "void (*)(struct task_struct *p, struct inode *inode)"

  # ========================================
  # SOCKET HOOKS (套接字安全钩子)
  # ========================================
  socket_hooks:
    security_socket_create:
      pattern: '\.socket_create\s*=\s*(?P<handler>\w+)'
      description: "套接字创建权限检查"
      context: "process"
      can_sleep: true
      trigger: "socket() 系统调用"
      signature: "int (*)(int family, int type, int protocol, int kern)"
      return_value:
        success: "0"
        failure: "-EACCES, -EPERM"
      typical_actions:
        - "检查网络访问权限"
        - "限制套接字类型"

    security_socket_post_create:
      pattern: '\.socket_post_create\s*=\s*(?P<handler>\w+)'
      description: "套接字创建后初始化"
      context: "process"
      can_sleep: true
      trigger: "socket() 成功后"
      signature: "int (*)(struct socket *sock, int family, int type, int protocol, int kern)"

    security_socket_bind:
      pattern: '\.socket_bind\s*=\s*(?P<handler>\w+)'
      description: "套接字绑定权限检查"
      context: "process"
      can_sleep: true
      trigger: "bind() 系统调用"
      signature: "int (*)(struct socket *sock, struct sockaddr *address, int addrlen)"
      return_value:
        success: "0"
        failure: "-EACCES"
      typical_actions:
        - "检查端口绑定权限"
        - "检查地址绑定权限"

    security_socket_connect:
      pattern: '\.socket_connect\s*=\s*(?P<handler>\w+)'
      description: "套接字连接权限检查"
      context: "process"
      can_sleep: true
      trigger: "connect() 系统调用"
      signature: "int (*)(struct socket *sock, struct sockaddr *address, int addrlen)"
      return_value:
        success: "0"
        failure: "-EACCES"

    security_socket_listen:
      pattern: '\.socket_listen\s*=\s*(?P<handler>\w+)'
      description: "套接字监听权限检查"
      context: "process"
      trigger: "listen() 系统调用"
      signature: "int (*)(struct socket *sock, int backlog)"

    security_socket_accept:
      pattern: '\.socket_accept\s*=\s*(?P<handler>\w+)'
      description: "接受连接权限检查"
      context: "process"
      can_sleep: true
      trigger: "accept() 系统调用"
      signature: "int (*)(struct socket *sock, struct socket *newsock)"

    security_socket_sendmsg:
      pattern: '\.socket_sendmsg\s*=\s*(?P<handler>\w+)'
      description: "发送消息权限检查"
      context: "process"
      trigger: "send/sendto/sendmsg"
      signature: "int (*)(struct socket *sock, struct msghdr *msg, int size)"

    security_socket_recvmsg:
      pattern: '\.socket_recvmsg\s*=\s*(?P<handler>\w+)'
      description: "接收消息权限检查"
      context: "process"
      trigger: "recv/recvfrom/recvmsg"
      signature: "int (*)(struct socket *sock, struct msghdr *msg, int size, int flags)"

    security_socket_getsockname:
      pattern: '\.socket_getsockname\s*=\s*(?P<handler>\w+)'
      description: "获取套接字名权限检查"
      context: "process"
      trigger: "getsockname() 系统调用"
      signature: "int (*)(struct socket *sock)"

    security_socket_getpeername:
      pattern: '\.socket_getpeername\s*=\s*(?P<handler>\w+)'
      description: "获取对端名权限检查"
      context: "process"
      trigger: "getpeername() 系统调用"
      signature: "int (*)(struct socket *sock)"

    security_socket_setsockopt:
      pattern: '\.socket_setsockopt\s*=\s*(?P<handler>\w+)'
      description: "设置套接字选项权限检查"
      context: "process"
      trigger: "setsockopt() 系统调用"
      signature: "int (*)(struct socket *sock, int level, int optname)"

    security_socket_getsockopt:
      pattern: '\.socket_getsockopt\s*=\s*(?P<handler>\w+)'
      description: "获取套接字选项权限检查"
      context: "process"
      trigger: "getsockopt() 系统调用"
      signature: "int (*)(struct socket *sock, int level, int optname)"

    security_socket_shutdown:
      pattern: '\.socket_shutdown\s*=\s*(?P<handler>\w+)'
      description: "关闭套接字权限检查"
      context: "process"
      trigger: "shutdown() 系统调用"
      signature: "int (*)(struct socket *sock, int how)"

  # ========================================
  # CALL CHAINS (调用链)
  # ========================================
  call_chains:
    file_open:
      description: "文件打开 LSM 调用链"
      trigger: "open() 系统调用"
      chain:
        - function: "sys_open / sys_openat"
          file: "fs/open.c"
          description: "系统调用入口"
        - function: "do_sys_open"
          file: "fs/open.c"
          description: "打开处理"
        - function: "do_filp_open"
          file: "fs/namei.c"
          description: "路径解析和打开"
        - function: "path_openat"
          file: "fs/namei.c"
          description: "路径打开"
        - function: "do_open"
          file: "fs/namei.c"
          description: "执行打开"
        - function: "security_file_open"
          file: "security/security.c"
          description: "LSM 钩子调用点"
        - function: "call_int_hook(file_open, ...)"
          file: "security/security.c"
          description: "遍历所有 LSM"
        - function: "selinux_file_open"
          file: "security/selinux/hooks.c"
          description: "SELinux 检查"
          is_user_entry: true

    inode_permission:
      description: "inode 权限检查调用链"
      trigger: "任何文件访问"
      chain:
        - function: "vfs_xxx"
          file: "fs/*.c"
          description: "VFS 操作入口"
        - function: "inode_permission"
          file: "fs/namei.c"
          description: "权限检查入口"
        - function: "security_inode_permission"
          file: "security/security.c"
          description: "LSM 钩子"
        - function: "selinux_inode_permission"
          file: "security/selinux/hooks.c"
          description: "SELinux 类型强制检查"
          is_user_entry: true

    socket_create:
      description: "套接字创建 LSM 调用链"
      trigger: "socket() 系统调用"
      chain:
        - function: "sys_socket"
          file: "net/socket.c"
          description: "系统调用入口"
        - function: "__sys_socket"
          file: "net/socket.c"
          description: "内部处理"
        - function: "sock_create"
          file: "net/socket.c"
          description: "创建套接字"
        - function: "__sock_create"
          file: "net/socket.c"
          description: "内部创建"
        - function: "security_socket_create"
          file: "security/security.c"
          description: "LSM 钩子"
        - function: "selinux_socket_create"
          file: "security/selinux/hooks.c"
          description: "SELinux 网络检查"
          is_user_entry: true

    task_kill:
      description: "信号发送 LSM 调用链"
      trigger: "kill() 系统调用"
      chain:
        - function: "sys_kill"
          file: "kernel/signal.c"
          description: "系统调用入口"
        - function: "kill_something_info"
          file: "kernel/signal.c"
          description: "信号分发"
        - function: "group_send_sig_info"
          file: "kernel/signal.c"
          description: "组信号发送"
        - function: "check_kill_permission"
          file: "kernel/signal.c"
          description: "权限检查"
        - function: "security_task_kill"
          file: "security/security.c"
          description: "LSM 钩子"
        - function: "selinux_task_kill"
          file: "security/selinux/hooks.c"
          description: "SELinux 信号检查"
          is_user_entry: true

  examples:
    - description: "LSM 模块注册示例"
      kernel_version: "4.2+"
      code: |
        #include <linux/lsm_hooks.h>
        
        static int my_file_open(struct file *file)
        {
            /* 检查文件打开权限 */
            if (should_deny_access(file))
                return -EACCES;
            return 0;
        }
        
        static int my_inode_permission(struct inode *inode, int mask)
        {
            /* 检查 inode 访问权限 */
            return 0;
        }
        
        static struct security_hook_list my_hooks[] __lsm_ro_after_init = {
            LSM_HOOK_INIT(file_open, my_file_open),
            LSM_HOOK_INIT(inode_permission, my_inode_permission),
        };
        
        static int __init my_lsm_init(void)
        {
            security_add_hooks(my_hooks, ARRAY_SIZE(my_hooks), "mylsm");
            return 0;
        }
        
        DEFINE_LSM(mylsm) = {
            .name = "mylsm",
            .init = my_lsm_init,
        };


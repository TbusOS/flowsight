    process:
      - name: "fork"
        description: "创建子进程"
      - name: "transition"
        description: "域转换"
      - name: "sigchld"
        description: "SIGCHLD 信号"
      - name: "sigkill"
        description: "SIGKILL 信号"
      - name: "signal"

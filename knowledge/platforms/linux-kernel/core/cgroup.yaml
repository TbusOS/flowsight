# ============================================================
# CGROUP EXAMPLES
# ============================================================

examples:
  - description: "创建和配置 cgroup v2"
    kernel_version: "4.5+"
    code: |
      #!/bin/bash
      # 挂载 cgroup v2 (如果尚未挂载)
      mount -t cgroup2 none /sys/fs/cgroup
      
      # 创建 cgroup
      mkdir /sys/fs/cgroup/mygroup
      
      # 启用控制器
      echo "+cpu +memory +io" > /sys/fs/cgroup/cgroup.subtree_control
      
      # 配置 CPU 限制 (50% CPU)
      echo "50000 100000" > /sys/fs/cgroup/mygroup/cpu.max
      
      # 配置内存限制 (1GB)
      echo "1073741824" > /sys/fs/cgroup/mygroup/memory.max
      
      # 配置内存软限制
      echo "536870912" > /sys/fs/cgroup/mygroup/memory.high
      
      # 移动进程到 cgroup
      echo $$ > /sys/fs/cgroup/mygroup/cgroup.procs
      
      # 查看统计
      cat /sys/fs/cgroup/mygroup/cpu.stat
      cat /sys/fs/cgroup/mygroup/memory.current

  - description: "IO 限速配置"
    kernel_version: "4.10+"
    code: |
      #!/bin/bash
      # 找到设备主次号 (例如 /dev/sda)
      MAJOR_MINOR=$(stat -c '%t:%T' /dev/sda)
      # 或者使用 lsblk -o NAME,MAJ:MIN
      
      # 限制读写带宽为 10MB/s
      echo "8:0 rbps=10485760 wbps=10485760" > \
        /sys/fs/cgroup/mygroup/io.max
      
      # 限制 IOPS
      echo "8:0 riops=100 wiops=100" >> \
        /sys/fs/cgroup/mygroup/io.max
      
      # 设置 IO 权重
      echo "8:0 200" > /sys/fs/cgroup/mygroup/io.weight
      
      # 查看 IO 统计
      cat /sys/fs/cgroup/mygroup/io.stat

  - description: "PSI 触发器监控"
    kernel_version: "4.20+"
    code: |
      #include <stdio.h>
      #include <fcntl.h>
      #include <poll.h>
      #include <unistd.h>
      #include <string.h>
      
      int main() {
          int fd;
          struct pollfd fds;
          
          /* 打开 PSI 文件 */
          fd = open("/proc/pressure/memory", O_RDWR | O_NONBLOCK);
          if (fd < 0) {
              perror("open");
              return 1;
          }
          
          /* 设置触发器: 1秒窗口内 some 超过 50ms */
          const char *trigger = "some 50000 1000000";
          if (write(fd, trigger, strlen(trigger)) < 0) {
              perror("write trigger");
              return 1;
          }
          
          printf("Monitoring memory pressure...\n");
          
          fds.fd = fd;
          fds.events = POLLPRI;
          
          while (1) {
              int ret = poll(&fds, 1, -1);
              if (ret > 0) {
                  if (fds.revents & POLLPRI) {
                      char buf[256];
                      lseek(fd, 0, SEEK_SET);
                      read(fd, buf, sizeof(buf));
                      printf("Memory pressure triggered!\n%s", buf);
                  }
              }
          }
          
          close(fd);
          return 0;
      }

  - description: "cgroup 子系统实现示例"
    kernel_version: "4.0+"
    code: |
      #include <linux/cgroup.h>
      #include <linux/slab.h>
      
      struct my_cgroup {
          struct cgroup_subsys_state css;
          unsigned long my_counter;
          spinlock_t lock;
      };
      
      static inline struct my_cgroup *css_to_mycg(struct cgroup_subsys_state *css)
      {
          return container_of(css, struct my_cgroup, css);
      }
      
      static struct cgroup_subsys_state *
      my_css_alloc(struct cgroup_subsys_state *parent_css)
      {
          struct my_cgroup *mycg;
          
          mycg = kzalloc(sizeof(*mycg), GFP_KERNEL);
          if (!mycg)
              return ERR_PTR(-ENOMEM);
          
          spin_lock_init(&mycg->lock);
          
          /* 从父继承设置 */
          if (parent_css) {
              struct my_cgroup *parent = css_to_mycg(parent_css);
              mycg->my_counter = parent->my_counter;
          }
          
          return &mycg->css;
      }
      
      static int my_css_online(struct cgroup_subsys_state *css)
      {
          struct my_cgroup *mycg = css_to_mycg(css);
          /* 控制器上线时的初始化 */
          pr_info("my_cgroup: online\n");
          return 0;
      }
      
      static void my_css_offline(struct cgroup_subsys_state *css)
      {
          struct my_cgroup *mycg = css_to_mycg(css);
          /* 控制器下线时的清理 */
          pr_info("my_cgroup: offline\n");
      }
      
      static void my_css_free(struct cgroup_subsys_state *css)
      {
          struct my_cgroup *mycg = css_to_mycg(css);
          kfree(mycg);
      }
      
      static void my_attach(struct cgroup_taskset *tset)
      {
          struct task_struct *task;
          struct cgroup_subsys_state *css;
          
          cgroup_taskset_for_each(task, css, tset) {
              struct my_cgroup *mycg = css_to_mycg(css);
              pr_info("my_cgroup: attaching task %d\n", task->pid);
          }
      }
      
      struct cgroup_subsys my_cgrp_subsys = {
          .css_alloc    = my_css_alloc,
          .css_online   = my_css_online,
          .css_offline  = my_css_offline,
          .css_free     = my_css_free,
          .attach       = my_attach,
          .name         = "my",
      };

  - description: "冻结和解冻 cgroup"
    kernel_version: "5.2+"
    code: |
      #!/bin/bash
      CGROUP="/sys/fs/cgroup/mygroup"
      
      # 创建 cgroup 并移动进程
      mkdir -p $CGROUP
      echo $$ > $CGROUP/cgroup.procs
      
      # 启动后台任务
      sleep 1000 &
      SLEEP_PID=$!
      echo $SLEEP_PID > $CGROUP/cgroup.procs
      
      # 冻结 cgroup
      echo 1 > $CGROUP/cgroup.freeze
      
      # 检查状态
      cat $CGROUP/cgroup.events
      # frozen 1
      
      # 验证进程被冻结
      ps -p $SLEEP_PID -o pid,stat
      # 状态显示 T (stopped)
      
      # 解冻 cgroup
      echo 0 > $CGROUP/cgroup.freeze
      
      # 清理
      kill $SLEEP_PID
      rmdir $CGROUP

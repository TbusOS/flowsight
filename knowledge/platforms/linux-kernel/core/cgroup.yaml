# ============================================================
# FREEZER
# ============================================================

freezer:
  description: "Cgroup Freezer (v2 集成)"
  header: "kernel/cgroup/cgroup.c"
  icon: "❄️"
  kernel_version: "5.2+ (v2 集成)"
  source_file: "kernel/cgroup/cgroup.c"
  notes: "v2 中 freezer 集成到核心，不是独立控制器"

  context:
    type: "process"
    can_sleep: true

  interface_file:
    name: "cgroup.freeze"
    description: "冻结/解冻 cgroup"
    access: "read-write"

  states:
    - value: 0
      description: "运行中 (THAWED)"
    - value: 1
      description: "冻结 (FROZEN)"

  events:
    file: "cgroup.events"
    frozen:
      description: "cgroup 是否完全冻结"
      values: ["0 - 未冻结", "1 - 完全冻结"]

  mechanism:
    description: "冻结机制"
    steps:
      - "设置 cgroup.freeze = 1"
      - "向所有任务发送 SIGSTOP"
      - "任务进入 TASK_FROZEN 状态"
      - "等待所有任务停止"
    unfreeze_steps:
      - "设置 cgroup.freeze = 0"
      - "向所有任务发送 SIGCONT"
      - "任务恢复执行"

  kernel_functions:
    - pattern: 'cgroup_freeze\s*\(\s*(?P<cgrp>[^,]+)\s*,'
      description: "冻结 cgroup"
      file: "kernel/cgroup/cgroup.c"
    - pattern: 'cgroup_do_freeze\s*\('
      description: "执行冻结"
      file: "kernel/cgroup/cgroup.c"
    - pattern: 'cgroup_freeze_task\s*\('
      description: "冻结单个任务"
      file: "kernel/cgroup/cgroup.c"
    - pattern: 'cgroup_freezer_migrate_task\s*\('
      description: "迁移冻结任务"
      file: "kernel/cgroup/cgroup.c"
    - pattern: 'cgroup_freezing\s*\('
      description: "检查 cgroup 是否正在冻结"
      file: "include/linux/cgroup.h"
    - pattern: 'cgroup_enter_frozen\s*\('
      description: "任务进入冻结状态"
      file: "kernel/cgroup/cgroup.c"
    - pattern: 'cgroup_leave_frozen\s*\('
      description: "任务离开冻结状态"
      file: "kernel/cgroup/cgroup.c"

  use_cases:
    - "容器暂停/恢复"
    - "检查点/恢复 (CRIU)"
    - "系统挂起/休眠"
    - "调试和分析"

  call_chains:
    freeze_chain:
      description: "冻结调用链"
      trigger: "echo 1 > cgroup.freeze"
      chain:
        - function: "cgroup_freeze_write"
          file: "kernel/cgroup/cgroup.c"
          description: "写入处理"
        - function: "cgroup_freeze"
          file: "kernel/cgroup/cgroup.c"
          description: "设置冻结标志"
        - function: "cgroup_do_freeze"
          file: "kernel/cgroup/cgroup.c"
          description: "遍历并冻结任务"
        - function: "cgroup_freeze_task"
          file: "kernel/cgroup/cgroup.c"
          description: "冻结单个任务"
        - function: "signal_wake_up"
          file: "kernel/signal.c"
          description: "唤醒任务处理信号"
        - function: "cgroup_enter_frozen"
          file: "kernel/cgroup/cgroup.c"
          description: "任务进入冻结"

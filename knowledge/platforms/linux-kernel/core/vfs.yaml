# ============================================================
# VFS EXAMPLES
# ============================================================

examples:
  - description: "简单字符设备文件操作"
    kernel_version: "2.6+"
    code: |
      static int my_open(struct inode *inode, struct file *file) {
          struct my_device *dev;
          dev = container_of(inode->i_cdev, struct my_device, cdev);
          file->private_data = dev;
          return 0;
      }

      static ssize_t my_read(struct file *file, char __user *buf,
                             size_t count, loff_t *ppos) {
          struct my_device *dev = file->private_data;
          if (copy_to_user(buf, dev->buffer, dev->size))
              return -EFAULT;
          return dev->size;
      }

      static ssize_t my_write(struct file *file, const char __user *buf,
                              size_t count, loff_t *ppos) {
          struct my_device *dev = file->private_data;
          if (copy_from_user(dev->buffer, buf, count))
              return -EFAULT;
          return count;
      }

      static const struct file_operations my_fops = {
          .owner = THIS_MODULE,
          .open = my_open,
          .release = my_release,
          .read = my_read,
          .write = my_write,
      };

  - description: "address_space_operations 完整示例"
    kernel_version: "5.0+"
    code: |
      /* 读取单个页面 */
      static int myfs_readpage(struct file *file, struct page *page)
      {
          struct inode *inode = page->mapping->host;
          loff_t offset = page_offset(page);
          void *page_addr;
          int ret;

          page_addr = kmap_atomic(page);
          
          /* 从存储读取数据 */
          ret = myfs_read_block(inode, offset, PAGE_SIZE, page_addr);
          
          kunmap_atomic(page_addr);
          
          if (ret == 0) {
              SetPageUptodate(page);
          } else {
              SetPageError(page);
          }
          unlock_page(page);
          return ret;
      }

      /* 写回单个页面 */
      static int myfs_writepage(struct page *page,
                                struct writeback_control *wbc)
      {
          struct inode *inode = page->mapping->host;
          loff_t offset = page_offset(page);
          void *page_addr;
          int ret;

          set_page_writeback(page);
          
          page_addr = kmap_atomic(page);
          ret = myfs_write_block(inode, offset, PAGE_SIZE, page_addr);
          kunmap_atomic(page_addr);
          
          end_page_writeback(page);
          unlock_page(page);
          
          return ret;
      }

      /* 写入开始 - 准备页面 */
      static int myfs_write_begin(struct file *file,
                                  struct address_space *mapping,
                                  loff_t pos, unsigned len,
                                  unsigned flags, struct page **pagep,
                                  void **fsdata)
      {
          struct page *page;
          pgoff_t index = pos >> PAGE_SHIFT;

          page = grab_cache_page_write_begin(mapping, index, flags);
          if (!page)
              return -ENOMEM;
          
          /* 如果页面不完整且是部分写入，需要先读取 */
          if (!PageUptodate(page) && (pos & ~PAGE_MASK || len < PAGE_SIZE)) {
              int ret = myfs_readpage(file, page);
              if (ret) {
                  unlock_page(page);
                  put_page(page);
                  return ret;
              }
              lock_page(page);
          }
          
          *pagep = page;
          return 0;
      }

      /* 写入结束 - 提交修改 */
      static int myfs_write_end(struct file *file,
                                struct address_space *mapping,
                                loff_t pos, unsigned len, unsigned copied,
                                struct page *page, void *fsdata)
      {
          struct inode *inode = mapping->host;
          loff_t new_size = pos + copied;
          
          if (!PageUptodate(page)) {
              if (copied < len) {
                  copied = 0;
                  goto out;
              }
              SetPageUptodate(page);
          }
          
          if (new_size > inode->i_size)
              i_size_write(inode, new_size);
          
          set_page_dirty(page);
          
      out:
          unlock_page(page);
          put_page(page);
          return copied;
      }

      /* 直接 I/O */
      static ssize_t myfs_direct_IO(struct kiocb *iocb,
                                    struct iov_iter *iter)
      {
          struct inode *inode = file_inode(iocb->ki_filp);
          
          /* 使用通用块设备直接 I/O */
          return blockdev_direct_IO(iocb, inode, iter, myfs_get_block);
      }

      static const struct address_space_operations myfs_aops = {
          .readpage       = myfs_readpage,
          .writepage      = myfs_writepage,
          .write_begin    = myfs_write_begin,
          .write_end      = myfs_write_end,
          .direct_IO      = myfs_direct_IO,
          .set_page_dirty = __set_page_dirty_buffers,
      };

  - description: "文件锁 (flock/POSIX) 示例"
    kernel_version: "2.6+"
    code: |
      /* 文件系统可以实现自己的锁操作 */
      static int myfs_lock(struct file *file, int cmd,
                           struct file_lock *fl)
      {
          struct inode *inode = file_inode(file);
          
          /* 对于网络文件系统，可能需要发送锁请求到服务器 */
          if (fl->fl_flags & FL_POSIX) {
              /* POSIX 记录锁 */
              return posix_lock_file(file, fl, NULL);
          } else if (fl->fl_flags & FL_FLOCK) {
              /* BSD flock */
              return flock_lock_inode_wait(inode, fl);
          }
          
          return -ENOLCK;
      }

      /* 用户空间使用 flock */
      /* int flock(int fd, int operation); */
      /* operation: LOCK_SH (共享), LOCK_EX (独占), LOCK_UN (解锁) */
      
      /* 用户空间使用 fcntl 记录锁 */
      /* struct flock fl = {
       *     .l_type = F_WRLCK,    // F_RDLCK, F_WRLCK, F_UNLCK
       *     .l_whence = SEEK_SET,
       *     .l_start = 0,
       *     .l_len = 100,         // 0 表示到文件末尾
       * };
       * fcntl(fd, F_SETLKW, &fl); // F_SETLK 非阻塞, F_SETLKW 阻塞
       */

  - description: "bio 构建和提交示例"
    kernel_version: "4.0+"
    code: |
      static int submit_page_bio(struct block_device *bdev,
                                 struct page *page, sector_t sector,
                                 int op, int op_flags)
      {
          struct bio *bio;
          int ret;
          
          /* 分配 bio，1 个向量 */
          bio = bio_alloc(GFP_NOIO, 1);
          if (!bio)
              return -ENOMEM;
          
          /* 设置目标设备 */
          bio_set_dev(bio, bdev);
          
          /* 设置起始扇区 */
          bio->bi_iter.bi_sector = sector;
          
          /* 设置操作类型 */
          bio->bi_opf = op | op_flags;
          
          /* 添加页面 */
          if (bio_add_page(bio, page, PAGE_SIZE, 0) != PAGE_SIZE) {
              bio_put(bio);
              return -EIO;
          }
          
          /* 同步提交并等待 */
          ret = submit_bio_wait(bio);
          
          bio_put(bio);
          return ret;
      }
      
      /* 异步提交示例 */
      static void my_bio_endio(struct bio *bio)
      {
          struct my_io_context *ctx = bio->bi_private;
          
          if (bio->bi_status)
              ctx->error = blk_status_to_errno(bio->bi_status);
          
          complete(&ctx->done);
          bio_put(bio);
      }
      
      static int submit_async_bio(struct block_device *bdev,
                                  struct page *page, sector_t sector)
      {
          struct my_io_context ctx;
          struct bio *bio;
          
          init_completion(&ctx.done);
          ctx.error = 0;
          
          bio = bio_alloc(GFP_NOIO, 1);
          bio_set_dev(bio, bdev);
          bio->bi_iter.bi_sector = sector;
          bio->bi_opf = REQ_OP_READ;
          bio_add_page(bio, page, PAGE_SIZE, 0);
          
          /* 设置完成回调 */
          bio->bi_end_io = my_bio_endio;
          bio->bi_private = &ctx;
          
          /* 异步提交 */
          submit_bio(bio);
          
          /* 等待完成 */
          wait_for_completion(&ctx.done);
          
          return ctx.error;
      }

  - description: "页缓存操作示例"
    kernel_version: "4.0+"
    code: |
      /* 查找页面 */
      static struct page *my_find_page(struct address_space *mapping,
                                       pgoff_t index)
      {
          struct page *page;
          
          /* 查找但不创建 */
          page = find_get_page(mapping, index);
          if (page) {
              /* 找到了，page 引用计数已增加 */
              return page;
          }
          
          /* 查找或创建 */
          page = find_or_create_page(mapping, index,
                                     mapping_gfp_mask(mapping));
          if (page) {
              /* 页面已锁定，使用后需要解锁 */
              if (!PageUptodate(page)) {
                  /* 需要读取页面内容 */
              }
              unlock_page(page);
          }
          
          return page;
      }
      
      /* 截断文件 */
      static void my_truncate(struct inode *inode, loff_t newsize)
      {
          /* 截断页缓存 */
          truncate_pagecache(inode, newsize);
          
          /* 或者截断到指定偏移 */
          truncate_inode_pages(inode->i_mapping, newsize);
          
          /* 使页面无效 (用于网络文件系统) */
          invalidate_mapping_pages(inode->i_mapping, 0, -1);
      }
      
      /* 添加页面到缓存 */
      static int my_add_page(struct address_space *mapping,
                             struct page *page, pgoff_t index)
      {
          int ret;
          
          /* 添加到页缓存和 LRU */
          ret = add_to_page_cache_lru(page, mapping, index, GFP_KERNEL);
          if (ret)
              return ret;
          
          /* 页面现在在缓存中 */
          return 0;
      }

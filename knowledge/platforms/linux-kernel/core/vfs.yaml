        - "返回页面指针"

    write_end:
      pattern: '\.write_end\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "写入结束，提交修改"
      trigger: "generic_file_write_iter 完成数据拷贝后"

# ============================================================
# SUPERBLOCK OPERATIONS
# ============================================================

superblock_operations:
  description: "Super Operations - 超级块操作"
  header: "linux/fs.h"
  icon: "💿"
  kernel_version: "2.6+"

  context:
    type: "varies"
    can_sleep: "depends on operation"

  bind_patterns:
    # struct super_operations (带 const)
    - pattern: 'static const struct super_operations\s+(?P<name>\w+)\s*=\s*\{'
      variable_capture: "name"
      description: "超级块操作结构定义 (const)"

    # struct super_operations (不带 const)
    - pattern: 'static struct super_operations\s+(?P<name>\w+)\s*=\s*\{'
      variable_capture: "name"
      description: "超级块操作结构定义"

  callbacks:
    # === inode 分配/释放 ===
    alloc_inode:
      pattern: '\.alloc_inode\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "分配文件系统特定 inode 结构"
      context: "process"
      can_sleep: true
      signature: "struct inode *(*)(struct super_block *)"
      return_value:
        success: "inode 指针"
        failure: "NULL"
      typical_actions:
        - "分配包含 struct inode 的私有结构"
        - "使用 kmem_cache_alloc()"
        - "调用 inode_init_once() (如果使用 slab)"

    destroy_inode:
      pattern: '\.destroy_inode\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "销毁 inode (清理私有数据)"
      context: "process"
      can_sleep: true
      signature: "void (*)(struct inode *)"
      typical_actions:
        - "清理私有数据"
        - "不释放内存 (由 free_inode 负责)"

    free_inode:
      pattern: '\.free_inode\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "释放 inode 内存 (RCU 回调)"
      context: "softirq"
      can_sleep: false
      signature: "void (*)(struct inode *)"
      typical_actions:
        - "调用 kmem_cache_free()"
        - "在 RCU 宽限期后执行"

    # === inode 状态管理 ===
    dirty_inode:
      pattern: '\.dirty_inode\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "标记 inode 为脏"
      context: "process/atomic"
      can_sleep: "depends on flags"
      signature: "void (*)(struct inode *, int flags)"
      flags:
        - "I_DIRTY_SYNC - 元数据脏"
        - "I_DIRTY_DATASYNC - 数据脏"
        - "I_DIRTY_PAGES - 页面脏"
      typical_actions:
        - "标记 inode 需要写回"
        - "更新日志 (日志文件系统)"

    write_inode:
      pattern: '\.write_inode\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "将 inode 写入存储"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct inode *, struct writeback_control *)"
      return_value:
        success: "0"
        failure: "负数错误码"
      typical_actions:
        - "构建磁盘 inode 结构"
        - "提交 I/O"
        - "等待写入完成 (如果 WBC_SYNC_ALL)"

    drop_inode:
      pattern: '\.drop_inode\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "决定是否丢弃 inode"
      context: "atomic"
      can_sleep: false
      signature: "int (*)(struct inode *)"
      return_value:
        success: "1 (丢弃)"
        failure: "0 (保留在缓存)"
      typical_actions:
        - "检查 nlink"
        - "检查是否需要删除"
        - "通常返回 generic_drop_inode()"

    evict_inode:
      pattern: '\.evict_inode\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "驱逐 inode (删除时)"
      context: "process"
      can_sleep: true
      signature: "void (*)(struct inode *)"
      typical_actions:
        - "截断页缓存"
        - "清除私有数据"
        - "如果 nlink=0，删除磁盘 inode"
        - "调用 clear_inode()"

    # === 超级块操作 ===
    put_super:
      pattern: '\.put_super\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "卸载时释放超级块"
      context: "process"
      can_sleep: true
      signature: "void (*)(struct super_block *)"
      typical_actions:
        - "释放私有数据"
        - "释放缓冲区"

    sync_fs:
      pattern: '\.sync_fs\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "同步文件系统"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct super_block *, int wait)"
      return_value:
        success: "0"
        failure: "负数错误码"
      typical_actions:
        - "刷新日志"
        - "写回超级块"
        - "如果 wait=1，等待完成"

    freeze_fs:
      pattern: '\.freeze_fs\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "冻结文件系统 (快照前)"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct super_block *)"
      return_value:
        success: "0"
        failure: "负数错误码"
      typical_actions:
        - "刷新所有数据"
        - "完成日志"
        - "阻止新的写入"

    unfreeze_fs:
      pattern: '\.unfreeze_fs\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "解冻文件系统"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct super_block *)"
      return_value:
        success: "0"
        failure: "负数错误码"
      typical_actions:
        - "恢复日志"
        - "允许新的写入"

    statfs:
      pattern: '\.statfs\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "获取文件系统统计信息 (df)"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct dentry *, struct kstatfs *)"
      return_value:
        success: "0"
        failure: "负数错误码"
      typical_actions:
        - "填充 kstatfs 结构"
        - "返回块数、inode 数等"

    remount_fs:
      pattern: '\.remount_fs\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "重新挂载文件系统 (旧 API)"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct super_block *, int *flags, char *data)"
      return_value:
        success: "0"
        failure: "负数错误码"
      deprecated: "使用 fc->ops->reconfigure 替代"

    umount_begin:
      pattern: '\.umount_begin\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "卸载开始 (强制卸载)"
      context: "process"
      can_sleep: true
      signature: "void (*)(struct super_block *)"
      typical_actions:
        - "中断正在进行的操作"
        - "唤醒等待的进程"
        - "标记为卸载中"

    show_options:
      pattern: '\.show_options\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "显示挂载选项 (/proc/mounts)"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct seq_file *, struct dentry *)"
      return_value:
        success: "0"
        failure: "负数错误码"
      typical_actions:
        - "使用 seq_printf() 输出选项"
        - "显示非默认选项"

    show_devname:
      pattern: '\.show_devname\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "显示设备名 (/proc/mounts)"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct seq_file *, struct dentry *)"

    show_path:
      pattern: '\.show_path\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "显示挂载路径"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct seq_file *, struct dentry *)"

    show_stats:
      pattern: '\.show_stats\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "显示统计信息"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct seq_file *, struct dentry *)"

    # === 配额操作 ===
    quota_read:
      pattern: '\.quota_read\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "读取配额数据"
      context: "process"
      can_sleep: true

    quota_write:
      pattern: '\.quota_write\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "写入配额数据"
      context: "process"
      can_sleep: true

    get_dquots:
      pattern: '\.get_dquots\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "获取配额结构"
      context: "process"
      can_sleep: true

    # === 已废弃 ===
    write_super:
      pattern: '\.write_super\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "写超级块 (已废弃)"
      deprecated: true

    clear_inode:
      pattern: '\.clear_inode\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "清除 inode (已废弃, 使用 evict_inode)"
      deprecated: true


# ============================================================
# ADDRESS SPACE OPERATIONS (核心!)
# ============================================================

address_space_operations:
  description: "Address Space Operations - 地址空间操作 (页缓存核心接口)"
  header: "linux/fs.h"
  icon: "📄"
  kernel_version: "2.6+"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  bind_patterns:
    # struct address_space_operations 定义
    - pattern: 'static const struct address_space_operations\s+(?P<name>\w+)\s*=\s*\{'
      variable_capture: "name"
      description: "地址空间操作结构定义"

  structure:
    name: "address_space_operations"
    description: "页缓存操作的核心回调集合"
    fields:
      - name: "readpage"
        type: "int (*)(struct file *, struct page *)"
        description: "读取单个页面 (旧 API)"
      - name: "read_folio"
        type: "int (*)(struct file *, struct folio *)"
        description: "读取单个 folio (新 API, 5.18+)"
      - name: "writepage"
        type: "int (*)(struct page *, struct writeback_control *)"
        description: "写回单个页面"
      - name: "writepages"
        type: "int (*)(struct address_space *, struct writeback_control *)"
        description: "批量写回页面"
      - name: "set_page_dirty"
        type: "int (*)(struct page *)"
        description: "标记页面为脏"
      - name: "readpages"
        type: "int (*)(struct file *, struct address_space *, struct list_head *, unsigned)"
        description: "预读多个页面 (旧 API)"
      - name: "readahead"
        type: "void (*)(struct readahead_control *)"
        description: "预读多个页面 (新 API, 5.8+)"
      - name: "write_begin"
        type: "int (*)(struct file *, struct address_space *, loff_t, unsigned, unsigned, struct page **, void **)"
        description: "写入开始，准备页面"
      - name: "write_end"
        type: "int (*)(struct file *, struct address_space *, loff_t, unsigned, unsigned, struct page *, void *)"
        description: "写入结束，提交修改"
      - name: "bmap"
        type: "sector_t (*)(struct address_space *, sector_t)"
        description: "逻辑块到物理块映射 (FIBMAP)"
      - name: "invalidatepage"
        type: "void (*)(struct page *, unsigned int, unsigned int)"
        description: "使页面部分或全部无效 (旧 API)"
      - name: "invalidate_folio"
        type: "void (*)(struct folio *, size_t, size_t)"
        description: "使 folio 部分或全部无效 (新 API)"
      - name: "releasepage"
        type: "int (*)(struct page *, gfp_t)"
        description: "尝试释放页面私有数据 (旧 API)"
      - name: "release_folio"
        type: "bool (*)(struct folio *, gfp_t)"
        description: "尝试释放 folio 私有数据 (新 API)"
      - name: "freepage"
        type: "void (*)(struct page *)"
        description: "页面即将被释放时回调"
      - name: "direct_IO"
        type: "ssize_t (*)(struct kiocb *, struct iov_iter *)"
        description: "直接 I/O，绕过页缓存"
      - name: "migratepage"
        type: "int (*)(struct address_space *, struct page *, struct page *, enum migrate_mode)"
        description: "页面迁移回调"
      - name: "isolate_page"
        type: "bool (*)(struct page *, isolate_mode_t)"
        description: "隔离页面用于迁移"
      - name: "putback_page"
        type: "void (*)(struct page *)"
        description: "放回隔离失败的页面"
      - name: "launder_page"
        type: "int (*)(struct page *)"
        description: "清洗脏页面 (用于截断)"
      - name: "is_partially_uptodate"
        type: "int (*)(struct page *, unsigned long, unsigned long)"
        description: "检查页面部分是否最新"
      - name: "is_dirty_writeback"
        type: "void (*)(struct page *, bool *, bool *)"
        description: "检查页面是否正在写回"
      - name: "error_remove_page"
        type: "int (*)(struct address_space *, struct page *)"
        description: "移除出错的页面"
      - name: "swap_activate"
        type: "int (*)(struct swap_info_struct *, struct file *, sector_t *)"
        description: "激活交换文件"
      - name: "swap_deactivate"
        type: "void (*)(struct file *)"
        description: "停用交换文件"

  callbacks:
    readpage:
      pattern: '\.readpage\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "读取单个页面到页缓存"
      trigger: "页面缺失时触发"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct file *, struct page *)"
      return_value:
        success: "0"
        failure: "负数错误码"
      typical_actions:
        - "分配 buffer_head"
        - "设置 bio 并提交 I/O"
        - "设置页面 Uptodate 标志"

    read_folio:
      pattern: '\.read_folio\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "读取单个 folio (新 API)"
      trigger: "页面缺失时触发 (5.18+)"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct file *, struct folio *)"

    writepage:
      pattern: '\.writepage\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "写回单个脏页面到存储"
      trigger: "内存回收或 sync 时触发"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct page *, struct writeback_control *)"
      return_value:
        success: "0"
        failure: "-EIO"
      typical_actions:
        - "检查页面是否为脏"
        - "构建 bio 并提交 I/O"
        - "清除页面 Dirty 标志"

    writepages:
      pattern: '\.writepages\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "批量写回脏页面 (更高效)"
      trigger: "sync 或内存压力时触发"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct address_space *, struct writeback_control *)"

    set_page_dirty:
      pattern: '\.set_page_dirty\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "标记页面为脏"
      trigger: "页面内容被修改时"
      context: "process"
      can_sleep: false
      signature: "int (*)(struct page *)"

    readpages:
      pattern: '\.readpages\s*=\s*(?P<handler>\w+)'

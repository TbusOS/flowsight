      trigger: "预读逻辑触发"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct file *, struct address_space *, struct list_head *, unsigned)"

    readahead:
      pattern: '\.readahead\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "批量预读页面 (新 API)"
      trigger: "预读逻辑触发 (5.8+)"
      context: "process"
      can_sleep: true
      signature: "void (*)(struct readahead_control *)"

    write_begin:
      pattern: '\.write_begin\s*=\s*(?P<handler>\w+)'

# Linux Kernel Virtual File System (VFS) Knowledge Base
#
# Reference: https://www.kernel.org/doc/html/latest/filesystems/vfs.html

# ============================================================
# VFS SUPERBLOCK
# ============================================================

vfs_superblock:
  description: "VFS Superblock - 虚拟文件系统超级块"
  header: "linux/fs.h"
  icon: "📁"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  bind_patterns:
    # alloc_super - 分配超级块
    - pattern: 'alloc_super\s*\(\s*(?P<sb>[^)]+)\s*,\s*(?P<flags>\w+)\s*\)'
      variable_capture: "sb"
      description: "分配超级块"

    # deactivate_locked_super - 停用超级块
    - pattern: 'deactivate_locked_super\s*\(\s*(?P<sb>[^)]+)\s*\)'
      variable_capture: "sb"
      description: "停用超级块"

    # deactivate_super - 停用超级块
    - pattern: 'deactivate_super\s*\(\s*(?P<sb>[^)]+)\s*\)'
      variable_capture: "sb"
      description: "停用超级块"

    # get_active_super - 获取活动超级块
    - pattern: 'get_active_super\s*\(\s*(?P<dev>[^)]+)\s*\)'
      variable_capture: "dev"
      description: "获取活动超级块"


# ============================================================
# VFS INODE
# ============================================================

vfs_inode:
  description: "VFS Inode - 虚拟文件系统索引节点"
  header: "linux/fs.h"
  icon: "📄"
  kernel_version: "2.6+"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  bind_patterns:
    # === inode 获取函数 ===
    # iget_locked - 获取或创建 inode (最常用)
    - pattern: 'iget_locked\s*\(\s*(?P<sb>[^,]+)\s*,\s*(?P<ino>[^)]+)\s*\)'
      variable_capture: "sb"
      description: "获取或创建 inode (通过 ino)"
      context: "process"
      can_sleep: true
      return_value: "inode 指针，如果是新建则带 I_NEW 标志"
      typical_usage: |
        inode = iget_locked(sb, ino);
        if (inode && (inode->i_state & I_NEW)) {
            /* 填充新 inode */
            unlock_new_inode(inode);
        }

    # iget5_locked - 获取 inode (带回调)
    - pattern: 'iget5_locked\s*\(\s*(?P<sb>[^,]+)\s*,\s*(?P<hashval>[^,]+)\s*,\s*(?P<test>[^,]+)\s*,\s*(?P<set>[^,]+)\s*,\s*(?P<data>[^)]+)\s*\)'
      variable_capture: "sb"
      description: "获取 inode (带 test/set 回调)"
      context: "process"
      can_sleep: true

    # ilookup - 查找 inode (仅缓存)
    - pattern: 'ilookup\s*\(\s*(?P<sb>[^,]+)\s*,\s*(?P<ino>[^)]+)\s*\)'
      variable_capture: "sb"
      description: "在缓存中查找 inode (不创建)"
      context: "process"
      can_sleep: true

    # ilookup5 - 查找 inode (带回调)
    - pattern: 'ilookup5\s*\(\s*(?P<sb>[^,]+)\s*,\s*(?P<hashval>[^,]+)\s*,\s*(?P<test>[^,]+)\s*,\s*(?P<data>[^)]+)\s*\)'
      variable_capture: "sb"
      description: "在缓存中查找 inode (带 test 回调)"
      context: "process"
      can_sleep: true

    # === inode 创建函数 ===
    # new_inode - 分配新 inode
    - pattern: 'new_inode\s*\(\s*(?P<sb>[^)]+)\s*\)'
      variable_capture: "sb"
      description: "分配新 inode (伪文件系统用)"
      context: "process"
      can_sleep: true
      return_value: "新 inode 或 NULL"

    # new_inode_pseudo - 分配伪 inode
    - pattern: 'new_inode_pseudo\s*\(\s*(?P<sb>[^)]+)\s*\)'
      variable_capture: "sb"
      description: "分配伪 inode (不加入全局列表)"
      context: "process"
      can_sleep: true

    # inode_init_owner - 初始化所有者
    - pattern: 'inode_init_owner\s*\(\s*(?P<mnt_userns>[^,]+)\s*,\s*(?P<inode>[^,]+)\s*,\s*(?P<dir>[^,]+)\s*,\s*(?P<mode>[^)]+)\s*\)'
      variable_capture: "inode"
      description: "初始化 inode 所有者 (uid/gid/mode)"
      context: "process"
      can_sleep: false

    # === inode 引用计数 ===
    # iput - 释放 inode 引用
    - pattern: 'iput\s*\(\s*(?P<inode>[^)]+)\s*\)'
      variable_capture: "inode"
      description: "释放 inode 引用 (可能触发删除)"
      context: "process"
      can_sleep: true
      typical_usage: "每个 iget/igrab 必须配对 iput"

    # ihold - 增加 inode 引用
    - pattern: 'ihold\s*\(\s*(?P<inode>[^)]+)\s*\)'
      variable_capture: "inode"
      description: "增加 inode 引用计数"
      context: "process/atomic"
      can_sleep: false

    # igrab - 尝试获取 inode 引用
    - pattern: 'igrab\s*\(\s*(?P<inode>[^)]+)\s*\)'
      variable_capture: "inode"
      description: "尝试增加引用 (检查 I_FREEING)"
      context: "process/atomic"
      can_sleep: false
      return_value: "inode 或 NULL (如果正在释放)"

    # === inode 插入/解锁 ===
    # insert_inode_locked - 插入新 inode
    - pattern: 'insert_inode_locked\s*\(\s*(?P<inode>[^)]+)\s*\)'
      variable_capture: "inode"
      description: "插入新 inode 到哈希表"
      context: "process"
      can_sleep: true
      return_value: "0 成功, -EBUSY 已存在"

    # insert_inode_locked4 - 插入 inode (带回调)
    - pattern: 'insert_inode_locked4\s*\(\s*(?P<inode>[^,]+)\s*,\s*(?P<hashval>[^,]+)\s*,\s*(?P<test>[^,]+)\s*,\s*(?P<data>[^)]+)\s*\)'
      variable_capture: "inode"
      description: "插入 inode (带 test 回调)"
      context: "process"
      can_sleep: true

    # unlock_new_inode - 解锁新 inode
    - pattern: 'unlock_new_inode\s*\(\s*(?P<inode>[^)]+)\s*\)'
      variable_capture: "inode"
      description: "解锁新创建的 inode (清除 I_NEW)"
      context: "process"
      can_sleep: true

    # discard_new_inode - 丢弃新 inode
    - pattern: 'discard_new_inode\s*\(\s*(?P<inode>[^)]+)\s*\)'
      variable_capture: "inode"
      description: "丢弃初始化失败的 inode"
      context: "process"
      can_sleep: true

    # === inode 属性操作 ===
    # iunique - 获取唯一 inode 号
    - pattern: 'iunique\s*\(\s*(?P<sb>[^,]+)\s*,\s*(?P<max_ino>[^)]+)\s*\)'
      variable_capture: "sb"
      description: "获取唯一 inode 号"
      context: "process"
      can_sleep: false

    # inc_nlink - 增加链接计数
    - pattern: 'inc_nlink\s*\(\s*(?P<inode>[^)]+)\s*\)'
      variable_capture: "inode"
      description: "增加 inode 链接计数"
      context: "process"
      can_sleep: false

    # drop_nlink - 减少链接计数
    - pattern: 'drop_nlink\s*\(\s*(?P<inode>[^)]+)\s*\)'
      variable_capture: "inode"
      description: "减少 inode 链接计数"
      context: "process"
      can_sleep: false

    # clear_nlink - 清除链接计数
    - pattern: 'clear_nlink\s*\(\s*(?P<inode>[^)]+)\s*\)'
      variable_capture: "inode"
      description: "将 nlink 设为 0"
      context: "process"
      can_sleep: false

    # set_nlink - 设置链接计数
    - pattern: 'set_nlink\s*\(\s*(?P<inode>[^,]+)\s*,\s*(?P<nlink>[^)]+)\s*\)'
      variable_capture: "inode"
      description: "设置 inode 链接计数"
      context: "process"
      can_sleep: false

    # === inode 时间戳 ===
    # inode_set_ctime_current - 设置 ctime
    - pattern: 'inode_set_ctime_current\s*\(\s*(?P<inode>[^)]+)\s*\)'
      variable_capture: "inode"
      description: "设置 ctime 为当前时间"
      context: "process"
      can_sleep: false

    # inode_set_mtime_to_ts - 设置 mtime
    - pattern: 'inode_set_mtime_to_ts\s*\(\s*(?P<inode>[^,]+)\s*,'
      variable_capture: "inode"
      description: "设置 mtime"
      context: "process"
      can_sleep: false

    # === inode 锁 ===
    # inode_lock - 获取 inode 互斥锁
    - pattern: 'inode_lock\s*\(\s*(?P<inode>[^)]+)\s*\)'
      variable_capture: "inode"
      description: "获取 inode i_mutex"
      context: "process"
      can_sleep: true

    # inode_unlock - 释放 inode 互斥锁
    - pattern: 'inode_unlock\s*\(\s*(?P<inode>[^)]+)\s*\)'
      variable_capture: "inode"
      description: "释放 inode i_mutex"
      context: "process"
      can_sleep: false

    # inode_lock_shared - 共享锁
    - pattern: 'inode_lock_shared\s*\(\s*(?P<inode>[^)]+)\s*\)'
      variable_capture: "inode"
      description: "获取 inode 共享锁"
      context: "process"
      can_sleep: true

    # inode_unlock_shared - 释放共享锁
    - pattern: 'inode_unlock_shared\s*\(\s*(?P<inode>[^)]+)\s*\)'
      variable_capture: "inode"
      description: "释放 inode 共享锁"
      context: "process"
      can_sleep: false

    # === inode 脏标记 ===
    # mark_inode_dirty - 标记为脏
    - pattern: 'mark_inode_dirty\s*\(\s*(?P<inode>[^)]+)\s*\)'
      variable_capture: "inode"
      description: "标记 inode 为脏"
      context: "process"
      can_sleep: true

    # mark_inode_dirty_sync - 标记元数据脏
    - pattern: 'mark_inode_dirty_sync\s*\(\s*(?P<inode>[^)]+)\s*\)'
      variable_capture: "inode"
      description: "标记 inode 元数据脏"
      context: "process"
      can_sleep: true

    # __mark_inode_dirty - 带标志标记脏
    - pattern: '__mark_inode_dirty\s*\(\s*(?P<inode>[^,]+)\s*,\s*(?P<flags>[^)]+)\s*\)'
      variable_capture: "inode"
      description: "标记 inode 脏 (带标志)"
      context: "process"
      can_sleep: true

  helper_functions:
    # 常用辅助函数
    - pattern: 'inode_init_once\s*\([^)]*\)'
      description: "初始化 slab 中的 inode (构造函数)"
      context: "process"
      can_sleep: false

    - pattern: 'is_bad_inode\s*\([^)]*\)'
      description: "检查是否为坏 inode"
      context: "any"
      can_sleep: false

    - pattern: 'make_bad_inode\s*\([^)]*\)'
      description: "将 inode 标记为坏"
      context: "process"
      can_sleep: true

    - pattern: 'i_size_read\s*\([^)]*\)'
      description: "原子读取 inode 大小"
      context: "any"
      can_sleep: false

    - pattern: 'i_size_write\s*\([^)]*\)'
      description: "原子写入 inode 大小"
      context: "any"
      can_sleep: false

    - pattern: 'inode_needs_sync\s*\([^)]*\)'
      description: "检查是否需要同步"
      context: "any"
      can_sleep: false


# ============================================================
# VFS DENTRY
# ============================================================

vfs_dentry:
  description: "VFS Dentry - 虚拟文件系统目录项"
  header: "linux/dcache.h"
  icon: "📂"
  kernel_version: "2.6+"

  context:
    type: "varies"
    can_sleep: "depends on operation"

  bind_patterns:
    # === dentry 分配 ===
    # d_alloc - 分配目录项
    - pattern: 'd_alloc\s*\(\s*(?P<parent>[^,]+)\s*,\s*(?P<name>[^)]+)\s*\)'
      variable_capture: "parent"
      description: "分配新目录项"
      context: "process"
      can_sleep: true

    # d_alloc_anon - 分配匿名目录项
    - pattern: 'd_alloc_anon\s*\(\s*(?P<sb>[^)]+)\s*\)'
      variable_capture: "sb"
      description: "分配匿名目录项 (无父)"
      context: "process"
      can_sleep: true

    # d_alloc_pseudo - 分配伪目录项
    - pattern: 'd_alloc_pseudo\s*\(\s*(?P<sb>[^,]+)\s*,\s*(?P<name>[^)]+)\s*\)'
      variable_capture: "sb"
      description: "分配伪目录项 (伪文件系统)"
      context: "process"
      can_sleep: true

    # d_alloc_parallel - 并行分配
    - pattern: 'd_alloc_parallel\s*\(\s*(?P<parent>[^,]+)\s*,\s*(?P<name>[^,]+)\s*,\s*(?P<wq>[^)]+)\s*\)'
      variable_capture: "parent"
      description: "分配目录项 (支持并行查找)"
      context: "process"
      can_sleep: true

    # === dentry 实例化 ===
    # d_instantiate - 绑定 inode
    - pattern: 'd_instantiate\s*\(\s*(?P<dentry>[^,]+)\s*,\s*(?P<inode>[^)]+)\s*\)'
      variable_capture: "dentry"
      description: "将 dentry 绑定到 inode"
      context: "process"
      can_sleep: false

    # d_instantiate_new - 绑定新 inode
    - pattern: 'd_instantiate_new\s*\(\s*(?P<dentry>[^,]+)\s*,\s*(?P<inode>[^)]+)\s*\)'
      variable_capture: "dentry"
      description: "绑定新创建的 inode (解锁 I_NEW)"
      context: "process"
      can_sleep: true

    # d_add - 添加到哈希表并绑定
    - pattern: 'd_add\s*\(\s*(?P<dentry>[^,]+)\s*,\s*(?P<inode>[^)]+)\s*\)'
      variable_capture: "dentry"
      description: "d_instantiate + d_rehash"
      context: "process"
      can_sleep: false

    # d_splice_alias - 绑定或别名
    - pattern: 'd_splice_alias\s*\(\s*(?P<inode>[^,]+)\s*,\s*(?P<dentry>[^)]+)\s*\)'
      variable_capture: "dentry"
      description: "绑定或返回别名 dentry"
      context: "process"
      can_sleep: true
      return_value: "dentry 或 ERR_PTR()"

    # d_make_root - 创建根目录项
    - pattern: 'd_make_root\s*\(\s*(?P<inode>[^)]+)\s*\)'
      variable_capture: "inode"
      description: "创建根 dentry (超级块初始化)"
      context: "process"
      can_sleep: true
      return_value: "根 dentry 或 NULL"

    # === dentry 查找 ===
    # d_lookup - 查找子目录项
    - pattern: 'd_lookup\s*\(\s*(?P<parent>[^,]+)\s*,\s*(?P<name>[^)]+)\s*\)'
      variable_capture: "parent"
      description: "在缓存中查找子 dentry"
      context: "process/rcu"
      can_sleep: false
      return_value: "dentry 或 NULL"

    # d_hash_and_lookup - 哈希并查找
    - pattern: 'd_hash_and_lookup\s*\(\s*(?P<dir>[^,]+)\s*,\s*(?P<name>[^)]+)\s*\)'
      variable_capture: "dir"
      description: "计算哈希并查找 dentry"
      context: "process"
      can_sleep: false

    # __d_lookup - 内部查找
    - pattern: '__d_lookup\s*\(\s*(?P<parent>[^,]+)\s*,\s*(?P<name>[^)]+)\s*\)'
      variable_capture: "parent"
      description: "内部 dentry 查找 (需持锁)"
      context: "atomic"
      can_sleep: false

    # __d_lookup_rcu - RCU 查找
    - pattern: '__d_lookup_rcu\s*\(\s*(?P<parent>[^,]+)\s*,\s*(?P<name>[^,]+)\s*,\s*(?P<seqp>[^)]+)\s*\)'
      variable_capture: "parent"
      description: "RCU 模式查找 dentry"
      context: "rcu"
      can_sleep: false

    # === dentry 引用计数 ===
    # dget - 增加引用
    - pattern: 'dget\s*\(\s*(?P<dentry>[^)]+)\s*\)'
      variable_capture: "dentry"
      description: "增加 dentry 引用计数"
      context: "process/atomic"
      can_sleep: false

    # dget_dlock - 增加引用 (持锁)
    - pattern: 'dget_dlock\s*\(\s*(?P<dentry>[^)]+)\s*\)'
      variable_capture: "dentry"
      description: "增加引用 (已持 d_lock)"
      context: "atomic"
      can_sleep: false

    # dput - 释放引用
    - pattern: 'dput\s*\(\s*(?P<dentry>[^)]+)\s*\)'
      variable_capture: "dentry"
      description: "释放 dentry 引用"
      context: "process"
      can_sleep: true

    # === dentry 状态管理 ===
    # d_drop - 从哈希表移除
    - pattern: 'd_drop\s*\(\s*(?P<dentry>[^)]+)\s*\)'
      variable_capture: "dentry"
      description: "从哈希表移除 (变为负)"
      context: "process"
      can_sleep: false

    # d_rehash - 重新加入哈希表
    - pattern: 'd_rehash\s*\(\s*(?P<dentry>[^)]+)\s*\)'
      variable_capture: "dentry"
      description: "重新加入哈希表"
      context: "process"
      can_sleep: false

    # d_delete - 标记删除
    - pattern: 'd_delete\s*\(\s*(?P<dentry>[^)]+)\s*\)'
      variable_capture: "dentry"
      description: "标记 dentry 为应该删除"
      context: "process"
      can_sleep: false

    # d_invalidate - 使无效
    - pattern: 'd_invalidate\s*\(\s*(?P<dentry>[^)]+)\s*\)'
      variable_capture: "dentry"
      description: "使 dentry 无效 (断开子树)"
      context: "process"
      can_sleep: true

    # d_prune_aliases - 清理别名
    - pattern: 'd_prune_aliases\s*\(\s*(?P<inode>[^)]+)\s*\)'
      variable_capture: "inode"
      description: "清理 inode 的别名 dentry"
      context: "process"
      can_sleep: true

    # === dentry 路径操作 ===
    # d_path - 获取完整路径
    - pattern: 'd_path\s*\(\s*(?P<path>[^,]+)\s*,\s*(?P<buf>[^,]+)\s*,\s*(?P<buflen>[^)]+)\s*\)'
      variable_capture: "path"
      description: "获取 dentry 的完整路径字符串"
      context: "process"
      can_sleep: true
      return_value: "路径字符串指针"

    # dentry_path_raw - 获取原始路径
    - pattern: 'dentry_path_raw\s*\(\s*(?P<dentry>[^,]+)\s*,\s*(?P<buf>[^,]+)\s*,\s*(?P<buflen>[^)]+)\s*\)'
      variable_capture: "dentry"
      description: "获取原始路径 (不解析挂载点)"
      context: "process"
      can_sleep: true

    # === dentry 移动/重命名 ===
    # d_move - 移动 dentry
    - pattern: 'd_move\s*\(\s*(?P<dentry>[^,]+)\s*,\s*(?P<target>[^)]+)\s*\)'
      variable_capture: "dentry"
      description: "原子移动 dentry"
      context: "process"
      can_sleep: false

    # d_exchange - 交换两个 dentry
    - pattern: 'd_exchange\s*\(\s*(?P<dentry1>[^,]+)\s*,\s*(?P<dentry2>[^)]+)\s*\)'
      variable_capture: "dentry1"
      description: "交换两个 dentry 的位置"
      context: "process"
      can_sleep: false

    # === dentry 祖先操作 ===
    # d_ancestor - 检查祖先
    - pattern: 'd_ancestor\s*\(\s*(?P<p1>[^,]+)\s*,\s*(?P<p2>[^)]+)\s*\)'
      variable_capture: "p1"
      description: "检查 p1 是否是 p2 的祖先"
      context: "any"
      can_sleep: false
      return_value: "祖先 dentry 或 NULL"

    # is_subdir - 检查子目录
    - pattern: 'is_subdir\s*\(\s*(?P<child>[^,]+)\s*,\s*(?P<parent>[^)]+)\s*\)'
      variable_capture: "child"
      description: "检查 child 是否在 parent 下"
      context: "process"
      can_sleep: false
      return_value: "true 或 false"

    # === dentry inode 访问 ===
    # d_inode - 获取 inode
    - pattern: 'd_inode\s*\(\s*(?P<dentry>[^)]+)\s*\)'
      variable_capture: "dentry"
      description: "获取 dentry 的 inode"
      context: "any"
      can_sleep: false
      return_value: "inode 或 NULL"

    # d_inode_rcu - RCU 获取 inode
    - pattern: 'd_inode_rcu\s*\(\s*(?P<dentry>[^)]+)\s*\)'
      variable_capture: "dentry"
      description: "RCU 模式获取 inode"
      context: "rcu"
      can_sleep: false

    # d_backing_inode - 获取后端 inode
    - pattern: 'd_backing_inode\s*\(\s*(?P<dentry>[^)]+)\s*\)'
      variable_capture: "dentry"
      description: "获取后端 inode (overlayfs)"
      context: "any"
      can_sleep: false

  helper_functions:
    - pattern: 'd_is_positive\s*\([^)]*\)'
      description: "检查 dentry 是否有关联 inode"
      context: "any"
      can_sleep: false

    - pattern: 'd_is_negative\s*\([^)]*\)'
      description: "检查 dentry 是否为负 (无 inode)"
      context: "any"
      can_sleep: false

    - pattern: 'd_is_dir\s*\([^)]*\)'
      description: "检查是否为目录"
      context: "any"
      can_sleep: false

    - pattern: 'd_is_symlink\s*\([^)]*\)'
      description: "检查是否为符号链接"
      context: "any"
      can_sleep: false

    - pattern: 'd_is_reg\s*\([^)]*\)'
      description: "检查是否为普通文件"
      context: "any"
      can_sleep: false

    - pattern: 'd_unhashed\s*\([^)]*\)'
      description: "检查 dentry 是否不在哈希表中"
      context: "any"
      can_sleep: false

    - pattern: 'd_mountpoint\s*\([^)]*\)'
      description: "检查是否为挂载点"
      context: "any"
      can_sleep: false


# ============================================================
# VFS FILE
# ============================================================

vfs_file:
  description: "VFS File - 虚拟文件系统文件"
  header: "linux/fs.h"

  bind_patterns:
    # alloc_file_pseudo - 分配伪文件
    - pattern: 'alloc_file_pseudo\s*\(\s*(?P<inode>[^)]+)\s*,\s*(?P<dentry>[^)]+)\s*,\s*(?P<flags>[^)]+)\s*,\s*(?P<ops>[^)]+)\s*\)'
      variable_capture: "inode"
      description: "分配伪文件"

    # alloc_file - 分配文件
    - pattern: 'alloc_file\s*\(\s*(?P<path>[^)]+)\s*,\s*(?P<flags>\w+)\s*,\s*(?P<ops>[^)]+)\s*\)'
      variable_capture: "path"
      description: "分配文件"

    # fput - 释放文件
    - pattern: 'fput\s*\(\s*(?P<file>[^)]+)\s*\)'
      variable_capture: "file"
      description: "释放文件"

    # fget - 获取文件
    - pattern: 'fget\s*\(\s*(?P<fd>\w+)\s*\)'
      variable_capture: "fd"
      description: "通过 fd 获取文件"

    # fget_light - 轻量获取文件
    - pattern: 'fget_light\s*\(\s*(?P<fd>\w+)\s*,\s*(?P<fput_needed>\w+)\s*\)'
      variable_capture: "fd"
      description: "轻量获取文件"


# ============================================================
# VFS PATH
# ============================================================

vfs_path:
  description: "VFS Path - 虚拟文件系统路径"
  header: "linux/namei.h"

  bind_patterns:
    # kern_path - 内核路径查找
    - pattern: 'kern_path\s*\(\s*(?P<name>[^)]+)\s*,\s*(?P<flags>\w+)\s*,\sP<path>[^)]+\s*\)'
      description: "内核路径查找"

    # user_path_at - 用户路径查找
    - pattern: 'user_path_at\s*\(\s*(?P<dfd>\w+)\s*,\s*(?P<name>[^)]+)\s*,\s*(?P<flags>\w+)\s*,\s*(?P<path>[^)]+)\s*\)'
      description: "用户路径查找"

    # path_lookup - 路径查找
    - pattern: 'path_lookup\s*\(\s*(?P<name>[^)]+)\s*,\s*(?P<flags>\w+)\s*,\s*(?P<path>[^)]+)\s*\)'
      description: "路径查找"

    # path_put - 释放路径
    - pattern: 'path_put\s*\(\s*(?P<path>[^)]+)\s*\)'
      variable_capture: "path"
      description: "释放路径结构"

    # get_empty_filp - 获取空文件结构
    - pattern: 'get_empty_filp\s*\(\s*(?P<flags>\w+)\s*\)'
      variable_capture: "flags"
      description: "分配空文件结构"


# ============================================================
# VFS MOUNT
# ============================================================

vfs_mount:
  description: "VFS Mount - 虚拟文件系统挂载"
  header: "linux/mount.h"

  bind_patterns:
    # alloc_vfsmnt - 分配挂载结构
    - pattern: 'alloc_vfsmnt\s*\(\s*(?P<name>[^)]*)\s*\)'
      variable_capture: "name"
      description: "分配挂载结构"

    # mntget - 增加挂载引用
    - pattern: 'mntget\s*\(\s*(?P<mnt>[^)]+)\s*\)'
      variable_capture: "mnt"
      description: "获取挂载引用"

    # mntput - 释放挂载
    - pattern: 'mntput\s*\(\s*(?P<mnt>[^)]+)\s*\)'
      variable_capture: "mnt"
      description: "释放挂载"


# ============================================================
# FILE OPERATIONS
# ============================================================

file_operations:
  description: "File Operations - 文件操作"
  header: "linux/fs.h"
  icon: "📄"
  kernel_version: "2.6+"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  bind_patterns:
    # struct file_operations (带 const)
    - pattern: 'static const struct file_operations\s+(?P<name>\w+)\s*=\s*\{'
      variable_capture: "name"
      description: "文件操作结构定义 (const)"

    # struct file_operations (不带 const)
    - pattern: 'static struct file_operations\s+(?P<name>\w+)\s*=\s*\{'
      variable_capture: "name"
      description: "文件操作结构定义"

    # struct file_operations 指针
    - pattern: 'struct file_operations\s*\*\s*(?P<name>\w+)'
      variable_capture: "name"
      description: "文件操作指针"

  callbacks:
    # === 基本文件操作 ===
    open:
      pattern: '\.open\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "打开文件"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct inode *, struct file *)"
      return_value:
        success: "0"
        failure: "负数错误码"
      typical_actions:
        - "分配私有数据"
        - "初始化文件状态"
        - "增加引用计数"

    release:
      pattern: '\.release\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "释放文件 (最后一个引用关闭时)"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct inode *, struct file *)"
      return_value:
        success: "0"
        failure: "负数错误码"
      typical_actions:
        - "释放私有数据"
        - "清理资源"
        - "减少引用计数"

    flush:
      pattern: '\.flush\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "刷新文件 (每次 close 时调用)"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct file *, fl_owner_t id)"
      return_value:
        success: "0"
        failure: "负数错误码"
      note: "与 release 不同，flush 在每次 close() 时调用"

    # === 读写操作 (旧 API) ===
    read:
      pattern: '\.read\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "读取数据 (旧 API)"
      context: "process"
      can_sleep: true
      signature: "ssize_t (*)(struct file *, char __user *, size_t, loff_t *)"
      return_value:
        success: "读取的字节数"
        failure: "负数错误码"

    write:
      pattern: '\.write\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "写入数据 (旧 API)"
      context: "process"
      can_sleep: true
      signature: "ssize_t (*)(struct file *, const char __user *, size_t, loff_t *)"
      return_value:
        success: "写入的字节数"
        failure: "负数错误码"

    # === 读写操作 (新 API, 推荐) ===
    read_iter:
      pattern: '\.read_iter\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "迭代读取 (新 API, 3.16+)"
      context: "process"
      can_sleep: true
      signature: "ssize_t (*)(struct kiocb *, struct iov_iter *)"
      return_value:
        success: "读取的字节数"
        failure: "负数错误码"
      typical_actions:
        - "处理 iov_iter"
        - "支持向量化 I/O"
        - "支持直接 I/O"

    write_iter:
      pattern: '\.write_iter\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "迭代写入 (新 API, 3.16+)"
      context: "process"
      can_sleep: true
      signature: "ssize_t (*)(struct kiocb *, struct iov_iter *)"
      return_value:
        success: "写入的字节数"
        failure: "负数错误码"

    # === 定位操作 ===
    llseek:
      pattern: '\.llseek\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "移动文件指针"
      context: "process"
      can_sleep: true
      signature: "loff_t (*)(struct file *, loff_t, int)"
      return_value:
        success: "新的文件位置"
        failure: "负数错误码"

    # === I/O 控制 ===
    unlocked_ioctl:
      pattern: '\.unlocked_ioctl\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "I/O 控制 (无 BKL)"
      context: "process"
      can_sleep: true
      signature: "long (*)(struct file *, unsigned int cmd, unsigned long arg)"
      return_value:
        success: "0 或正数"
        failure: "负数错误码"
      typical_actions:
        - "解析 ioctl 命令"
        - "copy_from_user/copy_to_user"
        - "执行设备特定操作"

    compat_ioctl:
      pattern: '\.compat_ioctl\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "32 位兼容 I/O 控制 (64 位内核)"
      context: "process"
      can_sleep: true
      signature: "long (*)(struct file *, unsigned int cmd, unsigned long arg)"
      return_value:
        success: "0 或正数"
        failure: "负数错误码"

    # === 内存映射 ===
    mmap:
      pattern: '\.mmap\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "内存映射"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct file *, struct vm_area_struct *)"
      return_value:
        success: "0"
        failure: "负数错误码"
      typical_actions:
        - "设置 vma->vm_ops"
        - "设置页面属性"
        - "调用 remap_pfn_range()"

    # === 轮询/异步 ===
    poll:
      pattern: '\.poll\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "轮询 (select/poll/epoll)"
      context: "process"
      can_sleep: false
      signature: "__poll_t (*)(struct file *, struct poll_table_struct *)"
      return_value:
        success: "POLLIN, POLLOUT 等掩码"
      typical_actions:
        - "调用 poll_wait()"
        - "检查可读/可写状态"
        - "返回事件掩码"

    fasync:
      pattern: '\.fasync\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "异步通知设置"
      context: "process"
      can_sleep: true
      signature: "int (*)(int fd, struct file *, int on)"
      return_value:
        success: "0"
        failure: "负数错误码"
      typical_actions:
        - "调用 fasync_helper()"
        - "管理异步通知列表"

    # === 同步操作 ===
    fsync:
      pattern: '\.fsync\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "同步文件 (fsync/fdatasync)"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct file *, loff_t start, loff_t end, int datasync)"
      return_value:
        success: "0"
        failure: "负数错误码"
      typical_actions:
        - "写回脏页面"
        - "同步元数据 (如果非 datasync)"
        - "等待 I/O 完成"

    # === 异步 I/O (已废弃) ===
    aio_read:
      pattern: '\.aio_read\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "异步读取 (已废弃，使用 read_iter)"
      deprecated: true

    aio_write:
      pattern: '\.aio_write\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "异步写入 (已废弃，使用 write_iter)"
      deprecated: true

    # === 零拷贝 ===
    splice_read:
      pattern: '\.splice_read\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "零拷贝读取 (splice)"
      context: "process"
      can_sleep: true
      signature: "ssize_t (*)(struct file *, loff_t *, struct pipe_inode_info *, size_t, unsigned int)"

    splice_write:
      pattern: '\.splice_write\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "零拷贝写入 (splice)"
      context: "process"
      can_sleep: true
      signature: "ssize_t (*)(struct pipe_inode_info *, struct file *, loff_t *, size_t, unsigned int)"

    # === 锁操作 ===
    lock:
      pattern: '\.lock\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "文件锁操作"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct file *, int cmd, struct file_lock *)"

    flock:
      pattern: '\.flock\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "BSD flock 操作"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct file *, int cmd, struct file_lock *)"

    # === 迭代目录 ===
    iterate:
      pattern: '\.iterate\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "目录迭代 (旧 API)"
      deprecated: true

    iterate_shared:
      pattern: '\.iterate_shared\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "目录迭代 (新 API, 4.7+)"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct file *, struct dir_context *)"

    # === 其他 ===
    sendpage:
      pattern: '\.sendpage\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "发送页面 (网络)"
      context: "process"
      can_sleep: true

    get_unmapped_area:
      pattern: '\.get_unmapped_area\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "获取未映射区域"
      context: "process"
      can_sleep: true

    check_flags:
      pattern: '\.check_flags\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "检查 fcntl 标志"
      context: "process"
      can_sleep: false

    setfl:
      pattern: '\.setfl\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "设置文件标志"
      context: "process"
      can_sleep: true

    show_fdinfo:
      pattern: '\.show_fdinfo\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "显示 /proc/pid/fdinfo 信息"
      context: "process"
      can_sleep: true

  call_chains:
    sys_read:
      description: "sys_read 完整调用链"
      trigger: "用户空间 read() 系统调用"
      chain:
        - function: "ksys_read"
          file: "fs/read_write.c"
          description: "系统调用入口"
          context: "process"
        - function: "vfs_read"
          file: "fs/read_write.c"
          description: "VFS 层读取"
        - function: "__vfs_read"
          file: "fs/read_write.c"
          description: "内部分发"
        - function: "new_sync_read"
          file: "fs/read_write.c"
          description: "同步读取包装 (如果使用 read_iter)"
        - function: "call_read_iter"
          file: "include/linux/fs.h"
          description: "调用 read_iter"
        - function: "file->f_op->read_iter"
          file: "用户代码"
          description: "文件系统读取回调"
          is_user_entry: true

    sys_write:
      description: "sys_write 完整调用链"
      trigger: "用户空间 write() 系统调用"
      chain:
        - function: "ksys_write"
          file: "fs/read_write.c"
          description: "系统调用入口"
          context: "process"
        - function: "vfs_write"
          file: "fs/read_write.c"
          description: "VFS 层写入"
        - function: "__vfs_write"
          file: "fs/read_write.c"
          description: "内部分发"
        - function: "new_sync_write"
          file: "fs/read_write.c"
          description: "同步写入包装 (如果使用 write_iter)"
        - function: "call_write_iter"
          file: "include/linux/fs.h"
          description: "调用 write_iter"
        - function: "file->f_op->write_iter"
          file: "用户代码"
          description: "文件系统写入回调"
          is_user_entry: true


# ============================================================
# INODE OPERATIONS
# ============================================================

inode_operations:
  description: "Inode Operations - 索引节点操作"
  header: "linux/fs.h"
  icon: "📁"
  kernel_version: "2.6+"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  bind_patterns:
    # struct inode_operations (带 const)
    - pattern: 'static const struct inode_operations\s+(?P<name>\w+)\s*=\s*\{'
      variable_capture: "name"
      description: "inode 操作结构定义 (const)"

    # struct inode_operations (不带 const)
    - pattern: 'static struct inode_operations\s+(?P<name>\w+)\s*=\s*\{'
      variable_capture: "name"
      description: "inode 操作结构定义"

  callbacks:
    # === 目录项操作 ===
    lookup:
      pattern: '\.lookup\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "在目录中查找文件名"
      context: "process"
      can_sleep: true
      signature: "struct dentry *(*)(struct inode *, struct dentry *, unsigned int)"
      return_value:
        success: "找到的 dentry 或 NULL"
        failure: "ERR_PTR()"
      typical_actions:
        - "从存储读取目录项"
        - "创建并填充 inode"
        - "调用 d_splice_alias()"

    create:
      pattern: '\.create\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "创建新文件"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct user_namespace *, struct inode *, struct dentry *, umode_t, bool)"
      return_value:
        success: "0"
        failure: "负数错误码"
      typical_actions:
        - "分配新 inode"
        - "初始化 inode"
        - "调用 d_instantiate()"

    link:
      pattern: '\.link\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "创建硬链接"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct dentry *, struct inode *, struct dentry *)"
      return_value:
        success: "0"
        failure: "负数错误码"
      typical_actions:
        - "增加链接计数"
        - "添加目录项"
        - "调用 d_instantiate()"

    unlink:
      pattern: '\.unlink\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "删除文件链接"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct inode *, struct dentry *)"
      return_value:
        success: "0"
        failure: "负数错误码"
      typical_actions:
        - "减少链接计数"
        - "从目录删除"
        - "如果 nlink=0，标记为删除"

    symlink:
      pattern: '\.symlink\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "创建符号链接"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct user_namespace *, struct inode *, struct dentry *, const char *)"
      return_value:
        success: "0"
        failure: "负数错误码"

    mkdir:
      pattern: '\.mkdir\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "创建目录"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct user_namespace *, struct inode *, struct dentry *, umode_t)"
      return_value:
        success: "0"
        failure: "负数错误码"
      typical_actions:
        - "分配目录 inode"
        - "创建 . 和 .. 目录项"
        - "增加父目录链接计数"

    rmdir:
      pattern: '\.rmdir\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "删除目录"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct inode *, struct dentry *)"
      return_value:
        success: "0"
        failure: "负数错误码"
      typical_actions:
        - "检查目录是否为空"
        - "减少父目录链接计数"
        - "标记 inode 为删除"

    mknod:
      pattern: '\.mknod\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "创建特殊文件 (设备节点, 管道, 套接字)"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct user_namespace *, struct inode *, struct dentry *, umode_t, dev_t)"
      return_value:
        success: "0"
        failure: "负数错误码"

    rename:
      pattern: '\.rename\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "重命名文件或目录"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct user_namespace *, struct inode *, struct dentry *, struct inode *, struct dentry *, unsigned int)"
      return_value:
        success: "0"
        failure: "负数错误码"

    # === 属性操作 ===
    getattr:
      pattern: '\.getattr\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "获取文件属性 (stat)"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct user_namespace *, const struct path *, struct kstat *, u32, unsigned int)"
      return_value:
        success: "0"
        failure: "负数错误码"
      typical_actions:
        - "填充 kstat 结构"
        - "从存储更新属性 (如果需要)"

    setattr:
      pattern: '\.setattr\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "设置文件属性 (chmod, chown, truncate)"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct user_namespace *, struct dentry *, struct iattr *)"
      return_value:
        success: "0"
        failure: "负数错误码"
      typical_actions:
        - "调用 setattr_prepare()"
        - "更新 inode 属性"
        - "截断文件 (如果 ATTR_SIZE)"

    # === 权限检查 ===
    permission:
      pattern: '\.permission\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "检查访问权限"
      context: "process/rcu"
      can_sleep: "depends on MAY_NOT_BLOCK flag"
      signature: "int (*)(struct user_namespace *, struct inode *, int mask)"
      return_value:
        success: "0 (允许)"
        failure: "-EACCES (拒绝) 或其他错误码"
      typical_actions:
        - "检查 DAC 权限"
        - "检查 MAC 权限 (SELinux 等)"
        - "检查 ACL"

    # === ACL 操作 ===
    get_acl:
      pattern: '\.get_acl\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "获取 POSIX ACL"
      context: "process"
      can_sleep: true
      signature: "struct posix_acl *(*)(struct inode *, int, bool)"
      return_value:
        success: "ACL 指针或 NULL"
        failure: "ERR_PTR()"

    set_acl:
      pattern: '\.set_acl\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "设置 POSIX ACL"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct user_namespace *, struct inode *, struct posix_acl *, int)"
      return_value:
        success: "0"
        failure: "负数错误码"

    # === 扩展属性 ===
    listxattr:
      pattern: '\.listxattr\s*=\s*(?P<handler>\w+)'

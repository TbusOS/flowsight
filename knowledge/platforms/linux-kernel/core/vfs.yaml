      pattern: '\.launder_page\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "清洗脏页面"
      trigger: "截断前确保数据写回"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct page *)"

  call_chains:
    page_cache_read:
      description: "页缓存读取路径"
      trigger: "用户空间 read() 系统调用"
      chain:
        - function: "ksys_read"
          file: "fs/read_write.c"
          description: "系统调用入口"
          context: "process"
        - function: "vfs_read"
          file: "fs/read_write.c"
          description: "VFS 层读取"
        - function: "new_sync_read"
          file: "fs/read_write.c"
          description: "同步读取包装"
        - function: "generic_file_read_iter"
          file: "mm/filemap.c"
          description: "通用文件读取迭代器"
        - function: "filemap_read"
          file: "mm/filemap.c"
          description: "从页缓存读取"
        - function: "filemap_get_pages"
          file: "mm/filemap.c"
          description: "获取或分配页面"
        - function: "filemap_create_page"
          file: "mm/filemap.c"
          description: "创建新页面"
        - function: "aops->readpage"
          file: "用户代码"
          description: "调用文件系统的 readpage"
          is_user_entry: true

    page_cache_write:
      description: "页缓存写入路径"
      trigger: "用户空间 write() 系统调用"
      chain:
        - function: "ksys_write"
          file: "fs/read_write.c"
          description: "系统调用入口"
          context: "process"
        - function: "vfs_write"
          file: "fs/read_write.c"
          description: "VFS 层写入"
        - function: "new_sync_write"
          file: "fs/read_write.c"
          description: "同步写入包装"
        - function: "generic_file_write_iter"
          file: "mm/filemap.c"
          description: "通用文件写入迭代器"
        - function: "generic_perform_write"
          file: "mm/filemap.c"
          description: "执行写入操作"
        - function: "aops->write_begin"
          file: "用户代码"
          description: "准备页面"
          is_user_entry: true
        - function: "copy_from_user"
          file: "内核"
          description: "拷贝用户数据到页面"
        - function: "aops->write_end"
          file: "用户代码"
          description: "完成写入"
          is_user_entry: true

    writeback:
      description: "页面写回路径"
      trigger: "sync 系统调用或内存压力"
      chain:
        - function: "sync_inodes_sb"
          file: "fs/sync.c"
          description: "同步超级块的 inode"
          context: "process"
        - function: "writeback_inodes_sb"
          file: "fs/fs-writeback.c"
          description: "写回 inode"
        - function: "writeback_sb_inodes"
          file: "fs/fs-writeback.c"
          description: "写回超级块 inode"
        - function: "writeback_single_inode"
          file: "fs/fs-writeback.c"
          description: "写回单个 inode"
        - function: "do_writepages"
          file: "mm/page-writeback.c"
          description: "执行写回"
        - function: "aops->writepages"
          file: "用户代码"
          description: "批量写回页面"
          is_user_entry: true

  helper_functions:
    - pattern: 'generic_file_read_iter\s*\([^)]*\)'
      description: "通用文件读取迭代器实现"
      context: "process"
    - pattern: 'generic_file_write_iter\s*\([^)]*\)'
      description: "通用文件写入迭代器实现"
      context: "process"
    - pattern: 'generic_perform_write\s*\([^)]*\)'
      description: "执行页缓存写入"
      context: "process"
    - pattern: 'block_read_full_page\s*\([^)]*\)'
      description: "块设备完整页面读取"
      context: "process"
    - pattern: 'block_write_full_page\s*\([^)]*\)'
      description: "块设备完整页面写入"
      context: "process"
    - pattern: 'mpage_readpages\s*\([^)]*\)'
      description: "多页读取辅助"
      context: "process"
    - pattern: 'mpage_writepages\s*\([^)]*\)'
      description: "多页写入辅助"
      context: "process"


# ============================================================
# PAGE CACHE (页缓存详细)
# ============================================================

page_cache:
  description: "Page Cache - 页缓存管理"
  header: "linux/pagemap.h"
  icon: "📑"
  kernel_version: "2.4+"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  bind_patterns:
    # find_get_page - 查找页面
    - pattern: 'find_get_page\s*\(\s*(?P<mapping>[^,]+)\s*,\s*(?P<offset>[^)]+)\s*\)'
      variable_capture: "mapping"
      description: "查找并获取页面引用"

    # find_or_create_page - 查找或创建页面
    - pattern: 'find_or_create_page\s*\(\s*(?P<mapping>[^,]+)\s*,\s*(?P<offset>[^,]+)\s*,\s*(?P<gfp>[^)]+)\s*\)'
      variable_capture: "mapping"
      description: "查找或创建页面"

    # pagecache_get_page - 通用页面获取
    - pattern: 'pagecache_get_page\s*\(\s*(?P<mapping>[^,]+)\s*,\s*(?P<offset>[^,]+)\s*,\s*(?P<flags>[^,]+)\s*,\s*(?P<gfp>[^)]+)\s*\)'
      variable_capture: "mapping"
      description: "通用页面获取函数"

    # add_to_page_cache_lru - 添加页面到缓存
    - pattern: 'add_to_page_cache_lru\s*\(\s*(?P<page>[^,]+)\s*,\s*(?P<mapping>[^,]+)\s*,\s*(?P<offset>[^,]+)\s*,\s*(?P<gfp>[^)]+)\s*\)'
      variable_capture: "page"
      description: "添加页面到页缓存和 LRU"

    # delete_from_page_cache - 从缓存删除页面
    - pattern: 'delete_from_page_cache\s*\(\s*(?P<page>[^)]+)\s*\)'
      variable_capture: "page"
      description: "从页缓存删除页面"

    # truncate_inode_pages - 截断 inode 页面
    - pattern: 'truncate_inode_pages\s*\(\s*(?P<mapping>[^,]+)\s*,\s*(?P<lstart>[^)]+)\s*\)'
      variable_capture: "mapping"
      description: "截断 inode 的页缓存"

    # truncate_inode_pages_range - 截断范围
    - pattern: 'truncate_inode_pages_range\s*\(\s*(?P<mapping>[^,]+)\s*,\s*(?P<lstart>[^,]+)\s*,\s*(?P<lend>[^)]+)\s*\)'
      variable_capture: "mapping"
      description: "截断 inode 页缓存的指定范围"

    # truncate_inode_pages_final - 最终截断
    - pattern: 'truncate_inode_pages_final\s*\(\s*(?P<mapping>[^)]+)\s*\)'
      variable_capture: "mapping"
      description: "删除 inode 时最终截断页缓存"

    # invalidate_mapping_pages - 使映射页面无效
    - pattern: 'invalidate_mapping_pages\s*\(\s*(?P<mapping>[^,]+)\s*,\s*(?P<start>[^,]+)\s*,\s*(?P<end>[^)]+)\s*\)'
      variable_capture: "mapping"
      description: "使地址空间页面无效 (非阻塞)"

    # invalidate_inode_pages2 - 使 inode 页面无效
    - pattern: 'invalidate_inode_pages2\s*\(\s*(?P<mapping>[^)]+)\s*\)'
      variable_capture: "mapping"
      description: "使 inode 所有页面无效 (阻塞)"

    # filemap_fault - 页面错误处理
    - pattern: 'filemap_fault\s*\(\s*(?P<vmf>[^)]+)\s*\)'
      variable_capture: "vmf"
      description: "通用页面错误处理"

    # filemap_page_mkwrite - 写时复制
    - pattern: 'filemap_page_mkwrite\s*\(\s*(?P<vmf>[^)]+)\s*\)'
      variable_capture: "vmf"
      description: "页面写保护故障处理"

    # read_cache_page - 读取缓存页面
    - pattern: 'read_cache_page\s*\(\s*(?P<mapping>[^,]+)\s*,\s*(?P<index>[^,]+)\s*,\s*(?P<filler>[^,]+)\s*,\s*(?P<data>[^)]+)\s*\)'
      variable_capture: "mapping"
      description: "读取并缓存页面"

  helper_functions:
    - pattern: 'find_get_page\s*\([^)]*\)'
      description: "查找页面并增加引用计数"
      context: "process/atomic"
      can_sleep: false

    - pattern: 'find_or_create_page\s*\([^)]*\)'
      description: "查找或创建页面 (可能睡眠)"
      context: "process"
      can_sleep: true

    - pattern: 'find_lock_page\s*\([^)]*\)'
      description: "查找并锁定页面"
      context: "process"
      can_sleep: true

    - pattern: 'grab_cache_page\s*\([^)]*\)'
      description: "获取缓存页面 (创建或查找)"
      context: "process"
      can_sleep: true

    - pattern: 'grab_cache_page_write_begin\s*\([^)]*\)'
      description: "写入开始时获取页面"
      context: "process"
      can_sleep: true

    - pattern: 'pagecache_get_page\s*\([^)]*\)'
      description: "通用页面获取函数"
      context: "process"
      can_sleep: true

    - pattern: 'add_to_page_cache_lru\s*\([^)]*\)'
      description: "添加页面到缓存和 LRU 列表"
      context: "process"
      can_sleep: true

    - pattern: 'add_to_page_cache_locked\s*\([^)]*\)'
      description: "添加已锁定的页面到缓存"
      context: "process"
      can_sleep: true

    - pattern: 'delete_from_page_cache\s*\([^)]*\)'
      description: "从页缓存删除页面"
      context: "process"
      can_sleep: false

    - pattern: '__delete_from_page_cache\s*\([^)]*\)'
      description: "内部页缓存删除 (需持有锁)"
      context: "atomic"
      can_sleep: false

    - pattern: 'truncate_inode_pages\s*\([^)]*\)'
      description: "截断 inode 的所有页面"
      context: "process"
      can_sleep: true

    - pattern: 'truncate_inode_pages_final\s*\([^)]*\)'
      description: "inode 删除前的最终截断"
      context: "process"
      can_sleep: true

    - pattern: 'invalidate_mapping_pages\s*\([^)]*\)'
      description: "使页面无效 (非阻塞)"
      context: "process"
      can_sleep: false

    - pattern: 'invalidate_inode_pages2\s*\([^)]*\)'
      description: "使页面无效 (阻塞,等待写回)"
      context: "process"
      can_sleep: true

    - pattern: 'filemap_fault\s*\([^)]*\)'
      description: "通用文件映射页面错误处理"
      context: "process"
      can_sleep: true

    - pattern: 'filemap_page_mkwrite\s*\([^)]*\)'
      description: "写保护故障处理"
      context: "process"
      can_sleep: true

    - pattern: 'filemap_map_pages\s*\([^)]*\)'
      description: "批量映射页面"
      context: "process"
      can_sleep: true

    - pattern: 'generic_file_mmap\s*\([^)]*\)'
      description: "通用文件内存映射"
      context: "process"
      can_sleep: true

  call_chains:
    page_lookup:
      description: "页面查找路径"
      trigger: "访问文件映射内存"
      chain:
        - function: "filemap_fault"
          file: "mm/filemap.c"
          description: "页面错误处理入口"
          context: "process"
        - function: "filemap_get_folio"
          file: "mm/filemap.c"
          description: "获取或分配 folio"
        - function: "pagecache_get_page"
          file: "mm/filemap.c"
          description: "从基数树查找页面"
        - function: "aops->readpage"
          file: "用户代码"
          description: "如果未命中则读取"
          is_user_entry: true

    page_add:
      description: "页面添加路径"
      trigger: "将新页面加入页缓存"
      chain:
        - function: "add_to_page_cache_lru"
          file: "mm/filemap.c"
          description: "添加到页缓存"
          context: "process"
        - function: "__add_to_page_cache_locked"
          file: "mm/filemap.c"
          description: "内部添加实现"
        - function: "xarray_insert"
          file: "lib/xarray.c"
          description: "插入基数树"
        - function: "lru_cache_add"
          file: "mm/swap.c"
          description: "加入 LRU 列表"

    truncate:
      description: "文件截断路径"
      trigger: "truncate() 或 ftruncate() 系统调用"
      chain:
        - function: "do_truncate"
          file: "fs/open.c"
          description: "截断入口"
          context: "process"
        - function: "notify_change"
          file: "fs/attr.c"
          description: "通知属性变化"
        - function: "inode->i_op->setattr"
          file: "用户代码"
          description: "设置 inode 属性"
        - function: "truncate_setsize"
          file: "mm/truncate.c"
          description: "设置大小并截断页面"
        - function: "truncate_pagecache"
          file: "mm/truncate.c"
          description: "截断页缓存"
        - function: "truncate_inode_pages_range"
          file: "mm/truncate.c"
          description: "截断指定范围页面"


# ============================================================
# DIRECT I/O (直接 I/O)
# ============================================================

direct_io:
  description: "Direct I/O - 直接 I/O (绕过页缓存)"
  header: "linux/fs.h"
  icon: "⚡"
  kernel_version: "2.4+"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  bind_patterns:
    # O_DIRECT 标志检查
    - pattern: 'file->f_flags\s*&\s*O_DIRECT'
      description: "检查 O_DIRECT 标志"

    # __blockdev_direct_IO
    - pattern: '__blockdev_direct_IO\s*\(\s*(?P<iocb>[^,]+)\s*,\s*(?P<inode>[^,]+)\s*,\s*(?P<bdev>[^,]+)\s*,\s*(?P<iter>[^,]+)\s*,'
      variable_capture: "iocb"
      description: "块设备直接 I/O 核心函数"

    # blockdev_direct_IO
    - pattern: 'blockdev_direct_IO\s*\(\s*(?P<iocb>[^,]+)\s*,\s*(?P<inode>[^,]+)\s*,\s*(?P<iter>[^,]+)\s*,\s*(?P<get_block>[^)]+)\s*\)'
      variable_capture: "iocb"
      description: "块设备直接 I/O 包装函数"

    # generic_file_direct_write
    - pattern: 'generic_file_direct_write\s*\(\s*(?P<iocb>[^,]+)\s*,\s*(?P<iter>[^)]+)\s*\)'
      variable_capture: "iocb"
      description: "通用直接写入"

    # inode_dio_wait
    - pattern: 'inode_dio_wait\s*\(\s*(?P<inode>[^)]+)\s*\)'
      variable_capture: "inode"
      description: "等待直接 I/O 完成"

    # inode_dio_begin
    - pattern: 'inode_dio_begin\s*\(\s*(?P<inode>[^)]+)\s*\)'
      variable_capture: "inode"
      description: "开始直接 I/O (增加引用)"

    # inode_dio_end
    - pattern: 'inode_dio_end\s*\(\s*(?P<inode>[^)]+)\s*\)'
      variable_capture: "inode"
      description: "结束直接 I/O (减少引用)"

  helper_functions:
    - pattern: '__blockdev_direct_IO\s*\([^)]*\)'
      description: "块设备直接 I/O 核心实现"
      context: "process"
      can_sleep: true

    - pattern: 'blockdev_direct_IO\s*\([^)]*\)'
      description: "块设备直接 I/O 简化包装"
      context: "process"
      can_sleep: true

    - pattern: 'generic_file_direct_write\s*\([^)]*\)'
      description: "通用文件直接写入"
      context: "process"
      can_sleep: true

    - pattern: 'inode_dio_begin\s*\([^)]*\)'
      description: "标记直接 I/O 开始"
      context: "process"
      can_sleep: false

    - pattern: 'inode_dio_end\s*\([^)]*\)'
      description: "标记直接 I/O 结束"
      context: "process"
      can_sleep: true

    - pattern: 'inode_dio_wait\s*\([^)]*\)'
      description: "等待直接 I/O 完成"
      context: "process"
      can_sleep: true

    - pattern: 'dio_bio_submit\s*\([^)]*\)'
      description: "提交直接 I/O bio"
      context: "process"
      can_sleep: true

    - pattern: 'dio_complete\s*\([^)]*\)'
      description: "直接 I/O 完成处理"
      context: "softirq"
      can_sleep: false

  call_chains:
    direct_read:
      description: "直接读取路径"
      trigger: "O_DIRECT 标志的 read()"
      chain:
        - function: "ksys_read"
          file: "fs/read_write.c"
          description: "系统调用入口"
          context: "process"
        - function: "vfs_read"
          file: "fs/read_write.c"
          description: "VFS 读取"
        - function: "generic_file_read_iter"
          file: "mm/filemap.c"
          description: "通用读取迭代器"
        - function: "mapping->a_ops->direct_IO"
          file: "用户代码"
          description: "调用直接 I/O 回调"
          is_user_entry: true
        - function: "__blockdev_direct_IO"
          file: "fs/direct-io.c"
          description: "核心直接 I/O 实现"
        - function: "do_blockdev_direct_IO"
          file: "fs/direct-io.c"
          description: "实际 I/O 处理"
        - function: "submit_bio"
          file: "block/blk-core.c"
          description: "提交 bio 到块层"

    direct_write:
      description: "直接写入路径"
      trigger: "O_DIRECT 标志的 write()"
      chain:
        - function: "ksys_write"
          file: "fs/read_write.c"
          description: "系统调用入口"
          context: "process"
        - function: "vfs_write"
          file: "fs/read_write.c"
          description: "VFS 写入"
        - function: "generic_file_write_iter"
          file: "mm/filemap.c"
          description: "通用写入迭代器"
        - function: "generic_file_direct_write"
          file: "mm/filemap.c"
          description: "通用直接写入"
        - function: "mapping->a_ops->direct_IO"
          file: "用户代码"
          description: "调用直接 I/O 回调"
          is_user_entry: true
        - function: "__blockdev_direct_IO"
          file: "fs/direct-io.c"
          description: "核心直接 I/O 实现"
        - function: "submit_bio"
          file: "block/blk-core.c"
          description: "提交 bio 到块层"


# ============================================================
# FILE LOCK (文件锁)
# ============================================================

file_lock:
  description: "File Lock - 文件锁 (flock/POSIX)"
  header: "linux/fs.h"
  icon: "🔒"
  kernel_version: "1.0+"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  bind_patterns:
    # locks_alloc_lock - 分配锁
    - pattern: 'locks_alloc_lock\s*\(\s*\)'
      description: "分配文件锁结构"

    # locks_free_lock - 释放锁
    - pattern: 'locks_free_lock\s*\(\s*(?P<fl>[^)]+)\s*\)'
      variable_capture: "fl"
      description: "释放文件锁结构"

    # locks_copy_lock - 复制锁
    - pattern: 'locks_copy_lock\s*\(\s*(?P<dst>[^,]+)\s*,\s*(?P<src>[^)]+)\s*\)'
      variable_capture: "dst"
      description: "复制文件锁"

    # vfs_lock_file - VFS 加锁
    - pattern: 'vfs_lock_file\s*\(\s*(?P<file>[^,]+)\s*,\s*(?P<cmd>[^,]+)\s*,\s*(?P<fl>[^,]+)\s*,\s*(?P<conf>[^)]+)\s*\)'
      variable_capture: "file"
      description: "VFS 层文件加锁"

    # vfs_test_lock - 测试锁
    - pattern: 'vfs_test_lock\s*\(\s*(?P<file>[^,]+)\s*,\s*(?P<fl>[^)]+)\s*\)'
      variable_capture: "file"
      description: "测试文件锁"

    # posix_lock_file - POSIX 锁
    - pattern: 'posix_lock_file\s*\(\s*(?P<file>[^,]+)\s*,\s*(?P<fl>[^,]+)\s*,\s*(?P<conf>[^)]+)\s*\)'
      variable_capture: "file"
      description: "POSIX 文件锁"

    # flock_lock_inode_wait - flock 等待
    - pattern: 'flock_lock_inode_wait\s*\(\s*(?P<inode>[^,]+)\s*,\s*(?P<fl>[^)]+)\s*\)'
      variable_capture: "inode"
      description: "flock 等待加锁"

    # locks_lock_inode_wait - 通用等待
    - pattern: 'locks_lock_inode_wait\s*\(\s*(?P<inode>[^,]+)\s*,\s*(?P<fl>[^)]+)\s*\)'
      variable_capture: "inode"
      description: "通用锁等待"

  structure:
    name: "file_lock"
    description: "文件锁结构"
    fields:
      - name: "fl_next"
        type: "struct file_lock *"
        description: "inode 锁链表"
      - name: "fl_list"
        type: "struct list_head"
        description: "file_lock_context 链表"
      - name: "fl_link"
        type: "struct hlist_node"
        description: "全局链表节点"
      - name: "fl_block"
        type: "struct list_head"
        description: "阻塞进程链表"
      - name: "fl_owner"
        type: "fl_owner_t"
        description: "锁所有者"
      - name: "fl_flags"
        type: "unsigned int"
        description: "锁标志 (FL_POSIX/FL_FLOCK/FL_LEASE)"
      - name: "fl_type"
        type: "unsigned char"
        description: "锁类型 (F_RDLCK/F_WRLCK/F_UNLCK)"
      - name: "fl_pid"
        type: "unsigned int"
        description: "持有者 PID"
      - name: "fl_wait"
        type: "wait_queue_head_t"
        description: "等待队列"
      - name: "fl_file"
        type: "struct file *"
        description: "关联文件"
      - name: "fl_start"
        type: "loff_t"
        description: "锁定范围起始"
      - name: "fl_end"
        type: "loff_t"
        description: "锁定范围结束"
      - name: "fl_ops"
        type: "const struct file_lock_operations *"
        description: "文件系统回调"
      - name: "fl_lmops"
        type: "const struct lock_manager_operations *"
        description: "锁管理器回调"

  helper_functions:
    - pattern: 'locks_alloc_lock\s*\([^)]*\)'
      description: "分配文件锁结构"
      context: "process"
      can_sleep: true

    - pattern: 'locks_free_lock\s*\([^)]*\)'
      description: "释放文件锁结构"
      context: "process"
      can_sleep: false

    - pattern: 'locks_copy_lock\s*\([^)]*\)'
      description: "复制锁到新结构"
      context: "process"
      can_sleep: false

    - pattern: 'locks_copy_conflock\s*\([^)]*\)'
      description: "复制冲突锁信息"
      context: "process"
      can_sleep: false

    - pattern: 'vfs_lock_file\s*\([^)]*\)'
      description: "VFS 层文件加锁"
      context: "process"
      can_sleep: true

    - pattern: 'vfs_test_lock\s*\([^)]*\)'
      description: "测试锁是否冲突"
      context: "process"
      can_sleep: false

    - pattern: 'vfs_cancel_lock\s*\([^)]*\)'
      description: "取消等待的锁"
      context: "process"
      can_sleep: false

    - pattern: 'posix_lock_file\s*\([^)]*\)'
      description: "POSIX 记录锁"
      context: "process"
      can_sleep: true

    - pattern: 'posix_unblock_lock\s*\([^)]*\)'
      description: "解除阻塞的 POSIX 锁"
      context: "process"
      can_sleep: false

    - pattern: 'locks_lock_inode_wait\s*\([^)]*\)'
      description: "等待获取 inode 锁"
      context: "process"
      can_sleep: true

    - pattern: 'locks_remove_posix\s*\([^)]*\)'
      description: "移除 POSIX 锁"
      context: "process"
      can_sleep: true

    - pattern: 'locks_remove_file\s*\([^)]*\)'
      description: "移除文件所有锁"
      context: "process"
      can_sleep: true

    - pattern: '__break_lease\s*\([^)]*\)'
      description: "打破租约锁"
      context: "process"
      can_sleep: true

  call_chains:
    flock_lock:
      description: "flock 加锁路径"
      trigger: "flock() 系统调用"
      chain:
        - function: "__x64_sys_flock"
          file: "fs/locks.c"
          description: "系统调用入口"
          context: "process"
        - function: "flock_make_lock"
          file: "fs/locks.c"
          description: "创建 flock 锁结构"
        - function: "flock_lock_inode_wait"
          file: "fs/locks.c"
          description: "等待并加锁"
        - function: "flock_lock_inode"
          file: "fs/locks.c"
          description: "实际加锁操作"
        - function: "locks_insert_lock_ctx"
          file: "fs/locks.c"
          description: "插入锁上下文"

    posix_lock:
      description: "POSIX 锁路径"
      trigger: "fcntl(F_SETLK/F_SETLKW)"
      chain:
        - function: "__x64_sys_fcntl"
          file: "fs/fcntl.c"
          description: "系统调用入口"
          context: "process"
        - function: "do_fcntl"
          file: "fs/fcntl.c"
          description: "fcntl 分发"
        - function: "fcntl_setlk"
          file: "fs/locks.c"
          description: "设置 POSIX 锁"
        - function: "vfs_lock_file"
          file: "fs/locks.c"
          description: "VFS 层加锁"
        - function: "posix_lock_file"
          file: "fs/locks.c"
          description: "POSIX 锁实现"
        - function: "posix_lock_inode"
          file: "fs/locks.c"
          description: "inode 级锁操作"

    lease_break:
      description: "租约打破路径"
      trigger: "打开被租约保护的文件"
      chain:
        - function: "do_dentry_open"
          file: "fs/open.c"
          description: "打开文件"
          context: "process"
        - function: "break_lease"
          file: "fs/locks.c"
          description: "检查并打破租约"
        - function: "__break_lease"
          file: "fs/locks.c"
          description: "实际打破租约"
        - function: "locks_delete_lock_ctx"
          file: "fs/locks.c"
          description: "删除租约锁"


# ============================================================
# BLOCK INTEGRATION (块层集成)
# ============================================================

block_integration:
  description: "Block Layer Integration - 块层集成"
  header: "linux/bio.h"
  icon: "💾"
  kernel_version: "2.5+"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  bind_patterns:
    # bio_alloc - 分配 bio
    - pattern: 'bio_alloc\s*\(\s*(?P<gfp>[^,]+)\s*,\s*(?P<nr_vecs>[^)]+)\s*\)'
      variable_capture: "gfp"
      description: "分配 bio 结构"

    # bio_alloc_bioset - 从 bioset 分配
    - pattern: 'bio_alloc_bioset\s*\(\s*(?P<gfp>[^,]+)\s*,\s*(?P<nr_vecs>[^,]+)\s*,\s*(?P<bs>[^)]+)\s*\)'
      variable_capture: "gfp"
      description: "从 bioset 分配 bio"

    # bio_put - 释放 bio
    - pattern: 'bio_put\s*\(\s*(?P<bio>[^)]+)\s*\)'
      variable_capture: "bio"
      description: "释放 bio 引用"

    # bio_add_page - 添加页面
    - pattern: 'bio_add_page\s*\(\s*(?P<bio>[^,]+)\s*,\s*(?P<page>[^,]+)\s*,\s*(?P<len>[^,]+)\s*,\s*(?P<offset>[^)]+)\s*\)'
      variable_capture: "bio"
      description: "向 bio 添加页面"

    # submit_bio - 提交 bio
    - pattern: 'submit_bio\s*\(\s*(?P<bio>[^)]+)\s*\)'
      variable_capture: "bio"
      description: "提交 bio 到块层"

    # submit_bio_wait - 同步提交
    - pattern: 'submit_bio_wait\s*\(\s*(?P<bio>[^)]+)\s*\)'
      variable_capture: "bio"
      description: "提交并等待 bio 完成"

    # bio_endio - bio 完成
    - pattern: 'bio_endio\s*\(\s*(?P<bio>[^)]+)\s*\)'
      variable_capture: "bio"
      description: "bio I/O 完成回调"

    # bio_set_dev - 设置设备
    - pattern: 'bio_set_dev\s*\(\s*(?P<bio>[^,]+)\s*,\s*(?P<bdev>[^)]+)\s*\)'
      variable_capture: "bio"
      description: "设置 bio 目标设备"

  structure:
    name: "bio"
    description: "块 I/O 结构"
    fields:
      - name: "bi_next"
        type: "struct bio *"
        description: "请求队列链表"
      - name: "bi_disk"
        type: "struct gendisk *"
        description: "目标磁盘"
      - name: "bi_opf"
        type: "unsigned int"
        description: "操作类型和标志"
      - name: "bi_flags"
        type: "unsigned short"
        description: "状态标志"
      - name: "bi_status"
        type: "blk_status_t"
        description: "I/O 状态"
      - name: "bi_iter"
        type: "struct bvec_iter"
        description: "I/O 位置迭代器"
      - name: "__bi_remaining"
        type: "atomic_t"
        description: "剩余 I/O 计数"
      - name: "bi_end_io"
        type: "bio_end_io_t *"
        description: "完成回调函数"
      - name: "bi_private"
        type: "void *"
        description: "私有数据"
      - name: "bi_io_vec"
        type: "struct bio_vec *"
        description: "I/O 向量数组"
      - name: "bi_max_vecs"
        type: "unsigned short"
        description: "最大向量数"
      - name: "bi_vcnt"
        type: "unsigned short"
        description: "当前向量数"

  helper_functions:
    - pattern: 'bio_alloc\s*\([^)]*\)'
      description: "分配 bio 结构"
      context: "process"
      can_sleep: true

    - pattern: 'bio_alloc_bioset\s*\([^)]*\)'
      description: "从指定 bioset 分配 bio"
      context: "process"
      can_sleep: true

    - pattern: 'bio_kmalloc\s*\([^)]*\)'
      description: "使用 kmalloc 分配 bio"
      context: "process"
      can_sleep: true

    - pattern: 'bio_put\s*\([^)]*\)'
      description: "释放 bio 引用"
      context: "process/softirq"
      can_sleep: false

    - pattern: 'bio_get\s*\([^)]*\)'
      description: "增加 bio 引用"
      context: "process/softirq"
      can_sleep: false

    - pattern: 'bio_add_page\s*\([^)]*\)'
      description: "向 bio 添加页面"
      context: "process"
      can_sleep: false

    - pattern: '__bio_add_page\s*\([^)]*\)'
      description: "无检查添加页面"
      context: "process"
      can_sleep: false

    - pattern: 'bio_set_dev\s*\([^)]*\)'
      description: "设置目标块设备"
      context: "process"
      can_sleep: false

    - pattern: 'bio_set_op_attrs\s*\([^)]*\)'
      description: "设置操作类型和属性"
      context: "process"
      can_sleep: false

    - pattern: 'submit_bio\s*\([^)]*\)'
      description: "提交 bio 到块层"
      context: "process"
      can_sleep: true

    - pattern: 'submit_bio_wait\s*\([^)]*\)'
      description: "同步提交并等待完成"
      context: "process"
      can_sleep: true

    - pattern: 'bio_endio\s*\([^)]*\)'
      description: "bio 完成处理"
      context: "softirq"
      can_sleep: false

    - pattern: 'bio_init\s*\([^)]*\)'
      description: "初始化 bio 结构"
      context: "process"
      can_sleep: false

    - pattern: 'bio_reset\s*\([^)]*\)'
      description: "重置 bio 用于重用"
      context: "process"
      can_sleep: false

    - pattern: 'bio_chain\s*\([^)]*\)'
      description: "链接 bio 用于拆分"
      context: "process"
      can_sleep: false

    - pattern: 'bio_clone_fast\s*\([^)]*\)'
      description: "快速克隆 bio"
      context: "process"
      can_sleep: true

    - pattern: 'bio_alloc_pages\s*\([^)]*\)'
      description: "为 bio 分配页面"
      context: "process"
      can_sleep: true

    - pattern: 'bio_free_pages\s*\([^)]*\)'
      description: "释放 bio 的页面"
      context: "process"
      can_sleep: false

  call_chains:
    vfs_to_block:
      description: "VFS 到块层路径"
      trigger: "页缓存写回或直接 I/O"
      chain:
        - function: "aops->writepage"
          file: "用户代码"
          description: "文件系统写页回调"
          context: "process"
          is_user_entry: true
        - function: "block_write_full_page"
          file: "fs/buffer.c"
          description: "块设备完整页写入"
        - function: "submit_bh_wbc"
          file: "fs/buffer.c"
          description: "提交 buffer_head"
        - function: "submit_bio"
          file: "block/blk-core.c"
          description: "提交 bio 到块层"
        - function: "generic_make_request"
          file: "block/blk-core.c"
          description: "通用请求处理"
        - function: "blk_mq_submit_bio"
          file: "block/blk-mq.c"
          description: "多队列提交"
        - function: "blk_mq_run_hw_queue"
          file: "block/blk-mq.c"
          description: "运行硬件队列"

    bio_completion:
      description: "bio 完成路径"
      trigger: "I/O 完成中断"
      chain:
        - function: "blk_mq_end_request"
          file: "block/blk-mq.c"
          description: "请求完成"
          context: "softirq"
        - function: "blk_update_request"
          file: "block/blk-core.c"
          description: "更新请求状态"
        - function: "bio_endio"
          file: "block/bio.c"
          description: "bio 完成回调"
        - function: "bio->bi_end_io"
          file: "用户代码"
          description: "用户完成回调"
          is_user_entry: true


# ============================================================
# FILESYSTEM FRAMEWORK (文件系统框架)
# ============================================================

filesystem_framework:
  description: "Filesystem Framework - 文件系统类型注册与挂载框架"
  header: "linux/fs.h"
  icon: "🗂️"
  kernel_version: "2.4+"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  data_structure:
    file_system_type:
      pattern: 'struct file_system_type\s*\{'
      description: "文件系统类型结构"
      file: "include/linux/fs.h"
      fields:
        - name: "name"
          type: "const char *"
          description: "文件系统名称 (如 ext4, xfs)"
        - name: "fs_flags"
          type: "int"
          description: "文件系统标志"
        - name: "init_fs_context"
          type: "int (*)(struct fs_context *)"
          description: "初始化文件系统上下文 (5.1+)"
        - name: "parameters"
          type: "const struct fs_parameter_spec *"
          description: "挂载参数描述"
        - name: "mount"
          type: "struct dentry *(*)(struct file_system_type *, int, const char *, void *)"
          description: "挂载回调 (旧 API)"
        - name: "kill_sb"
          type: "void (*)(struct super_block *)"
          description: "卸载时清理超级块"
        - name: "owner"
          type: "struct module *"
          description: "模块所有者"
        - name: "next"
          type: "struct file_system_type *"
          description: "文件系统类型链表"
        - name: "fs_supers"
          type: "struct hlist_head"
          description: "该类型的所有超级块"

    fs_context:
      pattern: 'struct fs_context\s*\{'
      description: "文件系统上下文 (新挂载 API)"
      file: "include/linux/fs_context.h"
      fields:
        - name: "ops"
          type: "const struct fs_context_operations *"
          description: "上下文操作"
        - name: "fs_type"
          type: "struct file_system_type *"
          description: "文件系统类型"
        - name: "root"
          type: "struct dentry *"
          description: "根 dentry"
        - name: "source"
          type: "char *"
          description: "数据源 (设备路径)"
        - name: "fs_private"
          type: "void *"
          description: "私有数据"
        - name: "sb_flags"
          type: "unsigned int"
          description: "超级块标志"

  bind_patterns:
    # === 文件系统注册/注销 ===
    # register_filesystem - 注册文件系统
    - pattern: 'register_filesystem\s*\(\s*&?(?P<fs>\w+)\s*\)'
      variable_capture: "fs"
      description: "注册文件系统类型"
      context: "process"
      can_sleep: true
      return_value: "0 成功, 负数错误码"

    # unregister_filesystem - 注销文件系统
    - pattern: 'unregister_filesystem\s*\(\s*&?(?P<fs>\w+)\s*\)'
      variable_capture: "fs"
      description: "注销文件系统类型"
      context: "process"
      can_sleep: true
      return_value: "0 成功, -EINVAL 未注册"

    # get_fs_type - 获取文件系统类型
    - pattern: 'get_fs_type\s*\(\s*(?P<name>[^)]+)\s*\)'
      variable_capture: "name"
      description: "通过名称获取文件系统类型"
      context: "process"
      can_sleep: true
      return_value: "file_system_type 指针或 NULL"

    # put_filesystem - 释放文件系统引用
    - pattern: 'put_filesystem\s*\(\s*(?P<fs>[^)]+)\s*\)'
      variable_capture: "fs"
      description: "释放文件系统类型引用"
      context: "process"
      can_sleep: false

    # === 挂载辅助函数 (旧 API) ===
    # mount_bdev - 块设备挂载
    - pattern: 'mount_bdev\s*\(\s*(?P<fs_type>[^,]+)\s*,\s*(?P<flags>[^,]+)\s*,\s*(?P<dev_name>[^,]+)\s*,\s*(?P<data>[^,]+)\s*,\s*(?P<fill_super>[^)]+)\s*\)'
      variable_capture: "fs_type"
      description: "挂载块设备文件系统 (ext4, xfs 等)"
      context: "process"
      can_sleep: true
      return_value: "根 dentry 或 ERR_PTR()"

    # mount_nodev - 无设备挂载
    - pattern: 'mount_nodev\s*\(\s*(?P<fs_type>[^,]+)\s*,\s*(?P<flags>[^,]+)\s*,\s*(?P<data>[^,]+)\s*,\s*(?P<fill_super>[^)]+)\s*\)'
      variable_capture: "fs_type"
      description: "挂载无设备文件系统 (ramfs, tmpfs 等)"
      context: "process"
      can_sleep: true
      return_value: "根 dentry 或 ERR_PTR()"

    # mount_single - 单例挂载
    - pattern: 'mount_single\s*\(\s*(?P<fs_type>[^,]+)\s*,\s*(?P<flags>[^,]+)\s*,\s*(?P<data>[^,]+)\s*,\s*(?P<fill_super>[^)]+)\s*\)'
      variable_capture: "fs_type"
      description: "挂载单实例文件系统 (debugfs, securityfs 等)"
      context: "process"
      can_sleep: true
      return_value: "根 dentry 或 ERR_PTR()"

    # mount_pseudo_xattr - 伪文件系统挂载
    - pattern: 'mount_pseudo_xattr\s*\(\s*(?P<fs_type>[^,]+)\s*,\s*(?P<name>[^,]+)\s*,'
      variable_capture: "fs_type"
      description: "挂载伪文件系统 (pipefs, sockfs 等)"
      context: "process"
      can_sleep: true

    # mount_pseudo - 伪文件系统挂载 (简化)
    - pattern: 'mount_pseudo\s*\(\s*(?P<fs_type>[^,]+)\s*,\s*(?P<name>[^,]+)\s*,'
      variable_capture: "fs_type"
      description: "挂载伪文件系统"
      context: "process"
      can_sleep: true

    # === kill_sb 辅助函数 ===
    # kill_block_super - 块设备卸载
    - pattern: 'kill_block_super\s*\(\s*(?P<sb>[^)]+)\s*\)'
      variable_capture: "sb"
      description: "卸载块设备文件系统"
      context: "process"
      can_sleep: true

    # kill_litter_super - 清理内容卸载
    - pattern: 'kill_litter_super\s*\(\s*(?P<sb>[^)]+)\s*\)'
      variable_capture: "sb"
      description: "卸载并清理所有内容 (ramfs 等)"
      context: "process"
      can_sleep: true

    # kill_anon_super - 匿名卸载
    - pattern: 'kill_anon_super\s*\(\s*(?P<sb>[^)]+)\s*\)'
      variable_capture: "sb"
      description: "卸载匿名文件系统"
      context: "process"
      can_sleep: true

    # === 新挂载 API (5.1+) ===
    # get_tree_nodev - 无设备获取树
    - pattern: 'get_tree_nodev\s*\(\s*(?P<fc>[^,]+)\s*,\s*(?P<fill_super>[^)]+)\s*\)'
      variable_capture: "fc"
      description: "无设备获取文件系统树"
      context: "process"
      can_sleep: true

    # get_tree_bdev - 块设备获取树
    - pattern: 'get_tree_bdev\s*\(\s*(?P<fc>[^,]+)\s*,\s*(?P<fill_super>[^)]+)\s*\)'
      variable_capture: "fc"
      description: "块设备获取文件系统树"
      context: "process"
      can_sleep: true

    # get_tree_single - 单例获取树
    - pattern: 'get_tree_single\s*\(\s*(?P<fc>[^,]+)\s*,\s*(?P<fill_super>[^)]+)\s*\)'
      variable_capture: "fc"
      description: "单实例获取文件系统树"
      context: "process"
      can_sleep: true

    # get_tree_keyed - 带键获取树
    - pattern: 'get_tree_keyed\s*\(\s*(?P<fc>[^,]+)\s*,\s*(?P<fill_super>[^,]+)\s*,\s*(?P<key>[^)]+)\s*\)'
      variable_capture: "fc"
      description: "带键获取文件系统树 (网络文件系统)"
      context: "process"
      can_sleep: true

    # vfs_get_tree - 获取树
    - pattern: 'vfs_get_tree\s*\(\s*(?P<fc>[^)]+)\s*\)'
      variable_capture: "fc"
      description: "获取文件系统树"
      context: "process"
      can_sleep: true

    # vfs_create_mount - 创建挂载
    - pattern: 'vfs_create_mount\s*\(\s*(?P<fc>[^)]+)\s*\)'
      variable_capture: "fc"
      description: "创建 vfsmount"
      context: "process"
      can_sleep: true

    # === 文件系统类型结构 ===
    # struct file_system_type 定义
    - pattern: 'static struct file_system_type\s+(?P<name>\w+)\s*=\s*\{'
      variable_capture: "name"
      description: "文件系统类型结构定义"

  callbacks:
    mount:
      pattern: '\.mount\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "挂载文件系统 (旧 API)"
      trigger: "mount 系统调用"
      context: "process"
      can_sleep: true
      handler_signature: |
        struct dentry *(*mount)(struct file_system_type *fs_type,
                                int flags, const char *dev_name, void *data);

    kill_sb:
      pattern: '\.kill_sb\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "卸载时清理超级块"
      trigger: "umount 系统调用"
      context: "process"
      can_sleep: true
      handler_signature: |
        void (*kill_sb)(struct super_block *sb);

    init_fs_context:
      pattern: '\.init_fs_context\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "初始化文件系统上下文 (新 API, 5.1+)"
      trigger: "mount 系统调用"
      context: "process"
      can_sleep: true
      handler_signature: |
        int (*init_fs_context)(struct fs_context *fc);

  helper_functions:
    # 挂载辅助函数
    - pattern: 'mount_bdev\s*\(\s*(?P<fs_type>[^,]+)\s*,\s*(?P<flags>[^,]+)\s*,\s*(?P<dev_name>[^,]+)\s*,\s*(?P<data>[^,]+)\s*,\s*(?P<fill_super>[^)]+)\s*\)'
      variable_capture: "fs_type"
      description: "挂载块设备文件系统"
      context: "process"

    - pattern: 'mount_single\s*\(\s*(?P<fs_type>[^,]+)\s*,\s*(?P<flags>[^,]+)\s*,\s*(?P<data>[^,]+)\s*,\s*(?P<fill_super>[^)]+)\s*\)'
      variable_capture: "fs_type"
      description: "挂载单实例文件系统 (如 debugfs)"

    - path: "/proc/sys/kernel/sched_nr_migrate"
      description: "每次均衡最大迁移任务数"
      default: "32"

# ============================================================
# EXAMPLES (综合示例)
# ============================================================

examples:
  - description: "内核驱动中的等待队列使用"
    kernel_version: "2.6+"
    code: |
      #include <linux/module.h>
      #include <linux/wait.h>
      #include <linux/sched.h>
      #include <linux/kthread.h>
      
      static DECLARE_WAIT_QUEUE_HEAD(data_wq);
      static int data_ready = 0;
      static struct task_struct *consumer_thread;
      
      /* 生产者 - 可能从中断调用 */
      static void produce_data(void)
      {
          /* 准备数据 */
          data_ready = 1;
          /* 唤醒消费者 */
          wake_up_interruptible(&data_wq);
      }
      
      /* 消费者线程 */
      static int consumer_func(void *data)
      {
          while (!kthread_should_stop()) {
              /* 等待数据就绪 */
              if (wait_event_interruptible(data_wq, 
                      data_ready || kthread_should_stop())) {
                  /* 被信号中断 */
                  continue;
              }
              
              if (kthread_should_stop())
                  break;
              
              /* 处理数据 */
              process_data();
              data_ready = 0;
          }
          return 0;
      }
      
      static int __init my_init(void)
      {
          consumer_thread = kthread_run(consumer_func, NULL, "consumer");
          if (IS_ERR(consumer_thread))
              return PTR_ERR(consumer_thread);
          return 0;
      }
      
      static void __exit my_exit(void)
      {
          kthread_stop(consumer_thread);
      }

  - description: "实时任务优先级继承"
    kernel_version: "2.6+"
    code: |
      #include <linux/sched.h>
      #include <linux/sched/rt.h>
      
      /* 提升当前任务为实时优先级 */
      static void boost_priority(void)
      {
          struct sched_param param = {
              .sched_priority = MAX_RT_PRIO - 1,  /* 最高 RT 优先级 */
          };
          
          sched_setscheduler(current, SCHED_FIFO, &param);
      }
      
      /* 恢复普通优先级 */
      static void restore_priority(void)
      {
          struct sched_param param = {
              .sched_priority = 0,
          };
          
          sched_setscheduler(current, SCHED_NORMAL, &param);
      }

  - description: "CPU cgroup 配置脚本"
    kernel_version: "3.0+"
    code: |
      #!/bin/bash
      # 创建 CPU 受限的 cgroup
      
      CGROUP_PATH="/sys/fs/cgroup/cpu/limited"
      
      # 创建 cgroup
      mkdir -p $CGROUP_PATH
      
      # 设置 CPU 带宽: 50% (50ms/100ms)
      echo 50000 > $CGROUP_PATH/cpu.cfs_quota_us
      echo 100000 > $CGROUP_PATH/cpu.cfs_period_us
      
      # 设置 shares (相对权重)
      echo 512 > $CGROUP_PATH/cpu.shares
      
      # 将当前 shell 加入 cgroup
      echo $$ > $CGROUP_PATH/cgroup.procs
      
      # 运行受限程序
      exec $@

    - path: "/proc/sys/kernel/sched_min_granularity_ns"
      description: "最小调度粒度"
      default: "750000 (0.75ms)"

    - path: "/proc/sys/kernel/sched_wakeup_granularity_ns"
      description: "唤醒粒度"
      default: "1000000 (1ms)"

    - path: "/proc/sys/kernel/sched_migration_cost_ns"
      description: "迁移成本"

# Linux Kernel Semaphore Knowledge Base
# Counting and binary semaphores for process synchronization
# Reference: https://www.kernel.org/doc/html/latest/locking/mutex-design.html

# ============================================================
# SEMAPHORE
# ============================================================

semaphore:
  description: "Semaphore - 计数信号量，用于资源计数和进程同步"
  header: "linux/semaphore.h"
  icon: "🚦"
  kernel_version: "2.6+"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true
    notes:
      - "down 操作可能睡眠，只能在进程上下文调用"
      - "up 操作不睡眠，可在任何上下文调用（包括中断）"
      - "与 mutex 不同，semaphore 可以有计数 > 1"
      - "与 mutex 不同，up 和 down 可以由不同进程调用"

  structure:
    pattern: 'struct semaphore\s+(?P<name>\w+)\s*[;=]'
    description: "信号量结构体定义"
    fields:
      - name: "lock"
        type: "raw_spinlock_t"
        description: "保护信号量状态的自旋锁"
      - name: "count"
        type: "unsigned int"
        description: "资源计数（可用资源数量）"
      - name: "wait_list"
        type: "struct list_head"
        description: "等待进程队列"

  # ============================================================
  # INITIALIZATION API
  # ============================================================

  bind_patterns:
    # 静态初始化 - 二值信号量
    - pattern: 'DEFINE_SEMAPHORE\s*\(\s*(?P<sem>\w+)\s*\)'
      variable_capture: "sem"
      description: "静态定义信号量（初始计数=1，二值信号量）"
      api_type: "initialization"
      notes:
        - "等价于 mutex 的语义"
        - "内核 5.17+ 改名为 DEFINE_SEMAPHORE_DATA"

    - pattern: 'DEFINE_SEMAPHORE_DATA\s*\(\s*(?P<sem>\w+)\s*,\s*(?P<count>\d+)\s*\)'
      variable_capture: "sem"
      description: "静态定义信号量（指定初始计数）"
      api_type: "initialization"
      kernel_version: "5.17+"
      parameters:
        - name: "count"
          type: "unsigned int"
          description: "初始资源计数"

    - pattern: '__SEMAPHORE_INITIALIZER\s*\(\s*(?P<sem>\w+)\s*,\s*(?P<count>\d+)\s*\)'
      variable_capture: "sem"
      description: "静态初始化器（用于结构体成员）"
      api_type: "initialization"

    # 动态初始化
    - pattern: 'sema_init\s*\(\s*&?(?P<sem>[\w\.\->]+)\s*,\s*(?P<count>[^)]+)\s*\)'
      variable_capture: "sem"
      description: "动态初始化信号量"
      api_type: "initialization"
      context: "any"
      parameters:
        - name: "count"
          type: "int"
          description: "初始资源计数（通常为正数）"

    # ============================================================
    # DOWN (P/WAIT/ACQUIRE) API
    # ============================================================

    - pattern: 'down\s*\(\s*&?(?P<sem>[\w\.\->]+)\s*\)'
      variable_capture: "sem"
      description: "获取信号量（不可中断，可能睡眠）"
      api_type: "down"
      context: "process"
      can_sleep: true
      return_type: "void"
      notes:
        - "如果 count > 0，立即返回并 count--"
        - "如果 count == 0，进入 TASK_UNINTERRUPTIBLE 睡眠"
        - "信号无法中断此等待"
        - "保证一定能获取到信号量"

    - pattern: 'down_interruptible\s*\(\s*&?(?P<sem>[\w\.\->]+)\s*\)'
      variable_capture: "sem"
      description: "可中断获取信号量"
      api_type: "down"
      context: "process"
      can_sleep: true
      return_type: "int"
      return_value:
        success: "0 - 成功获取"
        failure: "-EINTR - 被信号中断"
      notes:
        - "进入 TASK_INTERRUPTIBLE 睡眠"
        - "收到任何信号都会返回 -EINTR"
        - "返回非0时，信号量未被获取"

    - pattern: 'down_killable\s*\(\s*&?(?P<sem>[\w\.\->]+)\s*\)'
      variable_capture: "sem"
      description: "可被致命信号中断的获取"
      api_type: "down"
      context: "process"
      can_sleep: true
      return_type: "int"
      return_value:
        success: "0 - 成功获取"
        failure: "-EINTR - 被致命信号中断"
      notes:
        - "进入 TASK_KILLABLE 睡眠"
        - "只有 SIGKILL 等致命信号才能中断"
        - "比 interruptible 更健壮"

    - pattern: 'down_trylock\s*\(\s*&?(?P<sem>[\w\.\->]+)\s*\)'
      variable_capture: "sem"
      description: "非阻塞尝试获取信号量"
      api_type: "down"
      context: "any"
      can_sleep: false
      return_type: "int"
      return_value:
        success: "0 - 成功获取"
        failure: "1 - 获取失败（信号量不可用）"
      notes:
        - "不会睡眠，可在任何上下文调用"
        - "注意：返回值与 mutex_trylock 相反！"

    - pattern: 'down_timeout\s*\(\s*&?(?P<sem>[\w\.\->]+)\s*,\s*(?P<timeout>[^)]+)\s*\)'
      variable_capture: "sem"
      description: "带超时的获取信号量"
      api_type: "down"
      context: "process"
      can_sleep: true
      return_type: "int"
      return_value:
        success: "0 - 成功获取"
        failure: "-ETIME - 超时"
      parameters:
        - name: "timeout"
          type: "long"
          description: "超时时间（jiffies）"
      notes:
        - "等待不可中断"
        - "超时返回 -ETIME"

    # ============================================================
    # UP (V/SIGNAL/RELEASE) API
    # ============================================================

    - pattern: 'up\s*\(\s*&?(?P<sem>[\w\.\->]+)\s*\)'
      variable_capture: "sem"
      description: "释放信号量（唤醒等待者或增加计数）"
      api_type: "up"
      context: "any"
      can_sleep: false
      return_type: "void"
      notes:
        - "如果有等待者，唤醒一个"
        - "如果没有等待者，count++"
        - "可在任何上下文调用，包括中断"
        - "不需要是 down 的调用者（与 mutex 不同）"

  # ============================================================
  # CALL CHAINS
  # ============================================================

  call_chains:
    down_path:
      description: "获取信号量的调用路径"
      trigger: "调用 down()"
      chain:
        - function: "down"
          file: "kernel/locking/semaphore.c"
          description: "获取信号量入口"
          context: "process"
          is_user_entry: true
        - function: "raw_spin_lock_irqsave"
          file: "kernel/locking/semaphore.c"
          description: "获取保护锁"
        - function: "__down"
          file: "kernel/locking/semaphore.c"
          description: "核心获取逻辑"
          notes: "检查 count，决定是否睡眠"
        - function: "__down_common"
          file: "kernel/locking/semaphore.c"
          description: "通用等待实现"
        - function: "schedule_timeout"
          file: "kernel/time/timer.c"
          description: "调度让出 CPU"
        - function: "schedule"
          file: "kernel/sched/core.c"
          description: "主动调度，进入睡眠"

    down_interruptible_path:
      description: "可中断获取信号量的路径"
      trigger: "调用 down_interruptible()"
      chain:
        - function: "down_interruptible"
          file: "kernel/locking/semaphore.c"
          description: "可中断获取入口"
          context: "process"
          is_user_entry: true
        - function: "__down_interruptible"
          file: "kernel/locking/semaphore.c"
          description: "使用 TASK_INTERRUPTIBLE"
        - function: "__down_common"
          file: "kernel/locking/semaphore.c"
          description: "通用等待，检查信号"
        - function: "signal_pending"
          file: "kernel/signal.c"
          description: "检查待处理信号"
          notes: "有信号则返回 -EINTR"

    up_path:
      description: "释放信号量的调用路径"
      trigger: "调用 up()"
      chain:
        - function: "up"
          file: "kernel/locking/semaphore.c"
          description: "释放信号量入口"
          context: "any"
          is_user_entry: true
        - function: "raw_spin_lock_irqsave"
          file: "kernel/locking/semaphore.c"
          description: "获取保护锁"
        - function: "__up"
          file: "kernel/locking/semaphore.c"
          description: "核心释放逻辑"
          notes: "唤醒等待者或增加 count"
        - function: "wake_up_process"
          file: "kernel/sched/core.c"
          description: "唤醒等待进程"
          notes: "如果有等待者"

  # ============================================================
  # USE CASES
  # ============================================================

  use_cases:
    - name: "resource_pool"
      description: "资源池管理 - 限制同时使用的资源数量"
      scenario: "DMA 通道、内存池、连接池等有限资源"
      code: |
        #define MAX_DMA_CHANNELS 4
        static DEFINE_SEMAPHORE_DATA(dma_sem, MAX_DMA_CHANNELS);

        struct dma_channel *acquire_dma_channel(void)
        {
            struct dma_channel *ch;
            int ret;

            /* 等待可用通道（可中断）*/
            ret = down_interruptible(&dma_sem);
            if (ret)
                return ERR_PTR(-EINTR);

            ch = get_free_channel();
            return ch;
        }

        void release_dma_channel(struct dma_channel *ch)
        {
            put_channel(ch);
            up(&dma_sem);  /* 通知有通道可用 */
        }

    - name: "producer_consumer"
      description: "生产者-消费者模式"
      scenario: "一个或多个生产者，一个或多个消费者"
      code: |
        #define BUFFER_SIZE 10
        static DEFINE_SEMAPHORE_DATA(empty_slots, BUFFER_SIZE);
        static DEFINE_SEMAPHORE_DATA(filled_slots, 0);
        static DEFINE_MUTEX(buffer_lock);
        static int buffer[BUFFER_SIZE];
        static int read_pos, write_pos;

        /* 生产者 */
        int produce(int item)
        {
            int ret;

            /* 等待空槽位 */
            ret = down_interruptible(&empty_slots);
            if (ret)
                return ret;

            mutex_lock(&buffer_lock);
            buffer[write_pos] = item;
            write_pos = (write_pos + 1) % BUFFER_SIZE;
            mutex_unlock(&buffer_lock);

            up(&filled_slots);  /* 通知有数据 */
            return 0;
        }

        /* 消费者 */
        int consume(int *item)
        {
            int ret;

            /* 等待数据 */
            ret = down_interruptible(&filled_slots);
            if (ret)
                return ret;

            mutex_lock(&buffer_lock);
            *item = buffer[read_pos];
            read_pos = (read_pos + 1) % BUFFER_SIZE;
            mutex_unlock(&buffer_lock);

            up(&empty_slots);  /* 通知有空槽 */
            return 0;
        }

    - name: "thread_barrier"
      description: "线程屏障 - 等待多个线程到达同步点"
      scenario: "并行计算中的同步点"
      code: |
        struct thread_barrier {
            struct semaphore mutex;
            struct semaphore turnstile1;
            struct semaphore turnstile2;
            int count;
            int n;  /* 线程总数 */
        };

        void barrier_init(struct thread_barrier *b, int n)
        {
            sema_init(&b->mutex, 1);
            sema_init(&b->turnstile1, 0);
            sema_init(&b->turnstile2, 1);
            b->count = 0;
            b->n = n;
        }

        void barrier_wait(struct thread_barrier *b)
        {
            int i;

            /* 第一阶段 */
            down(&b->mutex);
            b->count++;
            if (b->count == b->n) {
                down(&b->turnstile2);
                up(&b->turnstile1);
            }
            up(&b->mutex);

            down(&b->turnstile1);
            up(&b->turnstile1);

            /* 第二阶段 */
            down(&b->mutex);
            b->count--;
            if (b->count == 0) {
                down(&b->turnstile1);
                up(&b->turnstile2);
            }
            up(&b->mutex);

            down(&b->turnstile2);
            up(&b->turnstile2);
        }

    - name: "cross_context_signaling"
      description: "跨上下文信号 - 中断通知进程"
      scenario: "中断处理完成后通知等待的进程"
      code: |
        static DEFINE_SEMAPHORE_DATA(irq_done, 0);

        /* 中断处理函数 */
        static irqreturn_t my_isr(int irq, void *dev_id)
        {
            /* 处理中断 */
            handle_interrupt();

            /* 通知等待者（可在中断中调用 up）*/
            up(&irq_done);

            return IRQ_HANDLED;
        }

        /* 进程上下文等待 */
        int wait_for_interrupt_with_timeout(unsigned long timeout)
        {
            int ret;

            ret = down_timeout(&irq_done, timeout);
            if (ret == -ETIME) {
                pr_warn("timeout waiting for interrupt\n");
                return -ETIMEDOUT;
            }

            return 0;
        }

    - name: "legacy_mutex"
      description: "传统互斥（已被 mutex 取代）"
      scenario: "历史代码中的二值信号量"
      code: |
        /* 旧代码风格 - 不推荐新代码使用 */
        static DEFINE_SEMAPHORE(old_mutex);

        void legacy_critical_section(void)
        {
            down(&old_mutex);
            /* 临界区 */
            up(&old_mutex);
        }

        /* 新代码应使用 mutex */
        static DEFINE_MUTEX(new_mutex);

        void modern_critical_section(void)
        {
            mutex_lock(&new_mutex);
            /* 临界区 */
            mutex_unlock(&new_mutex);
        }

  # ============================================================
  # COMPARISON WITH OTHER PRIMITIVES
  # ============================================================

  comparison:
    vs_mutex:
      description: "Semaphore vs Mutex 详细对比"
      table:
        - aspect: "计数"
          semaphore: "可以是任意正数"
          mutex: "只能是 0 或 1"
        - aspect: "所有权"
          semaphore: "无所有权，任何人可以 up"
          mutex: "有所有权，只有持有者可以 unlock"
        - aspect: "优先级继承"
          semaphore: "不支持"
          mutex: "支持（避免优先级反转）"
        - aspect: "调试支持"
          semaphore: "基本"
          mutex: "完整（lockdep, owner tracking）"
        - aspect: "性能"
          semaphore: "稍慢"
          mutex: "优化更好"
        - aspect: "递归获取"
          semaphore: "可能死锁"
          mutex: "调试时检测"
        - aspect: "推荐程度"
          semaphore: "仅用于计数信号量"
          mutex: "互斥首选"

      recommendations:
        - scenario: "简单互斥（计数=1）"
          use: "mutex"
          reason: "更好的调试、优先级继承、性能"
        - scenario: "资源计数（计数>1）"
          use: "semaphore"
          reason: "唯一选择"
        - scenario: "生产者-消费者"
          use: "semaphore"
          reason: "需要不同进程 up/down"
        - scenario: "跨上下文信号"
          use: "semaphore 或 completion"
          reason: "中断中可以 up"

    vs_completion:
      description: "Semaphore vs Completion"
      table:
        - aspect: "语义"
          semaphore: "资源计数"
          completion: "一次性事件"
        - aspect: "唤醒多个"
          semaphore: "每次 up 唤醒一个"
          completion: "complete_all 唤醒全部"
        - aspect: "重用"
          semaphore: "自动可重用"
          completion: "需要 reinit"
        - aspect: "典型用途"
          semaphore: "限制并发数"
          completion: "等待异步完成"

    vs_spinlock:
      description: "Semaphore vs Spinlock"
      table:
        - aspect: "能否睡眠"
          semaphore: "可以睡眠"
          spinlock: "不能睡眠"
        - aspect: "中断上下文"
          semaphore: "down 不可用"
          spinlock: "可用"
        - aspect: "持有时间"
          semaphore: "可以较长"
          spinlock: "应该很短"
        - aspect: "CPU 效率"
          semaphore: "睡眠让出 CPU"
          spinlock: "忙等浪费 CPU"

  # ============================================================
  # BEST PRACTICES
  # ============================================================

  best_practices:
    - rule: "优先使用 mutex 而非二值信号量"
      description: "对于简单的互斥，mutex 比 semaphore 更好"
      good: |
        static DEFINE_MUTEX(my_lock);
        mutex_lock(&my_lock);
        /* 临界区 */
        mutex_unlock(&my_lock);
      bad: |
        static DEFINE_SEMAPHORE(my_lock);
        down(&my_lock);
        /* 临界区 */
        up(&my_lock);
      reason:
        - "mutex 有所有权跟踪"
        - "mutex 支持优先级继承"
        - "mutex 有更好的调试支持"

    - rule: "检查 down_interruptible 返回值"
      description: "可中断的获取必须检查返回值"
      good: |
        if (down_interruptible(&sem)) {
            /* 被信号中断，资源未获取 */
            return -EINTR;
        }
        /* 正常使用资源 */
        up(&sem);
      bad: |
        down_interruptible(&sem);
        /* 忽略返回值，可能没有获取到！*/
        use_resource();
        up(&sem);  /* 可能释放未获取的信号量！*/

    - rule: "注意 down_trylock 返回值"
      description: "down_trylock 的返回值与 mutex_trylock 相反"
      warning: |
        /* semaphore: 返回 0 表示成功 */
        if (down_trylock(&sem) == 0) {
            /* 成功获取 */
        }

        /* mutex: 返回 1 表示成功 */
        if (mutex_trylock(&mtx)) {
            /* 成功获取 */
        }

    - rule: "信号量计数初始化"
      description: "根据资源数量正确初始化计数"
      examples:
        - scenario: "二值信号量（互斥）"
          init: "sema_init(&sem, 1)"
        - scenario: "N 个资源的池"
          init: "sema_init(&sem, N)"
        - scenario: "等待事件（初始阻塞）"
          init: "sema_init(&sem, 0)"

    - rule: "避免信号量的常见陷阱"
      pitfalls:
        - problem: "递归获取"
          description: "同一进程连续 down 两次会死锁"
          solution: "使用不同的信号量或重构代码"
        - problem: "up/down 不配对"
          description: "多余的 up 会增加计数，破坏信号量语义"
          solution: "仔细审查代码路径，确保配对"
        - problem: "中断上下文 down"
          description: "down 在中断中会睡眠，导致系统崩溃"
          solution: "中断中使用 down_trylock"

  # ============================================================
  # RW SEMAPHORE
  # ============================================================

rw_semaphore:
  description: "RW Semaphore - 读写信号量，支持多读者或单写者"
  header: "linux/rwsem.h"
  icon: "📚"
  kernel_version: "2.6+"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true
    notes:
      - "读者可以并发持有"
      - "写者是排他的"
      - "比 rwlock 更公平，但只能在进程上下文使用"
      - "支持锁降级（写锁降为读锁）"

  bind_patterns:
    # 静态初始化
    - pattern: 'DECLARE_RWSEM\s*\(\s*&?(?P<sem>[\w\.\->]+)\s*\)'
      variable_capture: "sem"
      description: "静态声明读写信号量"
      api_type: "initialization"

    - pattern: '__RWSEM_INITIALIZER\s*\(\s*(?P<sem>\w+)\s*\)'
      variable_capture: "sem"
      description: "静态初始化器"
      api_type: "initialization"

    # 动态初始化
    - pattern: 'init_rwsem\s*\(\s*&?(?P<sem>[\w\.\->]+)\s*\)'
      variable_capture: "sem"
      description: "动态初始化读写信号量"
      api_type: "initialization"

    # 读锁操作
    - pattern: 'down_read\s*\(\s*&?(?P<sem>[\w\.\->]+)\s*\)'
      variable_capture: "sem"
      description: "获取读锁（可能睡眠）"
      api_type: "read_lock"
      context: "process"
      can_sleep: true

    - pattern: 'down_read_interruptible\s*\(\s*&?(?P<sem>[\w\.\->]+)\s*\)'
      variable_capture: "sem"
      description: "可中断获取读锁"
      api_type: "read_lock"
      context: "process"
      can_sleep: true
      return_type: "int"
      return_value:
        success: "0"
        failure: "-EINTR"

    - pattern: 'down_read_killable\s*\(\s*&?(?P<sem>[\w\.\->]+)\s*\)'
      variable_capture: "sem"
      description: "可被杀死的获取读锁"
      api_type: "read_lock"
      context: "process"
      can_sleep: true
      return_type: "int"

    - pattern: 'down_read_trylock\s*\(\s*&?(?P<sem>[\w\.\->]+)\s*\)'
      variable_capture: "sem"
      description: "尝试获取读锁（非阻塞）"
      api_type: "read_lock"
      context: "any"
      can_sleep: false
      return_type: "int"
      return_value:
        success: "1 - 成功"
        failure: "0 - 失败"

    - pattern: 'up_read\s*\(\s*&?(?P<sem>[\w\.\->]+)\s*\)'
      variable_capture: "sem"
      description: "释放读锁"
      api_type: "read_unlock"
      context: "process"

    # 写锁操作
    - pattern: 'down_write\s*\(\s*&?(?P<sem>[\w\.\->]+)\s*\)'
      variable_capture: "sem"
      description: "获取写锁（可能睡眠）"
      api_type: "write_lock"
      context: "process"
      can_sleep: true

    - pattern: 'down_write_interruptible\s*\(\s*&?(?P<sem>[\w\.\->]+)\s*\)'
      variable_capture: "sem"
      description: "可中断获取写锁"
      api_type: "write_lock"
      context: "process"
      can_sleep: true
      return_type: "int"

    - pattern: 'down_write_killable\s*\(\s*&?(?P<sem>[\w\.\->]+)\s*\)'
      variable_capture: "sem"
      description: "可被杀死的获取写锁"
      api_type: "write_lock"
      context: "process"
      can_sleep: true
      return_type: "int"

    - pattern: 'down_write_trylock\s*\(\s*&?(?P<sem>[\w\.\->]+)\s*\)'
      variable_capture: "sem"
      description: "尝试获取写锁（非阻塞）"
      api_type: "write_lock"
      context: "any"
      can_sleep: false
      return_type: "int"
      return_value:
        success: "1 - 成功"
        failure: "0 - 失败"

    - pattern: 'up_write\s*\(\s*&?(?P<sem>[\w\.\->]+)\s*\)'
      variable_capture: "sem"
      description: "释放写锁"
      api_type: "write_unlock"
      context: "process"

    # 锁降级
    - pattern: 'downgrade_write\s*\(\s*&?(?P<sem>[\w\.\->]+)\s*\)'
      variable_capture: "sem"
      description: "将写锁降级为读锁（原子操作）"
      api_type: "downgrade"
      context: "process"
      notes:
        - "必须持有写锁才能调用"
        - "降级后变为持有读锁"
        - "允许其他读者进入"

  use_cases:
    - name: "file_inode_lock"
      description: "文件 inode 保护（内核实际用法）"
      scenario: "保护 inode 数据结构"
      code: |
        /* 类似 inode->i_rwsem 的用法 */
        static DECLARE_RWSEM(inode_rwsem);
        static struct inode_data data;

        /* 读取 inode 数据 */
        int read_inode_data(struct inode_data *out)
        {
            down_read(&inode_rwsem);
            *out = data;
            up_read(&inode_rwsem);
            return 0;
        }

        /* 修改 inode 数据 */
        int write_inode_data(struct inode_data *in)
        {
            down_write(&inode_rwsem);
            data = *in;
            up_write(&inode_rwsem);
            return 0;
        }

    - name: "mm_mmap_lock"
      description: "进程地址空间保护（内核实际用法）"
      scenario: "保护 mm_struct 的 VMA 列表"
      code: |
        /* 类似 mm->mmap_lock 的用法 */
        struct mm_struct *mm = current->mm;

        /* 读取 VMA - 多个读者并发 */
        struct vm_area_struct *find_vma_read(unsigned long addr)
        {
            struct vm_area_struct *vma;

            down_read(&mm->mmap_lock);
            vma = find_vma(mm, addr);
            up_read(&mm->mmap_lock);

            return vma;
        }

        /* 修改 VMA - 排他 */
        int do_mmap(unsigned long addr, size_t len)
        {
            int ret;

            down_write(&mm->mmap_lock);
            ret = __do_mmap(mm, addr, len);
            up_write(&mm->mmap_lock);

            return ret;
        }

    - name: "lock_downgrade"
      description: "锁降级 - 修改后允许并发读取"
      scenario: "先写入数据，然后在读模式下处理"
      code: |
        static DECLARE_RWSEM(data_rwsem);
        static struct big_data shared_data;

        void update_and_process(struct big_data *new_data)
        {
            /* 获取写锁 */
            down_write(&data_rwsem);

            /* 更新数据 */
            shared_data = *new_data;

            /* 降级为读锁，允许其他读者 */
            downgrade_write(&data_rwsem);

            /* 读取处理（其他读者可以并发）*/
            process_data(&shared_data);

            up_read(&data_rwsem);
        }

  comparison:
    vs_rwlock:
      description: "rw_semaphore vs rwlock"
      table:
        - aspect: "能否睡眠"
          rw_semaphore: "可以睡眠"
          rwlock: "不能睡眠"
        - aspect: "中断上下文"
          rw_semaphore: "不可用"
          rwlock: "可用"
        - aspect: "公平性"
          rw_semaphore: "较公平（FIFO）"
          rwlock: "写者可能饥饿"
        - aspect: "锁降级"
          rw_semaphore: "支持 downgrade_write"
          rwlock: "不支持"
        - aspect: "适用场景"
          rw_semaphore: "长临界区，进程上下文"
          rwlock: "短临界区，任何上下文"

# ============================================================
# EXAMPLES
# ============================================================

examples:
  - description: "计数信号量基本使用"
    code: |
      #define MAX_CONNECTIONS 100
      static DEFINE_SEMAPHORE_DATA(conn_sem, MAX_CONNECTIONS);

      struct connection *get_connection(void)
      {
          struct connection *conn;
          int ret;

          ret = down_interruptible(&conn_sem);
          if (ret)
              return ERR_PTR(-EINTR);

          conn = alloc_connection();
          if (!conn) {
              up(&conn_sem);
              return ERR_PTR(-ENOMEM);
          }

          return conn;
      }

      void put_connection(struct connection *conn)
      {
          free_connection(conn);
          up(&conn_sem);
      }

  - description: "读写信号量使用"
    code: |
      static DECLARE_RWSEM(config_rwsem);
      static struct config config;

      int get_config(struct config *out)
      {
          int ret;

          ret = down_read_interruptible(&config_rwsem);
          if (ret)
              return ret;

          *out = config;
          up_read(&config_rwsem);

          return 0;
      }

      int set_config(struct config *in)
      {
          int ret;

          ret = down_write_killable(&config_rwsem);
          if (ret)
              return ret;

          config = *in;
          up_write(&config_rwsem);

          return 0;
      }

  - description: "超时获取信号量"
    code: |
      static DEFINE_SEMAPHORE_DATA(resource_sem, 1);

      int acquire_resource_timeout(unsigned long timeout_ms)
      {
          int ret;

          ret = down_timeout(&resource_sem,
                  msecs_to_jiffies(timeout_ms));
          if (ret == -ETIME) {
              pr_warn("timeout acquiring resource\n");
              return -ETIMEDOUT;
          }

          return 0;
      }

      void release_resource(void)
      {
          up(&resource_sem);
      }

  - description: "生产者消费者完整示例"
    code: |
      #define QUEUE_SIZE 16

      struct queue {
          struct semaphore empty;   /* 空槽位计数 */
          struct semaphore filled;  /* 已填充计数 */
          spinlock_t lock;          /* 保护队列操作 */
          int data[QUEUE_SIZE];
          int head, tail;
      };

      void queue_init(struct queue *q)
      {
          sema_init(&q->empty, QUEUE_SIZE);
          sema_init(&q->filled, 0);
          spin_lock_init(&q->lock);
          q->head = q->tail = 0;
      }

      int queue_put(struct queue *q, int item)
      {
          int ret;

          /* 等待空槽位 */
          ret = down_interruptible(&q->empty);
          if (ret)
              return ret;

          spin_lock(&q->lock);
          q->data[q->tail] = item;
          q->tail = (q->tail + 1) % QUEUE_SIZE;
          spin_unlock(&q->lock);

          up(&q->filled);  /* 通知有数据 */
          return 0;
      }

      int queue_get(struct queue *q, int *item)
      {
          int ret;

          /* 等待数据 */
          ret = down_interruptible(&q->filled);
          if (ret)
              return ret;

          spin_lock(&q->lock);
          *item = q->data[q->head];
          q->head = (q->head + 1) % QUEUE_SIZE;
          spin_unlock(&q->lock);

          up(&q->empty);  /* 通知有空槽 */
          return 0;
      }

notes:
  - "Semaphore 是传统的 UNIX 同步原语"
  - "对于简单互斥，优先使用 mutex"
  - "计数信号量用于资源池、生产者消费者等场景"
  - "down 在中断上下文不可用（会睡眠）"
  - "up 可在任何上下文调用"
  - "读写信号量适合读多写少的长临界区"

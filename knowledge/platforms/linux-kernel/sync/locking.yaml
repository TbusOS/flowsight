  notes:
    - "原子版本用于并发场景"
    - "非原子版本 (__前缀) 需要外部同步"
    - "test_and_*_bit 返回旧值"


# ============================================================
# LOCKDEP - 锁依赖检查
# ============================================================

lockdep:
  description: "Lock Dependency Checker - 锁依赖检查"
  header: "linux/lockdep.h"
  icon: "🔍"

  config:
    CONFIG_LOCKDEP:
      description: "启用锁依赖检查"
    CONFIG_PROVE_LOCKING:
      description: "启用锁证明"
    CONFIG_DEBUG_LOCK_ALLOC:
      description: "启用锁分配调试"

  bind_patterns:
    # lockdep_assert_held
    - pattern: 'lockdep_assert_held\s*\(\s*&?(?P<lock>[\w\.\->]+)\s*\)'
      variable_capture: "lock"
      description: "断言锁已持有"

    # lockdep_assert_held_write
    - pattern: 'lockdep_assert_held_write\s*\(\s*&?(?P<lock>[\w\.\->]+)\s*\)'
      variable_capture: "lock"
      description: "断言持有写锁"

    # lockdep_assert_held_read
    - pattern: 'lockdep_assert_held_read\s*\(\s*&?(?P<lock>[\w\.\->]+)\s*\)'
      variable_capture: "lock"
      description: "断言持有读锁"

    # lockdep_assert_not_held
    - pattern: 'lockdep_assert_not_held\s*\(\s*&?(?P<lock>[\w\.\->]+)\s*\)'
      variable_capture: "lock"
      description: "断言锁未持有"

    # lock_acquire
    - pattern: 'lock_acquire\s*\([^)]+\)'
      description: "lockdep 锁获取跟踪"

    # lock_release
    - pattern: 'lock_release\s*\([^)]+\)'
      description: "lockdep 锁释放跟踪"

    # lockdep_set_class
    - pattern: 'lockdep_set_class\s*\(\s*&?(?P<lock>[\w\.\->]+)\s*,\s*&?(?P<key>[\w\.\->]+)\s*\)'
      variable_capture: "lock"
      description: "设置锁的类"

    # lockdep_set_subclass
    - pattern: 'lockdep_set_subclass\s*\(\s*&?(?P<lock>[\w\.\->]+)\s*,\s*(?P<subclass>\w+)\s*\)'
      variable_capture: "lock"
      description: "设置锁的子类"

    # lockdep_init_map
    - pattern: 'lockdep_init_map\s*\([^)]+\)'
      description: "初始化 lockdep 映射"

  errors:
    - name: "AA deadlock"
      description: "同一个锁被获取两次"
    - name: "ABBA deadlock"
      description: "锁获取顺序不一致"
    - name: "unsafe lock acquire"
      description: "中断/软中断上下文中不安全的锁获取"


# ============================================================
# SEQLOCK - 顺序锁
# ============================================================

seqlock:
  description: "Sequence Lock - 顺序锁"
  header: "linux/seqlock.h"
  icon: "🔢"
  kernel_version: "2.6+"

  context:
    reader: "不阻塞，乐观并发"
    writer: "独占"

  bind_patterns:
    # DEFINE_SEQLOCK - 静态定义
    - pattern: 'DEFINE_SEQLOCK\s*\(\s*(?P<lock>\w+)\s*\)'
      variable_capture: "lock"
      description: "静态定义顺序锁"

    # seqlock_init - 动态初始化
    - pattern: 'seqlock_init\s*\(\s*&?(?P<lock>[\w\.\->]+)\s*\)'
      variable_capture: "lock"
      description: "动态初始化顺序锁"

    # write_seqlock - 获取写锁
    - pattern: 'write_seqlock\s*\(\s*&?(?P<lock>[\w\.\->]+)\s*\)'
      variable_capture: "lock"
      description: "获取顺序写锁"

    # write_sequnlock - 释放写锁
    - pattern: 'write_sequnlock\s*\(\s*&?(?P<lock>[\w\.\->]+)\s*\)'
      variable_capture: "lock"
      description: "释放顺序写锁"

    # write_seqlock_irqsave
    - pattern: 'write_seqlock_irqsave\s*\(\s*&?(?P<lock>[\w\.\->]+)\s*,\s*(?P<flags>\w+)\s*\)'
      variable_capture: "lock"
      description: "获取顺序写锁并保存中断状态"

    # write_sequnlock_irqrestore
    - pattern: 'write_sequnlock_irqrestore\s*\(\s*&?(?P<lock>[\w\.\->]+)\s*,\s*(?P<flags>\w+)\s*\)'
      variable_capture: "lock"
      description: "释放顺序写锁并恢复中断状态"

    # read_seqbegin - 开始读取
    - pattern: 'read_seqbegin\s*\(\s*&?(?P<lock>[\w\.\->]+)\s*\)'
      variable_capture: "lock"
      description: "开始顺序读取"
      return_type: "unsigned int (序列号)"

    # read_seqretry - 检查是否需要重试
    - pattern: 'read_seqretry\s*\(\s*&?(?P<lock>[\w\.\->]+)\s*,\s*(?P<seq>\w+)\s*\)'
      variable_capture: "lock"
      description: "检查读取是否有效"
      return_type: "int (非零表示需要重试)"

  usage_pattern: |
    /* 写者 */
    write_seqlock(&seqlock);
    /* 修改数据 */
    write_sequnlock(&seqlock);

    /* 读者 */
    do {
        seq = read_seqbegin(&seqlock);
        /* 读取数据 */
    } while (read_seqretry(&seqlock, seq));

  notes:
    - "读者可能需要重试"
    - "写者不会被读者阻塞"
    - "适合读多写少且数据简单的场景"
    - "jiffies 使用 seqlock 保护"


# ============================================================
# SEQCOUNT - 序列计数
# ============================================================

seqcount:
  description: "Sequence Counter - 序列计数"
  header: "linux/seqlock.h"
  icon: "🔢"

  bind_patterns:
    # seqcount_init
    - pattern: 'seqcount_init\s*\(\s*&?(?P<seq>[\w\.\->]+)\s*\)'
      variable_capture: "seq"
      description: "初始化序列计数器"

    # write_seqcount_begin
    - pattern: 'write_seqcount_begin\s*\(\s*&?(?P<seq>[\w\.\->]+)\s*\)'
      variable_capture: "seq"
      description: "开始写入"

    # write_seqcount_end
    - pattern: 'write_seqcount_end\s*\(\s*&?(?P<seq>[\w\.\->]+)\s*\)'
      variable_capture: "seq"
      description: "结束写入"

    # read_seqcount_begin
    - pattern: 'read_seqcount_begin\s*\(\s*&?(?P<seq>[\w\.\->]+)\s*\)'
      variable_capture: "seq"
      description: "开始读取"
      return_type: "unsigned int"

    # read_seqcount_retry
    - pattern: 'read_seqcount_retry\s*\(\s*&?(?P<seq>[\w\.\->]+)\s*,\s*(?P<start>\w+)\s*\)'
      variable_capture: "seq"
      description: "检查是否需要重试"

    # raw_write_seqcount_begin
    - pattern: 'raw_write_seqcount_begin\s*\(\s*&?(?P<seq>[\w\.\->]+)\s*\)'
      variable_capture: "seq"
      description: "开始写入 (无抢占禁用)"

    # raw_write_seqcount_end
    - pattern: 'raw_write_seqcount_end\s*\(\s*&?(?P<seq>[\w\.\->]+)\s*\)'
      variable_capture: "seq"
      description: "结束写入 (无抢占启用)"

  notes:
    - "seqcount 只是计数器，不是锁"
    - "需要外部锁保护写者间同步"
    - "比 seqlock 更灵活"


# ============================================================
# LOCAL LOCKS - 本地锁 (RT 内核)
# ============================================================

local_lock:
  description: "Local Lock - 本地锁 (Per-CPU)"

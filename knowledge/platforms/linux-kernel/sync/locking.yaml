    # DEFINE_LOCAL_IRQ_LOCK - 定义
    - pattern: 'DEFINE_LOCAL_IRQ_LOCK\s*\(\s*(?P<lock>\w+)\s*\)'
      variable_capture: "lock"
      description: "定义本地 IRQ 锁"

    # local_lock
    - pattern: 'local_lock\s*\(\s*&?(?P<lock>[\w\.\->]+)\s*\)'
      variable_capture: "lock"
      description: "获取本地锁"

    # local_unlock
    - pattern: 'local_unlock\s*\(\s*&?(?P<lock>[\w\.\->]+)\s*\)'
      variable_capture: "lock"
      description: "释放本地锁"

    # local_lock_irq
    - pattern: 'local_lock_irq\s*\(\s*&?(?P<lock>[\w\.\->]+)\s*\)'
      variable_capture: "lock"
      description: "获取本地锁并禁用中断"

    # local_unlock_irq
    - pattern: 'local_unlock_irq\s*\(\s*&?(?P<lock>[\w\.\->]+)\s*\)'
      variable_capture: "lock"

    # local_unlock_irqrestore
    - pattern: 'local_unlock_irqrestore\s*\(\s*&?(?P<lock>[\w\.\->]+)\s*,\s*(?P<flags>\w+)\s*\)'
      variable_capture: "lock"
      description: "释放本地锁并恢复中断状态"

  notes:
    - "用于保护 per-CPU 数据"
    - "RT 内核中可以睡眠"

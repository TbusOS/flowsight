# Hardware Monitoring Framework Knowledge Base
# Reference: https://www.kernel.org/doc/html/latest/hwmon/

# ============================================================
# HWMON DEVICE
# ============================================================
hwmon_device:
  description: "Hardware Monitoring Device"
  header: "linux/hwmon.h"
  icon: "🌡️"
  kernel_version: "2.6.18+"
  registration:
    - pattern: 'hwmon_device_register_with_info\s*\(\s*(?P<dev>\w+)\s*,'
      description: "注册 hwmon 设备（推荐）"
    - pattern: 'devm_hwmon_device_register_with_info\s*\(\s*(?P<dev>\w+)\s*,'
      description: "托管注册 hwmon 设备"
    - pattern: 'hwmon_device_register_with_groups\s*\(\s*(?P<dev>\w+)\s*,'
      description: "带属性组注册（旧 API）"
    - pattern: 'hwmon_device_register\s*\(\s*(?P<dev>\w+)\s*\)'
      description: "注册 hwmon 设备（旧 API）"
  unregistration:
    - pattern: 'hwmon_device_unregister\s*\(\s*(?P<hwmon>\w+)\s*\)'
      description: "注销 hwmon 设备"
  structure:
    name: "hwmon_ops"
    callbacks:
      is_visible:
        pattern: '\.is_visible\s*=\s*(?P<handler>\w+)'
        description: "检查属性可见性"
        context: "process"
        can_sleep: false
      read:
        pattern: '\.read\s*=\s*(?P<handler>\w+)'
        description: "读取传感器值"
        context: "process"
        can_sleep: true
      read_string:
        pattern: '\.read_string\s*=\s*(?P<handler>\w+)'
        description: "读取字符串属性"
        context: "process"
        can_sleep: true
      write:
        pattern: '\.write\s*=\s*(?P<handler>\w+)'
        description: "写入属性"
        context: "process"
        can_sleep: true
  sensor_types:
    - hwmon_chip
    - hwmon_temp
    - hwmon_in
    - hwmon_curr
    - hwmon_power
    - hwmon_energy
    - hwmon_humidity
    - hwmon_fan
    - hwmon_pwm
    - hwmon_intrusion

# ============================================================
# HWMON CHANNEL INFO
# ============================================================
hwmon_channel_info:
  description: "Hardware Monitoring Channel"
  header: "linux/hwmon.h"
  icon: "📊"
  macros:
    - pattern: 'HWMON_CHANNEL_INFO\s*\(\s*(?P<type>\w+)\s*,'
      description: "定义 hwmon 通道"
    - pattern: 'HWMON_T_INPUT'
      description: "温度输入"
    - pattern: 'HWMON_T_MAX'
      description: "温度上限"
    - pattern: 'HWMON_T_CRIT'
      description: "临界温度"
    - pattern: 'HWMON_I_INPUT'
      description: "电流输入"
    - pattern: 'HWMON_P_INPUT'
      description: "功率输入"
    - pattern: 'HWMON_F_INPUT'
      description: "风扇转速"

# ============================================================
# THERMAL HWMON
# ============================================================
thermal_hwmon:
  description: "Thermal Zone Hwmon Interface"
  header: "linux/thermal.h"
  icon: "🔥"
  patterns:
    - pattern: 'thermal_add_hwmon_sysfs\s*\(\s*(?P<tz>\w+)\s*\)'
      description: "添加 hwmon sysfs 接口"
    - pattern: 'thermal_remove_hwmon_sysfs\s*\(\s*(?P<tz>\w+)\s*\)'
      description: "移除 hwmon sysfs 接口"

# ============================================================
# REGULATOR HWMON
# ============================================================
regulator_hwmon:
  description: "Regulator Hwmon Interface"
  header: "linux/regulator/consumer.h"
  icon: "⚡"
  patterns:
    - pattern: 'regulator_get_voltage\s*\(\s*(?P<reg>\w+)\s*\)'
      description: "获取电压"
    - pattern: 'regulator_get_current_limit\s*\(\s*(?P<reg>\w+)\s*\)'
      description: "获取电流限制"

# ============================================================
# CALL CHAINS
# ============================================================
call_chains:
  hwmon_probe:
    description: "Hwmon Probe Flow"
    chain:
      - caller: "platform_driver.probe"
        callee: "devm_hwmon_device_register_with_info"
        description: "注册 hwmon 设备"
      - caller: "devm_hwmon_device_register_with_info"
        callee: "__hwmon_device_register"
        description: "实际注册"
      - caller: "__hwmon_device_register"
        callee: "device_register"
        description: "注册到设备模型"
  hwmon_read:
    description: "Hwmon Attribute Read"
    chain:
      - caller: "sysfs read"
        callee: "hwmon_attr_show"
        description: "sysfs 显示函数"
      - caller: "hwmon_attr_show"
        callee: "ops->read"
        description: "调用驱动读取函数"


# ============================================================
# DATA STRUCTURES
# ============================================================

data_structures:
  hwmon_device:
    pattern: 'struct hwmon_device\s*\{'
    description: "hwmon 设备结构"
    file: "drivers/hwmon/hwmon.c"
    fields:
      - name: "id"
        type: "int"
        description: "设备 ID"
      - name: "dev"
        type: "struct device"
        description: "内嵌设备"
      - name: "chip"
        type: "const struct hwmon_chip_info *"
        description: "芯片信息"

  hwmon_chip_info:
    pattern: 'struct hwmon_chip_info\s*\{'
    description: "hwmon 芯片信息"
    file: "include/linux/hwmon.h"
    fields:
      - name: "ops"
        type: "const struct hwmon_ops *"
        description: "操作函数表"
      - name: "info"
        type: "const struct hwmon_channel_info **"
        description: "通道信息数组"

  hwmon_ops:
    pattern: 'struct hwmon_ops\s*\{'
    description: "hwmon 操作结构"
    file: "include/linux/hwmon.h"
    fields:
      - name: "is_visible"
        type: "umode_t (*)(const void *, enum hwmon_sensor_types, u32, int)"
        description: "属性可见性回调"
      - name: "read"
        type: "int (*)(struct device *, enum hwmon_sensor_types, u32, int, long *)"
        description: "读取属性回调"
      - name: "read_string"
        type: "int (*)(struct device *, enum hwmon_sensor_types, u32, int, const char **)"
        description: "读取字符串属性"
      - name: "write"
        type: "int (*)(struct device *, enum hwmon_sensor_types, u32, int, long)"
        description: "写入属性回调"


# ============================================================
# HELPER FUNCTIONS
# ============================================================

helpers:
  - pattern: 'hwmon_device_register_with_info\s*\('
    description: "注册 hwmon 设备（推荐 API）"
    context: "process"
    can_sleep: true

  - pattern: 'devm_hwmon_device_register_with_info\s*\('
    description: "托管注册 hwmon 设备"
    context: "process"
    can_sleep: true

  - pattern: 'hwmon_notify_event\s*\(\s*(?P<dev>\w+)\s*,\s*(?P<type>\w+)\s*,\s*(?P<attr>\w+)\s*,\s*(?P<channel>\w+)\s*\)'
    variable_capture: "dev"
    description: "通知 hwmon 事件"
    context: "any"


# ============================================================
# EXAMPLES
# ============================================================

examples:
  - description: "基本 hwmon 驱动示例 (新 API)"
    kernel_version: "5.0+"
    code: |
      #include <linux/module.h>
      #include <linux/hwmon.h>
      #include <linux/i2c.h>
      
      struct my_sensor {
          struct i2c_client *client;
          struct mutex lock;
      };
      
      static umode_t my_hwmon_is_visible(const void *data,
                                          enum hwmon_sensor_types type,
                                          u32 attr, int channel)
      {
          switch (type) {
          case hwmon_temp:
              switch (attr) {
              case hwmon_temp_input:
              case hwmon_temp_max:
                  return 0444;
              case hwmon_temp_max_alarm:
                  return 0444;
              }
              break;
          case hwmon_in:
              if (attr == hwmon_in_input)
                  return 0444;
              break;
          default:
              break;
          }
          return 0;
      }
      
      static int my_hwmon_read(struct device *dev,
                               enum hwmon_sensor_types type,
                               u32 attr, int channel, long *val)
      {
          struct my_sensor *sensor = dev_get_drvdata(dev);
          int ret;
          
          mutex_lock(&sensor->lock);
          
          switch (type) {
          case hwmon_temp:
              switch (attr) {
              case hwmon_temp_input:
                  ret = i2c_smbus_read_word_data(sensor->client,
                                                  TEMP_REG);
                  if (ret < 0)
                      goto unlock;
                  /* 转换为毫摄氏度 */
                  *val = ((s16)ret * 1000) >> 8;
                  break;
              case hwmon_temp_max:
                  ret = i2c_smbus_read_word_data(sensor->client,
                                                  TEMP_MAX_REG);
                  if (ret < 0)
                      goto unlock;
                  *val = ((s16)ret * 1000) >> 8;
                  break;
              default:
                  ret = -EOPNOTSUPP;
                  goto unlock;
              }
              break;
          case hwmon_in:
              ret = i2c_smbus_read_word_data(sensor->client,
                                              VOLTAGE_REG);
              if (ret < 0)
                  goto unlock;
              /* 转换为毫伏 */
              *val = ret * 2;
              break;
          default:
              ret = -EOPNOTSUPP;
              goto unlock;
          }
          ret = 0;
          
      unlock:
          mutex_unlock(&sensor->lock);
          return ret;
      }
      
      static const struct hwmon_channel_info *my_hwmon_info[] = {
          HWMON_CHANNEL_INFO(temp,
                             HWMON_T_INPUT | HWMON_T_MAX | HWMON_T_MAX_ALARM),
          HWMON_CHANNEL_INFO(in, HWMON_I_INPUT),
          NULL
      };
      
      static const struct hwmon_ops my_hwmon_ops = {
          .is_visible = my_hwmon_is_visible,
          .read       = my_hwmon_read,
      };
      
      static const struct hwmon_chip_info my_chip_info = {
          .ops  = &my_hwmon_ops,
          .info = my_hwmon_info,
      };
      
      static int my_sensor_probe(struct i2c_client *client)
      {
          struct my_sensor *sensor;
          struct device *hwmon_dev;
          
          sensor = devm_kzalloc(&client->dev, sizeof(*sensor), GFP_KERNEL);
          if (!sensor)
              return -ENOMEM;
          
          sensor->client = client;
          mutex_init(&sensor->lock);
          
          hwmon_dev = devm_hwmon_device_register_with_info(
                          &client->dev, "my_sensor", sensor,
                          &my_chip_info, NULL);
          
          return PTR_ERR_OR_ZERO(hwmon_dev);
      }
      
      static const struct i2c_device_id my_sensor_id[] = {
          { "my_sensor", 0 },
          { }
      };
      MODULE_DEVICE_TABLE(i2c, my_sensor_id);
      
      static struct i2c_driver my_sensor_driver = {
          .driver = {
              .name = "my_sensor",
          },
          .probe    = my_sensor_probe,
          .id_table = my_sensor_id,
      };
      module_i2c_driver(my_sensor_driver);

  - description: "带写入功能的 hwmon 驱动"
    kernel_version: "5.0+"
    code: |
      static int my_hwmon_write(struct device *dev,
                                enum hwmon_sensor_types type,
                                u32 attr, int channel, long val)
      {
          struct my_sensor *sensor = dev_get_drvdata(dev);
          int ret = 0;
          
          mutex_lock(&sensor->lock);
          
          switch (type) {
          case hwmon_temp:
              switch (attr) {
              case hwmon_temp_max:
                  val = clamp_val(val, -128000, 127000);
                  ret = i2c_smbus_write_word_data(sensor->client,
                              TEMP_MAX_REG, val * 256 / 1000);
                  break;
              default:
                  ret = -EOPNOTSUPP;
              }
              break;
          default:
              ret = -EOPNOTSUPP;
          }
          
          mutex_unlock(&sensor->lock);
          return ret;
      }
      
      static umode_t my_hwmon_is_visible_rw(const void *data,
                                            enum hwmon_sensor_types type,
                                            u32 attr, int channel)
      {
          switch (type) {
          case hwmon_temp:
              switch (attr) {
              case hwmon_temp_input:
                  return 0444;
              case hwmon_temp_max:
                  return 0644;  /* 可读可写 */
              }
          }
          return 0;
      }
      
      static const struct hwmon_ops my_hwmon_ops_rw = {
          .is_visible = my_hwmon_is_visible_rw,
          .read       = my_hwmon_read,
          .write      = my_hwmon_write,
      };

# ============================================================
# ADDITIONAL DATA STRUCTURES
# ============================================================

hwmon_channel_info_struct:
    pattern: 'struct hwmon_channel_info\s*\{'
    description: "hwmon 通道信息结构"
    file: "include/linux/hwmon.h"
    fields:
      - name: "type"
        type: "enum hwmon_sensor_types"
        description: "传感器类型"
      - name: "config"
        type: "const u32 *"
        description: "属性配置数组"

# ============================================================
# SENSOR TYPE ATTRIBUTES
# ============================================================

sensor_attributes:
  temperature:
    type: "hwmon_temp"
    attributes:
      - HWMON_T_INPUT: "当前温度"
      - HWMON_T_MAX: "最高温度"
      - HWMON_T_MAX_HYST: "最高温度滞后"
      - HWMON_T_MIN: "最低温度"
      - HWMON_T_CRIT: "临界温度"
      - HWMON_T_ALARM: "温度报警"
      - HWMON_T_LABEL: "温度标签"
      - HWMON_T_OFFSET: "温度偏移"

  voltage:
    type: "hwmon_in"
    attributes:
      - HWMON_I_INPUT: "当前电压"
      - HWMON_I_MIN: "最小电压"
      - HWMON_I_MAX: "最大电压"
      - HWMON_I_ALARM: "电压报警"

  fan:
    type: "hwmon_fan"
    attributes:
      - HWMON_F_INPUT: "当前转速"
      - HWMON_F_MIN: "最小转速"
      - HWMON_F_MAX: "最大转速"
      - HWMON_F_TARGET: "目标转速"
      - HWMON_F_ALARM: "风扇报警"

# ============================================================
# ADDITIONAL CALL CHAINS
# ============================================================

  hwmon_write:
    description: "Hwmon Attribute Write"
    chain:
      - caller: "sysfs write"
        callee: "hwmon_attr_store"
        description: "sysfs 存储函数"
      - caller: "hwmon_attr_store"
        callee: "ops->write"
        description: "调用驱动写入函数"

  hwmon_event_notify:
    description: "Hwmon Event Notification"
    chain:
      - caller: "IRQ handler"
        callee: "hwmon_notify_event"
        context: "hardirq/softirq"
        description: "中断触发事件"
      - caller: "hwmon_notify_event"
        callee: "sysfs_notify"
        description: "通知用户空间"

# ============================================================
# THERMAL INTEGRATION
# ============================================================

hwmon_thermal:
  description: "Hwmon Thermal Zone Integration"
  kernel_version: "3.0+"
  patterns:
    - pattern: 'devm_hwmon_device_register_with_info\s*\('
      description: "带热区支持的注册"
  integration:
    description: "当 hwmon 提供温度传感器时自动创建热区"
    config: "CONFIG_THERMAL_HWMON"

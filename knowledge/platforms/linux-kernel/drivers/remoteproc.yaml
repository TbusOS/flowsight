# Remote Processor Framework Knowledge Base
# Reference: https://www.kernel.org/doc/html/latest/staging/remoteproc.html

# ============================================================
# REMOTEPROC
# ============================================================
remoteproc:
  description: "Remote Processor Driver"
  header: "linux/remoteproc.h"
  icon: "🤖"
  kernel_version: "3.4+"
  registration:
    - pattern: 'rproc_alloc\s*\(\s*(?P<dev>\w+)\s*,\s*"(?P<name>[^"]+)"\s*,\s*&(?P<ops>\w+)\s*,'
      description: "分配远程处理器"
    - pattern: 'rproc_add\s*\(\s*(?P<rproc>\w+)\s*\)'
      description: "添加远程处理器"
    - pattern: 'devm_rproc_add\s*\(\s*(?P<dev>\w+)\s*,\s*(?P<rproc>\w+)\s*\)'
      description: "托管添加远程处理器"
  removal:
    - pattern: 'rproc_del\s*\(\s*(?P<rproc>\w+)\s*\)'
      description: "删除远程处理器"
    - pattern: 'rproc_free\s*\(\s*(?P<rproc>\w+)\s*\)'
      description: "释放远程处理器"
  structure:
    name: "rproc_ops"
    callbacks:
      prepare:
        pattern: '\.prepare\s*=\s*(?P<handler>\w+)'
        description: "准备启动"
        context: "process"
        can_sleep: true
      unprepare:
        pattern: '\.unprepare\s*=\s*(?P<handler>\w+)'
        description: "停止后清理"
        context: "process"
        can_sleep: true
      start:
        pattern: '\.start\s*=\s*(?P<handler>\w+)'
        description: "启动远程处理器"
        context: "process"
        can_sleep: true
      stop:
        pattern: '\.stop\s*=\s*(?P<handler>\w+)'
        description: "停止远程处理器"
        context: "process"
        can_sleep: true
      attach:
        pattern: '\.attach\s*=\s*(?P<handler>\w+)'
        description: "附加到运行中的处理器"
        context: "process"
        can_sleep: true
      detach:
        pattern: '\.detach\s*=\s*(?P<handler>\w+)'
        description: "分离处理器"
        context: "process"
        can_sleep: true
      kick:
        pattern: '\.kick\s*=\s*(?P<handler>\w+)'
        description: "触发远程处理器"
        context: "any"
        can_sleep: false
      da_to_va:
        pattern: '\.da_to_va\s*=\s*(?P<handler>\w+)'
        description: "设备地址转虚拟地址"
      load:
        pattern: '\.load\s*=\s*(?P<handler>\w+)'
        description: "加载固件"
      parse_fw:
        pattern: '\.parse_fw\s*=\s*(?P<handler>\w+)'
        description: "解析固件"
      find_loaded_rsc_table:
        pattern: '\.find_loaded_rsc_table\s*=\s*(?P<handler>\w+)'
        description: "查找资源表"
      get_loaded_rsc_table:
        pattern: '\.get_loaded_rsc_table\s*=\s*(?P<handler>\w+)'
        description: "获取资源表"
      sanity_check:
        pattern: '\.sanity_check\s*=\s*(?P<handler>\w+)'
        description: "固件检查"
  helpers:
    - pattern: 'rproc_boot\s*\(\s*(?P<rproc>\w+)\s*\)'
      description: "启动远程处理器"
    - pattern: 'rproc_shutdown\s*\(\s*(?P<rproc>\w+)\s*\)'
      description: "关闭远程处理器"
    - pattern: 'rproc_coredump_add_segment\s*\('
      description: "添加 coredump 段"

# ============================================================
# RPMSG (Remote Processor Messaging)
# ============================================================
rpmsg:
  description: "Remote Processor Messaging"
  header: "linux/rpmsg.h"
  icon: "💬"
  registration:
    - pattern: 'register_rpmsg_driver\s*\(\s*&(?P<driver>\w+)\s*\)'
      description: "注册 rpmsg 驱动"
    - pattern: 'module_rpmsg_driver\s*\(\s*(?P<driver>\w+)\s*\)'
      description: "模块 rpmsg 驱动宏"
  unregistration:
    - pattern: 'unregister_rpmsg_driver\s*\(\s*&(?P<driver>\w+)\s*\)'
      description: "注销 rpmsg 驱动"
  structure:
    name: "rpmsg_driver"
    callbacks:
      probe:
        pattern: '\.probe\s*=\s*(?P<handler>\w+)'
        description: "设备探测"
        context: "process"
        can_sleep: true
      remove:
        pattern: '\.remove\s*=\s*(?P<handler>\w+)'
        description: "设备移除"
        context: "process"
        can_sleep: true
      callback:
        pattern: '\.callback\s*=\s*(?P<handler>\w+)'
        description: "消息接收回调"
        context: "process/softirq"
        can_sleep: false
  helpers:
    - pattern: 'rpmsg_send\s*\(\s*(?P<ept>\w+)\s*,\s*(?P<data>\w+)\s*,\s*(?P<len>\w+)\s*\)'
      description: "发送消息"
    - pattern: 'rpmsg_trysend\s*\(\s*(?P<ept>\w+)\s*,\s*(?P<data>\w+)\s*,\s*(?P<len>\w+)\s*\)'
      description: "尝试发送消息"
    - pattern: 'rpmsg_create_ept\s*\('
      description: "创建端点"
    - pattern: 'rpmsg_destroy_ept\s*\(\s*(?P<ept>\w+)\s*\)'
      description: "销毁端点"

# ============================================================
# CALL CHAINS
# ============================================================
call_chains:
  rproc_boot:
    description: "Remote Processor Boot"
    chain:
      - caller: "rproc_boot"
        callee: "rproc_fw_boot"
        description: "固件启动"
      - caller: "rproc_fw_boot"
        callee: "rproc_ops->prepare"
        description: "准备启动"
      - caller: "rproc_fw_boot"
        callee: "rproc_ops->start"
        description: "启动远程处理器"
  rpmsg_send:
    description: "RPMSG Send Flow"
    chain:
      - caller: "driver"
        callee: "rpmsg_send"
        description: "发送消息"
      - caller: "rpmsg_send"
        callee: "ept->ops->send"
        description: "调用端点发送"
      - caller: "virtqueue"
        callee: "rproc_ops->kick"
        description: "触发远程处理器"


# ============================================================
# DATA STRUCTURES
# ============================================================

data_structures:
  rproc:
    pattern: 'struct rproc\s*\{'
    description: "远程处理器结构"
    file: "include/linux/remoteproc.h"
    fields:
      - name: "name"
        type: "const char *"
        description: "处理器名称"
      - name: "firmware"
        type: "char *"
        description: "固件名称"
      - name: "priv"
        type: "void *"
        description: "驱动私有数据"
      - name: "ops"
        type: "const struct rproc_ops *"
        description: "操作函数表"
      - name: "dev"
        type: "struct device"
        description: "内嵌设备"
      - name: "state"
        type: "atomic_t"
        description: "处理器状态"
      - name: "power"
        type: "unsigned int"
        description: "引用计数"
      - name: "cached_table"
        type: "struct resource_table *"
        description: "缓存的资源表"
      - name: "table_ptr"
        type: "struct resource_table *"
        description: "资源表指针"
      - name: "max_notifyid"
        type: "int"
        description: "最大通知 ID"
      - name: "rvdevs"
        type: "struct list_head"
        description: "virtio 设备列表"
      - name: "subdevs"
        type: "struct list_head"
        description: "子设备列表"
      - name: "boot_work"
        type: "struct work_struct"
        description: "启动工作队列"

  rproc_ops:
    pattern: 'struct rproc_ops\s*\{'
    description: "远程处理器操作"
    file: "include/linux/remoteproc.h"
    fields:
      - name: "prepare"
        type: "callback"
        description: "准备启动"
      - name: "unprepare"
        type: "callback"
        description: "停止后清理"
      - name: "start"
        type: "callback"
        description: "启动处理器"
      - name: "stop"
        type: "callback"
        description: "停止处理器"
      - name: "kick"
        type: "callback"
        description: "触发处理器"
      - name: "da_to_va"
        type: "callback"
        description: "地址转换"
      - name: "load"
        type: "callback"
        description: "加载固件"


# ============================================================
# EXAMPLES
# ============================================================

examples:
  - description: "基本 remoteproc 驱动示例"
    kernel_version: "5.0+"
    code: |
      #include <linux/module.h>
      #include <linux/remoteproc.h>
      #include <linux/platform_device.h>
      
      struct my_rproc {
          struct rproc *rproc;
          void __iomem *regs;
          int irq;
      };
      
      static int my_rproc_prepare(struct rproc *rproc)
      {
          struct my_rproc *priv = rproc->priv;
          
          /* 准备工作，如时钟、电源 */
          clk_prepare_enable(priv->clk);
          return 0;
      }
      
      static int my_rproc_unprepare(struct rproc *rproc)
      {
          struct my_rproc *priv = rproc->priv;
          
          clk_disable_unprepare(priv->clk);
          return 0;
      }
      
      static int my_rproc_start(struct rproc *rproc)
      {
          struct my_rproc *priv = rproc->priv;
          
          /* 解除复位，启动远程处理器 */
          writel(1, priv->regs + BOOT_REG);
          return 0;
      }
      
      static int my_rproc_stop(struct rproc *rproc)
      {
          struct my_rproc *priv = rproc->priv;
          
          /* 复位远程处理器 */
          writel(0, priv->regs + BOOT_REG);
          return 0;
      }
      
      static void my_rproc_kick(struct rproc *rproc, int vqid)
      {
          struct my_rproc *priv = rproc->priv;
          
          /* 通知远程处理器有新消息 */
          writel(1 << vqid, priv->regs + KICK_REG);
      }
      
      static void *my_rproc_da_to_va(struct rproc *rproc,
                                      u64 da, size_t len, bool *is_iomem)
      {
          /* 设备地址转虚拟地址 */
          /* 实现取决于具体硬件 */
          return NULL;
      }
      
      static const struct rproc_ops my_rproc_ops = {
          .prepare    = my_rproc_prepare,
          .unprepare  = my_rproc_unprepare,
          .start      = my_rproc_start,
          .stop       = my_rproc_stop,
          .kick       = my_rproc_kick,
          .da_to_va   = my_rproc_da_to_va,
      };
      
      static irqreturn_t my_rproc_irq(int irq, void *data)
      {
          struct rproc *rproc = data;
          struct my_rproc *priv = rproc->priv;
          u32 status;
          
          status = readl(priv->regs + INT_STATUS);
          
          /* 处理 virtqueue 中断 */
          if (status & VRING_IRQ_MASK) {
              rproc_vq_interrupt(rproc, 0);
              rproc_vq_interrupt(rproc, 1);
          }
          
          writel(status, priv->regs + INT_CLEAR);
          return IRQ_HANDLED;
      }
      
      static int my_rproc_probe(struct platform_device *pdev)
      {
          struct my_rproc *priv;
          struct rproc *rproc;
          int ret;
          
          rproc = rproc_alloc(&pdev->dev, "my-rproc",
                              &my_rproc_ops, "my_firmware.elf",
                              sizeof(*priv));
          if (!rproc)
              return -ENOMEM;
          
          priv = rproc->priv;
          priv->rproc = rproc;
          
          priv->regs = devm_platform_ioremap_resource(pdev, 0);
          if (IS_ERR(priv->regs)) {
              ret = PTR_ERR(priv->regs);
              goto free_rproc;
          }
          
          priv->irq = platform_get_irq(pdev, 0);
          ret = devm_request_irq(&pdev->dev, priv->irq,
                                  my_rproc_irq, 0, "my-rproc", rproc);
          if (ret)
              goto free_rproc;
          
          platform_set_drvdata(pdev, priv);
          
          ret = rproc_add(rproc);
          if (ret)
              goto free_rproc;
          
          return 0;
          
      free_rproc:
          rproc_free(rproc);
          return ret;
      }
      
      static int my_rproc_remove(struct platform_device *pdev)
      {
          struct my_rproc *priv = platform_get_drvdata(pdev);
          
          rproc_del(priv->rproc);
          rproc_free(priv->rproc);
          return 0;
      }
      
      static struct platform_driver my_rproc_driver = {
          .probe  = my_rproc_probe,
          .remove = my_rproc_remove,
          .driver = {
              .name = "my-rproc",
          },
      };
      module_platform_driver(my_rproc_driver);

  - description: "RPMSG 设备驱动示例"
    kernel_version: "4.0+"
    code: |
      #include <linux/module.h>
      #include <linux/rpmsg.h>
      
      struct my_rpmsg_dev {
          struct rpmsg_device *rpdev;
          struct completion done;
          char rx_buf[256];
      };
      
      static int my_rpmsg_callback(struct rpmsg_device *rpdev,
                                    void *data, int len,
                                    void *priv, u32 src)
      {
          struct my_rpmsg_dev *mdev = dev_get_drvdata(&rpdev->dev);
          
          dev_info(&rpdev->dev, "rx: %d bytes from 0x%x\n", len, src);
          
          if (len < sizeof(mdev->rx_buf)) {
              memcpy(mdev->rx_buf, data, len);
              mdev->rx_buf[len] = '\0';
          }
          
          complete(&mdev->done);
          return 0;
      }
      
      static int my_rpmsg_probe(struct rpmsg_device *rpdev)
      {
          struct my_rpmsg_dev *mdev;
          
          mdev = devm_kzalloc(&rpdev->dev, sizeof(*mdev), GFP_KERNEL);
          if (!mdev)
              return -ENOMEM;
          
          mdev->rpdev = rpdev;
          init_completion(&mdev->done);
          dev_set_drvdata(&rpdev->dev, mdev);
          
          rpmsg_send(rpdev->ept, "hello", 5);
          return 0;
      }
      
      static struct rpmsg_device_id my_rpmsg_id_table[] = {
          { .name = "my-channel" },
          { },
      };
      MODULE_DEVICE_TABLE(rpmsg, my_rpmsg_id_table);
      
      static struct rpmsg_driver my_rpmsg_driver = {
          .probe    = my_rpmsg_probe,
          .callback = my_rpmsg_callback,
          .id_table = my_rpmsg_id_table,
          .drv.name = "my-rpmsg",
      };
      module_rpmsg_driver(my_rpmsg_driver);

# ============================================================
# ADDITIONAL DATA STRUCTURES
# ============================================================

rpmsg_device:
    pattern: 'struct rpmsg_device\s*\{'
    description: "RPMSG 设备结构"
    file: "include/linux/rpmsg.h"
    fields:
      - name: "dev"
        type: "struct device"
        description: "内嵌设备"
      - name: "id"
        type: "struct rpmsg_device_id"
        description: "设备标识"
      - name: "src"
        type: "u32"
        description: "源地址"
      - name: "dst"
        type: "u32"
        description: "目标地址"
      - name: "ept"
        type: "struct rpmsg_endpoint *"
        description: "关联端点"
      - name: "ops"
        type: "const struct rpmsg_device_ops *"
        description: "设备操作"

rpmsg_endpoint:
  pattern: 'struct rpmsg_endpoint\s*\{'
  description: "RPMSG 端点结构"
  file: "include/linux/rpmsg.h"
  fields:
    - name: "rpdev"
      type: "struct rpmsg_device *"
      description: "关联设备"
    - name: "cb"
      type: "rpmsg_rx_cb_t"
      description: "接收回调"
    - name: "addr"
      type: "u32"
      description: "端点地址"
    - name: "priv"
      type: "void *"
      description: "私有数据"

# ============================================================
# RESOURCE TABLE
# ============================================================

resource_table:
  description: "Remote Processor Resource Table"
  header: "linux/remoteproc.h"
  icon: "📋"

  resource_types:
    RSC_CARVEOUT:
      value: 0
      description: "Carveout 内存（连续物理内存）"
    RSC_DEVMEM:
      value: 1
      description: "设备内存映射"
    RSC_TRACE:
      value: 2
      description: "跟踪缓冲区"
    RSC_VDEV:
      value: 3
      description: "Virtio 设备"

# ============================================================
# ADDITIONAL CALL CHAINS
# ============================================================

additional_call_chains:
  rproc_crash:
    description: "Remote Processor Crash Recovery"
    chain:
      - caller: "driver/watchdog"
        callee: "rproc_report_crash"
        context: "any"
        description: "报告崩溃"
      - caller: "rproc_report_crash"
        callee: "rproc_trigger_recovery"
        async: true
        mechanism: "workqueue"
        description: "触发恢复"
      - caller: "rproc_trigger_recovery"
        callee: "rproc_ops->stop"
        description: "停止处理器"
      - caller: "rproc_trigger_recovery"
        callee: "rproc_ops->start"
        description: "重启处理器"

  rpmsg_recv:
    description: "RPMSG Receive Flow"
    chain:
      - caller: "virtqueue callback"
        callee: "rpmsg_recv_single"
        context: "softirq"
        description: "接收单个消息"
      - caller: "rpmsg_recv_single"
        callee: "rpmsg_endpoint->cb"
        description: "调用端点回调"

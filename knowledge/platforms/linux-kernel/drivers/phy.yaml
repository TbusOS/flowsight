# Linux Kernel Generic PHY Driver Framework Knowledge Base
#
# Reference: https://www.kernel.org/doc/html/latest/driver-api/phy/phy.html
#
# Note: 这是 Generic PHY 框架 (linux/phy/phy.h)，用于 USB PHY、SATA PHY、PCIe PHY 等
#       不是网络 PHY 框架 (linux/phy.h)，那是用于以太网 PHY 的

# ============================================================
# PHY STRUCTURE
# ============================================================

phy:
  description: "Generic PHY Device - 通用 PHY 设备"
  header: "linux/phy/phy.h"
  icon: "🔌"
  kernel_version: "3.13+"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  structure:
    pattern: 'struct phy\s*\{'
    description: "PHY 设备结构体"
    fields:
      - name: "dev"
        type: "struct device"
        description: "内嵌设备结构"
      - name: "id"
        type: "int"
        description: "PHY 设备 ID"
      - name: "ops"
        type: "const struct phy_ops *"
        description: "PHY 操作函数集"
      - name: "mutex"
        type: "struct mutex"
        description: "保护 PHY 操作的互斥锁"
      - name: "init_count"
        type: "int"
        description: "初始化引用计数"
      - name: "power_count"
        type: "int"
        description: "电源引用计数"
      - name: "attrs"
        type: "struct phy_attrs"
        description: "PHY 属性"
      - name: "pwr"
        type: "struct regulator *"
        description: "PHY 电源 regulator"


# ============================================================
# PHY MODE
# ============================================================

phy_mode:
  description: "PHY Mode - PHY 工作模式"
  header: "linux/phy/phy.h"
  icon: "🔀"

  modes:
    - name: "PHY_MODE_INVALID"
      value: 0
      description: "无效模式"
    - name: "PHY_MODE_USB_HOST"
      value: 1
      description: "USB Host 模式"
    - name: "PHY_MODE_USB_DEVICE"
      value: 2
      description: "USB Device 模式"
    - name: "PHY_MODE_USB_OTG"
      value: 3
      description: "USB OTG 模式"
    - name: "PHY_MODE_SGMII"
      value: 4
      description: "SGMII 串行千兆媒体独立接口"
    - name: "PHY_MODE_10GKR"
      value: 5
      description: "10GBase-KR 背板接口"
    - name: "PHY_MODE_UFS_HS_A"
      description: "UFS High Speed A 模式"
    - name: "PHY_MODE_UFS_HS_B"
      description: "UFS High Speed B 模式"
    - name: "PHY_MODE_PCIE"
      description: "PCIe 模式"
    - name: "PHY_MODE_ETHERNET"
      description: "以太网模式"
    - name: "PHY_MODE_MIPI_DPHY"
      description: "MIPI D-PHY 模式"
    - name: "PHY_MODE_SATA"
      description: "SATA 模式"


# ============================================================
# PHY OPERATIONS
# ============================================================

phy_ops:
  description: "PHY Operations - PHY 操作函数集"
  header: "linux/phy/phy.h"
  icon: "⚙️"

  structure:
    pattern: 'static const struct phy_ops\s+(?P<name>\w+)\s*=\s*\{'
    description: "PHY 操作结构体定义"
    fields:
      - name: "init"
        type: "int (*)(struct phy *)"
        description: "PHY 初始化"
        optional: true
      - name: "exit"
        type: "int (*)(struct phy *)"
        description: "PHY 退出/清理"
        optional: true
      - name: "power_on"
        type: "int (*)(struct phy *)"
        description: "打开 PHY 电源"
        optional: true
      - name: "power_off"
        type: "int (*)(struct phy *)"
        description: "关闭 PHY 电源"
        optional: true
      - name: "set_mode"
        type: "int (*)(struct phy *, enum phy_mode)"
        description: "设置 PHY 工作模式"
        optional: true
      - name: "reset"
        type: "int (*)(struct phy *)"
        description: "复位 PHY"
        optional: true
      - name: "owner"
        type: "struct module *"
        description: "模块所有者"
        mandatory: true

  callbacks:
    init:
      pattern: '\.init\s*=\s*(?P<handler>\w+)'
      description: "PHY 初始化回调"
      trigger: "消费者调用 phy_init()"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct phy *phy)"
      return_value:
        success: "0"
        failure: "-ERRNO"
      typical_actions:
        - "配置 PHY 寄存器"
        - "设置时钟"
        - "初始化 PLL"
        - "配置信号参数"
      note: "使用引用计数，只有第一次调用时执行"

    exit:
      pattern: '\.exit\s*=\s*(?P<handler>\w+)'
      description: "PHY 退出回调"
      trigger: "消费者调用 phy_exit()"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct phy *phy)"
      return_value:
        success: "0"
        failure: "-ERRNO"
      typical_actions:
        - "禁用 PHY"
        - "释放资源"
        - "停止时钟"
      note: "使用引用计数，只有最后一次调用时执行"

    power_on:
      pattern: '\.power_on\s*=\s*(?P<handler>\w+)'
      description: "PHY 电源打开回调"
      trigger: "消费者调用 phy_power_on()"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct phy *phy)"
      return_value:
        success: "0"
        failure: "-ERRNO"
      typical_actions:
        - "使能电源 regulator"
        - "取消时钟门控"
        - "等待 PLL 锁定"
        - "等待 PHY 就绪"
      note: "使用引用计数，只有第一次调用时执行"

    power_off:
      pattern: '\.power_off\s*=\s*(?P<handler>\w+)'
      description: "PHY 电源关闭回调"
      trigger: "消费者调用 phy_power_off()"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct phy *phy)"
      return_value:
        success: "0"
        failure: "-ERRNO"
      typical_actions:
        - "禁用电源 regulator"
        - "门控时钟"
        - "进入低功耗状态"
      note: "使用引用计数，只有最后一次调用时执行"

    set_mode:
      pattern: '\.set_mode\s*=\s*(?P<handler>\w+)'
      description: "设置 PHY 模式回调"
      trigger: "消费者调用 phy_set_mode()"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct phy *phy, enum phy_mode mode)"
      return_value:
        success: "0"
        failure: "-ERRNO (如 -ENOTSUPP)"
      typical_actions:
        - "配置 USB Host/Device/OTG 模式"
        - "切换 SGMII/RGMII 等接口模式"
        - "更新 PHY 配置寄存器"

    reset:
      pattern: '\.reset\s*=\s*(?P<handler>\w+)'
      description: "PHY 复位回调"
      trigger: "消费者调用 phy_reset()"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct phy *phy)"
      return_value:
        success: "0"
        failure: "-ERRNO"
      typical_actions:
        - "触发硬件复位"
        - "等待复位完成"
        - "重新初始化 PHY"


# ============================================================
# PHY PROVIDER API
# ============================================================

phy_provider:
  description: "PHY Provider API - PHY 提供者 API"
  header: "linux/phy/phy.h"
  icon: "🏭"

  overview: |
    PHY 提供者是创建和管理 PHY 设备的驱动。
    它负责注册 PHY 到框架，以便消费者可以获取和使用。

  structure:
    pattern: 'struct phy_provider\s*\{'
    description: "PHY 提供者结构体"
    fields:
      - name: "dev"
        type: "struct device *"
        description: "设备指针"
      - name: "children"
        type: "struct device_node *"
        description: "子设备树节点"
      - name: "owner"
        type: "struct module *"
        description: "模块所有者"
      - name: "list"
        type: "struct list_head"
        description: "链表节点"
      - name: "of_xlate"
        type: "struct phy * (*)(struct device *, struct of_phandle_args *)"
        description: "设备树到 PHY 的转换函数"

  create_functions:
    - pattern: 'phy_create\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<node>[^,]+)\s*,\s*&(?P<ops>\w+)\s*\)'
      description: "创建 PHY 设备"
      signature: "struct phy *phy_create(struct device *dev, struct device_node *node, const struct phy_ops *ops)"
      context: "process"
      can_sleep: true
      return_value:
        success: "有效的 phy 指针"
        failure: "ERR_PTR(-ERRNO)"

    - pattern: 'devm_phy_create\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<node>[^,]+)\s*,\s*&(?P<ops>\w+)\s*\)'
      description: "资源管理方式创建 PHY 设备 (推荐)"
      signature: "struct phy *devm_phy_create(struct device *dev, struct device_node *node, const struct phy_ops *ops)"
      context: "process"
      can_sleep: true

    - pattern: 'phy_destroy\s*\(\s*(?P<phy>[^)]+)\s*\)'
      description: "销毁 PHY 设备"
      signature: "void phy_destroy(struct phy *phy)"
      note: "使用 devm_* 版本时不需要调用"

  register_functions:
    - pattern: 'of_phy_provider_register\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<xlate>[^)]+)\s*\)'
      description: "注册 PHY 提供者"
      signature: "宏，展开为 __of_phy_provider_register(dev, NULL, THIS_MODULE, xlate)"

    - pattern: 'devm_of_phy_provider_register\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<xlate>[^)]+)\s*\)'
      description: "资源管理方式注册 PHY 提供者 (推荐)"
      signature: "宏，展开为 __devm_of_phy_provider_register(dev, NULL, THIS_MODULE, xlate)"

    - pattern: 'of_phy_simple_xlate\s*\('
      description: "简单的 of_xlate 实现，用于单 PHY 情况"
      signature: "struct phy *of_phy_simple_xlate(struct device *dev, struct of_phandle_args *args)"

  helper_functions:
    - pattern: 'phy_set_drvdata\s*\(\s*(?P<phy>[^,]+)\s*,\s*(?P<data>[^)]+)\s*\)'
      description: "设置 PHY 驱动私有数据"
    - pattern: 'phy_get_drvdata\s*\(\s*(?P<phy>[^)]+)\s*\)'
      description: "获取 PHY 驱动私有数据"
    - pattern: 'phy_get_bus_width\s*\(\s*(?P<phy>[^)]+)\s*\)'
      description: "获取 PHY 总线宽度"
    - pattern: 'phy_set_bus_width\s*\(\s*(?P<phy>[^,]+)\s*,\s*(?P<width>[^)]+)\s*\)'
      description: "设置 PHY 总线宽度"


# ============================================================
# PHY CONSUMER API
# ============================================================

phy_consumer:
  description: "PHY Consumer API - PHY 消费者 API"
  header: "linux/phy/phy.h"
  icon: "📥"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  get_functions:
    - pattern: 'phy_get\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<name>[^)]+)\s*\)'
      description: "获取 PHY"
      signature: "struct phy *phy_get(struct device *dev, const char *string)"
      context: "process"
      can_sleep: true
      return_value:
        success: "有效的 phy 指针"
        failure: "ERR_PTR(-ERRNO)"

    - pattern: 'phy_optional_get\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<name>[^)]+)\s*\)'
      description: "可选获取 PHY"
      signature: "struct phy *phy_optional_get(struct device *dev, const char *string)"
      return_value:
        success: "有效的 phy 指针"
        not_found: "NULL (不是错误)"
        failure: "ERR_PTR(-ERRNO)"

    - pattern: 'devm_phy_get\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<name>[^)]+)\s*\)'
      description: "资源管理获取 PHY (推荐)"
      signature: "struct phy *devm_phy_get(struct device *dev, const char *string)"
      context: "process"
      can_sleep: true

    - pattern: 'devm_phy_optional_get\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<name>[^)]+)\s*\)'
      description: "资源管理可选获取 PHY"
      signature: "struct phy *devm_phy_optional_get(struct device *dev, const char *string)"

    - pattern: 'devm_of_phy_get\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<np>[^,]+)\s*,\s*(?P<name>[^)]+)\s*\)'
      description: "从特定设备树节点获取 PHY"
      signature: "struct phy *devm_of_phy_get(struct device *dev, struct device_node *np, const char *con_id)"

    - pattern: 'devm_of_phy_get_by_index\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<np>[^,]+)\s*,\s*(?P<index>[^)]+)\s*\)'
      description: "按索引从设备树获取 PHY"
      signature: "struct phy *devm_of_phy_get_by_index(struct device *dev, struct device_node *np, int index)"

  put_functions:
    - pattern: 'phy_put\s*\(\s*(?P<phy>[^)]+)\s*\)'
      description: "释放 PHY"
      signature: "void phy_put(struct phy *phy)"
      note: "使用 devm_* 版本时不需要调用"

    - pattern: 'devm_phy_put\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<phy>[^)]+)\s*\)'
      description: "资源管理释放 PHY"
      signature: "void devm_phy_put(struct device *dev, struct phy *phy)"


# ============================================================
# PHY OPERATIONS API
# ============================================================

phy_operations:
  description: "PHY Operations API - PHY 操作 API"
  header: "linux/phy/phy.h"
  icon: "▶️"

  operations:
    - pattern: 'phy_init\s*\(\s*(?P<phy>[^)]+)\s*\)'
      description: "初始化 PHY"
      signature: "int phy_init(struct phy *phy)"
      context: "process"
      can_sleep: true
      return_value:
        success: "0"
        failure: "-ERRNO"
      note: "引用计数管理，多次调用安全"

    - pattern: 'phy_exit\s*\(\s*(?P<phy>[^)]+)\s*\)'
      description: "退出 PHY"
      signature: "int phy_exit(struct phy *phy)"
      context: "process"
      can_sleep: true
      return_value:
        success: "0"
        failure: "-ERRNO"

    - pattern: 'phy_power_on\s*\(\s*(?P<phy>[^)]+)\s*\)'
      description: "打开 PHY 电源"
      signature: "int phy_power_on(struct phy *phy)"
      context: "process"
      can_sleep: true
      return_value:
        success: "0"
        failure: "-ERRNO"
      note: "引用计数管理，多次调用安全"

    - pattern: 'phy_power_off\s*\(\s*(?P<phy>[^)]+)\s*\)'
      description: "关闭 PHY 电源"
      signature: "int phy_power_off(struct phy *phy)"
      context: "process"
      can_sleep: true
      return_value:
        success: "0"
        failure: "-ERRNO"

    - pattern: 'phy_set_mode\s*\(\s*(?P<phy>[^,]+)\s*,\s*(?P<mode>[^)]+)\s*\)'
      description: "设置 PHY 模式"
      signature: "int phy_set_mode(struct phy *phy, enum phy_mode mode)"
      context: "process"
      can_sleep: true
      return_value:
        success: "0"
        failure: "-ERRNO"

    - pattern: 'phy_reset\s*\(\s*(?P<phy>[^)]+)\s*\)'
      description: "复位 PHY"
      signature: "int phy_reset(struct phy *phy)"
      context: "process"
      can_sleep: true
      return_value:
        success: "0"
        failure: "-ERRNO"

  pm_functions:
    - pattern: 'phy_pm_runtime_get\s*\(\s*(?P<phy>[^)]+)\s*\)'
      description: "PM runtime get (异步)"
      signature: "int phy_pm_runtime_get(struct phy *phy)"

    - pattern: 'phy_pm_runtime_get_sync\s*\(\s*(?P<phy>[^)]+)\s*\)'
      description: "PM runtime get (同步)"
      signature: "int phy_pm_runtime_get_sync(struct phy *phy)"

    - pattern: 'phy_pm_runtime_put\s*\(\s*(?P<phy>[^)]+)\s*\)'
      description: "PM runtime put (异步)"
      signature: "int phy_pm_runtime_put(struct phy *phy)"

    - pattern: 'phy_pm_runtime_put_sync\s*\(\s*(?P<phy>[^)]+)\s*\)'
      description: "PM runtime put (同步)"
      signature: "int phy_pm_runtime_put_sync(struct phy *phy)"


# ============================================================
# PHY TYPES AND USE CASES
# ============================================================

phy_types:
  description: "PHY Types and Use Cases - PHY 类型和使用场景"
  icon: "📋"

  types:
    usb_phy:
      description: "USB PHY"
      modes: ["PHY_MODE_USB_HOST", "PHY_MODE_USB_DEVICE", "PHY_MODE_USB_OTG"]
      use_cases:
        - "USB 2.0 High Speed PHY"
        - "USB 3.0 SuperSpeed PHY"
        - "USB Type-C PHY"
      typical_consumers:
        - "USB Host Controller Driver"
        - "USB Gadget/Device Controller Driver"
        - "USB OTG Driver"
      example_binding: |
        usb_phy: phy@12340000 {
            compatible = "vendor,usb-phy";
            reg = <0x12340000 0x1000>;
            #phy-cells = <0>;
        };

        usb@12350000 {
            compatible = "vendor,usb-host";
            phys = <&usb_phy>;
            phy-names = "usb-phy";
        };

    pcie_phy:
      description: "PCIe PHY"
      modes: ["PHY_MODE_PCIE"]
      use_cases:
        - "PCIe Gen1/Gen2/Gen3/Gen4 PHY"
        - "PCIe x1/x4/x8/x16 PHY"
      typical_consumers:
        - "PCIe Host Controller Driver"
        - "PCIe Endpoint Controller Driver"
      example_binding: |
        pcie_phy: phy@12360000 {
            compatible = "vendor,pcie-phy";
            reg = <0x12360000 0x1000>;
            #phy-cells = <0>;
        };

        pcie@12370000 {
            compatible = "vendor,pcie-host";
            phys = <&pcie_phy>;
            phy-names = "pcie-phy";
        };

    sata_phy:
      description: "SATA PHY"
      modes: ["PHY_MODE_SATA"]
      use_cases:
        - "SATA I/II/III PHY"
        - "AHCI Controller PHY"
      typical_consumers:
        - "AHCI SATA Controller Driver"
      example_binding: |
        sata_phy: phy@12380000 {
            compatible = "vendor,sata-phy";
            reg = <0x12380000 0x1000>;
            #phy-cells = <0>;
        };

        sata@12390000 {
            compatible = "vendor,ahci";
            phys = <&sata_phy>;
            phy-names = "sata-phy";
        };

    serdes_phy:
      description: "SerDes PHY (多协议)"
      modes: ["PHY_MODE_PCIE", "PHY_MODE_SATA", "PHY_MODE_SGMII"]
      use_cases:
        - "可配置 SerDes Lane"
        - "多协议支持 (PCIe/SATA/SGMII)"
      typical_consumers:
        - "多种控制器，取决于配置"
      note: "使用 phy_set_mode() 切换协议"

    mipi_phy:
      description: "MIPI D-PHY"
      modes: ["PHY_MODE_MIPI_DPHY"]
      use_cases:
        - "Camera/Display 接口"
        - "MIPI CSI/DSI"
      typical_consumers:
        - "MIPI CSI-2 Camera Driver"
        - "MIPI DSI Display Driver"


# ============================================================
# PHY CALL CHAINS
# ============================================================

call_chains:
  phy_init_flow:
    description: "phy_init() 调用链"
    trigger: "消费者驱动调用 phy_init()"
    chain:
      - function: "phy_init"
        file: "drivers/phy/phy-core.c"
        description: "消费者 API 入口"
        context: "process"
      - function: "mutex_lock"
        file: "drivers/phy/phy-core.c"
        description: "获取 PHY 互斥锁"
      - function: "phy->init_count++ check"
        description: "检查引用计数，仅首次调用继续"
      - function: "phy->ops->init"
        file: "用户驱动代码"
        description: "调用 PHY 驱动的 init 回调"
        is_user_entry: true
      - function: "mutex_unlock"
        file: "drivers/phy/phy-core.c"
        description: "释放 PHY 互斥锁"

  phy_power_on_flow:
    description: "phy_power_on() 调用链"
    trigger: "消费者驱动调用 phy_power_on()"
    chain:
      - function: "phy_power_on"
        file: "drivers/phy/phy-core.c"
        description: "消费者 API 入口"
        context: "process"
      - function: "mutex_lock"
        file: "drivers/phy/phy-core.c"
        description: "获取 PHY 互斥锁"
      - function: "phy->power_count++ check"
        description: "检查引用计数"
      - function: "phy_pm_runtime_get_sync"
        file: "drivers/phy/phy-core.c"
        description: "PM runtime 唤醒"
      - function: "regulator_enable"
        file: "drivers/regulator/core.c"
        description: "使能电源 regulator (如果有)"
      - function: "phy->ops->power_on"
        file: "用户驱动代码"
        description: "调用 PHY 驱动的 power_on 回调"
        is_user_entry: true
      - function: "mutex_unlock"
        file: "drivers/phy/phy-core.c"
        description: "释放 PHY 互斥锁"

  phy_get_flow:
    description: "devm_phy_get() 调用链"
    trigger: "消费者驱动 probe 时获取 PHY"
    chain:
      - function: "my_device_probe"
        file: "用户驱动代码"
        description: "消费者驱动探测函数"
        context: "process"
        is_user_entry: true
      - function: "devm_phy_get"
        file: "drivers/phy/phy-core.c"
        description: "获取 PHY"
      - function: "_of_phy_get"
        file: "drivers/phy/phy-core.c"
        description: "从设备树解析 PHY 信息"
      - function: "phy_provider->of_xlate"
        file: "用户驱动代码"
        description: "转换设备树参数到 PHY"
        is_user_entry: true

  phy_provider_registration_flow:
    description: "PHY 提供者注册调用链"
    trigger: "PHY 驱动 probe 函数调用注册"
    chain:
      - function: "my_phy_probe"
        file: "用户驱动代码"
        description: "PHY 驱动探测函数"
        context: "process"
        is_user_entry: true
      - function: "devm_phy_create"
        file: "drivers/phy/phy-core.c"
        description: "创建 PHY 设备"
      - function: "device_create"

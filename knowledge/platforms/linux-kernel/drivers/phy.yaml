# ============================================================
# PHY DEVICE TREE BINDING
# ============================================================

device_tree:
  description: "Device Tree Binding - 设备树绑定"
  icon: "🌳"

  provider_binding:
    description: "PHY 提供者设备树节点"
    example: |
      /* 单 PHY 提供者 */
      usb_phy: phy@12340000 {
          compatible = "vendor,usb-phy";
          reg = <0x12340000 0x1000>;
          clocks = <&clk_phy>;
          resets = <&reset_ctrl 0>;
          #phy-cells = <0>;  /* 无参数 */
      };

      /* 多 PHY 提供者 */
      combo_phy: phy@12350000 {
          compatible = "vendor,combo-phy";
          reg = <0x12350000 0x2000>;
          #phy-cells = <1>;  /* 需要一个参数指定 PHY */

          /* 子节点方式 */
          usb_phy: usb-phy {
              #phy-cells = <0>;
          };
          pcie_phy: pcie-phy {
              #phy-cells = <0>;
          };
      };

  consumer_binding:
    description: "PHY 消费者设备树节点"
    example: |
      /* 单 PHY 消费者 */
      usb@12360000 {
          compatible = "vendor,usb-host";
          reg = <0x12360000 0x1000>;
          phys = <&usb_phy>;
          phy-names = "usb-phy";
      };

      /* 多 PHY 消费者 */
      usb@12370000 {
          compatible = "vendor,usb3-host";
          reg = <0x12370000 0x1000>;
          phys = <&usb2_phy>, <&usb3_phy>;
          phy-names = "usb2-phy", "usb3-phy";
      };


# ============================================================
# PHY EXAMPLES
# ============================================================

examples:
  - description: "完整 USB PHY 驱动示例"
    kernel_version: "4.0+"
    code: |
      #include <linux/module.h>
      #include <linux/platform_device.h>
      #include <linux/phy/phy.h>
      #include <linux/io.h>
      #include <linux/clk.h>
      #include <linux/reset.h>
      #include <linux/regulator/consumer.h>
      #include <linux/delay.h>

      #define PHY_CTRL    0x00
      #define PHY_STATUS  0x04
      #define PHY_CFG     0x08

      #define PHY_EN      BIT(0)
      #define PHY_READY   BIT(0)
      #define PHY_MODE_MASK   GENMASK(3, 1)
      #define PHY_MODE_HOST   (0 << 1)
      #define PHY_MODE_DEV    (1 << 1)
      #define PHY_MODE_OTG    (2 << 1)

      struct my_usb_phy {
          void __iomem *base;
          struct phy *phy;
          struct clk *clk;
          struct reset_control *rst;
          struct regulator *vdd;
          enum phy_mode mode;
      };

      static int my_usb_phy_init(struct phy *phy)
      {
          struct my_usb_phy *priv = phy_get_drvdata(phy);
          int ret;

          /* 使能时钟 */
          ret = clk_prepare_enable(priv->clk);
          if (ret)
              return ret;

          /* 解除复位 */
          ret = reset_control_deassert(priv->rst);
          if (ret) {
              clk_disable_unprepare(priv->clk);
              return ret;
          }

          /* 初始化 PHY 寄存器 */
          writel(0x12345678, priv->base + PHY_CFG);

          return 0;
      }

      static int my_usb_phy_exit(struct phy *phy)
      {
          struct my_usb_phy *priv = phy_get_drvdata(phy);

          /* 断言复位 */
          reset_control_assert(priv->rst);

          /* 禁用时钟 */
          clk_disable_unprepare(priv->clk);

          return 0;
      }

      static int my_usb_phy_power_on(struct phy *phy)
      {
          struct my_usb_phy *priv = phy_get_drvdata(phy);
          u32 val;
          int ret, timeout = 1000;

          /* 使能电源 */
          ret = regulator_enable(priv->vdd);
          if (ret)
              return ret;

          /* 使能 PHY */
          val = readl(priv->base + PHY_CTRL);
          val |= PHY_EN;
          writel(val, priv->base + PHY_CTRL);

          /* 等待 PHY 就绪 */
          while (timeout--) {
              if (readl(priv->base + PHY_STATUS) & PHY_READY)
                  return 0;
              usleep_range(10, 20);
          }

          dev_err(&phy->dev, "PHY not ready\n");
          regulator_disable(priv->vdd);
          return -ETIMEDOUT;
      }

      static int my_usb_phy_power_off(struct phy *phy)
      {
          struct my_usb_phy *priv = phy_get_drvdata(phy);
          u32 val;

          /* 禁用 PHY */
          val = readl(priv->base + PHY_CTRL);
          val &= ~PHY_EN;
          writel(val, priv->base + PHY_CTRL);

          /* 关闭电源 */
          regulator_disable(priv->vdd);

          return 0;
      }

      static int my_usb_phy_set_mode(struct phy *phy, enum phy_mode mode)
      {
          struct my_usb_phy *priv = phy_get_drvdata(phy);
          u32 val;

          val = readl(priv->base + PHY_CTRL);
          val &= ~PHY_MODE_MASK;

          switch (mode) {
          case PHY_MODE_USB_HOST:
              val |= PHY_MODE_HOST;
              break;
          case PHY_MODE_USB_DEVICE:
              val |= PHY_MODE_DEV;
              break;
          case PHY_MODE_USB_OTG:
              val |= PHY_MODE_OTG;
              break;
          default:
              return -EINVAL;
          }

          writel(val, priv->base + PHY_CTRL);
          priv->mode = mode;

          return 0;
      }

      static int my_usb_phy_reset(struct phy *phy)
      {
          struct my_usb_phy *priv = phy_get_drvdata(phy);

          reset_control_assert(priv->rst);
          usleep_range(10, 20);
          reset_control_deassert(priv->rst);
          usleep_range(100, 200);

          return 0;
      }

      static const struct phy_ops my_usb_phy_ops = {
          .init = my_usb_phy_init,
          .exit = my_usb_phy_exit,
          .power_on = my_usb_phy_power_on,
          .power_off = my_usb_phy_power_off,
          .set_mode = my_usb_phy_set_mode,
          .reset = my_usb_phy_reset,
          .owner = THIS_MODULE,
      };

      static int my_usb_phy_probe(struct platform_device *pdev)
      {
          struct device *dev = &pdev->dev;
          struct my_usb_phy *priv;
          struct phy_provider *phy_provider;
          struct resource *res;

          priv = devm_kzalloc(dev, sizeof(*priv), GFP_KERNEL);
          if (!priv)
              return -ENOMEM;

          res = platform_get_resource(pdev, IORESOURCE_MEM, 0);
          priv->base = devm_ioremap_resource(dev, res);
          if (IS_ERR(priv->base))
              return PTR_ERR(priv->base);

          priv->clk = devm_clk_get(dev, "phy");
          if (IS_ERR(priv->clk))
              return PTR_ERR(priv->clk);

          priv->rst = devm_reset_control_get(dev, "phy");
          if (IS_ERR(priv->rst))
              return PTR_ERR(priv->rst);

          priv->vdd = devm_regulator_get(dev, "vdd");
          if (IS_ERR(priv->vdd))
              return PTR_ERR(priv->vdd);

          /* 创建 PHY */
          priv->phy = devm_phy_create(dev, dev->of_node, &my_usb_phy_ops);
          if (IS_ERR(priv->phy))
              return PTR_ERR(priv->phy);

          phy_set_drvdata(priv->phy, priv);
          platform_set_drvdata(pdev, priv);

          /* 注册 PHY 提供者 */
          phy_provider = devm_of_phy_provider_register(dev, of_phy_simple_xlate);
          if (IS_ERR(phy_provider))
              return PTR_ERR(phy_provider);

          return 0;
      }

      static const struct of_device_id my_usb_phy_of_match[] = {
          { .compatible = "vendor,usb-phy" },
          { }
      };
      MODULE_DEVICE_TABLE(of, my_usb_phy_of_match);

      static struct platform_driver my_usb_phy_driver = {
          .probe = my_usb_phy_probe,
          .driver = {
              .name = "my-usb-phy",
              .of_match_table = my_usb_phy_of_match,
          },
      };
      module_platform_driver(my_usb_phy_driver);

      MODULE_LICENSE("GPL");
      MODULE_DESCRIPTION("My USB PHY Driver");
      MODULE_AUTHOR("Author");

  - description: "PHY 消费者驱动示例"
    kernel_version: "4.0+"
    code: |
      #include <linux/module.h>
      #include <linux/platform_device.h>
      #include <linux/phy/phy.h>

      struct my_usb_ctrl {
          void __iomem *base;
          struct phy *phy;
      };

      static int my_usb_ctrl_probe(struct platform_device *pdev)
      {
          struct device *dev = &pdev->dev;
          struct my_usb_ctrl *ctrl;
          struct resource *res;
          int ret;

          ctrl = devm_kzalloc(dev, sizeof(*ctrl), GFP_KERNEL);
          if (!ctrl)
              return -ENOMEM;

          res = platform_get_resource(pdev, IORESOURCE_MEM, 0);
          ctrl->base = devm_ioremap_resource(dev, res);
          if (IS_ERR(ctrl->base))
              return PTR_ERR(ctrl->base);

          /* 获取 PHY (必需) */
          ctrl->phy = devm_phy_get(dev, "usb-phy");
          if (IS_ERR(ctrl->phy)) {
              dev_err(dev, "Failed to get PHY\n");
              return PTR_ERR(ctrl->phy);
          }

          /* 或者获取可选 PHY */
          /* ctrl->phy = devm_phy_optional_get(dev, "usb-phy");
             if (IS_ERR(ctrl->phy))
                 return PTR_ERR(ctrl->phy);
             if (!ctrl->phy)
                 dev_info(dev, "No PHY provided\n"); */

          /* 初始化 PHY */
          ret = phy_init(ctrl->phy);
          if (ret)
              return ret;

          /* 设置模式 (可选) */
          ret = phy_set_mode(ctrl->phy, PHY_MODE_USB_HOST);
          if (ret) {
              phy_exit(ctrl->phy);
              return ret;
          }

          /* 打开电源 */
          ret = phy_power_on(ctrl->phy);
          if (ret) {
              phy_exit(ctrl->phy);
              return ret;
          }

          platform_set_drvdata(pdev, ctrl);

          /* ... 初始化 USB 控制器 ... */

          return 0;
      }

      static void my_usb_ctrl_remove(struct platform_device *pdev)
      {
          struct my_usb_ctrl *ctrl = platform_get_drvdata(pdev);

          /* 关闭 PHY */
          phy_power_off(ctrl->phy);
          phy_exit(ctrl->phy);
      }

      static const struct of_device_id my_usb_ctrl_of_match[] = {
          { .compatible = "vendor,usb-host" },
          { }
      };
      MODULE_DEVICE_TABLE(of, my_usb_ctrl_of_match);

      static struct platform_driver my_usb_ctrl_driver = {
          .probe = my_usb_ctrl_probe,
          .remove = my_usb_ctrl_remove,
          .driver = {
              .name = "my-usb-ctrl",
              .of_match_table = my_usb_ctrl_of_match,
          },
      };
      module_platform_driver(my_usb_ctrl_driver);

      MODULE_LICENSE("GPL");
      MODULE_DESCRIPTION("My USB Controller Driver");
      MODULE_AUTHOR("Author");

  - description: "多 PHY 提供者示例 (带自定义 xlate)"
    code: |
      #include <linux/module.h>
      #include <linux/platform_device.h>
      #include <linux/phy/phy.h>

      #define MAX_PHYS 4

      struct my_multi_phy {
          void __iomem *base;
          struct phy *phys[MAX_PHYS];
      };

      /* 自定义 xlate 函数 */
      static struct phy *my_phy_xlate(struct device *dev,
                                       struct of_phandle_args *args)
      {
          struct my_multi_phy *priv = dev_get_drvdata(dev);
          int index;

          if (args->args_count != 1)
              return ERR_PTR(-EINVAL);

          index = args->args[0];
          if (index >= MAX_PHYS)
              return ERR_PTR(-EINVAL);

          return priv->phys[index];
      }

      static int my_multi_phy_probe(struct platform_device *pdev)
      {
          struct device *dev = &pdev->dev;
          struct my_multi_phy *priv;
          int i;

          priv = devm_kzalloc(dev, sizeof(*priv), GFP_KERNEL);
          if (!priv)
              return -ENOMEM;

          /* 创建多个 PHY */
          for (i = 0; i < MAX_PHYS; i++) {
              priv->phys[i] = devm_phy_create(dev, NULL, &my_phy_ops);
              if (IS_ERR(priv->phys[i]))
                  return PTR_ERR(priv->phys[i]);

              phy_set_drvdata(priv->phys[i], priv);
          }

          platform_set_drvdata(pdev, priv);

          /* 注册带自定义 xlate 的提供者 */
          return PTR_ERR_OR_ZERO(
              devm_of_phy_provider_register(dev, my_phy_xlate));
      }

      /*
       * 设备树绑定示例:
       *
       * multi_phy: phy@12340000 {
       *     compatible = "vendor,multi-phy";
       *     reg = <0x12340000 0x1000>;
       *     #phy-cells = <1>;  // 需要一个参数
       * };
       *
       * 消费者:
       * device@12350000 {
       *     phys = <&multi_phy 0>, <&multi_phy 1>;
       *     phy-names = "phy0", "phy1";
       * };
       */

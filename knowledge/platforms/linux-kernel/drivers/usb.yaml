# USB Driver Framework Knowledge Base
# Reference: https://www.kernel.org/doc/html/latest/driver-api/usb/

kernel_version:
  minimum: "4.4"
  recommended: "5.10+"
  tested: "6.1"
  notes:
    - "5.0+ 推荐使用 usb_interface_claim_exclusive()"
    - "5.8+ URB 状态字段改为 int"
    - "5.19+ usb_control_msg_send/recv 简化控制传输"
    - "6.0+ gadget 驱动推荐使用 usb_func_*_free_inst"

# ============================================================
# USB DEVICE DRIVER (Host Side)
# ============================================================

usb_driver:
  description: "USB Device Driver Framework (Host Side)"
  header: "linux/usb.h"
  icon: "🔌"

  registration:
    # module_usb_driver - 现代驱动推荐方式 (5.0+ 优先使用)
    - pattern: 'module_usb_driver\s*\(\s*(?P<driver>\w+)\s*\)'
      description: "模块初始化宏 (推荐)"
      note: "现代驱动优先使用此宏，替代 usb_register/usb_deregister 组合"
    # usb_register - 传统方式 (仍有效)
    - pattern: 'usb_register\s*\(\s*&(?P<driver>\w+)\s*\)'
      description: "注册 USB 驱动 (传统)"
      note: "推荐使用 module_usb_driver() 替代"
    - pattern: 'usb_register_driver\s*\(\s*&(?P<driver>\w+)\s*,\s*[^)]+\)'
      description: "注册 USB 驱动 (带 owner)"
    - pattern: 'usb_deregister\s*\(\s*&(?P<driver>\w+)\s*\)'
      description: "注销 USB 驱动"

  driver_structure:
    - pattern: 'static struct usb_driver\s+(?P<name>\w+)\s*=\s*\{'
      description: "USB 驱动结构体"

  callbacks:
    probe:
      pattern: '\.probe\s*=\s*(?P<handler>\w+)'
      description: "设备连接回调"
      trigger: "USB 设备插入且 ID 匹配"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct usb_interface *, const struct usb_device_id *)"
      return_value:
        success: "0"
        failure: "-ENOMEM, -ENODEV, etc."
      typical_actions:
        - "分配设备私有数据"
        - "初始化 USB 端点"
        - "提交初始 URB"
        - "注册字符设备或网络接口"

    disconnect:
      pattern: '\.disconnect\s*=\s*(?P<handler>\w+)'
      description: "设备断开回调"
      trigger: "USB 设备移除或驱动卸载"
      context: "process"
      can_sleep: true
      signature: "void (*)(struct usb_interface *)"
      typical_actions:
        - "取消待处理的 URB"
        - "释放资源"
        - "注销子设备"
        - "释放私有数据"

    suspend:
      pattern: '\.suspend\s*=\s*(?P<handler>\w+)'
      description: "设备挂起回调"
      trigger: "系统睡眠或 USB 自动挂起"
      context: "process"
      signature: "int (*)(struct usb_interface *, pm_message_t)"

    resume:
      pattern: '\.resume\s*=\s*(?P<handler>\w+)'
      description: "设备恢复回调"
      trigger: "系统唤醒或 USB 自动恢复"
      context: "process"
      signature: "int (*)(struct usb_interface *)"

    reset_resume:
      pattern: '\.reset_resume\s*=\s*(?P<handler>\w+)'
      description: "恢复时设备重置回调"
      context: "process"
      signature: "int (*)(struct usb_interface *)"

    pre_reset:
      pattern: '\.pre_reset\s*=\s*(?P<handler>\w+)'
      description: "设备重置前回调"
      context: "process"
      signature: "int (*)(struct usb_interface *)"

    post_reset:
      pattern: '\.post_reset\s*=\s*(?P<handler>\w+)'
      description: "设备重置后回调"
      context: "process"
      signature: "int (*)(struct usb_interface *)"

  id_table:
    - pattern: 'USB_DEVICE\s*\(\s*(?P<vendor>0x[0-9a-fA-F]+)\s*,\s*(?P<product>0x[0-9a-fA-F]+)\s*\)'
      description: "匹配特定 VID:PID"
    - pattern: 'USB_DEVICE_AND_INTERFACE_INFO\s*\([^)]+\)'
      description: "匹配设备和接口信息"
    - pattern: 'USB_INTERFACE_INFO\s*\([^)]+\)'
      description: "匹配接口类/子类/协议"


# ============================================================
# USB CLASS DRIVER
# ============================================================

usb_class_driver:
  description: "USB Class Driver (字符设备注册)"
  header: "linux/usb.h"

  registration:
    - pattern: 'usb_register_dev\s*\(\s*(?P<intf>[^,]+)\s*,\s*&(?P<class>\w+)\s*\)'
      description: "注册 USB 字符设备"
    - pattern: 'usb_deregister_dev\s*\(\s*(?P<intf>[^,]+)\s*,\s*&(?P<class>\w+)\s*\)'
      description: "注销 USB 字符设备"

  callbacks:
    open:
      pattern: '\.open\s*=\s*(?P<handler>\w+)'
      description: "打开设备文件"
      trigger: "用户空间 open() /dev/usb/xxx"
      context: "process"

    release:
      pattern: '\.release\s*=\s*(?P<handler>\w+)'
      description: "关闭设备文件"
      trigger: "用户空间 close()"
      context: "process"


# ============================================================
# URB (USB Request Block)
# ============================================================

urb:
  description: "USB Request Block - 异步传输"
  header: "linux/usb.h"
  icon: "📦"

  allocation:
    # usb_alloc_urb - 支持数字、变量和表达式参数
    - pattern: 'usb_alloc_urb\s*\(\s*(?P<iso_packets>\d+)\s*,\s*(?P<mem_flags>\w+)\s*\)'
      description: "分配 URB (数字参数)"
    - pattern: 'usb_alloc_urb\s*\(\s*(?P<iso_packets>[a-zA-Z_]\w*)\s*,\s*(?P<mem_flags>\w+)\s*\)'
      description: "分配 URB (变量参数)"
    - pattern: 'usb_alloc_urb\s*\(\s*(?P<iso_packets>[^,]+)\s*,\s*(?P<mem_flags>\w+)\s*\)'
      description: "分配 URB (表达式参数)"
      note: "支持如 pdu->u.cmd_submit.number_of_packets 等复杂表达式"
    - pattern: 'usb_free_urb\s*\(\s*(?P<urb>[^)]+)\s*\)'
      description: "释放 URB"

  initialization:
    - pattern: 'usb_fill_control_urb\s*\([^)]+\)'
      description: "初始化控制传输 URB"
    - pattern: 'usb_fill_bulk_urb\s*\([^)]+\)'
      description: "初始化批量传输 URB"
    - pattern: 'usb_fill_int_urb\s*\([^)]+\)'
      description: "初始化中断传输 URB"

  submission:
    - pattern: 'usb_submit_urb\s*\(\s*(?P<urb>[^,]+)\s*,\s*(?P<mem_flags>\w+)\s*\)'
      description: "提交 URB"
    - pattern: 'usb_kill_urb\s*\(\s*(?P<urb>[^)]+)\s*\)'
      description: "强制取消 URB (同步)"
    - pattern: 'usb_unlink_urb\s*\(\s*(?P<urb>[^)]+)\s*\)'
      description: "取消 URB (异步)"
    - pattern: 'usb_poison_urb\s*\(\s*(?P<urb>[^)]+)\s*\)'
      description: "毒化 URB (阻止重新提交)"

  completion:
    pattern: '\.complete\s*=\s*(?P<handler>\w+)'
    description: "URB 完成回调"
    context: "hardirq or softirq"
    can_sleep: false
    signature: "void (*)(struct urb *)"
    notes:
      - "不能在此上下文中睡眠"
      - "可以重新提交同一个 URB 用于连续传输"


# ============================================================
# USB GADGET DRIVER (Device Side)
# ============================================================

usb_gadget_driver:
  description: "USB Gadget Driver Framework (Device Side)"
  header: "linux/usb/gadget.h"
  icon: "📱"

  registration:
    - pattern: 'usb_gadget_probe_driver\s*\(\s*&(?P<driver>\w+)\s*\)'
      description: "注册 gadget 驱动"
    - pattern: 'usb_gadget_unregister_driver\s*\(\s*&(?P<driver>\w+)\s*\)'
      description: "注销 gadget 驱动"
    - pattern: 'usb_composite_probe\s*\(\s*&(?P<driver>\w+)\s*\)'
      description: "注册复合 gadget 驱动"

  driver_structure:
    - pattern: 'static struct usb_gadget_driver\s+(?P<name>\w+)\s*=\s*\{'
      description: "Gadget 驱动结构体"
    - pattern: 'static struct usb_composite_driver\s+(?P<name>\w+)\s*=\s*\{'
      description: "复合 Gadget 驱动结构体"

  callbacks:
    bind:
      pattern: '\.bind\s*=\s*(?P<handler>\w+)'
      description: "绑定到 gadget"
      context: "process"
      signature: "int (*)(struct usb_gadget *, struct usb_gadget_driver *)"

    unbind:
      pattern: '\.unbind\s*=\s*(?P<handler>\w+)'
      description: "从 gadget 解绑"
      context: "process"
      signature: "void (*)(struct usb_gadget *)"

    setup:
      pattern: '\.setup\s*=\s*(?P<handler>\w+)'
      description: "处理控制请求"
      context: "hardirq"
      can_sleep: false
      signature: "int (*)(struct usb_gadget *, const struct usb_ctrlrequest *)"

    disconnect:
      pattern: '\.disconnect\s*=\s*(?P<handler>\w+)'
      description: "USB 断开回调"
      context: "hardirq"
      signature: "void (*)(struct usb_gadget *)"

    suspend:
      pattern: '\.suspend\s*=\s*(?P<handler>\w+)'
      description: "挂起回调"
      context: "process"

    resume:
      pattern: '\.resume\s*=\s*(?P<handler>\w+)'
      description: "恢复回调"
      context: "process"


# ============================================================
# USB FUNCTION (Gadget Function)
# ============================================================

usb_function:
  description: "USB Gadget Function"
  header: "linux/usb/composite.h"

  registration:
    - pattern: 'usb_function_register\s*\(\s*&(?P<instance>\w+)\s*\)'
      description: "注册 USB 功能"
    - pattern: 'usb_function_unregister\s*\(\s*&(?P<instance>\w+)\s*\)'
      description: "注销 USB 功能"
    - pattern: 'DECLARE_USB_FUNCTION_INIT\s*\(\s*(?P<name>\w+)\s*,\s*(?P<alloc>\w+)\s*\)'
      description: "声明 USB 功能"

  callbacks:
    bind:
      pattern: '\.bind\s*=\s*(?P<handler>\w+)'
      description: "绑定功能到配置"
      signature: "int (*)(struct usb_configuration *, struct usb_function *)"

    unbind:
      pattern: '\.unbind\s*=\s*(?P<handler>\w+)'
      description: "从配置解绑"

    set_alt:
      pattern: '\.set_alt\s*=\s*(?P<handler>\w+)'
      description: "设置接口的备用设置"
      signature: "int (*)(struct usb_function *, unsigned, unsigned)"

    get_alt:
      pattern: '\.get_alt\s*=\s*(?P<handler>\w+)'
      description: "获取当前备用设置"

    disable:
      pattern: '\.disable\s*=\s*(?P<handler>\w+)'
      description: "禁用功能"

    setup:
      pattern: '\.setup\s*=\s*(?P<handler>\w+)'
      description: "处理控制请求"
      context: "hardirq"


# ============================================================
# USB REQUEST (Gadget EP Request)
# ============================================================

usb_request:
  description: "USB Gadget Endpoint Request"
  header: "linux/usb/gadget.h"

  allocation:
    - pattern: 'usb_ep_alloc_request\s*\(\s*(?P<ep>[^,]+)\s*,\s*(?P<gfp>\w+)\s*\)'
      description: "分配端点请求"
    - pattern: 'usb_ep_free_request\s*\(\s*(?P<ep>[^,]+)\s*,\s*(?P<req>[^)]+)\s*\)'
      description: "释放端点请求"

  submission:
    - pattern: 'usb_ep_queue\s*\(\s*(?P<ep>[^,]+)\s*,\s*(?P<req>[^,]+)\s*,\s*(?P<gfp>\w+)\s*\)'
      description: "提交请求到端点"
    - pattern: 'usb_ep_dequeue\s*\(\s*(?P<ep>[^,]+)\s*,\s*(?P<req>[^)]+)\s*\)'
      description: "取消端点请求"

  completion:
    pattern: '\.complete\s*=\s*(?P<handler>\w+)'
    description: "请求完成回调"
    context: "hardirq"
    can_sleep: false
    signature: "void (*)(struct usb_ep *, struct usb_request *)"


# ============================================================
# USB SYNCHRONOUS API
# ============================================================

usb_sync_api:
  description: "USB Synchronous Transfer API"
  header: "linux/usb.h"

  functions:
    - pattern: 'usb_control_msg\s*\([^)]+\)'
      description: "同步控制传输"
      context: "process"
      can_sleep: true

    - pattern: 'usb_bulk_msg\s*\([^)]+\)'
      description: "同步批量传输"
      context: "process"
      can_sleep: true

    - pattern: 'usb_interrupt_msg\s*\([^)]+\)'
      description: "同步中断传输"
      context: "process"
      can_sleep: true

    - pattern: 'usb_get_descriptor\s*\([^)]+\)'
      description: "获取描述符"
      context: "process"

    - pattern: 'usb_string\s*\([^)]+\)'
      description: "获取字符串描述符"
      context: "process"


# ============================================================
# USB HELPER FUNCTIONS
# ============================================================

usb_helpers:
  description: "USB Helper Functions"
  header: "linux/usb.h"

  device_info:
    - pattern: 'usb_get_dev\s*\([^)]+\)'
      description: "增加设备引用计数"
    - pattern: 'usb_put_dev\s*\([^)]+\)'
      description: "减少设备引用计数"
    - pattern: 'usb_get_intf\s*\([^)]+\)'
      description: "增加接口引用计数"
    - pattern: 'usb_put_intf\s*\([^)]+\)'
      description: "减少接口引用计数"
    - pattern: 'usb_ifnum_to_if\s*\([^)]+\)'
      description: "接口号到接口结构体"
    - pattern: 'interface_to_usbdev\s*\([^)]+\)'
      description: "接口到设备结构体"

  endpoint_info:
    - pattern: 'usb_endpoint_dir_in\s*\([^)]+\)'
      description: "检查端点是否为 IN"
    - pattern: 'usb_endpoint_dir_out\s*\([^)]+\)'
      description: "检查端点是否为 OUT"
    - pattern: 'usb_endpoint_type\s*\([^)]+\)'
      description: "获取端点类型"
    - pattern: 'usb_endpoint_xfer_bulk\s*\([^)]+\)'
      description: "检查是否为批量端点"
    - pattern: 'usb_endpoint_xfer_control\s*\([^)]+\)'
      description: "检查是否为控制端点"
    - pattern: 'usb_endpoint_xfer_int\s*\([^)]+\)'
      description: "检查是否为中断端点"
    - pattern: 'usb_endpoint_xfer_isoc\s*\([^)]+\)'
      description: "检查是否为等时端点"

  private_data:
    - pattern: 'usb_set_intfdata\s*\([^)]+\)'
      description: "设置接口私有数据"
    - pattern: 'usb_get_intfdata\s*\([^)]+\)'
      description: "获取接口私有数据"


# ============================================================
# USB POWER MANAGEMENT
# ============================================================

usb_pm:
  description: "USB Power Management"
  header: "linux/usb.h"

  autosuspend:
    - pattern: 'usb_enable_autosuspend\s*\([^)]+\)'
      description: "启用自动挂起"
    - pattern: 'usb_disable_autosuspend\s*\([^)]+\)'
      description: "禁用自动挂起"
    - pattern: 'usb_autopm_get_interface\s*\([^)]+\)'
      description: "增加使用计数 (阻止挂起)"
    - pattern: 'usb_autopm_put_interface\s*\([^)]+\)'
      description: "减少使用计数 (允许挂起)"


# ============================================================
# USB EXAMPLES
# ============================================================

examples:
  - description: "简单 USB 驱动骨架"
    code: |
      static int my_probe(struct usb_interface *intf,
                          const struct usb_device_id *id)
      {
          struct usb_device *udev = interface_to_usbdev(intf);
          struct my_data *data;
          int ret;

          data = kzalloc(sizeof(*data), GFP_KERNEL);
          if (!data)
              return -ENOMEM;

          data->udev = usb_get_dev(udev);
          usb_set_intfdata(intf, data);

          /* 初始化 URB */
          data->urb = usb_alloc_urb(0, GFP_KERNEL);
          usb_fill_bulk_urb(data->urb, udev,
                            usb_sndbulkpipe(udev, EP_OUT),
                            data->buf, BUF_SIZE,
                            my_complete, data);

          return 0;
      }

      static void my_disconnect(struct usb_interface *intf)
      {
          struct my_data *data = usb_get_intfdata(intf);

          usb_kill_urb(data->urb);
          usb_free_urb(data->urb);
          usb_put_dev(data->udev);
          kfree(data);
      }

      static void my_complete(struct urb *urb)
      {
          struct my_data *data = urb->context;

          if (urb->status)
              dev_err(&data->udev->dev, "URB error: %d\n", urb->status);
          else
              dev_dbg(&data->udev->dev, "Transfer complete\n");
      }

      static const struct usb_device_id my_id_table[] = {
          { USB_DEVICE(0x1234, 0x5678) },
          { }
      };
      MODULE_DEVICE_TABLE(usb, my_id_table);

      static struct usb_driver my_driver = {
          .name = "my_usb",
          .id_table = my_id_table,
          .probe = my_probe,
          .disconnect = my_disconnect,
          .suspend = my_suspend,
          .resume = my_resume,
      };
      module_usb_driver(my_driver);

  - description: "USB Gadget 功能示例"
    code: |
      static int my_func_bind(struct usb_configuration *c,
                              struct usb_function *f)
      {
          struct usb_composite_dev *cdev = c->cdev;
          struct my_func *func = func_to_my_func(f);
          int ret;

          /* 分配接口 */
          ret = usb_interface_id(c, f);
          if (ret < 0)
              return ret;
          func->intf_id = ret;

          /* 分配端点 */
          func->ep_in = usb_ep_autoconfig(cdev->gadget, &my_ep_in_desc);
          func->ep_out = usb_ep_autoconfig(cdev->gadget, &my_ep_out_desc);

          return 0;
      }

      static int my_func_set_alt(struct usb_function *f,
                                 unsigned intf, unsigned alt)
      {
          struct my_func *func = func_to_my_func(f);

          usb_ep_enable(func->ep_in);
          usb_ep_enable(func->ep_out);

          return 0;
      }

      static void my_func_disable(struct usb_function *f)
      {
          struct my_func *func = func_to_my_func(f);

          usb_ep_disable(func->ep_in);
          usb_ep_disable(func->ep_out);
      }


# ============================================================
# DATA STRUCTURES
# ============================================================

data_structures:
  usb_driver:
    description: "USB 设备驱动结构 (Host 侧)"
    header: "linux/usb.h"
    fields:
      - name: "name"
        type: "const char *"
        description: "驱动名称 (显示在 /sys/bus/usb/drivers/)"
      - name: "probe"
        type: "function pointer"
        description: "设备探测回调"
      - name: "disconnect"
        type: "function pointer"
        description: "设备断开回调"
      - name: "suspend"
        type: "function pointer"
        description: "电源管理挂起回调"
      - name: "resume"
        type: "function pointer"
        description: "电源管理恢复回调"
      - name: "id_table"
        type: "const struct usb_device_id *"
        description: "设备 ID 匹配表"
      - name: "supports_autosuspend"
        type: "bit field"
        description: "支持自动挂起"

  usb_interface:
    description: "USB 接口结构"
    header: "linux/usb.h"
    fields:
      - name: "altsetting"
        type: "struct usb_host_interface *"
        description: "所有备用设置数组"
      - name: "cur_altsetting"
        type: "struct usb_host_interface *"
        description: "当前活动的备用设置"
      - name: "num_altsetting"
        type: "unsigned"
        description: "备用设置数量"
      - name: "minor"
        type: "int"
        description: "次设备号 (usb_register_dev 设置)"
      - name: "dev"
        type: "struct device"
        description: "嵌入的设备结构"

  urb:
    description: "USB Request Block (异步传输)"
    header: "linux/usb.h"
    fields:
      - name: "dev"
        type: "struct usb_device *"
        description: "目标 USB 设备"
      - name: "pipe"
        type: "unsigned int"
        description: "端点管道 (使用 usb_snd/rcvbulkpipe() 等宏)"
      - name: "status"
        type: "int"
        description: "完成状态 (0=成功, -ENOENT, -EPIPE 等)"
      - name: "transfer_flags"
        type: "unsigned int"
        description: "URB_SHORT_NOT_OK, URB_ISO_ASAP 等"
      - name: "transfer_buffer"
        type: "void *"
        description: "数据缓冲区"
      - name: "transfer_buffer_length"
        type: "u32"
        description: "缓冲区长度"
      - name: "actual_length"
        type: "u32"
        description: "实际传输长度"
      - name: "complete"
        type: "usb_complete_t"
        description: "完成回调函数"
      - name: "context"
        type: "void *"
        description: "完成回调上下文"


# ============================================================
# ADDITIONAL EXAMPLES
# ============================================================

additional_examples:
  - description: "完整 USB 驱动 (批量传输)"
    kernel_version: "5.0+"
    code: |
      #include <linux/module.h>
      #include <linux/usb.h>

      struct my_usb_device {
          struct usb_device *udev;
          struct usb_interface *intf;
          struct urb *bulk_in_urb;
          unsigned char *bulk_in_buffer;
          __u8 bulk_in_endpointAddr;
          __u8 bulk_out_endpointAddr;
      };

      static void my_bulk_in_callback(struct urb *urb)
      {
          struct my_usb_device *dev = urb->context;

          switch (urb->status) {
          case 0:
              /* 成功 - 处理数据 */
              dev_dbg(&dev->intf->dev, "Received %d bytes\n",
                      urb->actual_length);
              /* 重新提交 URB */
              usb_submit_urb(urb, GFP_ATOMIC);
              break;
          case -ECONNRESET:
          case -ENOENT:
          case -ESHUTDOWN:
              /* 正常终止 */
              break;
          default:
              dev_err(&dev->intf->dev, "URB error: %d\n", urb->status);
              break;
          }
      }

      static int my_probe(struct usb_interface *intf,
                          const struct usb_device_id *id)
      {
          struct usb_device *udev = interface_to_usbdev(intf);
          struct my_usb_device *dev;
          struct usb_endpoint_descriptor *bulk_in, *bulk_out;
          int ret;

          /* 查找端点 */
          ret = usb_find_common_endpoints(intf->cur_altsetting,
                                          &bulk_in, &bulk_out, NULL, NULL);
          if (ret)
              return ret;

          dev = kzalloc(sizeof(*dev), GFP_KERNEL);
          if (!dev)
              return -ENOMEM;

          dev->udev = usb_get_dev(udev);
          dev->intf = intf;
          dev->bulk_in_endpointAddr = bulk_in->bEndpointAddress;
          dev->bulk_out_endpointAddr = bulk_out->bEndpointAddress;

          /* 分配 URB */
          dev->bulk_in_urb = usb_alloc_urb(0, GFP_KERNEL);
          dev->bulk_in_buffer = kmalloc(512, GFP_KERNEL);

          usb_fill_bulk_urb(dev->bulk_in_urb, udev,
                            usb_rcvbulkpipe(udev, dev->bulk_in_endpointAddr),
                            dev->bulk_in_buffer, 512,
                            my_bulk_in_callback, dev);

          usb_set_intfdata(intf, dev);
          usb_submit_urb(dev->bulk_in_urb, GFP_KERNEL);

          return 0;
      }

      static void my_disconnect(struct usb_interface *intf)
      {
          struct my_usb_device *dev = usb_get_intfdata(intf);

          usb_kill_urb(dev->bulk_in_urb);
          usb_free_urb(dev->bulk_in_urb);
          kfree(dev->bulk_in_buffer);
          usb_put_dev(dev->udev);
          kfree(dev);
      }

      static const struct usb_device_id my_id_table[] = {
          { USB_DEVICE(0x1234, 0x5678) },
          { }
      };
      MODULE_DEVICE_TABLE(usb, my_id_table);

      static struct usb_driver my_driver = {
          .name = "my_usb_driver",
          .id_table = my_id_table,
          .probe = my_probe,
          .disconnect = my_disconnect,
          .supports_autosuspend = 1,
      };
      module_usb_driver(my_driver);

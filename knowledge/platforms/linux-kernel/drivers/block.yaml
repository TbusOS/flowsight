# ============================================================
# EXAMPLES
# ============================================================

examples:
  - description: "现代多队列块设备驱动 (blk-mq)"
    kernel_version: "5.0+"
    code: |
      #include <linux/module.h>
      #include <linux/blkdev.h>
      #include <linux/blk-mq.h>

      #define MY_SECTOR_SIZE 512
      #define MY_NR_SECTORS (1024 * 1024 * 2)  /* 1GB */

      struct my_device {
          struct gendisk *disk;
          struct blk_mq_tag_set tag_set;
          spinlock_t lock;
          void *data;
      };

      struct my_cmd {
          struct request *rq;
          /* 驱动特定数据 */
      };

      static struct my_device my_dev;

      static blk_status_t my_queue_rq(struct blk_mq_hw_ctx *hctx,
                                      const struct blk_mq_queue_data *bd)
      {
          struct request *rq = bd->rq;
          struct my_cmd *cmd = blk_mq_rq_to_pdu(rq);
          struct bio_vec bvec;
          struct req_iterator iter;
          sector_t sector = blk_rq_pos(rq);
          void *buf;

          blk_mq_start_request(rq);

          cmd->rq = rq;

          rq_for_each_segment(bvec, rq, iter) {
              buf = page_address(bvec.bv_page) + bvec.bv_offset;

              if (rq_data_dir(rq) == READ)
                  memcpy(buf, my_dev.data + sector * MY_SECTOR_SIZE,
                         bvec.bv_len);
              else
                  memcpy(my_dev.data + sector * MY_SECTOR_SIZE, buf,
                         bvec.bv_len);

              sector += bvec.bv_len / MY_SECTOR_SIZE;
          }

          blk_mq_end_request(rq, BLK_STS_OK);
          return BLK_STS_OK;
      }

      static int my_init_hctx(struct blk_mq_hw_ctx *hctx,
                              void *data, unsigned int hctx_idx)
      {
          /* 初始化硬件队列 */
          return 0;
      }

      static const struct blk_mq_ops my_mq_ops = {
          .queue_rq = my_queue_rq,
          .init_hctx = my_init_hctx,
      };

      static int my_open(struct gendisk *disk, blk_mode_t mode)
      {
          return 0;
      }

      static void my_release(struct gendisk *disk)
      {
      }

      static const struct block_device_operations my_fops = {
          .owner = THIS_MODULE,
          .open = my_open,
          .release = my_release,
      };

      static int __init my_init(void)
      {
          int ret;

          my_dev.data = vzalloc(MY_NR_SECTORS * MY_SECTOR_SIZE);
          if (!my_dev.data)
              return -ENOMEM;

          spin_lock_init(&my_dev.lock);

          /* 设置标签集 */
          my_dev.tag_set.ops = &my_mq_ops;
          my_dev.tag_set.nr_hw_queues = 1;
          my_dev.tag_set.queue_depth = 128;
          my_dev.tag_set.numa_node = NUMA_NO_NODE;
          my_dev.tag_set.cmd_size = sizeof(struct my_cmd);
          my_dev.tag_set.flags = BLK_MQ_F_SHOULD_MERGE;

          ret = blk_mq_alloc_tag_set(&my_dev.tag_set);
          if (ret)
              goto err_data;

          /* 分配磁盘 */
          my_dev.disk = blk_mq_alloc_disk(&my_dev.tag_set, NULL, NULL);
          if (IS_ERR(my_dev.disk)) {
              ret = PTR_ERR(my_dev.disk);
              goto err_tag;
          }

          /* 设置磁盘参数 */
          my_dev.disk->major = 0;  /* 动态分配 */
          my_dev.disk->first_minor = 0;
          my_dev.disk->minors = 1;
          my_dev.disk->fops = &my_fops;
          my_dev.disk->private_data = &my_dev;
          snprintf(my_dev.disk->disk_name, DISK_NAME_LEN, "myblk");

          /* 设置队列参数 */
          blk_queue_logical_block_size(my_dev.disk->queue, MY_SECTOR_SIZE);
          blk_queue_physical_block_size(my_dev.disk->queue, MY_SECTOR_SIZE);
          blk_queue_max_hw_sectors(my_dev.disk->queue, 1024);

          /* 设置容量并添加磁盘 */
          set_capacity(my_dev.disk, MY_NR_SECTORS);

          ret = add_disk(my_dev.disk);
          if (ret)
              goto err_disk;

          pr_info("myblk: registered\n");
          return 0;

      err_disk:
          put_disk(my_dev.disk);
      err_tag:
          blk_mq_free_tag_set(&my_dev.tag_set);
      err_data:
          vfree(my_dev.data);
          return ret;
      }

      static void __exit my_exit(void)
      {
          del_gendisk(my_dev.disk);
          put_disk(my_dev.disk);
          blk_mq_free_tag_set(&my_dev.tag_set);
          vfree(my_dev.data);
          pr_info("myblk: unregistered\n");
      }

      module_init(my_init);
      module_exit(my_exit);
      MODULE_LICENSE("GPL");
      MODULE_DESCRIPTION("Simple blk-mq block device");

  - description: "NVMe 风格多队列驱动框架"
    kernel_version: "5.0+"
    code: |
      /* 带超时和多队列的驱动框架 */
      static enum blk_eh_timer_return my_timeout(struct request *rq)
      {
          struct my_cmd *cmd = blk_mq_rq_to_pdu(rq);

          pr_warn("request timeout: cmd=%p\n", cmd);

          /* 尝试中止命令 */
          if (my_abort_cmd(cmd) == 0) {
              /* 成功中止 */
              blk_mq_end_request(rq, BLK_STS_TIMEOUT);
              return BLK_EH_DONE;
          }

          /* 重置定时器等待硬件 */
          return BLK_EH_RESET_TIMER;
      }

      static void my_complete_rq(struct request *rq)
      {
          struct my_cmd *cmd = blk_mq_rq_to_pdu(rq);
          blk_status_t status = cmd->status;

          blk_mq_end_request(rq, status);
      }

      /* 中断处理 (模拟) */
      static irqreturn_t my_irq_handler(int irq, void *data)
      {
          struct blk_mq_hw_ctx *hctx = data;
          struct request *rq;
          struct my_cmd *cmd;

          /* 获取完成的请求 */
          rq = my_get_completed_request(hctx);
          if (!rq)
              return IRQ_NONE;

          cmd = blk_mq_rq_to_pdu(rq);
          cmd->status = BLK_STS_OK;

          blk_mq_complete_request(rq);
          return IRQ_HANDLED;
      }

      static const struct blk_mq_ops my_mq_ops = {
          .queue_rq = my_queue_rq,
          .complete = my_complete_rq,
          .timeout = my_timeout,
          .init_hctx = my_init_hctx,
          .exit_hctx = my_exit_hctx,
          .map_queues = blk_mq_map_queues,
      };

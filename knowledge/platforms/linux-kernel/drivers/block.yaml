# Linux Kernel Block Device Driver Framework Knowledge Base
#
# Reference: https://www.kernel.org/doc/html/latest/block/index.html

# ============================================================
# GENDISK
# ============================================================

gendisk:
  description: "Generic Disk - 通用磁盘结构"
  header: "linux/blkdev.h"
  icon: "💾"
  kernel_version: "5.0+"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  registration:
    - pattern: 'alloc_disk\s*\(\s*(?P<minors>\d+)\s*\)'
      description: "分配 gendisk 结构 (已废弃，使用 blk_alloc_disk)"
    - pattern: 'blk_alloc_disk\s*\(\s*(?P<lim>[^)]*)\s*,\s*(?P<node>\w+)\s*\)'
      description: "分配带限制的 gendisk (5.14+)"
    - pattern: '__alloc_disk_node\s*\(\s*(?P<minors>\d+)\s*,\s*(?P<node>\w+)\s*\)'
      description: "分配指定 NUMA 节点的 gendisk"
    - pattern: 'add_disk\s*\(\s*(?P<disk>[^)]+)\s*\)'
      description: "将磁盘添加到系统"
    - pattern: 'device_add_disk\s*\(\s*(?P<parent>[^)]+)\s*,\s*(?P<disk>[^)]+)\s*,\s*(?P<groups>[^)]*)\s*\)'
      description: "带父设备添加磁盘"
    - pattern: 'del_gendisk\s*\(\s*(?P<disk>[^)]+)\s*\)'
      description: "从系统删除磁盘"
    - pattern: 'put_disk\s*\(\s*(?P<disk>[^)]+)\s*\)'
      description: "减少磁盘引用计数"
    - pattern: 'get_disk_and_module\s*\(\s*(?P<disk>[^)]+)\s*\)'
      description: "增加磁盘和模块引用"

  structure:
    pattern: 'struct gendisk\s*\{'
    description: "通用磁盘结构"
    fields:
      - name: "major"
        type: "int"
        description: "主设备号"
      - name: "first_minor"
        type: "int"
        description: "第一个次设备号"
      - name: "minors"
        type: "int"
        description: "分区数 (最大次设备号)"
      - name: "disk_name"
        type: "char[32]"
        description: "磁盘名称 (如 sda)"
      - name: "fops"
        type: "struct block_device_operations *"
        description: "块设备操作"
      - name: "queue"
        type: "struct request_queue *"
        description: "请求队列"
      - name: "private_data"
        type: "void *"
        description: "驱动私有数据"
      - name: "flags"
        type: "unsigned long"
        description: "磁盘标志"
      - name: "state"
        type: "unsigned long"
        description: "磁盘状态"

  helper_functions:
    - pattern: 'set_capacity\s*\(\s*(?P<disk>[^)]+)\s*,\s*(?P<size>\w+)\s*\)'
      description: "设置磁盘容量 (扇区数)"
      context: "process"
    - pattern: 'set_capacity_and_notify\s*\(\s*(?P<disk>[^)]+)\s*,\s*(?P<size>\w+)\s*\)'
      description: "设置容量并通知用户空间"
      context: "process"
    - pattern: 'get_capacity\s*\(\s*(?P<disk>[^)]+)\s*\)'
      description: "获取磁盘容量"
      context: "any"
    - pattern: 'set_disk_ro\s*\(\s*(?P<disk>[^)]+)\s*,\s*(?P<flag>\w+)\s*\)'
      description: "设置磁盘只读"
      context: "process"
    - pattern: 'bdev_check_media_change\s*\(\s*(?P<bdev>[^)]+)\s*\)'
      description: "检查介质变化"
      context: "process"


# ============================================================
# BLOCK DEVICE OPERATIONS
# ============================================================

block_device_operations:
  description: "Block Device Operations - 块设备操作结构"
  header: "linux/blkdev.h"
  icon: "⚙️"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  structure:
    pattern: 'static\s+(?:const\s+)?struct block_device_operations\s+(?P<name>\w+)\s*=\s*\{'
    description: "块设备操作结构定义"

  callbacks:
    owner:
      pattern: '\.owner\s*=\s*(?P<owner>THIS_MODULE)'
      description: "模块所有者"
      trigger: "模块引用计数"
      context: "any"

    open:
      pattern: '\.open\s*=\s*(?P<handler>\w+)'
      description: "打开块设备"
      trigger: "用户打开设备节点 (open /dev/sdX)"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct gendisk *disk, blk_mode_t mode)"
      return_value:
        success: "0"
        failure: "-ERRNO"
      typical_actions:
        - "增加使用计数"
        - "检查设备状态"
        - "初始化设备 (如首次打开)"

    release:
      pattern: '\.release\s*=\s*(?P<handler>\w+)'
      description: "释放块设备"
      trigger: "用户关闭设备"
      context: "process"
      can_sleep: true
      signature: "void (*)(struct gendisk *disk)"
      typical_actions:
        - "减少使用计数"
        - "同步缓存到设备"
        - "释放资源"

    ioctl:
      pattern: '\.ioctl\s*=\s*(?P<handler>\w+)'
      description: "处理设备特定的 IOCTL"
      trigger: "用户调用 ioctl()"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct block_device *bdev, blk_mode_t mode, unsigned cmd, unsigned long arg)"
      return_value:
        success: "0 或正值"
        failure: "-ERRNO (-ENOTTY 表示不支持)"
      typical_actions:
        - "处理设备特定命令"
        - "获取/设置设备参数"

    compat_ioctl:
      pattern: '\.compat_ioctl\s*=\s*(?P<handler>\w+)'
      description: "32位兼容 IOCTL"
      trigger: "32位用户空间调用 ioctl()"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct block_device *bdev, blk_mode_t mode, unsigned cmd, unsigned long arg)"

    getgeo:
      pattern: '\.getgeo\s*=\s*(?P<handler>\w+)'
      description: "获取磁盘几何信息"
      trigger: "HDIO_GETGEO ioctl"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct block_device *bdev, struct hd_geometry *geo)"
      typical_actions:
        - "填充 cylinders, heads, sectors"
        - "设置 start 偏移"

    check_events:
      pattern: '\.check_events\s*=\s*(?P<handler>\w+)'
      description: "检查介质事件 (插入/弹出)"
      trigger: "轮询或介质变化检测"
      context: "process"
      can_sleep: true
      signature: "unsigned int (*)(struct gendisk *disk, unsigned int clearing)"
      return_value:
        success: "DISK_EVENT_* 位掩码"

    unlock_native_capacity:
      pattern: '\.unlock_native_capacity\s*=\s*(?P<handler>\w+)'
      description: "解锁设备原始容量"
      trigger: "检测到 HPA (Host Protected Area)"
      context: "process"
      can_sleep: true
      signature: "void (*)(struct gendisk *disk)"

    alternative_gpt_sector:
      pattern: '\.alternative_gpt_sector\s*=\s*(?P<handler>\w+)'
      description: "获取备用 GPT 扇区位置"
      trigger: "GPT 分区表解析"
      context: "process"
      can_sleep: true
      signature: "sector_t (*)(struct gendisk *disk, sector_t capacity)"

    submit_bio:
      pattern: '\.submit_bio\s*=\s*(?P<handler>\w+)'
      description: "提交 BIO (用于堆叠设备)"
      trigger: "bio 提交"
      context: "process/softirq"
      can_sleep: false
      signature: "void (*)(struct bio *bio)"

    pr_ops:
      pattern: '\.pr_ops\s*=\s*(?P<handler>\w+)'
      description: "持久预留操作"
      trigger: "PR IOCTL 命令"
      context: "process"
      can_sleep: true

    free_disk:
      pattern: '\.free_disk\s*=\s*(?P<handler>\w+)'
      description: "释放磁盘时的清理"
      trigger: "磁盘引用计数归零"
      context: "process"
      can_sleep: true
      signature: "void (*)(struct gendisk *disk)"


# ============================================================
# BLK-MQ TAG SET
# ============================================================

blk_mq_tag_set:
  description: "Block Multi-Queue Tag Set - 多队列标签集"
  header: "linux/blk-mq.h"
  icon: "🏷️"
  kernel_version: "3.13+"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  registration:
    - pattern: 'blk_mq_alloc_tag_set\s*\(\s*(?P<set>[^)]+)\s*\)'
      description: "分配多队列标签集"
    - pattern: 'blk_mq_free_tag_set\s*\(\s*(?P<set>[^)]+)\s*\)'
      description: "释放多队列标签集"

  structure:
    pattern: 'struct blk_mq_tag_set\s*(?P<name>\w+)\s*=\s*\{'
    description: "多队列标签集结构"
    fields:
      - name: "ops"
        type: "const struct blk_mq_ops *"
        description: "多队列操作"
      - name: "nr_hw_queues"
        type: "unsigned int"
        description: "硬件队列数"
      - name: "queue_depth"
        type: "unsigned int"
        description: "每队列深度"
      - name: "reserved_tags"
        type: "unsigned int"
        description: "保留标签数"
      - name: "cmd_size"
        type: "unsigned int"
        description: "驱动命令结构大小"
      - name: "numa_node"
        type: "int"
        description: "NUMA 节点"
      - name: "timeout"
        type: "unsigned int"
        description: "请求超时 (jiffies)"
      - name: "flags"
        type: "unsigned int"
        description: "BLK_MQ_F_* 标志"
      - name: "driver_data"
        type: "void *"
        description: "驱动私有数据"


# ============================================================
# BLK-MQ OPS
# ============================================================

blk_mq_ops:
  description: "Block Multi-Queue Operations - 多队列操作"
  header: "linux/blk-mq.h"
  icon: "⚡"
  kernel_version: "3.13+"

  context:
    type: "varies"
    can_sleep: "depends on callback"

  structure:
    pattern: 'static\s+(?:const\s+)?struct blk_mq_ops\s+(?P<name>\w+)\s*=\s*\{'
    description: "多队列操作结构定义"

  callbacks:
    queue_rq:
      pattern: '\.queue_rq\s*=\s*(?P<handler>\w+)'
      description: "处理请求 (必须实现)"
      trigger: "请求分发到硬件队列"
      context: "softirq/process"
      can_sleep: false
      signature: "blk_status_t (*)(struct blk_mq_hw_ctx *hctx, const struct blk_mq_queue_data *bd)"
      return_value:
        success: "BLK_STS_OK"
        failure: "BLK_STS_* 错误码"
      typical_actions:
        - "从 bd->rq 获取请求"
        - "设置 DMA 映射"
        - "将命令发送到硬件"
        - "调用 blk_mq_start_request()"

    commit_rqs:
      pattern: '\.commit_rqs\s*=\s*(?P<handler>\w+)'
      description: "提交批量请求"
      trigger: "批量请求需要提交到硬件"
      context: "softirq"
      can_sleep: false
      signature: "void (*)(struct blk_mq_hw_ctx *hctx)"
      typical_actions:
        - "触发硬件门铃"
        - "启动 DMA"

    complete:
      pattern: '\.complete\s*=\s*(?P<handler>\w+)'
      description: "完成请求 (可选)"
      trigger: "请求完成处理"
      context: "softirq/hardirq"
      can_sleep: false
      signature: "void (*)(struct request *rq)"

    timeout:
      pattern: '\.timeout\s*=\s*(?P<handler>\w+)'
      description: "处理请求超时"
      trigger: "请求超过 tag_set.timeout"
      context: "softirq"
      can_sleep: false
      signature: "enum blk_eh_timer_return (*)(struct request *rq)"
      return_value:
        BLK_EH_DONE: "超时已处理"
        BLK_EH_RESET_TIMER: "重置定时器"
      typical_actions:
        - "中止硬件命令"
        - "重置设备"
        - "记录错误日志"

    poll:
      pattern: '\.poll\s*=\s*(?P<handler>\w+)'
      description: "轮询完成 (io_uring)"
      trigger: "io_uring 轮询模式"
      context: "process"
      can_sleep: false
      signature: "int (*)(struct blk_mq_hw_ctx *hctx, struct io_comp_batch *iob)"

    init_hctx:
      pattern: '\.init_hctx\s*=\s*(?P<handler>\w+)'
      description: "初始化硬件队列上下文"
      trigger: "创建硬件队列"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct blk_mq_hw_ctx *hctx, void *data, unsigned int hctx_idx)"
      return_value:
        success: "0"
        failure: "-ERRNO"
      typical_actions:
        - "分配队列私有数据"
        - "初始化硬件队列"

    exit_hctx:
      pattern: '\.exit_hctx\s*=\s*(?P<handler>\w+)'
      description: "清理硬件队列上下文"
      trigger: "销毁硬件队列"
      context: "process"
      can_sleep: true
      signature: "void (*)(struct blk_mq_hw_ctx *hctx, unsigned int hctx_idx)"

    init_request:
      pattern: '\.init_request\s*=\s*(?P<handler>\w+)'
      description: "初始化请求私有数据"
      trigger: "分配请求"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct blk_mq_tag_set *set, struct request *rq, unsigned int hctx_idx, unsigned int numa_node)"

    exit_request:
      pattern: '\.exit_request\s*=\s*(?P<handler>\w+)'
      description: "清理请求私有数据"
      trigger: "释放请求"
      context: "process"
      can_sleep: true
      signature: "void (*)(struct blk_mq_tag_set *set, struct request *rq, unsigned int hctx_idx)"

    map_queues:
      pattern: '\.map_queues\s*=\s*(?P<handler>\w+)'
      description: "映射 CPU 到硬件队列"
      trigger: "设置 CPU 到队列映射"
      context: "process"
      can_sleep: true
      signature: "void (*)(struct blk_mq_tag_set *set)"
      typical_actions:
        - "使用 blk_mq_map_queues()"
        - "设置 NUMA 感知映射"

    show_rq:
      pattern: '\.show_rq\s*=\s*(?P<handler>\w+)'
      description: "显示请求调试信息"
      trigger: "debugfs 读取"
      context: "process"
      can_sleep: true
      signature: "void (*)(struct seq_file *m, struct request *rq)"


# ============================================================
# REQUEST QUEUE
# ============================================================

request_queue:
  description: "Request Queue - 请求队列"
  header: "linux/blkdev.h"
  icon: "📋"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  registration:
    - pattern: 'blk_mq_init_queue\s*\(\s*(?P<set>[^)]+)\s*\)'
      description: "初始化多队列请求队列"
    - pattern: 'blk_mq_alloc_queue\s*\(\s*(?P<set>[^)]+)\s*,\s*(?P<lim>[^)]*)\s*,\s*(?P<data>[^)]*)\s*\)'
      description: "分配多队列请求队列 (6.0+)"
    - pattern: 'blk_mq_destroy_queue\s*\(\s*(?P<q>[^)]+)\s*\)'
      description: "销毁多队列请求队列"
    - pattern: 'blk_put_queue\s*\(\s*(?P<q>[^)]+)\s*\)'
      description: "减少队列引用"
    - pattern: 'blk_get_queue\s*\(\s*(?P<q>[^)]+)\s*\)'
      description: "增加队列引用"

  helper_functions:
    - pattern: 'blk_queue_logical_block_size\s*\(\s*(?P<q>[^)]+)\s*,\s*(?P<size>\w+)\s*\)'
      description: "设置逻辑块大小"
      context: "process"
    - pattern: 'blk_queue_physical_block_size\s*\(\s*(?P<q>[^)]+)\s*,\s*(?P<size>\w+)\s*\)'
      description: "设置物理块大小"
      context: "process"
    - pattern: 'blk_queue_max_hw_sectors\s*\(\s*(?P<q>[^)]+)\s*,\s*(?P<max>\w+)\s*\)'
      description: "设置最大硬件扇区数"
      context: "process"
    - pattern: 'blk_queue_max_segments\s*\(\s*(?P<q>[^)]+)\s*,\s*(?P<max>\w+)\s*\)'
      description: "设置最大段数"
      context: "process"
    - pattern: 'blk_queue_max_segment_size\s*\(\s*(?P<q>[^)]+)\s*,\s*(?P<max>\w+)\s*\)'
      description: "设置最大段大小"
      context: "process"
    - pattern: 'blk_queue_max_discard_sectors\s*\(\s*(?P<q>[^)]+)\s*,\s*(?P<max>\w+)\s*\)'
      description: "设置最大丢弃扇区数"
      context: "process"
    - pattern: 'blk_queue_flag_set\s*\(\s*(?P<flag>\w+)\s*,\s*(?P<q>[^)]+)\s*\)'
      description: "设置队列标志"
      context: "process"
    - pattern: 'blk_queue_flag_clear\s*\(\s*(?P<flag>\w+)\s*,\s*(?P<q>[^)]+)\s*\)'
      description: "清除队列标志"
      context: "process"
    - pattern: 'blk_queue_chunk_sectors\s*\(\s*(?P<q>[^)]+)\s*,\s*(?P<size>\w+)\s*\)'
      description: "设置分块扇区数"
      context: "process"
    - pattern: 'blk_queue_io_min\s*\(\s*(?P<q>[^)]+)\s*,\s*(?P<min>\w+)\s*\)'
      description: "设置最小 IO 大小"
      context: "process"
    - pattern: 'blk_queue_io_opt\s*\(\s*(?P<q>[^)]+)\s*,\s*(?P<opt>\w+)\s*\)'
      description: "设置最优 IO 大小"
      context: "process"


# ============================================================
# REQUEST
# ============================================================

request:
  description: "Request - 块设备请求"
  header: "linux/blk-mq.h"
  icon: "📝"

  context:
    type: "varies"
    can_sleep: "depends on operation"

  helper_functions:
    - pattern: 'blk_mq_start_request\s*\(\s*(?P<rq>[^)]+)\s*\)'
      description: "开始处理请求 (必须在 queue_rq 中调用)"
      context: "softirq"
    - pattern: 'blk_mq_end_request\s*\(\s*(?P<rq>[^)]+)\s*,\s*(?P<status>\w+)\s*\)'
      description: "完成请求"
      context: "softirq/hardirq"
    - pattern: 'blk_mq_complete_request\s*\(\s*(?P<rq>[^)]+)\s*\)'
      description: "异步完成请求"
      context: "hardirq"
    - pattern: 'blk_mq_requeue_request\s*\(\s*(?P<rq>[^)]+)\s*,\s*(?P<kick>\w+)\s*\)'
      description: "重新入队请求"
      context: "softirq"
    - pattern: 'blk_mq_delay_kick_requeue_list\s*\(\s*(?P<hctx>[^)]+)\s*,\s*(?P<delay>\w+)\s*\)'
      description: "延迟启动重入队列表"
      context: "softirq"
    - pattern: 'blk_rq_bytes\s*\(\s*(?P<rq>[^)]+)\s*\)'
      description: "获取请求字节数"
      context: "any"
    - pattern: 'blk_rq_sectors\s*\(\s*(?P<rq>[^)]+)\s*\)'
      description: "获取请求扇区数"
      context: "any"
    - pattern: 'blk_rq_pos\s*\(\s*(?P<rq>[^)]+)\s*\)'
      description: "获取请求起始扇区"
      context: "any"
    - pattern: 'blk_rq_cur_bytes\s*\(\s*(?P<rq>[^)]+)\s*\)'
      description: "获取当前段字节数"
      context: "any"
    - pattern: 'blk_rq_cur_sectors\s*\(\s*(?P<rq>[^)]+)\s*\)'
      description: "获取当前段扇区数"
      context: "any"
    - pattern: 'rq_data_dir\s*\(\s*(?P<rq>[^)]+)\s*\)'
      description: "获取请求方向 (READ/WRITE)"
      context: "any"
    - pattern: 'req_op\s*\(\s*(?P<rq>[^)]+)\s*\)'
      description: "获取请求操作类型"
      context: "any"
    - pattern: 'blk_rq_map_sg\s*\(\s*(?P<q>[^)]+)\s*,\s*(?P<rq>[^)]+)\s*,\s*(?P<sg>[^)]+)\s*\)'
      description: "映射请求到 scatter-gather 列表"
      context: "softirq"
    - pattern: 'blk_mq_rq_to_pdu\s*\(\s*(?P<rq>[^)]+)\s*\)'
      description: "获取请求的驱动私有数据"
      context: "any"
    - pattern: 'blk_mq_rq_from_pdu\s*\(\s*(?P<pdu>[^)]+)\s*\)'
      description: "从驱动私有数据获取请求"
      context: "any"


# ============================================================
# BIO
# ============================================================

bio:
  description: "Block I/O - 块 IO 结构"
  header: "linux/bio.h"
  icon: "🧬"

  context:
    type: "varies"
    can_sleep: "depends on allocation flags"

  registration:
    - pattern: 'bio_alloc\s*\(\s*(?P<bdev>[^)]+)\s*,\s*(?P<nr_vecs>\w+)\s*,\s*(?P<opf>\w+)\s*,\s*(?P<gfp>\w+)\s*\)'
      description: "分配 BIO"
    - pattern: 'bio_alloc_bioset\s*\(\s*(?P<bdev>[^)]+)\s*,\s*(?P<nr_vecs>\w+)\s*,\s*(?P<opf>\w+)\s*,\s*(?P<gfp>\w+)\s*,\s*(?P<bs>[^)]+)\s*\)'
      description: "从 bioset 分配 BIO"
    - pattern: 'bio_put\s*\(\s*(?P<bio>[^)]+)\s*\)'
      description: "释放 BIO"
    - pattern: 'bio_chain\s*\(\s*(?P<bio>[^)]+)\s*,\s*(?P<parent>[^)]+)\s*\)'
      description: "链接 BIO"

  helper_functions:
    - pattern: 'bio_add_page\s*\(\s*(?P<bio>[^)]+)\s*,\s*(?P<page>[^)]+)\s*,\s*(?P<len>\w+)\s*,\s*(?P<off>\w+)\s*\)'
      description: "添加页到 BIO"
      context: "process"
    - pattern: 'bio_add_folio\s*\(\s*(?P<bio>[^)]+)\s*,\s*(?P<folio>[^)]+)\s*,\s*(?P<len>\w+)\s*,\s*(?P<off>\w+)\s*\)'
      description: "添加 folio 到 BIO"
      context: "process"
    - pattern: 'submit_bio\s*\(\s*(?P<bio>[^)]+)\s*\)'
      description: "提交 BIO"
      context: "process/softirq"
    - pattern: 'submit_bio_wait\s*\(\s*(?P<bio>[^)]+)\s*\)'
      description: "同步提交 BIO"
      context: "process"
    - pattern: 'bio_endio\s*\(\s*(?P<bio>[^)]+)\s*\)'
      description: "完成 BIO"
      context: "softirq/hardirq"
    - pattern: 'bio_set_dev\s*\(\s*(?P<bio>[^)]+)\s*,\s*(?P<bdev>[^)]+)\s*\)'
      description: "设置 BIO 目标设备"
      context: "any"
    - pattern: 'bio_for_each_segment\s*\(\s*(?P<bvec>\w+)\s*,\s*(?P<bio>[^)]+)\s*,\s*(?P<iter>\w+)\s*\)'
      description: "遍历 BIO 段"
      context: "any"
    - pattern: 'bio_for_each_bvec\s*\(\s*(?P<bvec>\w+)\s*,\s*(?P<bio>[^)]+)\s*,\s*(?P<iter>\w+)\s*\)'
      description: "遍历 BIO bvec"
      context: "any"


# ============================================================
# CALL CHAINS
# ============================================================

call_chains:
  submit_bio_chain:
    description: "BIO 提交调用链"
    trigger: "用户/文件系统提交 bio"
    chain:
      - function: "submit_bio"
        file: "block/blk-core.c"
        description: "BIO 提交入口"
        context: "process"
      - function: "submit_bio_noacct"
        file: "block/blk-core.c"
        description: "无统计提交"
      - function: "__submit_bio"
        file: "block/blk-core.c"
        description: "内部提交"
      - function: "blk_mq_submit_bio"
        file: "block/blk-mq.c"
        description: "多队列提交"
      - function: "blk_mq_get_request"
        file: "block/blk-mq.c"
        description: "获取请求"
      - function: "blk_mq_try_issue_directly"
        file: "block/blk-mq.c"
        description: "尝试直接发送"
      - function: "queue_rq"
        file: "驱动代码"
        description: "驱动请求处理"
        is_user_entry: true

  request_completion_chain:
    description: "请求完成调用链"
    trigger: "硬件完成中断"
    chain:
      - function: "irq_handler"
        file: "驱动代码"
        description: "硬件中断处理"
        context: "hardirq"
      - function: "blk_mq_complete_request"
        file: "block/blk-mq.c"
        description: "请求完成"
      - function: "__blk_mq_complete_request"
        file: "block/blk-mq.c"
        description: "内部完成处理"
        context: "softirq"
      - function: "blk_mq_end_request"
        file: "block/blk-mq.c"
        description: "结束请求"
      - function: "blk_update_request"
        file: "block/blk-core.c"
        description: "更新请求状态"
      - function: "bio_endio"
        file: "block/bio.c"
        description: "完成 BIO"

  blk_open_chain:
    description: "块设备打开调用链"
    trigger: "用户打开 /dev/sdX"
    chain:
      - function: "blkdev_open"
        file: "block/bdev.c"
        description: "块设备打开"
        context: "process"
      - function: "blkdev_get_by_dev"
        file: "block/bdev.c"
        description: "通过设备号获取"
      - function: "blkdev_get_whole"
        file: "block/bdev.c"
        description: "获取整个设备"
      - function: "disk->fops->open"
        file: "驱动代码"
        description: "驱动打开回调"
        is_user_entry: true



# Backlight Subsystem Knowledge Base
# Reference: https://www.kernel.org/doc/html/latest/driver-api/backlight/

# ============================================================
# BACKLIGHT DEVICE
# ============================================================
backlight_device:
  description: "Backlight Device Driver"
  header: "linux/backlight.h"
  icon: "💡"
  registration:
    - pattern: 'backlight_device_register\s*\(\s*"(?P<name>[^"]+)"\s*,\s*(?P<dev>\w+)\s*,\s*(?P<devdata>\w+)\s*,\s*&(?P<ops>\w+)\s*,\s*&(?P<props>\w+)\s*\)'
      description: "注册背光设备"
    - pattern: 'devm_backlight_device_register\s*\(\s*(?P<dev>\w+)\s*,'
      description: "托管注册背光设备"
  unregistration:
    - pattern: 'backlight_device_unregister\s*\(\s*(?P<bd>\w+)\s*\)'
      description: "注销背光设备"
  structure:
    name: "backlight_ops"
    callbacks:
      update_status:
        pattern: '\.update_status\s*=\s*(?P<handler>\w+)'
        description: "更新背光状态"
        context: "process"
        can_sleep: true
      get_brightness:
        pattern: '\.get_brightness\s*=\s*(?P<handler>\w+)'
        description: "获取当前亮度"
        context: "process"
        can_sleep: true
      check_fb:
        pattern: '\.check_fb\s*=\s*(?P<handler>\w+)'
        description: "检查 framebuffer 关联"
        context: "process"
        can_sleep: false
  helpers:
    - pattern: 'backlight_update_status\s*\(\s*(?P<bd>\w+)\s*\)'
      description: "更新背光状态"
    - pattern: 'backlight_force_update\s*\(\s*(?P<bd>\w+)\s*,\s*(?P<reason>\w+)\s*\)'
      description: "强制更新背光"
    - pattern: 'backlight_enable\s*\(\s*(?P<bd>\w+)\s*\)'
      description: "启用背光"
    - pattern: 'backlight_disable\s*\(\s*(?P<bd>\w+)\s*\)'
      description: "禁用背光"
    - pattern: 'backlight_get_brightness\s*\(\s*(?P<bd>\w+)\s*\)'
      description: "获取亮度"
  properties:
    - brightness: "当前亮度"
    - max_brightness: "最大亮度"
    - power: "电源状态"
    - type: "背光类型"
    - state: "状态标志"
  backlight_types:
    - BACKLIGHT_RAW: "原始控制"
    - BACKLIGHT_PLATFORM: "平台控制"
    - BACKLIGHT_FIRMWARE: "固件控制"

# ============================================================
# PWM BACKLIGHT
# ============================================================
pwm_backlight:
  description: "PWM Backlight"
  header: "linux/pwm_backlight.h"
  icon: "⚡"
  patterns:
    - pattern: 'pwm_backlight_probe\s*\('
      description: "PWM 背光探测"
  platform_data:
    name: "platform_pwm_backlight_data"
    fields:
      - pwm_id: "PWM 设备 ID"
      - max_brightness: "最大亮度"
      - dft_brightness: "默认亮度"
      - pwm_period_ns: "PWM 周期（纳秒）"

# ============================================================
# GPIO BACKLIGHT
# ============================================================
gpio_backlight:
  description: "GPIO Backlight"
  header: "linux/gpio/consumer.h"
  icon: "🔌"
  patterns:
    - pattern: 'gpio_backlight_probe\s*\('
      description: "GPIO 背光探测"

# ============================================================
# CALL CHAINS
# ============================================================
call_chains:
  backlight_set:
    description: "Backlight Brightness Setting"
    chain:
      - caller: "sysfs write"
        callee: "backlight_store_brightness"
        description: "sysfs 写入"
      - caller: "backlight_store_brightness"
        callee: "backlight_update_status"
        description: "更新状态"
      - caller: "backlight_update_status"
        callee: "bd->ops->update_status"
        description: "调用驱动更新"

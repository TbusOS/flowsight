# Backlight Subsystem Knowledge Base
# Reference: https://www.kernel.org/doc/html/latest/driver-api/backlight/

# ============================================================
# BACKLIGHT DEVICE
# ============================================================
backlight_device:
  description: "Backlight Device Driver"
  header: "linux/backlight.h"
  icon: "💡"
  kernel_version: "2.6.25+"
  registration:
    - pattern: 'backlight_device_register\s*\(\s*"(?P<name>[^"]+)"\s*,\s*(?P<dev>\w+)\s*,\s*(?P<devdata>\w+)\s*,\s*&(?P<ops>\w+)\s*,\s*&(?P<props>\w+)\s*\)'
      description: "注册背光设备"
    - pattern: 'devm_backlight_device_register\s*\(\s*(?P<dev>\w+)\s*,'
      description: "托管注册背光设备"
  unregistration:
    - pattern: 'backlight_device_unregister\s*\(\s*(?P<bd>\w+)\s*\)'
      description: "注销背光设备"
  structure:
    name: "backlight_ops"
    callbacks:
      update_status:
        pattern: '\.update_status\s*=\s*(?P<handler>\w+)'
        description: "更新背光状态"
        context: "process"
        can_sleep: true
      get_brightness:
        pattern: '\.get_brightness\s*=\s*(?P<handler>\w+)'
        description: "获取当前亮度"
        context: "process"
        can_sleep: true
      check_fb:
        pattern: '\.check_fb\s*=\s*(?P<handler>\w+)'
        description: "检查 framebuffer 关联"
        context: "process"
        can_sleep: false
  helpers:
    - pattern: 'backlight_update_status\s*\(\s*(?P<bd>\w+)\s*\)'
      description: "更新背光状态"
    - pattern: 'backlight_force_update\s*\(\s*(?P<bd>\w+)\s*,\s*(?P<reason>\w+)\s*\)'
      description: "强制更新背光"
    - pattern: 'backlight_enable\s*\(\s*(?P<bd>\w+)\s*\)'
      description: "启用背光"
    - pattern: 'backlight_disable\s*\(\s*(?P<bd>\w+)\s*\)'
      description: "禁用背光"
    - pattern: 'backlight_get_brightness\s*\(\s*(?P<bd>\w+)\s*\)'
      description: "获取亮度"
  properties:
    - brightness: "当前亮度"
    - max_brightness: "最大亮度"
    - power: "电源状态"
    - type: "背光类型"
    - state: "状态标志"
  backlight_types:
    - BACKLIGHT_RAW: "原始控制"
    - BACKLIGHT_PLATFORM: "平台控制"
    - BACKLIGHT_FIRMWARE: "固件控制"

# ============================================================
# PWM BACKLIGHT
# ============================================================
pwm_backlight:
  description: "PWM Backlight"
  header: "linux/pwm_backlight.h"
  icon: "⚡"
  patterns:
    - pattern: 'pwm_backlight_probe\s*\('
      description: "PWM 背光探测"
  platform_data:
    name: "platform_pwm_backlight_data"
    fields:
      - pwm_id: "PWM 设备 ID"
      - max_brightness: "最大亮度"
      - dft_brightness: "默认亮度"
      - pwm_period_ns: "PWM 周期（纳秒）"

# ============================================================
# GPIO BACKLIGHT
# ============================================================
gpio_backlight:
  description: "GPIO Backlight"
  header: "linux/gpio/consumer.h"
  icon: "🔌"
  patterns:
    - pattern: 'gpio_backlight_probe\s*\('
      description: "GPIO 背光探测"

# ============================================================
# CALL CHAINS
# ============================================================
call_chains:
  backlight_set:
    description: "Backlight Brightness Setting"
    chain:
      - caller: "sysfs write"
        callee: "backlight_store_brightness"
        description: "sysfs 写入"
      - caller: "backlight_store_brightness"
        callee: "backlight_update_status"
        description: "更新状态"
      - caller: "backlight_update_status"
        callee: "bd->ops->update_status"
        description: "调用驱动更新"


# ============================================================
# DATA STRUCTURES
# ============================================================

data_structures:
  backlight_device:
    pattern: 'struct backlight_device\s*\{'
    description: "背光设备结构"
    file: "include/linux/backlight.h"
    fields:
      - name: "props"
        type: "struct backlight_properties"
        description: "背光属性"
      - name: "ops"
        type: "const struct backlight_ops *"
        description: "操作函数表"
      - name: "fb_bl_on"
        type: "struct list_head[]"
        description: "关联的 framebuffer"
      - name: "dev"
        type: "struct device"
        description: "内嵌设备"

  backlight_properties:
    pattern: 'struct backlight_properties\s*\{'
    description: "背光属性结构"
    file: "include/linux/backlight.h"
    fields:
      - name: "brightness"
        type: "int"
        description: "当前亮度"
      - name: "max_brightness"
        type: "int"
        description: "最大亮度"
      - name: "power"
        type: "int"
        description: "电源状态"
      - name: "type"
        type: "enum backlight_type"
        description: "背光类型"
      - name: "state"
        type: "unsigned int"
        description: "状态标志"


# ============================================================
# EXAMPLES
# ============================================================

examples:
  - description: "基本背光驱动示例"
    kernel_version: "5.0+"
    code: |
      #include <linux/module.h>
      #include <linux/backlight.h>
      #include <linux/platform_device.h>
      
      struct my_bl_data {
          struct backlight_device *bd;
          int current_brightness;
      };
      
      static int my_bl_update_status(struct backlight_device *bd)
      {
          struct my_bl_data *data = bl_get_data(bd);
          int brightness = bd->props.brightness;
          
          if (bd->props.power != FB_BLANK_UNBLANK ||
              bd->props.state & BL_CORE_SUSPENDED)
              brightness = 0;
          
          /* 设置硬件亮度 */
          data->current_brightness = brightness;
          my_hw_set_brightness(brightness);
          
          return 0;
      }
      
      static int my_bl_get_brightness(struct backlight_device *bd)
      {
          struct my_bl_data *data = bl_get_data(bd);
          return data->current_brightness;
      }
      
      static const struct backlight_ops my_bl_ops = {
          .update_status  = my_bl_update_status,
          .get_brightness = my_bl_get_brightness,
      };
      
      static int my_bl_probe(struct platform_device *pdev)
      {
          struct my_bl_data *data;
          struct backlight_properties props;
          
          data = devm_kzalloc(&pdev->dev, sizeof(*data), GFP_KERNEL);
          if (!data)
              return -ENOMEM;
          
          memset(&props, 0, sizeof(props));
          props.type = BACKLIGHT_RAW;
          props.max_brightness = 255;
          props.brightness = 128;
          
          data->bd = devm_backlight_device_register(&pdev->dev,
                                                     "my-backlight",
                                                     &pdev->dev, data,
                                                     &my_bl_ops, &props);
          if (IS_ERR(data->bd))
              return PTR_ERR(data->bd);
          
          platform_set_drvdata(pdev, data);
          backlight_update_status(data->bd);
          
          return 0;
      }
      
      static struct platform_driver my_bl_driver = {
          .probe  = my_bl_probe,
          .driver = {
              .name = "my-backlight",
          },
      };
      module_platform_driver(my_bl_driver);

  - description: "PWM 背光驱动示例"
    kernel_version: "5.0+"
    code: |
      #include <linux/module.h>
      #include <linux/backlight.h>
      #include <linux/platform_device.h>
      #include <linux/pwm.h>
      
      struct pwm_bl_data {
          struct backlight_device *bd;
          struct pwm_device *pwm;
          unsigned int max_brightness;
          bool enabled;
      };
      
      static int pwm_bl_update_status(struct backlight_device *bd)
      {
          struct pwm_bl_data *pb = bl_get_data(bd);
          int brightness = bd->props.brightness;
          struct pwm_state state;
          
          if (bd->props.power != FB_BLANK_UNBLANK ||
              bd->props.state & (BL_CORE_SUSPENDED | BL_CORE_FBBLANK))
              brightness = 0;
          
          pwm_get_state(pb->pwm, &state);
          state.duty_cycle = DIV_ROUND_UP(brightness * state.period,
                                          pb->max_brightness);
          state.enabled = brightness > 0;
          
          pwm_apply_state(pb->pwm, &state);
          pb->enabled = state.enabled;
          
          return 0;
      }
      
      static const struct backlight_ops pwm_bl_ops = {
          .options        = BL_CORE_SUSPENDRESUME,
          .update_status  = pwm_bl_update_status,
      };
      
      static int pwm_bl_probe(struct platform_device *pdev)
      {
          struct pwm_bl_data *pb;
          struct backlight_properties props;
          
          pb = devm_kzalloc(&pdev->dev, sizeof(*pb), GFP_KERNEL);
          if (!pb)
              return -ENOMEM;
          
          pb->pwm = devm_pwm_get(&pdev->dev, NULL);
          if (IS_ERR(pb->pwm))
              return PTR_ERR(pb->pwm);
          
          pb->max_brightness = 255;
          
          memset(&props, 0, sizeof(props));
          props.type = BACKLIGHT_RAW;
          props.max_brightness = pb->max_brightness;
          props.brightness = pb->max_brightness;
          
          pb->bd = devm_backlight_device_register(&pdev->dev,
                      dev_name(&pdev->dev), &pdev->dev, pb,
                      &pwm_bl_ops, &props);
          if (IS_ERR(pb->bd))
              return PTR_ERR(pb->bd);
          
          backlight_update_status(pb->bd);
          return 0;
      }
      
      static const struct of_device_id pwm_bl_of_match[] = {
          { .compatible = "pwm-backlight" },
          { }
      };
      MODULE_DEVICE_TABLE(of, pwm_bl_of_match);
      
      static struct platform_driver pwm_bl_driver = {
          .probe  = pwm_bl_probe,
          .driver = {
              .name           = "pwm-backlight",
              .of_match_table = pwm_bl_of_match,
          },
      };
      module_platform_driver(pwm_bl_driver);

# ============================================================
# ADDITIONAL DATA STRUCTURES
# ============================================================

  backlight_ops:
    pattern: 'struct backlight_ops\s*\{'
    description: "背光操作函数表"
    file: "include/linux/backlight.h"
    fields:
      - name: "options"
        type: "unsigned int"
        description: "选项标志 (BL_CORE_SUSPENDRESUME)"
      - name: "update_status"
        type: "int (*)(struct backlight_device *)"
        description: "更新背光状态回调"
      - name: "get_brightness"
        type: "int (*)(struct backlight_device *)"
        description: "获取当前亮度回调"
      - name: "check_fb"
        type: "int (*)(struct backlight_device *, struct fb_info *)"
        description: "检查 framebuffer 关联"

# ============================================================
# ADDITIONAL CALL CHAINS
# ============================================================

  backlight_suspend:
    description: "Backlight Suspend Flow"
    chain:
      - caller: "pm_runtime_suspend"
        callee: "backlight_suspend"
        description: "系统挂起触发"
      - caller: "backlight_suspend"
        callee: "bd->ops->update_status"
        description: "设置挂起状态"
        note: "props.state |= BL_CORE_SUSPENDED"

  backlight_resume:
    description: "Backlight Resume Flow"
    chain:
      - caller: "pm_runtime_resume"
        callee: "backlight_resume"
        description: "系统恢复触发"
      - caller: "backlight_resume"
        callee: "backlight_update_status"
        description: "恢复亮度状态"

  backlight_notifier:
    description: "Framebuffer Notifier Chain"
    chain:
      - caller: "fb_notifier_call_chain"
        callee: "backlight_fb_notifier_callback"
        mechanism: "notifier"
        description: "FB 事件通知"
      - caller: "backlight_fb_notifier_callback"
        callee: "backlight_update_status"
        description: "更新背光状态"

# ============================================================
# DEVICE TREE BINDINGS
# ============================================================

device_tree:
  pwm_backlight:
    description: "PWM 背光设备树绑定"
    compatible: "pwm-backlight"
    example: |
      backlight: backlight {
          compatible = "pwm-backlight";
          pwms = <&pwm0 0 5000000 0>;
          brightness-levels = <0 4 8 16 32 64 128 255>;
          default-brightness-level = <6>;
          power-supply = <&vdd_bl>;
      };

  gpio_backlight:
    description: "GPIO 背光设备树绑定"
    compatible: "gpio-backlight"
    example: |
      backlight: backlight {
          compatible = "gpio-backlight";
          gpios = <&gpio1 12 GPIO_ACTIVE_HIGH>;
          default-on;
      };

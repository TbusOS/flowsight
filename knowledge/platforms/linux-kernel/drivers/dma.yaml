  header: "linux/dmaengine.h"

  directions:
    - name: "DMA_MEM_TO_MEM"
      description: "内存到内存"
    - name: "DMA_MEM_TO_DEV"
      description: "内存到设备 (发送)"
    - name: "DMA_DEV_TO_MEM"
      description: "设备到内存 (接收)"
    - name: "DMA_DEV_TO_DEV"
      description: "设备到设备"

dma_slave_buswidth:
  description: "DMA Slave Bus Width - 从设备总线宽度"
  header: "linux/dmaengine.h"

  widths:
    - name: "DMA_SLAVE_BUSWIDTH_UNDEFINED"
      description: "未定义"
    - name: "DMA_SLAVE_BUSWIDTH_1_BYTE"
      description: "1 字节"
    - name: "DMA_SLAVE_BUSWIDTH_2_BYTES"
      description: "2 字节"
    - name: "DMA_SLAVE_BUSWIDTH_3_BYTES"
      description: "3 字节"
    - name: "DMA_SLAVE_BUSWIDTH_4_BYTES"
      description: "4 字节"
    - name: "DMA_SLAVE_BUSWIDTH_8_BYTES"
      description: "8 字节"
    - name: "DMA_SLAVE_BUSWIDTH_16_BYTES"
      description: "16 字节"
    - name: "DMA_SLAVE_BUSWIDTH_32_BYTES"
      description: "32 字节"
    - name: "DMA_SLAVE_BUSWIDTH_64_BYTES"
      description: "64 字节"

dma_ctrl_flags:
  description: "DMA Control Flags - DMA 控制标志"
  header: "linux/dmaengine.h"

  flags:
    - name: "DMA_PREP_INTERRUPT"
      description: "传输完成后触发中断"
    - name: "DMA_CTRL_ACK"
      description: "描述符可被重用"
    - name: "DMA_PREP_PQ_DISABLE_P"
      description: "禁用 P 计算"
    - name: "DMA_PREP_PQ_DISABLE_Q"
      description: "禁用 Q 计算"
    - name: "DMA_PREP_CONTINUE"
      description: "继续上一次传输"
    - name: "DMA_PREP_FENCE"
      description: "内存栅栏"
    - name: "DMA_PREP_CMD"
      description: "命令传输"


# ============================================================
# CALL CHAINS
# ============================================================

call_chains:
  dma_slave_transfer:
    description: "从设备 DMA 传输调用链"
    trigger: "驱动发起 DMA 传输"
    chain:
      - function: "dma_request_chan"
        file: "drivers/dma/dmaengine.c"
        description: "请求通道"
        context: "process"
      - function: "dmaengine_slave_config"
        file: "drivers/dma/dmaengine.c"
        description: "配置从设备参数"
      - function: "device_config"
        file: "驱动代码"
        description: "驱动配置回调"
        is_user_entry: true
      - function: "dmaengine_prep_slave_sg"
        file: "drivers/dma/dmaengine.c"
        description: "准备 scatter-gather 传输"
      - function: "device_prep_slave_sg"
        file: "驱动代码"
        description: "驱动准备回调"
        is_user_entry: true
      - function: "dmaengine_submit"
        file: "drivers/dma/dmaengine.c"
        description: "提交描述符"
      - function: "tx_submit"
        file: "驱动代码"
        description: "驱动提交回调"
        is_user_entry: true
      - function: "dma_async_issue_pending"
        file: "drivers/dma/dmaengine.c"
        description: "启动传输"
      - function: "device_issue_pending"
        file: "驱动代码"
        description: "驱动启动回调"
        is_user_entry: true

  dma_completion_chain:
    description: "DMA 完成调用链"
    trigger: "DMA 硬件完成传输"
    chain:
      - function: "dma_irq_handler"
        file: "驱动代码"
        description: "DMA 中断处理"
        context: "hardirq"
        is_user_entry: true
      - function: "dmaengine_desc_callback_invoke"
        file: "drivers/dma/dmaengine.h"
        description: "调用完成回调"
        context: "tasklet/softirq"
      - function: "callback"
        file: "客户端代码"
        description: "客户端完成回调"
        is_user_entry: true

  dma_memcpy_chain:
    description: "DMA 内存拷贝调用链"
    trigger: "请求 DMA 内存拷贝"
    chain:
      - function: "dmaengine_prep_dma_memcpy"
        file: "drivers/dma/dmaengine.c"
        description: "准备内存拷贝"
        context: "process"
      - function: "device_prep_dma_memcpy"
        file: "驱动代码"
        description: "驱动准备回调"
        is_user_entry: true
      - function: "dmaengine_submit"
        file: "drivers/dma/dmaengine.c"
        description: "提交描述符"
      - function: "dma_async_issue_pending"
        file: "drivers/dma/dmaengine.c"
        description: "启动传输"


# ============================================================
# SCATTER-GATHER
# ============================================================

scatterlist:
  description: "Scatter-Gather List - 散列表"
  header: "linux/scatterlist.h"
  icon: "📊"

  helper_functions:
    - pattern: 'sg_init_table\s*\(\s*(?P<sg>[^)]+)\s*,\s*(?P<nents>\w+)\s*\)'
      description: "初始化 scatter-gather 表"
      context: "any"
    - pattern: 'sg_init_one\s*\(\s*(?P<sg>[^)]+)\s*,\s*(?P<buf>[^)]+)\s*,\s*(?P<buflen>\w+)\s*\)'
      description: "初始化单个 scatter-gather 项"
      context: "any"
    - pattern: 'sg_set_buf\s*\(\s*(?P<sg>[^)]+)\s*,\s*(?P<buf>[^)]+)\s*,\s*(?P<buflen>\w+)\s*\)'
      description: "设置 scatter-gather 缓冲区"
      context: "any"
    - pattern: 'sg_set_page\s*\(\s*(?P<sg>[^)]+)\s*,\s*(?P<page>[^)]+)\s*,\s*(?P<len>\w+)\s*,\s*(?P<offset>\w+)\s*\)'
      description: "设置 scatter-gather 页"
      context: "any"
    - pattern: 'sg_dma_address\s*\(\s*(?P<sg>[^)]+)\s*\)'
      description: "获取 DMA 地址"
      context: "any"
    - pattern: 'sg_dma_len\s*\(\s*(?P<sg>[^)]+)\s*\)'
      description: "获取 DMA 长度"
      context: "any"
    - pattern: 'for_each_sg\s*\(\s*(?P<sglist>[^)]+)\s*,\s*(?P<sg>\w+)\s*,\s*(?P<nr>\w+)\s*,\s*(?P<i>\w+)\s*\)'
      description: "遍历 scatter-gather 列表"
      context: "any"
    - pattern: 'sg_next\s*\(\s*(?P<sg>[^)]+)\s*\)'
      description: "获取下一个 scatter-gather 项"
      context: "any"


# ============================================================
# EXAMPLES
# ============================================================

examples:
  - description: "完整 DMA 从设备传输示例"
    kernel_version: "5.0+"
    code: |
      #include <linux/dmaengine.h>
      #include <linux/dma-mapping.h>
      #include <linux/completion.h>

      struct my_dma_data {
          struct dma_chan *chan;
          struct completion done;
          dma_addr_t dma_addr;
          void *buf;
          size_t len;
      };

      /* DMA 完成回调 */
      static void my_dma_callback(void *param)
      {
          struct my_dma_data *data = param;
          complete(&data->done);
      }

      static int my_dma_transfer(struct device *dev, void __iomem *fifo_reg,
                                 void *buf, size_t len, bool to_device)
      {
          struct my_dma_data data;
          struct dma_async_tx_descriptor *desc;
          struct dma_slave_config config = {};
          struct scatterlist sg;
          enum dma_transfer_direction dir;
          dma_cookie_t cookie;
          int ret;

          init_completion(&data.done);
          data.buf = buf;
          data.len = len;

          /* 请求 DMA 通道 */
          data.chan = dma_request_chan(dev, to_device ? "tx" : "rx");
          if (IS_ERR(data.chan))
              return PTR_ERR(data.chan);

          /* 配置从设备参数 */
          if (to_device) {
              config.direction = DMA_MEM_TO_DEV;
              config.dst_addr = (dma_addr_t)fifo_reg;
              config.dst_addr_width = DMA_SLAVE_BUSWIDTH_4_BYTES;
              config.dst_maxburst = 16;
              dir = DMA_MEM_TO_DEV;
          } else {
              config.direction = DMA_DEV_TO_MEM;
              config.src_addr = (dma_addr_t)fifo_reg;
              config.src_addr_width = DMA_SLAVE_BUSWIDTH_4_BYTES;
              config.src_maxburst = 16;
              dir = DMA_DEV_TO_MEM;
          }

          ret = dmaengine_slave_config(data.chan, &config);
          if (ret)
              goto err_release;

          /* 映射 DMA 缓冲区 */
          data.dma_addr = dma_map_single(dev, buf, len, 
                                          to_device ? DMA_TO_DEVICE : DMA_FROM_DEVICE);
          if (dma_mapping_error(dev, data.dma_addr)) {
              ret = -ENOMEM;
              goto err_release;
          }

          /* 设置 scatter-gather */
          sg_init_one(&sg, buf, len);
          sg_dma_address(&sg) = data.dma_addr;
          sg_dma_len(&sg) = len;

          /* 准备传输 */
          desc = dmaengine_prep_slave_sg(data.chan, &sg, 1, dir,
                                          DMA_PREP_INTERRUPT | DMA_CTRL_ACK);
          if (!desc) {
              ret = -ENOMEM;
              goto err_unmap;
          }

          /* 设置回调 */
          desc->callback = my_dma_callback;
          desc->callback_param = &data;

          /* 提交并启动 */
          cookie = dmaengine_submit(desc);
          if (dma_submit_error(cookie)) {
              ret = -EIO;
              goto err_unmap;
          }

          dma_async_issue_pending(data.chan);

          /* 等待完成 */
          ret = wait_for_completion_timeout(&data.done, 
                                             msecs_to_jiffies(5000));
          if (ret == 0) {
              dmaengine_terminate_sync(data.chan);
              ret = -ETIMEDOUT;
              goto err_unmap;
          }

          ret = 0;

      err_unmap:
          dma_unmap_single(dev, data.dma_addr, len,
                           to_device ? DMA_TO_DEVICE : DMA_FROM_DEVICE);
      err_release:
          dma_release_channel(data.chan);
          return ret;
      }

  - description: "循环 DMA 传输 (音频)"
    kernel_version: "5.0+"
    code: |
      /* 音频 DMA 循环传输示例 */
      struct audio_stream {
          struct dma_chan *chan;
          dma_addr_t dma_addr;
          void *buf;
          size_t buf_size;
          size_t period_size;
          unsigned int periods;
          volatile unsigned int pos;
          spinlock_t lock;
      };

      static void audio_dma_callback(void *param)
      {
          struct audio_stream *stream = param;
          unsigned long flags;

          spin_lock_irqsave(&stream->lock, flags);
          stream->pos += stream->period_size;
          if (stream->pos >= stream->buf_size)
              stream->pos = 0;
          spin_unlock_irqrestore(&stream->lock, flags);

          /* 通知 ALSA PCM */
          snd_pcm_period_elapsed(stream->substream);
      }

      static int audio_dma_start(struct device *dev, struct audio_stream *stream,
                                  void __iomem *fifo_reg, bool playback)
      {
          struct dma_async_tx_descriptor *desc;
          struct dma_slave_config config = {};
          dma_cookie_t cookie;

          /* 配置从设备 */
          if (playback) {
              config.direction = DMA_MEM_TO_DEV;
              config.dst_addr = (dma_addr_t)fifo_reg;
              config.dst_addr_width = DMA_SLAVE_BUSWIDTH_4_BYTES;
              config.dst_maxburst = 8;
          } else {
              config.direction = DMA_DEV_TO_MEM;
              config.src_addr = (dma_addr_t)fifo_reg;
              config.src_addr_width = DMA_SLAVE_BUSWIDTH_4_BYTES;
              config.src_maxburst = 8;
          }

          dmaengine_slave_config(stream->chan, &config);

          /* 准备循环 DMA */
          desc = dmaengine_prep_dma_cyclic(stream->chan,
                                            stream->dma_addr,
                                            stream->buf_size,
                                            stream->period_size,
                                            playback ? DMA_MEM_TO_DEV : DMA_DEV_TO_MEM,
                                            DMA_PREP_INTERRUPT);
          if (!desc)
              return -ENOMEM;

          desc->callback = audio_dma_callback;
          desc->callback_param = stream;

          cookie = dmaengine_submit(desc);
          if (dma_submit_error(cookie))
              return -EIO;

          dma_async_issue_pending(stream->chan);

          return 0;
      }

      static void audio_dma_stop(struct audio_stream *stream)
      {
          dmaengine_terminate_sync(stream->chan);
          stream->pos = 0;
      }

  - description: "DMA 控制器驱动框架"
    kernel_version: "5.0+"
    code: |
      /* 简化的 DMA 控制器驱动 */
      struct my_dma_chan {
          struct dma_chan chan;
          struct my_dma_device *dmadev;
          void __iomem *regs;
          struct list_head desc_list;
          spinlock_t lock;
          struct tasklet_struct tasklet;
      };

      struct my_dma_device {
          struct dma_device dmadev;
          void __iomem *regs;
          struct my_dma_chan chans[4];
      };

      static int my_dma_alloc_chan_resources(struct dma_chan *chan)
      {
          struct my_dma_chan *mchan = to_my_dma_chan(chan);

          /* 初始化通道 */
          INIT_LIST_HEAD(&mchan->desc_list);
          spin_lock_init(&mchan->lock);

          return 0;
      }

      static void my_dma_free_chan_resources(struct dma_chan *chan)
      {
          struct my_dma_chan *mchan = to_my_dma_chan(chan);

          /* 终止所有传输 */
          my_dma_terminate_all(chan);

          /* 清理描述符 */
          /* ... */
      }

      static struct dma_async_tx_descriptor *
      my_dma_prep_slave_sg(struct dma_chan *chan, struct scatterlist *sgl,
                           unsigned int sg_len, enum dma_transfer_direction dir,
                           unsigned long flags, void *context)
      {
          struct my_dma_chan *mchan = to_my_dma_chan(chan);
          struct my_dma_desc *desc;
          struct scatterlist *sg;
          int i;

          desc = kzalloc(sizeof(*desc), GFP_NOWAIT);
          if (!desc)
              return NULL;

          /* 设置 scatter-gather */
          for_each_sg(sgl, sg, sg_len, i) {
              desc->sg[i].addr = sg_dma_address(sg);
              desc->sg[i].len = sg_dma_len(sg);
          }
          desc->sg_len = sg_len;
          desc->dir = dir;

          return &desc->txd;
      }

      static void my_dma_issue_pending(struct dma_chan *chan)
      {
          struct my_dma_chan *mchan = to_my_dma_chan(chan);
          unsigned long flags;

          spin_lock_irqsave(&mchan->lock, flags);
          /* 启动 DMA 硬件 */
          writel(DMA_START, mchan->regs + DMA_CTRL);
          spin_unlock_irqrestore(&mchan->lock, flags);
      }

      static int my_dma_probe(struct platform_device *pdev)
      {
          struct my_dma_device *mdev;
          struct dma_device *dmadev;
          int i, ret;

          mdev = devm_kzalloc(&pdev->dev, sizeof(*mdev), GFP_KERNEL);
          if (!mdev)
              return -ENOMEM;

          dmadev = &mdev->dmadev;
          dmadev->dev = &pdev->dev;

          /* 设置能力 */
          dma_cap_set(DMA_SLAVE, dmadev->cap_mask);
          dma_cap_set(DMA_PRIVATE, dmadev->cap_mask);

          /* 设置操作函数 */
          dmadev->device_alloc_chan_resources = my_dma_alloc_chan_resources;
          dmadev->device_free_chan_resources = my_dma_free_chan_resources;
          dmadev->device_prep_slave_sg = my_dma_prep_slave_sg;
          dmadev->device_config = my_dma_config;
          dmadev->device_pause = my_dma_pause;
          dmadev->device_resume = my_dma_resume;
          dmadev->device_terminate_all = my_dma_terminate_all;
          dmadev->device_tx_status = my_dma_tx_status;
          dmadev->device_issue_pending = my_dma_issue_pending;

          /* 初始化通道 */
          INIT_LIST_HEAD(&dmadev->channels);
          for (i = 0; i < 4; i++) {
              struct my_dma_chan *mchan = &mdev->chans[i];
              mchan->chan.device = dmadev;
              list_add_tail(&mchan->chan.device_node, &dmadev->channels);
          }

          /* 注册 DMA 设备 */
          ret = dma_async_device_register(dmadev);
          if (ret)
              return ret;

          platform_set_drvdata(pdev, mdev);
          return 0;
      }

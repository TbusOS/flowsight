# Linux Kernel DMA Engine Framework Knowledge Base
#
# Reference: https://www.kernel.org/doc/html/latest/driver-api/dmaengine/index.html

# ============================================================
# DMA DEVICE
# ============================================================

dma_device:
  description: "DMA Device - DMA 控制器设备"
  header: "linux/dmaengine.h"
  icon: "🚀"
  kernel_version: "2.6.18+"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  registration:
    - pattern: 'dma_async_device_register\s*\(\s*(?P<dev>[^)]+)\s*\)'
      description: "注册 DMA 设备"
    - pattern: 'dmaenginem_async_device_register\s*\(\s*(?P<dev>[^)]+)\s*\)'
      description: "资源管理方式注册 DMA 设备"
    - pattern: 'dma_async_device_unregister\s*\(\s*(?P<dev>[^)]+)\s*\)'
      description: "注销 DMA 设备"

  structure:
    pattern: 'struct dma_device\s*(?P<name>\w+)\s*=\s*\{'
    description: "DMA 设备结构"
    fields:
      - name: "chancnt"
        type: "unsigned int"
        description: "通道数量"
      - name: "privatecnt"
        type: "unsigned int"
        description: "私有通道数"
      - name: "channels"
        type: "struct list_head"
        description: "通道链表"
      - name: "cap_mask"
        type: "dma_cap_mask_t"
        description: "能力掩码"
      - name: "max_xfer_len"
        type: "unsigned int"
        description: "最大传输长度"
      - name: "max_burst"
        type: "unsigned int"
        description: "最大突发长度"
      - name: "residue_granularity"
        type: "enum dma_residue_granularity"
        description: "残留粒度"
      - name: "dev"
        type: "struct device *"
        description: "父设备"
      - name: "src_addr_widths"
        type: "u32"
        description: "支持的源地址宽度"
      - name: "dst_addr_widths"
        type: "u32"
        description: "支持的目标地址宽度"
      - name: "directions"
        type: "u32"
        description: "支持的传输方向"

  callbacks:
    device_alloc_chan_resources:
      pattern: '\.device_alloc_chan_resources\s*=\s*(?P<handler>\w+)'
      description: "分配通道资源"
      trigger: "dma_request_channel() 或首次使用通道"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct dma_chan *chan)"
      return_value:
        success: "通道数或 0"
        failure: "-ERRNO"
      typical_actions:
        - "分配描述符池"
        - "初始化硬件通道"
        - "设置 DMA 映射"

    device_free_chan_resources:
      pattern: '\.device_free_chan_resources\s*=\s*(?P<handler>\w+)'
      description: "释放通道资源"
      trigger: "dma_release_channel() 或最后一个用户释放"
      context: "process"
      can_sleep: true
      signature: "void (*)(struct dma_chan *chan)"
      typical_actions:
        - "释放描述符池"
        - "停止硬件通道"
        - "清理 DMA 映射"

    device_prep_dma_memcpy:
      pattern: '\.device_prep_dma_memcpy\s*=\s*(?P<handler>\w+)'
      description: "准备内存拷贝传输"
      trigger: "dmaengine_prep_dma_memcpy()"
      context: "process/atomic"
      can_sleep: false
      signature: "struct dma_async_tx_descriptor *(*)(struct dma_chan *chan, dma_addr_t dest, dma_addr_t src, size_t len, unsigned long flags)"
      return_value:
        success: "描述符指针"
        failure: "NULL"

    device_prep_slave_sg:
      pattern: '\.device_prep_slave_sg\s*=\s*(?P<handler>\w+)'
      description: "准备从设备 scatter-gather 传输"
      trigger: "dmaengine_prep_slave_sg()"
      context: "process/atomic"
      can_sleep: false
      signature: "struct dma_async_tx_descriptor *(*)(struct dma_chan *chan, struct scatterlist *sgl, unsigned int sg_len, enum dma_transfer_direction direction, unsigned long flags, void *context)"
      return_value:
        success: "描述符指针"
        failure: "NULL"

    device_prep_dma_cyclic:
      pattern: '\.device_prep_dma_cyclic\s*=\s*(?P<handler>\w+)'
      description: "准备循环 DMA 传输"
      trigger: "dmaengine_prep_dma_cyclic()"
      context: "process/atomic"
      can_sleep: false
      signature: "struct dma_async_tx_descriptor *(*)(struct dma_chan *chan, dma_addr_t buf_addr, size_t buf_len, size_t period_len, enum dma_transfer_direction direction, unsigned long flags)"
      typical_actions:
        - "设置循环缓冲区"
        - "配置周期中断"

    device_prep_interleaved_dma:
      pattern: '\.device_prep_interleaved_dma\s*=\s*(?P<handler>\w+)'
      description: "准备交错 DMA 传输"
      trigger: "dmaengine_prep_interleaved_dma()"
      context: "process/atomic"
      can_sleep: false
      signature: "struct dma_async_tx_descriptor *(*)(struct dma_chan *chan, struct dma_interleaved_template *xt, unsigned long flags)"

    device_config:
      pattern: '\.device_config\s*=\s*(?P<handler>\w+)'
      description: "配置通道参数"
      trigger: "dmaengine_slave_config()"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct dma_chan *chan, struct dma_slave_config *config)"
      typical_actions:
        - "设置总线宽度"
        - "配置地址"
        - "设置突发长度"

    device_pause:
      pattern: '\.device_pause\s*=\s*(?P<handler>\w+)'
      description: "暂停通道传输"
      trigger: "dmaengine_pause()"
      context: "process/atomic"
      can_sleep: false
      signature: "int (*)(struct dma_chan *chan)"

    device_resume:
      pattern: '\.device_resume\s*=\s*(?P<handler>\w+)'
      description: "恢复通道传输"
      trigger: "dmaengine_resume()"
      context: "process/atomic"
      can_sleep: false
      signature: "int (*)(struct dma_chan *chan)"

    device_terminate_all:
      pattern: '\.device_terminate_all\s*=\s*(?P<handler>\w+)'
      description: "终止所有待处理传输"
      trigger: "dmaengine_terminate_all()"
      context: "process/atomic"
      can_sleep: false
      signature: "int (*)(struct dma_chan *chan)"
      typical_actions:
        - "停止硬件 DMA"
        - "取消所有描述符"
        - "释放资源"

    device_synchronize:
      pattern: '\.device_synchronize\s*=\s*(?P<handler>\w+)'
      description: "同步通道状态"
      trigger: "dmaengine_synchronize()"
      context: "process"
      can_sleep: true
      signature: "void (*)(struct dma_chan *chan)"

    device_tx_status:
      pattern: '\.device_tx_status\s*=\s*(?P<handler>\w+)'
      description: "获取传输状态"
      trigger: "dmaengine_tx_status()"
      context: "process/atomic"
      can_sleep: false
      signature: "enum dma_status (*)(struct dma_chan *chan, dma_cookie_t cookie, struct dma_tx_state *txstate)"
      return_value:
        DMA_COMPLETE: "传输完成"
        DMA_IN_PROGRESS: "传输进行中"
        DMA_PAUSED: "传输暂停"
        DMA_ERROR: "传输错误"

    device_issue_pending:
      pattern: '\.device_issue_pending\s*=\s*(?P<handler>\w+)'
      description: "启动待处理传输"
      trigger: "dma_async_issue_pending()"
      context: "process/atomic"
      can_sleep: false
      signature: "void (*)(struct dma_chan *chan)"
      typical_actions:
        - "触发硬件启动"
        - "设置门铃寄存器"


# ============================================================
# DMA CHANNEL
# ============================================================

dma_chan:
  description: "DMA Channel - DMA 通道"
  header: "linux/dmaengine.h"
  icon: "📡"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  registration:
    - pattern: 'dma_request_chan\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<name>[^)]+)\s*\)'
      description: "按名称请求 DMA 通道 (推荐)"
    - pattern: 'dma_request_slave_channel\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<name>[^)]+)\s*\)'
      description: "请求从设备通道 (已废弃)"
    - pattern: 'dma_request_channel\s*\(\s*(?P<mask>[^)]+)\s*,\s*(?P<fn>[^)]*)\s*,\s*(?P<data>[^)]*)\s*\)'
      description: "通过过滤函数请求通道"
    - pattern: 'dma_release_channel\s*\(\s*(?P<chan>[^)]+)\s*\)'
      description: "释放 DMA 通道"
    - pattern: 'devm_dma_request_chan\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<name>[^)]+)\s*\)'
      description: "资源管理方式请求通道"

  structure:
    pattern: 'struct dma_chan\s*\{'
    description: "DMA 通道结构"
    fields:
      - name: "device"
        type: "struct dma_device *"
        description: "所属 DMA 设备"
      - name: "cookie"
        type: "dma_cookie_t"
        description: "最后提交的 cookie"
      - name: "completed_cookie"
        type: "dma_cookie_t"
        description: "最后完成的 cookie"
      - name: "chan_id"
        type: "int"
        description: "通道 ID"
      - name: "dev_node"
        type: "struct list_head"
        description: "设备通道链表节点"
      - name: "local"
        type: "struct dma_chan_percpu __percpu *"
        description: "每 CPU 数据"
      - name: "private"
        type: "void *"
        description: "驱动私有数据"

  helper_functions:
    - pattern: 'dmaengine_slave_config\s*\(\s*(?P<chan>[^)]+)\s*,\s*(?P<config>[^)]+)\s*\)'
      description: "配置从设备通道"
      context: "process"
    - pattern: 'dmaengine_prep_slave_sg\s*\(\s*(?P<chan>[^)]+)\s*,\s*(?P<sgl>[^)]+)\s*,\s*(?P<sg_len>\w+)\s*,\s*(?P<dir>\w+)\s*,\s*(?P<flags>\w+)\s*\)'
      description: "准备从设备 scatter-gather 传输"
      context: "process/atomic"
    - pattern: 'dmaengine_prep_dma_memcpy\s*\(\s*(?P<chan>[^)]+)\s*,\s*(?P<dest>\w+)\s*,\s*(?P<src>\w+)\s*,\s*(?P<len>\w+)\s*,\s*(?P<flags>\w+)\s*\)'
      description: "准备内存拷贝"
      context: "process/atomic"
    - pattern: 'dmaengine_prep_dma_cyclic\s*\(\s*(?P<chan>[^)]+)\s*,\s*(?P<buf>\w+)\s*,\s*(?P<len>\w+)\s*,\s*(?P<period>\w+)\s*,\s*(?P<dir>\w+)\s*,\s*(?P<flags>\w+)\s*\)'
      description: "准备循环传输"
      context: "process/atomic"
    - pattern: 'dmaengine_submit\s*\(\s*(?P<desc>[^)]+)\s*\)'
      description: "提交描述符"
      context: "process/atomic"
    - pattern: 'dma_async_issue_pending\s*\(\s*(?P<chan>[^)]+)\s*\)'
      description: "启动待处理传输"
      context: "process/atomic"
    - pattern: 'dmaengine_tx_status\s*\(\s*(?P<chan>[^)]+)\s*,\s*(?P<cookie>\w+)\s*,\s*(?P<state>[^)]*)\s*\)'
      description: "获取传输状态"
      context: "process/atomic"
    - pattern: 'dmaengine_terminate_sync\s*\(\s*(?P<chan>[^)]+)\s*\)'
      description: "同步终止所有传输"
      context: "process"
    - pattern: 'dmaengine_terminate_async\s*\(\s*(?P<chan>[^)]+)\s*\)'
      description: "异步终止所有传输"
      context: "process/atomic"
    - pattern: 'dmaengine_pause\s*\(\s*(?P<chan>[^)]+)\s*\)'
      description: "暂停通道"
      context: "process/atomic"
    - pattern: 'dmaengine_resume\s*\(\s*(?P<chan>[^)]+)\s*\)'
      description: "恢复通道"
      context: "process/atomic"


# ============================================================
# DMA SLAVE CONFIG
# ============================================================

dma_slave_config:
  description: "DMA Slave Configuration - DMA 从设备配置"
  header: "linux/dmaengine.h"
  icon: "⚙️"

  structure:
    pattern: 'struct dma_slave_config\s*(?P<name>\w+)\s*=\s*\{'
    description: "从设备配置结构"
    fields:
      - name: "direction"
        type: "enum dma_transfer_direction"
        description: "传输方向"
      - name: "src_addr"
        type: "dma_addr_t"
        description: "源物理地址 (DEV_TO_MEM)"
      - name: "dst_addr"
        type: "dma_addr_t"
        description: "目标物理地址 (MEM_TO_DEV)"
      - name: "src_addr_width"
        type: "enum dma_slave_buswidth"
        description: "源总线宽度"
      - name: "dst_addr_width"
        type: "enum dma_slave_buswidth"
        description: "目标总线宽度"
      - name: "src_maxburst"
        type: "u32"
        description: "源最大突发长度"
      - name: "dst_maxburst"
        type: "u32"
        description: "目标最大突发长度"
      - name: "src_port_window_size"
        type: "u32"
        description: "源端口窗口大小"
      - name: "dst_port_window_size"
        type: "u32"
        description: "目标端口窗口大小"
      - name: "device_fc"
        type: "bool"
        description: "设备流控"
      - name: "peripheral_config"
        type: "void *"
        description: "外设特定配置"
      - name: "peripheral_size"
        type: "size_t"
        description: "外设配置大小"


# ============================================================
# DMA ASYNC TX DESCRIPTOR
# ============================================================

dma_async_tx_descriptor:
  description: "DMA Async Transaction Descriptor - 异步传输描述符"
  header: "linux/dmaengine.h"
  icon: "📋"

  structure:
    pattern: 'struct dma_async_tx_descriptor\s*\{'
    description: "异步传输描述符结构"
    fields:
      - name: "cookie"
        type: "dma_cookie_t"
        description: "传输标识 cookie"
      - name: "flags"
        type: "enum dma_ctrl_flags"
        description: "控制标志"
      - name: "phys"
        type: "dma_addr_t"
        description: "描述符物理地址"
      - name: "chan"
        type: "struct dma_chan *"
        description: "所属通道"
      - name: "tx_submit"
        type: "dma_cookie_t (*)(struct dma_async_tx_descriptor *)"
        description: "提交函数"
      - name: "callback"
        type: "dma_async_tx_callback"
        description: "完成回调"
      - name: "callback_param"
        type: "void *"
        description: "回调参数"
      - name: "callback_result"
        type: "dma_async_tx_callback_result"
        description: "带结果的回调"

  callbacks:
    tx_submit:
      pattern: '(?P<desc>\w+)->tx_submit\s*\(\s*(?P<desc2>\w+)\s*\)'
      description: "提交描述符到队列"
      trigger: "dmaengine_submit()"
      context: "process/atomic"
      can_sleep: false
      signature: "dma_cookie_t (*)(struct dma_async_tx_descriptor *tx)"
      return_value:
        success: "正整数 cookie"
        failure: "负值错误码"

    callback:
      pattern: '(?P<desc>\w+)->callback\s*=\s*(?P<handler>\w+)'
      description: "传输完成回调"
      trigger: "DMA 传输完成"
      context: "softirq/tasklet"
      can_sleep: false
      signature: "void (*)(void *param)"
      typical_actions:
        - "唤醒等待进程"
        - "处理下一个缓冲区"
        - "更新状态"

    callback_result:
      pattern: '(?P<desc>\w+)->callback_result\s*=\s*(?P<handler>\w+)'
      description: "带结果的完成回调"
      trigger: "DMA 传输完成"
      context: "softirq/tasklet"
      can_sleep: false
      signature: "void (*)(void *param, const struct dmaengine_result *result)"


# ============================================================
# DMA MAPPING API
# ============================================================

dma_mapping:
  description: "DMA Mapping API - DMA 内存映射"
  header: "linux/dma-mapping.h"
  icon: "🗺️"

  context:
    type: "varies"
    can_sleep: "depends on GFP flags"

  coherent_allocation:
    - pattern: 'dma_alloc_coherent\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<size>\w+)\s*,\s*(?P<dma_handle>[^)]+)\s*,\s*(?P<gfp>\w+)\s*\)'
      description: "分配一致性 DMA 内存"
      context: "process (GFP_KERNEL) 或 atomic (GFP_ATOMIC)"
    - pattern: 'dma_free_coherent\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<size>\w+)\s*,\s*(?P<cpu_addr>[^)]+)\s*,\s*(?P<dma_handle>\w+)\s*\)'
      description: "释放一致性 DMA 内存"
      context: "process"
    - pattern: 'dma_alloc_attrs\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<size>\w+)\s*,\s*(?P<dma_handle>[^)]+)\s*,\s*(?P<gfp>\w+)\s*,\s*(?P<attrs>\w+)\s*\)'
      description: "带属性分配 DMA 内存"
      context: "process/atomic"
    - pattern: 'dmam_alloc_coherent\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<size>\w+)\s*,\s*(?P<dma_handle>[^)]+)\s*,\s*(?P<gfp>\w+)\s*\)'
      description: "资源管理方式分配一致性内存"
      context: "process"

  streaming_single:
    - pattern: 'dma_map_single\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<cpu_addr>[^)]+)\s*,\s*(?P<size>\w+)\s*,\s*(?P<dir>\w+)\s*\)'
      description: "映射单个缓冲区 (流式)"
      context: "process/atomic"
    - pattern: 'dma_unmap_single\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<dma_addr>\w+)\s*,\s*(?P<size>\w+)\s*,\s*(?P<dir>\w+)\s*\)'
      description: "取消映射单个缓冲区"
      context: "process/atomic"
    - pattern: 'dma_map_single_attrs\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<cpu_addr>[^)]+)\s*,\s*(?P<size>\w+)\s*,\s*(?P<dir>\w+)\s*,\s*(?P<attrs>\w+)\s*\)'
      description: "带属性映射单个缓冲区"
      context: "process/atomic"

  streaming_page:
    - pattern: 'dma_map_page\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<page>[^)]+)\s*,\s*(?P<offset>\w+)\s*,\s*(?P<size>\w+)\s*,\s*(?P<dir>\w+)\s*\)'
      description: "映射页"
      context: "process/atomic"
    - pattern: 'dma_unmap_page\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<dma_addr>\w+)\s*,\s*(?P<size>\w+)\s*,\s*(?P<dir>\w+)\s*\)'
      description: "取消映射页"
      context: "process/atomic"

  scatter_gather:
    - pattern: 'dma_map_sg\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<sg>[^)]+)\s*,\s*(?P<nents>\w+)\s*,\s*(?P<dir>\w+)\s*\)'
      description: "映射 scatter-gather 列表"
      context: "process/atomic"
    - pattern: 'dma_unmap_sg\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<sg>[^)]+)\s*,\s*(?P<nents>\w+)\s*,\s*(?P<dir>\w+)\s*\)'
      description: "取消映射 scatter-gather 列表"
      context: "process/atomic"
    - pattern: 'dma_map_sg_attrs\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<sg>[^)]+)\s*,\s*(?P<nents>\w+)\s*,\s*(?P<dir>\w+)\s*,\s*(?P<attrs>\w+)\s*\)'
      description: "带属性映射 scatter-gather"
      context: "process/atomic"

  sync_operations:
    - pattern: 'dma_sync_single_for_cpu\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<dma_addr>\w+)\s*,\s*(?P<size>\w+)\s*,\s*(?P<dir>\w+)\s*\)'
      description: "同步缓冲区到 CPU (读取前)"
      context: "process/atomic"
    - pattern: 'dma_sync_single_for_device\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<dma_addr>\w+)\s*,\s*(?P<size>\w+)\s*,\s*(?P<dir>\w+)\s*\)'
      description: "同步缓冲区到设备 (传输前)"
      context: "process/atomic"
    - pattern: 'dma_sync_sg_for_cpu\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<sg>[^)]+)\s*,\s*(?P<nents>\w+)\s*,\s*(?P<dir>\w+)\s*\)'
      description: "同步 scatter-gather 到 CPU"
      context: "process/atomic"
    - pattern: 'dma_sync_sg_for_device\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<sg>[^)]+)\s*,\s*(?P<nents>\w+)\s*,\s*(?P<dir>\w+)\s*\)'
      description: "同步 scatter-gather 到设备"
      context: "process/atomic"

  checking:
    - pattern: 'dma_mapping_error\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<dma_addr>\w+)\s*\)'
      description: "检查映射错误"
      context: "any"
    - pattern: 'dma_set_mask\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<mask>\w+)\s*\)'
      description: "设置 DMA 地址掩码"
      context: "process"
    - pattern: 'dma_set_coherent_mask\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<mask>\w+)\s*\)'
      description: "设置一致性 DMA 掩码"
      context: "process"
    - pattern: 'dma_set_mask_and_coherent\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<mask>\w+)\s*\)'
      description: "同时设置两种掩码"
      context: "process"


# ============================================================
# DMA POOL
# ============================================================

dma_pool:
  description: "DMA Pool - DMA 内存池"
  header: "linux/dmapool.h"
  icon: "💧"

  context:
    type: "process"
    can_sleep: true

  registration:
    - pattern: 'dma_pool_create\s*\(\s*(?P<name>[^)]+)\s*,\s*(?P<dev>[^)]+)\s*,\s*(?P<size>\w+)\s*,\s*(?P<align>\w+)\s*,\s*(?P<boundary>\w+)\s*\)'
      description: "创建 DMA 池"
    - pattern: 'dma_pool_destroy\s*\(\s*(?P<pool>[^)]+)\s*\)'
      description: "销毁 DMA 池"
    - pattern: 'dmam_pool_create\s*\(\s*(?P<name>[^)]+)\s*,\s*(?P<dev>[^)]+)\s*,\s*(?P<size>\w+)\s*,\s*(?P<align>\w+)\s*,\s*(?P<boundary>\w+)\s*\)'
      description: "资源管理方式创建池"

  helper_functions:
    - pattern: 'dma_pool_alloc\s*\(\s*(?P<pool>[^)]+)\s*,\s*(?P<gfp>\w+)\s*,\s*(?P<dma_handle>[^)]+)\s*\)'
      description: "从池分配"
      context: "process (GFP_KERNEL) 或 atomic (GFP_ATOMIC)"
    - pattern: 'dma_pool_zalloc\s*\(\s*(?P<pool>[^)]+)\s*,\s*(?P<gfp>\w+)\s*,\s*(?P<dma_handle>[^)]+)\s*\)'
      description: "从池分配并清零"
      context: "process/atomic"
    - pattern: 'dma_pool_free\s*\(\s*(?P<pool>[^)]+)\s*,\s*(?P<vaddr>[^)]+)\s*,\s*(?P<dma_handle>\w+)\s*\)'
      description: "归还到池"
      context: "process/atomic"



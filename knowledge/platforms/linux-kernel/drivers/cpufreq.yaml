# Linux Kernel CPU Frequency Scaling Framework Knowledge Base
#
# Reference: https://www.kernel.org/doc/html/latest/admin-guide/pm/cpufreq.html
# Header: include/linux/cpufreq.h

# ============================================================
# CPUFREQ FRAMEWORK OVERVIEW
# ============================================================

cpufreq_overview:
  description: "CPU Frequency Scaling Framework Overview - CPU 调频框架概述"
  header: "linux/cpufreq.h"
  icon: "🏎️"
  kernel_version: "2.6.0+"

  concepts:
    cpufreq_driver:
      description: "调频驱动 - 实现 CPU 频率切换的硬件驱动"
    cpufreq_policy:
      description: "调频策略 - 管理一组共享频率的 CPU"
    cpufreq_governor:
      description: "调频策略算法 - 决定何时切换频率"
    frequency_table:
      description: "频率表 - 支持的频率列表"


# ============================================================
# CPUFREQ DRIVER
# ============================================================

cpufreq_driver:
  description: "CPU Frequency Driver - CPU 调频驱动"
  header: "linux/cpufreq.h"
  icon: "🔧"
  kernel_version: "2.6.0+"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  registration:
    - pattern: 'cpufreq_register_driver\s*\(\s*&?(?P<driver>\w+)\s*\)'
      description: "注册 CPU 调频驱动"
      context: "process"
      can_sleep: true
      return_value:
        success: "0"
        failure: "-ERRNO"
    - pattern: 'cpufreq_unregister_driver\s*\(\s*&?(?P<driver>\w+)\s*\)'
      description: "注销 CPU 调频驱动"
      context: "process"
      can_sleep: true

  structure:
    pattern: 'static\s+struct\s+cpufreq_driver\s+(?P<name>\w+)\s*=\s*\{'
    description: "CPU 调频驱动结构体定义"

  fields:
    - name: "name"
      type: "char[CPUFREQ_NAME_LEN]"
      description: "驱动名称"
    - name: "flags"
      type: "u8"
      description: "驱动标志"
    - name: "driver_data"
      type: "void *"
      description: "驱动私有数据"
    - name: "attr"
      type: "struct freq_attr **"
      description: "sysfs 属性数组"
    - name: "boost_enabled"
      type: "bool"
      description: "Boost 模式是否启用"

  callbacks:
    init:
      pattern: '\.init\s*=\s*(?P<handler>\w+)'
      description: "初始化 CPU 调频策略（必需）"
      signature: "int (*)(struct cpufreq_policy *policy)"
      context: "process"
      can_sleep: true
      return_value:
        success: "0"
        failure: "-ERRNO"
      typical_actions:
        - "读取 CPU 支持的频率范围"
        - "填充频率表"
        - "设置 policy->cpuinfo.min_freq/max_freq"
        - "设置 policy->min/max/cur"
        - "设置 policy->freq_table"

    verify:
      pattern: '\.verify\s*=\s*(?P<handler>\w+)'
      description: "验证调频参数（必需）"
      signature: "int (*)(struct cpufreq_policy *policy)"
      context: "process"
      can_sleep: false
      return_value:
        success: "0"
        failure: "-ERRNO"
      typical_actions:
        - "验证 policy->min 和 policy->max"
        - "确保在硬件支持范围内"
        - "通常使用 cpufreq_verify_within_limits()"

    setpolicy:
      pattern: '\.setpolicy\s*=\s*(?P<handler>\w+)'
      description: "设置调频策略（用于硬件管理频率的驱动）"
      signature: "int (*)(struct cpufreq_policy *policy)"
      context: "process"
      can_sleep: true
      typical_actions:
        - "告诉硬件频率范围"
        - "让硬件自行管理频率"
        - "如 Intel P-State HWP 模式"

    target:
      pattern: '\.target\s*=\s*(?P<handler>\w+)'
      description: "设置目标频率（旧 API，已弃用）"
      signature: "int (*)(struct cpufreq_policy *policy, unsigned int target_freq, unsigned int relation)"
      context: "process"
      can_sleep: true
      deprecated: true

    target_index:
      pattern: '\.target_index\s*=\s*(?P<handler>\w+)'
      description: "设置频率索引（推荐）"
      signature: "int (*)(struct cpufreq_policy *policy, unsigned int index)"
      context: "process"
      can_sleep: true
      typical_actions:
        - "根据索引从频率表获取频率"
        - "配置时钟/电压"
        - "等待频率稳定"

    fast_switch:
      pattern: '\.fast_switch\s*=\s*(?P<handler>\w+)'
      description: "快速频率切换（不能睡眠）"
      signature: "unsigned int (*)(struct cpufreq_policy *policy, unsigned int target_freq)"
      context: "any"
      can_sleep: false
      return_value:
        success: "新频率 (kHz)"
        failure: "0"
      typical_actions:
        - "直接写寄存器切换频率"
        - "用于 schedutil 等需要快速响应的场景"

    resolve_freq:
      pattern: '\.resolve_freq\s*=\s*(?P<handler>\w+)'
      description: "解析最接近的可用频率"
      signature: "unsigned int (*)(struct cpufreq_policy *policy, unsigned int target_freq)"
      context: "any"
      can_sleep: false

    get:
      pattern: '\.get\s*=\s*(?P<handler>\w+)'
      description: "获取当前 CPU 频率"
      signature: "unsigned int (*)(unsigned int cpu)"
      context: "process"
      can_sleep: true
      return_value:
        success: "当前频率 (kHz)"
        failure: "0"

    get_intermediate:
      pattern: '\.get_intermediate\s*=\s*(?P<handler>\w+)'
      description: "获取中间频率（用于两阶段切换）"
      signature: "unsigned int (*)(struct cpufreq_policy *policy, unsigned int index)"
      context: "process"
      can_sleep: true

    target_intermediate:
      pattern: '\.target_intermediate\s*=\s*(?P<handler>\w+)'
      description: "切换到中间频率"
      signature: "int (*)(struct cpufreq_policy *policy, unsigned int index)"
      context: "process"
      can_sleep: true

    bios_limit:
      pattern: '\.bios_limit\s*=\s*(?P<handler>\w+)'
      description: "获取 BIOS 频率限制"
      signature: "int (*)(int cpu, unsigned int *limit)"
      context: "process"
      can_sleep: true

    exit:
      pattern: '\.exit\s*=\s*(?P<handler>\w+)'
      description: "退出清理"
      signature: "int (*)(struct cpufreq_policy *policy)"
      context: "process"
      can_sleep: true

    stop_cpu:
      pattern: '\.stop_cpu\s*=\s*(?P<handler>\w+)'
      description: "CPU 停止回调"
      signature: "void (*)(struct cpufreq_policy *policy)"
      context: "process"
      can_sleep: true

    suspend:
      pattern: '\.suspend\s*=\s*(?P<handler>\w+)'
      description: "挂起回调"
      signature: "int (*)(struct cpufreq_policy *policy)"
      context: "process"
      can_sleep: true

    resume:
      pattern: '\.resume\s*=\s*(?P<handler>\w+)'
      description: "恢复回调"
      signature: "int (*)(struct cpufreq_policy *policy)"
      context: "process"
      can_sleep: true

    ready:
      pattern: '\.ready\s*=\s*(?P<handler>\w+)'
      description: "策略就绪回调"
      signature: "void (*)(struct cpufreq_policy *policy)"
      context: "process"
      can_sleep: true

    online:
      pattern: '\.online\s*=\s*(?P<handler>\w+)'
      description: "CPU 上线回调"
      signature: "int (*)(struct cpufreq_policy *policy)"
      context: "process"
      can_sleep: true

    offline:
      pattern: '\.offline\s*=\s*(?P<handler>\w+)'
      description: "CPU 下线回调"
      signature: "int (*)(struct cpufreq_policy *policy)"
      context: "process"
      can_sleep: true

    set_boost:
      pattern: '\.set_boost\s*=\s*(?P<handler>\w+)'
      description: "设置 Boost 模式"
      signature: "int (*)(int state)"
      context: "process"
      can_sleep: true


# ============================================================
# CPUFREQ DRIVER FLAGS
# ============================================================

cpufreq_driver_flags:
  description: "CPU Frequency Driver Flags - 驱动标志"
  header: "linux/cpufreq.h"

  constants:
    CPUFREQ_STICKY:
      description: "驱动不能卸载"
    CPUFREQ_CONST_LOOPS:
      description: "loops_per_jiffy 是常量"
    CPUFREQ_PM_NO_WARN:
      description: "PM 期间不警告"
    CPUFREQ_HAVE_GOVERNOR_PER_POLICY:
      description: "每个策略可以有不同的 governor"
    CPUFREQ_NEED_INITIAL_FREQ_CHECK:
      description: "初始化时检查频率"
    CPUFREQ_ASYNC_NOTIFICATION:
      description: "异步频率通知"
    CPUFREQ_NEED_UPDATE_LIMITS:
      description: "需要更新限制"
    CPUFREQ_IS_COOLING_DEV:
      description: "自动注册为冷却设备"


# ============================================================
# CPUFREQ POLICY
# ============================================================

cpufreq_policy:
  description: "CPU Frequency Policy - CPU 调频策略"
  header: "linux/cpufreq.h"

  structure:
    pattern: 'struct\s+cpufreq_policy\s*\*\s*(?P<name>\w+)'
    description: "CPU 调频策略指针"

  fields:
    # CPU 掩码
    - name: "cpus"
      type: "cpumask_var_t"
      description: "在线且共享此策略的 CPU"
    - name: "related_cpus"
      type: "cpumask_var_t"
      description: "所有相关 CPU（包括离线）"
    - name: "real_cpus"
      type: "cpumask_var_t"
      description: "相关且存在的 CPU"

    # 频率信息
    - name: "cpu"
      type: "unsigned int"
      description: "管理此策略的 CPU 编号"
    - name: "cpuinfo"
      type: "struct cpufreq_cpuinfo"
      description: "CPU 频率能力信息"
    - name: "min"
      type: "unsigned int"
      description: "策略最小频率 (kHz)"
    - name: "max"
      type: "unsigned int"
      description: "策略最大频率 (kHz)"
    - name: "cur"
      type: "unsigned int"
      description: "当前频率 (kHz)"
    - name: "restore_freq"
      type: "unsigned int"
      description: "切换前的频率"
    - name: "suspend_freq"
      type: "unsigned int"
      description: "挂起时的频率"

    # 策略和 Governor
    - name: "policy"
      type: "unsigned int"
      description: "策略类型 (CPUFREQ_POLICY_*)"
    - name: "last_policy"
      type: "unsigned int"
      description: "卸载前的策略"
    - name: "governor"
      type: "struct cpufreq_governor *"
      description: "当前 governor"
    - name: "governor_data"
      type: "void *"
      description: "governor 私有数据"
    - name: "last_governor"
      type: "char[CPUFREQ_NAME_LEN]"
      description: "上次使用的 governor"

    # 工作队列
    - name: "update"
      type: "struct work_struct"
      description: "更新策略工作项"

    # 用户策略
    - name: "user_policy"
      type: "struct cpufreq_user_policy"
      description: "用户设置的策略"

    # 频率表
    - name: "freq_table"
      type: "struct cpufreq_frequency_table *"
      description: "支持的频率表"
    - name: "freq_table_sorted"
      type: "enum cpufreq_table_sorting"
      description: "频率表排序方式"

    # Kobject 和链表
    - name: "policy_list"
      type: "struct list_head"
      description: "策略链表节点"
    - name: "kobj"
      type: "struct kobject"
      description: "sysfs kobject"
    - name: "kobj_unregister"
      type: "struct completion"
      description: "注销完成量"

    # 锁
    - name: "rwsem"
      type: "struct rw_semaphore"
      description: "读写信号量"

    # 快速切换
    - name: "fast_switch_possible"
      type: "bool"
      description: "是否支持快速切换"
    - name: "fast_switch_enabled"
      type: "bool"
      description: "快速切换是否启用"

    # 时钟
    - name: "clk"
      type: "struct clk *"
      description: "关联的时钟"

    # 过渡延迟
    - name: "transition_delay_us"
      type: "unsigned int"
      description: "频率切换延迟 (us)"

    # 统计
    - name: "stats"
      type: "struct cpufreq_stats *"
      description: "统计信息"

  helper_functions:
    - pattern: 'cpufreq_cpu_get\s*\(\s*(?P<cpu>[^)]+)\s*\)'
      description: "获取 CPU 的调频策略（增加引用计数）"
      context: "any"
      can_sleep: false
    - pattern: 'cpufreq_cpu_put\s*\(\s*(?P<policy>[^)]+)\s*\)'
      description: "释放策略引用"
      context: "any"
      can_sleep: false
    - pattern: 'cpufreq_cpu_get_raw\s*\(\s*(?P<cpu>[^)]+)\s*\)'
      description: "获取 CPU 的调频策略（不增加引用计数）"
      context: "any"
      can_sleep: false


# ============================================================
# CPUFREQ CPUINFO
# ============================================================

cpufreq_cpuinfo:
  description: "CPU Frequency Info - CPU 频率能力信息"
  header: "linux/cpufreq.h"

  fields:
    - name: "max_freq"
      type: "unsigned int"
      description: "硬件支持的最大频率 (kHz)"
    - name: "min_freq"
      type: "unsigned int"
      description: "硬件支持的最小频率 (kHz)"
    - name: "transition_latency"
      type: "unsigned int"
      description: "频率切换延迟 (ns)"


# ============================================================
# CPUFREQ FREQUENCY TABLE
# ============================================================

cpufreq_frequency_table:
  description: "CPU Frequency Table - 频率表"
  header: "linux/cpufreq.h"

  structure:
    pattern: 'static\s+(?:const\s+)?struct\s+cpufreq_frequency_table\s+(?P<name>\w+)\s*\[\s*\]'
    description: "频率表定义"

  fields:
    - name: "flags"
      type: "unsigned int"
      description: "频率标志"
    - name: "driver_data"
      type: "unsigned int"
      description: "驱动私有数据"
    - name: "frequency"
      type: "unsigned int"
      description: "频率值 (kHz)"

  special_values:
    CPUFREQ_ENTRY_INVALID:
      description: "无效条目"
    CPUFREQ_TABLE_END:
      description: "表结束标记"
    CPUFREQ_BOOST_FREQ:
      description: "Boost 频率标记"

  helper_functions:
    - pattern: 'cpufreq_table_validate_and_sort\s*\(\s*(?P<policy>[^)]+)\s*\)'
      description: "验证并排序频率表"
    - pattern: 'cpufreq_frequency_table_cpuinfo\s*\(\s*(?P<policy>[^,]+)\s*,\s*(?P<table>[^)]+)\s*\)'
      description: "从频率表填充 cpuinfo"
    - pattern: 'cpufreq_frequency_table_verify\s*\(\s*(?P<policy>[^,]+)\s*,\s*(?P<table>[^)]+)\s*\)'
      description: "验证策略参数与频率表"
    - pattern: 'cpufreq_frequency_table_target\s*\(\s*(?P<policy>[^,]+)\s*,\s*(?P<target_freq>[^,]+)\s*,\s*(?P<relation>[^)]+)\s*\)'
      description: "在频率表中查找目标频率"
    - pattern: 'cpufreq_table_index_unsorted\s*\(\s*(?P<policy>[^,]+)\s*,\s*(?P<target_freq>[^,]+)\s*,\s*(?P<relation>[^)]+)\s*\)'
      description: "在未排序表中查找索引"


# ============================================================
# CPUFREQ GOVERNOR
# ============================================================

cpufreq_governor:
  description: "CPU Frequency Governor - 调频策略算法"
  header: "linux/cpufreq.h"
  icon: "👑"
  kernel_version: "2.6.0+"

  registration:
    - pattern: 'cpufreq_register_governor\s*\(\s*&?(?P<governor>\w+)\s*\)'
      description: "注册调频 governor"
      context: "process"
      can_sleep: true
    - pattern: 'cpufreq_unregister_governor\s*\(\s*&?(?P<governor>\w+)\s*\)'
      description: "注销调频 governor"
      context: "process"
      can_sleep: true

  structure:
    pattern: 'static\s+struct\s+cpufreq_governor\s+(?P<name>\w+)\s*=\s*\{'
    description: "Governor 结构体定义"

  fields:
    - name: "name"
      type: "char[CPUFREQ_NAME_LEN]"
      description: "Governor 名称"
    - name: "owner"
      type: "struct module *"
      description: "模块所有者"
    - name: "flags"
      type: "unsigned int"
      description: "Governor 标志"

  callbacks:
    init:
      pattern: '\.init\s*=\s*(?P<handler>\w+)'
      description: "初始化 governor（策略添加时）"
      signature: "int (*)(struct cpufreq_policy *policy)"
      context: "process"
      can_sleep: true

    exit:
      pattern: '\.exit\s*=\s*(?P<handler>\w+)'
      description: "退出清理（策略移除时）"
      signature: "void (*)(struct cpufreq_policy *policy)"
      context: "process"
      can_sleep: true

    start:
      pattern: '\.start\s*=\s*(?P<handler>\w+)'
      description: "启动 governor"
      signature: "int (*)(struct cpufreq_policy *policy)"
      context: "process"
      can_sleep: true

    stop:
      pattern: '\.stop\s*=\s*(?P<handler>\w+)'
      description: "停止 governor"
      signature: "void (*)(struct cpufreq_policy *policy)"
      context: "process"
      can_sleep: true

    limits:
      pattern: '\.limits\s*=\s*(?P<handler>\w+)'
      description: "频率限制变化通知"
      signature: "void (*)(struct cpufreq_policy *policy)"
      context: "process"
      can_sleep: true

  builtin_governors:
    performance:
      description: "性能 - 始终使用最高频率"
      suitable_for: "需要最大性能的场景"
    powersave:
      description: "省电 - 始终使用最低频率"
      suitable_for: "电池续航优先的场景"
    userspace:
      description: "用户空间 - 由用户程序控制频率"
      suitable_for: "需要精细控制的场景"
    ondemand:
      description: "按需 - 根据 CPU 负载动态调频"
      suitable_for: "通用桌面场景"
    conservative:
      description: "保守 - 渐进式调频，减少频率跳跃"
      suitable_for: "笔记本电脑"
    schedutil:
      description: "调度器驱动 - 基于调度器信息调频"
      suitable_for: "现代内核推荐"


# ============================================================
# CPUFREQ FREQUENCY RELATION
# ============================================================

cpufreq_relation:
  description: "CPU Frequency Relation - 频率查找关系"
  header: "linux/cpufreq.h"

  constants:
    CPUFREQ_RELATION_L:
      value: 0
      description: "选择 >= 目标频率的最低频率"
    CPUFREQ_RELATION_H:
      value: 1
      description: "选择 <= 目标频率的最高频率"
    CPUFREQ_RELATION_C:
      value: 2
      description: "选择最接近目标的频率"


# ============================================================
# CPUFREQ POLICY CONSTANTS
# ============================================================

cpufreq_policy_constants:
  description: "CPU Frequency Policy Constants - 策略常量"
  header: "linux/cpufreq.h"

  constants:
    CPUFREQ_POLICY_UNKNOWN:
      value: 0
      description: "未知策略"
    CPUFREQ_POLICY_POWERSAVE:
      value: 1
      description: "省电策略"
    CPUFREQ_POLICY_PERFORMANCE:
      value: 2
      description: "性能策略"


# ============================================================
# CPUFREQ TRANSITION NOTIFIER
# ============================================================

cpufreq_notifier:
  description: "CPU Frequency Transition Notifier - 频率切换通知"
  header: "linux/cpufreq.h"

  registration:
    - pattern: 'cpufreq_register_notifier\s*\(\s*(?P<nb>[^,]+)\s*,\s*(?P<list>[^)]+)\s*\)'
      description: "注册频率变化通知"
    - pattern: 'cpufreq_unregister_notifier\s*\(\s*(?P<nb>[^,]+)\s*,\s*(?P<list>[^)]+)\s*\)'
      description: "注销频率变化通知"

  notification_lists:
    CPUFREQ_TRANSITION_NOTIFIER:
      description: "频率切换通知链"
    CPUFREQ_POLICY_NOTIFIER:
      description: "策略变化通知链"

  transition_events:
    CPUFREQ_PRECHANGE:
      description: "切换前通知"
    CPUFREQ_POSTCHANGE:
      description: "切换后通知"

  policy_events:
    CPUFREQ_ADJUST:
      description: "调整策略"
    CPUFREQ_NOTIFY:
      description: "策略变化通知"
    CPUFREQ_START:
      description: "策略开始"
    CPUFREQ_CREATE_POLICY:
      description: "策略创建"
    CPUFREQ_REMOVE_POLICY:
      description: "策略移除"


# ============================================================
# CPUFREQ HELPER FUNCTIONS
# ============================================================

cpufreq_helpers:
  description: "CPU Frequency Helper Functions - 辅助函数"
  header: "linux/cpufreq.h"

  functions:
    # 频率切换
    - pattern: 'cpufreq_driver_target\s*\(\s*(?P<policy>[^,]+)\s*,\s*(?P<target_freq>[^,]+)\s*,\s*(?P<relation>[^)]+)\s*\)'
      description: "请求切换到目标频率"
      context: "process"
      can_sleep: true
    - pattern: '__cpufreq_driver_target\s*\(\s*(?P<policy>[^,]+)\s*,\s*(?P<target_freq>[^,]+)\s*,\s*(?P<relation>[^)]+)\s*\)'
      description: "请求切换到目标频率（无锁版本）"
      context: "process"
      can_sleep: true

    # 频率切换通知
    - pattern: 'cpufreq_freq_transition_begin\s*\(\s*(?P<policy>[^,]+)\s*,\s*(?P<freqs>[^)]+)\s*\)'
      description: "开始频率切换（发送 PRECHANGE 通知）"
      context: "process"
      can_sleep: true
    - pattern: 'cpufreq_freq_transition_end\s*\(\s*(?P<policy>[^,]+)\s*,\s*(?P<freqs>[^,]+)\s*,\s*(?P<transition_failed>[^)]+)\s*\)'
      description: "结束频率切换（发送 POSTCHANGE 通知）"
      context: "process"
      can_sleep: true
    - pattern: 'cpufreq_notify_transition\s*\(\s*(?P<policy>[^,]+)\s*,\s*(?P<freqs>[^,]+)\s*,\s*(?P<state>[^)]+)\s*\)'
      description: "通知频率切换"
      context: "any"
      can_sleep: false

    # 策略操作
    - pattern: 'cpufreq_verify_within_limits\s*\(\s*(?P<policy>[^,]+)\s*,\s*(?P<min>[^,]+)\s*,\s*(?P<max>[^)]+)\s*\)'
      description: "验证策略在限制范围内"
    - pattern: 'cpufreq_verify_within_cpu_limits\s*\(\s*(?P<policy>[^)]+)\s*\)'
      description: "验证策略在 CPU 能力范围内"

    # 频率获取
    - pattern: 'cpufreq_get\s*\(\s*(?P<cpu>[^)]+)\s*\)'
      description: "获取 CPU 当前频率"
      context: "process"
      can_sleep: true
    - pattern: 'cpufreq_quick_get\s*\(\s*(?P<cpu>[^)]+)\s*\)'
      description: "快速获取 CPU 当前频率（缓存值）"
      context: "any"
      can_sleep: false
    - pattern: 'cpufreq_quick_get_max\s*\(\s*(?P<cpu>[^)]+)\s*\)'
      description: "快速获取 CPU 最大频率"
      context: "any"
      can_sleep: false

    # 快速切换
    - pattern: 'cpufreq_driver_fast_switch\s*\(\s*(?P<policy>[^,]+)\s*,\s*(?P<target_freq>[^)]+)\s*\)'
      description: "快速频率切换"
      context: "any"
      can_sleep: false
    - pattern: 'cpufreq_enable_fast_switch\s*\(\s*(?P<policy>[^)]+)\s*\)'
      description: "启用快速切换"
    - pattern: 'cpufreq_disable_fast_switch\s*\(\s*(?P<policy>[^)]+)\s*\)'
      description: "禁用快速切换"

    # Boost
    - pattern: 'cpufreq_boost_trigger_state\s*\(\s*(?P<state>[^)]+)\s*\)'
      description: "触发 Boost 状态变化"
    - pattern: 'cpufreq_enable_boost_support\s*\(\s*\)'
      description: "启用 Boost 支持"

    # 策略更新
    - pattern: 'cpufreq_update_policy\s*\(\s*(?P<cpu>[^)]+)\s*\)'
      description: "更新 CPU 的调频策略"
      context: "process"
      can_sleep: true
    - pattern: 'cpufreq_update_limits\s*\(\s*(?P<cpu>[^)]+)\s*\)'
      description: "更新 CPU 的频率限制"


# ============================================================
# CPUFREQ COOLING
# ============================================================

cpufreq_cooling:
  description: "CPU Frequency Cooling - CPU 频率冷却设备"
  header: "linux/cpu_cooling.h"
  icon: "❄️"

  registration:
    - pattern: 'cpufreq_cooling_register\s*\(\s*(?P<policy>[^)]+)\s*\)'
      description: "注册 CPU 频率冷却设备"
      context: "process"
      can_sleep: true
    - pattern: 'of_cpufreq_cooling_register\s*\(\s*(?P<policy>[^)]+)\s*\)'
      description: "设备树方式注册"
      context: "process"
      can_sleep: true
    - pattern: 'cpufreq_cooling_unregister\s*\(\s*(?P<cdev>[^)]+)\s*\)'
      description: "注销 CPU 频率冷却设备"
      context: "process"
      can_sleep: true


# ============================================================
# CALL CHAINS
# ============================================================

call_chains:
  cpufreq_set_frequency_flow:
    description: "频率设置调用链"
    trigger: "Governor 请求频率变化"
    chain:
      - function: "__cpufreq_driver_target"
        file: "drivers/cpufreq/cpufreq.c"
        description: "频率设置入口"
        context: "process"
      - function: "cpufreq_freq_transition_begin"
        file: "drivers/cpufreq/cpufreq.c"
        description: "发送切换开始通知"
      - function: "srcu_notifier_call_chain (CPUFREQ_PRECHANGE)"
        file: "kernel/notifier.c"
        description: "通知所有订阅者"
      - function: "driver->target_index"
        file: "驱动代码"
        description: "调用驱动切换频率"
        is_user_entry: true
      - function: "cpufreq_freq_transition_end"
        file: "drivers/cpufreq/cpufreq.c"
        description: "发送切换完成通知"
      - function: "srcu_notifier_call_chain (CPUFREQ_POSTCHANGE)"
        file: "kernel/notifier.c"
        description: "通知所有订阅者"

  cpufreq_init_flow:
    description: "调频初始化调用链"
    trigger: "CPU 上线或驱动加载"
    chain:
      - function: "cpufreq_online"
        file: "drivers/cpufreq/cpufreq.c"
        description: "CPU 上线入口"
        context: "process"
      - function: "cpufreq_policy_alloc"
        file: "drivers/cpufreq/cpufreq.c"
        description: "分配策略结构"
      - function: "driver->init"
        file: "驱动代码"
        description: "驱动初始化回调"
        is_user_entry: true
      - function: "cpufreq_table_validate_and_sort"
        file: "drivers/cpufreq/freq_table.c"
        description: "验证频率表"
      - function: "cpufreq_init_policy"
        file: "drivers/cpufreq/cpufreq.c"
        description: "初始化策略"
      - function: "cpufreq_set_policy"
        file: "drivers/cpufreq/cpufreq.c"
        description: "设置默认 governor"
      - function: "governor->init"
        file: "governor 代码"
        description: "Governor 初始化"
      - function: "governor->start"
        file: "governor 代码"
        description: "启动 governor"

  cpufreq_fast_switch_flow:
    description: "快速频率切换调用链"
    trigger: "schedutil governor 请求频率变化"
    chain:
      - function: "sugov_update_single"
        file: "kernel/sched/cpufreq_schedutil.c"
        description: "Schedutil 更新"
        context: "scheduler"
      - function: "cpufreq_driver_fast_switch"
        file: "drivers/cpufreq/cpufreq.c"
        description: "快速切换入口"
        context: "any (不可睡眠)"
      - function: "driver->fast_switch"
        file: "驱动代码"
        description: "驱动快速切换回调"
        is_user_entry: true


# ============================================================
# EXAMPLES
# ============================================================

examples:
  - description: "简单 CPU 调频驱动"
    kernel_version: "4.0+"
    code: |
      #include <linux/cpufreq.h>
      #include <linux/clk.h>
      
      struct my_cpufreq_data {
          struct clk *clk;
          struct cpufreq_frequency_table *freq_table;
      };
      
      static struct my_cpufreq_data *cpufreq_data;
      
      /* 频率表 */
      static struct cpufreq_frequency_table my_freq_table[] = {
          { .frequency = 200000 },   /* 200 MHz */
          { .frequency = 400000 },   /* 400 MHz */
          { .frequency = 600000 },   /* 600 MHz */
          { .frequency = 800000 },   /* 800 MHz */
          { .frequency = 1000000 },  /* 1 GHz */
          { .frequency = CPUFREQ_TABLE_END },
      };
      
      static int my_cpufreq_init(struct cpufreq_policy *policy)
      {
          struct my_cpufreq_data *data = cpufreq_data;
          
          /* 设置频率表 */
          policy->freq_table = my_freq_table;
          
          /* 设置 CPU 能力 */
          policy->cpuinfo.min_freq = my_freq_table[0].frequency;
          policy->cpuinfo.max_freq = my_freq_table[4].frequency;
          policy->cpuinfo.transition_latency = 10000; /* 10us */
          
          /* 设置默认频率范围 */
          policy->min = policy->cpuinfo.min_freq;
          policy->max = policy->cpuinfo.max_freq;
          
          /* 获取当前频率 */
          policy->cur = clk_get_rate(data->clk) / 1000;
          
          return 0;
      }
      
      static int my_cpufreq_exit(struct cpufreq_policy *policy)
      {
          return 0;
      }
      
      static int my_cpufreq_verify(struct cpufreq_policy *policy)
      {
          return cpufreq_frequency_table_verify(policy, my_freq_table);
      }
      
      static int my_cpufreq_target_index(struct cpufreq_policy *policy,
                                         unsigned int index)
      {
          struct my_cpufreq_data *data = cpufreq_data;
          unsigned int freq = my_freq_table[index].frequency;
          int ret;
          
          /* 设置时钟频率 */
          ret = clk_set_rate(data->clk, freq * 1000);
          if (ret) {
              pr_err("Failed to set CPU frequency to %u kHz\n", freq);
              return ret;
          }
          
          return 0;
      }
      
      static unsigned int my_cpufreq_get(unsigned int cpu)
      {
          struct my_cpufreq_data *data = cpufreq_data;
          
          return clk_get_rate(data->clk) / 1000;
      }
      
      static struct cpufreq_driver my_cpufreq_driver = {
          .name           = "my-cpufreq",
          .flags          = CPUFREQ_NEED_INITIAL_FREQ_CHECK,
          .init           = my_cpufreq_init,
          .exit           = my_cpufreq_exit,
          .verify         = my_cpufreq_verify,
          .target_index   = my_cpufreq_target_index,
          .get            = my_cpufreq_get,
          .attr           = cpufreq_generic_attr,
      };
      
      static int my_cpufreq_probe(struct platform_device *pdev)
      {
          struct my_cpufreq_data *data;
          int ret;
          
          data = devm_kzalloc(&pdev->dev, sizeof(*data), GFP_KERNEL);
          if (!data)
              return -ENOMEM;
          
          data->clk = devm_clk_get(&pdev->dev, "cpu");
          if (IS_ERR(data->clk))
              return PTR_ERR(data->clk);
          
          cpufreq_data = data;
          
          ret = cpufreq_register_driver(&my_cpufreq_driver);
          if (ret) {
              dev_err(&pdev->dev, "Failed to register cpufreq driver\n");
              return ret;
          }
          
          return 0;
      }
      
      static int my_cpufreq_remove(struct platform_device *pdev)
      {
          cpufreq_unregister_driver(&my_cpufreq_driver);
          return 0;
      }

  - description: "支持快速切换的驱动"
    kernel_version: "4.7+"
    code: |
      #include <linux/cpufreq.h>
      
      /* 快速切换回调 - 不能睡眠 */
      static unsigned int my_fast_switch(struct cpufreq_policy *policy,
                                         unsigned int target_freq)
      {
          unsigned int index;
          
          /* 查找目标频率索引 */
          index = cpufreq_table_find_index_dl(policy, target_freq);
          
          /* 直接写寄存器切换频率 */
          writel(index, freq_reg);
          
          return policy->freq_table[index].frequency;
      }
      
      static int my_cpufreq_init(struct cpufreq_policy *policy)
      {
          /* ... 常规初始化 ... */
          
          /* 启用快速切换 */
          policy->fast_switch_possible = true;
          
          return 0;
      }
      
      static struct cpufreq_driver my_cpufreq_driver = {
          .name           = "my-cpufreq-fast",
          .flags          = CPUFREQ_NEED_INITIAL_FREQ_CHECK,
          .init           = my_cpufreq_init,
          .verify         = cpufreq_generic_frequency_table_verify,
          .target_index   = my_cpufreq_target_index,
          .fast_switch    = my_fast_switch,  /* 快速切换回调 */
          .get            = my_cpufreq_get,
          .attr           = cpufreq_generic_attr,
      };

  - description: "简单 Governor 实现"
    kernel_version: "4.0+"
    code: |
      #include <linux/cpufreq.h>
      
      struct my_gov_data {
          unsigned int target_freq;
          struct timer_list timer;
          unsigned int sample_rate_ms;
      };
      
      static void my_gov_timer(struct timer_list *t)
      {
          struct my_gov_data *data = from_timer(data, t, timer);
          struct cpufreq_policy *policy = cpufreq_cpu_get(0);
          unsigned int load;
          
          if (!policy)
              return;
          
          /* 计算 CPU 负载 */
          load = get_cpu_load();
          
          /* 根据负载决定频率 */
          if (load > 80)
              data->target_freq = policy->max;
          else if (load < 20)
              data->target_freq = policy->min;
          else
              data->target_freq = policy->min +
                  (policy->max - policy->min) * load / 100;
          
          /* 请求频率变化 */
          __cpufreq_driver_target(policy, data->target_freq,
                                  CPUFREQ_RELATION_C);
          
          cpufreq_cpu_put(policy);
          
          /* 重新启动定时器 */
          mod_timer(&data->timer, jiffies +
                    msecs_to_jiffies(data->sample_rate_ms));
      }
      
      static int my_gov_init(struct cpufreq_policy *policy)
      {
          struct my_gov_data *data;
          
          data = kzalloc(sizeof(*data), GFP_KERNEL);
          if (!data)
              return -ENOMEM;
          
          data->sample_rate_ms = 100;
          timer_setup(&data->timer, my_gov_timer, 0);
          
          policy->governor_data = data;
          
          return 0;
      }
      
      static void my_gov_exit(struct cpufreq_policy *policy)
      {
          struct my_gov_data *data = policy->governor_data;
          
          kfree(data);
          policy->governor_data = NULL;
      }
      
      static int my_gov_start(struct cpufreq_policy *policy)
      {
          struct my_gov_data *data = policy->governor_data;
          
          mod_timer(&data->timer, jiffies +
                    msecs_to_jiffies(data->sample_rate_ms));
          
          return 0;
      }
      
      static void my_gov_stop(struct cpufreq_policy *policy)
      {
          struct my_gov_data *data = policy->governor_data;
          
          del_timer_sync(&data->timer);
      }
      
      static void my_gov_limits(struct cpufreq_policy *policy)
      {
          struct my_gov_data *data = policy->governor_data;
          
          /* 确保目标频率在新限制范围内 */
          if (data->target_freq < policy->min)
              data->target_freq = policy->min;
          else if (data->target_freq > policy->max)
              data->target_freq = policy->max;
      }
      
      static struct cpufreq_governor my_governor = {
          .name   = "my-governor",
          .owner  = THIS_MODULE,
          .init   = my_gov_init,
          .exit   = my_gov_exit,
          .start  = my_gov_start,
          .stop   = my_gov_stop,
          .limits = my_gov_limits,
      };
      
      static int __init my_gov_init_module(void)
      {
          return cpufreq_register_governor(&my_governor);
      }
      
      static void __exit my_gov_exit_module(void)
      {
          cpufreq_unregister_governor(&my_governor);
      }
      
      module_init(my_gov_init_module);
      module_exit(my_gov_exit_module);


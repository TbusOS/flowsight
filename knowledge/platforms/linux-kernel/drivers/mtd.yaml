# MTD (Memory Technology Devices) Framework Knowledge Base
# Reference: https://www.kernel.org/doc/html/latest/driver-api/mtd/

# ============================================================
# MTD DEVICE
# ============================================================
mtd_device:
  description: "MTD Device Driver"
  header: "linux/mtd/mtd.h"
  icon: "💿"
  kernel_version: "2.6.17+"
  registration:
    - pattern: 'mtd_device_register\s*\(\s*(?P<mtd>\w+)\s*,'
      description: "注册 MTD 设备"
    - pattern: 'mtd_device_parse_register\s*\(\s*(?P<mtd>\w+)\s*,'
      description: "解析分区并注册 MTD 设备"
  unregistration:
    - pattern: 'mtd_device_unregister\s*\(\s*(?P<mtd>\w+)\s*\)'
      description: "注销 MTD 设备"
  structure:
    name: "mtd_info"
    callbacks:
      _erase:
        pattern: '\._erase\s*=\s*(?P<handler>\w+)'
        description: "擦除操作"
        context: "process"
        can_sleep: true
      _read:
        pattern: '\._read\s*=\s*(?P<handler>\w+)'
        description: "读取操作"
        context: "process"
        can_sleep: true
      _write:
        pattern: '\._write\s*=\s*(?P<handler>\w+)'
        description: "写入操作"
        context: "process"
        can_sleep: true
      _read_oob:
        pattern: '\._read_oob\s*=\s*(?P<handler>\w+)'
        description: "读取 OOB 数据"
        context: "process"
        can_sleep: true
      _write_oob:
        pattern: '\._write_oob\s*=\s*(?P<handler>\w+)'
        description: "写入 OOB 数据"
        context: "process"
        can_sleep: true
      _sync:
        pattern: '\._sync\s*=\s*(?P<handler>\w+)'
        description: "同步操作"
        context: "process"
        can_sleep: true
      _lock:
        pattern: '\._lock\s*=\s*(?P<handler>\w+)'
        description: "锁定区域"
        context: "process"
        can_sleep: true
      _unlock:
        pattern: '\._unlock\s*=\s*(?P<handler>\w+)'
        description: "解锁区域"
        context: "process"
        can_sleep: true

# ============================================================
# NAND FLASH
# ============================================================
nand_chip:
  description: "NAND Flash Controller"
  header: "linux/mtd/rawnand.h"
  icon: "📀"
  registration:
    - pattern: 'nand_scan\s*\(\s*(?P<chip>\w+)\s*,\s*(?P<maxchips>\w+)\s*\)'
      description: "扫描并初始化 NAND"
    - pattern: 'nand_scan_with_ids\s*\(\s*(?P<chip>\w+)\s*,'
      description: "使用指定 ID 扫描 NAND"
  cleanup:
    - pattern: 'nand_cleanup\s*\(\s*(?P<chip>\w+)\s*\)'
      description: "清理 NAND 芯片"
    - pattern: 'nand_release\s*\(\s*(?P<chip>\w+)\s*\)'
      description: "释放 NAND 芯片（旧 API）"
  structure:
    name: "nand_controller_ops"
    callbacks:
      attach_chip:
        pattern: '\.attach_chip\s*=\s*(?P<handler>\w+)'
        description: "芯片附加回调"
        context: "process"
        can_sleep: true
      exec_op:
        pattern: '\.exec_op\s*=\s*(?P<handler>\w+)'
        description: "执行 NAND 操作"
        context: "process"
        can_sleep: true
      setup_interface:
        pattern: '\.setup_interface\s*=\s*(?P<handler>\w+)'
        description: "设置接口时序"
        context: "process"
        can_sleep: true
  legacy_callbacks:
    name: "nand_chip (legacy)"
    callbacks:
      cmd_ctrl:
        pattern: '\.cmd_ctrl\s*=\s*(?P<handler>\w+)'
        description: "命令/地址控制（旧 API）"
        deprecated: true
      select_chip:
        pattern: '\.select_chip\s*=\s*(?P<handler>\w+)'
        description: "片选（旧 API）"
        deprecated: true
      read_byte:
        pattern: '\.read_byte\s*=\s*(?P<handler>\w+)'
        description: "读取字节"
      write_buf:
        pattern: '\.write_buf\s*=\s*(?P<handler>\w+)'
        description: "写入缓冲区"
      read_buf:
        pattern: '\.read_buf\s*=\s*(?P<handler>\w+)'
        description: "读取缓冲区"

# ============================================================
# SPI NOR FLASH
# ============================================================
spi_nor:
  description: "SPI NOR Flash Driver"
  header: "linux/mtd/spi-nor.h"
  icon: "⚡"
  registration:
    - pattern: 'spi_nor_scan\s*\(\s*(?P<nor>\w+)\s*,'
      description: "扫描 SPI NOR Flash"
  structure:
    name: "spi_nor_controller_ops"
    callbacks:
      prepare:
        pattern: '\.prepare\s*=\s*(?P<handler>\w+)'
        description: "准备操作"
      unprepare:
        pattern: '\.unprepare\s*=\s*(?P<handler>\w+)'
        description: "完成操作"
      read_reg:
        pattern: '\.read_reg\s*=\s*(?P<handler>\w+)'
        description: "读取寄存器"
      write_reg:
        pattern: '\.write_reg\s*=\s*(?P<handler>\w+)'
        description: "写入寄存器"
      read:
        pattern: '\.read\s*=\s*(?P<handler>\w+)'
        description: "读取数据"
      write:
        pattern: '\.write\s*=\s*(?P<handler>\w+)'
        description: "写入数据"
      erase:
        pattern: '\.erase\s*=\s*(?P<handler>\w+)'
        description: "擦除"

# ============================================================
# CALL CHAINS
# ============================================================
call_chains:
  mtd_read:
    description: "MTD Read Operation"
    chain:
      - caller: "mtd_read"
        callee: "mtd->_read"
        description: "调用底层读取函数"
  nand_probe:
    description: "NAND Probe Flow"
    chain:
      - caller: "platform_driver.probe"
        callee: "nand_scan"
        description: "扫描 NAND"
      - caller: "nand_scan"
        callee: "nand_scan_ident"
        description: "识别 NAND 芯片"
      - caller: "nand_scan"
        callee: "nand_scan_tail"
        description: "完成初始化"
      - caller: "platform_driver.probe"
        callee: "mtd_device_register"
        description: "注册 MTD 设备"


# ============================================================
# DATA STRUCTURES
# ============================================================

data_structures:
  mtd_info:
    pattern: 'struct mtd_info\s*\{'
    description: "MTD 设备信息结构"
    file: "include/linux/mtd/mtd.h"
    fields:
      - name: "type"
        type: "u_char"
        description: "MTD 类型"
      - name: "flags"
        type: "uint32_t"
        description: "MTD 标志"
      - name: "size"
        type: "uint64_t"
        description: "设备总大小"
      - name: "erasesize"
        type: "uint32_t"
        description: "擦除块大小"
      - name: "writesize"
        type: "uint32_t"
        description: "最小写入大小"
      - name: "writebufsize"
        type: "uint32_t"
        description: "写入缓冲区大小"
      - name: "oobsize"
        type: "uint32_t"
        description: "OOB 区大小"
      - name: "name"
        type: "char *"
        description: "设备名称"
      - name: "_erase"
        type: "callback"
        description: "擦除回调"
      - name: "_read"
        type: "callback"
        description: "读取回调"
      - name: "_write"
        type: "callback"
        description: "写入回调"

  nand_chip:
    pattern: 'struct nand_chip\s*\{'
    description: "NAND 芯片结构"
    file: "include/linux/mtd/rawnand.h"
    fields:
      - name: "mtd"
        type: "struct mtd_info"
        description: "MTD 设备"
      - name: "controller"
        type: "struct nand_controller *"
        description: "NAND 控制器"
      - name: "ecc"
        type: "struct nand_ecc_ctrl"
        description: "ECC 控制"
      - name: "options"
        type: "unsigned int"
        description: "芯片选项"
      - name: "page_shift"
        type: "int"
        description: "页大小位移"
      - name: "bbt"
        type: "uint8_t *"
        description: "坏块表"


# ============================================================
# HELPER FUNCTIONS
# ============================================================

helpers:
  - pattern: 'mtd_read\s*\(\s*(?P<mtd>\w+)\s*,\s*(?P<from>\w+)\s*,\s*(?P<len>\w+)\s*,\s*(?P<retlen>\w+)\s*,\s*(?P<buf>\w+)\s*\)'
    variable_capture: "mtd"
    description: "读取 MTD 数据"
    context: "process"
    can_sleep: true

  - pattern: 'mtd_write\s*\(\s*(?P<mtd>\w+)\s*,\s*(?P<to>\w+)\s*,\s*(?P<len>\w+)\s*,\s*(?P<retlen>\w+)\s*,\s*(?P<buf>\w+)\s*\)'
    variable_capture: "mtd"
    description: "写入 MTD 数据"
    context: "process"
    can_sleep: true

  - pattern: 'mtd_erase\s*\(\s*(?P<mtd>\w+)\s*,\s*(?P<instr>\w+)\s*\)'
    variable_capture: "mtd"
    description: "擦除 MTD 块"
    context: "process"
    can_sleep: true

  - pattern: 'nand_to_mtd\s*\(\s*(?P<chip>\w+)\s*\)'
    variable_capture: "chip"
    description: "获取 nand_chip 的 mtd_info"


# ============================================================
# EXAMPLES
# ============================================================

examples:
  - description: "基本 NAND 驱动示例"
    kernel_version: "5.0+"
    code: |
      #include <linux/module.h>
      #include <linux/mtd/rawnand.h>
      #include <linux/platform_device.h>
      
      struct my_nand {
          struct nand_controller controller;
          struct nand_chip chip;
          void __iomem *regs;
          struct clk *clk;
      };
      
      static int my_nand_exec_op(struct nand_chip *chip,
                                  const struct nand_operation *op,
                                  bool check_only)
      {
          struct my_nand *nand = nand_get_controller_data(chip);
          unsigned int i;
          
          if (check_only)
              return 0;
          
          for (i = 0; i < op->ninstrs; i++) {
              const struct nand_op_instr *instr = &op->instrs[i];
              
              switch (instr->type) {
              case NAND_OP_CMD_INSTR:
                  writeb(instr->ctx.cmd.opcode,
                         nand->regs + CMD_REG);
                  break;
                  
              case NAND_OP_ADDR_INSTR:
                  for (int j = 0; j < instr->ctx.addr.naddrs; j++)
                      writeb(instr->ctx.addr.addrs[j],
                             nand->regs + ADDR_REG);
                  break;
                  
              case NAND_OP_DATA_IN_INSTR:
                  ioread8_rep(nand->regs + DATA_REG,
                              instr->ctx.data.buf.in,
                              instr->ctx.data.len);
                  break;
                  
              case NAND_OP_DATA_OUT_INSTR:
                  iowrite8_rep(nand->regs + DATA_REG,
                               instr->ctx.data.buf.out,
                               instr->ctx.data.len);
                  break;
                  
              case NAND_OP_WAITRDY_INSTR:
                  my_nand_wait_ready(nand,
                                      instr->ctx.waitrdy.timeout_ms);
                  break;
              }
          }
          
          return 0;
      }
      
      static int my_nand_attach_chip(struct nand_chip *chip)
      {
          struct mtd_info *mtd = nand_to_mtd(chip);
          
          /* 配置 ECC */
          if (chip->ecc.engine_type == NAND_ECC_ENGINE_TYPE_ON_HOST) {
              chip->ecc.size = 512;
              chip->ecc.strength = 4;
          }
          
          return 0;
      }
      
      static const struct nand_controller_ops my_nand_ops = {
          .exec_op = my_nand_exec_op,
          .attach_chip = my_nand_attach_chip,
      };
      
      static int my_nand_probe(struct platform_device *pdev)
      {
          struct my_nand *nand;
          struct mtd_info *mtd;
          int ret;
          
          nand = devm_kzalloc(&pdev->dev, sizeof(*nand), GFP_KERNEL);
          if (!nand)
              return -ENOMEM;
          
          nand->regs = devm_platform_ioremap_resource(pdev, 0);
          if (IS_ERR(nand->regs))
              return PTR_ERR(nand->regs);
          
          nand_controller_init(&nand->controller);
          nand->controller.ops = &my_nand_ops;
          
          nand->chip.controller = &nand->controller;
          nand_set_controller_data(&nand->chip, nand);
          nand_set_flash_node(&nand->chip, pdev->dev.of_node);
          
          mtd = nand_to_mtd(&nand->chip);
          mtd->dev.parent = &pdev->dev;
          mtd->name = "my-nand";
          
          ret = nand_scan(&nand->chip, 1);
          if (ret)
              return ret;
          
          ret = mtd_device_register(mtd, NULL, 0);
          if (ret) {
              nand_cleanup(&nand->chip);
              return ret;
          }
          
          platform_set_drvdata(pdev, nand);
          return 0;
      }
      
      static int my_nand_remove(struct platform_device *pdev)
      {
          struct my_nand *nand = platform_get_drvdata(pdev);
          struct mtd_info *mtd = nand_to_mtd(&nand->chip);
          
          mtd_device_unregister(mtd);
          nand_cleanup(&nand->chip);
          return 0;
      }
      
      static struct platform_driver my_nand_driver = {
          .probe  = my_nand_probe,
          .remove = my_nand_remove,
          .driver = {
              .name = "my-nand",
          },
      };
      module_platform_driver(my_nand_driver);

# ============================================================
# SPI NOR FLASH
# ============================================================

spi_nor:
  description: "SPI NOR Flash 子系统"
  header: "linux/mtd/spi-nor.h"
  icon: "⚡"
  kernel_version: "3.14+"

  registration:
    - pattern: 'spi_nor_scan\s*\(\s*&(?P<nor>\w+)\s*,'
      description: "扫描 SPI NOR Flash"
    - pattern: 'spi_nor_remove\s*\(\s*&(?P<nor>\w+)\s*\)'
      description: "移除 SPI NOR Flash"

  data_structures:
    spi_nor:
      pattern: 'struct spi_nor\s*\{'
      description: "SPI NOR Flash 设备结构"
      file: "include/linux/mtd/spi-nor.h"
      fields:
        - name: "mtd"
          type: "struct mtd_info"
          description: "MTD 设备"
        - name: "lock"
          type: "struct mutex"
          description: "设备锁"
        - name: "dev"
          type: "struct device *"
          description: "父设备"
        - name: "page_size"
          type: "size_t"
          description: "页大小"
        - name: "addr_nbytes"
          type: "u8"
          description: "地址字节数"
        - name: "erase_opcode"
          type: "u8"
          description: "擦除命令"
        - name: "read_opcode"
          type: "u8"
          description: "读取命令"
        - name: "program_opcode"
          type: "u8"
          description: "编程命令"

# ============================================================
# MTD PARTITIONS
# ============================================================

mtd_partitions:
  description: "MTD 分区支持"
  header: "linux/mtd/partitions.h"
  icon: "📦"

  data_structures:
    mtd_partition:
      pattern: 'struct mtd_partition\s*\{'
      description: "MTD 分区信息"
      file: "include/linux/mtd/partitions.h"
      fields:
        - name: "name"
          type: "char *"
          description: "分区名称"
        - name: "size"
          type: "uint64_t"
          description: "分区大小 (MTDPART_SIZ_FULL 表示剩余)"
        - name: "offset"
          type: "uint64_t"
          description: "分区偏移 (MTDPART_OFS_APPEND 自动)"
        - name: "mask_flags"
          type: "uint32_t"
          description: "需要屏蔽的标志"

  example: |
    static const struct mtd_partition my_partitions[] = {
        { .name = "bootloader", .offset = 0, .size = SZ_256K,
          .mask_flags = MTD_WRITEABLE },
        { .name = "kernel", .offset = MTDPART_OFS_APPEND, .size = SZ_4M },
        { .name = "rootfs", .offset = MTDPART_OFS_APPEND,
          .size = MTDPART_SIZ_FULL },
    };

# ============================================================
# ADDITIONAL CALL CHAINS
# ============================================================

  mtd_write:
    description: "MTD Write Operation"
    chain:
      - caller: "mtd_write"
        callee: "part_write (如果是分区)"
        description: "处理分区偏移"
      - caller: "part_write / mtd_write"
        callee: "mtd->_write"
        description: "调用底层写入函数"

  mtd_erase:
    description: "MTD Erase Operation"
    chain:
      - caller: "mtd_erase"
        callee: "mtd->_erase"
        description: "调用底层擦除"
      - caller: "_erase"
        callee: "nand_erase_nand"
        description: "NAND 擦除实现"

  spi_nor_probe:
    description: "SPI NOR Flash Probe Flow"
    chain:
      - caller: "platform_driver.probe"
        callee: "spi_nor_scan"
        description: "扫描 SPI NOR Flash"
      - caller: "spi_nor_scan"
        callee: "spi_nor_read_id"
        description: "读取 JEDEC ID"
      - caller: "platform_driver.probe"
        callee: "mtd_device_register"
        description: "注册 MTD 设备"

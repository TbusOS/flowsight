# PWM Driver Framework Knowledge Base
# Reference: https://www.kernel.org/doc/html/latest/driver-api/pwm.html

pwm_chip:
  description: "PWM Controller Driver"
  header: "linux/pwm.h"
  icon: "⚡"

  registration:
    - pattern: 'pwmchip_add\s*\(\s*&(?P<chip>\w+)\s*\)'
      description: "注册 PWM 控制器"
    - pattern: 'pwmchip_remove\s*\(\s*&(?P<chip>\w+)\s*\)'
      description: "注销 PWM 控制器"
    - pattern: 'devm_pwmchip_add\s*\([^,]+,\s*&(?P<chip>\w+)\s*\)'
      description: "注册 PWM 控制器 (资源管理)"

  structure:
    - pattern: 'static struct pwm_chip\s+(?P<name>\w+)\s*'
      description: "PWM 控制器结构体"
    - pattern: 'static const struct pwm_ops\s+(?P<name>\w+)\s*=\s*\{'
      description: "PWM 操作结构体"

  callbacks:
    request:
      pattern: '\.request\s*=\s*(?P<handler>\w+)'
      description: "请求 PWM 通道"
      signature: "int (*)(struct pwm_chip *, struct pwm_device *)"
      context: "process"

    free:
      pattern: '\.free\s*=\s*(?P<handler>\w+)'
      description: "释放 PWM 通道"
      signature: "void (*)(struct pwm_chip *, struct pwm_device *)"

    capture:
      pattern: '\.capture\s*=\s*(?P<handler>\w+)'
      description: "捕获 PWM 信号"
      signature: "int (*)(struct pwm_chip *, struct pwm_device *, struct pwm_capture *, unsigned long)"

    apply:
      pattern: '\.apply\s*=\s*(?P<handler>\w+)'
      description: "应用 PWM 配置"
      signature: "int (*)(struct pwm_chip *, struct pwm_device *, const struct pwm_state *)"
      notes:
        - "原子地应用所有状态"
        - "包括周期、占空比、极性、启用状态"

    get_state:
      pattern: '\.get_state\s*=\s*(?P<handler>\w+)'
      description: "获取当前 PWM 状态"
      signature: "void (*)(struct pwm_chip *, struct pwm_device *, struct pwm_state *)"

    # Legacy callbacks (deprecated)
    config:
      pattern: '\.config\s*=\s*(?P<handler>\w+)'
      description: "配置 PWM (旧 API，已废弃)"
      deprecated: true

    enable:
      pattern: '\.enable\s*=\s*(?P<handler>\w+)'
      description: "启用 PWM (旧 API，已废弃)"
      deprecated: true

    disable:
      pattern: '\.disable\s*=\s*(?P<handler>\w+)'
      description: "禁用 PWM (旧 API，已废弃)"
      deprecated: true

    set_polarity:
      pattern: '\.set_polarity\s*=\s*(?P<handler>\w+)'
      description: "设置极性 (旧 API，已废弃)"
      deprecated: true


pwm_consumer:
  description: "PWM Consumer API"
  header: "linux/pwm.h"

  acquisition:
    - pattern: 'pwm_get\s*\([^,]+,\s*(?P<con_id>[^)]+)\s*\)'
      description: "获取 PWM 设备"
    - pattern: 'devm_pwm_get\s*\([^,]+,\s*(?P<con_id>[^)]+)\s*\)'
      description: "获取 PWM 设备 (资源管理)"
    - pattern: 'pwm_put\s*\([^)]+\)'
      description: "释放 PWM 设备"

  configuration:
    - pattern: 'pwm_apply_state\s*\([^)]+\)'
      description: "应用 PWM 状态"
    - pattern: 'pwm_get_state\s*\([^)]+\)'
      description: "获取 PWM 状态"
    - pattern: 'pwm_enable\s*\([^)]+\)'
      description: "启用 PWM"
    - pattern: 'pwm_disable\s*\([^)]+\)'
      description: "禁用 PWM"
    - pattern: 'pwm_config\s*\([^)]+\)'
      description: "配置 PWM 周期和占空比"


examples:
  - description: "PWM 驱动示例"
    code: |
      static int my_pwm_apply(struct pwm_chip *chip,
                              struct pwm_device *pwm,
                              const struct pwm_state *state)
      {
          struct my_pwm *priv = to_my_pwm(chip);
          u32 period, duty;

          if (!state->enabled) {
              writel(0, priv->base + PWM_CTRL);
              return 0;
          }

          period = DIV_ROUND_CLOSEST(state->period, 1000);
          duty = DIV_ROUND_CLOSEST(state->duty_cycle, 1000);

          writel(period, priv->base + PWM_PERIOD);
          writel(duty, priv->base + PWM_DUTY);
          writel(PWM_EN, priv->base + PWM_CTRL);

          return 0;
      }

      static const struct pwm_ops my_pwm_ops = {
          .apply = my_pwm_apply,
          .get_state = my_pwm_get_state,
          .owner = THIS_MODULE,
      };

# Linux Kernel - UIO (Userspace I/O)
uio:
  description: "用户空间 I/O 驱动框架"
  header: "linux/uio_driver.h"
  
  registration:
    bind_patterns:
      - pattern: '__uio_register_device\s*\('
      - pattern: 'uio_register_device\s*\('
        description: "注册 UIO 设备"
        
      - pattern: 'devm_uio_register_device\s*\('
        description: "设备管理版本"
        
      - pattern: 'uio_unregister_device\s*\('
      
  info_struct:
    bind_patterns:
      - pattern: 'struct uio_info\s*='
      - pattern: '\.name\s*='
      - pattern: '\.version\s*='
      - pattern: '\.mem\s*='
      - pattern: '\.port\s*='
      - pattern: '\.irq\s*='
      - pattern: '\.handler\s*='
      - pattern: '\.open\s*='
      - pattern: '\.release\s*='
      
  memory:
    bind_patterns:
      - pattern: 'UIO_MEM_PHYS'
      - pattern: 'UIO_MEM_LOGICAL'
      - pattern: 'UIO_MEM_VIRTUAL'
      - pattern: 'UIO_MEM_IOVA'

# Firmware Framework Knowledge Base
# Reference: https://www.kernel.org/doc/html/latest/driver-api/firmware/

# ============================================================
# FIRMWARE LOADING
# ============================================================
firmware:
  description: "Firmware Loading API"
  header: "linux/firmware.h"
  icon: "📦"
  kernel_version: "2.6+"
  sync_loading:
    - pattern: 'request_firmware\s*\(\s*&(?P<fw>\w+)\s*,\s*"(?P<name>[^"]+)"\s*,\s*(?P<dev>\w+)\s*\)'
      description: "同步请求固件"
      context: "process"
      can_sleep: true
    - pattern: 'request_firmware_direct\s*\(\s*&(?P<fw>\w+)\s*,'
      description: "直接请求固件（跳过缓存）"
    - pattern: 'firmware_request_builtin\s*\(\s*&(?P<fw>\w+)\s*,'
      description: "请求内置固件"
  async_loading:
    - pattern: 'request_firmware_nowait\s*\(\s*(?P<module>\w+)\s*,\s*(?P<uevent>\w+)\s*,\s*"(?P<name>[^"]+)"\s*,\s*(?P<dev>\w+)\s*,\s*(?P<gfp>\w+)\s*,\s*(?P<context>\w+)\s*,\s*(?P<cont>\w+)\s*\)'
      description: "异步请求固件"
      context: "process"
      can_sleep: true
  release:
    - pattern: 'release_firmware\s*\(\s*(?P<fw>\w+)\s*\)'
      description: "释放固件"
  partial_loading:
    - pattern: 'request_partial_firmware_into_buf\s*\('
      description: "部分加载固件到缓冲区"
    - pattern: 'firmware_request_cache\s*\('
      description: "缓存固件请求"

# ============================================================
# FIRMWARE UPLOAD
# ============================================================
firmware_upload:
  description: "Firmware Upload API"
  header: "linux/firmware.h"
  icon: "⬆️"
  registration:
    - pattern: 'firmware_upload_register\s*\(\s*(?P<module>\w+)\s*,\s*(?P<dev>\w+)\s*,\s*"(?P<name>[^"]+)"\s*,\s*&(?P<ops>\w+)\s*,'
      description: "注册固件上传接口"
  unregistration:
    - pattern: 'firmware_upload_unregister\s*\(\s*(?P<fw_upload>\w+)\s*\)'
      description: "注销固件上传接口"
  structure:
    name: "fw_upload_ops"
    callbacks:
      prepare:
        pattern: '\.prepare\s*=\s*(?P<handler>\w+)'
        description: "准备上传"
        context: "process"
        can_sleep: true
      write:
        pattern: '\.write\s*=\s*(?P<handler>\w+)'
        description: "写入固件数据"
        context: "process"
        can_sleep: true
      poll_complete:
        pattern: '\.poll_complete\s*=\s*(?P<handler>\w+)'
        description: "轮询上传完成"
        context: "process"
        can_sleep: true
      cancel:
        pattern: '\.cancel\s*=\s*(?P<handler>\w+)'
        description: "取消上传"
        context: "process"
        can_sleep: true
      cleanup:
        pattern: '\.cleanup\s*=\s*(?P<handler>\w+)'
        description: "清理"
        context: "process"
        can_sleep: true

# ============================================================
# EFI RUNTIME SERVICES
# ============================================================
efi:
  description: "EFI Runtime Services"
  header: "linux/efi.h"
  icon: "🔐"
  patterns:
    - pattern: 'efi\.get_variable\s*\('
      description: "获取 EFI 变量"
    - pattern: 'efi\.set_variable\s*\('
      description: "设置 EFI 变量"
    - pattern: 'efi\.get_next_variable\s*\('
      description: "枚举 EFI 变量"
    - pattern: 'efi\.query_variable_info\s*\('
      description: "查询变量存储信息"

# ============================================================
# CALL CHAINS
# ============================================================
call_chains:
  fw_load:
    description: "Firmware Loading Flow"
    chain:
      - caller: "driver probe"
        callee: "request_firmware"
        description: "请求固件"
      - caller: "request_firmware"
        callee: "_request_firmware"
        description: "内部请求"
      - caller: "_request_firmware"
        callee: "fw_get_filesystem_firmware"
        description: "从文件系统加载"
      - caller: "driver probe"
        callee: "release_firmware"
        description: "释放固件"
  fw_async_load:
    description: "Async Firmware Loading"
    chain:
      - caller: "driver probe"
        callee: "request_firmware_nowait"
        description: "异步请求"
      - caller: "request_firmware_nowait"
        callee: "request_firmware_work_func"
        mechanism: "workqueue"
        description: "工作队列加载"
      - caller: "request_firmware_work_func"
        callee: "cont callback"
        description: "调用完成回调"


# ============================================================
# DATA STRUCTURES
# ============================================================

data_structures:
  firmware:
    pattern: 'struct firmware\s*\{'
    description: "固件结构"
    file: "include/linux/firmware.h"
    fields:
      - name: "size"
        type: "size_t"
        description: "固件大小"
      - name: "data"
        type: "const u8 *"
        description: "固件数据"
      - name: "priv"
        type: "void *"
        description: "私有数据"

  fw_upload_ops:
    pattern: 'struct fw_upload_ops\s*\{'
    description: "固件上传操作结构"
    file: "include/linux/firmware.h"
    fields:
      - name: "prepare"
        type: "callback"
        description: "准备上传"
      - name: "write"
        type: "callback"
        description: "写入数据"
      - name: "poll_complete"
        type: "callback"
        description: "轮询完成"
      - name: "cancel"
        type: "callback"
        description: "取消上传"
      - name: "cleanup"
        type: "callback"
        description: "清理资源"


# ============================================================
# EXAMPLES
# ============================================================

examples:
  - description: "同步固件加载示例"
    kernel_version: "5.0+"
    code: |
      #include <linux/module.h>
      #include <linux/firmware.h>
      #include <linux/platform_device.h>
      
      static int my_load_firmware(struct device *dev)
      {
          const struct firmware *fw;
          int ret;
          
          ret = request_firmware(&fw, "my_device.fw", dev);
          if (ret) {
              dev_err(dev, "Failed to load firmware: %d\n", ret);
              return ret;
          }
          
          dev_info(dev, "Loaded firmware: %zu bytes\n", fw->size);
          
          /* 使用固件数据 */
          ret = my_program_device(dev, fw->data, fw->size);
          
          release_firmware(fw);
          return ret;
      }
      
      static int my_probe(struct platform_device *pdev)
      {
          return my_load_firmware(&pdev->dev);
      }

  - description: "异步固件加载示例"
    kernel_version: "5.0+"
    code: |
      #include <linux/firmware.h>
      
      struct my_device {
          struct device *dev;
          struct completion fw_done;
          int fw_status;
      };
      
      static void my_fw_callback(const struct firmware *fw, void *context)
      {
          struct my_device *mydev = context;
          
          if (!fw) {
              dev_err(mydev->dev, "Firmware not available\n");
              mydev->fw_status = -ENOENT;
              goto out;
          }
          
          dev_info(mydev->dev, "Async firmware: %zu bytes\n", fw->size);
          
          /* 使用固件 */
          mydev->fw_status = my_program_device(mydev->dev,
                                                fw->data, fw->size);
          release_firmware(fw);
          
      out:
          complete(&mydev->fw_done);
      }
      
      static int my_async_probe(struct platform_device *pdev)
      {
          struct my_device *mydev;
          int ret;
          
          mydev = devm_kzalloc(&pdev->dev, sizeof(*mydev), GFP_KERNEL);
          if (!mydev)
              return -ENOMEM;
          
          mydev->dev = &pdev->dev;
          init_completion(&mydev->fw_done);
          
          ret = request_firmware_nowait(THIS_MODULE, true,
                                        "my_device.fw",
                                        &pdev->dev, GFP_KERNEL,
                                        mydev, my_fw_callback);
          if (ret) {
              dev_err(&pdev->dev, "Failed to request firmware\n");
              return ret;
          }
          
          platform_set_drvdata(pdev, mydev);
          return 0;
      }
      
      static int my_async_remove(struct platform_device *pdev)
      {
          struct my_device *mydev = platform_get_drvdata(pdev);
          
          /* 等待固件加载完成 */
          wait_for_completion(&mydev->fw_done);
          return mydev->fw_status;
      }

  - description: "固件上传接口驱动示例"
    kernel_version: "5.18+"
    code: |
      #include <linux/module.h>
      #include <linux/firmware.h>
      #include <linux/platform_device.h>
      
      struct my_fpga {
          struct device *dev;
          struct fw_upload *fwl;
          void __iomem *regs;
          bool cancel_request;
      };
      
      static enum fw_upload_err my_fpga_prepare(struct fw_upload *fwl,
                                                 const u8 *data, u32 size)
      {
          struct my_fpga *fpga = fwl->dd_handle;
          
          if (readl(fpga->regs + FPGA_STATUS) != FPGA_STATUS_IDLE)
              return FW_UPLOAD_ERR_BUSY;
          
          fpga->cancel_request = false;
          writel(1, fpga->regs + FPGA_CONFIG_MODE);
          
          return FW_UPLOAD_ERR_NONE;
      }
      
      static enum fw_upload_err my_fpga_write(struct fw_upload *fwl,
                                               const u8 *data, u32 offset,
                                               u32 size, u32 *written)
      {
          struct my_fpga *fpga = fwl->dd_handle;
          u32 i;
          
          if (fpga->cancel_request)
              return FW_UPLOAD_ERR_CANCELED;
          
          for (i = 0; i < size; i++) {
              writeb(data[i], fpga->regs + FPGA_DATA);
              if (readl(fpga->regs + FPGA_STATUS) == FPGA_STATUS_ERROR)
                  return FW_UPLOAD_ERR_HW_ERROR;
          }
          
          *written = size;
          return FW_UPLOAD_ERR_NONE;
      }
      
      static enum fw_upload_err my_fpga_poll_complete(struct fw_upload *fwl)
      {
          struct my_fpga *fpga = fwl->dd_handle;
          int timeout = 1000;
          
          while (timeout--) {
              if (readl(fpga->regs + FPGA_STATUS) == FPGA_STATUS_DONE)
                  return FW_UPLOAD_ERR_NONE;
              if (fpga->cancel_request)
                  return FW_UPLOAD_ERR_CANCELED;
              msleep(10);
          }
          return FW_UPLOAD_ERR_TIMEOUT;
      }
      
      static void my_fpga_cancel(struct fw_upload *fwl)
      {
          struct my_fpga *fpga = fwl->dd_handle;
          fpga->cancel_request = true;
          writel(1, fpga->regs + FPGA_RESET);
      }
      
      static void my_fpga_cleanup(struct fw_upload *fwl)
      {
          struct my_fpga *fpga = fwl->dd_handle;
          writel(0, fpga->regs + FPGA_CONFIG_MODE);
      }
      
      static const struct fw_upload_ops my_fpga_upload_ops = {
          .prepare        = my_fpga_prepare,
          .write          = my_fpga_write,
          .poll_complete  = my_fpga_poll_complete,
          .cancel         = my_fpga_cancel,
          .cleanup        = my_fpga_cleanup,
      };
      
      static int my_fpga_probe(struct platform_device *pdev)
      {
          struct my_fpga *fpga;
          
          fpga = devm_kzalloc(&pdev->dev, sizeof(*fpga), GFP_KERNEL);
          if (!fpga)
              return -ENOMEM;
          
          fpga->dev = &pdev->dev;
          fpga->regs = devm_platform_ioremap_resource(pdev, 0);
          if (IS_ERR(fpga->regs))
              return PTR_ERR(fpga->regs);
          
          fpga->fwl = firmware_upload_register(THIS_MODULE, &pdev->dev,
                                                "my-fpga-fw",
                                                &my_fpga_upload_ops, fpga);
          return PTR_ERR_OR_ZERO(fpga->fwl);
      }
      
      static void my_fpga_remove(struct platform_device *pdev)
      {
          struct my_fpga *fpga = platform_get_drvdata(pdev);
          firmware_upload_unregister(fpga->fwl);
      }

# ============================================================
# ADDITIONAL DATA STRUCTURES
# ============================================================

  fw_upload:
    pattern: 'struct fw_upload\s*\{'
    description: "固件上传设备结构"
    file: "include/linux/firmware.h"
    fields:
      - name: "name"
        type: "const char *"
        description: "上传接口名称"
      - name: "ops"
        type: "const struct fw_upload_ops *"
        description: "操作函数表"
      - name: "dd_handle"
        type: "void *"
        description: "驱动私有数据"

# ============================================================
# FIRMWARE FALLBACK
# ============================================================

firmware_fallback:
  description: "固件回退机制"
  header: "linux/firmware.h"
  icon: "🔄"
  search_paths:
    - "/lib/firmware/updates/$(uname -r)/"
    - "/lib/firmware/updates/"
    - "/lib/firmware/$(uname -r)/"
    - "/lib/firmware/"
  patterns:
    - pattern: 'firmware_request_nowarn\s*\('
      description: "请求固件（失败时不打印警告）"
    - pattern: 'request_firmware_into_buf\s*\('
      description: "请求固件到指定缓冲区"

# ============================================================
# ADDITIONAL CALL CHAINS
# ============================================================

  fw_upload_flow:
    description: "固件上传流程"
    chain:
      - caller: "sysfs write"
        callee: "fw_upload_start"
        description: "用户空间触发上传"
      - caller: "fw_upload_start"
        callee: "fw_upload_ops->prepare"
        description: "准备上传"
      - caller: "fw_upload_main"
        callee: "fw_upload_ops->write"
        mechanism: "workqueue"
        description: "写入固件数据块"
      - caller: "fw_upload_main"
        callee: "fw_upload_ops->poll_complete"
        description: "轮询完成状态"
      - caller: "fw_upload_main"
        callee: "fw_upload_ops->cleanup"
        description: "清理资源"

# ============================================================
# DEVICE TREE BINDINGS
# ============================================================

device_tree:
  firmware_path:
    description: "设备树中指定固件路径"
    example: |
      my_device@0 {
          compatible = "vendor,my-device";
          firmware-name = "vendor/my_device.fw";
      };

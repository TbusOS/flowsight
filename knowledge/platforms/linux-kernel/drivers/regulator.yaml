# Linux Kernel Regulator Framework Knowledge Base
#
# Reference: https://www.kernel.org/doc/html/latest/driver-api/regulator.html
# Header: include/linux/regulator/driver.h, include/linux/regulator/consumer.h

# ============================================================
# REGULATOR CONSUMER API
# ============================================================

regulator_consumer:
  description: "Regulator Consumer API - 稳压器消费者接口"
  header: "linux/regulator/consumer.h"
  icon: "🔋"
  kernel_version: "2.6.27+"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  registration:
    - pattern: 'regulator_get\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<id>[^)]+)\s*\)'
      description: "获取稳压器引用"
      context: "process"
      can_sleep: true
    - pattern: 'regulator_get_optional\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<id>[^)]+)\s*\)'
      description: "可选获取稳压器（不存在时返回 NULL）"
      context: "process"
      can_sleep: true
    - pattern: 'regulator_get_exclusive\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<id>[^)]+)\s*\)'
      description: "获取独占稳压器引用"
      context: "process"
      can_sleep: true
    - pattern: 'devm_regulator_get\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<id>[^)]+)\s*\)'
      description: "设备管理的稳压器获取"
      context: "process"
      can_sleep: true
    - pattern: 'devm_regulator_get_optional\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<id>[^)]+)\s*\)'
      description: "设备管理的可选稳压器获取"
      context: "process"
      can_sleep: true
    - pattern: 'regulator_put\s*\(\s*(?P<reg>[^)]+)\s*\)'
      description: "释放稳压器引用"
      context: "process"
      can_sleep: true

  helper_functions:
    # 使能/禁用
    - pattern: 'regulator_enable\s*\(\s*(?P<reg>[^)]+)\s*\)'
      description: "使能稳压器"
      context: "process"
      can_sleep: true
      return_value:
        success: "0"
        failure: "-ERRNO"
    - pattern: 'regulator_disable\s*\(\s*(?P<reg>[^)]+)\s*\)'
      description: "禁用稳压器"
      context: "process"
      can_sleep: true
    - pattern: 'regulator_force_disable\s*\(\s*(?P<reg>[^)]+)\s*\)'
      description: "强制禁用稳压器"
      context: "process"
      can_sleep: true
    - pattern: 'regulator_is_enabled\s*\(\s*(?P<reg>[^)]+)\s*\)'
      description: "检查稳压器是否使能"
      context: "process"
      can_sleep: true
      return_value:
        enabled: "1"
        disabled: "0"
        error: "<0"

    # 电压控制
    - pattern: 'regulator_set_voltage\s*\(\s*(?P<reg>[^,]+)\s*,\s*(?P<min_uV>[^,]+)\s*,\s*(?P<max_uV>[^)]+)\s*\)'
      description: "设置输出电压范围"
      context: "process"
      can_sleep: true
    - pattern: 'regulator_get_voltage\s*\(\s*(?P<reg>[^)]+)\s*\)'
      description: "获取当前输出电压 (uV)"
      context: "process"
      can_sleep: true
    - pattern: 'regulator_set_voltage_sel\s*\(\s*(?P<reg>[^,]+)\s*,\s*(?P<selector>[^)]+)\s*\)'
      description: "通过选择器设置电压"
      context: "process"
      can_sleep: true
    - pattern: 'regulator_get_voltage_sel\s*\(\s*(?P<reg>[^)]+)\s*\)'
      description: "获取当前电压选择器"
      context: "process"
      can_sleep: true

    # 电流控制
    - pattern: 'regulator_set_current_limit\s*\(\s*(?P<reg>[^,]+)\s*,\s*(?P<min_uA>[^,]+)\s*,\s*(?P<max_uA>[^)]+)\s*\)'
      description: "设置电流限制范围"
      context: "process"
      can_sleep: true
    - pattern: 'regulator_get_current_limit\s*\(\s*(?P<reg>[^)]+)\s*\)'
      description: "获取当前电流限制 (uA)"
      context: "process"
      can_sleep: true

    # 模式控制
    - pattern: 'regulator_set_mode\s*\(\s*(?P<reg>[^,]+)\s*,\s*(?P<mode>[^)]+)\s*\)'
      description: "设置稳压器工作模式"
      context: "process"
      can_sleep: true
    - pattern: 'regulator_get_mode\s*\(\s*(?P<reg>[^)]+)\s*\)'
      description: "获取当前工作模式"
      context: "process"
      can_sleep: true

    # 负载优化
    - pattern: 'regulator_set_load\s*\(\s*(?P<reg>[^,]+)\s*,\s*(?P<uA_load>[^)]+)\s*\)'
      description: "通知稳压器当前负载电流"
      context: "process"
      can_sleep: true

    # 批量操作
    - pattern: 'regulator_bulk_get\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<num>[^,]+)\s*,\s*(?P<consumers>[^)]+)\s*\)'
      description: "批量获取多个稳压器"
      context: "process"
      can_sleep: true
    - pattern: 'regulator_bulk_enable\s*\(\s*(?P<num>[^,]+)\s*,\s*(?P<consumers>[^)]+)\s*\)'
      description: "批量使能稳压器"
      context: "process"
      can_sleep: true
    - pattern: 'regulator_bulk_disable\s*\(\s*(?P<num>[^,]+)\s*,\s*(?P<consumers>[^)]+)\s*\)'
      description: "批量禁用稳压器"
      context: "process"
      can_sleep: true
    - pattern: 'regulator_bulk_free\s*\(\s*(?P<num>[^,]+)\s*,\s*(?P<consumers>[^)]+)\s*\)'
      description: "批量释放稳压器"
      context: "process"
      can_sleep: true
    - pattern: 'devm_regulator_bulk_get\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<num>[^,]+)\s*,\s*(?P<consumers>[^)]+)\s*\)'
      description: "设备管理的批量获取"
      context: "process"
      can_sleep: true

    # 挂起/恢复
    - pattern: 'regulator_suspend_enable\s*\(\s*(?P<reg>[^,]+)\s*,\s*(?P<state>[^)]+)\s*\)'
      description: "配置挂起时使能"
      context: "process"
      can_sleep: true
    - pattern: 'regulator_suspend_disable\s*\(\s*(?P<reg>[^,]+)\s*,\s*(?P<state>[^)]+)\s*\)'
      description: "配置挂起时禁用"
      context: "process"
      can_sleep: true


# ============================================================
# REGULATOR OPERATING MODES
# ============================================================

regulator_modes:
  description: "Regulator Operating Modes - 稳压器工作模式"
  header: "linux/regulator/consumer.h"

  constants:
    REGULATOR_MODE_FAST:
      value: 0x1
      description: "快速模式 - 高性能，高功耗"
    REGULATOR_MODE_NORMAL:
      value: 0x2
      description: "正常模式 - 平衡性能和功耗"
    REGULATOR_MODE_IDLE:
      value: 0x4
      description: "空闲模式 - 低负载优化"
    REGULATOR_MODE_STANDBY:
      value: 0x8
      description: "待机模式 - 最低功耗"


# ============================================================
# REGULATOR STATUS
# ============================================================

regulator_status:
  description: "Regulator Status - 稳压器状态"
  header: "linux/regulator/consumer.h"

  constants:
    REGULATOR_STATUS_OFF:
      description: "稳压器关闭"
    REGULATOR_STATUS_ON:
      description: "稳压器开启，运行正常"
    REGULATOR_STATUS_ERROR:
      description: "稳压器错误状态"
    REGULATOR_STATUS_FAST:
      description: "快速模式运行中"
    REGULATOR_STATUS_NORMAL:
      description: "正常模式运行中"
    REGULATOR_STATUS_IDLE:
      description: "空闲模式运行中"
    REGULATOR_STATUS_STANDBY:
      description: "待机模式运行中"
    REGULATOR_STATUS_BYPASS:
      description: "旁路模式"
    REGULATOR_STATUS_UNDEFINED:
      description: "状态未定义"


# ============================================================
# REGULATOR DRIVER API
# ============================================================

regulator_driver:
  description: "Regulator Driver API - 稳压器驱动接口"
  header: "linux/regulator/driver.h"
  icon: "🏭"
  kernel_version: "2.6.27+"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  registration:
    - pattern: 'regulator_register\s*\(\s*(?P<desc>[^,]+)\s*,\s*(?P<config>[^)]+)\s*\)'
      description: "注册稳压器"
      context: "process"
      can_sleep: true
      return_value:
        success: "struct regulator_dev *"
        failure: "ERR_PTR(-ERRNO)"
    - pattern: 'devm_regulator_register\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<desc>[^,]+)\s*,\s*(?P<config>[^)]+)\s*\)'
      description: "设备管理的稳压器注册"
      context: "process"
      can_sleep: true
    - pattern: 'regulator_unregister\s*\(\s*(?P<rdev>[^)]+)\s*\)'
      description: "注销稳压器"
      context: "process"
      can_sleep: true


# ============================================================
# REGULATOR DESCRIPTOR (struct regulator_desc)
# ============================================================

regulator_desc:
  description: "Regulator Descriptor - 稳压器描述符结构体"
  header: "linux/regulator/driver.h"

  structure:
    pattern: 'static\s+(?:const\s+)?struct\s+regulator_desc\s+(?P<name>\w+)\s*=\s*\{'
    description: "稳压器描述符定义"

  fields:
    # 基本信息
    - name: "name"
      type: "const char *"
      description: "稳压器名称（用于 sysfs 和调试）"
    - name: "supply_name"
      type: "const char *"
      description: "父级供电稳压器名称"
    - name: "of_match"
      type: "const char *"
      description: "设备树匹配名称"
    - name: "regulators_node"
      type: "const char *"
      description: "设备树 regulators 子节点名称"
    - name: "id"
      type: "int"
      description: "稳压器 ID（用于多路稳压器芯片）"
    - name: "ops"
      type: "const struct regulator_ops *"
      description: "操作函数指针"
    - name: "type"
      type: "enum regulator_type"
      description: "稳压器类型 (REGULATOR_VOLTAGE/REGULATOR_CURRENT)"
    - name: "owner"
      type: "struct module *"
      description: "模块所有者"

    # 电压配置
    - name: "n_voltages"
      type: "unsigned int"
      description: "支持的电压级数"
    - name: "min_uV"
      type: "unsigned int"
      description: "最小输出电压 (uV)"
    - name: "uV_step"
      type: "unsigned int"
      description: "电压步进值 (uV)"
    - name: "linear_min_sel"
      type: "unsigned int"
      description: "线性范围最小选择器值"
    - name: "fixed_uV"
      type: "int"
      description: "固定电压值 (uV)"
    - name: "ramp_delay"
      type: "unsigned int"
      description: "电压变化斜率延迟 (uV/us)"
    - name: "min_dropout_uV"
      type: "int"
      description: "最小压降 (uV)"

    # 线性范围
    - name: "linear_ranges"
      type: "const struct regulator_linear_range *"
      description: "线性电压范围数组"
    - name: "n_linear_ranges"
      type: "int"
      description: "线性范围数量"

    # 电压表
    - name: "volt_table"
      type: "const unsigned int *"
      description: "离散电压值表"

    # 寄存器映射
    - name: "vsel_reg"
      type: "unsigned int"
      description: "电压选择寄存器"
    - name: "vsel_mask"
      type: "unsigned int"
      description: "电压选择掩码"
    - name: "csel_reg"
      type: "unsigned int"
      description: "电流选择寄存器"
    - name: "csel_mask"
      type: "unsigned int"
      description: "电流选择掩码"
    - name: "apply_reg"
      type: "unsigned int"
      description: "应用寄存器"
    - name: "apply_bit"
      type: "unsigned int"
      description: "应用位"
    - name: "enable_reg"
      type: "unsigned int"
      description: "使能寄存器"
    - name: "enable_mask"
      type: "unsigned int"
      description: "使能掩码"
    - name: "enable_val"
      type: "unsigned int"
      description: "使能值"
    - name: "disable_val"
      type: "unsigned int"
      description: "禁用值"
    - name: "enable_is_inverted"
      type: "bool"
      description: "使能逻辑是否反转"

    # 旁路控制
    - name: "bypass_reg"
      type: "unsigned int"
      description: "旁路寄存器"
    - name: "bypass_mask"
      type: "unsigned int"
      description: "旁路掩码"
    - name: "bypass_val_on"
      type: "unsigned int"
      description: "旁路开启值"
    - name: "bypass_val_off"
      type: "unsigned int"
      description: "旁路关闭值"

    # 主动放电
    - name: "active_discharge_reg"
      type: "unsigned int"
      description: "主动放电寄存器"
    - name: "active_discharge_mask"
      type: "unsigned int"
      description: "主动放电掩码"
    - name: "active_discharge_on"
      type: "unsigned int"
      description: "主动放电开启值"
    - name: "active_discharge_off"
      type: "unsigned int"
      description: "主动放电关闭值"

    # 软启动
    - name: "soft_start_reg"
      type: "unsigned int"
      description: "软启动寄存器"
    - name: "soft_start_mask"
      type: "unsigned int"
      description: "软启动掩码"
    - name: "soft_start_val_on"
      type: "unsigned int"
      description: "软启动开启值"

    # 下拉控制
    - name: "pull_down_reg"
      type: "unsigned int"
      description: "下拉寄存器"
    - name: "pull_down_mask"
      type: "unsigned int"
      description: "下拉掩码"
    - name: "pull_down_val_on"
      type: "unsigned int"
      description: "下拉开启值"


# ============================================================
# REGULATOR OPS (struct regulator_ops)
# ============================================================

regulator_ops:
  description: "Regulator Operations - 稳压器操作函数"
  header: "linux/regulator/driver.h"

  structure:
    pattern: 'static\s+(?:const\s+)?struct\s+regulator_ops\s+(?P<name>\w+)\s*=\s*\{'
    description: "稳压器操作结构体定义"

  callbacks:
    # 电压枚举
    list_voltage:
      pattern: '\.list_voltage\s*=\s*(?P<handler>\w+)'
      description: "枚举支持的电压"
      signature: "int (*)(struct regulator_dev *rdev, unsigned selector)"
      context: "process"
      can_sleep: true
      return_value:
        success: "电压值 (uV)"
        failure: "-EINVAL"
      typical_actions:
        - "根据 selector 返回对应电压"
        - "可使用 regulator_list_voltage_linear 等辅助函数"

    # 电压控制
    set_voltage:
      pattern: '\.set_voltage\s*=\s*(?P<handler>\w+)'
      description: "设置输出电压（旧接口）"
      signature: "int (*)(struct regulator_dev *rdev, int min_uV, int max_uV, unsigned *selector)"
      context: "process"
      can_sleep: true
      return_value:
        success: "0"
        failure: "-ERRNO"

    map_voltage:
      pattern: '\.map_voltage\s*=\s*(?P<handler>\w+)'
      description: "将电压映射到选择器"
      signature: "int (*)(struct regulator_dev *rdev, int min_uV, int max_uV)"
      context: "process"
      can_sleep: true

    set_voltage_sel:
      pattern: '\.set_voltage_sel\s*=\s*(?P<handler>\w+)'
      description: "通过选择器设置电压（推荐）"
      signature: "int (*)(struct regulator_dev *rdev, unsigned selector)"
      context: "process"
      can_sleep: true
      typical_actions:
        - "写入 vsel_reg 寄存器"
        - "可使用 regulator_set_voltage_sel_regmap"

    get_voltage:
      pattern: '\.get_voltage\s*=\s*(?P<handler>\w+)'
      description: "获取当前电压"
      signature: "int (*)(struct regulator_dev *rdev)"
      context: "process"
      can_sleep: true
      return_value:
        success: "当前电压 (uV)"
        failure: "-ERRNO"

    get_voltage_sel:
      pattern: '\.get_voltage_sel\s*=\s*(?P<handler>\w+)'
      description: "获取当前电压选择器"
      signature: "int (*)(struct regulator_dev *rdev)"
      context: "process"
      can_sleep: true

    # 电流控制
    set_current_limit:
      pattern: '\.set_current_limit\s*=\s*(?P<handler>\w+)'
      description: "设置电流限制"
      signature: "int (*)(struct regulator_dev *rdev, int min_uA, int max_uA)"
      context: "process"
      can_sleep: true

    get_current_limit:
      pattern: '\.get_current_limit\s*=\s*(?P<handler>\w+)'
      description: "获取电流限制"
      signature: "int (*)(struct regulator_dev *rdev)"
      context: "process"
      can_sleep: true

    set_input_current_limit:
      pattern: '\.set_input_current_limit\s*=\s*(?P<handler>\w+)'
      description: "设置输入电流限制"
      signature: "int (*)(struct regulator_dev *rdev, int lim_uA)"
      context: "process"
      can_sleep: true

    set_over_current_protection:
      pattern: '\.set_over_current_protection\s*=\s*(?P<handler>\w+)'
      description: "设置过流保护"
      signature: "int (*)(struct regulator_dev *rdev)"
      context: "process"
      can_sleep: true

    # 使能/禁用
    enable:
      pattern: '\.enable\s*=\s*(?P<handler>\w+)'
      description: "使能稳压器输出"
      signature: "int (*)(struct regulator_dev *rdev)"
      context: "process"
      can_sleep: true
      return_value:
        success: "0"
        failure: "-ERRNO"
      typical_actions:
        - "设置 enable_reg 中的 enable_mask 位"
        - "可使用 regulator_enable_regmap"

    disable:
      pattern: '\.disable\s*=\s*(?P<handler>\w+)'
      description: "禁用稳压器输出"
      signature: "int (*)(struct regulator_dev *rdev)"
      context: "process"
      can_sleep: true
      typical_actions:
        - "清除 enable_reg 中的 enable_mask 位"
        - "可使用 regulator_disable_regmap"

    is_enabled:
      pattern: '\.is_enabled\s*=\s*(?P<handler>\w+)'
      description: "检查稳压器是否使能"
      signature: "int (*)(struct regulator_dev *rdev)"
      context: "process"
      can_sleep: true
      return_value:
        enabled: "1"
        disabled: "0"
        error: "<0"
      typical_actions:
        - "读取 enable_reg 检查 enable_mask"
        - "可使用 regulator_is_enabled_regmap"

    # 模式控制
    set_mode:
      pattern: '\.set_mode\s*=\s*(?P<handler>\w+)'
      description: "设置工作模式"
      signature: "int (*)(struct regulator_dev *rdev, unsigned int mode)"
      context: "process"
      can_sleep: true

    get_mode:
      pattern: '\.get_mode\s*=\s*(?P<handler>\w+)'
      description: "获取当前工作模式"
      signature: "unsigned int (*)(struct regulator_dev *rdev)"
      context: "process"
      can_sleep: true

    get_optimum_mode:
      pattern: '\.get_optimum_mode\s*=\s*(?P<handler>\w+)'
      description: "获取最优工作模式"
      signature: "unsigned int (*)(struct regulator_dev *rdev, int input_uV, int output_uV, int load_uA)"
      context: "process"
      can_sleep: true

    # 负载控制
    set_load:
      pattern: '\.set_load\s*=\s*(?P<handler>\w+)'
      description: "设置负载电流"
      signature: "int (*)(struct regulator_dev *rdev, int load_uA)"
      context: "process"
      can_sleep: true

    # 状态
    get_status:
      pattern: '\.get_status\s*=\s*(?P<handler>\w+)'
      description: "获取稳压器状态"
      signature: "int (*)(struct regulator_dev *rdev)"
      context: "process"
      can_sleep: true
      return_value:
        success: "REGULATOR_STATUS_*"
        failure: "-ERRNO"

    get_error_flags:
      pattern: '\.get_error_flags\s*=\s*(?P<handler>\w+)'
      description: "获取错误标志"
      signature: "int (*)(struct regulator_dev *rdev, unsigned int *flags)"
      context: "process"
      can_sleep: true

    # 时序
    enable_time:
      pattern: '\.enable_time\s*=\s*(?P<handler>\w+)'
      description: "获取使能所需时间"
      signature: "int (*)(struct regulator_dev *rdev)"
      context: "process"
      can_sleep: false
      return_value:
        success: "时间 (us)"
        failure: "<0"

    set_ramp_delay:
      pattern: '\.set_ramp_delay\s*=\s*(?P<handler>\w+)'
      description: "设置电压斜率延迟"
      signature: "int (*)(struct regulator_dev *rdev, int ramp_delay)"
      context: "process"
      can_sleep: true

    set_voltage_time:
      pattern: '\.set_voltage_time\s*=\s*(?P<handler>\w+)'
      description: "获取电压切换时间"
      signature: "int (*)(struct regulator_dev *rdev, int old_uV, int new_uV)"
      context: "process"
      can_sleep: false

    set_voltage_time_sel:
      pattern: '\.set_voltage_time_sel\s*=\s*(?P<handler>\w+)'
      description: "获取电压切换时间（基于选择器）"
      signature: "int (*)(struct regulator_dev *rdev, unsigned old_sel, unsigned new_sel)"
      context: "process"
      can_sleep: false

    # 软启动
    set_soft_start:
      pattern: '\.set_soft_start\s*=\s*(?P<handler>\w+)'
      description: "使能软启动"
      signature: "int (*)(struct regulator_dev *rdev)"
      context: "process"
      can_sleep: true

    # 旁路控制
    set_bypass:
      pattern: '\.set_bypass\s*=\s*(?P<handler>\w+)'
      description: "设置旁路模式"
      signature: "int (*)(struct regulator_dev *rdev, bool enable)"
      context: "process"
      can_sleep: true

    get_bypass:
      pattern: '\.get_bypass\s*=\s*(?P<handler>\w+)'
      description: "获取旁路状态"
      signature: "int (*)(struct regulator_dev *rdev, bool *enable)"
      context: "process"
      can_sleep: true

    # 主动放电
    set_active_discharge:
      pattern: '\.set_active_discharge\s*=\s*(?P<handler>\w+)'
      description: "设置主动放电"
      signature: "int (*)(struct regulator_dev *rdev, bool enable)"
      context: "process"
      can_sleep: true

    # 下拉控制
    set_pull_down:
      pattern: '\.set_pull_down\s*=\s*(?P<handler>\w+)'
      description: "设置下拉电阻"
      signature: "int (*)(struct regulator_dev *rdev)"
      context: "process"
      can_sleep: true



# ============================================================
# CALL CHAINS
# ============================================================

call_chains:
  regulator_enable_flow:
    description: "稳压器使能调用链"
    trigger: "消费者调用 regulator_enable()"
    chain:
      - function: "regulator_enable"
        file: "drivers/regulator/core.c"
        description: "消费者 API 入口"
        context: "process"
      - function: "_regulator_enable"
        file: "drivers/regulator/core.c"
        description: "内部使能实现"
      - function: "_regulator_do_enable"
        file: "drivers/regulator/core.c"
        description: "执行实际使能操作"
      - function: "rdev->desc->ops->enable"
        file: "驱动代码"
        description: "调用驱动使能回调"
        is_user_entry: true
      - function: "_regulator_enable_delay"
        file: "drivers/regulator/core.c"
        description: "等待使能完成"

  regulator_set_voltage_flow:
    description: "稳压器电压设置调用链"
    trigger: "消费者调用 regulator_set_voltage()"
    chain:
      - function: "regulator_set_voltage"
        file: "drivers/regulator/core.c"
        description: "消费者 API 入口"
        context: "process"
      - function: "regulator_set_voltage_unlocked"
        file: "drivers/regulator/core.c"
        description: "无锁设置电压"
      - function: "_regulator_do_set_voltage"
        file: "drivers/regulator/core.c"
        description: "执行设置电压"
      - function: "rdev->desc->ops->set_voltage_sel"
        file: "驱动代码"
        description: "调用驱动设置电压回调"
        is_user_entry: true

  regulator_register_flow:
    description: "稳压器注册调用链"
    trigger: "驱动调用 regulator_register()"
    chain:
      - function: "regulator_register"
        file: "drivers/regulator/core.c"
        description: "注册 API 入口"
        context: "process"
      - function: "regulator_dev_lookup"
        file: "drivers/regulator/core.c"
        description: "查找现有稳压器"
      - function: "set_machine_constraints"
        file: "drivers/regulator/core.c"
        description: "应用约束配置"
      - function: "set_supply"
        file: "drivers/regulator/core.c"
        description: "设置供电链"
      - function: "device_register"
        file: "drivers/base/core.c"
        description: "注册设备"


# ============================================================
# EXAMPLES
# ============================================================

examples:
  - description: "消费者基本使用"
    kernel_version: "4.0+"
    code: |
      #include <linux/regulator/consumer.h>
      
      static struct regulator *vdd;
      
      static int my_probe(struct platform_device *pdev)
      {
          int ret;
          
          /* 获取稳压器 */
          vdd = devm_regulator_get(&pdev->dev, "vdd");
          if (IS_ERR(vdd)) {
              dev_err(&pdev->dev, "Failed to get vdd regulator\n");
              return PTR_ERR(vdd);
          }
          
          /* 设置电压 (1.2V - 1.3V) */
          ret = regulator_set_voltage(vdd, 1200000, 1300000);
          if (ret) {
              dev_err(&pdev->dev, "Failed to set voltage\n");
              return ret;
          }
          
          /* 使能稳压器 */
          ret = regulator_enable(vdd);
          if (ret) {
              dev_err(&pdev->dev, "Failed to enable regulator\n");
              return ret;
          }
          
          dev_info(&pdev->dev, "Voltage: %d uV\n",
                   regulator_get_voltage(vdd));
          
          return 0;
      }
      
      static int my_remove(struct platform_device *pdev)
      {
          regulator_disable(vdd);
          return 0;
      }

  - description: "批量稳压器操作"
    kernel_version: "4.0+"
    code: |
      #include <linux/regulator/consumer.h>
      
      static struct regulator_bulk_data supplies[] = {
          { .supply = "vcc" },
          { .supply = "vdd" },
          { .supply = "vio" },
      };
      
      static int my_probe(struct platform_device *pdev)
      {
          int ret;
          
          /* 批量获取稳压器 */
          ret = devm_regulator_bulk_get(&pdev->dev,
                                        ARRAY_SIZE(supplies),
                                        supplies);
          if (ret) {
              dev_err(&pdev->dev, "Failed to get regulators\n");
              return ret;
          }
          
          /* 批量使能 */
          ret = regulator_bulk_enable(ARRAY_SIZE(supplies), supplies);
          if (ret) {
              dev_err(&pdev->dev, "Failed to enable regulators\n");
              return ret;
          }
          
          return 0;
      }
      
      static int my_remove(struct platform_device *pdev)
      {
          regulator_bulk_disable(ARRAY_SIZE(supplies), supplies);
          return 0;
      }

  - description: "稳压器驱动实现"
    kernel_version: "4.0+"
    code: |
      #include <linux/regulator/driver.h>
      #include <linux/regmap.h>
      
      #define MY_REG_ENABLE     0x00
      #define MY_REG_VSEL       0x01
      
      static const struct regulator_ops my_reg_ops = {
          .enable         = regulator_enable_regmap,
          .disable        = regulator_disable_regmap,
          .is_enabled     = regulator_is_enabled_regmap,
          .list_voltage   = regulator_list_voltage_linear,
          .map_voltage    = regulator_map_voltage_linear,
          .set_voltage_sel = regulator_set_voltage_sel_regmap,
          .get_voltage_sel = regulator_get_voltage_sel_regmap,
      };
      
      static const struct regulator_desc my_reg_desc = {
          .name           = "my-regulator",
          .id             = 0,
          .ops            = &my_reg_ops,
          .type           = REGULATOR_VOLTAGE,
          .owner          = THIS_MODULE,
          .n_voltages     = 64,
          .min_uV         = 600000,
          .uV_step        = 12500,
          .vsel_reg       = MY_REG_VSEL,
          .vsel_mask      = 0x3F,
          .enable_reg     = MY_REG_ENABLE,
          .enable_mask    = BIT(0),
          .enable_val     = BIT(0),
          .disable_val    = 0,
      };
      
      static int my_reg_probe(struct i2c_client *client)
      {
          struct regmap *regmap;
          struct regulator_config config = {};
          struct regulator_dev *rdev;
          
          regmap = devm_regmap_init_i2c(client, &my_regmap_config);
          if (IS_ERR(regmap))
              return PTR_ERR(regmap);
          
          config.dev = &client->dev;
          config.regmap = regmap;
          config.of_node = client->dev.of_node;
          
          rdev = devm_regulator_register(&client->dev,
                                         &my_reg_desc, &config);
          if (IS_ERR(rdev)) {
              dev_err(&client->dev, "Failed to register regulator\n");
              return PTR_ERR(rdev);
          }
          
          return 0;
      }

  - description: "设备树配置示例"
    kernel_version: "4.0+"
    code: |

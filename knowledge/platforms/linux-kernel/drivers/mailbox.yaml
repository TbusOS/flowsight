# ADVANCED DATA STRUCTURES
# ============================================================

advanced_data_structures:
  mbox_client:
    pattern: 'struct mbox_client\s*\{'
    description: "邮箱客户端结构"
    file: "include/linux/mailbox_client.h"
    fields:
      - name: "dev"
        type: "struct device *"
        description: "关联设备"
      - name: "tx_block"
        type: "bool"
        description: "发送是否阻塞"
      - name: "tx_tout"
        type: "unsigned long"
        description: "发送超时(毫秒)"
      - name: "knows_txdone"
        type: "bool"
        description: "客户端是否知道发送完成"
      - name: "rx_callback"
        type: "void (*)(struct mbox_client *, void *)"
        description: "接收回调"
      - name: "tx_done"
        type: "void (*)(struct mbox_client *, void *, int)"
        description: "发送完成回调"
      - name: "tx_prepare"
        type: "void (*)(struct mbox_client *, void *)"
        description: "发送准备回调"

  mbox_chan_ops:
    pattern: 'struct mbox_chan_ops\s*\{'
    description: "邮箱通道操作结构"
    file: "include/linux/mailbox_controller.h"
    fields:
      - name: "send_data"
        type: "int (*)(struct mbox_chan *, void *)"
        description: "发送数据"
      - name: "startup"
        type: "int (*)(struct mbox_chan *)"
        description: "启动通道"
      - name: "shutdown"
        type: "void (*)(struct mbox_chan *)"
        description: "关闭通道"
      - name: "last_tx_done"
        type: "bool (*)(struct mbox_chan *)"
        description: "检查上次发送完成"
      - name: "peek_data"
        type: "bool (*)(struct mbox_chan *)"
        description: "检查是否有数据"

  mbox_message:
    description: "邮箱消息格式（硬件相关）"
    typical_fields:
      - name: "command"
        description: "命令/消息类型"
      - name: "data"
        description: "消息数据"
      - name: "response"
        description: "响应数据"
      - name: "status"
        description: "状态码"


# ============================================================
# TXDONE NOTIFICATION MODES
# ============================================================

txdone_modes:
  description: "发送完成通知模式"
  modes:
    irq_mode:
      description: "中断通知模式"
      config: "mbox->txdone_irq = true"
      trigger: "mbox_chan_txdone()"
      context: "hardirq"
      usage: |
        适用于：
        - 硬件支持发送完成中断
        - 需要精确的发送完成通知
        - 低延迟要求

    poll_mode:
      description: "轮询模式"
      config: "mbox->txdone_poll = true"
      period: "mbox->txpoll_period"
      callback: "ops->last_tx_done()"
      context: "timer softirq"
      usage: |
        适用于：
        - 硬件不支持发送完成中断
        - 简单的邮箱实现
        - 发送完成状态可查询

    ack_mode:
      description: "客户端确认模式"
      config: "client->knows_txdone = true"
      trigger: "mbox_client_txdone()"
      context: "客户端决定"
      usage: |
        适用于：
        - 客户端知道何时发送完成
        - 协议层面的确认机制
        - 响应消息触发完成


# ============================================================
# ADVANCED CALL CHAINS
# ============================================================

advanced_call_chains:
  poll_txdone:
    description: "轮询模式发送完成流程"
    chain:
      - caller: "client driver"
        callee: "mbox_send_message"
        description: "发送消息"
      - caller: "mbox_send_message"
        callee: "chan->mbox->ops->send_data"
        description: "调用控制器发送"
      - caller: "定时器到期"
        callee: "txdone_hrtimer"
        context: "hrtimer softirq"
        description: "轮询定时器"
      - caller: "txdone_hrtimer"
        callee: "ops->last_tx_done"
        description: "检查发送是否完成"
      - caller: "txdone_hrtimer"
        callee: "tx_tick"
        description: "处理完成的发送"
      - caller: "tx_tick"
        callee: "client->tx_done"
        description: "通知客户端"

  doorbell_signal:
    description: "Doorbell 信号流程"
    chain:
      - caller: "client driver"
        callee: "mbox_send_message(chan, NULL)"
        description: "发送 doorbell 信号"
      - caller: "mbox_send_message"
        callee: "ops->send_data"
        description: "触发 doorbell"
      - caller: "send_data"
        callee: "writel(DOORBELL_SET)"
        description: "写寄存器触发中断"
      - caller: "远端处理完成"
        callee: "doorbell_irq_handler"
        context: "hardirq"
        description: "收到响应"
      - caller: "doorbell_irq_handler"
        callee: "mbox_chan_received_data(chan, NULL)"
        description: "通知客户端"

  bidirectional_comm:
    description: "双向通信流程"
    chain:
      - caller: "client A"
        callee: "mbox_send_message"
        description: "A 发送请求"
      - caller: "controller"
        callee: "write to TX register"
        description: "写发送寄存器"
      - caller: "remote CPU (B)"
        callee: "process request"
        description: "B 处理请求"
      - caller: "remote CPU (B)"
        callee: "write response to B's TX"
        description: "B 发送响应"
      - caller: "A's IRQ handler"
        callee: "mbox_chan_received_data"
        context: "hardirq"
        description: "A 收到响应"



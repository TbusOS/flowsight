# Mailbox Framework Knowledge Base
# Reference: https://www.kernel.org/doc/html/latest/driver-api/mailbox.html

# ============================================================
# MAILBOX CONTROLLER
# ============================================================
mbox_controller:
  description: "Mailbox Controller Driver"
  header: "linux/mailbox_controller.h"
  icon: "📬"
  kernel_version: "3.18+"
  registration:
    - pattern: 'devm_mbox_controller_register\s*\(\s*(?P<dev>\w+)\s*,\s*(?P<mbox>\w+)\s*\)'
      description: "托管注册邮箱控制器"
    - pattern: 'mbox_controller_register\s*\(\s*(?P<mbox>\w+)\s*\)'
      description: "注册邮箱控制器"
  unregistration:
    - pattern: 'mbox_controller_unregister\s*\(\s*(?P<mbox>\w+)\s*\)'
      description: "注销邮箱控制器"
  structure:
    name: "mbox_chan_ops"
    callbacks:
      send_data:
        pattern: '\.send_data\s*=\s*(?P<handler>\w+)'
        description: "发送数据"
        context: "process/atomic"
        can_sleep: false
      startup:
        pattern: '\.startup\s*=\s*(?P<handler>\w+)'
        description: "启动通道"
        context: "process"
        can_sleep: true
      shutdown:
        pattern: '\.shutdown\s*=\s*(?P<handler>\w+)'
        description: "关闭通道"
        context: "process"
        can_sleep: true
      last_tx_done:
        pattern: '\.last_tx_done\s*=\s*(?P<handler>\w+)'
        description: "检查上次发送是否完成"
        context: "any"
        can_sleep: false
      peek_data:
        pattern: '\.peek_data\s*=\s*(?P<handler>\w+)'
        description: "检查是否有数据"
        context: "any"
        can_sleep: false
  helpers:
    - pattern: 'mbox_chan_received_data\s*\(\s*(?P<chan>\w+)\s*,\s*(?P<data>\w+)\s*\)'
      description: "通知接收到数据"
    - pattern: 'mbox_chan_txdone\s*\(\s*(?P<chan>\w+)\s*,\s*(?P<r>\w+)\s*\)'
      description: "通知发送完成"

# ============================================================
# MAILBOX CLIENT
# ============================================================
mbox_client:
  description: "Mailbox Client"
  header: "linux/mailbox_client.h"
  icon: "📨"
  usage:
    - pattern: 'mbox_request_channel\s*\(\s*&(?P<client>\w+)\s*,\s*(?P<index>\w+)\s*\)'
      description: "请求邮箱通道"
    - pattern: 'mbox_request_channel_byname\s*\(\s*&(?P<client>\w+)\s*,'
      description: "按名称请求通道"
    - pattern: 'mbox_free_channel\s*\(\s*(?P<chan>\w+)\s*\)'
      description: "释放邮箱通道"
    - pattern: 'mbox_send_message\s*\(\s*(?P<chan>\w+)\s*,\s*(?P<data>\w+)\s*\)'
      description: "发送消息"
    - pattern: 'mbox_client_txdone\s*\(\s*(?P<chan>\w+)\s*,\s*(?P<r>\w+)\s*\)'
      description: "客户端发送完成"
  structure:
    name: "mbox_client"
    callbacks:
      rx_callback:
        pattern: '\.rx_callback\s*=\s*(?P<handler>\w+)'
        description: "接收回调"
        context: "process/softirq"
        can_sleep: false
      tx_done:
        pattern: '\.tx_done\s*=\s*(?P<handler>\w+)'
        description: "发送完成回调"
        context: "process/softirq"
        can_sleep: false
      tx_block:
        description: "发送是否阻塞"
      tx_tout:
        description: "发送超时（毫秒）"
      knows_txdone:
        description: "客户端是否知道发送完成"

# ============================================================
# CALL CHAINS
# ============================================================
call_chains:
  mbox_send:
    description: "Mailbox Send Flow"
    chain:
      - caller: "client driver"
        callee: "mbox_send_message"
        description: "发送消息"
      - caller: "mbox_send_message"
        callee: "chan->mbox->ops->send_data"
        description: "调用控制器发送"
      - caller: "IRQ handler"
        callee: "mbox_chan_txdone"
        context: "hardirq"
        description: "发送完成中断"
      - caller: "mbox_chan_txdone"
        callee: "client->tx_done"
        description: "通知客户端"
  mbox_receive:
    description: "Mailbox Receive Flow"
    chain:
      - caller: "IRQ handler"
        callee: "mbox_chan_received_data"
        context: "hardirq"
        description: "接收中断"
      - caller: "mbox_chan_received_data"
        callee: "client->rx_callback"
        description: "调用客户端接收回调"


# ============================================================
# DATA STRUCTURES
# ============================================================

data_structures:
  mbox_controller:
    pattern: 'struct mbox_controller\s*\{'
    description: "邮箱控制器结构"
    file: "include/linux/mailbox_controller.h"
    fields:
      - name: "dev"
        type: "struct device *"
        description: "关联设备"
      - name: "ops"
        type: "const struct mbox_chan_ops *"
        description: "通道操作"
      - name: "chans"
        type: "struct mbox_chan *"
        description: "通道数组"
      - name: "num_chans"
        type: "int"
        description: "通道数量"
      - name: "txdone_irq"
        type: "bool"
        description: "中断通知发送完成"
      - name: "txdone_poll"
        type: "bool"
        description: "轮询发送完成"
      - name: "txpoll_period"
        type: "unsigned int"
        description: "轮询周期"
      - name: "of_xlate"
        type: "callback"
        description: "DT 解析回调"

  mbox_chan:
    pattern: 'struct mbox_chan\s*\{'
    description: "邮箱通道结构"
    file: "include/linux/mailbox_controller.h"
    fields:
      - name: "mbox"
        type: "struct mbox_controller *"
        description: "所属控制器"
      - name: "txdone_method"
        type: "unsigned int"
        description: "完成通知方式"
      - name: "cl"
        type: "struct mbox_client *"
        description: "关联客户端"
      - name: "active_req"
        type: "void *"
        description: "当前请求"
      - name: "msg_count"
        type: "unsigned int"
        description: "待处理消息数"
      - name: "msg_free"
        type: "unsigned int"
        description: "空闲槽数"
      - name: "con_priv"
        type: "void *"
        description: "控制器私有数据"


# ============================================================
# EXAMPLES
# ============================================================

examples:
  - description: "邮箱控制器驱动示例"
    kernel_version: "5.0+"
    code: |
      #include <linux/module.h>
      #include <linux/mailbox_controller.h>
      #include <linux/platform_device.h>
      
      #define MBOX_NUM_CHANS  4
      
      struct my_mbox {
          struct mbox_controller mbox;
          struct mbox_chan chans[MBOX_NUM_CHANS];
          void __iomem *regs;
      };
      
      static int my_mbox_send_data(struct mbox_chan *chan, void *data)
      {
          struct my_mbox *mbox = container_of(chan->mbox,
                                               struct my_mbox, mbox);
          u32 *msg = data;
          
          /* 写入硬件寄存器 */
          writel(*msg, mbox->regs + MBOX_TX_REG(chan->con_priv));
          
          return 0;
      }
      
      static int my_mbox_startup(struct mbox_chan *chan)
      {
          /* 启用通道中断 */
          return 0;
      }
      
      static void my_mbox_shutdown(struct mbox_chan *chan)
      {
          /* 禁用通道中断 */
      }
      
      static bool my_mbox_last_tx_done(struct mbox_chan *chan)
      {
          struct my_mbox *mbox = container_of(chan->mbox,
                                               struct my_mbox, mbox);
          return !(readl(mbox->regs + MBOX_STATUS) & TX_BUSY);
      }
      
      static const struct mbox_chan_ops my_mbox_ops = {
          .send_data    = my_mbox_send_data,
          .startup      = my_mbox_startup,
          .shutdown     = my_mbox_shutdown,
          .last_tx_done = my_mbox_last_tx_done,
      };
      
      static irqreturn_t my_mbox_irq(int irq, void *data)
      {
          struct my_mbox *mbox = data;
          u32 status = readl(mbox->regs + MBOX_INT_STATUS);
          int i;
          
          for (i = 0; i < MBOX_NUM_CHANS; i++) {
              if (status & RX_PENDING(i)) {
                  u32 msg = readl(mbox->regs + MBOX_RX_REG(i));
                  mbox_chan_received_data(&mbox->chans[i], &msg);
              }
              if (status & TX_DONE(i)) {
                  mbox_chan_txdone(&mbox->chans[i], 0);
              }
          }
          
          writel(status, mbox->regs + MBOX_INT_CLEAR);
          return IRQ_HANDLED;
      }
      
      static int my_mbox_probe(struct platform_device *pdev)
      {
          struct my_mbox *mbox;
          int i, ret;
          
          mbox = devm_kzalloc(&pdev->dev, sizeof(*mbox), GFP_KERNEL);
          if (!mbox)
              return -ENOMEM;
          
          mbox->regs = devm_platform_ioremap_resource(pdev, 0);
          if (IS_ERR(mbox->regs))
              return PTR_ERR(mbox->regs);
          
          for (i = 0; i < MBOX_NUM_CHANS; i++)
              mbox->chans[i].con_priv = (void *)(uintptr_t)i;
          
          mbox->mbox.dev = &pdev->dev;
          mbox->mbox.ops = &my_mbox_ops;
          mbox->mbox.chans = mbox->chans;
          mbox->mbox.num_chans = MBOX_NUM_CHANS;
          mbox->mbox.txdone_irq = true;
          
          ret = devm_mbox_controller_register(&pdev->dev, &mbox->mbox);
          if (ret)
              return ret;
          
          return devm_request_irq(&pdev->dev, platform_get_irq(pdev, 0),
                                  my_mbox_irq, 0, "my-mbox", mbox);
      }

  - description: "邮箱客户端示例"
    kernel_version: "5.0+"
    code: |
      #include <linux/mailbox_client.h>
      
      struct my_client {
          struct mbox_client cl;
          struct mbox_chan *chan;
          struct completion done;
      };
      
      static void my_rx_callback(struct mbox_client *cl, void *data)
      {
          struct my_client *priv = container_of(cl, struct my_client, cl);
          u32 *msg = data;
          
          pr_info("Received: 0x%08x\n", *msg);
          complete(&priv->done);
      }
      
      static int my_client_probe(struct platform_device *pdev)
      {
          struct my_client *priv;
          u32 msg = 0x12345678;
          
          priv = devm_kzalloc(&pdev->dev, sizeof(*priv), GFP_KERNEL);
          if (!priv)
              return -ENOMEM;
          
          init_completion(&priv->done);
          
          priv->cl.dev = &pdev->dev;
          priv->cl.rx_callback = my_rx_callback;
          priv->cl.tx_block = true;
          priv->cl.tx_tout = 500;
          priv->cl.knows_txdone = false;
          
          priv->chan = mbox_request_channel(&priv->cl, 0);
          if (IS_ERR(priv->chan))
              return PTR_ERR(priv->chan);
          
          /* 发送消息 */
          mbox_send_message(priv->chan, &msg);
          
          /* 等待响应 */
          wait_for_completion_timeout(&priv->done, msecs_to_jiffies(1000));
          
          platform_set_drvdata(pdev, priv);
          return 0;
      }

  - description: "轮询模式邮箱控制器示例"
    kernel_version: "5.4+"
    code: |
      #include <linux/module.h>
      #include <linux/mailbox_controller.h>
      #include <linux/platform_device.h>
      
      #define POLL_MBOX_NUM_CHANS  2
      #define POLL_PERIOD_US       100
      
      struct poll_mbox {
          struct mbox_controller mbox;
          struct mbox_chan chans[POLL_MBOX_NUM_CHANS];
          void __iomem *regs;
          struct timer_list poll_timer;
      };
      
      static int poll_mbox_send_data(struct mbox_chan *chan, void *data)
      {
          struct poll_mbox *mbox = container_of(chan->mbox,
                                                 struct poll_mbox, mbox);
          u32 *msg = data;
          int idx = (int)(uintptr_t)chan->con_priv;
          
          /* 检查发送缓冲区是否可用 */
          if (readl(mbox->regs + MBOX_TX_STATUS(idx)) & TX_BUSY)
              return -EBUSY;
          
          /* 写入数据并触发发送 */
          writel(*msg, mbox->regs + MBOX_TX_DATA(idx));
          writel(TX_TRIGGER, mbox->regs + MBOX_TX_CTRL(idx));
          
          return 0;
      }
      
      static bool poll_mbox_last_tx_done(struct mbox_chan *chan)
      {
          struct poll_mbox *mbox = container_of(chan->mbox,
                                                 struct poll_mbox, mbox);
          int idx = (int)(uintptr_t)chan->con_priv;
          
          return !(readl(mbox->regs + MBOX_TX_STATUS(idx)) & TX_BUSY);
      }
      
      static bool poll_mbox_peek_data(struct mbox_chan *chan)
      {
          struct poll_mbox *mbox = container_of(chan->mbox,
                                                 struct poll_mbox, mbox);
          int idx = (int)(uintptr_t)chan->con_priv;
          
          return readl(mbox->regs + MBOX_RX_STATUS(idx)) & RX_DATA_AVAIL;
      }
      
      static const struct mbox_chan_ops poll_mbox_ops = {
          .send_data    = poll_mbox_send_data,
          .last_tx_done = poll_mbox_last_tx_done,
          .peek_data    = poll_mbox_peek_data,
      };
      
      static int poll_mbox_probe(struct platform_device *pdev)
      {
          struct poll_mbox *mbox;
          int i, ret;
          
          mbox = devm_kzalloc(&pdev->dev, sizeof(*mbox), GFP_KERNEL);
          if (!mbox)
              return -ENOMEM;
          
          mbox->regs = devm_platform_ioremap_resource(pdev, 0);
          if (IS_ERR(mbox->regs))
              return PTR_ERR(mbox->regs);
          
          for (i = 0; i < POLL_MBOX_NUM_CHANS; i++)
              mbox->chans[i].con_priv = (void *)(uintptr_t)i;
          
          mbox->mbox.dev = &pdev->dev;
          mbox->mbox.ops = &poll_mbox_ops;
          mbox->mbox.chans = mbox->chans;
          mbox->mbox.num_chans = POLL_MBOX_NUM_CHANS;
          mbox->mbox.txdone_poll = true;          /* 启用轮询模式 */
          mbox->mbox.txpoll_period = POLL_PERIOD_US;
          
          ret = devm_mbox_controller_register(&pdev->dev, &mbox->mbox);
          if (ret)
              return ret;
          
          platform_set_drvdata(pdev, mbox);
          return 0;
      }

  - description: "Doorbell 邮箱控制器示例"
    kernel_version: "5.10+"
    code: |
      #include <linux/module.h>
      #include <linux/mailbox_controller.h>
      #include <linux/platform_device.h>
      #include <linux/interrupt.h>
      
      #define DOORBELL_NUM_CHANS  8
      
      struct doorbell_mbox {
          struct mbox_controller mbox;
          struct mbox_chan chans[DOORBELL_NUM_CHANS];
          void __iomem *regs;
          spinlock_t lock;
      };
      
      /* Doorbell 模式：只发送信号，不传输数据 */
      static int doorbell_send_signal(struct mbox_chan *chan, void *data)
      {
          struct doorbell_mbox *mbox = container_of(chan->mbox,
                                                     struct doorbell_mbox, mbox);
          int idx = (int)(uintptr_t)chan->con_priv;
          unsigned long flags;
          
          spin_lock_irqsave(&mbox->lock, flags);
          
          /* 触发 doorbell 中断到远端 */
          writel(BIT(idx), mbox->regs + DOORBELL_SET);
          
          spin_unlock_irqrestore(&mbox->lock, flags);
          
          return 0;
      }
      
      static int doorbell_startup(struct mbox_chan *chan)
      {
          struct doorbell_mbox *mbox = container_of(chan->mbox,
                                                     struct doorbell_mbox, mbox);
          int idx = (int)(uintptr_t)chan->con_priv;
          
          /* 使能该通道的中断 */
          writel(BIT(idx), mbox->regs + DOORBELL_INT_EN);
          
          return 0;
      }
      
      static void doorbell_shutdown(struct mbox_chan *chan)
      {
          struct doorbell_mbox *mbox = container_of(chan->mbox,
                                                     struct doorbell_mbox, mbox);
          int idx = (int)(uintptr_t)chan->con_priv;
          
          /* 禁用该通道的中断 */
          writel(BIT(idx), mbox->regs + DOORBELL_INT_DIS);
      }
      
      static const struct mbox_chan_ops doorbell_mbox_ops = {
          .send_data = doorbell_send_signal,
          .startup   = doorbell_startup,
          .shutdown  = doorbell_shutdown,
      };
      
      static irqreturn_t doorbell_irq_handler(int irq, void *data)
      {
          struct doorbell_mbox *mbox = data;
          u32 status = readl(mbox->regs + DOORBELL_INT_STATUS);
          int i;
          
          for (i = 0; i < DOORBELL_NUM_CHANS; i++) {
              if (status & BIT(i)) {
                  /* 清除中断 */
                  writel(BIT(i), mbox->regs + DOORBELL_INT_CLR);
                  /* 通知客户端收到信号 */
                  mbox_chan_received_data(&mbox->chans[i], NULL);
              }
          }
          
          return IRQ_HANDLED;
      }
      
      static int doorbell_mbox_probe(struct platform_device *pdev)
      {
          struct doorbell_mbox *mbox;
          int i, ret, irq;
          
          mbox = devm_kzalloc(&pdev->dev, sizeof(*mbox), GFP_KERNEL);
          if (!mbox)
              return -ENOMEM;
          
          spin_lock_init(&mbox->lock);
          
          mbox->regs = devm_platform_ioremap_resource(pdev, 0);
          if (IS_ERR(mbox->regs))
              return PTR_ERR(mbox->regs);
          
          irq = platform_get_irq(pdev, 0);
          if (irq < 0)
              return irq;
          
          for (i = 0; i < DOORBELL_NUM_CHANS; i++)
              mbox->chans[i].con_priv = (void *)(uintptr_t)i;
          
          mbox->mbox.dev = &pdev->dev;
          mbox->mbox.ops = &doorbell_mbox_ops;
          mbox->mbox.chans = mbox->chans;
          mbox->mbox.num_chans = DOORBELL_NUM_CHANS;
          mbox->mbox.txdone_irq = false;  /* Doorbell 不需要 txdone */
          
          ret = devm_mbox_controller_register(&pdev->dev, &mbox->mbox);
          if (ret)
              return ret;
          
          ret = devm_request_irq(&pdev->dev, irq, doorbell_irq_handler,
                                  0, "doorbell-mbox", mbox);
          if (ret)
              return ret;
          
          platform_set_drvdata(pdev, mbox);
          return 0;
      }



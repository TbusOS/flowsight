# ============================================================
# DEBUGGING AND TRACING
# ============================================================

debugging:
  debugfs:
    description: "DebugFS 接口"
    path: "/sys/kernel/debug/mailbox/"
    files:
      - name: "message_count"
        description: "消息计数"
      - name: "state"
        description: "通道状态"

  tracepoints:
    description: "Mailbox 跟踪点"
    events:
      - name: "mbox:mbox_send"
        description: "发送消息"
        fields: "chan, msg"
      - name: "mbox:mbox_recv"
        description: "接收消息"
        fields: "chan, msg"

  common_issues:
    timeout:
      symptom: "mbox_send_message 返回 -ETIME"
      causes:
        - "远端未响应"
        - "中断未正确配置"
        - "硬件问题"
      debug: |
        1. 检查远端是否正常运行
        2. 验证中断配置
        3. 查看硬件状态寄存器

    busy:
      symptom: "mbox_send_message 返回 -EBUSY"
      causes:
        - "上一次发送未完成"
        - "消息队列满"
      debug: |
        1. 检查 txdone 通知是否正常
        2. 确认 last_tx_done 实现正确
        3. 增加重试机制

# ============================================================
# SCMI INTEGRATION
# ============================================================

scmi_mailbox:
  description: "SCMI (System Control and Management Interface) 与 Mailbox 集成"
  header: "include/linux/scmi_protocol.h"
  
  architecture:
    description: |
      SCMI 使用 Mailbox 作为传输层与固件通信：
      
      ┌─────────────────┐
      │  SCMI Protocol  │  (电源/时钟/传感器等协议)
      ├─────────────────┤
      │ SCMI Transport  │  (消息封装/解析)
      ├─────────────────┤
      │ Mailbox Client  │  (通道请求/消息发送)
      ├─────────────────┤
      │ Mailbox Core    │  (通道管理)
      ├─────────────────┤
      │ Mailbox Ctrl    │  (硬件操作)
      └─────────────────┘

  typical_flow:
    - step: "SCMI 驱动请求邮箱通道"
      code: "chan = mbox_request_channel_byname(cl, \"tx\");"
    - step: "发送 SCMI 消息"
      code: "mbox_send_message(chan, scmi_msg);"
    - step: "等待响应或超时"
      code: "wait_for_completion_timeout(&done, timeout);"
    - step: "处理响应"
      code: "scmi_rx_callback() 被调用"



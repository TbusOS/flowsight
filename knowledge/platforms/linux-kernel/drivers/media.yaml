# Media Subsystem Knowledge Base
# Reference: https://www.kernel.org/doc/html/latest/driver-api/media/

# ============================================================
# V4L2 VIDEO DEVICE
# ============================================================
video_device:
  description: "V4L2 Video Device"
  header: "media/v4l2-dev.h"
  icon: "📹"
  registration:
    - pattern: 'video_register_device\s*\(\s*(?P<vdev>\w+)\s*,\s*(?P<type>\w+)\s*,\s*(?P<nr>\w+)\s*\)'
      description: "注册视频设备"
    - pattern: '__video_register_device\s*\('
      description: "注册视频设备（内部）"
  unregistration:
    - pattern: 'video_unregister_device\s*\(\s*(?P<vdev>\w+)\s*\)'
      description: "注销视频设备"
  helpers:
    - pattern: 'video_device_alloc\s*\(\s*\)'
      description: "分配视频设备"
    - pattern: 'video_device_release\s*\(\s*(?P<vdev>\w+)\s*\)'
      description: "释放视频设备"
    - pattern: 'video_get_drvdata\s*\(\s*(?P<vdev>\w+)\s*\)'
      description: "获取驱动私有数据"
    - pattern: 'video_set_drvdata\s*\(\s*(?P<vdev>\w+)\s*,'
      description: "设置驱动私有数据"

# ============================================================
# V4L2 FILE OPERATIONS
# ============================================================
v4l2_file_operations:
  description: "V4L2 File Operations"
  header: "media/v4l2-dev.h"
  icon: "🎬"
  structure:
    name: "v4l2_file_operations"
    callbacks:
      open:
        pattern: '\.open\s*=\s*(?P<handler>\w+)'
        description: "打开设备"
        context: "process"
        can_sleep: true
      release:
        pattern: '\.release\s*=\s*(?P<handler>\w+)'
        description: "关闭设备"
        context: "process"
        can_sleep: true
      read:
        pattern: '\.read\s*=\s*(?P<handler>\w+)'
        description: "读取视频帧"
        context: "process"
        can_sleep: true
      write:
        pattern: '\.write\s*=\s*(?P<handler>\w+)'
        description: "写入视频帧"
        context: "process"
        can_sleep: true
      poll:
        pattern: '\.poll\s*=\s*(?P<handler>\w+)'
        description: "轮询帧就绪"
        context: "process"
        can_sleep: false
      mmap:
        pattern: '\.mmap\s*=\s*(?P<handler>\w+)'
        description: "内存映射缓冲区"
        context: "process"
        can_sleep: true
      unlocked_ioctl:
        pattern: '\.unlocked_ioctl\s*=\s*(?P<handler>\w+)'
        description: "V4L2 ioctl"
        context: "process"
        can_sleep: true

# ============================================================
# V4L2 IOCTL OPERATIONS
# ============================================================
v4l2_ioctl_ops:
  description: "V4L2 IOCTL Operations"
  header: "media/v4l2-ioctl.h"
  icon: "🎛️"
  structure:
    name: "v4l2_ioctl_ops"
    callbacks:
      # Capability
      vidioc_querycap:
        pattern: '\.vidioc_querycap\s*=\s*(?P<handler>\w+)'
        description: "查询设备能力"
      # Format
      vidioc_enum_fmt_vid_cap:
        pattern: '\.vidioc_enum_fmt_vid_cap\s*=\s*(?P<handler>\w+)'
        description: "枚举捕获格式"
      vidioc_g_fmt_vid_cap:
        pattern: '\.vidioc_g_fmt_vid_cap\s*=\s*(?P<handler>\w+)'
        description: "获取捕获格式"
      vidioc_s_fmt_vid_cap:
        pattern: '\.vidioc_s_fmt_vid_cap\s*=\s*(?P<handler>\w+)'
        description: "设置捕获格式"
      vidioc_try_fmt_vid_cap:
        pattern: '\.vidioc_try_fmt_vid_cap\s*=\s*(?P<handler>\w+)'
        description: "测试捕获格式"
      # Buffer
      vidioc_reqbufs:
        pattern: '\.vidioc_reqbufs\s*=\s*(?P<handler>\w+)'
        description: "请求缓冲区"
      vidioc_querybuf:
        pattern: '\.vidioc_querybuf\s*=\s*(?P<handler>\w+)'
        description: "查询缓冲区"
      vidioc_qbuf:
        pattern: '\.vidioc_qbuf\s*=\s*(?P<handler>\w+)'
        description: "入队缓冲区"
      vidioc_dqbuf:
        pattern: '\.vidioc_dqbuf\s*=\s*(?P<handler>\w+)'
        description: "出队缓冲区"
      # Streaming
      vidioc_streamon:
        pattern: '\.vidioc_streamon\s*=\s*(?P<handler>\w+)'
        description: "开始流"
      vidioc_streamoff:
        pattern: '\.vidioc_streamoff\s*=\s*(?P<handler>\w+)'
        description: "停止流"
      # Controls
      vidioc_queryctrl:
        pattern: '\.vidioc_queryctrl\s*=\s*(?P<handler>\w+)'
        description: "查询控制"
      vidioc_g_ctrl:
        pattern: '\.vidioc_g_ctrl\s*=\s*(?P<handler>\w+)'
        description: "获取控制值"
      vidioc_s_ctrl:
        pattern: '\.vidioc_s_ctrl\s*=\s*(?P<handler>\w+)'
        description: "设置控制值"
      # Input/Output
      vidioc_enum_input:
        pattern: '\.vidioc_enum_input\s*=\s*(?P<handler>\w+)'
        description: "枚举输入"
      vidioc_g_input:
        pattern: '\.vidioc_g_input\s*=\s*(?P<handler>\w+)'
        description: "获取当前输入"
      vidioc_s_input:
        pattern: '\.vidioc_s_input\s*=\s*(?P<handler>\w+)'
        description: "设置输入"

# ============================================================
# V4L2 SUBDEVICE
# ============================================================
v4l2_subdev:
  description: "V4L2 Sub-device"
  header: "media/v4l2-subdev.h"
  icon: "🔧"
  registration:
    - pattern: 'v4l2_device_register_subdev\s*\(\s*(?P<v4l2_dev>\w+)\s*,\s*(?P<sd>\w+)\s*\)'
      description: "注册子设备"
    - pattern: 'v4l2_async_register_subdev\s*\(\s*(?P<sd>\w+)\s*\)'
      description: "异步注册子设备"
  structure:
    name: "v4l2_subdev_ops"
    inner_ops:
      core:
        pattern: '\.core\s*=\s*&(?P<ops>\w+)'
        description: "核心操作"
      video:
        pattern: '\.video\s*=\s*&(?P<ops>\w+)'
        description: "视频操作"
      pad:
        pattern: '\.pad\s*=\s*&(?P<ops>\w+)'
        description: "Pad 操作"

# ============================================================
# VIDEOBUF2
# ============================================================
vb2_ops:
  description: "Videobuf2 Operations"
  header: "media/videobuf2-core.h"
  icon: "📦"
  structure:
    name: "vb2_ops"
    callbacks:
      queue_setup:
        pattern: '\.queue_setup\s*=\s*(?P<handler>\w+)'
        description: "队列设置"
        context: "process"
        can_sleep: true
      buf_prepare:
        pattern: '\.buf_prepare\s*=\s*(?P<handler>\w+)'
        description: "准备缓冲区"
        context: "process"
        can_sleep: true
      buf_queue:
        pattern: '\.buf_queue\s*=\s*(?P<handler>\w+)'
        description: "入队缓冲区"
        context: "process/interrupt"
        can_sleep: false
      start_streaming:
        pattern: '\.start_streaming\s*=\s*(?P<handler>\w+)'
        description: "开始流"
        context: "process"
        can_sleep: true
      stop_streaming:
        pattern: '\.stop_streaming\s*=\s*(?P<handler>\w+)'
        description: "停止流"
        context: "process"
        can_sleep: true
      buf_finish:
        pattern: '\.buf_finish\s*=\s*(?P<handler>\w+)'
        description: "完成缓冲区"
      wait_prepare:
        pattern: '\.wait_prepare\s*=\s*(?P<handler>\w+)'
        description: "等待准备"
      wait_finish:
        pattern: '\.wait_finish\s*=\s*(?P<handler>\w+)'
        description: "等待完成"
  helpers:
    - pattern: 'vb2_buffer_done\s*\(\s*(?P<vb>\w+)\s*,\s*(?P<state>\w+)\s*\)'
      description: "标记缓冲区完成"
    - pattern: 'vb2_queue_init\s*\(\s*(?P<q>\w+)\s*\)'
      description: "初始化 VB2 队列"
    - pattern: 'vb2_queue_release\s*\(\s*(?P<q>\w+)\s*\)'
      description: "释放 VB2 队列"

# ============================================================
# CALL CHAINS
# ============================================================
call_chains:
  v4l2_capture:
    description: "V4L2 Capture Flow"
    chain:
      - caller: "userspace"
        callee: "VIDIOC_QBUF"
        description: "入队缓冲区"
      - caller: "vidioc_qbuf"
        callee: "vb2_qbuf"
        description: "VB2 入队"
      - caller: "vb2_qbuf"
        callee: "ops->buf_queue"
        description: "驱动入队回调"
      - caller: "ISP IRQ"
        callee: "vb2_buffer_done"
        context: "hardirq"
        description: "帧完成中断"
  v4l2_streaming:
    description: "V4L2 Streaming Start"
    chain:
      - caller: "userspace"
        callee: "VIDIOC_STREAMON"
      - caller: "vidioc_streamon"
        callee: "vb2_streamon"
      - caller: "vb2_streamon"
        callee: "ops->start_streaming"
        description: "启动硬件流"


# ============================================================
# DATA STRUCTURES (数据结构)
# ============================================================

data_structures:
  video_device:
    pattern: 'struct video_device\s*\{'
    description: "V4L2 视频设备结构"
    file: "include/media/v4l2-dev.h"
    fields:
      - name: "name"
        type: "char[]"
        description: "设备名称"
      - name: "vfl_type"
        type: "int"
        description: "设备类型 (VFL_TYPE_VIDEO等)"
      - name: "fops"
        type: "const struct v4l2_file_operations *"
        description: "文件操作"
      - name: "ioctl_ops"
        type: "const struct v4l2_ioctl_ops *"
        description: "IOCTL 操作"
      - name: "release"
        type: "void (*)(struct video_device *)"
        description: "释放回调"
      - name: "v4l2_dev"
        type: "struct v4l2_device *"
        description: "关联的 V4L2 设备"
      - name: "queue"
        type: "struct vb2_queue *"
        description: "VB2 队列"
      - name: "lock"
        type: "struct mutex *"
        description: "序列化锁"
      - name: "minor"
        type: "int"
        description: "次设备号"
      - name: "dev"
        type: "struct device"
        description: "内嵌设备"

  vb2_queue:
    pattern: 'struct vb2_queue\s*\{'
    description: "Videobuf2 队列"
    file: "include/media/videobuf2-core.h"
    fields:
      - name: "type"
        type: "enum v4l2_buf_type"
        description: "缓冲区类型"
      - name: "io_modes"
        type: "unsigned int"
        description: "支持的 I/O 模式"
      - name: "dev"
        type: "struct device *"
        description: "用于 DMA 的设备"
      - name: "ops"
        type: "const struct vb2_ops *"
        description: "队列操作"
      - name: "mem_ops"
        type: "const struct vb2_mem_ops *"
        description: "内存操作"
      - name: "buf_struct_size"
        type: "unsigned int"
        description: "驱动缓冲区结构大小"
      - name: "timestamp_flags"
        type: "u32"
        description: "时间戳标志"
      - name: "gfp_flags"
        type: "gfp_t"
        description: "分配标志"
      - name: "min_buffers_needed"
        type: "unsigned int"
        description: "启动流所需最小缓冲区"
      - name: "lock"
        type: "struct mutex *"
        description: "队列锁"
      - name: "drv_priv"
        type: "void *"
        description: "驱动私有数据"

  vb2_buffer:
    pattern: 'struct vb2_buffer\s*\{'
    description: "Videobuf2 缓冲区"
    file: "include/media/videobuf2-core.h"
    fields:
      - name: "vb2_queue"
        type: "struct vb2_queue *"
        description: "所属队列"
      - name: "index"
        type: "unsigned int"
        description: "缓冲区索引"
      - name: "type"
        type: "unsigned int"
        description: "缓冲区类型"
      - name: "memory"
        type: "unsigned int"
        description: "内存类型"
      - name: "num_planes"
        type: "unsigned int"
        description: "平面数"
      - name: "timestamp"
        type: "u64"
        description: "时间戳"
      - name: "state"
        type: "enum vb2_buffer_state"
        description: "缓冲区状态"

  v4l2_subdev:
    pattern: 'struct v4l2_subdev\s*\{'
    description: "V4L2 子设备"
    file: "include/media/v4l2-subdev.h"
    fields:
      - name: "name"
        type: "char[]"
        description: "子设备名称"
      - name: "v4l2_dev"
        type: "struct v4l2_device *"
        description: "关联的 V4L2 设备"
      - name: "ops"
        type: "const struct v4l2_subdev_ops *"
        description: "操作函数表"
      - name: "ctrl_handler"
        type: "struct v4l2_ctrl_handler *"
        description: "控制处理器"
      - name: "entity"
        type: "struct media_entity"
        description: "媒体实体"
      - name: "pads"
        type: "struct media_pad *"
        description: "媒体 pad"
      - name: "host_priv"
        type: "void *"
        description: "主机私有数据"


# ============================================================
# EXAMPLES (代码示例)
# ============================================================

examples:
  - description: "基本 V4L2 捕获驱动示例"
    kernel_version: "5.0+"
    code: |
      #include <linux/module.h>
      #include <linux/platform_device.h>
      #include <media/v4l2-device.h>
      #include <media/v4l2-ioctl.h>
      #include <media/videobuf2-dma-contig.h>
      
      struct my_capture {
          struct v4l2_device v4l2_dev;
          struct video_device vdev;
          struct vb2_queue queue;
          struct mutex lock;
          void __iomem *regs;
          
          /* 当前格式 */
          struct v4l2_pix_format pix;
          
          /* 活动缓冲区 */
          struct list_head active;
          spinlock_t slock;
      };
      
      struct my_buffer {
          struct vb2_v4l2_buffer vb;
          struct list_head list;
      };
      
      /* 查询设备能力 */
      static int my_querycap(struct file *file, void *priv,
                             struct v4l2_capability *cap)
      {
          strscpy(cap->driver, "my_capture", sizeof(cap->driver));
          strscpy(cap->card, "My Capture Device", sizeof(cap->card));
          cap->capabilities = V4L2_CAP_VIDEO_CAPTURE |
                              V4L2_CAP_STREAMING |
                              V4L2_CAP_DEVICE_CAPS;
          return 0;
      }
      
      /* 获取格式 */
      static int my_g_fmt(struct file *file, void *priv,
                          struct v4l2_format *f)
      {
          struct my_capture *cap = video_drvdata(file);
          f->fmt.pix = cap->pix;
          return 0;
      }
      
      /* 设置格式 */
      static int my_s_fmt(struct file *file, void *priv,
                          struct v4l2_format *f)
      {
          struct my_capture *cap = video_drvdata(file);
          
          /* 验证格式 */
          f->fmt.pix.width = clamp(f->fmt.pix.width, 320U, 1920U);
          f->fmt.pix.height = clamp(f->fmt.pix.height, 240U, 1080U);
          f->fmt.pix.pixelformat = V4L2_PIX_FMT_YUYV;
          f->fmt.pix.bytesperline = f->fmt.pix.width * 2;
          f->fmt.pix.sizeimage = f->fmt.pix.bytesperline *
                                 f->fmt.pix.height;
          f->fmt.pix.field = V4L2_FIELD_NONE;
          
          cap->pix = f->fmt.pix;
          return 0;
      }
      
      static const struct v4l2_ioctl_ops my_ioctl_ops = {
          .vidioc_querycap        = my_querycap,
          .vidioc_g_fmt_vid_cap   = my_g_fmt,
          .vidioc_s_fmt_vid_cap   = my_s_fmt,
          .vidioc_try_fmt_vid_cap = my_try_fmt,
          .vidioc_reqbufs         = vb2_ioctl_reqbufs,
          .vidioc_querybuf        = vb2_ioctl_querybuf,
          .vidioc_qbuf            = vb2_ioctl_qbuf,
          .vidioc_dqbuf           = vb2_ioctl_dqbuf,
          .vidioc_streamon        = vb2_ioctl_streamon,
          .vidioc_streamoff       = vb2_ioctl_streamoff,
      };

  - description: "Videobuf2 操作示例"
    kernel_version: "5.0+"
    code: |
      /* 队列设置 */
      static int my_queue_setup(struct vb2_queue *vq,
                                unsigned int *nbuffers,
                                unsigned int *nplanes,
                                unsigned int sizes[],
                                struct device *alloc_devs[])
      {
          struct my_capture *cap = vb2_get_drv_priv(vq);
          
          if (*nplanes) {
              if (sizes[0] < cap->pix.sizeimage)
                  return -EINVAL;
          } else {
              *nplanes = 1;
              sizes[0] = cap->pix.sizeimage;
          }
          
          /* 至少需要 2 个缓冲区 */
          if (*nbuffers < 2)
              *nbuffers = 2;
          
          return 0;
      }
      
      /* 缓冲区入队 */
      static void my_buf_queue(struct vb2_buffer *vb)
      {
          struct my_capture *cap = vb2_get_drv_priv(vb->vb2_queue);
          struct vb2_v4l2_buffer *vbuf = to_vb2_v4l2_buffer(vb);
          struct my_buffer *buf = container_of(vbuf,
                                               struct my_buffer, vb);
          unsigned long flags;
          
          spin_lock_irqsave(&cap->slock, flags);
          list_add_tail(&buf->list, &cap->active);
          spin_unlock_irqrestore(&cap->slock, flags);
      }
      
      /* 开始流 */
      static int my_start_streaming(struct vb2_queue *vq,
                                    unsigned int count)
      {
          struct my_capture *cap = vb2_get_drv_priv(vq);
          
          /* 配置硬件 */
          writel(cap->pix.width, cap->regs + REG_WIDTH);
          writel(cap->pix.height, cap->regs + REG_HEIGHT);
          
          /* 启动 DMA */
          writel(CTRL_START, cap->regs + REG_CTRL);
          
          return 0;
      }
      
      /* 停止流 */
      static void my_stop_streaming(struct vb2_queue *vq)
      {
          struct my_capture *cap = vb2_get_drv_priv(vq);
          struct my_buffer *buf, *tmp;
          unsigned long flags;
          
          /* 停止硬件 */
          writel(CTRL_STOP, cap->regs + REG_CTRL);
          
          /* 返回所有缓冲区 */
          spin_lock_irqsave(&cap->slock, flags);
          list_for_each_entry_safe(buf, tmp, &cap->active, list) {
              list_del(&buf->list);
              vb2_buffer_done(&buf->vb.vb2_buf, VB2_BUF_STATE_ERROR);
          }
          spin_unlock_irqrestore(&cap->slock, flags);
      }
      
      static const struct vb2_ops my_vb2_ops = {
          .queue_setup     = my_queue_setup,
          .buf_queue       = my_buf_queue,
          .start_streaming = my_start_streaming,
          .stop_streaming  = my_stop_streaming,
          .wait_prepare    = vb2_ops_wait_prepare,
          .wait_finish     = vb2_ops_wait_finish,
      };

  - description: "V4L2 中断处理示例"
    kernel_version: "5.0+"
    code: |
      /* 帧完成中断 */
      static irqreturn_t my_irq_handler(int irq, void *dev_id)
      {
          struct my_capture *cap = dev_id;
          struct my_buffer *buf;
          unsigned long flags;
          u32 status;
          
          /* 读取中断状态 */
          status = readl(cap->regs + REG_INT_STATUS);
          if (!(status & INT_FRAME_DONE))
              return IRQ_NONE;
          
          /* 清除中断 */
          writel(status, cap->regs + REG_INT_STATUS);
          
          spin_lock_irqsave(&cap->slock, flags);
          
          if (!list_empty(&cap->active)) {
              /* 获取完成的缓冲区 */
              buf = list_first_entry(&cap->active,
                                     struct my_buffer, list);
              list_del(&buf->list);
              
              /* 设置时间戳 */
              buf->vb.vb2_buf.timestamp = ktime_get_ns();
              buf->vb.sequence = cap->sequence++;
              buf->vb.field = V4L2_FIELD_NONE;
              
              /* 标记完成 */
              vb2_buffer_done(&buf->vb.vb2_buf, VB2_BUF_STATE_DONE);
              
              /* 处理下一个缓冲区 */
              if (!list_empty(&cap->active)) {
                  buf = list_first_entry(&cap->active,
                                         struct my_buffer, list);
                  my_set_next_buffer(cap, buf);
              }
          }
          
          spin_unlock_irqrestore(&cap->slock, flags);
          return IRQ_HANDLED;
      }
      
      /* 设置下一个 DMA 缓冲区 */
      static void my_set_next_buffer(struct my_capture *cap,
                                     struct my_buffer *buf)
      {
          dma_addr_t addr;
          
          addr = vb2_dma_contig_plane_dma_addr(&buf->vb.vb2_buf, 0);
          writel(lower_32_bits(addr), cap->regs + REG_DMA_ADDR_L);
          writel(upper_32_bits(addr), cap->regs + REG_DMA_ADDR_H);
      }

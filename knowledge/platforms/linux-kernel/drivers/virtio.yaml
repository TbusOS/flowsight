# Virtio Driver Framework Knowledge Base
# Reference: https://docs.oasis-open.org/virtio/virtio/

# ============================================================
# VIRTIO DRIVER
# ============================================================

virtio_driver:
  description: "Virtio Device Driver Framework"
  header: "linux/virtio.h"
  icon: "🖧"
  kernel_version: "2.6.25+"

  registration:
    - pattern: 'register_virtio_driver\s*\(\s*&(?P<driver>\w+)\s*\)'
      description: "注册 virtio 驱动"
    - pattern: 'unregister_virtio_driver\s*\(\s*&(?P<driver>\w+)\s*\)'
      description: "注销 virtio 驱动"
    - pattern: 'module_virtio_driver\s*\(\s*(?P<driver>\w+)\s*\)'
      description: "模块初始化宏"

  driver_structure:
    pattern: 'static struct virtio_driver\s+(?P<name>\w+)'
    description: "Virtio 驱动结构体"

  callbacks:
    probe:
      pattern: '\.probe\s*=\s*(?P<handler>\w+)'
      description: "设备探测回调"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct virtio_device *)"

    remove:
      pattern: '\.remove\s*=\s*(?P<handler>\w+)'
      description: "设备移除回调"
      context: "process"
      can_sleep: true
      signature: "void (*)(struct virtio_device *)"

    config_changed:
      pattern: '\.config_changed\s*=\s*(?P<handler>\w+)'
      description: "配置变更通知"
      context: "可能是中断上下文"
      signature: "void (*)(struct virtio_device *)"

    freeze:
      pattern: '\.freeze\s*=\s*(?P<handler>\w+)'
      description: "挂起回调"
      context: "process"

    restore:
      pattern: '\.restore\s*=\s*(?P<handler>\w+)'
      description: "恢复回调"
      context: "process"

  device_ids:
    - "VIRTIO_ID_NET"
    - "VIRTIO_ID_BLOCK"
    - "VIRTIO_ID_CONSOLE"
    - "VIRTIO_ID_RNG"
    - "VIRTIO_ID_BALLOON"
    - "VIRTIO_ID_SCSI"
    - "VIRTIO_ID_9P"
    - "VIRTIO_ID_GPU"
    - "VIRTIO_ID_INPUT"
    - "VIRTIO_ID_VSOCK"
    - "VIRTIO_ID_CRYPTO"
    - "VIRTIO_ID_FS"

# ============================================================
# VIRTQUEUE
# ============================================================

virtqueue:
  description: "Virtio Queue"
  header: "linux/virtio.h"
  icon: "📬"

  functions:
    find_vqs:
      pattern: 'virtio_find_vqs\s*\('
      description: "查找并初始化 virtqueue"
      context: "process"

    add_buf:
      pattern: 'virtqueue_add_(?P<type>sgs|inbuf|outbuf)\s*\('
      description: "添加缓冲区到队列"
      context: "any"

    kick:
      pattern: 'virtqueue_kick\s*\('
      description: "通知 host 有新数据"
      context: "any"

    get_buf:
      pattern: 'virtqueue_get_buf\s*\('
      description: "获取完成的缓冲区"
      context: "any"

    enable_cb:
      pattern: 'virtqueue_enable_cb\s*\('
      description: "启用回调通知"

    disable_cb:
      pattern: 'virtqueue_disable_cb\s*\('
      description: "禁用回调通知"

  callback:
    pattern: 'vq->callback\s*=\s*(?P<handler>\w+)'
    description: "Virtqueue 回调"
    context: "softirq/hardirq"
    signature: "void (*)(struct virtqueue *)"

  typical_flow:
    - "virtqueue_add_sgs() - 添加 scatter-gather 列表"
    - "virtqueue_kick() - 通知 host"
    - "(host 处理请求)"
    - "callback 被调用"
    - "virtqueue_get_buf() - 获取结果"

# ============================================================
# VIRTIO-NET
# ============================================================

virtio_net:
  description: "Virtio Network Driver"
  header: "drivers/net/virtio_net.c"
  icon: "🌐"

  queues:
    - name: "receiveq"
      description: "接收队列"
    - name: "sendq"
      description: "发送队列"
    - name: "ctrlq"
      description: "控制队列"

  features:
    - "VIRTIO_NET_F_CSUM"
    - "VIRTIO_NET_F_MAC"
    - "VIRTIO_NET_F_GSO"
    - "VIRTIO_NET_F_MRG_RXBUF"
    - "VIRTIO_NET_F_STATUS"
    - "VIRTIO_NET_F_CTRL_VQ"
    - "VIRTIO_NET_F_MQ"

# ============================================================
# VIRTIO-BLK
# ============================================================

virtio_blk:
  description: "Virtio Block Driver"
  header: "drivers/block/virtio_blk.c"
  icon: "💾"

  request_types:
    - "VIRTIO_BLK_T_IN"
    - "VIRTIO_BLK_T_OUT"
    - "VIRTIO_BLK_T_FLUSH"
    - "VIRTIO_BLK_T_DISCARD"
    - "VIRTIO_BLK_T_WRITE_ZEROES"

  features:
    - "VIRTIO_BLK_F_SIZE_MAX"
    - "VIRTIO_BLK_F_SEG_MAX"
    - "VIRTIO_BLK_F_BLK_SIZE"
    - "VIRTIO_BLK_F_FLUSH"
    - "VIRTIO_BLK_F_TOPOLOGY"
    - "VIRTIO_BLK_F_MQ"
    - "VIRTIO_BLK_F_DISCARD"

# ============================================================
# VIRTIO-GPU
# ============================================================

virtio_gpu:
  description: "Virtio GPU Driver"
  header: "drivers/gpu/drm/virtio/"
  icon: "🎮"

  features:
    - "VIRTIO_GPU_F_VIRGL"
    - "VIRTIO_GPU_F_EDID"
    - "VIRTIO_GPU_F_RESOURCE_UUID"
    - "VIRTIO_GPU_F_RESOURCE_BLOB"
    - "VIRTIO_GPU_F_CONTEXT_INIT"

  commands:
    - "VIRTIO_GPU_CMD_GET_DISPLAY_INFO"
    - "VIRTIO_GPU_CMD_RESOURCE_CREATE_2D"
    - "VIRTIO_GPU_CMD_SET_SCANOUT"
    - "VIRTIO_GPU_CMD_RESOURCE_FLUSH"
    - "VIRTIO_GPU_CMD_TRANSFER_TO_HOST_2D"
    - "VIRTIO_GPU_CMD_SUBMIT_3D"

# ============================================================
# VHOST
# ============================================================

vhost:
  description: "Vhost (用户空间 virtio backend)"
  header: "linux/vhost.h"
  icon: "🏠"

  types:
    - name: "vhost-net"
      description: "网络后端"
      device: "/dev/vhost-net"
    - name: "vhost-scsi"
      description: "SCSI 后端"
    - name: "vhost-vsock"
      description: "Vsock 后端"
    - name: "vhost-vdpa"
      description: "vDPA 后端"

  kernel_module:
    pattern: 'vhost_dev_init\s*\('
    description: "初始化 vhost 设备"

  operations:
    - "VHOST_SET_OWNER"
    - "VHOST_RESET_OWNER"
    - "VHOST_SET_MEM_TABLE"
    - "VHOST_SET_VRING_NUM"
    - "VHOST_SET_VRING_ADDR"
    - "VHOST_SET_VRING_KICK"
    - "VHOST_SET_VRING_CALL"


# ============================================================
# DATA STRUCTURES
# ============================================================

data_structures:
  virtio_device:
    pattern: 'struct virtio_device\s*\{'
    description: "Virtio 设备结构"
    file: "include/linux/virtio.h"
    fields:
      - name: "id"
        type: "struct virtio_device_id"
        description: "设备 ID"
      - name: "config"
        type: "const struct virtio_config_ops *"
        description: "配置操作"
      - name: "vqs"
        type: "struct list_head"
        description: "virtqueue 列表"
      - name: "features"
        type: "u64"
        description: "协商后的特性"
      - name: "priv"
        type: "void *"
        description: "驱动私有数据"
      - name: "dev"
        type: "struct device"
        description: "内嵌设备"

  virtqueue:
    pattern: 'struct virtqueue\s*\{'
    description: "Virtqueue 结构"
    file: "include/linux/virtio.h"
    fields:
      - name: "callback"
        type: "void (*)(struct virtqueue *)"
        description: "完成回调"
      - name: "name"
        type: "const char *"
        description: "队列名称"
      - name: "vdev"
        type: "struct virtio_device *"
        description: "所属设备"
      - name: "index"
        type: "unsigned int"
        description: "队列索引"
      - name: "num_free"
        type: "unsigned int"
        description: "空闲描述符数"
      - name: "priv"
        type: "void *"
        description: "驱动私有数据"


# ============================================================
# CALL CHAINS
# ============================================================

call_chains:
  virtio_probe:
    description: "Virtio 设备探测流程"
    chain:
      - caller: "virtio_bus_match"
        callee: "virtio_driver.probe"
        description: "调用驱动探测"
      - caller: "probe"
        callee: "virtio_find_vqs"
        description: "创建 virtqueue"
      - caller: "virtio_find_vqs"
        callee: "virtio_config_ops->find_vqs"
        description: "后端分配队列"

  virtio_request:
    description: "Virtio 请求处理流程"
    chain:
      - caller: "driver"
        callee: "virtqueue_add_sgs"
        description: "添加请求到队列"
      - caller: "driver"
        callee: "virtqueue_kick"
        description: "通知后端"
      - caller: "后端处理完成"
        callee: "vring_interrupt"
        context: "hardirq"
        description: "中断处理"
      - caller: "vring_interrupt"
        callee: "vq->callback"
        context: "softirq"
        description: "调用驱动回调"
      - caller: "callback"
        callee: "virtqueue_get_buf"
        description: "获取完成的请求"


# ============================================================
# EXAMPLES
# ============================================================

examples:
  - description: "基本 Virtio 驱动示例"
    kernel_version: "5.0+"
    code: |
      #include <linux/module.h>
      #include <linux/virtio.h>
      #include <linux/virtio_config.h>
      
      #define VIRTIO_ID_MY_DEVICE 42
      
      struct my_virtio_dev {
          struct virtio_device *vdev;
          struct virtqueue *vq;
          spinlock_t lock;
          struct work_struct work;
      };
      
      static void my_vq_callback(struct virtqueue *vq)
      {
          struct my_virtio_dev *mydev = vq->vdev->priv;
          
          /* 在工作队列中处理 */
          schedule_work(&mydev->work);
      }
      
      static void my_work_handler(struct work_struct *work)
      {
          struct my_virtio_dev *mydev =
              container_of(work, struct my_virtio_dev, work);
          unsigned long flags;
          void *buf;
          unsigned int len;
          
          spin_lock_irqsave(&mydev->lock, flags);
          
          while ((buf = virtqueue_get_buf(mydev->vq, &len))) {
              /* 处理完成的请求 */
              my_process_response(mydev, buf, len);
          }
          
          spin_unlock_irqrestore(&mydev->lock, flags);
      }
      
      static int my_virtio_send(struct my_virtio_dev *mydev,
                                 void *data, size_t len)
      {
          struct scatterlist sg;
          unsigned long flags;
          int ret;
          
          sg_init_one(&sg, data, len);
          
          spin_lock_irqsave(&mydev->lock, flags);
          
          ret = virtqueue_add_outbuf(mydev->vq, &sg, 1, data,
                                      GFP_ATOMIC);
          if (ret == 0)
              virtqueue_kick(mydev->vq);
          
          spin_unlock_irqrestore(&mydev->lock, flags);
          
          return ret;
      }
      
      static int my_virtio_probe(struct virtio_device *vdev)
      {
          struct my_virtio_dev *mydev;
          struct virtqueue *vq;
          int ret;
          
          mydev = kzalloc(sizeof(*mydev), GFP_KERNEL);
          if (!mydev)
              return -ENOMEM;
          
          mydev->vdev = vdev;
          vdev->priv = mydev;
          spin_lock_init(&mydev->lock);
          INIT_WORK(&mydev->work, my_work_handler);
          
          /* 创建 virtqueue */
          vq = virtio_find_single_vq(vdev, my_vq_callback,
                                      "my-queue");
          if (IS_ERR(vq)) {
              ret = PTR_ERR(vq);
              goto err_free;
          }
          mydev->vq = vq;
          
          /* 通知后端驱动就绪 */
          virtio_device_ready(vdev);
          
          return 0;
          
      err_free:
          kfree(mydev);
          return ret;
      }
      
      static void my_virtio_remove(struct virtio_device *vdev)
      {
          struct my_virtio_dev *mydev = vdev->priv;
          
          /* 停止设备 */
          virtio_reset_device(vdev);
          
          /* 取消工作 */
          cancel_work_sync(&mydev->work);
          
          /* 删除 virtqueue */
          vdev->config->del_vqs(vdev);
          
          kfree(mydev);
      }
      
      static struct virtio_device_id my_virtio_ids[] = {
          { VIRTIO_ID_MY_DEVICE, VIRTIO_DEV_ANY_ID },
          { 0 },
      };
      MODULE_DEVICE_TABLE(virtio, my_virtio_ids);
      
      static struct virtio_driver my_virtio_driver = {
          .driver.name = "my-virtio",
          .driver.owner = THIS_MODULE,
          .id_table = my_virtio_ids,
          .probe = my_virtio_probe,
          .remove = my_virtio_remove,
      };
      module_virtio_driver(my_virtio_driver);

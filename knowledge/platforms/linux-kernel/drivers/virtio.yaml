    - "VIRTIO_BLK_T_OUT"
    - "VIRTIO_BLK_T_FLUSH"
    - "VIRTIO_BLK_T_DISCARD"
    - "VIRTIO_BLK_T_WRITE_ZEROES"

  features:
    - "VIRTIO_BLK_F_SIZE_MAX"
    - "VIRTIO_BLK_F_SEG_MAX"
    - "VIRTIO_BLK_F_BLK_SIZE"
    - "VIRTIO_BLK_F_FLUSH"
    - "VIRTIO_BLK_F_TOPOLOGY"
    - "VIRTIO_BLK_F_MQ"
    - "VIRTIO_BLK_F_DISCARD"

# ============================================================
# VIRTIO-GPU
# ============================================================


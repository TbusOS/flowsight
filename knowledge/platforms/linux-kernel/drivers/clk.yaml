# Linux Kernel Clock Framework Knowledge Base
#
# Reference: https://www.kernel.org/doc/html/latest/driver-api/clk.html
# Header: include/linux/clk.h, include/linux/clk-provider.h

# ============================================================
# CLOCK CONSUMER API
# ============================================================

clk_consumer:
  description: "Clock Consumer API - 时钟消费者接口"
  header: "linux/clk.h"
  icon: "⏱️"
  kernel_version: "2.6.16+"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  registration:
    - pattern: 'clk_get\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<con_id>[^)]+)\s*\)'
      description: "获取时钟引用"
      context: "process"
      can_sleep: true
    - pattern: 'clk_get_optional\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<con_id>[^)]+)\s*\)'
      description: "可选获取时钟（不存在时返回 NULL）"
      context: "process"
      can_sleep: true
    - pattern: 'devm_clk_get\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<con_id>[^)]+)\s*\)'
      description: "设备管理的时钟获取"
      context: "process"
      can_sleep: true
    - pattern: 'devm_clk_get_optional\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<con_id>[^)]+)\s*\)'
      description: "设备管理的可选时钟获取"
      context: "process"
      can_sleep: true
    - pattern: 'clk_put\s*\(\s*(?P<clk>[^)]+)\s*\)'
      description: "释放时钟引用"
      context: "process"
      can_sleep: true

  helper_functions:
    # 准备/使能（两阶段）
    - pattern: 'clk_prepare\s*\(\s*(?P<clk>[^)]+)\s*\)'
      description: "准备时钟（可睡眠）"
      context: "process"
      can_sleep: true
      return_value:
        success: "0"
        failure: "-ERRNO"
    - pattern: 'clk_unprepare\s*\(\s*(?P<clk>[^)]+)\s*\)'
      description: "取消准备时钟（可睡眠）"
      context: "process"
      can_sleep: true
    - pattern: 'clk_enable\s*\(\s*(?P<clk>[^)]+)\s*\)'
      description: "使能时钟（不可睡眠）"
      context: "any"
      can_sleep: false
      return_value:
        success: "0"
        failure: "-ERRNO"
    - pattern: 'clk_disable\s*\(\s*(?P<clk>[^)]+)\s*\)'
      description: "禁用时钟（不可睡眠）"
      context: "any"
      can_sleep: false

    # 组合操作
    - pattern: 'clk_prepare_enable\s*\(\s*(?P<clk>[^)]+)\s*\)'
      description: "准备并使能时钟"
      context: "process"
      can_sleep: true
    - pattern: 'clk_disable_unprepare\s*\(\s*(?P<clk>[^)]+)\s*\)'
      description: "禁用并取消准备时钟"
      context: "process"
      can_sleep: true

    # 速率控制
    - pattern: 'clk_get_rate\s*\(\s*(?P<clk>[^)]+)\s*\)'
      description: "获取时钟频率 (Hz)"
      context: "any"
      can_sleep: false
      return_value:
        success: "频率值 (Hz)"
        failure: "0"
    - pattern: 'clk_set_rate\s*\(\s*(?P<clk>[^,]+)\s*,\s*(?P<rate>[^)]+)\s*\)'
      description: "设置时钟频率"
      context: "process"
      can_sleep: true
    - pattern: 'clk_round_rate\s*\(\s*(?P<clk>[^,]+)\s*,\s*(?P<rate>[^)]+)\s*\)'
      description: "舍入到可用频率"
      context: "process"
      can_sleep: true
    - pattern: 'clk_set_min_rate\s*\(\s*(?P<clk>[^,]+)\s*,\s*(?P<rate>[^)]+)\s*\)'
      description: "设置最小频率约束"
      context: "process"
      can_sleep: true
    - pattern: 'clk_set_max_rate\s*\(\s*(?P<clk>[^,]+)\s*,\s*(?P<rate>[^)]+)\s*\)'
      description: "设置最大频率约束"
      context: "process"
      can_sleep: true
    - pattern: 'clk_set_rate_range\s*\(\s*(?P<clk>[^,]+)\s*,\s*(?P<min>[^,]+)\s*,\s*(?P<max>[^)]+)\s*\)'
      description: "设置频率范围约束"
      context: "process"
      can_sleep: true

    # 父时钟控制
    - pattern: 'clk_get_parent\s*\(\s*(?P<clk>[^)]+)\s*\)'
      description: "获取父时钟"
      context: "any"
      can_sleep: false
    - pattern: 'clk_set_parent\s*\(\s*(?P<clk>[^,]+)\s*,\s*(?P<parent>[^)]+)\s*\)'
      description: "设置父时钟"
      context: "process"
      can_sleep: true
    - pattern: 'clk_has_parent\s*\(\s*(?P<clk>[^,]+)\s*,\s*(?P<parent>[^)]+)\s*\)'
      description: "检查是否有指定父时钟"
      context: "any"
      can_sleep: false

    # 状态查询
    - pattern: 'clk_is_enabled\s*\(\s*(?P<clk>[^)]+)\s*\)'
      description: "检查时钟是否使能"
      context: "any"
      can_sleep: false
      return_value:
        enabled: "1"
        disabled: "0"
        error: "<0"

    # 相位控制
    - pattern: 'clk_get_phase\s*\(\s*(?P<clk>[^)]+)\s*\)'
      description: "获取时钟相位 (度)"
      context: "any"
      can_sleep: false
    - pattern: 'clk_set_phase\s*\(\s*(?P<clk>[^,]+)\s*,\s*(?P<degrees>[^)]+)\s*\)'
      description: "设置时钟相位"
      context: "process"
      can_sleep: true

    # 占空比控制
    - pattern: 'clk_get_duty_cycle\s*\(\s*(?P<clk>[^,]+)\s*,\s*(?P<scale>[^)]+)\s*\)'
      description: "获取占空比"
      context: "any"
      can_sleep: false
    - pattern: 'clk_set_duty_cycle\s*\(\s*(?P<clk>[^,]+)\s*,\s*(?P<num>[^,]+)\s*,\s*(?P<den>[^)]+)\s*\)'
      description: "设置占空比"
      context: "process"
      can_sleep: true

    # 独占速率
    - pattern: 'clk_rate_exclusive_get\s*\(\s*(?P<clk>[^)]+)\s*\)'
      description: "获取独占速率控制"
      context: "process"
      can_sleep: true
    - pattern: 'clk_rate_exclusive_put\s*\(\s*(?P<clk>[^)]+)\s*\)'
      description: "释放独占速率控制"
      context: "process"
      can_sleep: true

    # 批量操作
    - pattern: 'clk_bulk_get\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<num>[^,]+)\s*,\s*(?P<clks>[^)]+)\s*\)'
      description: "批量获取时钟"
      context: "process"
      can_sleep: true
    - pattern: 'clk_bulk_get_optional\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<num>[^,]+)\s*,\s*(?P<clks>[^)]+)\s*\)'
      description: "批量可选获取时钟"
      context: "process"
      can_sleep: true
    - pattern: 'clk_bulk_get_all\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<clks>[^)]+)\s*\)'
      description: "批量获取所有时钟"
      context: "process"
      can_sleep: true
    - pattern: 'clk_bulk_prepare_enable\s*\(\s*(?P<num>[^,]+)\s*,\s*(?P<clks>[^)]+)\s*\)'
      description: "批量准备并使能"
      context: "process"
      can_sleep: true
    - pattern: 'clk_bulk_disable_unprepare\s*\(\s*(?P<num>[^,]+)\s*,\s*(?P<clks>[^)]+)\s*\)'
      description: "批量禁用并取消准备"
      context: "process"
      can_sleep: true
    - pattern: 'clk_bulk_put\s*\(\s*(?P<num>[^,]+)\s*,\s*(?P<clks>[^)]+)\s*\)'
      description: "批量释放时钟"
      context: "process"
      can_sleep: true
    - pattern: 'clk_bulk_put_all\s*\(\s*(?P<num>[^,]+)\s*,\s*(?P<clks>[^)]+)\s*\)'
      description: "批量释放所有时钟"
      context: "process"
      can_sleep: true

    # devm 批量操作
    - pattern: 'devm_clk_bulk_get\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<num>[^,]+)\s*,\s*(?P<clks>[^)]+)\s*\)'
      description: "设备管理的批量获取"
      context: "process"
      can_sleep: true
    - pattern: 'devm_clk_bulk_get_optional\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<num>[^,]+)\s*,\s*(?P<clks>[^)]+)\s*\)'
      description: "设备管理的批量可选获取"
      context: "process"
      can_sleep: true
    - pattern: 'devm_clk_bulk_get_all\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<clks>[^)]+)\s*\)'
      description: "设备管理的批量获取所有"
      context: "process"
      can_sleep: true


# ============================================================
# CLOCK PROVIDER API
# ============================================================

clk_provider:
  description: "Clock Provider API - 时钟提供者接口"
  header: "linux/clk-provider.h"
  icon: "🏭"
  kernel_version: "3.4+"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  registration:
    # 旧 API（返回 struct clk *）
    - pattern: 'clk_register\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<hw>[^)]+)\s*\)'
      description: "注册时钟（旧 API）"
      context: "process"
      can_sleep: true
      deprecated: true
    - pattern: 'clk_unregister\s*\(\s*(?P<clk>[^)]+)\s*\)'
      description: "注销时钟（旧 API）"
      context: "process"
      can_sleep: true
      deprecated: true

    # 新 API（返回 struct clk_hw *）
    - pattern: 'clk_hw_register\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<hw>[^)]+)\s*\)'
      description: "注册时钟硬件（新 API）"
      context: "process"
      can_sleep: true
    - pattern: 'clk_hw_unregister\s*\(\s*(?P<hw>[^)]+)\s*\)'
      description: "注销时钟硬件"
      context: "process"
      can_sleep: true
    - pattern: 'devm_clk_hw_register\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<hw>[^)]+)\s*\)'
      description: "设备管理的时钟硬件注册"
      context: "process"
      can_sleep: true

    # 设备树提供者
    - pattern: 'of_clk_add_provider\s*\(\s*(?P<np>[^,]+)\s*,\s*(?P<clk_src_get>[^,]+)\s*,\s*(?P<data>[^)]+)\s*\)'
      description: "添加设备树时钟提供者"
      context: "process"
      can_sleep: true
    - pattern: 'of_clk_add_hw_provider\s*\(\s*(?P<np>[^,]+)\s*,\s*(?P<get>[^,]+)\s*,\s*(?P<data>[^)]+)\s*\)'
      description: "添加设备树时钟硬件提供者"
      context: "process"
      can_sleep: true
    - pattern: 'of_clk_del_provider\s*\(\s*(?P<np>[^)]+)\s*\)'
      description: "删除设备树时钟提供者"
      context: "process"
      can_sleep: true
    - pattern: 'devm_of_clk_add_hw_provider\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<get>[^,]+)\s*,\s*(?P<data>[^)]+)\s*\)'
      description: "设备管理的设备树提供者添加"
      context: "process"
      can_sleep: true

    # 常用获取函数
    - pattern: 'of_clk_hw_simple_get\s*\('
      description: "简单时钟硬件获取"
    - pattern: 'of_clk_hw_onecell_get\s*\('
      description: "单元格时钟硬件获取"


# ============================================================
# CLK_HW STRUCTURE
# ============================================================

clk_hw:
  description: "Clock Hardware Structure - 时钟硬件结构体"
  header: "linux/clk-provider.h"

  structure:
    pattern: 'struct\s+clk_hw\s+(?P<name>\w+)\s*;'
    description: "时钟硬件句柄"

  fields:
    - name: "core"
      type: "struct clk_core *"
      description: "时钟核心（私有）"
    - name: "clk"
      type: "struct clk *"
      description: "关联的 clk 结构（已弃用）"
    - name: "init"
      type: "const struct clk_init_data *"
      description: "初始化数据"


# ============================================================
# CLK_INIT_DATA STRUCTURE
# ============================================================

clk_init_data:
  description: "Clock Init Data - 时钟初始化数据"
  header: "linux/clk-provider.h"

  structure:
    pattern: '\.init\s*=\s*&?\s*(?P<name>\w+)'
    description: "时钟初始化数据引用"

  fields:
    - name: "name"
      type: "const char *"
      description: "时钟名称"
    - name: "ops"
      type: "const struct clk_ops *"
      description: "操作函数"
    - name: "parent_names"
      type: "const char * const *"
      description: "父时钟名称数组"
    - name: "parent_data"
      type: "const struct clk_parent_data *"
      description: "父时钟数据数组（推荐）"
    - name: "parent_hws"
      type: "const struct clk_hw **"
      description: "父时钟硬件数组"
    - name: "num_parents"
      type: "u8"
      description: "父时钟数量"
    - name: "flags"
      type: "unsigned long"
      description: "时钟标志"


# ============================================================
# CLK_OPS STRUCTURE
# ============================================================

clk_ops:
  description: "Clock Operations - 时钟操作函数"
  header: "linux/clk-provider.h"

  structure:
    pattern: 'static\s+(?:const\s+)?struct\s+clk_ops\s+(?P<name>\w+)\s*=\s*\{'
    description: "时钟操作结构体定义"

  callbacks:
    # 准备/使能
    prepare:
      pattern: '\.prepare\s*=\s*(?P<handler>\w+)'
      description: "准备时钟（可睡眠阶段）"
      signature: "int (*)(struct clk_hw *hw)"
      context: "process"
      can_sleep: true
      return_value:
        success: "0"
        failure: "-ERRNO"
      typical_actions:
        - "使能 PLL 并等待锁定"
        - "配置时钟源"
        - "申请资源"

    unprepare:
      pattern: '\.unprepare\s*=\s*(?P<handler>\w+)'
      description: "取消准备时钟"
      signature: "void (*)(struct clk_hw *hw)"
      context: "process"
      can_sleep: true

    is_prepared:
      pattern: '\.is_prepared\s*=\s*(?P<handler>\w+)'
      description: "检查时钟是否已准备"
      signature: "int (*)(struct clk_hw *hw)"
      context: "any"
      can_sleep: false

    unprepare_unused:
      pattern: '\.unprepare_unused\s*=\s*(?P<handler>\w+)'
      description: "取消准备未使用的时钟"
      signature: "void (*)(struct clk_hw *hw)"
      context: "process"
      can_sleep: true

    enable:
      pattern: '\.enable\s*=\s*(?P<handler>\w+)'
      description: "使能时钟（不可睡眠阶段）"
      signature: "int (*)(struct clk_hw *hw)"
      context: "any"
      can_sleep: false
      return_value:
        success: "0"
        failure: "-ERRNO"
      typical_actions:
        - "设置门控寄存器位"
        - "快速启动时钟输出"

    disable:
      pattern: '\.disable\s*=\s*(?P<handler>\w+)'
      description: "禁用时钟"
      signature: "void (*)(struct clk_hw *hw)"
      context: "any"
      can_sleep: false

    is_enabled:
      pattern: '\.is_enabled\s*=\s*(?P<handler>\w+)'
      description: "检查时钟是否使能"
      signature: "int (*)(struct clk_hw *hw)"
      context: "any"
      can_sleep: false

    disable_unused:
      pattern: '\.disable_unused\s*=\s*(?P<handler>\w+)'
      description: "禁用未使用的时钟"
      signature: "void (*)(struct clk_hw *hw)"
      context: "any"
      can_sleep: false

    # 频率操作
    recalc_rate:
      pattern: '\.recalc_rate\s*=\s*(?P<handler>\w+)'
      description: "重新计算时钟频率"
      signature: "unsigned long (*)(struct clk_hw *hw, unsigned long parent_rate)"
      context: "any"
      can_sleep: false
      return_value:
        success: "计算出的频率 (Hz)"
      typical_actions:
        - "读取分频器寄存器"
        - "计算 PLL 输出频率"
        - "根据父频率和配置计算输出"

    round_rate:
      pattern: '\.round_rate\s*=\s*(?P<handler>\w+)'
      description: "舍入到最接近的可用频率"
      signature: "long (*)(struct clk_hw *hw, unsigned long rate, unsigned long *parent_rate)"
      context: "any"
      can_sleep: false
      return_value:
        success: "舍入后的频率 (Hz)"
        failure: "<0"

    determine_rate:
      pattern: '\.determine_rate\s*=\s*(?P<handler>\w+)'
      description: "确定最佳频率（推荐替代 round_rate）"
      signature: "int (*)(struct clk_hw *hw, struct clk_rate_request *req)"
      context: "any"
      can_sleep: false

    set_rate:
      pattern: '\.set_rate\s*=\s*(?P<handler>\w+)'
      description: "设置时钟频率"
      signature: "int (*)(struct clk_hw *hw, unsigned long rate, unsigned long parent_rate)"
      context: "process"
      can_sleep: true
      typical_actions:
        - "配置分频器寄存器"
        - "设置 PLL 乘除因子"

    set_rate_and_parent:
      pattern: '\.set_rate_and_parent\s*=\s*(?P<handler>\w+)'
      description: "同时设置频率和父时钟"
      signature: "int (*)(struct clk_hw *hw, unsigned long rate, unsigned long parent_rate, u8 index)"
      context: "process"
      can_sleep: true

    # 父时钟操作
    get_parent:
      pattern: '\.get_parent\s*=\s*(?P<handler>\w+)'
      description: "获取当前父时钟索引"
      signature: "u8 (*)(struct clk_hw *hw)"
      context: "any"
      can_sleep: false
      return_value:
        success: "父时钟索引"
        error: ">num_parents 表示无效"

    set_parent:
      pattern: '\.set_parent\s*=\s*(?P<handler>\w+)'
      description: "设置父时钟"
      signature: "int (*)(struct clk_hw *hw, u8 index)"
      context: "process"
      can_sleep: true

    # 精度操作
    recalc_accuracy:
      pattern: '\.recalc_accuracy\s*=\s*(?P<handler>\w+)'
      description: "重新计算时钟精度"
      signature: "unsigned long (*)(struct clk_hw *hw, unsigned long parent_accuracy)"
      context: "any"
      can_sleep: false

    # 相位操作
    get_phase:
      pattern: '\.get_phase\s*=\s*(?P<handler>\w+)'
      description: "获取时钟相位"
      signature: "int (*)(struct clk_hw *hw)"
      context: "any"
      can_sleep: false
      return_value:
        success: "相位 (度)"
        failure: "<0"

    set_phase:
      pattern: '\.set_phase\s*=\s*(?P<handler>\w+)'
      description: "设置时钟相位"
      signature: "int (*)(struct clk_hw *hw, int degrees)"
      context: "process"
      can_sleep: true

    # 占空比操作
    get_duty_cycle:
      pattern: '\.get_duty_cycle\s*=\s*(?P<handler>\w+)'
      description: "获取占空比"
      signature: "int (*)(struct clk_hw *hw, struct clk_duty *duty)"
      context: "any"
      can_sleep: false

    set_duty_cycle:
      pattern: '\.set_duty_cycle\s*=\s*(?P<handler>\w+)'
      description: "设置占空比"
      signature: "int (*)(struct clk_hw *hw, struct clk_duty *duty)"
      context: "process"
      can_sleep: true

    # 初始化/调试
    init:
      pattern: '\.init\s*=\s*(?P<handler>\w+)'
      description: "时钟初始化回调"
      signature: "void (*)(struct clk_hw *hw)"
      context: "process"
      can_sleep: true

    debug_init:
      pattern: '\.debug_init\s*=\s*(?P<handler>\w+)'
      description: "调试文件系统初始化"
      signature: "int (*)(struct clk_hw *hw, struct dentry *dentry)"
      context: "process"
      can_sleep: true


# ============================================================
# CLOCK FLAGS
# ============================================================

clk_flags:
  description: "Clock Flags - 时钟标志"
  header: "linux/clk-provider.h"

  constants:
    CLK_SET_RATE_GATE:
      description: "设置频率时必须先禁用时钟"
    CLK_SET_PARENT_GATE:
      description: "设置父时钟时必须先禁用时钟"
    CLK_SET_RATE_PARENT:
      description: "频率变化传播到父时钟"
    CLK_IGNORE_UNUSED:
      description: "不要在启动时禁用未使用的时钟"
    CLK_IS_BASIC:
      description: "已弃用，不要使用"
    CLK_GET_RATE_NOCACHE:
      description: "每次都重新计算频率"
    CLK_SET_RATE_NO_REPARENT:
      description: "设置频率时不要改变父时钟"
    CLK_GET_ACCURACY_NOCACHE:
      description: "每次都重新计算精度"
    CLK_RECALC_NEW_RATES:
      description: "重新计算所有子时钟频率"
    CLK_SET_RATE_UNGATE:
      description: "设置频率时先使能后禁用"
    CLK_IS_CRITICAL:
      description: "关键时钟，不能禁用"
    CLK_OPS_PARENT_ENABLE:
      description: "操作前需要使能父时钟"
    CLK_DUTY_CYCLE_PARENT:
      description: "占空比来自父时钟"


# ============================================================
# BASIC CLOCK TYPES
# ============================================================

# 固定频率时钟
clk_fixed_rate:
  description: "Fixed Rate Clock - 固定频率时钟"
  header: "linux/clk-provider.h"

  structure:
    pattern: 'struct\s+clk_fixed_rate\s+(?P<name>\w+)'
    description: "固定频率时钟结构体"

  fields:
    - name: "hw"
      type: "struct clk_hw"
      description: "时钟硬件句柄"
    - name: "fixed_rate"

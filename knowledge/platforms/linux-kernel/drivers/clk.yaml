      description: "获取设备树中的父时钟名称"


# ============================================================
# CALL CHAINS
# ============================================================

call_chains:
  clk_prepare_enable_flow:
    description: "时钟准备和使能调用链"
    trigger: "消费者调用 clk_prepare_enable()"
    chain:
      - function: "clk_prepare_enable"
        file: "drivers/clk/clk.c"
        description: "组合 API 入口"
        context: "process"
      - function: "clk_prepare"
        file: "drivers/clk/clk.c"
        description: "准备阶段（可睡眠）"
      - function: "clk_core_prepare"
        file: "drivers/clk/clk.c"
        description: "递归准备父时钟"
      - function: "clk_core_prepare_lock"
        file: "drivers/clk/clk.c"
        description: "获取锁并准备"
      - function: "ops->prepare"
        file: "驱动代码"
        description: "调用驱动准备回调"
        is_user_entry: true
      - function: "clk_enable"
        file: "drivers/clk/clk.c"
        description: "使能阶段（不可睡眠）"
      - function: "clk_core_enable"
        file: "drivers/clk/clk.c"
        description: "递归使能父时钟"
      - function: "ops->enable"
        file: "驱动代码"
        description: "调用驱动使能回调"
        is_user_entry: true

  clk_set_rate_flow:
    description: "时钟频率设置调用链"
    trigger: "消费者调用 clk_set_rate()"
    chain:
      - function: "clk_set_rate"
        file: "drivers/clk/clk.c"
        description: "设置频率 API 入口"
        context: "process"
      - function: "clk_core_set_rate_nolock"
        file: "drivers/clk/clk.c"
        description: "无锁设置频率"
      - function: "clk_calc_new_rates"
        file: "drivers/clk/clk.c"
        description: "计算新频率树"
      - function: "clk_change_rate"
        file: "drivers/clk/clk.c"
        description: "应用频率变化"
      - function: "ops->set_rate"
        file: "驱动代码"
        description: "调用驱动设置频率回调"
        is_user_entry: true
      - function: "ops->recalc_rate"
        file: "驱动代码"
        description: "重新计算实际频率"
        is_user_entry: true

  clk_register_flow:
    description: "时钟注册调用链"
    trigger: "提供者调用 clk_hw_register()"
    chain:
      - function: "clk_hw_register"
        file: "drivers/clk/clk.c"
        description: "注册 API 入口"
        context: "process"
      - function: "__clk_core_init"
        file: "drivers/clk/clk.c"
        description: "初始化时钟核心"
      - function: "clk_core_reparent_orphans"
        file: "drivers/clk/clk.c"
        description: "处理孤儿时钟"
      - function: "ops->init"
        file: "驱动代码"
        description: "调用驱动初始化回调"
        is_user_entry: true


# ============================================================
# EXAMPLES
# ============================================================

examples:
  - description: "消费者基本使用"
    kernel_version: "4.0+"
    code: |
      #include <linux/clk.h>
      
      static struct clk *clk_main;
      static struct clk *clk_bus;
      
      static int my_probe(struct platform_device *pdev)
      {
          int ret;
          
          /* 获取时钟 */
          clk_main = devm_clk_get(&pdev->dev, "main");
          if (IS_ERR(clk_main)) {
              dev_err(&pdev->dev, "Failed to get main clock\n");
              return PTR_ERR(clk_main);
          }
          
          clk_bus = devm_clk_get_optional(&pdev->dev, "bus");
          if (IS_ERR(clk_bus)) {
              dev_err(&pdev->dev, "Failed to get bus clock\n");
              return PTR_ERR(clk_bus);
          }
          
          /* 设置频率 */
          ret = clk_set_rate(clk_main, 100000000); /* 100 MHz */
          if (ret) {
              dev_err(&pdev->dev, "Failed to set rate\n");
              return ret;
          }
          
          /* 准备并使能时钟 */
          ret = clk_prepare_enable(clk_main);
          if (ret) {
              dev_err(&pdev->dev, "Failed to enable main clock\n");
              return ret;
          }
          
          if (clk_bus) {
              ret = clk_prepare_enable(clk_bus);
              if (ret) {
                  clk_disable_unprepare(clk_main);
                  return ret;
              }
          }
          
          dev_info(&pdev->dev, "Main clock rate: %lu Hz\n",
                   clk_get_rate(clk_main));
          
          return 0;
      }
      
      static int my_remove(struct platform_device *pdev)
      {
          if (clk_bus)
              clk_disable_unprepare(clk_bus);
          clk_disable_unprepare(clk_main);
          return 0;
      }

  - description: "批量时钟操作"
    kernel_version: "4.9+"
    code: |
      #include <linux/clk.h>
      
      static struct clk_bulk_data clocks[] = {
          { .id = "core" },
          { .id = "bus" },
          { .id = "phy" },
      };
      
      static int my_probe(struct platform_device *pdev)
      {
          int ret;
          
          /* 批量获取时钟 */
          ret = devm_clk_bulk_get(&pdev->dev,
                                  ARRAY_SIZE(clocks), clocks);
          if (ret) {
              dev_err(&pdev->dev, "Failed to get clocks\n");
              return ret;
          }
          
          /* 批量使能 */
          ret = clk_bulk_prepare_enable(ARRAY_SIZE(clocks), clocks);
          if (ret) {
              dev_err(&pdev->dev, "Failed to enable clocks\n");
              return ret;
          }
          
          return 0;
      }
      
      static int my_remove(struct platform_device *pdev)
      {
          clk_bulk_disable_unprepare(ARRAY_SIZE(clocks), clocks);
          return 0;
      }

  - description: "时钟提供者驱动（门控时钟）"
    kernel_version: "4.0+"
    code: |
      #include <linux/clk-provider.h>
      #include <linux/of.h>
      
      struct my_clk_priv {
          void __iomem *base;
          spinlock_t lock;
          struct clk_hw_onecell_data *clk_data;
      };
      
      static int my_clk_probe(struct platform_device *pdev)
      {
          struct device *dev = &pdev->dev;
          struct device_node *np = dev->of_node;
          struct my_clk_priv *priv;
          struct clk_hw *hw;
          int ret;
          
          priv = devm_kzalloc(dev, sizeof(*priv), GFP_KERNEL);
          if (!priv)
              return -ENOMEM;
          
          priv->base = devm_platform_ioremap_resource(pdev, 0);
          if (IS_ERR(priv->base))
              return PTR_ERR(priv->base);
          
          spin_lock_init(&priv->lock);
          
          priv->clk_data = devm_kzalloc(dev,
              struct_size(priv->clk_data, hws, 3), GFP_KERNEL);
          if (!priv->clk_data)
              return -ENOMEM;
          priv->clk_data->num = 3;
          
          /* 注册门控时钟 */
          hw = devm_clk_hw_register_gate(dev, "clk_a", "osc24m",
                                         0, priv->base + 0x10, 0,
                                         0, &priv->lock);
          if (IS_ERR(hw))
              return PTR_ERR(hw);
          priv->clk_data->hws[0] = hw;
          
          hw = devm_clk_hw_register_gate(dev, "clk_b", "osc24m",
                                         0, priv->base + 0x10, 1,
                                         0, &priv->lock);
          if (IS_ERR(hw))
              return PTR_ERR(hw);
          priv->clk_data->hws[1] = hw;
          
          hw = devm_clk_hw_register_gate(dev, "clk_c", "osc24m",
                                         0, priv->base + 0x10, 2,
                                         0, &priv->lock);
          if (IS_ERR(hw))
              return PTR_ERR(hw);
          priv->clk_data->hws[2] = hw;
          
          /* 注册为设备树提供者 */
          ret = devm_of_clk_add_hw_provider(dev, of_clk_hw_onecell_get,
                                            priv->clk_data);
          if (ret) {
              dev_err(dev, "Failed to add clock provider\n");
              return ret;
          }
          
          return 0;
      }

  - description: "自定义时钟实现"
    kernel_version: "4.0+"
    code: |
      #include <linux/clk-provider.h>
      
      struct my_pll {
          struct clk_hw hw;
          void __iomem *reg;
          spinlock_t *lock;
      };
      
      #define to_my_pll(_hw) container_of(_hw, struct my_pll, hw)
      
      static int my_pll_prepare(struct clk_hw *hw)
      {
          struct my_pll *pll = to_my_pll(hw);
          u32 val;
          
          /* 使能 PLL */
          val = readl(pll->reg);
          val |= BIT(31);  /* PLL enable bit */
          writel(val, pll->reg);
          
          /* 等待锁定 */
          return readl_poll_timeout(pll->reg, val,
                                    val & BIT(28), 10, 1000);
      }
      
      static void my_pll_unprepare(struct clk_hw *hw)
      {
          struct my_pll *pll = to_my_pll(hw);
          u32 val;
          
          val = readl(pll->reg);
          val &= ~BIT(31);
          writel(val, pll->reg);
      }
      
      static unsigned long my_pll_recalc_rate(struct clk_hw *hw,
                                              unsigned long parent_rate)
      {
          struct my_pll *pll = to_my_pll(hw);
          u32 val, mult, div;
          
          val = readl(pll->reg);
          mult = (val >> 8) & 0x7f;
          div = val & 0x1f;
          
          return parent_rate * mult / div;
      }
      
      static int my_pll_set_rate(struct clk_hw *hw, unsigned long rate,
                                 unsigned long parent_rate)
      {
          struct my_pll *pll = to_my_pll(hw);
          u32 val, mult, div;
          unsigned long flags;
          
          /* 计算乘除因子 */
          div = 1;
          mult = rate / parent_rate;
          
          spin_lock_irqsave(pll->lock, flags);
          
          val = readl(pll->reg);
          val &= ~(0x7f << 8 | 0x1f);
          val |= (mult << 8) | div;
          writel(val, pll->reg);
          
          spin_unlock_irqrestore(pll->lock, flags);
          
          return 0;
      }
      
      static const struct clk_ops my_pll_ops = {
          .prepare     = my_pll_prepare,
          .unprepare   = my_pll_unprepare,
          .recalc_rate = my_pll_recalc_rate,
          .set_rate    = my_pll_set_rate,
      };
      
      static struct clk_hw *my_pll_register(struct device *dev,
                                            const char *name,
                                            const char *parent_name,
                                            void __iomem *reg,
                                            spinlock_t *lock)
      {
          struct my_pll *pll;
          struct clk_init_data init = {};
          int ret;
          
          pll = devm_kzalloc(dev, sizeof(*pll), GFP_KERNEL);
          if (!pll)
              return ERR_PTR(-ENOMEM);
          
          init.name = name;
          init.ops = &my_pll_ops;
          init.parent_names = &parent_name;
          init.num_parents = 1;
          init.flags = CLK_SET_RATE_GATE;
          
          pll->reg = reg;
          pll->lock = lock;
          pll->hw.init = &init;
          
          ret = devm_clk_hw_register(dev, &pll->hw);
          if (ret)
              return ERR_PTR(ret);
          
          return &pll->hw;
      }

  - description: "设备树配置示例"
    kernel_version: "4.0+"

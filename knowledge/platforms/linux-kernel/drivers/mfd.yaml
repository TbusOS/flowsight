# Linux Kernel MFD (Multi-Function Device) Driver Framework Knowledge Base
#
# Reference: https://www.kernel.org/doc/html/latest/driver-api/mfd.html
# Kernel Version: 5.0+

# ============================================================
# MFD CORE
# ============================================================

mfd_core:
  description: "MFD Core - 多功能设备核心框架，用于管理集成多个功能的芯片"
  header: "linux/mfd/core.h"
  icon: "🔌"
  kernel_version: "2.6.27+"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  overview: |
    MFD (Multi-Function Device) 框架用于管理集成多个功能单元的芯片，
    如 PMIC (电源管理芯片)、音频编解码器、触摸屏控制器等。
    
    典型使用场景:
    - 一个 I2C/SPI 芯片包含 GPIO、ADC、LED 控制器、看门狗等
    - 父驱动负责总线通信和共享资源
    - 子设备驱动专注于各自的功能
    
    架构:
    +-------------------+
    |   MFD 父驱动      |  (I2C/SPI/Platform)
    |  (初始化、regmap) |
    +--------+----------+
             |
    +--------v----------+
    |   mfd_add_devices |
    +--------+----------+
             |
    +--------+----------+----------+-----------+
    |        |          |          |           |
    v        v          v          v           v
    GPIO    ADC       LED       WDT       Regulator
    驱动    驱动      驱动      驱动        驱动

  registration:
    # 添加子设备
    - pattern: 'mfd_add_devices\s*\(\s*(?P<parent>[^,]+)\s*,\s*(?P<id>[^,]+)\s*,\s*(?P<cells>[^,]+)\s*,\s*(?P<n_devs>[^,]+)\s*,\s*(?P<mem_base>[^,]+)\s*,\s*(?P<irq_base>[^,]+)\s*,\s*(?P<irq_domain>[^)]+)\s*\)'
      description: "添加 MFD 子设备"
      context: "process"
      can_sleep: true

    - pattern: 'devm_mfd_add_devices\s*\(\s*(?P<parent>[^,]+)\s*,\s*(?P<id>[^,]+)\s*,\s*(?P<cells>[^,]+)\s*,\s*(?P<n_devs>[^,]+)\s*,\s*(?P<mem_base>[^,]+)\s*,\s*(?P<irq_base>[^,]+)\s*,\s*(?P<irq_domain>[^)]+)\s*\)'
      description: "devm 版本: 添加 MFD 子设备"
      context: "process"
      can_sleep: true

    # 移除子设备
    - pattern: 'mfd_remove_devices\s*\(\s*&?(?P<parent>[\w\.\->]+)\s*\)'
      description: "移除 MFD 子设备"
      context: "process"
      can_sleep: true

    - pattern: 'mfd_remove_devices_late\s*\(\s*&?(?P<parent>[\w\.\->]+)\s*\)'
      description: "延迟移除 MFD 子设备"
      context: "process"

    # 新式 API (5.0+)
    - pattern: 'mfd_add_hotplug_devices\s*\(\s*(?P<parent>[^,]+)\s*,\s*(?P<cells>[^,]+)\s*,\s*(?P<n_devs>[^)]+)\s*\)'
      description: "添加可热插拔的 MFD 子设备"
      context: "process"

  parameters:
    mfd_add_devices:
      - name: "parent"
        type: "struct device *"
        description: "父设备 (MFD 驱动的 device)"
      - name: "id"
        type: "int"
        description: "设备实例 ID (-1 自动分配, PLATFORM_DEVID_AUTO)"
      - name: "cells"
        type: "const struct mfd_cell *"
        description: "子设备定义数组"
      - name: "n_devs"
        type: "int"
        description: "子设备数量"
      - name: "mem_base"
        type: "struct resource *"
        description: "内存资源基地址 (可为 NULL)"
      - name: "irq_base"
        type: "int"
        description: "中断基址 (可为 0)"
      - name: "irq_domain"
        type: "struct irq_domain *"
        description: "中断域 (可为 NULL)"


# ============================================================
# MFD CELL
# ============================================================

mfd_cell:
  description: "MFD Cell - MFD 子设备定义结构"
  header: "linux/mfd/core.h"

  patterns:
    # 结构体定义
    - pattern: 'static\s+(const\s+)?struct mfd_cell\s+(?P<name>\w+)\s*\[\]\s*='
      description: "MFD 子设备数组定义"

    # MFD_CELL_* 宏
    - pattern: 'MFD_CELL_BASIC\s*\(\s*(?P<name>[^,]+)\s*,\s*(?P<res>[^,]+)\s*,\s*(?P<pdata>[^,]+)\s*,\s*(?P<pdsize>[^,]+)\s*,\s*(?P<id>[^)]+)\s*\)'
      description: "基本 MFD cell 定义宏"

    - pattern: 'MFD_CELL_OF\s*\(\s*(?P<name>[^,]+)\s*,\s*(?P<res>[^,]+)\s*,\s*(?P<pdata>[^,]+)\s*,\s*(?P<pdsize>[^,]+)\s*,\s*(?P<id>[^,]+)\s*,\s*(?P<of_compat>[^)]+)\s*\)'
      description: "带设备树 compatible 的 MFD cell"

    - pattern: 'MFD_CELL_ACPI\s*\(\s*(?P<name>[^,]+)\s*,\s*(?P<res>[^,]+)\s*,\s*(?P<pdata>[^,]+)\s*,\s*(?P<pdsize>[^,]+)\s*,\s*(?P<id>[^,]+)\s*,\s*(?P<acpi_match>[^)]+)\s*\)'
      description: "带 ACPI 匹配的 MFD cell"

    - pattern: 'MFD_CELL_RES\s*\(\s*(?P<name>[^,]+)\s*,\s*(?P<res>[^)]+)\s*\)'
      description: "只有资源的简化 MFD cell"

    - pattern: 'MFD_CELL_NAME\s*\(\s*(?P<name>[^)]+)\s*\)'
      description: "只有名称的最简 MFD cell"

  structure:
    fields:
      - name: "name"
        type: "const char *"
        description: "子设备名称 (用于驱动匹配)"
      - name: "id"
        type: "int"
        description: "设备实例 ID"
      - name: "level"
        type: "int"
        description: "子设备层级 (影响 probe 顺序)"
      - name: "of_compatible"
        type: "const char *"
        description: "设备树 compatible 字符串"
      - name: "of_reg"
        type: "u64"
        description: "设备树 reg 属性"
      - name: "use_of_reg"
        type: "bool"
        description: "是否使用 of_reg"
      - name: "acpi_match"
        type: "const struct mfd_cell_acpi_match *"
        description: "ACPI 匹配信息"
      - name: "platform_data"
        type: "void *"
        description: "传递给子设备的平台数据"
      - name: "pdata_size"
        type: "size_t"
        description: "平台数据大小"
      - name: "properties"
        type: "const struct property_entry *"
        description: "设备属性"
      - name: "num_resources"
        type: "size_t"
        description: "资源数量"
      - name: "resources"
        type: "const struct resource *"
        description: "资源数组 (IRQ, MEM)"
      - name: "ignore_resource_conflicts"
        type: "bool"
        description: "忽略资源冲突"
      - name: "enable"
        type: "int (*)(struct platform_device *)"
        description: "子设备使能回调"
      - name: "disable"
        type: "int (*)(struct platform_device *)"
        description: "子设备禁用回调"
      - name: "suspend"
        type: "int (*)(struct platform_device *)"
        description: "子设备挂起回调"
      - name: "resume"
        type: "int (*)(struct platform_device *)"
        description: "子设备恢复回调"


# ============================================================
# MFD RESOURCE
# ============================================================

mfd_resource:
  description: "MFD Resources - MFD 资源定义"
  header: "linux/ioport.h"

  patterns:
    # 资源定义
    - pattern: 'static\s+(const\s+)?struct resource\s+(?P<name>\w+)\s*\[\]\s*='
      description: "资源数组定义"

    # DEFINE_RES_* 宏
    - pattern: 'DEFINE_RES_IRQ\s*\(\s*(?P<irq>[^)]+)\s*\)'
      description: "定义 IRQ 资源"

    - pattern: 'DEFINE_RES_IRQ_NAMED\s*\(\s*(?P<irq>[^,]+)\s*,\s*(?P<name>[^)]+)\s*\)'
      description: "定义命名 IRQ 资源"

    - pattern: 'DEFINE_RES_MEM\s*\(\s*(?P<start>[^,]+)\s*,\s*(?P<size>[^)]+)\s*\)'
      description: "定义内存资源"

    - pattern: 'DEFINE_RES_MEM_NAMED\s*\(\s*(?P<start>[^,]+)\s*,\s*(?P<size>[^,]+)\s*,\s*(?P<name>[^)]+)\s*\)'
      description: "定义命名内存资源"

    - pattern: 'DEFINE_RES_IO\s*\(\s*(?P<start>[^,]+)\s*,\s*(?P<size>[^)]+)\s*\)'
      description: "定义 IO 端口资源"

  resource_types:
    - name: "IORESOURCE_IRQ"
      description: "中断资源"
    - name: "IORESOURCE_MEM"
      description: "内存映射资源"
    - name: "IORESOURCE_IO"
      description: "IO 端口资源"
    - name: "IORESOURCE_REG"
      description: "寄存器资源"


# ============================================================
# REGMAP INTEGRATION
# ============================================================

regmap_integration:
  description: "Regmap Integration - MFD 与 regmap 集成"
  header: "linux/regmap.h"

  overview: |
    大多数 MFD 驱动使用 regmap 进行寄存器访问。
    父驱动创建 regmap，子驱动通过 dev_get_regmap() 获取。

  patterns:
    # 父驱动创建 regmap
    - pattern: 'devm_regmap_init_i2c\s*\(\s*(?P<client>[^,]+)\s*,\s*(?P<config>[^)]+)\s*\)'
      description: "为 I2C MFD 创建 regmap"
      context: "process"

    - pattern: 'devm_regmap_init_spi\s*\(\s*(?P<spi>[^,]+)\s*,\s*(?P<config>[^)]+)\s*\)'
      description: "为 SPI MFD 创建 regmap"
      context: "process"

    - pattern: 'devm_regmap_init_mmio\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<regs>[^,]+)\s*,\s*(?P<config>[^)]+)\s*\)'
      description: "为 MMIO MFD 创建 regmap"
      context: "process"

    # 子驱动获取 regmap
    - pattern: 'dev_get_regmap\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<name>[^)]+)\s*\)'
      description: "子驱动获取父驱动的 regmap"
      context: "process"

  parent_driver_pattern: |
    /* 父驱动设置 regmap */
    priv->regmap = devm_regmap_init_i2c(client, &config);
    dev_set_drvdata(&client->dev, priv);
    
    /* 子驱动自动继承 regmap */
    mfd_add_devices(&client->dev, ...);

  child_driver_pattern: |
    /* 子驱动获取 regmap */
    struct regmap *regmap = dev_get_regmap(dev->parent, NULL);


# ============================================================
# IRQ DOMAIN INTEGRATION
# ============================================================

irq_domain_integration:
  description: "IRQ Domain Integration - MFD 中断域集成"
  header: "linux/irqdomain.h"

  overview: |
    MFD 设备通常有一个主中断，需要在父驱动中解复用 (demux)。
    使用 regmap-irq 简化中断处理。

  patterns:
    # regmap-irq 初始化
    - pattern: 'devm_regmap_add_irq_chip\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<regmap>[^,]+)\s*,\s*(?P<irq>[^,]+)\s*,\s*(?P<irq_flags>[^,]+)\s*,\s*(?P<irq_base>[^,]+)\s*,\s*(?P<chip>[^,]+)\s*,\s*(?P<data>[^)]+)\s*\)'
      description: "添加 regmap IRQ 芯片"
      context: "process"

    - pattern: 'regmap_irq_get_domain\s*\(\s*(?P<data>[^)]+)\s*\)'
      description: "获取 IRQ 域"
      context: "any"

    - pattern: 'regmap_irq_get_virq\s*\(\s*(?P<data>[^,]+)\s*,\s*(?P<irq>[^)]+)\s*\)'
      description: "获取虚拟 IRQ 号"
      context: "any"

    # 传递给子设备
    - pattern: 'platform_get_irq\s*\(\s*(?P<pdev>[^,]+)\s*,\s*(?P<num>\d+)\s*\)'
      description: "子设备获取映射后的 IRQ"
      context: "process"

    - pattern: 'platform_get_irq_byname\s*\(\s*(?P<pdev>[^,]+)\s*,\s*(?P<name>[^)]+)\s*\)'
      description: "子设备按名称获取 IRQ"
      context: "process"

  regmap_irq_chip_structure:
    fields:
      - name: "name"
        type: "const char *"
        description: "IRQ 芯片名称"
      - name: "status_base"
        type: "unsigned int"
        description: "状态寄存器基址"
      - name: "mask_base"
        type: "unsigned int"
        description: "掩码寄存器基址"
      - name: "ack_base"
        type: "unsigned int"
        description: "确认寄存器基址"
      - name: "wake_base"
        type: "unsigned int"
        description: "唤醒寄存器基址"
      - name: "irq_reg_stride"
        type: "int"
        description: "寄存器步进"
      - name: "num_regs"
        type: "int"
        description: "寄存器数量"
      - name: "irqs"
        type: "const struct regmap_irq *"
        description: "IRQ 描述数组"
      - name: "num_irqs"
        type: "int"
        description: "IRQ 数量"


# ============================================================
# CALL CHAINS
# ============================================================

call_chains:
  parent_probe_path:
    description: "MFD 父驱动 probe 路径"
    trigger: "总线驱动匹配"
    chain:
      - function: "i2c_device_probe / spi_drv_probe"
        file: "drivers/i2c/i2c-core.c / drivers/spi/spi.c"
        description: "总线探测入口"
      - function: "mfd_probe()"
        file: "用户代码"
        description: "父驱动 probe"
        is_user_entry: true
      - function: "devm_regmap_init_*()"
        file: "drivers/base/regmap/"
        description: "初始化 regmap"
      - function: "devm_regmap_add_irq_chip()"
        file: "drivers/base/regmap/regmap-irq.c"
        description: "设置 IRQ 域"
      - function: "mfd_add_devices()"
        file: "drivers/mfd/mfd-core.c"
        description: "添加子设备"
      - function: "mfd_add_device()"
        file: "drivers/mfd/mfd-core.c"
        description: "添加单个子设备"
      - function: "platform_device_add()"
        file: "drivers/base/platform.c"
        description: "添加 platform device"

  child_probe_path:
    description: "MFD 子设备 probe 路径"
    trigger: "子设备与驱动匹配"
    chain:
      - function: "platform_match()"
        file: "drivers/base/platform.c"
        description: "匹配子设备驱动"
      - function: "platform_probe()"
        file: "drivers/base/platform.c"
        description: "platform 探测"
      - function: "child_probe()"
        file: "用户代码"
        description: "子设备 probe"
        is_user_entry: true
      - function: "dev_get_regmap()"
        file: "drivers/base/regmap/regmap.c"
        description: "获取父驱动 regmap"
      - function: "platform_get_irq()"
        file: "drivers/base/platform.c"
        description: "获取映射后 IRQ"

  remove_path:
    description: "MFD 移除路径"
    trigger: "父设备移除或驱动卸载"
    chain:
      - function: "mfd_remove()"
        file: "用户代码"
        description: "父驱动 remove"
        is_user_entry: true
      - function: "mfd_remove_devices()"
        file: "drivers/mfd/mfd-core.c"
        description: "移除所有子设备"
      - function: "platform_device_unregister()"
        file: "drivers/base/platform.c"
        description: "注销 platform device"
      - function: "child_remove()"
        file: "子设备驱动"
        description: "子设备 remove"


# ============================================================
# HELPER FUNCTIONS
# ============================================================

helper_functions:
  description: "MFD Helper Functions - MFD 辅助函数"
  header: "linux/mfd/core.h"

  patterns:
    # 获取 MFD cell
    - pattern: 'mfd_get_cell\s*\(\s*(?P<pdev>[^)]+)\s*\)'
      description: "获取 platform_device 对应的 mfd_cell"
      context: "any"

    # 添加单个设备
    - pattern: 'mfd_add_device\s*\(\s*(?P<parent>[^,]+)\s*,\s*(?P<id>[^,]+)\s*,\s*(?P<cell>[^,]+)\s*,\s*(?P<mem_base>[^,]+)\s*,\s*(?P<irq_base>[^,]+)\s*,\s*(?P<domain>[^)]+)\s*\)'
      description: "添加单个 MFD 子设备"
      context: "process"

    # 克隆 cell
    - pattern: 'mfd_clone_cell\s*\(\s*(?P<name>[^,]+)\s*,\s*(?P<clones>[^,]+)\s*,\s*(?P<n_clones>[^)]+)\s*\)'
      description: "克隆 MFD cell"
      context: "process"



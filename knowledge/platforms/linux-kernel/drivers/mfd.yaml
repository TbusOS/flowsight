# ============================================================
# EXAMPLES
# ============================================================

examples:
  - description: "基本 MFD 父驱动 (I2C)"
    kernel_version: "5.0+"
    code: |
      #include <linux/module.h>
      #include <linux/i2c.h>
      #include <linux/mfd/core.h>
      #include <linux/regmap.h>
      
      /* 设备私有数据 */
      struct my_mfd {
          struct device *dev;
          struct regmap *regmap;
          int irq;
      };
      
      /* 子设备资源定义 */
      static const struct resource gpio_resources[] = {
          DEFINE_RES_IRQ_NAMED(0, "gpio"),
      };
      
      static const struct resource adc_resources[] = {
          DEFINE_RES_IRQ_NAMED(1, "adc"),
      };
      
      static const struct resource wdt_resources[] = {
          DEFINE_RES_IRQ_NAMED(2, "wdt"),
      };
      
      /* 子设备定义 */
      static const struct mfd_cell my_mfd_cells[] = {
          {
              .name = "my-mfd-gpio",
              .of_compatible = "vendor,my-mfd-gpio",
              .resources = gpio_resources,
              .num_resources = ARRAY_SIZE(gpio_resources),
          },
          {
              .name = "my-mfd-adc",
              .of_compatible = "vendor,my-mfd-adc",
              .resources = adc_resources,
              .num_resources = ARRAY_SIZE(adc_resources),
          },
          {
              .name = "my-mfd-wdt",
              .of_compatible = "vendor,my-mfd-wdt",
              .resources = wdt_resources,
              .num_resources = ARRAY_SIZE(wdt_resources),
          },
      };
      
      /* regmap 配置 */
      static const struct regmap_config my_regmap_config = {
          .reg_bits = 8,
          .val_bits = 8,
          .max_register = 0xFF,
          .cache_type = REGCACHE_RBTREE,
      };
      
      static int my_mfd_probe(struct i2c_client *client)
      {
          struct my_mfd *mfd;
          int ret;
          
          mfd = devm_kzalloc(&client->dev, sizeof(*mfd), GFP_KERNEL);
          if (!mfd)
              return -ENOMEM;
          
          mfd->dev = &client->dev;
          mfd->irq = client->irq;
          i2c_set_clientdata(client, mfd);
          
          /* 创建 regmap */
          mfd->regmap = devm_regmap_init_i2c(client, &my_regmap_config);
          if (IS_ERR(mfd->regmap)) {
              dev_err(&client->dev, "Failed to init regmap\n");
              return PTR_ERR(mfd->regmap);
          }
          
          /* 初始化硬件 */
          ret = regmap_write(mfd->regmap, REG_CTRL, CTRL_ENABLE);
          if (ret) {
              dev_err(&client->dev, "Failed to enable device\n");
              return ret;
          }
          
          /* 添加子设备 */
          ret = devm_mfd_add_devices(&client->dev, PLATFORM_DEVID_AUTO,
                                     my_mfd_cells, ARRAY_SIZE(my_mfd_cells),
                                     NULL, 0, NULL);
          if (ret) {
              dev_err(&client->dev, "Failed to add MFD devices\n");
              return ret;
          }
          
          dev_info(&client->dev, "MFD device probed\n");
          return 0;
      }
      
      static void my_mfd_remove(struct i2c_client *client)
      {
          struct my_mfd *mfd = i2c_get_clientdata(client);
          
          /* 禁用硬件 */
          regmap_write(mfd->regmap, REG_CTRL, 0);
          /* devm 自动移除子设备 */
      }
      
      static const struct of_device_id my_mfd_of_match[] = {
          { .compatible = "vendor,my-mfd" },
          { }
      };
      MODULE_DEVICE_TABLE(of, my_mfd_of_match);
      
      static const struct i2c_device_id my_mfd_id[] = {
          { "my-mfd", 0 },
          { }
      };
      MODULE_DEVICE_TABLE(i2c, my_mfd_id);
      
      static struct i2c_driver my_mfd_driver = {
          .driver = {
              .name = "my-mfd",
              .of_match_table = my_mfd_of_match,
          },
          .probe = my_mfd_probe,
          .remove = my_mfd_remove,
          .id_table = my_mfd_id,
      };
      module_i2c_driver(my_mfd_driver);
      
      MODULE_LICENSE("GPL");

  - description: "带 IRQ 域的 MFD 驱动"
    kernel_version: "5.0+"
    code: |
      #include <linux/regmap.h>
      #include <linux/mfd/core.h>
      #include <linux/interrupt.h>
      
      /* IRQ 定义 */
      enum my_mfd_irqs {
          MY_MFD_IRQ_GPIO,
          MY_MFD_IRQ_ADC,
          MY_MFD_IRQ_WDT,
          MY_MFD_IRQ_MAX,
      };
      
      /* regmap IRQ 定义 */
      static const struct regmap_irq my_mfd_irqs[] = {
          [MY_MFD_IRQ_GPIO] = {
              .mask = BIT(0),
          },
          [MY_MFD_IRQ_ADC] = {
              .mask = BIT(1),
          },
          [MY_MFD_IRQ_WDT] = {
              .mask = BIT(2),
          },
      };
      
      static const struct regmap_irq_chip my_mfd_irq_chip = {
          .name = "my-mfd",
          .status_base = REG_IRQ_STATUS,
          .mask_base = REG_IRQ_MASK,
          .ack_base = REG_IRQ_ACK,
          .num_regs = 1,
          .irqs = my_mfd_irqs,
          .num_irqs = ARRAY_SIZE(my_mfd_irqs),
      };
      
      struct my_mfd {
          struct device *dev;
          struct regmap *regmap;
          struct regmap_irq_chip_data *irq_data;
      };
      
      /* 子设备使用父驱动 IRQ 域 */
      static const struct resource gpio_resources[] = {
          DEFINE_RES_IRQ_NAMED(MY_MFD_IRQ_GPIO, "gpio"),
      };
      
      static const struct mfd_cell my_mfd_cells[] = {
          {
              .name = "my-mfd-gpio",
              .resources = gpio_resources,
              .num_resources = ARRAY_SIZE(gpio_resources),
          },
          /* ... */
      };
      
      static int my_mfd_probe(struct i2c_client *client)
      {
          struct my_mfd *mfd;
          struct irq_domain *domain;
          int ret;
          
          mfd = devm_kzalloc(&client->dev, sizeof(*mfd), GFP_KERNEL);
          if (!mfd)
              return -ENOMEM;
          
          mfd->regmap = devm_regmap_init_i2c(client, &my_regmap_config);
          if (IS_ERR(mfd->regmap))
              return PTR_ERR(mfd->regmap);
          
          /* 设置 IRQ 域 */
          ret = devm_regmap_add_irq_chip(&client->dev, mfd->regmap,
                                         client->irq,
                                         IRQF_ONESHOT | IRQF_SHARED,
                                         0, &my_mfd_irq_chip,
                                         &mfd->irq_data);
          if (ret) {
              dev_err(&client->dev, "Failed to add IRQ chip\n");
              return ret;
          }
          
          domain = regmap_irq_get_domain(mfd->irq_data);
          
          /* 添加子设备，传递 IRQ 域 */
          ret = devm_mfd_add_devices(&client->dev, PLATFORM_DEVID_AUTO,
                                     my_mfd_cells, ARRAY_SIZE(my_mfd_cells),
                                     NULL, 0, domain);
          if (ret)
              return ret;
          
          i2c_set_clientdata(client, mfd);
          return 0;
      }

  - description: "MFD 子设备驱动 (GPIO)"
    kernel_version: "5.0+"
    code: |
      #include <linux/module.h>
      #include <linux/platform_device.h>
      #include <linux/gpio/driver.h>
      #include <linux/regmap.h>
      #include <linux/mfd/core.h>
      
      struct my_mfd_gpio {
          struct gpio_chip gc;
          struct regmap *regmap;
          struct device *dev;
      };
      
      static int my_gpio_get(struct gpio_chip *gc, unsigned int offset)
      {
          struct my_mfd_gpio *gpio = gpiochip_get_data(gc);
          unsigned int val;
          int ret;
          
          ret = regmap_read(gpio->regmap, REG_GPIO_IN, &val);
          if (ret)
              return ret;
          
          return !!(val & BIT(offset));
      }
      
      static void my_gpio_set(struct gpio_chip *gc, unsigned int offset, int value)
      {
          struct my_mfd_gpio *gpio = gpiochip_get_data(gc);
          
          regmap_update_bits(gpio->regmap, REG_GPIO_OUT,
                             BIT(offset), value ? BIT(offset) : 0);
      }
      
      static int my_gpio_direction_input(struct gpio_chip *gc, unsigned int offset)
      {
          struct my_mfd_gpio *gpio = gpiochip_get_data(gc);
          return regmap_update_bits(gpio->regmap, REG_GPIO_DIR,
                                    BIT(offset), 0);
      }
      
      static int my_gpio_direction_output(struct gpio_chip *gc,
                                          unsigned int offset, int value)
      {
          struct my_mfd_gpio *gpio = gpiochip_get_data(gc);
          
          my_gpio_set(gc, offset, value);
          return regmap_update_bits(gpio->regmap, REG_GPIO_DIR,
                                    BIT(offset), BIT(offset));
      }
      
      static int my_mfd_gpio_probe(struct platform_device *pdev)
      {
          struct my_mfd_gpio *gpio;
          int ret, irq;
          
          gpio = devm_kzalloc(&pdev->dev, sizeof(*gpio), GFP_KERNEL);
          if (!gpio)
              return -ENOMEM;
          
          gpio->dev = &pdev->dev;
          
          /* 从父驱动获取 regmap */
          gpio->regmap = dev_get_regmap(pdev->dev.parent, NULL);
          if (!gpio->regmap) {
              dev_err(&pdev->dev, "Failed to get regmap\n");
              return -ENODEV;
          }
          
          /* 配置 GPIO 芯片 */
          gpio->gc.label = "my-mfd-gpio";
          gpio->gc.parent = &pdev->dev;
          gpio->gc.owner = THIS_MODULE;
          gpio->gc.get = my_gpio_get;
          gpio->gc.set = my_gpio_set;
          gpio->gc.direction_input = my_gpio_direction_input;
          gpio->gc.direction_output = my_gpio_direction_output;
          gpio->gc.base = -1;  /* 动态分配 */
          gpio->gc.ngpio = 8;
          gpio->gc.can_sleep = true;  /* regmap 可能睡眠 */
          
          /* 获取 IRQ (已通过 IRQ 域映射) */
          irq = platform_get_irq(pdev, 0);
          if (irq > 0) {
              ret = devm_request_threaded_irq(&pdev->dev, irq,
                                              NULL, my_gpio_irq_handler,
                                              IRQF_ONESHOT,
                                              "my-mfd-gpio", gpio);
              if (ret) {
                  dev_err(&pdev->dev, "Failed to request IRQ\n");
                  return ret;
              }
          }
          
          /* 注册 GPIO 芯片 */
          ret = devm_gpiochip_add_data(&pdev->dev, &gpio->gc, gpio);
          if (ret) {
              dev_err(&pdev->dev, "Failed to add GPIO chip\n");
              return ret;
          }
          
          platform_set_drvdata(pdev, gpio);
          dev_info(&pdev->dev, "MFD GPIO probed\n");
          return 0;
      }
      
      static const struct platform_device_id my_mfd_gpio_id[] = {
          { "my-mfd-gpio", 0 },
          { }
      };
      MODULE_DEVICE_TABLE(platform, my_mfd_gpio_id);
      
      static struct platform_driver my_mfd_gpio_driver = {
          .driver = {
              .name = "my-mfd-gpio",
          },
          .probe = my_mfd_gpio_probe,
          .id_table = my_mfd_gpio_id,
      };
      module_platform_driver(my_mfd_gpio_driver);
      
      MODULE_LICENSE("GPL");

  - description: "带平台数据的子设备"
    code: |
      /* 定义平台数据结构 */
      struct my_adc_pdata {
          int reference_mv;
          int channels;
          bool use_internal_ref;
      };
      
      /* 父驱动中的平台数据 */
      static struct my_adc_pdata adc_pdata = {
          .reference_mv = 3300,
          .channels = 4,
          .use_internal_ref = true,
      };
      
      static const struct mfd_cell my_mfd_cells[] = {
          {
              .name = "my-mfd-adc",
              .platform_data = &adc_pdata,
              .pdata_size = sizeof(adc_pdata),
              .resources = adc_resources,
              .num_resources = ARRAY_SIZE(adc_resources),
          },
      };
      
      /* 子驱动获取平台数据 */
      static int my_adc_probe(struct platform_device *pdev)
      {
          const struct my_adc_pdata *pdata;
          
          pdata = dev_get_platdata(&pdev->dev);
          if (!pdata) {
              dev_err(&pdev->dev, "No platform data\n");
              return -ENODEV;
          }
          
          dev_info(&pdev->dev, "ADC: %d channels, %d mV ref\n",
                   pdata->channels, pdata->reference_mv);
          
          /* 使用 pdata 初始化 ADC */
          return 0;
      }

  - description: "SPI MFD 驱动"
    kernel_version: "5.0+"
    code: |
      #include <linux/spi/spi.h>
      #include <linux/mfd/core.h>
      #include <linux/regmap.h>
      
      static const struct regmap_config my_spi_regmap_config = {
          .reg_bits = 8,
          .val_bits = 8,
          .max_register = 0xFF,
          .read_flag_mask = 0x80,  /* 读操作设置 bit7 */
      };
      
      static int my_spi_mfd_probe(struct spi_device *spi)
      {
          struct regmap *regmap;
          int ret;
          
          regmap = devm_regmap_init_spi(spi, &my_spi_regmap_config);
          if (IS_ERR(regmap))
              return PTR_ERR(regmap);
          
          ret = devm_mfd_add_devices(&spi->dev, PLATFORM_DEVID_AUTO,
                                     my_mfd_cells, ARRAY_SIZE(my_mfd_cells),
                                     NULL, 0, NULL);
          return ret;
      }
      
      static const struct spi_device_id my_spi_mfd_id[] = {
          { "my-spi-mfd", 0 },
          { }
      };
      MODULE_DEVICE_TABLE(spi, my_spi_mfd_id);
      
      static struct spi_driver my_spi_mfd_driver = {
          .driver = {
              .name = "my-spi-mfd",
          },
          .probe = my_spi_mfd_probe,
          .id_table = my_spi_mfd_id,
      };
      module_spi_driver(my_spi_mfd_driver);


# Linux Kernel SPI Driver Framework Knowledge Base
#
# Reference: https://www.kernel.org/doc/html/latest/spi/index.html
# Kernel Version: 5.0+

# ============================================================
# SPI DRIVER
# ============================================================

spi_driver:
  description: "SPI Driver - SPI 设备驱动框架"
  header: "linux/spi/spi.h"
  icon: "⚡"
  kernel_version: "2.6.14+"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  registration:
    # 标准注册
    - pattern: 'spi_register_driver\s*\(\s*&?(?P<driver>[\w\.\->]+)\s*\)'
      description: "注册 SPI 驱动"
      context: "process"
      can_sleep: true

    - pattern: 'spi_unregister_driver\s*\(\s*&?(?P<driver>[\w\.\->]+)\s*\)'
      description: "注销 SPI 驱动"
      context: "process"
      can_sleep: true

    # 模块宏 (最常用)
    - pattern: 'module_spi_driver\s*\(\s*(?P<driver>\w+)\s*\)'
      description: "模块化 SPI 驱动注册宏"
      notes: "自动生成 module_init/exit"

    # 内建驱动宏
    - pattern: 'builtin_spi_driver\s*\(\s*(?P<driver>\w+)\s*\)'
      description: "内建 SPI 驱动宏"
      notes: "用于编译进内核的驱动"

    # __spi_register_driver
    - pattern: '__spi_register_driver\s*\(\s*(?P<owner>[^,]+)\s*,\s*(?P<driver>[^)]+)\s*\)'
      description: "底层 SPI 驱动注册"

  structure:
    pattern: 'static\s+(const\s+)?struct spi_driver\s+(?P<name>\w+)\s*=\s*\{'
    description: "SPI driver 结构体定义"
    fields:
      - name: "driver.name"
        type: "const char *"
        description: "驱动名称"
      - name: "driver.of_match_table"
        type: "const struct of_device_id *"
        description: "设备树匹配表"
      - name: "driver.acpi_match_table"
        type: "const struct acpi_device_id *"
        description: "ACPI 匹配表"
      - name: "driver.pm"
        type: "const struct dev_pm_ops *"
        description: "电源管理操作"
      - name: "id_table"
        type: "const struct spi_device_id *"
        description: "设备 ID 表"
      - name: "probe"
        type: "int (*)(struct spi_device *)"
        description: "设备探测回调"
      - name: "remove"
        type: "void (*)(struct spi_device *)"
        description: "设备移除回调"
      - name: "shutdown"
        type: "void (*)(struct spi_device *)"
        description: "系统关机回调"

  callbacks:
    probe:
      pattern: '\.probe\s*=\s*(?P<handler>\w+)'
      description: "设备探测回调 - SPI 设备与驱动匹配后调用"
      trigger: "SPI 设备与驱动匹配成功"
      context: "process"
      can_sleep: true
      signature: "int (*probe)(struct spi_device *spi)"
      return_value:
        success: "0"
        failure: "负数错误码 (-ENOMEM, -ENODEV, -EPROBE_DEFER)"
      typical_actions:
        - "spi_setup() 配置 SPI 参数"
        - "分配私有数据 (devm_kzalloc)"
        - "spi_set_drvdata() 保存私有数据"
        - "请求中断 (如果有)"
        - "初始化硬件"
        - "注册子系统 (input, iio, etc.)"

    remove:
      pattern: '\.remove\s*=\s*(?P<handler>\w+)'
      description: "设备移除回调"
      trigger: "设备移除或驱动卸载"
      context: "process"
      can_sleep: true
      signature: "void (*remove)(struct spi_device *spi)"
      typical_actions:
        - "注销子系统"
        - "释放非 devm 资源"

    shutdown:
      pattern: '\.shutdown\s*=\s*(?P<handler>\w+)'
      description: "系统关机回调"
      trigger: "系统关机或重启"
      context: "process"
      can_sleep: true
      signature: "void (*shutdown)(struct spi_device *spi)"

  call_chains:
    device_discovery:
      description: "SPI 设备发现路径 (设备树)"
      trigger: "系统启动，解析设备树"
      chain:
        - function: "of_register_spi_devices"
          file: "drivers/spi/spi.c"
          description: "从设备树注册 SPI 设备"
        - function: "of_register_spi_device"
          file: "drivers/spi/spi.c"
          description: "注册单个 SPI 设备"
        - function: "spi_add_device"
          file: "drivers/spi/spi.c"
          description: "添加设备到总线"
        - function: "device_add"
          file: "drivers/base/core.c"
          description: "添加到设备模型"

    probe_path:
      description: "设备探测调用路径"
      trigger: "设备与驱动匹配成功"
      chain:
        - function: "spi_match_device"
          file: "drivers/spi/spi.c"
          description: "匹配设备 (of/acpi/id_table/name)"
        - function: "spi_drv_probe"
          file: "drivers/spi/spi.c"
          description: "SPI 探测入口"
        - function: "drv->probe(spi)"
          file: "用户代码"
          description: "用户 probe 函数"
          is_user_entry: true

    remove_path:
      description: "设备移除调用路径"
      trigger: "设备移除或驱动卸载"
      chain:
        - function: "spi_remove_device"
          file: "drivers/spi/spi.c"
          description: "移除 SPI 设备"
        - function: "spi_drv_remove"
          file: "drivers/spi/spi.c"
          description: "SPI 移除入口"
        - function: "drv->remove(spi)"
          file: "用户代码"
          description: "用户 remove 函数"
          is_user_entry: true

    sync_transfer_path:
      description: "同步传输路径"
      trigger: "调用 spi_sync()"
      chain:
        - function: "spi_sync"
          file: "drivers/spi/spi.c"
          description: "同步传输入口"
        - function: "__spi_sync"
          file: "drivers/spi/spi.c"
          description: "内部同步传输"
        - function: "spi_async"
          file: "drivers/spi/spi.c"
          description: "提交到队列"
        - function: "wait_for_completion"
          file: "kernel/sched/completion.c"
          description: "等待完成"
        - function: "ctlr->transfer_one_message"
          file: "SPI 控制器驱动"
          description: "控制器执行传输"

    async_transfer_path:
      description: "异步传输路径"
      trigger: "调用 spi_async()"
      chain:
        - function: "spi_async"
          file: "drivers/spi/spi.c"
          description: "异步传输入口"
        - function: "__spi_async"
          file: "drivers/spi/spi.c"
          description: "内部异步传输"
        - function: "ctlr->transfer"
          file: "SPI 控制器驱动"
          description: "控制器传输函数"
        - function: "spi_pump_messages"
          file: "drivers/spi/spi.c"
          description: "消息队列处理"
          context: "workqueue"
        - function: "msg->complete()"
          file: "用户代码"
          description: "完成回调"
          is_user_entry: true

  helper_functions:
    - pattern: 'spi_set_drvdata\s*\(\s*(?P<spi>[^,]+)\s*,\s*(?P<data>[^)]+)\s*\)'
      description: "设置驱动私有数据"
      context: "any"

    - pattern: 'spi_get_drvdata\s*\(\s*(?P<spi>[^)]+)\s*\)'
      description: "获取驱动私有数据"
      context: "any"

    - pattern: 'spi_setup\s*\(\s*(?P<spi>[^)]+)\s*\)'
      description: "配置 SPI 设备参数"
      context: "process"
      can_sleep: true

    - pattern: 'spi_get_device_id\s*\(\s*(?P<spi>[^)]+)\s*\)'
      description: "获取匹配的设备 ID"
      context: "any"

  notes:
    - "SPI 是全双工同步串行总线"
    - "使用 devm_* API 简化资源管理"
    - "probe 中应调用 spi_setup() 配置 SPI 参数"
    - "匹配优先级: of > acpi > id_table > name"


# ============================================================
# SPI DEVICE
# ============================================================

spi_device:
  description: "SPI Device - SPI 设备结构"
  header: "linux/spi/spi.h"

  patterns:
    # 创建设备
    - pattern: 'spi_new_device\s*\(\s*(?P<controller>[^,]+)\s*,\s*(?P<chip_info>[^)]+)\s*\)'
      description: "创建新的 SPI 设备"
      context: "process"
      can_sleep: true

    - pattern: 'spi_add_device\s*\(\s*(?P<spi>[^)]+)\s*\)'
      description: "添加 SPI 设备到总线"
      context: "process"
      can_sleep: true

    - pattern: 'spi_alloc_device\s*\(\s*(?P<controller>[^)]+)\s*\)'
      description: "分配 SPI 设备结构"
      context: "process"

    - pattern: 'spi_unregister_device\s*\(\s*(?P<spi>[^)]+)\s*\)'
      description: "注销 SPI 设备"
      context: "process"

  structure:
    fields:
      - name: "dev"
        type: "struct device"
        description: "内嵌的设备结构"
      - name: "controller"
        type: "struct spi_controller *"
        description: "SPI 控制器"
      - name: "master"
        type: "struct spi_controller *"
        description: "SPI 控制器 (别名)"
      - name: "max_speed_hz"
        type: "u32"
        description: "最大时钟频率"
      - name: "chip_select"
        type: "u8"
        description: "片选编号"
      - name: "bits_per_word"
        type: "u8"
        description: "每字位数 (通常 8)"
      - name: "rt"
        type: "bool"
        description: "实时优先级传输"
      - name: "mode"
        type: "u32"
        description: "SPI 模式标志"
      - name: "irq"
        type: "int"
        description: "设备中断号"
      - name: "controller_state"
        type: "void *"
        description: "控制器私有状态"
      - name: "controller_data"
        type: "void *"
        description: "设备特定数据"
      - name: "modalias"
        type: "char[SPI_NAME_SIZE]"
        description: "设备名称/别名"
      - name: "cs_gpiod"
        type: "struct gpio_desc *"
        description: "GPIO 片选"


# ============================================================
# SPI MODE FLAGS
# ============================================================

spi_mode:
  description: "SPI Mode Flags - SPI 模式标志"
  header: "linux/spi/spi.h"

  clock_modes:
    - name: "SPI_MODE_0"
      value: "0"
      description: "CPOL=0, CPHA=0 (最常用)"
    - name: "SPI_MODE_1"
      value: "SPI_CPHA"
      description: "CPOL=0, CPHA=1"
    - name: "SPI_MODE_2"
      value: "SPI_CPOL"
      description: "CPOL=1, CPHA=0"
    - name: "SPI_MODE_3"
      value: "SPI_CPOL | SPI_CPHA"
      description: "CPOL=1, CPHA=1"

  flags:
    - name: "SPI_CPHA"
      value: "0x01"
      description: "时钟相位"
    - name: "SPI_CPOL"
      value: "0x02"
      description: "时钟极性"
    - name: "SPI_CS_HIGH"
      value: "0x04"
      description: "片选高电平有效"
    - name: "SPI_LSB_FIRST"
      value: "0x08"
      description: "LSB 先发送"
    - name: "SPI_3WIRE"
      value: "0x10"
      description: "三线模式 (MOSI/MISO 复用)"
    - name: "SPI_LOOP"
      value: "0x20"
      description: "回环测试模式"
    - name: "SPI_NO_CS"
      value: "0x40"
      description: "无片选"
    - name: "SPI_READY"
      value: "0x80"
      description: "从设备 READY 信号"
    - name: "SPI_TX_DUAL"
      value: "0x100"
      description: "双线发送"
    - name: "SPI_TX_QUAD"
      value: "0x200"
      description: "四线发送"
    - name: "SPI_RX_DUAL"
      value: "0x400"
      description: "双线接收"
    - name: "SPI_RX_QUAD"
      value: "0x800"
      description: "四线接收"
    - name: "SPI_TX_OCTAL"
      value: "0x2000"
      description: "八线发送"
    - name: "SPI_RX_OCTAL"
      value: "0x4000"
      description: "八线接收"


# ============================================================
# SPI DEVICE ID
# ============================================================

spi_device_id:
  description: "SPI Device ID Table - SPI 设备 ID 表"
  header: "linux/mod_devicetable.h"

  patterns:
    # ID 表定义
    - pattern: 'static\s+(const\s+)?struct spi_device_id\s+(?P<name>\w+)\s*\[\]\s*='
      description: "SPI 设备 ID 表定义"

    # 单个条目
    - pattern: '\{\s*"(?P<name>[\w\-]+)"\s*(?:,\s*(?P<driver_data>\w+))?\s*\}'
      description: "SPI ID 条目"
      extra_captures:
        - name: "name"
          description: "设备名称"
        - name: "driver_data"
          description: "驱动私有数据"

    # 终止符
    - pattern: '\{\s*\}'
      description: "ID 表终止符"

    # MODULE_DEVICE_TABLE
    - pattern: 'MODULE_DEVICE_TABLE\s*\(\s*spi\s*,\s*(?P<table>\w+)\s*\)'
      description: "导出 SPI ID 表"

  structure:
    fields:
      - name: "name"
        type: "char[SPI_NAME_SIZE]"
        description: "设备名称"
      - name: "driver_data"
        type: "kernel_ulong_t"
        description: "驱动私有数据"


# ============================================================
# SPI TRANSFER
# ============================================================

spi_transfer:
  description: "SPI Transfer - SPI 数据传输结构"
  header: "linux/spi/spi.h"

  structure:
    pattern: 'struct spi_transfer\s*(?P<name>\w+)\s*='
    fields:
      - name: "tx_buf"
        type: "const void *"
        description: "发送缓冲区"
      - name: "rx_buf"
        type: "void *"
        description: "接收缓冲区"
      - name: "len"
        type: "unsigned int"
        description: "传输字节数"
      - name: "tx_dma"
        type: "dma_addr_t"
        description: "发送 DMA 地址"
      - name: "rx_dma"
        type: "dma_addr_t"
        description: "接收 DMA 地址"
      - name: "tx_nbits"
        type: "u8"
        description: "发送线数 (1/2/4/8)"
      - name: "rx_nbits"
        type: "u8"
        description: "接收线数 (1/2/4/8)"
      - name: "cs_change"
        type: "unsigned int"
        description: "传输后是否改变 CS"
      - name: "cs_change_delay"
        type: "struct spi_delay"
        description: "CS 改变后延迟"
      - name: "delay"
        type: "struct spi_delay"
        description: "传输后延迟"
      - name: "delay_usecs"
        type: "u16"
        description: "传输后延迟 (微秒，旧)"
      - name: "speed_hz"
        type: "u32"
        description: "传输速度 (覆盖设备设置)"
      - name: "word_delay"
        type: "struct spi_delay"
        description: "字间延迟"
      - name: "bits_per_word"
        type: "u8"
        description: "每字位数 (覆盖设备设置)"


# ============================================================
# SPI MESSAGE
# ============================================================

spi_message:
  description: "SPI Message - SPI 消息 (传输序列)"
  header: "linux/spi/spi.h"

  patterns:
    # 初始化消息
    - pattern: 'spi_message_init\s*\(\s*&?(?P<msg>[\w\.\->]+)\s*\)'
      description: "初始化 SPI 消息"
      context: "any"

    - pattern: 'spi_message_init_with_transfers\s*\(\s*&?(?P<msg>[\w\.\->]+)\s*,\s*(?P<xfers>[^,]+)\s*,\s*(?P<num>[^)]+)\s*\)'
      description: "用传输数组初始化消息"
      context: "any"

    # 添加传输
    - pattern: 'spi_message_add_tail\s*\(\s*&?(?P<xfer>[\w\.\->]+)\s*,\s*&?(?P<msg>[\w\.\->]+)\s*\)'
      description: "添加传输到消息末尾"
      context: "any"

  structure:
    fields:
      - name: "transfers"
        type: "struct list_head"
        description: "传输链表"
      - name: "spi"
        type: "struct spi_device *"
        description: "目标 SPI 设备"
      - name: "is_dma_mapped"
        type: "unsigned int"
        description: "缓冲区是否已 DMA 映射"
      - name: "complete"
        type: "void (*)(void *)"
        description: "异步完成回调"
      - name: "context"
        type: "void *"
        description: "完成回调上下文"
      - name: "frame_length"
        type: "unsigned int"
        description: "总帧长度"
      - name: "actual_length"
        type: "unsigned int"
        description: "实际传输长度"
      - name: "status"
        type: "int"
        description: "传输状态"


# ============================================================
# SPI TRANSFER API
# ============================================================

spi_transfer_api:
  description: "SPI Transfer API - SPI 传输 API"
  header: "linux/spi/spi.h"

  sync_functions:
    # 同步传输
    - pattern: 'spi_sync\s*\(\s*(?P<spi>[^,]+)\s*,\s*(?P<msg>[^)]+)\s*\)'
      description: "同步传输消息"
      context: "process"
      can_sleep: true

    - pattern: 'spi_sync_transfer\s*\(\s*(?P<spi>[^,]+)\s*,\s*(?P<xfers>[^,]+)\s*,\s*(?P<num>[^)]+)\s*\)'
      description: "同步传输数组"
      context: "process"
      can_sleep: true

    - pattern: 'spi_sync_locked\s*\(\s*(?P<spi>[^,]+)\s*,\s*(?P<msg>[^)]+)\s*\)'
      description: "同步传输 (已持锁)"
      context: "process"

    # 简单读写
    - pattern: 'spi_read\s*\(\s*(?P<spi>[^,]+)\s*,\s*(?P<buf>[^,]+)\s*,\s*(?P<len>[^)]+)\s*\)'
      description: "简单 SPI 读取"
      context: "process"
      can_sleep: true

    - pattern: 'spi_write\s*\(\s*(?P<spi>[^,]+)\s*,\s*(?P<buf>[^,]+)\s*,\s*(?P<len>[^)]+)\s*\)'
      description: "简单 SPI 写入"
      context: "process"
      can_sleep: true

    - pattern: 'spi_write_then_read\s*\(\s*(?P<spi>[^,]+)\s*,\s*(?P<txbuf>[^,]+)\s*,\s*(?P<n_tx>[^,]+)\s*,\s*(?P<rxbuf>[^,]+)\s*,\s*(?P<n_rx>[^)]+)\s*\)'
      description: "先写后读"
      context: "process"
      can_sleep: true

    # 单字节操作
    - pattern: 'spi_w8r8\s*\(\s*(?P<spi>[^,]+)\s*,\s*(?P<cmd>[^)]+)\s*\)'
      description: "发送8位，接收8位"
      context: "process"
      can_sleep: true

    - pattern: 'spi_w8r16\s*\(\s*(?P<spi>[^,]+)\s*,\s*(?P<cmd>[^)]+)\s*\)'
      description: "发送8位，接收16位"
      context: "process"
      can_sleep: true

    - pattern: 'spi_w8r16be\s*\(\s*(?P<spi>[^,]+)\s*,\s*(?P<cmd>[^)]+)\s*\)'
      description: "发送8位，接收16位 (大端)"
      context: "process"
      can_sleep: true

  async_functions:
    # 异步传输
    - pattern: 'spi_async\s*\(\s*(?P<spi>[^,]+)\s*,\s*(?P<msg>[^)]+)\s*\)'
      description: "异步传输消息"
      context: "any"
      can_sleep: false

    - pattern: 'spi_async_locked\s*\(\s*(?P<spi>[^,]+)\s*,\s*(?P<msg>[^)]+)\s*\)'
      description: "异步传输 (已持锁)"
      context: "any"

  bus_lock:
    # 总线锁定
    - pattern: 'spi_bus_lock\s*\(\s*(?P<ctlr>[^)]+)\s*\)'
      description: "锁定 SPI 总线"
      context: "process"
      can_sleep: true

    - pattern: 'spi_bus_unlock\s*\(\s*(?P<ctlr>[^)]+)\s*\)'
      description: "解锁 SPI 总线"
      context: "process"


# ============================================================
# SPI MEM (SPI NOR/NAND)
# ============================================================

spi_mem:
  description: "SPI MEM - SPI 存储器支持 (NOR/NAND Flash)"
  header: "linux/spi/spi-mem.h"
  kernel_version: "4.15+"

  patterns:
    # spi_mem_exec_op
    - pattern: 'spi_mem_exec_op\s*\(\s*(?P<mem>[^,]+)\s*,\s*(?P<op>[^)]+)\s*\)'
      description: "执行 SPI MEM 操作"
      context: "process"
      can_sleep: true

    # spi_mem_supports_op
    - pattern: 'spi_mem_supports_op\s*\(\s*(?P<mem>[^,]+)\s*,\s*(?P<op>[^)]+)\s*\)'
      description: "检查是否支持操作"
      context: "process"

    # spi_mem_dirmap_*
    - pattern: 'spi_mem_dirmap_create\s*\(\s*(?P<mem>[^)]+)\s*\)'
      description: "创建直接映射"
      context: "process"

    - pattern: 'spi_mem_dirmap_read\s*\(\s*(?P<desc>[^,]+)\s*,\s*(?P<offs>[^,]+)\s*,\s*(?P<len>[^,]+)\s*,\s*(?P<buf>[^)]+)\s*\)'
      description: "直接映射读取"
      context: "process"

    - pattern: 'spi_mem_dirmap_write\s*\(\s*(?P<desc>[^,]+)\s*,\s*(?P<offs>[^,]+)\s*,\s*(?P<len>[^,]+)\s*,\s*(?P<buf>[^)]+)\s*\)'
      description: "直接映射写入"
      context: "process"

  spi_mem_op_structure:
    fields:
      - name: "cmd.opcode"
        type: "u8"
        description: "命令操作码"
      - name: "cmd.buswidth"
        type: "u8"
        description: "命令总线宽度"
      - name: "addr.nbytes"
        type: "u8"
        description: "地址字节数"
      - name: "addr.buswidth"
        type: "u8"
        description: "地址总线宽度"
      - name: "addr.val"
        type: "u64"
        description: "地址值"
      - name: "dummy.nbytes"
        type: "u8"
        description: "Dummy 字节数"
      - name: "dummy.buswidth"
        type: "u8"
        description: "Dummy 总线宽度"
      - name: "data.dir"
        type: "enum spi_mem_data_dir"
        description: "数据方向 (IN/OUT)"
      - name: "data.nbytes"
        type: "unsigned int"
        description: "数据字节数"
      - name: "data.buswidth"
        type: "u8"
        description: "数据总线宽度"
      - name: "data.buf.in"
        type: "void *"
        description: "输入缓冲区"
      - name: "data.buf.out"
        type: "const void *"
        description: "输出缓冲区"

  macros:
    - pattern: 'SPI_MEM_OP\s*\('
      description: "构造 SPI MEM 操作"

    - pattern: 'SPI_MEM_OP_CMD\s*\(\s*(?P<opcode>[^,]+)\s*,\s*(?P<buswidth>\d+)\s*\)'
      description: "命令部分"

    - pattern: 'SPI_MEM_OP_ADDR\s*\(\s*(?P<nbytes>\d+)\s*,\s*(?P<val>[^,]+)\s*,\s*(?P<buswidth>\d+)\s*\)'
      description: "地址部分"

    - pattern: 'SPI_MEM_OP_DUMMY\s*\(\s*(?P<nbytes>\d+)\s*,\s*(?P<buswidth>\d+)\s*\)'
      description: "Dummy 部分"

    - pattern: 'SPI_MEM_OP_DATA_IN\s*\(\s*(?P<nbytes>[^,]+)\s*,\s*(?P<buf>[^,]+)\s*,\s*(?P<buswidth>\d+)\s*\)'
      description: "数据输入部分"

    - pattern: 'SPI_MEM_OP_DATA_OUT\s*\(\s*(?P<nbytes>[^,]+)\s*,\s*(?P<buf>[^,]+)\s*,\s*(?P<buswidth>\d+)\s*\)'
      description: "数据输出部分"


# ============================================================
# SPI DEVICE TREE
# ============================================================

spi_device_tree:
  description: "SPI Device Tree Binding - SPI 设备树绑定"
  header: "linux/of.h"

  patterns:
    # of_match_table
    - pattern: '\.of_match_table\s*=\s*(?P<table>[\w\.\->]+)'
      description: "设备树匹配表"

    - pattern: 'of_match_ptr\s*\(\s*(?P<table>\w+)\s*\)'
      description: "条件编译的设备树匹配表"

    - pattern: 'MODULE_DEVICE_TABLE\s*\(\s*of\s*,\s*(?P<table>\w+)\s*\)'
      description: "导出设备树匹配表"

  of_device_id_structure:
    pattern: 'static\s+(const\s+)?struct of_device_id\s+(?P<name>\w+)\s*\[\]\s*='
    fields:
      - name: "compatible"
        type: "char[128]"
        description: "compatible 字符串"
      - name: "data"
        type: "const void *"
        description: "匹配数据"

  dt_properties:
    - name: "compatible"
      description: "设备兼容性字符串"
      example: 'compatible = "vendor,device";'
    - name: "reg"
      description: "片选编号"
      example: "reg = <0>;"
    - name: "spi-max-frequency"
      description: "最大 SPI 频率"
      example: "spi-max-frequency = <10000000>;"
    - name: "spi-cpol"
      description: "时钟极性"
      example: "spi-cpol;"
    - name: "spi-cpha"
      description: "时钟相位"
      example: "spi-cpha;"
    - name: "spi-cs-high"
      description: "片选高电平有效"
      example: "spi-cs-high;"
    - name: "spi-3wire"
      description: "三线模式"
      example: "spi-3wire;"
    - name: "spi-lsb-first"
      description: "LSB 先发送"
      example: "spi-lsb-first;"
    - name: "spi-tx-bus-width"
      description: "发送总线宽度 (1/2/4/8)"
      example: "spi-tx-bus-width = <4>;"
    - name: "spi-rx-bus-width"
      description: "接收总线宽度 (1/2/4/8)"
      example: "spi-rx-bus-width = <4>;"


# ============================================================
# SPI CONTROLLER (for reference)
# ============================================================

spi_controller:
  description: "SPI Controller - SPI 控制器 (主控端)"
  header: "linux/spi/spi.h"
  notes: "通常由 SoC 厂商实现，设备驱动一般不需要关心"

  patterns:
    # 注册控制器
    - pattern: 'spi_register_controller\s*\(\s*(?P<ctlr>[^)]+)\s*\)'
      description: "注册 SPI 控制器"
      context: "process"

    - pattern: 'devm_spi_register_controller\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<ctlr>[^)]+)\s*\)'
      description: "devm 版本注册控制器"
      context: "process"

    # 分配控制器
    - pattern: 'spi_alloc_master\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<size>[^)]+)\s*\)'
      description: "分配 SPI master (旧)"
      context: "process"

    - pattern: 'spi_alloc_host\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<size>[^)]+)\s*\)'
      description: "分配 SPI host (新)"
      context: "process"

    - pattern: 'devm_spi_alloc_master\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<size>[^)]+)\s*\)'
      description: "devm 版本分配 master"
      context: "process"


# ============================================================
# REGMAP SPI
# ============================================================

regmap_spi:
  description: "Regmap SPI - SPI 寄存器映射"
  header: "linux/regmap.h"

  patterns:
    # 初始化 regmap
    - pattern: 'devm_regmap_init_spi\s*\(\s*(?P<spi>[^,]+)\s*,\s*(?P<config>[^)]+)\s*\)'
      description: "为 SPI 设备创建 regmap"
      context: "process"
      can_sleep: true

    - pattern: 'regmap_init_spi\s*\(\s*(?P<spi>[^,]+)\s*,\s*(?P<config>[^)]+)\s*\)'
      description: "为 SPI 设备创建 regmap (非 devm)"
      context: "process"

  regmap_config_fields:
    - name: "reg_bits"
      description: "寄存器地址位数"
    - name: "val_bits"
      description: "寄存器值位数"
    - name: "max_register"
      description: "最大寄存器地址"
    - name: "read_flag_mask"
      description: "读标志掩码"
    - name: "write_flag_mask"
      description: "写标志掩码"


# ============================================================
# EXAMPLES
# ============================================================

examples:
  - description: "基本 SPI 驱动"
    kernel_version: "5.0+"
    code: |
      #include <linux/module.h>
      #include <linux/spi/spi.h>
      #include <linux/of.h>
      
      struct my_spi_device {
          struct spi_device *spi;
          u8 *tx_buf;
          u8 *rx_buf;
      };
      
      static int my_probe(struct spi_device *spi)
      {
          struct my_spi_device *priv;
          int ret;
          
          /* 分配私有数据 */
          priv = devm_kzalloc(&spi->dev, sizeof(*priv), GFP_KERNEL);
          if (!priv)
              return -ENOMEM;
          
          priv->spi = spi;
          
          /* 分配 DMA 安全缓冲区 */
          priv->tx_buf = devm_kzalloc(&spi->dev, 256, GFP_KERNEL | GFP_DMA);
          priv->rx_buf = devm_kzalloc(&spi->dev, 256, GFP_KERNEL | GFP_DMA);
          if (!priv->tx_buf || !priv->rx_buf)
              return -ENOMEM;
          
          /* 配置 SPI 参数 */
          spi->mode = SPI_MODE_0;
          spi->bits_per_word = 8;
          spi->max_speed_hz = 10000000;  /* 10 MHz */
          ret = spi_setup(spi);
          if (ret < 0) {
              dev_err(&spi->dev, "spi_setup failed: %d\n", ret);
              return ret;
          }
          
          /* 请求中断 (如果有) */
          if (spi->irq > 0) {
              ret = devm_request_irq(&spi->dev, spi->irq,
                                     my_irq_handler, IRQF_TRIGGER_FALLING,
                                     dev_name(&spi->dev), priv);
              if (ret) {
                  dev_err(&spi->dev, "request_irq failed: %d\n", ret);
                  return ret;
              }
          }
          
          spi_set_drvdata(spi, priv);
          dev_info(&spi->dev, "probed at %u Hz, mode %u\n",
                   spi->max_speed_hz, spi->mode);
          return 0;
      }
      
      static void my_remove(struct spi_device *spi)
      {
          struct my_spi_device *priv = spi_get_drvdata(spi);
          /* devm 自动清理资源 */
          dev_info(&spi->dev, "removed\n");
      }
      
      static const struct spi_device_id my_spi_ids[] = {
          { "my-spi-device", 0 },
          { "my-spi-device-v2", 1 },
          { }
      };
      MODULE_DEVICE_TABLE(spi, my_spi_ids);
      
      static const struct of_device_id my_of_match[] = {
          { .compatible = "vendor,my-spi-device" },
          { .compatible = "vendor,my-spi-device-v2" },
          { }
      };
      MODULE_DEVICE_TABLE(of, my_of_match);
      
      static struct spi_driver my_spi_driver = {
          .driver = {
              .name = "my-spi-driver",
              .of_match_table = my_of_match,
          },
          .probe = my_probe,
          .remove = my_remove,
          .id_table = my_spi_ids,
      };
      module_spi_driver(my_spi_driver);
      
      MODULE_LICENSE("GPL");

  - description: "SPI 传输示例"
    code: |
      /* 读取寄存器 */
      static int my_read_reg(struct spi_device *spi, u8 addr, u8 *val)
      {
          u8 tx_buf[2] = { addr | 0x80, 0 };  /* 读命令 */
          u8 rx_buf[2];
          struct spi_transfer t = {
              .tx_buf = tx_buf,
              .rx_buf = rx_buf,
              .len = 2,
          };
          int ret;
          
          ret = spi_sync_transfer(spi, &t, 1);
          if (ret < 0)
              return ret;
          
          *val = rx_buf[1];
          return 0;
      }
      
      /* 写入寄存器 */
      static int my_write_reg(struct spi_device *spi, u8 addr, u8 val)
      {
          u8 tx_buf[2] = { addr & 0x7F, val };  /* 写命令 */
          return spi_write(spi, tx_buf, sizeof(tx_buf));
      }
      
      /* 批量读取 */
      static int my_read_block(struct spi_device *spi, u8 addr,
                               u8 *buf, size_t len)
      {
          u8 cmd = addr | 0x80 | 0x40;  /* 读 + 自动增量 */
          struct spi_transfer t[] = {
              {
                  .tx_buf = &cmd,
                  .len = 1,
              },
              {
                  .rx_buf = buf,
                  .len = len,
              },
          };
          return spi_sync_transfer(spi, t, ARRAY_SIZE(t));
      }

  - description: "异步传输"
    code: |
      struct my_async_ctx {
          struct spi_message msg;
          struct spi_transfer xfer;
          u8 tx_buf[4];
          u8 rx_buf[4];
          struct completion done;
      };
      
      static void my_async_complete(void *context)
      {
          struct my_async_ctx *ctx = context;
          complete(&ctx->done);
      }
      
      static int my_async_read(struct spi_device *spi, u8 addr, u8 *val)
      {
          struct my_async_ctx *ctx;
          int ret;
          
          ctx = kzalloc(sizeof(*ctx), GFP_KERNEL);
          if (!ctx)
              return -ENOMEM;
          
          init_completion(&ctx->done);
          
          ctx->tx_buf[0] = addr | 0x80;
          ctx->xfer.tx_buf = ctx->tx_buf;
          ctx->xfer.rx_buf = ctx->rx_buf;
          ctx->xfer.len = 2;
          
          spi_message_init(&ctx->msg);
          spi_message_add_tail(&ctx->xfer, &ctx->msg);
          ctx->msg.complete = my_async_complete;
          ctx->msg.context = ctx;
          
          ret = spi_async(spi, &ctx->msg);
          if (ret) {
              kfree(ctx);
              return ret;
          }
          
          /* 等待完成 */
          wait_for_completion(&ctx->done);
          
          ret = ctx->msg.status;
          if (ret == 0)
              *val = ctx->rx_buf[1];
          
          kfree(ctx);
          return ret;
      }

  - description: "使用 regmap"
    code: |
      #include <linux/regmap.h>
      
      static const struct regmap_config my_regmap_config = {
          .reg_bits = 8,
          .val_bits = 8,
          .max_register = 0x7F,
          .read_flag_mask = 0x80,  /* 读操作设置 bit7 */
      };
      
      struct my_device {
          struct spi_device *spi;
          struct regmap *regmap;
      };
      
      static int my_probe(struct spi_device *spi)
      {
          struct my_device *priv;
          unsigned int val;
          int ret;
          
          priv = devm_kzalloc(&spi->dev, sizeof(*priv), GFP_KERNEL);
          if (!priv)
              return -ENOMEM;
          
          priv->spi = spi;
          
          /* 创建 regmap */
          priv->regmap = devm_regmap_init_spi(spi, &my_regmap_config);
          if (IS_ERR(priv->regmap))
              return PTR_ERR(priv->regmap);
          
          /* 使用 regmap 读取 */
          ret = regmap_read(priv->regmap, REG_ID, &val);
          if (ret)
              return ret;
          
          dev_info(&spi->dev, "device ID: 0x%02x\n", val);
          
          /* 使用 regmap 写入 */
          ret = regmap_write(priv->regmap, REG_CTRL, 0x01);
          if (ret)
              return ret;
          
          /* 使用 regmap 修改 */
          ret = regmap_update_bits(priv->regmap, REG_CTRL,
                                   CTRL_ENABLE, CTRL_ENABLE);
          
          spi_set_drvdata(spi, priv);
          return 0;
      }

  - description: "设备树配置"
    code: |
      /* 设备树示例 */
      /*
      &spi0 {
          #address-cells = <1>;
          #size-cells = <0>;
          status = "okay";
          
          my_device@0 {
              compatible = "vendor,my-spi-device";
              reg = <0>;
              spi-max-frequency = <10000000>;
              spi-cpol;
              spi-cpha;
              interrupt-parent = <&gpio>;
              interrupts = <42 IRQ_TYPE_EDGE_FALLING>;
          };
          
          my_flash@1 {
              compatible = "vendor,my-flash";
              reg = <1>;
              spi-max-frequency = <50000000>;
              spi-tx-bus-width = <4>;
              spi-rx-bus-width = <4>;
          };
      };
      */

  - description: "SPI MEM 操作 (Flash)"
    kernel_version: "4.15+"
    code: |
      #include <linux/spi/spi-mem.h>
      
      /* 读取 Flash ID */
      static int read_flash_id(struct spi_mem *mem, u8 *id, size_t len)
      {
          struct spi_mem_op op = SPI_MEM_OP(
              SPI_MEM_OP_CMD(0x9F, 1),        /* RDID 命令 */
              SPI_MEM_OP_NO_ADDR,
              SPI_MEM_OP_NO_DUMMY,
              SPI_MEM_OP_DATA_IN(len, id, 1)
          );
          
          return spi_mem_exec_op(mem, &op);
      }
      
      /* 读取 Flash 数据 (Quad 模式) */
      static int read_flash_data(struct spi_mem *mem, u32 addr,
                                  u8 *buf, size_t len)
      {
          struct spi_mem_op op = SPI_MEM_OP(
              SPI_MEM_OP_CMD(0x6B, 1),        /* Fast Read Quad */
              SPI_MEM_OP_ADDR(3, addr, 1),    /* 3字节地址 */
              SPI_MEM_OP_DUMMY(8, 1),         /* 8 dummy cycles */
              SPI_MEM_OP_DATA_IN(len, buf, 4) /* Quad 读取 */
          );
          
          if (!spi_mem_supports_op(mem, &op)) {
              /* 降级到单线模式 */
              op = SPI_MEM_OP(
                  SPI_MEM_OP_CMD(0x03, 1),
                  SPI_MEM_OP_ADDR(3, addr, 1),
                  SPI_MEM_OP_NO_DUMMY,
                  SPI_MEM_OP_DATA_IN(len, buf, 1)
              );
          }
          
          return spi_mem_exec_op(mem, &op);
      }

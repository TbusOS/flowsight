# Linux Kernel Platform Driver Framework Knowledge Base
#
# Reference: https://www.kernel.org/doc/html/latest/driver-api/platform.html

# ============================================================
# PLATFORM DRIVER
# ============================================================

platform_driver:
  description: "Platform Driver - 平台设备驱动"
  header: "linux/platform_device.h"
  icon: "🔌"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  bind_patterns:
    # platform_driver_register - 注册驱动
    - pattern: 'platform_driver_register\s*\(\s*(?P<driver>[^)]+)\s*\)'
      variable_capture: "driver"
      description: "注册 platform 驱动"

    # module_platform_driver - 模块宏
    - pattern: 'module_platform_driver\s*\(\s*(?P<name>\w+)\s*\)'
      variable_capture: "name"
      description: "模块化的 platform 驱动注册"

    # platform_driver_probe - 探测式注册
    - pattern: 'platform_driver_probe\s*\(\s*(?P<driver>[^)]+)\s*,\s*(?P<probe>\w+)\s*\)'
      variable_capture: "driver"
      description: "探测式注册 (用于单设备)"

  driver_structure:
    - pattern: 'static struct platform_driver\s+(?P<name>\w+)\s*=\s*\{'
      variable_capture: "name"
      description: "Platform driver 结构体定义"

  callbacks:
    probe:
      pattern: '\.probe\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "Probe 回调"

    remove:
      pattern: '\.remove\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "Remove 回调"

    shutdown:
      pattern: '\.shutdown\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "Shutdown 回调"

    suspend:
      pattern: '\.suspend\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "Suspend 回调"

    resume:
      pattern: '\.resume\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "Resume 回调"

    suspend_late:
      pattern: '\.suspend_late\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "Late suspend 回调"

    resume_early:
      pattern: '\.resume_early\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "Early resume 回调"

    driver_groups:
      pattern: '\.driver\.groups\s*='
      description: "驱动属性组"

  probe_signature:
    return_type: "int"
    parameters:
      - name: "dev"
        type: "struct platform_device *"
        description: "Platform 设备"

  remove_signature:
    return_type: "int"
    parameters:
      - name: "dev"
        type: "struct platform_device *"
        description: "Platform 设备"

  kernel_call_chain:
    trigger: "Platform 设备与驱动匹配"
    chain:
      - function: "platform_bus_type.match"
        file: "drivers/base/platform.c"
        description: "匹配设备与驱动"
      - function: "platform_bus_type.probe"
        file: "drivers/base/platform.c"
        description: "调用驱动 probe"
      - function: "my_probe(dev)"
        file: "用户代码"
        description: "用户 probe 函数"
        is_user_entry: true

      # Remove 路径
      - function: "platform_bus_type.remove"
        file: "drivers/base/platform.c"
      - function: "my_remove(dev)"
        file: "用户代码"
        description: "用户 remove 函数"
        is_user_entry: true

  notes:
    - "Platform 设备包括 SoC 外设、platform 总线设备等"
    - "可以通过设备树、ACPI 或板级文件注册设备"
    - "driver.of_match_table 用于设备树匹配"


# ============================================================
# PLATFORM DEVICE
# ============================================================

platform_device:
  description: "Platform Device - 平台设备"
  header: "linux/platform_device.h"

  bind_patterns:
    # platform_device_alloc - 分配设备
    - pattern: 'platform_device_alloc\s*\(\s*(?P<name>["\']?[\w\-]+["\']?)\s*,\s*(?P<id>\w+)\s*\)'
      variable_capture: "name"
      description: "分配 platform device"

    # platform_device_add - 添加设备
    - pattern: 'platform_device_add\s*\(\s*(?P<dev>[^)]+)\s*\)'
      variable_capture: "dev"
      description: "添加 platform device"

    # platform_get_resource - 获取资源
    - pattern: 'platform_get_resource\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<type>\w+)\s*,\s*(?P<num>\d+)\s*\)'
      extra_captures:
        - name: "type"
          description: "资源类型 (IORESOURCE_MEM, IORESOURCE_IO, IORESOURCE_IRQ)"
        - name: "num"
          description: "资源索引"

    # platform_get_irq - 获取中断
    - pattern: 'platform_get_irq\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<num>\d+)\s*\)'
      variable_capture: "dev"
      description: "获取中断号"

  resource_types:
    - name: "IORESOURCE_MEM"
      description: "内存资源"
    - name: "IORESOURCE_IO"
      description: "I/O 端口资源"
    - name: "IORESOURCE_IRQ"
      description: "中断资源"
    - name: "IORESOURCE_DMA"
      description: "DMA 通道资源"


# ============================================================
# PLATFORM DRIVER API
# ============================================================

platform_api:
  description: "Platform Driver API Functions"
  header: "linux/platform_device.h"

  functions:
    # 资源获取
    platform_get_resource:
      pattern: 'platform_get_resource\s*\([^)]+\)'
      description: "获取设备资源"

    platform_get_irq:
      pattern: 'platform_get_irq\s*\([^)]+\)'
      description: "获取中断号"

    platform_get_irq_byname:
      pattern: 'platform_get_irq_byname\s*\([^)]+\)'
      description: "按名称获取中断号"

    platform_get_resource_byname:
      pattern: 'platform_get_resource_byname\s*\([^)]+\)'
      description: "按名称获取资源"

    # 设备信息
    platform_get_device_id:
      pattern: 'platform_get_device_id\s*\([^)]+\)'
      description: "获取设备 ID"

    platform_get_match_data:
      pattern: 'platform_get_match_data\s*\([^)]+\)'
      description: "获取匹配数据"

    # 设备操作
    platform_device_unregister:
      pattern: 'platform_device_unregister\s*\([^)]+\)'
      description: "注销设备"

    platform_device_put:
      pattern: 'platform_device_put\s*\([^)]+\)'
      description: "释放设备引用"

    # 驱动操作
    platform_driver_unregister:
      pattern: 'platform_driver_unregister\s*\([^)]+\)'
      description: "注销驱动"


# ============================================================
# DEVICE TREE MATCH
# ============================================================

device_tree_match:
  description: "Device Tree Matching"
  header: "linux/mod_devicetable.h"

  bind_patterns:
    # OF match table
    - pattern: '\.of_match_table\s*=\s*(?P<table>\w+)'
      description: "设备树匹配表"

    # compatible string matching
    - pattern: 'of_match_ptr\s*\(\s*\[(?P<matches>[\w\s,\-]+)\]\s*\)'
      extra_captures:
        - name: "matches"
          description: "匹配的 compatible 字符串"

    # MODULE_DEVICE_TABLE(of, ...)
    - pattern: 'MODULE_DEVICE_TABLE\s*\(\s*of\s*,\s*(?P<table>\w+)\s*\)'
      variable_capture: "table"
      description: "模块设备表导出"


# ============================================================
# PLATFORM EXAMPLES
# ============================================================

examples:
  - description: "简单 Platform 驱动"
    code: |
      static int my_probe(struct platform_device *pdev) {
          struct my_device *dev;
          struct resource *res;
          int irq;

          /* 获取内存资源 */
          res = platform_get_resource(pdev, IORESOURCE_MEM, 0);
          if (!res)
              return -ENODEV;

          /* 获取中断 */
          irq = platform_get_irq(pdev, 0);
          if (irq < 0)
              return irq;

          /* 分配设备结构 */
          dev = devm_kzalloc(&pdev->dev, sizeof(*dev), GFP_KERNEL);
          if (!dev)
              return -ENOMEM;

          dev->regs = devm_ioremap_resource(&pdev->dev, res);
          if (IS_ERR(dev->regs))
              return PTR_ERR(dev->regs);

          dev->irq = irq;

          /* 初始化并注册 */
          platform_set_drvdata(pdev, dev);

          return 0;
      }

      static int my_remove(struct platform_device *pdev) {
          struct my_device *dev = platform_get_drvdata(pdev);
          /* 清理资源 */
          return 0;
      }

      static struct platform_driver my_driver = {
          .probe = my_probe,
          .remove = my_remove,
          .driver = {
              .name = "my-platform-driver",
              .of_match_table = my_of_match,
          },
      };

      module_platform_driver(my_driver);

  - description: "设备树匹配"
    code: |
      static const struct of_device_id my_of_match[] = {
          { .compatible = "vendor,my-device" },
          { .compatible = "vendor,my-device-v2" },
          { },
      };
      MODULE_DEVICE_TABLE(of, my_of_match);

      static struct platform_driver my_driver = {
          .driver = {
              .name = "my-device",
              .of_match_table = my_of_match,
          },
          .probe = my_probe,
          .remove = my_remove,
      };

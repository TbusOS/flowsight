# MMC/SD Card Driver Framework Knowledge Base
# Reference: https://www.kernel.org/doc/html/latest/driver-api/mmc/

# ============================================================
# MMC HOST CONTROLLER
# ============================================================
mmc_host:
  description: "MMC/SD Host Controller Driver"
  header: "linux/mmc/host.h"
  icon: "💾"
  kernel_version: "2.6.20+"
  registration:
    - pattern: 'mmc_add_host\s*\(\s*(?P<host>\w+)\s*\)'
      description: "注册 MMC 主机控制器"
    - pattern: 'mmc_alloc_host\s*\(\s*sizeof\s*\([^)]+\)\s*,\s*(?P<dev>[^)]+)\s*\)'
      description: "分配 MMC 主机结构"
  unregistration:
    - pattern: 'mmc_remove_host\s*\(\s*(?P<host>\w+)\s*\)'
      description: "移除 MMC 主机"
    - pattern: 'mmc_free_host\s*\(\s*(?P<host>\w+)\s*\)'
      description: "释放 MMC 主机"
  structure:
    name: "mmc_host_ops"
    callbacks:
      request:
        pattern: '\.request\s*=\s*(?P<handler>\w+)'
        description: "处理 MMC 请求"
        context: "process/softirq"
        can_sleep: false
      set_ios:
        pattern: '\.set_ios\s*=\s*(?P<handler>\w+)'
        description: "设置 IO 参数（时钟、总线宽度等）"
        context: "process"
        can_sleep: true
      get_ro:
        pattern: '\.get_ro\s*=\s*(?P<handler>\w+)'
        description: "获取写保护状态"
        context: "process"
        can_sleep: true
      get_cd:
        pattern: '\.get_cd\s*=\s*(?P<handler>\w+)'
        description: "获取卡检测状态"
        context: "process"
        can_sleep: true
      enable_sdio_irq:
        pattern: '\.enable_sdio_irq\s*=\s*(?P<handler>\w+)'
        description: "启用/禁用 SDIO 中断"
        context: "process"
        can_sleep: false
      hw_reset:
        pattern: '\.hw_reset\s*=\s*(?P<handler>\w+)'
        description: "硬件复位"
        context: "process"
        can_sleep: true
      card_busy:
        pattern: '\.card_busy\s*=\s*(?P<handler>\w+)'
        description: "检查卡是否忙"
        context: "process"
        can_sleep: false
  helpers:
    - pattern: 'mmc_request_done\s*\(\s*(?P<host>\w+)\s*,\s*(?P<mrq>\w+)\s*\)'
      description: "MMC 请求完成回调"
    - pattern: 'mmc_detect_change\s*\(\s*(?P<host>\w+)\s*,\s*(?P<delay>\w+)\s*\)'
      description: "检测卡插拔变化"
    - pattern: 'mmc_gpio_get_cd\s*\(\s*(?P<host>\w+)\s*\)'
      description: "通过 GPIO 获取卡检测"
    - pattern: 'mmc_gpio_get_ro\s*\(\s*(?P<host>\w+)\s*\)'
      description: "通过 GPIO 获取写保护"

# ============================================================
# SDIO DEVICE DRIVER
# ============================================================
sdio_driver:
  description: "SDIO Device Driver"
  header: "linux/mmc/sdio_func.h"
  icon: "📡"
  registration:
    - pattern: 'sdio_register_driver\s*\(\s*&(?P<driver>\w+)\s*\)'
      description: "注册 SDIO 驱动"
    - pattern: 'module_sdio_driver\s*\(\s*(?P<driver>\w+)\s*\)'
      description: "模块 SDIO 驱动宏"
  unregistration:
    - pattern: 'sdio_unregister_driver\s*\(\s*&(?P<driver>\w+)\s*\)'
      description: "注销 SDIO 驱动"
  structure:
    name: "sdio_driver"
    callbacks:
      probe:
        pattern: '\.probe\s*=\s*(?P<handler>\w+)'
        description: "SDIO 设备探测"
        context: "process"
        can_sleep: true
      remove:
        pattern: '\.remove\s*=\s*(?P<handler>\w+)'
        description: "SDIO 设备移除"
        context: "process"
        can_sleep: true
  helpers:
    - pattern: 'sdio_claim_host\s*\(\s*(?P<func>\w+)\s*\)'
      description: "获取 SDIO 总线锁"
    - pattern: 'sdio_release_host\s*\(\s*(?P<func>\w+)\s*\)'
      description: "释放 SDIO 总线锁"
    - pattern: 'sdio_enable_func\s*\(\s*(?P<func>\w+)\s*\)'
      description: "启用 SDIO 功能"
    - pattern: 'sdio_disable_func\s*\(\s*(?P<func>\w+)\s*\)'
      description: "禁用 SDIO 功能"
    - pattern: 'sdio_claim_irq\s*\(\s*(?P<func>\w+)\s*,\s*(?P<handler>\w+)\s*\)'
      description: "注册 SDIO 中断处理"
    - pattern: 'sdio_release_irq\s*\(\s*(?P<func>\w+)\s*\)'
      description: "释放 SDIO 中断"
    - pattern: 'sdio_readb\s*\(\s*(?P<func>\w+)\s*,\s*(?P<addr>\w+)\s*,'
      description: "读取 SDIO 字节"
    - pattern: 'sdio_writeb\s*\(\s*(?P<func>\w+)\s*,\s*(?P<val>\w+)\s*,\s*(?P<addr>\w+)\s*,'
      description: "写入 SDIO 字节"

# ============================================================
# MMC BLOCK DEVICE
# ============================================================
mmc_blk:
  description: "MMC Block Device Layer"
  header: "linux/mmc/card.h"
  icon: "📦"
  patterns:
    - pattern: 'mmc_blk_issue_rq\s*\('
      description: "发起块请求"
    - pattern: 'mmc_start_bkops\s*\('
      description: "启动后台操作"
    - pattern: 'mmc_blk_rw_rq_prep\s*\('
      description: "准备读写请求"

# ============================================================
# CALL CHAINS
# ============================================================
call_chains:
  mmc_probe:
    description: "MMC Host Controller Probe Flow"
    chain:
      - caller: "platform_driver.probe"
        callee: "mmc_alloc_host"
        description: "分配主机结构"
      - caller: "platform_driver.probe"
        callee: "mmc_add_host"
        description: "注册主机控制器"
      - caller: "mmc_add_host"
        callee: "mmc_start_host"
        async: true
        description: "启动主机（异步扫描卡）"
  mmc_request:
    description: "MMC Request Processing"
    chain:
      - caller: "mmc_start_request"
        callee: "host->ops->request"
        description: "调用主机控制器请求处理"
      - caller: "host->ops->request"
        callee: "mmc_request_done"
        async: true
        description: "请求完成回调（可能在中断上下文）"
  card_detect:
    description: "Card Detection Flow"
    chain:
      - caller: "GPIO IRQ"
        callee: "mmc_gpio_cd_irq"
        context: "hardirq"
      - caller: "mmc_gpio_cd_irq"
        callee: "mmc_detect_change"
        description: "触发卡检测"
      - caller: "mmc_detect_change"
        callee: "mmc_rescan"
        async: true
        mechanism: "delayed_work"


# ============================================================
# DATA STRUCTURES
# ============================================================

data_structures:
  mmc_host:
    pattern: 'struct mmc_host\s*\{'
    description: "MMC 主机控制器结构"
    file: "include/linux/mmc/host.h"
    fields:
      - name: "ops"
        type: "const struct mmc_host_ops *"
        description: "操作函数表"
      - name: "class_dev"
        type: "struct device"
        description: "类设备"
      - name: "parent"
        type: "struct device *"
        description: "父设备"
      - name: "f_min"
        type: "unsigned int"
        description: "最小频率"
      - name: "f_max"
        type: "unsigned int"
        description: "最大频率"
      - name: "ocr_avail"
        type: "u32"
        description: "可用电压范围"
      - name: "caps"
        type: "u32"
        description: "主机能力"
      - name: "caps2"
        type: "u32"
        description: "扩展能力"
      - name: "ios"
        type: "struct mmc_ios"
        description: "当前 IO 设置"
      - name: "card"
        type: "struct mmc_card *"
        description: "当前卡"

  mmc_request:
    pattern: 'struct mmc_request\s*\{'
    description: "MMC 请求结构"
    file: "include/linux/mmc/core.h"
    fields:
      - name: "sbc"
        type: "struct mmc_command *"
        description: "设置块计数命令"
      - name: "cmd"
        type: "struct mmc_command *"
        description: "主命令"
      - name: "data"
        type: "struct mmc_data *"
        description: "数据传输"
      - name: "stop"
        type: "struct mmc_command *"
        description: "停止命令"
      - name: "done"
        type: "void (*)(struct mmc_request *)"
        description: "完成回调"


# ============================================================
# EXAMPLES
# ============================================================

examples:
  - description: "基本 MMC 主机控制器驱动"
    kernel_version: "5.0+"
    code: |
      #include <linux/module.h>
      #include <linux/mmc/host.h>
      #include <linux/platform_device.h>
      
      struct my_mmc_host {
          struct mmc_host *mmc;
          void __iomem *regs;
          struct clk *clk;
          int irq;
      };
      
      static void my_mmc_request(struct mmc_host *mmc,
                                  struct mmc_request *mrq)
      {
          struct my_mmc_host *host = mmc_priv(mmc);
          struct mmc_command *cmd = mrq->cmd;
          
          /* 设置命令 */
          writel(cmd->arg, host->regs + CMD_ARG);
          writel(cmd->opcode | CMD_START, host->regs + CMD_REG);
          
          /* 启动 DMA 如果有数据 */
          if (mrq->data) {
              my_mmc_setup_dma(host, mrq->data);
          }
      }
      
      static void my_mmc_set_ios(struct mmc_host *mmc,
                                  struct mmc_ios *ios)
      {
          struct my_mmc_host *host = mmc_priv(mmc);
          
          /* 设置时钟 */
          if (ios->clock) {
              clk_set_rate(host->clk, ios->clock);
              writel(CLK_ENABLE, host->regs + CLK_REG);
          } else {
              writel(0, host->regs + CLK_REG);
          }
          
          /* 设置总线宽度 */
          switch (ios->bus_width) {
          case MMC_BUS_WIDTH_4:
              writel(BUS_4BIT, host->regs + BUS_REG);
              break;
          case MMC_BUS_WIDTH_8:
              writel(BUS_8BIT, host->regs + BUS_REG);
              break;
          default:
              writel(BUS_1BIT, host->regs + BUS_REG);
              break;
          }
          
          /* 设置电源 */
          if (ios->power_mode == MMC_POWER_UP) {
              writel(PWR_ON, host->regs + PWR_REG);
          } else if (ios->power_mode == MMC_POWER_OFF) {
              writel(0, host->regs + PWR_REG);
          }
      }
      
      static int my_mmc_get_cd(struct mmc_host *mmc)
      {
          struct my_mmc_host *host = mmc_priv(mmc);
          return !(readl(host->regs + STATUS_REG) & CARD_ABSENT);
      }
      
      static const struct mmc_host_ops my_mmc_ops = {
          .request    = my_mmc_request,
          .set_ios    = my_mmc_set_ios,
          .get_cd     = my_mmc_get_cd,
      };
      
      static irqreturn_t my_mmc_irq(int irq, void *data)
      {
          struct my_mmc_host *host = data;
          u32 status = readl(host->regs + INT_STATUS);
          struct mmc_request *mrq = host->mmc->ongoing_mrq;
          
          if (status & CMD_DONE) {
              struct mmc_command *cmd = mrq->cmd;
              cmd->resp[0] = readl(host->regs + RESP0);
              cmd->error = 0;
          }
          
          if (status & DATA_DONE || status & CMD_DONE) {
              writel(status, host->regs + INT_CLEAR);
              mmc_request_done(host->mmc, mrq);
          }
          
          return IRQ_HANDLED;
      }
      
      static int my_mmc_probe(struct platform_device *pdev)
      {
          struct my_mmc_host *host;
          struct mmc_host *mmc;
          int ret;
          
          mmc = mmc_alloc_host(sizeof(*host), &pdev->dev);
          if (!mmc)
              return -ENOMEM;
          
          host = mmc_priv(mmc);
          host->mmc = mmc;
          
          host->regs = devm_platform_ioremap_resource(pdev, 0);
          if (IS_ERR(host->regs)) {
              ret = PTR_ERR(host->regs);
              goto free_host;
          }
          
          host->irq = platform_get_irq(pdev, 0);
          ret = devm_request_irq(&pdev->dev, host->irq, my_mmc_irq,
                                  0, "my-mmc", host);
          if (ret)
              goto free_host;
          
          mmc->ops = &my_mmc_ops;
          mmc->f_min = 400000;
          mmc->f_max = 50000000;
          mmc->ocr_avail = MMC_VDD_32_33 | MMC_VDD_33_34;
          mmc->caps = MMC_CAP_4_BIT_DATA | MMC_CAP_SD_HIGHSPEED;
          
          platform_set_drvdata(pdev, host);
          
          ret = mmc_add_host(mmc);
          if (ret)
              goto free_host;
          
          return 0;
          
      free_host:
          mmc_free_host(mmc);
          return ret;
      }
      
      static int my_mmc_remove(struct platform_device *pdev)
      {
          struct my_mmc_host *host = platform_get_drvdata(pdev);
          
          mmc_remove_host(host->mmc);
          mmc_free_host(host->mmc);
          return 0;
      }
      
      static struct platform_driver my_mmc_driver = {
          .probe  = my_mmc_probe,
          .remove = my_mmc_remove,
          .driver = {
              .name = "my-mmc",
          },
      };
      module_platform_driver(my_mmc_driver);

# ============================================================
# ADDITIONAL DATA STRUCTURES
# ============================================================

  mmc_card:
    pattern: 'struct mmc_card\s*\{'
    description: "MMC/SD 卡结构"
    file: "include/linux/mmc/card.h"
    fields:
      - name: "host"
        type: "struct mmc_host *"
        description: "关联主机"
      - name: "dev"
        type: "struct device"
        description: "内嵌设备"
      - name: "type"
        type: "unsigned int"
        description: "卡类型 (SD/MMC/SDIO)"
      - name: "state"
        type: "unsigned int"
        description: "卡状态"
      - name: "rca"
        type: "unsigned int"
        description: "相对卡地址"
      - name: "ocr"
        type: "u32"
        description: "操作条件寄存器"

  mmc_command:
    pattern: 'struct mmc_command\s*\{'
    description: "MMC 命令结构"
    file: "include/linux/mmc/core.h"
    fields:
      - name: "opcode"
        type: "u32"
        description: "命令码"
      - name: "arg"
        type: "u32"
        description: "命令参数"
      - name: "resp"
        type: "u32[4]"
        description: "响应（最多 128 位）"
      - name: "flags"
        type: "unsigned int"
        description: "命令标志"
      - name: "error"
        type: "int"
        description: "错误码"

  mmc_data:
    pattern: 'struct mmc_data\s*\{'
    description: "MMC 数据传输结构"
    file: "include/linux/mmc/core.h"
    fields:
      - name: "blksz"
        type: "unsigned int"
        description: "块大小"
      - name: "blocks"
        type: "unsigned int"
        description: "块数量"
      - name: "error"
        type: "int"
        description: "错误码"
      - name: "flags"
        type: "unsigned int"
        description: "传输标志"
      - name: "bytes_xfered"
        type: "unsigned int"
        description: "已传输字节数"
      - name: "sg"
        type: "struct scatterlist *"
        description: "散列表"
      - name: "sg_len"
        type: "unsigned int"
        description: "散列表长度"

  mmc_ios:
    pattern: 'struct mmc_ios\s*\{'
    description: "MMC IO 设置"
    file: "include/linux/mmc/host.h"
    fields:
      - name: "clock"
        type: "unsigned int"
        description: "时钟频率"
      - name: "vdd"
        type: "unsigned short"
        description: "VDD 电压选择"
      - name: "bus_mode"
        type: "unsigned char"
        description: "总线模式"
      - name: "bus_width"
        type: "unsigned char"
        description: "总线宽度"
      - name: "timing"
        type: "unsigned char"
        description: "时序模式"
      - name: "signal_voltage"
        type: "unsigned char"
        description: "信号电压"

# ============================================================
# MMC CAPABILITIES
# ============================================================

mmc_capabilities:
  description: "MMC Host Capabilities"
  caps:
    - MMC_CAP_4_BIT_DATA: "支持 4 位数据"
    - MMC_CAP_8_BIT_DATA: "支持 8 位数据"
    - MMC_CAP_SD_HIGHSPEED: "支持 SD 高速模式"
    - MMC_CAP_MMC_HIGHSPEED: "支持 MMC 高速模式"
    - MMC_CAP_UHS_SDR12: "支持 UHS SDR12"
    - MMC_CAP_UHS_SDR50: "支持 UHS SDR50"
    - MMC_CAP_UHS_SDR104: "支持 UHS SDR104"
    - MMC_CAP_UHS_DDR50: "支持 UHS DDR50"

  caps2:
    - MMC_CAP2_HS200_1_8V_SDR: "支持 HS200 1.8V"
    - MMC_CAP2_HS400_1_8V: "支持 HS400 1.8V"
    - MMC_CAP2_HS400_ES: "支持 HS400 增强选通"
    - MMC_CAP2_CQE: "支持命令队列"

# ============================================================
# ADDITIONAL HOST OPERATIONS
# ============================================================

mmc_host_ops_extended:
  description: "Extended MMC Host Operations"
  header: "linux/mmc/host.h"

  callbacks:
    pre_req:
      pattern: '\.pre_req\s*=\s*(?P<handler>\w+)'
      description: "请求预处理（DMA 映射）"
      context: "process"

    post_req:
      pattern: '\.post_req\s*=\s*(?P<handler>\w+)'
      description: "请求后处理（DMA 解映射）"
      context: "process/softirq"

    execute_tuning:
      pattern: '\.execute_tuning\s*=\s*(?P<handler>\w+)'
      description: "执行时序调谐"
      context: "process"
      can_sleep: true

# ============================================================
# ADDITIONAL CALL CHAINS
# ============================================================

  mmc_suspend:
    description: "MMC Power Management Suspend"
    chain:
      - caller: "system suspend"
        callee: "mmc_pm_notify"
        description: "PM 通知"
      - caller: "mmc_pm_notify"
        callee: "mmc_suspend_host"
        description: "挂起主机"
      - caller: "mmc_suspend_host"
        callee: "host->ops->set_ios"
        description: "设置低功耗状态"

  mmc_tuning:
    description: "MMC Tuning Flow"
    chain:
      - caller: "mmc_init_card"
        callee: "mmc_execute_tuning"
        description: "执行调谐"
      - caller: "mmc_execute_tuning"
        callee: "host->ops->execute_tuning"
        description: "主机调谐实现"
      - caller: "execute_tuning"
        callee: "mmc_send_tuning"
        description: "发送调谐块"

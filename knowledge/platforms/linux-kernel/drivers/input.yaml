examples:
  - description: "简单按键驱动 (GPIO 按钮)"
    kernel_version: "5.0+"
    code: |
      #include <linux/module.h>
      #include <linux/input.h>
      #include <linux/gpio.h>
      #include <linux/interrupt.h>
      
      struct button_data {
          struct input_dev *input;
          int gpio;
          int irq;
      };
      
      static irqreturn_t button_irq_handler(int irq, void *dev_id)
      {
          struct button_data *data = dev_id;
          int pressed = gpio_get_value(data->gpio);
          
          /* 上报按键事件 */
          input_report_key(data->input, KEY_ENTER, pressed);
          input_sync(data->input);
          
          return IRQ_HANDLED;
      }
      
      static int button_probe(struct platform_device *pdev)
      {
          struct button_data *data;
          struct input_dev *input;
          int error;
          
          data = devm_kzalloc(&pdev->dev, sizeof(*data), GFP_KERNEL);
          if (!data)
              return -ENOMEM;
          
          /* 分配输入设备 */
          input = devm_input_allocate_device(&pdev->dev);
          if (!input)
              return -ENOMEM;
          
          data->input = input;
          data->gpio = /* 从 DT/platform_data 获取 */;
          
          /* 设置设备信息 */
          input->name = "gpio-button";
          input->phys = "gpio-button/input0";
          input->id.bustype = BUS_HOST;
          
          /* 设置能力 */
          input_set_capability(input, EV_KEY, KEY_ENTER);
          
          /* 注册设备 */
          error = input_register_device(input);
          if (error)
              return error;
          
          /* 请求中断 */
          data->irq = gpio_to_irq(data->gpio);
          error = devm_request_irq(&pdev->dev, data->irq,
                                   button_irq_handler,
                                   IRQF_TRIGGER_RISING | IRQF_TRIGGER_FALLING,
                                   "gpio-button", data);
          
          return error;
      }

  - description: "多点触摸屏驱动 (Type B)"
    kernel_version: "3.0+"
    code: |
      #include <linux/module.h>
      #include <linux/input.h>
      #include <linux/input/mt.h>
      #include <linux/i2c.h>
      
      #define MAX_TOUCH_POINTS 10
      
      struct touch_data {
          struct input_dev *input;
          struct i2c_client *client;
      };
      
      static irqreturn_t touch_irq_handler(int irq, void *dev_id)
      {
          struct touch_data *data = dev_id;
          struct input_dev *input = data->input;
          int i, x, y, id, active;
          
          /* 读取触摸数据 (从 I2C) */
          for (i = 0; i < MAX_TOUCH_POINTS; i++) {
              /* 从硬件读取 */
              id = /* read tracking id */;
              active = /* read active state */;
              x = /* read x position */;
              y = /* read y position */;
              
              /* 选择槽 */
              input_mt_slot(input, i);
              
              /* 报告槽状态 */
              input_mt_report_slot_state(input, MT_TOOL_FINGER, active);
              
              if (active) {
                  input_report_abs(input, ABS_MT_POSITION_X, x);
                  input_report_abs(input, ABS_MT_POSITION_Y, y);
                  input_report_abs(input, ABS_MT_TRACKING_ID, id);
              }
          }
          
          /* 生成单点模拟 */
          input_mt_report_pointer_emulation(input, true);
          
          /* 同步 */
          input_sync(input);
          
          return IRQ_HANDLED;
      }
      
      static int touch_probe(struct i2c_client *client)
      {
          struct touch_data *data;
          struct input_dev *input;
          int error;
          
          data = devm_kzalloc(&client->dev, sizeof(*data), GFP_KERNEL);
          if (!data)
              return -ENOMEM;
          
          input = devm_input_allocate_device(&client->dev);
          if (!input)
              return -ENOMEM;
          
          data->input = input;
          data->client = client;
          
          input->name = "i2c-touchscreen";
          input->id.bustype = BUS_I2C;
          
          /* 设置绝对坐标 */
          input_set_abs_params(input, ABS_MT_POSITION_X, 0, 1920, 0, 0);
          input_set_abs_params(input, ABS_MT_POSITION_Y, 0, 1080, 0, 0);
          
          /* 初始化 MT 槽 */
          error = input_mt_init_slots(input, MAX_TOUCH_POINTS,
                                      INPUT_MT_DIRECT | INPUT_MT_DROP_UNUSED);
          if (error)
              return error;
          
          error = input_register_device(input);
          if (error)
              return error;
          
          return devm_request_threaded_irq(&client->dev, client->irq,
                                           NULL, touch_irq_handler,
                                           IRQF_ONESHOT, "touchscreen", data);
      }

  - description: "输入处理器示例 (类似 evdev)"
    code: |
      #include <linux/module.h>
      #include <linux/input.h>
      #include <linux/cdev.h>
      
      struct my_handler_data {
          struct input_handle handle;
          struct cdev cdev;
          /* 事件缓冲区等 */
      };
      
      static void my_handler_event(struct input_handle *handle,
                                   unsigned int type,
                                   unsigned int code,
                                   int value)
      {
          /* 处理单个事件 */
          pr_info("Event: type=%d, code=%d, value=%d\n", type, code, value);
      }
      
      static int my_handler_connect(struct input_handler *handler,
                                    struct input_dev *dev,
                                    const struct input_device_id *id)
      {
          struct my_handler_data *data;
          int error;
          
          data = kzalloc(sizeof(*data), GFP_KERNEL);
          if (!data)
              return -ENOMEM;
          
          data->handle.dev = dev;
          data->handle.handler = handler;
          data->handle.name = "my-handler";
          data->handle.private = data;
          
          error = input_register_handle(&data->handle);
          if (error)
              goto err_free;
          
          error = input_open_device(&data->handle);
          if (error)
              goto err_unregister;
          
          return 0;
          
      err_unregister:
          input_unregister_handle(&data->handle);
      err_free:
          kfree(data);
          return error;
      }
      
      static void my_handler_disconnect(struct input_handle *handle)
      {
          struct my_handler_data *data = handle->private;
          
          input_close_device(handle);
          input_unregister_handle(handle);
          kfree(data);
      }
      
      static const struct input_device_id my_handler_ids[] = {
          { .driver_info = 1 },  /* 匹配所有设备 */
          { },
      };
      
      static struct input_handler my_handler = {
          .event      = my_handler_event,
          .connect    = my_handler_connect,
          .disconnect = my_handler_disconnect,
          .name       = "my-handler",
          .id_table   = my_handler_ids,
      };
      
      module_input_handler(my_handler);

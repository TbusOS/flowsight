call_chains:
  pinctrl_select_state_chain:
    description: "选择引脚状态调用链"
    trigger: "驱动调用 pinctrl_select_state()"
    chain:
      - function: "pinctrl_select_state"
        file: "drivers/pinctrl/core.c"
        description: "选择状态入口"
        context: "process"
      - function: "pinctrl_commit_state"
        file: "drivers/pinctrl/core.c"
        description: "提交状态"
      - function: "pinmux_enable_setting"
        file: "drivers/pinctrl/pinmux.c"
        description: "启用复用设置"
      - function: "ops->set_mux"
        file: "驱动代码"
        description: "驱动设置复用"
        is_user_entry: true
      - function: "pinconf_apply_setting"
        file: "drivers/pinctrl/pinconf.c"
        description: "应用配置"
      - function: "ops->pin_config_group_set"
        file: "驱动代码"
        description: "驱动设置配置"
        is_user_entry: true

  gpio_request_chain:
    description: "GPIO 请求调用链"
    trigger: "gpio_request()"
    chain:
      - function: "gpiod_request"
        file: "drivers/gpio/gpiolib.c"
        description: "GPIO 请求入口"
        context: "process"
      - function: "pinctrl_gpio_request"
        file: "drivers/pinctrl/core.c"
        description: "pinctrl 处理 GPIO 请求"
      - function: "pinmux_request_gpio"
        file: "drivers/pinctrl/pinmux.c"
        description: "pinmux 处理"
      - function: "ops->gpio_request_enable"
        file: "驱动代码"
        description: "驱动启用 GPIO 模式"
        is_user_entry: true

  dt_parse_chain:
    description: "设备树解析调用链"
    trigger: "设备树 pinctrl 解析"
    chain:
      - function: "pinctrl_dt_to_map"
        file: "drivers/pinctrl/devicetree.c"
        description: "设备树转换"
        context: "process"
      - function: "dt_to_map_one_config"
        file: "drivers/pinctrl/devicetree.c"
        description: "处理单个配置"
      - function: "ops->dt_node_to_map"
        file: "驱动代码"
        description: "驱动解析设备树"
        is_user_entry: true


# ============================================================
# EXAMPLES
# ============================================================

examples:
  - description: "完整引脚控制器驱动"
    kernel_version: "5.0+"
    code: |
      #include <linux/module.h>
      #include <linux/platform_device.h>
      #include <linux/of.h>
      #include <linux/pinctrl/pinctrl.h>
      #include <linux/pinctrl/pinmux.h>
      #include <linux/pinctrl/pinconf.h>
      #include <linux/pinctrl/pinconf-generic.h>

      #define MY_NPINS 32
      #define MY_NGROUPS 8
      #define MY_NFUNCS 4

      struct my_pinctrl {
          struct device *dev;
          struct pinctrl_dev *pctldev;
          void __iomem *base;
      };

      /* 引脚定义 */
      static const struct pinctrl_pin_desc my_pins[] = {
          PINCTRL_PIN(0, "gpio0"),
          PINCTRL_PIN(1, "gpio1"),
          PINCTRL_PIN(2, "gpio2"),
          PINCTRL_PIN(3, "gpio3"),
          PINCTRL_PIN(4, "gpio4"),
          PINCTRL_PIN(5, "gpio5"),
          PINCTRL_PIN(6, "gpio6"),
          PINCTRL_PIN(7, "gpio7"),
          /* ... 更多引脚 ... */
      };

      /* 引脚组定义 */
      static const unsigned int uart0_pins[] = { 0, 1 };
      static const unsigned int uart1_pins[] = { 2, 3 };
      static const unsigned int spi0_pins[] = { 4, 5, 6, 7 };
      static const unsigned int i2c0_pins[] = { 8, 9 };

      struct my_pin_group {
          const char *name;
          const unsigned int *pins;
          unsigned int npins;
      };

      static const struct my_pin_group my_groups[] = {
          { "uart0_grp", uart0_pins, ARRAY_SIZE(uart0_pins) },
          { "uart1_grp", uart1_pins, ARRAY_SIZE(uart1_pins) },
          { "spi0_grp", spi0_pins, ARRAY_SIZE(spi0_pins) },
          { "i2c0_grp", i2c0_pins, ARRAY_SIZE(i2c0_pins) },
      };

      /* 功能定义 */
      struct my_pmx_func {
          const char *name;
          const char * const *groups;
          unsigned int ngroups;
          unsigned int mux_val;
      };

      static const char * const uart_groups[] = { "uart0_grp", "uart1_grp" };
      static const char * const spi_groups[] = { "spi0_grp" };
      static const char * const i2c_groups[] = { "i2c0_grp" };
      static const char * const gpio_groups[] = { "uart0_grp", "uart1_grp", 
                                                   "spi0_grp", "i2c0_grp" };

      static const struct my_pmx_func my_functions[] = {
          { "uart", uart_groups, ARRAY_SIZE(uart_groups), 0x1 },
          { "spi", spi_groups, ARRAY_SIZE(spi_groups), 0x2 },
          { "i2c", i2c_groups, ARRAY_SIZE(i2c_groups), 0x3 },
          { "gpio", gpio_groups, ARRAY_SIZE(gpio_groups), 0x0 },
      };

      /* pinctrl_ops 实现 */
      static int my_get_groups_count(struct pinctrl_dev *pctldev)
      {
          return ARRAY_SIZE(my_groups);
      }

      static const char *my_get_group_name(struct pinctrl_dev *pctldev,
                                            unsigned int selector)
      {
          return my_groups[selector].name;
      }

      static int my_get_group_pins(struct pinctrl_dev *pctldev,
                                    unsigned int selector,
                                    const unsigned int **pins,
                                    unsigned int *num_pins)
      {
          *pins = my_groups[selector].pins;
          *num_pins = my_groups[selector].npins;
          return 0;
      }

      static int my_dt_node_to_map(struct pinctrl_dev *pctldev,
                                    struct device_node *np,
                                    struct pinctrl_map **map,
                                    unsigned int *num_maps)
      {
          return pinconf_generic_dt_node_to_map(pctldev, np, map, num_maps,
                                                 PIN_MAP_TYPE_MUX_GROUP);
      }

      static const struct pinctrl_ops my_pctrl_ops = {
          .get_groups_count = my_get_groups_count,
          .get_group_name = my_get_group_name,
          .get_group_pins = my_get_group_pins,
          .dt_node_to_map = my_dt_node_to_map,
          .dt_free_map = pinctrl_utils_free_map,
      };

      /* pinmux_ops 实现 */
      static int my_get_functions_count(struct pinctrl_dev *pctldev)
      {
          return ARRAY_SIZE(my_functions);
      }

      static const char *my_get_function_name(struct pinctrl_dev *pctldev,
                                               unsigned int selector)
      {
          return my_functions[selector].name;
      }

      static int my_get_function_groups(struct pinctrl_dev *pctldev,
                                         unsigned int selector,
                                         const char * const **groups,
                                         unsigned int *num_groups)
      {
          *groups = my_functions[selector].groups;
          *num_groups = my_functions[selector].ngroups;
          return 0;
      }

      static int my_set_mux(struct pinctrl_dev *pctldev,
                            unsigned int func_selector,
                            unsigned int group_selector)
      {
          struct my_pinctrl *pctl = pinctrl_dev_get_drvdata(pctldev);
          const struct my_pin_group *grp = &my_groups[group_selector];
          const struct my_pmx_func *func = &my_functions[func_selector];
          int i;

          dev_dbg(pctl->dev, "set mux: func=%s group=%s\n",
                  func->name, grp->name);

          /* 配置每个引脚的复用 */
          for (i = 0; i < grp->npins; i++) {
              unsigned int pin = grp->pins[i];
              u32 reg = readl(pctl->base + pin * 4);
              
              reg &= ~0xf;  /* 清除复用位 */
              reg |= func->mux_val;
              
              writel(reg, pctl->base + pin * 4);
          }

          return 0;
      }

      static int my_gpio_request_enable(struct pinctrl_dev *pctldev,
                                         struct pinctrl_gpio_range *range,
                                         unsigned int offset)
      {
          struct my_pinctrl *pctl = pinctrl_dev_get_drvdata(pctldev);
          u32 reg;

          /* 切换到 GPIO 模式 */
          reg = readl(pctl->base + offset * 4);
          reg &= ~0xf;  /* GPIO 模式 = 0 */
          writel(reg, pctl->base + offset * 4);

          return 0;
      }

      static const struct pinmux_ops my_pmx_ops = {
          .get_functions_count = my_get_functions_count,
          .get_function_name = my_get_function_name,
          .get_function_groups = my_get_function_groups,
          .set_mux = my_set_mux,
          .gpio_request_enable = my_gpio_request_enable,
          .strict = true,
      };

      /* pinconf_ops 实现 */
      static int my_pin_config_get(struct pinctrl_dev *pctldev,
                                    unsigned int pin,
                                    unsigned long *config)
      {
          struct my_pinctrl *pctl = pinctrl_dev_get_drvdata(pctldev);
          enum pin_config_param param = pinconf_to_config_param(*config);
          u32 reg = readl(pctl->base + pin * 4);
          u32 arg = 0;

          switch (param) {
          case PIN_CONFIG_BIAS_PULL_UP:
              if (!(reg & BIT(4)))
                  return -EINVAL;
              arg = 1;
              break;
          case PIN_CONFIG_BIAS_PULL_DOWN:
              if (!(reg & BIT(5)))
                  return -EINVAL;
              arg = 1;
              break;
          case PIN_CONFIG_DRIVE_STRENGTH:
              arg = (reg >> 8) & 0x7;  /* 驱动强度位 */
              break;
          default:
              return -ENOTSUPP;
          }

          *config = pinconf_to_config_packed(param, arg);
          return 0;
      }

      static int my_pin_config_set(struct pinctrl_dev *pctldev,
                                    unsigned int pin,
                                    unsigned long *configs,
                                    unsigned int num_configs)
      {
          struct my_pinctrl *pctl = pinctrl_dev_get_drvdata(pctldev);
          int i;

          for (i = 0; i < num_configs; i++) {
              enum pin_config_param param = 
                  pinconf_to_config_param(configs[i]);
              u32 arg = pinconf_to_config_argument(configs[i]);
              u32 reg = readl(pctl->base + pin * 4);

              switch (param) {
              case PIN_CONFIG_BIAS_DISABLE:
                  reg &= ~(BIT(4) | BIT(5));
                  break;
              case PIN_CONFIG_BIAS_PULL_UP:
                  reg |= BIT(4);
                  reg &= ~BIT(5);
                  break;
              case PIN_CONFIG_BIAS_PULL_DOWN:
                  reg |= BIT(5);
                  reg &= ~BIT(4);
                  break;
              case PIN_CONFIG_DRIVE_STRENGTH:
                  reg &= ~(0x7 << 8);
                  reg |= (arg & 0x7) << 8;
                  break;
              case PIN_CONFIG_INPUT_ENABLE:
                  if (arg)
                      reg |= BIT(12);
                  else
                      reg &= ~BIT(12);
                  break;
              case PIN_CONFIG_OUTPUT_ENABLE:
                  if (arg)
                      reg |= BIT(13);
                  else
                      reg &= ~BIT(13);
                  break;
              default:
                  return -ENOTSUPP;
              }

              writel(reg, pctl->base + pin * 4);
          }

          return 0;
      }

      static const struct pinconf_ops my_pconf_ops = {
          .is_generic = true,
          .pin_config_get = my_pin_config_get,
          .pin_config_set = my_pin_config_set,
      };

      /* pinctrl_desc */
      static struct pinctrl_desc my_pctrl_desc = {
          .name = "my-pinctrl",
          .pins = my_pins,
          .npins = ARRAY_SIZE(my_pins),
          .pctlops = &my_pctrl_ops,
          .pmxops = &my_pmx_ops,
          .confops = &my_pconf_ops,
          .owner = THIS_MODULE,
      };

      static int my_pinctrl_probe(struct platform_device *pdev)
      {
          struct my_pinctrl *pctl;
          int ret;

          pctl = devm_kzalloc(&pdev->dev, sizeof(*pctl), GFP_KERNEL);
          if (!pctl)
              return -ENOMEM;

          pctl->dev = &pdev->dev;

          pctl->base = devm_platform_ioremap_resource(pdev, 0);
          if (IS_ERR(pctl->base))
              return PTR_ERR(pctl->base);

          ret = devm_pinctrl_register_and_init(&pdev->dev, &my_pctrl_desc,
                                                pctl, &pctl->pctldev);
          if (ret)
              return ret;

          ret = pinctrl_enable(pctl->pctldev);
          if (ret)
              return ret;

          platform_set_drvdata(pdev, pctl);

          dev_info(&pdev->dev, "registered pinctrl driver\n");
          return 0;
      }

      static const struct of_device_id my_pinctrl_of_match[] = {
          { .compatible = "vendor,my-pinctrl" },
          { }
      };
      MODULE_DEVICE_TABLE(of, my_pinctrl_of_match);

      static struct platform_driver my_pinctrl_driver = {
          .driver = {
              .name = "my-pinctrl",
              .of_match_table = my_pinctrl_of_match,
          },
          .probe = my_pinctrl_probe,
      };
      module_platform_driver(my_pinctrl_driver);

      MODULE_LICENSE("GPL");
      MODULE_DESCRIPTION("My Pin Controller Driver");

  - description: "消费者使用引脚控制"
    kernel_version: "5.0+"
    code: |
      /* 驱动中使用引脚控制 */
      #include <linux/pinctrl/consumer.h>

      struct my_device {
          struct pinctrl *pinctrl;
          struct pinctrl_state *pins_default;
          struct pinctrl_state *pins_sleep;
          struct pinctrl_state *pins_active;
      };

      static int my_driver_probe(struct platform_device *pdev)
      {
          struct my_device *dev;
          int ret;

          dev = devm_kzalloc(&pdev->dev, sizeof(*dev), GFP_KERNEL);
          if (!dev)
              return -ENOMEM;

          /* 获取引脚控制句柄 */
          dev->pinctrl = devm_pinctrl_get(&pdev->dev);
          if (IS_ERR(dev->pinctrl)) {
              if (PTR_ERR(dev->pinctrl) != -ENODEV)
                  return PTR_ERR(dev->pinctrl);
              dev->pinctrl = NULL;
          }

          if (dev->pinctrl) {
              /* 查找各个状态 */
              dev->pins_default = pinctrl_lookup_state(dev->pinctrl,
                                                        PINCTRL_STATE_DEFAULT);
              if (IS_ERR(dev->pins_default))
                  dev->pins_default = NULL;

              dev->pins_sleep = pinctrl_lookup_state(dev->pinctrl,
                                                      PINCTRL_STATE_SLEEP);
              if (IS_ERR(dev->pins_sleep))
                  dev->pins_sleep = NULL;

              dev->pins_active = pinctrl_lookup_state(dev->pinctrl,
                                                       "active");
              if (IS_ERR(dev->pins_active))
                  dev->pins_active = NULL;

              /* 应用默认状态 */
              if (dev->pins_default) {
                  ret = pinctrl_select_state(dev->pinctrl, dev->pins_default);
                  if (ret)
                      dev_warn(&pdev->dev, "failed to set default pins\n");
              }
          }

          platform_set_drvdata(pdev, dev);
          return 0;
      }

      static int my_driver_suspend(struct device *dev)
      {
          struct my_device *mydev = dev_get_drvdata(dev);

          /* 切换到睡眠引脚状态 */
          if (mydev->pinctrl && mydev->pins_sleep)
              pinctrl_select_state(mydev->pinctrl, mydev->pins_sleep);

          return 0;
      }

      static int my_driver_resume(struct device *dev)
      {
          struct my_device *mydev = dev_get_drvdata(dev);

          /* 恢复默认引脚状态 */
          if (mydev->pinctrl && mydev->pins_default)
              pinctrl_select_state(mydev->pinctrl, mydev->pins_default);

          return 0;
      }

      /* 运行时切换引脚状态 */
      static int my_driver_set_mode(struct my_device *dev, bool active)
      {
          struct pinctrl_state *state;

          if (!dev->pinctrl)
              return 0;

          state = active ? dev->pins_active : dev->pins_default;
          if (!state)
              return 0;

          return pinctrl_select_state(dev->pinctrl, state);
      }


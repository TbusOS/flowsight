    - pattern: 'pinconf_to_config_argument\s*\(\s*(?P<config>\w+)\s*\)'
      description: "从配置提取参数值"
      context: "any"
    - pattern: 'pinconf_to_config_packed\s*\(\s*(?P<param>\w+)\s*,\s*(?P<arg>\w+)\s*\)'
      description: "打包配置参数和值"
      context: "any"


# ============================================================
# PINCTRL CONSUMER API
# ============================================================

pinctrl_consumer:
  description: "Pin Control Consumer API - 引脚控制消费者接口"
  header: "linux/pinctrl/consumer.h"
  icon: "🔗"

  context:
    type: "process"
    can_sleep: true

  registration:
    - pattern: 'pinctrl_get\s*\(\s*(?P<dev>[^)]+)\s*\)'
      description: "获取引脚控制句柄"
    - pattern: 'devm_pinctrl_get\s*\(\s*(?P<dev>[^)]+)\s*\)'
      description: "资源管理方式获取"
    - pattern: 'pinctrl_put\s*\(\s*(?P<p>[^)]+)\s*\)'
      description: "释放引脚控制句柄"

  helper_functions:
    - pattern: 'pinctrl_lookup_state\s*\(\s*(?P<p>[^)]+)\s*,\s*(?P<name>[^)]+)\s*\)'
      description: "查找状态"
      context: "process"
    - pattern: 'pinctrl_select_state\s*\(\s*(?P<p>[^)]+)\s*,\s*(?P<state>[^)]+)\s*\)'
      description: "选择状态"
      context: "process"
    - pattern: 'pinctrl_select_default_state\s*\(\s*(?P<dev>[^)]+)\s*\)'
      description: "选择默认状态"
      context: "process"
    - pattern: 'pinctrl_pm_select_sleep_state\s*\(\s*(?P<dev>[^)]+)\s*\)'
      description: "选择睡眠状态"
      context: "process"
    - pattern: 'pinctrl_pm_select_idle_state\s*\(\s*(?P<dev>[^)]+)\s*\)'
      description: "选择空闲状态"
      context: "process"
    - pattern: 'pinctrl_pm_select_default_state\s*\(\s*(?P<dev>[^)]+)\s*\)'
      description: "选择默认状态 (PM)"
      context: "process"

  standard_states:
    - name: "PINCTRL_STATE_DEFAULT"
      value: "\"default\""
      description: "默认状态"
    - name: "PINCTRL_STATE_INIT"
      value: "\"init\""
      description: "初始化状态"
    - name: "PINCTRL_STATE_IDLE"
      value: "\"idle\""
      description: "空闲状态"
    - name: "PINCTRL_STATE_SLEEP"
      value: "\"sleep\""
      description: "睡眠状态"


# ============================================================
# PINCTRL GPIO API
# ============================================================

pinctrl_gpio:
  description: "Pin Control GPIO API - 引脚控制 GPIO 接口"
  header: "linux/pinctrl/consumer.h"
  icon: "💡"

  helper_functions:
    - pattern: 'pinctrl_gpio_request\s*\(\s*(?P<gpio>\w+)\s*\)'
      description: "请求 GPIO 引脚"
      context: "process"
    - pattern: 'pinctrl_gpio_free\s*\(\s*(?P<gpio>\w+)\s*\)'
      description: "释放 GPIO 引脚"
      context: "process"
    - pattern: 'pinctrl_gpio_direction_input\s*\(\s*(?P<gpio>\w+)\s*\)'
      description: "设置 GPIO 输入"
      context: "process"
    - pattern: 'pinctrl_gpio_direction_output\s*\(\s*(?P<gpio>\w+)\s*\)'
      description: "设置 GPIO 输出"
      context: "process"
    - pattern: 'pinctrl_gpio_set_config\s*\(\s*(?P<gpio>\w+)\s*,\s*(?P<config>\w+)\s*\)'
      description: "设置 GPIO 配置"
      context: "process"


# ============================================================
# PINCTRL UTILS
# ============================================================

pinctrl_utils:
  description: "Pin Control Utilities - 引脚控制工具函数"
  header: "linux/pinctrl/pinctrl.h"
  icon: "🛠️"

  helper_functions:

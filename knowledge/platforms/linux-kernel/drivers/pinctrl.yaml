# Linux Kernel Pin Control Driver Framework Knowledge Base
#
# Reference: https://www.kernel.org/doc/html/latest/driver-api/pin-control.html

# ============================================================
# PINCTRL DESC
# ============================================================

pinctrl_desc:
  description: "Pin Control Descriptor - 引脚控制器描述符"
  header: "linux/pinctrl/pinctrl.h"
  icon: "🔌"
  kernel_version: "3.1+"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  registration:
    - pattern: 'pinctrl_register\s*\(\s*(?P<pctldesc>[^)]+)\s*,\s*(?P<dev>[^)]+)\s*,\s*(?P<driver_data>[^)]+)\s*\)'
      description: "注册引脚控制器"
    - pattern: 'pinctrl_register_and_init\s*\(\s*(?P<pctldesc>[^)]+)\s*,\s*(?P<dev>[^)]+)\s*,\s*(?P<driver_data>[^)]+)\s*,\s*(?P<pctldev>[^)]+)\s*\)'
      description: "注册并初始化引脚控制器"
    - pattern: 'devm_pinctrl_register\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<pctldesc>[^)]+)\s*,\s*(?P<driver_data>[^)]+)\s*\)'
      description: "资源管理方式注册引脚控制器"
    - pattern: 'devm_pinctrl_register_and_init\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<pctldesc>[^)]+)\s*,\s*(?P<driver_data>[^)]+)\s*,\s*(?P<pctldev>[^)]+)\s*\)'
      description: "资源管理方式注册并初始化"
    - pattern: 'pinctrl_unregister\s*\(\s*(?P<pctldev>[^)]+)\s*\)'
      description: "注销引脚控制器"
    - pattern: 'pinctrl_enable\s*\(\s*(?P<pctldev>[^)]+)\s*\)'
      description: "启用引脚控制器"

  structure:
    pattern: 'static\s+(?:const\s+)?struct pinctrl_desc\s+(?P<name>\w+)\s*=\s*\{'
    description: "引脚控制器描述符结构"
    fields:
      - name: "name"
        type: "const char *"
        description: "控制器名称"
      - name: "pins"
        type: "const struct pinctrl_pin_desc *"
        description: "引脚描述数组"
      - name: "npins"
        type: "unsigned int"
        description: "引脚数量"
      - name: "pctlops"
        type: "const struct pinctrl_ops *"
        description: "引脚控制操作"
      - name: "pmxops"
        type: "const struct pinmux_ops *"
        description: "引脚复用操作"
      - name: "confops"
        type: "const struct pinconf_ops *"
        description: "引脚配置操作"
      - name: "owner"
        type: "struct module *"
        description: "模块所有者"
      - name: "num_custom_params"
        type: "unsigned int"
        description: "自定义参数数量"
      - name: "custom_params"
        type: "const struct pinconf_generic_params *"
        description: "自定义参数数组"
      - name: "custom_conf_items"
        type: "const struct pin_config_item *"
        description: "自定义配置项"
      - name: "link_consumers"
        type: "bool"
        description: "链接消费者"


# ============================================================
# PINCTRL OPS
# ============================================================

pinctrl_ops:
  description: "Pin Control Operations - 引脚控制操作"
  header: "linux/pinctrl/pinctrl.h"
  icon: "⚙️"

  structure:
    pattern: 'static\s+(?:const\s+)?struct pinctrl_ops\s+(?P<name>\w+)\s*=\s*\{'
    description: "引脚控制操作结构"

  callbacks:
    get_groups_count:
      pattern: '\.get_groups_count\s*=\s*(?P<handler>\w+)'
      description: "获取引脚组数量 (必须实现)"
      trigger: "初始化或枚举"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct pinctrl_dev *pctldev)"
      return_value:
        success: "引脚组数量"

    get_group_name:
      pattern: '\.get_group_name\s*=\s*(?P<handler>\w+)'
      description: "获取引脚组名称 (必须实现)"
      trigger: "枚举或查找"
      context: "process"
      can_sleep: true
      signature: "const char *(*)(struct pinctrl_dev *pctldev, unsigned selector)"
      return_value:
        success: "组名称字符串"

    get_group_pins:
      pattern: '\.get_group_pins\s*=\s*(?P<handler>\w+)'
      description: "获取引脚组中的引脚 (必须实现)"
      trigger: "请求引脚组"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct pinctrl_dev *pctldev, unsigned selector, const unsigned **pins, unsigned *num_pins)"
      return_value:
        success: "0"
        failure: "-ERRNO"
      typical_actions:
        - "返回引脚数组指针"
        - "返回引脚数量"

    pin_dbg_show:
      pattern: '\.pin_dbg_show\s*=\s*(?P<handler>\w+)'
      description: "显示引脚调试信息"
      trigger: "debugfs 读取"
      context: "process"
      can_sleep: true
      signature: "void (*)(struct pinctrl_dev *pctldev, struct seq_file *s, unsigned offset)"
      typical_actions:
        - "打印引脚状态"
        - "打印复用设置"

    dt_node_to_map:
      pattern: '\.dt_node_to_map\s*=\s*(?P<handler>\w+)'
      description: "设备树节点转换为映射"
      trigger: "解析设备树"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct pinctrl_dev *pctldev, struct device_node *np_config, struct pinctrl_map **map, unsigned *num_maps)"
      return_value:
        success: "0"
        failure: "-ERRNO"
      typical_actions:
        - "解析 pinctrl-* 属性"
        - "创建 pinctrl_map"
        - "pinctrl_utils_reserve_map()"

    dt_free_map:
      pattern: '\.dt_free_map\s*=\s*(?P<handler>\w+)'
      description: "释放设备树映射"
      trigger: "清理"
      context: "process"
      can_sleep: true
      signature: "void (*)(struct pinctrl_dev *pctldev, struct pinctrl_map *map, unsigned num_maps)"
      typical_actions:
        - "pinctrl_utils_free_map()"


# ============================================================
# PINMUX OPS
# ============================================================

pinmux_ops:
  description: "Pin Multiplexing Operations - 引脚复用操作"
  header: "linux/pinctrl/pinmux.h"
  icon: "🔀"

  structure:
    pattern: 'static\s+(?:const\s+)?struct pinmux_ops\s+(?P<name>\w+)\s*=\s*\{'
    description: "引脚复用操作结构"

  callbacks:
    request:
      pattern: '\.request\s*=\s*(?P<handler>\w+)'
      description: "请求引脚"
      trigger: "pinmux_request_gpio() 或设备请求"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct pinctrl_dev *pctldev, unsigned offset)"
      return_value:
        success: "0"
        failure: "-ERRNO"
      typical_actions:
        - "检查引脚是否可用"
        - "标记引脚为已使用"

    free:
      pattern: '\.free\s*=\s*(?P<handler>\w+)'
      description: "释放引脚"
      trigger: "设备释放引脚"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct pinctrl_dev *pctldev, unsigned offset)"
      typical_actions:
        - "标记引脚为空闲"

    get_functions_count:
      pattern: '\.get_functions_count\s*=\s*(?P<handler>\w+)'
      description: "获取功能数量 (必须实现)"
      trigger: "初始化或枚举"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct pinctrl_dev *pctldev)"
      return_value:
        success: "功能数量"

    get_function_name:
      pattern: '\.get_function_name\s*=\s*(?P<handler>\w+)'
      description: "获取功能名称 (必须实现)"
      trigger: "枚举或查找"
      context: "process"
      can_sleep: true
      signature: "const char *(*)(struct pinctrl_dev *pctldev, unsigned selector)"
      return_value:
        success: "功能名称字符串"

    get_function_groups:
      pattern: '\.get_function_groups\s*=\s*(?P<handler>\w+)'
      description: "获取功能支持的组 (必须实现)"
      trigger: "查找功能的有效组"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct pinctrl_dev *pctldev, unsigned selector, const char * const **groups, unsigned *num_groups)"
      return_value:
        success: "0"
        failure: "-ERRNO"
      typical_actions:
        - "返回支持该功能的引脚组"

    set_mux:
      pattern: '\.set_mux\s*=\s*(?P<handler>\w+)'
      description: "设置引脚复用 (必须实现)"
      trigger: "应用 pinctrl 状态"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct pinctrl_dev *pctldev, unsigned func_selector, unsigned group_selector)"
      return_value:
        success: "0"
        failure: "-ERRNO"
      typical_actions:
        - "配置硬件复用寄存器"
        - "设置引脚功能"

    gpio_request_enable:
      pattern: '\.gpio_request_enable\s*=\s*(?P<handler>\w+)'
      description: "启用 GPIO 模式"
      trigger: "gpio_request()"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct pinctrl_dev *pctldev, struct pinctrl_gpio_range *range, unsigned offset)"
      typical_actions:
        - "将引脚切换到 GPIO 模式"

    gpio_disable_free:
      pattern: '\.gpio_disable_free\s*=\s*(?P<handler>\w+)'
      description: "禁用 GPIO 并释放"
      trigger: "gpio_free()"
      context: "process"
      can_sleep: true
      signature: "void (*)(struct pinctrl_dev *pctldev, struct pinctrl_gpio_range *range, unsigned offset)"

    gpio_set_direction:
      pattern: '\.gpio_set_direction\s*=\s*(?P<handler>\w+)'
      description: "设置 GPIO 方向"
      trigger: "gpio_direction_input/output()"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct pinctrl_dev *pctldev, struct pinctrl_gpio_range *range, unsigned offset, bool input)"

    strict:
      pattern: '\.strict\s*=\s*(?P<value>\w+)'
      description: "严格模式 (禁止 GPIO 和 mux 共用)"
      trigger: "配置检查"
      context: "any"


# ============================================================
# PINCONF OPS
# ============================================================

pinconf_ops:
  description: "Pin Configuration Operations - 引脚配置操作"
  header: "linux/pinctrl/pinconf.h"
  icon: "🔧"

  structure:
    pattern: 'static\s+(?:const\s+)?struct pinconf_ops\s+(?P<name>\w+)\s*=\s*\{'
    description: "引脚配置操作结构"

  callbacks:
    is_generic:
      pattern: '\.is_generic\s*=\s*(?P<value>\w+)'
      description: "使用通用配置接口"
      trigger: "配置解析"
      context: "any"

    pin_config_get:
      pattern: '\.pin_config_get\s*=\s*(?P<handler>\w+)'
      description: "获取单个引脚配置"
      trigger: "debugfs 或查询"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct pinctrl_dev *pctldev, unsigned pin, unsigned long *config)"
      return_value:
        success: "0"
        failure: "-ERRNO"

    pin_config_set:
      pattern: '\.pin_config_set\s*=\s*(?P<handler>\w+)'
      description: "设置单个引脚配置"
      trigger: "应用配置"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct pinctrl_dev *pctldev, unsigned pin, unsigned long *configs, unsigned num_configs)"
      return_value:
        success: "0"
        failure: "-ERRNO"
      typical_actions:
        - "配置上拉/下拉"
        - "配置驱动强度"
        - "配置压摆率"

    pin_config_group_get:
      pattern: '\.pin_config_group_get\s*=\s*(?P<handler>\w+)'
      description: "获取引脚组配置"
      trigger: "debugfs 或查询"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct pinctrl_dev *pctldev, unsigned selector, unsigned long *config)"

    pin_config_group_set:
      pattern: '\.pin_config_group_set\s*=\s*(?P<handler>\w+)'
      description: "设置引脚组配置"
      trigger: "应用组配置"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct pinctrl_dev *pctldev, unsigned selector, unsigned long *configs, unsigned num_configs)"
      typical_actions:
        - "对组内所有引脚应用相同配置"

    pin_config_dbg_show:
      pattern: '\.pin_config_dbg_show\s*=\s*(?P<handler>\w+)'
      description: "显示引脚配置调试信息"
      trigger: "debugfs 读取"
      context: "process"
      can_sleep: true
      signature: "void (*)(struct pinctrl_dev *pctldev, struct seq_file *s, unsigned offset)"

    pin_config_group_dbg_show:
      pattern: '\.pin_config_group_dbg_show\s*=\s*(?P<handler>\w+)'
      description: "显示引脚组配置调试信息"
      trigger: "debugfs 读取"
      context: "process"
      can_sleep: true
      signature: "void (*)(struct pinctrl_dev *pctldev, struct seq_file *s, unsigned selector)"

    pin_config_config_dbg_show:
      pattern: '\.pin_config_config_dbg_show\s*=\s*(?P<handler>\w+)'
      description: "显示配置值调试信息"
      trigger: "debugfs 读取"
      context: "process"
      can_sleep: true
      signature: "void (*)(struct pinctrl_dev *pctldev, struct seq_file *s, unsigned long config)"


# ============================================================
# PINCTRL PIN DESC
# ============================================================

pinctrl_pin_desc:
  description: "Pin Description - 引脚描述"
  header: "linux/pinctrl/pinctrl.h"
  icon: "📍"

  structure:
    pattern: 'static\s+(?:const\s+)?struct pinctrl_pin_desc\s+(?P<name>\w+)\s*\[\s*\]\s*=\s*\{'
    description: "引脚描述数组"
    fields:
      - name: "number"
        type: "unsigned"
        description: "引脚编号"
      - name: "name"
        type: "const char *"
        description: "引脚名称"
      - name: "drv_data"
        type: "void *"
        description: "驱动私有数据"

  macros:
    - pattern: 'PINCTRL_PIN\s*\(\s*(?P<num>\w+)\s*,\s*(?P<name>[^)]+)\s*\)'
      description: "定义引脚"
    - pattern: 'PINCTRL_PIN_ANON\s*\(\s*(?P<num>\w+)\s*\)'
      description: "定义匿名引脚"


# ============================================================
# PINCTRL GPIO RANGE
# ============================================================

pinctrl_gpio_range:
  description: "GPIO Range - GPIO 范围"
  header: "linux/pinctrl/pinctrl.h"
  icon: "📊"

  registration:
    - pattern: 'pinctrl_add_gpio_range\s*\(\s*(?P<pctldev>[^)]+)\s*,\s*(?P<range>[^)]+)\s*\)'
      description: "添加 GPIO 范围"
    - pattern: 'pinctrl_add_gpio_ranges\s*\(\s*(?P<pctldev>[^)]+)\s*,\s*(?P<ranges>[^)]+)\s*,\s*(?P<nranges>\w+)\s*\)'
      description: "添加多个 GPIO 范围"
    - pattern: 'pinctrl_remove_gpio_range\s*\(\s*(?P<pctldev>[^)]+)\s*,\s*(?P<range>[^)]+)\s*\)'
      description: "移除 GPIO 范围"

  structure:
    pattern: 'struct pinctrl_gpio_range\s*(?P<name>\w+)\s*=\s*\{'
    description: "GPIO 范围结构"
    fields:
      - name: "name"
        type: "const char *"
        description: "范围名称"
      - name: "id"
        type: "unsigned int"
        description: "范围 ID"
      - name: "base"
        type: "unsigned int"
        description: "GPIO 基址"
      - name: "pin_base"
        type: "unsigned int"
        description: "引脚基址"
      - name: "pins"
        type: "unsigned int *"
        description: "引脚数组 (非连续)"
      - name: "npins"
        type: "unsigned int"
        description: "引脚数量"
      - name: "gc"
        type: "struct gpio_chip *"
        description: "GPIO 控制器"



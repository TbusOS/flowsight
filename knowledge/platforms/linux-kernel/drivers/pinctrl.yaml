    - name: "PIN_CONFIG_BIAS_PULL_PIN_DEFAULT"
      description: "引脚默认偏置"
    - name: "PIN_CONFIG_BIAS_PULL_UP"
      description: "上拉"
    - name: "PIN_CONFIG_DRIVE_OPEN_DRAIN"

# Linux Kernel - Crypto API 加密框架
crypto_api:
  description: "内核加密 API 框架"
  header: "crypto/algapi.h"
  
  algorithm_registration:
    bind_patterns:
      - pattern: 'crypto_register_alg\s*\('
        description: "注册加密算法"
        can_sleep: true
        
      - pattern: 'crypto_unregister_alg\s*\('
      - pattern: 'crypto_register_algs\s*\('
      - pattern: 'crypto_unregister_algs\s*\('
      - pattern: 'crypto_register_skcipher\s*\('
      - pattern: 'crypto_register_aead\s*\('
      - pattern: 'crypto_register_ahash\s*\('
      - pattern: 'crypto_register_shash\s*\('
      - pattern: 'crypto_register_rng\s*\('
      
  allocation:
    bind_patterns:
      - pattern: 'crypto_alloc_skcipher\s*\('
        description: "分配对称加密变换"
        can_sleep: true
        
      - pattern: 'crypto_alloc_aead\s*\('
      - pattern: 'crypto_alloc_ahash\s*\('
      - pattern: 'crypto_alloc_shash\s*\('
      - pattern: 'crypto_alloc_rng\s*\('
      - pattern: 'crypto_free_skcipher\s*\('
      - pattern: 'crypto_free_aead\s*\('
      - pattern: 'crypto_free_ahash\s*\('
      - pattern: 'crypto_free_shash\s*\('
      
  operations:
    bind_patterns:
      - pattern: 'crypto_skcipher_encrypt\s*\('
      - pattern: 'crypto_skcipher_decrypt\s*\('
      - pattern: 'crypto_skcipher_setkey\s*\('
      - pattern: 'crypto_aead_encrypt\s*\('
      - pattern: 'crypto_aead_decrypt\s*\('
      - pattern: 'crypto_aead_setkey\s*\('
      - pattern: 'crypto_aead_setauthsize\s*\('
      - pattern: 'crypto_ahash_digest\s*\('
      - pattern: 'crypto_ahash_init\s*\('
      - pattern: 'crypto_ahash_update\s*\('
      - pattern: 'crypto_ahash_final\s*\('
      - pattern: 'crypto_shash_digest\s*\('
      - pattern: 'crypto_shash_update\s*\('
      - pattern: 'crypto_shash_final\s*\('
      
  request:
    bind_patterns:
      - pattern: 'skcipher_request_alloc\s*\('
      - pattern: 'skcipher_request_free\s*\('
      - pattern: 'skcipher_request_set_callback\s*\('
      - pattern: 'skcipher_request_set_crypt\s*\('
      - pattern: 'aead_request_alloc\s*\('
      - pattern: 'aead_request_set_callback\s*\('
      - pattern: 'aead_request_set_crypt\s*\('
      - pattern: 'ahash_request_alloc\s*\('
      - pattern: 'ahash_request_set_callback\s*\('
      
  hw_engine:
    bind_patterns:
      - pattern: 'crypto_engine_alloc_init\s*\('
      - pattern: 'crypto_engine_start\s*\('
      - pattern: 'crypto_engine_stop\s*\('
      - pattern: 'crypto_engine_exit\s*\('
      - pattern: 'crypto_transfer_\w+_request_to_engine\s*\('

# Crypto Framework Knowledge Base
# Reference: https://www.kernel.org/doc/html/latest/crypto/

# ============================================================
# CRYPTO ALGORITHM REGISTRATION
# ============================================================
crypto_alg:
  description: "Cryptographic Algorithm Driver"
  header: "linux/crypto.h"
  icon: "🔐"
  kernel_version: "2.6.17+"
  registration:
    - pattern: 'crypto_register_alg\s*\(\s*&(?P<alg>\w+)\s*\)'
      description: "注册加密算法"
    - pattern: 'crypto_register_algs\s*\(\s*(?P<algs>\w+)\s*,\s*(?P<count>\w+)\s*\)'
      description: "批量注册加密算法"
    - pattern: 'crypto_register_skcipher\s*\(\s*&(?P<alg>\w+)\s*\)'
      description: "注册对称加密算法"
    - pattern: 'crypto_register_ahash\s*\(\s*&(?P<alg>\w+)\s*\)'
      description: "注册异步哈希算法"
    - pattern: 'crypto_register_aead\s*\(\s*&(?P<alg>\w+)\s*\)'
      description: "注册 AEAD 算法"
    - pattern: 'crypto_register_rng\s*\(\s*&(?P<alg>\w+)\s*\)'
      description: "注册随机数生成器"
  unregistration:
    - pattern: 'crypto_unregister_alg\s*\(\s*&(?P<alg>\w+)\s*\)'
      description: "注销加密算法"
    - pattern: 'crypto_unregister_algs\s*\(\s*(?P<algs>\w+)\s*,\s*(?P<count>\w+)\s*\)'
      description: "批量注销加密算法"

# ============================================================
# SKCIPHER (Symmetric Key Cipher)
# ============================================================
skcipher:
  description: "Symmetric Key Cipher"
  header: "crypto/skcipher.h"
  icon: "🔑"
  structure:
    name: "skcipher_alg"
    callbacks:
      setkey:
        pattern: '\.setkey\s*=\s*(?P<handler>\w+)'
        description: "设置密钥"
        context: "process"
        can_sleep: true
      encrypt:
        pattern: '\.encrypt\s*=\s*(?P<handler>\w+)'
        description: "加密操作"
        context: "process/softirq"
        can_sleep: false
      decrypt:
        pattern: '\.decrypt\s*=\s*(?P<handler>\w+)'
        description: "解密操作"
        context: "process/softirq"
        can_sleep: false
      init:
        pattern: '\.init\s*=\s*(?P<handler>\w+)'
        description: "初始化上下文"
      exit:
        pattern: '\.exit\s*=\s*(?P<handler>\w+)'
        description: "清理上下文"

# ============================================================
# AHASH (Async Hash)
# ============================================================
ahash:
  description: "Asynchronous Hash Algorithm"
  header: "crypto/hash.h"
  icon: "#️⃣"
  structure:
    name: "ahash_alg"
    callbacks:
      init:
        pattern: '\.init\s*=\s*(?P<handler>\w+)'
        description: "初始化哈希上下文"
      update:
        pattern: '\.update\s*=\s*(?P<handler>\w+)'
        description: "更新哈希数据"
      final:
        pattern: '\.final\s*=\s*(?P<handler>\w+)'
        description: "完成哈希计算"
      finup:
        pattern: '\.finup\s*=\s*(?P<handler>\w+)'
        description: "更新并完成"
      digest:
        pattern: '\.digest\s*=\s*(?P<handler>\w+)'
        description: "一次性哈希"
      setkey:
        pattern: '\.setkey\s*=\s*(?P<handler>\w+)'
        description: "设置 HMAC 密钥"
      export:
        pattern: '\.export\s*=\s*(?P<handler>\w+)'
        description: "导出状态"
      import:
        pattern: '\.import\s*=\s*(?P<handler>\w+)'
        description: "导入状态"

# ============================================================
# AEAD (Authenticated Encryption with Associated Data)
# ============================================================
aead:
  description: "AEAD Algorithm"
  header: "crypto/aead.h"
  icon: "🛡️"
  structure:
    name: "aead_alg"
    callbacks:
      setkey:
        pattern: '\.setkey\s*=\s*(?P<handler>\w+)'
        description: "设置密钥"
      setauthsize:
        pattern: '\.setauthsize\s*=\s*(?P<handler>\w+)'
        description: "设置认证标签大小"
      encrypt:
        pattern: '\.encrypt\s*=\s*(?P<handler>\w+)'
        description: "加密并认证"
      decrypt:
        pattern: '\.decrypt\s*=\s*(?P<handler>\w+)'
        description: "解密并验证"

# ============================================================
# CRYPTO ENGINE (Hardware Acceleration)
# ============================================================
crypto_engine:
  description: "Crypto Engine for Hardware Accelerators"
  header: "crypto/engine.h"
  icon: "⚙️"
  registration:
    - pattern: 'crypto_engine_alloc_init\s*\(\s*(?P<dev>\w+)\s*,\s*(?P<rt>\w+)\s*\)'
      description: "分配并初始化加密引擎"
    - pattern: 'crypto_engine_alloc_init_and_set\s*\('
      description: "分配、初始化并配置引擎"
  helpers:
    - pattern: 'crypto_engine_start\s*\(\s*(?P<engine>\w+)\s*\)'
      description: "启动加密引擎"
    - pattern: 'crypto_engine_stop\s*\(\s*(?P<engine>\w+)\s*\)'
      description: "停止加密引擎"
    - pattern: 'crypto_engine_exit\s*\(\s*(?P<engine>\w+)\s*\)'
      description: "退出加密引擎"
    - pattern: 'crypto_transfer_skcipher_request_to_engine\s*\('
      description: "传输 skcipher 请求到引擎"
    - pattern: 'crypto_transfer_hash_request_to_engine\s*\('
      description: "传输哈希请求到引擎"
  callbacks:
    do_one_request:
      pattern: '\.do_one_request\s*=\s*(?P<handler>\w+)'
      description: "处理单个请求"
      context: "kthread"
      can_sleep: true

# ============================================================
# CALL CHAINS
# ============================================================
call_chains:
  crypto_request:
    description: "Crypto Request Flow"
    chain:
      - caller: "crypto_skcipher_encrypt"
        callee: "alg->encrypt"
        description: "调用算法加密函数"
      - caller: "alg->encrypt"
        callee: "crypto_request_complete"
        async: true
        description: "请求完成回调"
  hw_crypto:
    description: "Hardware Crypto Engine Flow"
    chain:
      - caller: "crypto_transfer_*_request_to_engine"
        callee: "crypto_pump_requests"
        description: "泵送请求"
      - caller: "crypto_pump_requests"
        callee: "engine->do_one_request"
        context: "kthread"
        description: "执行单个请求"
      - caller: "engine->do_one_request"
        callee: "crypto_finalize_*_request"
        description: "完成请求"


# ============================================================
# DATA STRUCTURES
# ============================================================

data_structures:
  crypto_alg:
    pattern: 'struct crypto_alg\s*\{'
    description: "加密算法基础结构"
    file: "include/linux/crypto.h"
    fields:
      - name: "cra_name"
        type: "char []"
        description: "算法名称"
      - name: "cra_driver_name"
        type: "char []"
        description: "驱动名称"
      - name: "cra_priority"
        type: "int"
        description: "算法优先级"
      - name: "cra_flags"
        type: "u32"
        description: "算法标志"
      - name: "cra_blocksize"
        type: "unsigned int"
        description: "块大小"
      - name: "cra_ctxsize"
        type: "unsigned int"
        description: "上下文大小"
      - name: "cra_module"
        type: "struct module *"
        description: "所属模块"

  skcipher_alg:
    pattern: 'struct skcipher_alg\s*\{'
    description: "对称加密算法结构"
    file: "include/crypto/skcipher.h"
    fields:
      - name: "min_keysize"
        type: "unsigned int"
        description: "最小密钥长度"
      - name: "max_keysize"
        type: "unsigned int"
        description: "最大密钥长度"
      - name: "ivsize"
        type: "unsigned int"
        description: "IV 大小"
      - name: "chunksize"
        type: "unsigned int"
        description: "块大小"
      - name: "setkey"
        type: "callback"
        description: "设置密钥"
      - name: "encrypt"
        type: "callback"
        description: "加密"
      - name: "decrypt"
        type: "callback"
        description: "解密"
      - name: "base"
        type: "struct crypto_alg"
        description: "基础算法"


# ============================================================
# EXAMPLES
# ============================================================

examples:
  - description: "基本 skcipher 算法驱动"
    kernel_version: "5.0+"
    code: |
      #include <linux/module.h>
      #include <crypto/internal/skcipher.h>
      #include <linux/scatterlist.h>
      
      #define AES_BLOCK_SIZE 16
      #define AES_MIN_KEY_SIZE 16
      #define AES_MAX_KEY_SIZE 32
      
      struct my_aes_ctx {
          u32 key_enc[60];
          u32 key_dec[60];
          u32 key_length;
      };
      
      static int my_aes_setkey(struct crypto_skcipher *tfm,
                               const u8 *key, unsigned int keylen)
      {
          struct my_aes_ctx *ctx = crypto_skcipher_ctx(tfm);
          
          if (keylen != AES_MIN_KEY_SIZE &&
              keylen != 24 &&
              keylen != AES_MAX_KEY_SIZE)
              return -EINVAL;
          
          ctx->key_length = keylen;
          
          /* 扩展密钥 */
          my_aes_expand_key(ctx->key_enc, key, keylen);
          my_aes_invert_key(ctx->key_dec, ctx->key_enc, keylen);
          
          return 0;
      }
      
      static int my_aes_encrypt(struct skcipher_request *req)
      {
          struct crypto_skcipher *tfm = crypto_skcipher_reqtfm(req);
          struct my_aes_ctx *ctx = crypto_skcipher_ctx(tfm);
          struct skcipher_walk walk;
          int err;
          
          err = skcipher_walk_virt(&walk, req, false);
          
          while (walk.nbytes) {
              unsigned int nbytes = walk.nbytes;
              
              if (nbytes < AES_BLOCK_SIZE)
                  break;
              
              nbytes = round_down(nbytes, AES_BLOCK_SIZE);
              
              my_aes_cbc_encrypt(walk.dst.virt.addr,
                                  walk.src.virt.addr,
                                  ctx->key_enc, ctx->key_length,
                                  nbytes, walk.iv);
              
              err = skcipher_walk_done(&walk, walk.nbytes - nbytes);
          }
          
          return err;
      }
      
      static int my_aes_decrypt(struct skcipher_request *req)
      {
          struct crypto_skcipher *tfm = crypto_skcipher_reqtfm(req);
          struct my_aes_ctx *ctx = crypto_skcipher_ctx(tfm);
          struct skcipher_walk walk;
          int err;
          
          err = skcipher_walk_virt(&walk, req, false);
          
          while (walk.nbytes) {
              unsigned int nbytes = walk.nbytes;
              
              if (nbytes < AES_BLOCK_SIZE)
                  break;
              
              nbytes = round_down(nbytes, AES_BLOCK_SIZE);
              
              my_aes_cbc_decrypt(walk.dst.virt.addr,
                                  walk.src.virt.addr,
                                  ctx->key_dec, ctx->key_length,
                                  nbytes, walk.iv);
              
              err = skcipher_walk_done(&walk, walk.nbytes - nbytes);
          }
          
          return err;
      }
      
      static struct skcipher_alg my_aes_alg = {
          .base = {
              .cra_name         = "cbc(aes)",
              .cra_driver_name  = "my-aes-cbc",
              .cra_priority     = 300,
              .cra_flags        = CRYPTO_ALG_ASYNC,
              .cra_blocksize    = AES_BLOCK_SIZE,
              .cra_ctxsize      = sizeof(struct my_aes_ctx),
              .cra_module       = THIS_MODULE,
          },
          .min_keysize = AES_MIN_KEY_SIZE,
          .max_keysize = AES_MAX_KEY_SIZE,
          .ivsize      = AES_BLOCK_SIZE,
          .setkey      = my_aes_setkey,
          .encrypt     = my_aes_encrypt,
          .decrypt     = my_aes_decrypt,
      };
      
      static int __init my_aes_init(void)
      {
          return crypto_register_skcipher(&my_aes_alg);
      }
      
      static void __exit my_aes_exit(void)
      {
          crypto_unregister_skcipher(&my_aes_alg);
      }
      module_init(my_aes_init);
      module_exit(my_aes_exit);

  - description: "使用 crypto_engine 的硬件加速驱动"
    kernel_version: "5.0+"
    code: |
      #include <linux/module.h>
      #include <linux/platform_device.h>
      #include <crypto/engine.h>
      #include <crypto/internal/skcipher.h>
      
      struct my_hw_crypto {
          struct crypto_engine *engine;
          void __iomem *regs;
          struct completion done;
      };
      
      struct my_crypto_ctx {
          struct my_hw_crypto *hw;
          u8 key[32];
          unsigned int keylen;
      };
      
      static int my_aes_encrypt_hw(struct skcipher_request *req)
      {
          struct my_crypto_ctx *ctx = crypto_skcipher_ctx(
                                          crypto_skcipher_reqtfm(req));
          return crypto_transfer_skcipher_request_to_engine(
                      ctx->hw->engine, req);
      }
      
      static int my_do_one_request(struct crypto_engine *engine, void *areq)
      {
          struct skcipher_request *req = container_of(areq,
                                              struct skcipher_request, base);
          struct my_crypto_ctx *ctx = crypto_skcipher_ctx(
                                          crypto_skcipher_reqtfm(req));
          struct my_hw_crypto *hw = ctx->hw;
          int err = 0;
          
          /* 配置硬件 */
          memcpy_toio(hw->regs + KEY_REG, ctx->key, ctx->keylen);
          
          reinit_completion(&hw->done);
          writel(1, hw->regs + START_REG);
          
          if (!wait_for_completion_timeout(&hw->done, msecs_to_jiffies(1000)))
              err = -ETIMEDOUT;
          
          crypto_finalize_skcipher_request(engine, req, err);
          return 0;
      }
      
      static int my_hw_crypto_probe(struct platform_device *pdev)
      {
          struct my_hw_crypto *hw;
          
          hw = devm_kzalloc(&pdev->dev, sizeof(*hw), GFP_KERNEL);
          if (!hw)
              return -ENOMEM;
          
          init_completion(&hw->done);
          hw->regs = devm_platform_ioremap_resource(pdev, 0);
          if (IS_ERR(hw->regs))
              return PTR_ERR(hw->regs);
          
          hw->engine = crypto_engine_alloc_init(&pdev->dev, true);
          if (!hw->engine)
              return -ENOMEM;
          
          hw->engine->do_one_request = my_do_one_request;
          
          return crypto_engine_start(hw->engine);
      }

# ============================================================
# ADDITIONAL DATA STRUCTURES
# ============================================================

  ahash_alg:
    pattern: 'struct ahash_alg\s*\{'
    description: "异步哈希算法结构"
    file: "include/crypto/hash.h"
    fields:
      - name: "init"
        type: "int (*)(struct ahash_request *)"
        description: "初始化哈希上下文"
      - name: "update"
        type: "int (*)(struct ahash_request *)"
        description: "更新哈希数据"
      - name: "final"
        type: "int (*)(struct ahash_request *)"
        description: "完成哈希"
      - name: "finup"
        type: "int (*)(struct ahash_request *)"
        description: "更新并完成"
      - name: "digest"
        type: "int (*)(struct ahash_request *)"
        description: "一次性计算"
      - name: "setkey"
        type: "int (*)(struct crypto_ahash *, const u8 *, unsigned int)"
        description: "设置密钥"
      - name: "halg"
        type: "struct hash_alg_common"
        description: "通用哈希算法信息"

  aead_alg:
    pattern: 'struct aead_alg\s*\{'
    description: "AEAD 算法结构"
    file: "include/crypto/aead.h"
    fields:
      - name: "setkey"
        type: "int (*)(struct crypto_aead *, const u8 *, unsigned int)"
        description: "设置密钥"
      - name: "setauthsize"
        type: "int (*)(struct crypto_aead *, unsigned int)"
        description: "设置认证标签大小"
      - name: "encrypt"
        type: "int (*)(struct aead_request *)"
        description: "加密操作"
      - name: "decrypt"
        type: "int (*)(struct aead_request *)"
        description: "解密操作"
      - name: "ivsize"
        type: "unsigned int"
        description: "IV 大小"
      - name: "maxauthsize"
        type: "unsigned int"
        description: "最大认证标签大小"

  crypto_engine:
    pattern: 'struct crypto_engine\s*\{'
    description: "加密引擎结构"
    file: "include/crypto/engine.h"
    fields:
      - name: "running"
        type: "bool"
        description: "引擎是否运行"
      - name: "busy"
        type: "bool"
        description: "引擎是否忙碌"
      - name: "queue"
        type: "struct crypto_queue"
        description: "请求队列"
      - name: "do_batch_requests"
        type: "int (*)(struct crypto_engine *)"
        description: "批量处理请求"

# ============================================================
# ADDITIONAL CALL CHAINS
# ============================================================

  ahash_flow:
    description: "Async Hash Request Flow"
    chain:
      - caller: "crypto_ahash_init"
        callee: "ahash_alg->init"
        description: "初始化哈希"
      - caller: "crypto_ahash_update"
        callee: "ahash_alg->update"
        description: "更新数据"
      - caller: "crypto_ahash_final"
        callee: "ahash_alg->final"
        description: "完成计算"
      - caller: "ahash_alg->final"
        callee: "ahash_request_complete"
        async: true
        description: "请求完成回调"

  crypto_engine_flow:
    description: "Crypto Engine Complete Flow"
    chain:
      - caller: "driver"
        callee: "crypto_engine_alloc_init"
        description: "分配引擎"
      - caller: "driver"
        callee: "crypto_engine_start"
        description: "启动引擎"
      - caller: "crypto_transfer_*_request_to_engine"
        callee: "crypto_engine_queue_request"
        description: "入队请求"
      - caller: "crypto_pump_work"
        callee: "engine->do_one_request"
        context: "kthread"
        description: "处理请求"
      - caller: "driver IRQ"
        callee: "crypto_finalize_*_request"
        context: "hardirq"
        description: "完成请求"

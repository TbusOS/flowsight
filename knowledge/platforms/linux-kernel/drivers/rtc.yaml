# RTC Driver Framework Knowledge Base
# Reference: https://www.kernel.org/doc/html/latest/driver-api/rtc.html

# ============================================================
# RTC DEVICE STRUCTURE
# ============================================================

rtc_device:
  description: "Real Time Clock Device - 实时时钟设备"
  header: "linux/rtc.h"
  icon: "🕐"
  kernel_version: "2.6+"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  structure:
    pattern: 'struct rtc_device\s*\{[^}]+\}'
    description: "RTC 设备结构体"
    fields:
      - name: "dev"
        type: "struct device"
        description: "内嵌设备结构"
      - name: "owner"
        type: "struct module *"
        description: "模块所有者"
      - name: "id"
        type: "int"
        description: "RTC 设备 ID"
      - name: "ops"
        type: "const struct rtc_class_ops *"
        description: "RTC 操作函数集"
      - name: "ops_lock"
        type: "struct mutex"
        description: "保护 ops 的互斥锁"
      - name: "char_dev"
        type: "struct cdev"
        description: "字符设备"
      - name: "flags"
        type: "unsigned long"
        description: "设备标志"
      - name: "irq_data"
        type: "unsigned long"
        description: "中断数据"
      - name: "irq_lock"
        type: "spinlock_t"
        description: "中断数据保护锁"
      - name: "irq_queue"
        type: "wait_queue_head_t"
        description: "中断等待队列"
      - name: "aie_timer"
        type: "struct rtc_timer"
        description: "闹钟中断定时器"
      - name: "uie_rtctimer"
        type: "struct rtc_timer"
        description: "更新中断定时器"
      - name: "pie_timer"
        type: "struct hrtimer"
        description: "周期中断定时器 (高精度)"
      - name: "uie_unsupported"
        type: "int"
        description: "是否不支持 UIE 模式"

  registration:
    - pattern: 'rtc_device_register\s*\(\s*(?P<name>[^,]+)\s*,\s*(?P<dev>[^,]+)\s*,\s*&(?P<ops>\w+)\s*,\s*(?P<owner>[^)]+)\s*\)'
      description: "注册 RTC 设备 (旧 API, 已废弃)"
      deprecated: true
    - pattern: 'devm_rtc_device_register\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<name>[^,]+)\s*,\s*&(?P<ops>\w+)\s*,\s*(?P<owner>[^)]+)\s*\)'
      description: "注册 RTC 设备 (资源管理, 已废弃)"
      deprecated: true
    - pattern: 'devm_rtc_allocate_device\s*\(\s*(?P<dev>[^)]+)\s*\)'
      description: "分配 RTC 设备结构 (推荐)"
      context: "process"
      can_sleep: true
    - pattern: '__rtc_register_device\s*\(\s*(?P<owner>[^,]+)\s*,\s*(?P<rtc>[^)]+)\s*\)'
      description: "注册已分配的 RTC 设备"
      context: "process"
      can_sleep: true
    - pattern: 'rtc_device_unregister\s*\(\s*(?P<rtc>[^)]+)\s*\)'
      description: "注销 RTC 设备"
      context: "process"
      can_sleep: true

  helper_macros:
    - pattern: 'devm_rtc_register_device\s*\(\s*(?P<rtc>[^)]+)\s*\)'
      description: "宏，展开为 __rtc_register_device(THIS_MODULE, rtc)"
    - pattern: 'to_rtc_device\s*\(\s*(?P<d>[^)]+)\s*\)'
      description: "从 device 获取 rtc_device"


# ============================================================
# RTC CLASS OPS
# ============================================================

rtc_class_ops:
  description: "RTC Class Operations - RTC 类操作函数集"
  header: "linux/rtc.h"
  icon: "⚙️"

  structure:
    pattern: 'static const struct rtc_class_ops\s+(?P<name>\w+)\s*=\s*\{'
    description: "RTC 操作结构体定义"
    fields:
      - name: "ioctl"
        type: "int (*)(struct device *, unsigned int, unsigned long)"
        description: "设备特定的 ioctl 处理"
        optional: true
      - name: "read_time"
        type: "int (*)(struct device *, struct rtc_time *)"
        description: "读取当前时间"
        mandatory: true
      - name: "set_time"
        type: "int (*)(struct device *, struct rtc_time *)"
        description: "设置当前时间"
        mandatory: true
      - name: "read_alarm"
        type: "int (*)(struct device *, struct rtc_wkalrm *)"
        description: "读取闹钟设置"
        optional: true
      - name: "set_alarm"
        type: "int (*)(struct device *, struct rtc_wkalrm *)"
        description: "设置闹钟"
        optional: true
      - name: "proc"
        type: "int (*)(struct device *, struct seq_file *)"
        description: "proc 文件系统信息输出"
        optional: true
      - name: "alarm_irq_enable"
        type: "int (*)(struct device *, unsigned int)"
        description: "启用/禁用闹钟中断"
        optional: true
      - name: "read_offset"
        type: "int (*)(struct device *, long *)"
        description: "读取时钟偏移校准值"
        optional: true
      - name: "set_offset"
        type: "int (*)(struct device *, long)"
        description: "设置时钟偏移校准值"
        optional: true

  callbacks:
    read_time:
      pattern: '\.read_time\s*=\s*(?P<handler>\w+)'
      description: "读取当前时间回调"
      trigger: "用户调用 RTC_RD_TIME ioctl 或 read()"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct device *dev, struct rtc_time *tm)"
      return_value:
        success: "0"
        failure: "-ERRNO (如 -EIO, -EINVAL)"
      typical_actions:
        - "从硬件寄存器读取时间值"
        - "BCD 转二进制转换"
        - "填充 rtc_time 结构体"

    set_time:
      pattern: '\.set_time\s*=\s*(?P<handler>\w+)'
      description: "设置当前时间回调"
      trigger: "用户调用 RTC_SET_TIME ioctl"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct device *dev, struct rtc_time *tm)"
      return_value:
        success: "0"
        failure: "-ERRNO (如 -EIO, -EINVAL)"
      typical_actions:
        - "验证时间值有效性"
        - "二进制转 BCD 转换"
        - "写入硬件寄存器"
        - "可能需要禁用更新中断"

    read_alarm:
      pattern: '\.read_alarm\s*=\s*(?P<handler>\w+)'
      description: "读取闹钟设置回调"
      trigger: "用户调用 RTC_ALM_READ 或 RTC_WKALM_RD ioctl"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct device *dev, struct rtc_wkalrm *alarm)"
      return_value:
        success: "0"
        failure: "-ERRNO"
      typical_actions:
        - "读取闹钟时间寄存器"
        - "读取闹钟启用状态"
        - "读取闹钟待处理状态"

    set_alarm:
      pattern: '\.set_alarm\s*=\s*(?P<handler>\w+)'
      description: "设置闹钟回调"
      trigger: "用户调用 RTC_ALM_SET 或 RTC_WKALM_SET ioctl"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct device *dev, struct rtc_wkalrm *alarm)"
      return_value:
        success: "0"
        failure: "-ERRNO"
      typical_actions:
        - "写入闹钟时间寄存器"
        - "根据 alarm->enabled 设置中断"
        - "清除可能的待处理中断"

    alarm_irq_enable:
      pattern: '\.alarm_irq_enable\s*=\s*(?P<handler>\w+)'
      description: "启用/禁用闹钟中断"
      trigger: "用户调用 RTC_AIE_ON/RTC_AIE_OFF ioctl"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct device *dev, unsigned int enabled)"
      return_value:
        success: "0"
        failure: "-ERRNO"
      typical_actions:
        - "设置/清除中断使能寄存器位"
        - "如果禁用则清除待处理中断"

    read_offset:
      pattern: '\.read_offset\s*=\s*(?P<handler>\w+)'
      description: "读取时钟偏移校准值"
      trigger: "用户调用 RTC_VL_READ 相关 ioctl"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct device *dev, long *offset)"

    set_offset:
      pattern: '\.set_offset\s*=\s*(?P<handler>\w+)'
      description: "设置时钟偏移校准值"
      trigger: "用户调用偏移设置 ioctl"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct device *dev, long offset)"


# ============================================================
# RTC INTERRUPT HANDLING
# ============================================================

rtc_interrupt:
  description: "RTC Interrupt Handling - RTC 中断处理"
  header: "linux/rtc.h"
  icon: "⚡"

  interrupt_types:
    - name: "RTC_IRQF"
      value: "0x80"
      description: "中断标志 - 表示有中断发生"
    - name: "RTC_PF"
      value: "0x40"
      description: "周期中断 (Periodic Interrupt)"
    - name: "RTC_AF"
      value: "0x20"
      description: "闹钟中断 (Alarm Interrupt)"
    - name: "RTC_UF"
      value: "0x10"
      description: "更新中断 (Update Interrupt, 每秒一次)"

  notification:
    - pattern: 'rtc_update_irq\s*\(\s*(?P<rtc>[^,]+)\s*,\s*(?P<num>\d+)\s*,\s*(?P<events>[^)]+)\s*\)'
      description: "通知 RTC 核心层有中断发生"
      signature: "void rtc_update_irq(struct rtc_device *rtc, unsigned long num, unsigned long events)"
      context: "hardirq/softirq/process"
      can_sleep: false
      parameters:
        rtc: "RTC 设备指针"
        num: "事件数量 (通常为 1)"
        events: "事件类型 (RTC_IRQF | RTC_AF/RTC_UF/RTC_PF)"
      typical_usage: |
        rtc_update_irq(rtc, 1, RTC_IRQF | RTC_AF);  // 闹钟中断
        rtc_update_irq(rtc, 1, RTC_IRQF | RTC_UF);  // 更新中断
        rtc_update_irq(rtc, 1, RTC_IRQF | RTC_PF);  // 周期中断

  uie_emulation:
    description: "UIE (Update Interrupt Enable) 软件模拟"
    note: "当硬件不支持 UIE 时，内核可通过定时器模拟"
    config: "CONFIG_RTC_INTF_DEV_UIE_EMUL"

  aie_control:
    description: "AIE (Alarm Interrupt Enable) 控制"
    ioctls:
      - "RTC_AIE_ON - 启用闹钟中断"
      - "RTC_AIE_OFF - 禁用闹钟中断"


# ============================================================
# RTC HELPER FUNCTIONS
# ============================================================

rtc_helpers:
  description: "RTC Helper Functions - RTC 辅助函数"
  header: "linux/rtc.h"

  time_access:
    - pattern: 'rtc_read_time\s*\(\s*(?P<rtc>[^,]+)\s*,\s*(?P<tm>[^)]+)\s*\)'
      description: "读取 RTC 时间 (核心层包装)"
      signature: "int rtc_read_time(struct rtc_device *rtc, struct rtc_time *tm)"
      context: "process"
      can_sleep: true

    - pattern: 'rtc_set_time\s*\(\s*(?P<rtc>[^,]+)\s*,\s*(?P<tm>[^)]+)\s*\)'
      description: "设置 RTC 时间 (核心层包装)"
      signature: "int rtc_set_time(struct rtc_device *rtc, struct rtc_time *tm)"
      context: "process"
      can_sleep: true

    - pattern: 'rtc_read_alarm\s*\(\s*(?P<rtc>[^,]+)\s*,\s*(?P<alarm>[^)]+)\s*\)'
      description: "读取 RTC 闹钟"
      signature: "int rtc_read_alarm(struct rtc_device *rtc, struct rtc_wkalrm *alarm)"
      context: "process"
      can_sleep: true

    - pattern: 'rtc_set_alarm\s*\(\s*(?P<rtc>[^,]+)\s*,\s*(?P<alarm>[^)]+)\s*\)'
      description: "设置 RTC 闹钟"
      signature: "int rtc_set_alarm(struct rtc_device *rtc, struct rtc_wkalrm *alarm)"
      context: "process"
      can_sleep: true

  conversion:
    - pattern: 'rtc_tm_to_time64\s*\(\s*(?P<tm>[^)]+)\s*\)'
      description: "rtc_time 转换为 time64_t (秒数)"
      signature: "time64_t rtc_tm_to_time64(struct rtc_time *tm)"
      context: "any"
      can_sleep: false

    - pattern: 'rtc_time64_to_tm\s*\(\s*(?P<time>[^,]+)\s*,\s*(?P<tm>[^)]+)\s*\)'
      description: "time64_t 转换为 rtc_time"
      signature: "void rtc_time64_to_tm(time64_t time, struct rtc_time *tm)"
      context: "any"
      can_sleep: false

    - pattern: 'rtc_valid_tm\s*\(\s*(?P<tm>[^)]+)\s*\)'
      description: "验证 rtc_time 是否有效"
      signature: "int rtc_valid_tm(struct rtc_time *tm)"
      return_value:
        success: "0"
        failure: "-EINVAL"

    - pattern: 'rtc_tm_to_ktime\s*\(\s*(?P<tm>[^)]+)\s*\)'
      description: "rtc_time 转换为 ktime_t"
      signature: "ktime_t rtc_tm_to_ktime(struct rtc_time tm)"

    - pattern: 'rtc_ktime_to_tm\s*\(\s*(?P<kt>[^)]+)\s*\)'
      description: "ktime_t 转换为 rtc_time"
      signature: "struct rtc_time rtc_ktime_to_tm(ktime_t kt)"


# ============================================================
# RTC CALL CHAINS
# ============================================================

call_chains:
  rtc_read_time_flow:
    description: "读取 RTC 时间调用链"
    trigger: "用户调用 ioctl(fd, RTC_RD_TIME, &tm)"
    chain:
      - function: "rtc_dev_ioctl"
        file: "drivers/rtc/dev.c"
        description: "字符设备 ioctl 入口"
        context: "process"
      - function: "rtc_read_time"
        file: "drivers/rtc/interface.c"
        description: "RTC 核心层读取时间"
      - function: "ops->read_time"
        file: "用户驱动代码"
        description: "调用驱动的 read_time 回调"
        is_user_entry: true

  rtc_set_alarm_flow:
    description: "设置 RTC 闹钟调用链"
    trigger: "用户调用 ioctl(fd, RTC_WKALM_SET, &alarm)"
    chain:
      - function: "rtc_dev_ioctl"
        file: "drivers/rtc/dev.c"
        description: "字符设备 ioctl 入口"
        context: "process"
      - function: "rtc_set_alarm"
        file: "drivers/rtc/interface.c"
        description: "RTC 核心层设置闹钟"
      - function: "rtc_timer_enqueue"
        file: "drivers/rtc/interface.c"
        description: "将闹钟加入定时器队列"
      - function: "ops->set_alarm"
        file: "用户驱动代码"
        description: "调用驱动的 set_alarm 回调"
        is_user_entry: true

  rtc_alarm_irq_flow:
    description: "RTC 闹钟中断处理调用链"
    trigger: "硬件产生闹钟中断"
    chain:
      - function: "my_rtc_irq"
        file: "用户驱动代码"
        description: "驱动中断处理函数"
        context: "hardirq"
        is_user_entry: true
      - function: "rtc_update_irq"
        file: "drivers/rtc/interface.c"
        description: "通知 RTC 核心层"
      - function: "rtc_handle_legacy_irq"
        file: "drivers/rtc/interface.c"
        description: "处理遗留中断接口"
      - function: "wake_up_interruptible"
        file: "kernel/sched/wait.c"
        description: "唤醒等待进程"

  rtc_registration_flow:
    description: "RTC 设备注册调用链"
    trigger: "驱动 probe 函数调用注册"
    chain:
      - function: "my_rtc_probe"
        file: "用户驱动代码"
        description: "驱动探测函数"
        context: "process"
        is_user_entry: true
      - function: "devm_rtc_allocate_device"
        file: "drivers/rtc/class.c"
        description: "分配 RTC 设备"
      - function: "devm_rtc_register_device"
        file: "drivers/rtc/class.c"
        description: "注册 RTC 设备"
      - function: "__rtc_register_device"
        file: "drivers/rtc/class.c"
        description: "内部注册实现"
      - function: "cdev_device_add"
        file: "fs/char_dev.c"
        description: "添加字符设备"


# ============================================================
# RTC EXAMPLES
# ============================================================

examples:
  - description: "完整 RTC 驱动示例"
    kernel_version: "5.0+"
    code: |
      #include <linux/module.h>
      #include <linux/rtc.h>
      #include <linux/platform_device.h>
      #include <linux/io.h>
      #include <linux/interrupt.h>

      struct my_rtc {
          struct rtc_device *rtc;
          void __iomem *base;
          int irq;
          spinlock_t lock;
      };

      /* 寄存器偏移 */
      #define RTC_SEC     0x00
      #define RTC_MIN     0x04
      #define RTC_HOUR    0x08
      #define RTC_DAY     0x0C
      #define RTC_MON     0x10
      #define RTC_YEAR    0x14
      #define RTC_CTRL    0x18
      #define RTC_STATUS  0x1C
      #define RTC_ALM_SEC 0x20
      #define RTC_ALM_MIN 0x24
      #define RTC_ALM_HOUR 0x28

      #define CTRL_AIE    BIT(0)  /* Alarm Interrupt Enable */
      #define STATUS_AF   BIT(0)  /* Alarm Flag */

      static int my_rtc_read_time(struct device *dev, struct rtc_time *tm)
      {
          struct my_rtc *priv = dev_get_drvdata(dev);
          u32 sec, min, hour, day, mon, year;

          sec = readl(priv->base + RTC_SEC);
          min = readl(priv->base + RTC_MIN);
          hour = readl(priv->base + RTC_HOUR);
          day = readl(priv->base + RTC_DAY);
          mon = readl(priv->base + RTC_MON);
          year = readl(priv->base + RTC_YEAR);

          tm->tm_sec = bcd2bin(sec);
          tm->tm_min = bcd2bin(min);
          tm->tm_hour = bcd2bin(hour);
          tm->tm_mday = bcd2bin(day);
          tm->tm_mon = bcd2bin(mon) - 1;  /* rtc_time 月份从 0 开始 */
          tm->tm_year = bcd2bin(year) + 100;  /* 基于 1900 年 */

          return rtc_valid_tm(tm);
      }

      static int my_rtc_set_time(struct device *dev, struct rtc_time *tm)
      {
          struct my_rtc *priv = dev_get_drvdata(dev);
          unsigned long flags;

          spin_lock_irqsave(&priv->lock, flags);

          writel(bin2bcd(tm->tm_sec), priv->base + RTC_SEC);
          writel(bin2bcd(tm->tm_min), priv->base + RTC_MIN);
          writel(bin2bcd(tm->tm_hour), priv->base + RTC_HOUR);
          writel(bin2bcd(tm->tm_mday), priv->base + RTC_DAY);
          writel(bin2bcd(tm->tm_mon + 1), priv->base + RTC_MON);
          writel(bin2bcd(tm->tm_year - 100), priv->base + RTC_YEAR);

          spin_unlock_irqrestore(&priv->lock, flags);
          return 0;
      }

      static int my_rtc_read_alarm(struct device *dev, struct rtc_wkalrm *alarm)
      {
          struct my_rtc *priv = dev_get_drvdata(dev);
          struct rtc_time *tm = &alarm->time;
          u32 ctrl;

          tm->tm_sec = bcd2bin(readl(priv->base + RTC_ALM_SEC));
          tm->tm_min = bcd2bin(readl(priv->base + RTC_ALM_MIN));
          tm->tm_hour = bcd2bin(readl(priv->base + RTC_ALM_HOUR));

          ctrl = readl(priv->base + RTC_CTRL);
          alarm->enabled = !!(ctrl & CTRL_AIE);
          alarm->pending = !!(readl(priv->base + RTC_STATUS) & STATUS_AF);

          return 0;
      }

      static int my_rtc_set_alarm(struct device *dev, struct rtc_wkalrm *alarm)
      {
          struct my_rtc *priv = dev_get_drvdata(dev);
          struct rtc_time *tm = &alarm->time;
          unsigned long flags;
          u32 ctrl;

          spin_lock_irqsave(&priv->lock, flags);

          writel(bin2bcd(tm->tm_sec), priv->base + RTC_ALM_SEC);
          writel(bin2bcd(tm->tm_min), priv->base + RTC_ALM_MIN);
          writel(bin2bcd(tm->tm_hour), priv->base + RTC_ALM_HOUR);

          ctrl = readl(priv->base + RTC_CTRL);
          if (alarm->enabled)
              ctrl |= CTRL_AIE;
          else
              ctrl &= ~CTRL_AIE;
          writel(ctrl, priv->base + RTC_CTRL);

          spin_unlock_irqrestore(&priv->lock, flags);
          return 0;
      }

      static int my_rtc_alarm_irq_enable(struct device *dev, unsigned int enabled)
      {
          struct my_rtc *priv = dev_get_drvdata(dev);
          unsigned long flags;
          u32 ctrl;

          spin_lock_irqsave(&priv->lock, flags);

          ctrl = readl(priv->base + RTC_CTRL);
          if (enabled)
              ctrl |= CTRL_AIE;
          else
              ctrl &= ~CTRL_AIE;
          writel(ctrl, priv->base + RTC_CTRL);

          spin_unlock_irqrestore(&priv->lock, flags);
          return 0;
      }

      static irqreturn_t my_rtc_irq(int irq, void *dev_id)
      {
          struct my_rtc *priv = dev_id;
          u32 status = readl(priv->base + RTC_STATUS);

          if (!(status & STATUS_AF))
              return IRQ_NONE;

          /* 清除中断标志 */
          writel(STATUS_AF, priv->base + RTC_STATUS);

          /* 通知 RTC 核心层 */
          rtc_update_irq(priv->rtc, 1, RTC_IRQF | RTC_AF);

          return IRQ_HANDLED;
      }

      static const struct rtc_class_ops my_rtc_ops = {
          .read_time = my_rtc_read_time,
          .set_time = my_rtc_set_time,
          .read_alarm = my_rtc_read_alarm,
          .set_alarm = my_rtc_set_alarm,
          .alarm_irq_enable = my_rtc_alarm_irq_enable,
      };

      static int my_rtc_probe(struct platform_device *pdev)
      {
          struct device *dev = &pdev->dev;
          struct my_rtc *priv;
          struct resource *res;
          int ret;

          priv = devm_kzalloc(dev, sizeof(*priv), GFP_KERNEL);
          if (!priv)
              return -ENOMEM;

          spin_lock_init(&priv->lock);

          res = platform_get_resource(pdev, IORESOURCE_MEM, 0);
          priv->base = devm_ioremap_resource(dev, res);
          if (IS_ERR(priv->base))
              return PTR_ERR(priv->base);

          priv->irq = platform_get_irq(pdev, 0);
          if (priv->irq < 0)
              return priv->irq;

          platform_set_drvdata(pdev, priv);

          /* 分配 RTC 设备 */
          priv->rtc = devm_rtc_allocate_device(dev);
          if (IS_ERR(priv->rtc))
              return PTR_ERR(priv->rtc);

          priv->rtc->ops = &my_rtc_ops;

          /* 注册中断 */
          ret = devm_request_irq(dev, priv->irq, my_rtc_irq,
                                 IRQF_SHARED, dev_name(dev), priv);
          if (ret)
              return ret;

          /* 注册 RTC 设备 */
          return devm_rtc_register_device(priv->rtc);
      }

      static const struct of_device_id my_rtc_of_match[] = {
          { .compatible = "vendor,my-rtc" },
          { }
      };
      MODULE_DEVICE_TABLE(of, my_rtc_of_match);

      static struct platform_driver my_rtc_driver = {
          .probe = my_rtc_probe,
          .driver = {
              .name = "my-rtc",
              .of_match_table = my_rtc_of_match,
          },
      };
      module_platform_driver(my_rtc_driver);

      MODULE_LICENSE("GPL");
      MODULE_DESCRIPTION("My RTC Driver");
      MODULE_AUTHOR("Author");

  - description: "RTC 用户空间使用示例"
    code: |
      #include <stdio.h>
      #include <fcntl.h>
      #include <linux/rtc.h>
      #include <sys/ioctl.h>

      int main(void)
      {
          int fd;
          struct rtc_time rtc_tm;
          struct rtc_wkalrm alarm;

          fd = open("/dev/rtc0", O_RDONLY);
          if (fd < 0) {
              perror("open");
              return 1;
          }

          /* 读取当前时间 */
          if (ioctl(fd, RTC_RD_TIME, &rtc_tm) < 0) {
              perror("RTC_RD_TIME");
              return 1;
          }
          printf("Current time: %04d-%02d-%02d %02d:%02d:%02d\n",
                 rtc_tm.tm_year + 1900, rtc_tm.tm_mon + 1, rtc_tm.tm_mday,
                 rtc_tm.tm_hour, rtc_tm.tm_min, rtc_tm.tm_sec);

          /* 设置闹钟 (1 分钟后) */
          alarm.time = rtc_tm;
          alarm.time.tm_min += 1;
          alarm.enabled = 1;
          if (ioctl(fd, RTC_WKALM_SET, &alarm) < 0) {
              perror("RTC_WKALM_SET");
              return 1;
          }

          /* 启用闹钟中断 */
          if (ioctl(fd, RTC_AIE_ON, 0) < 0) {
              perror("RTC_AIE_ON");
              return 1;
          }

          /* 等待闹钟 */
          printf("Waiting for alarm...\n");
          unsigned long data;
          if (read(fd, &data, sizeof(data)) < 0) {
              perror("read");
              return 1;
          }
          printf("Alarm triggered!\n");

          close(fd);
          return 0;
      }


# ============================================================
# RTC TIME STRUCTURES
# ============================================================

rtc_time:
  description: "RTC Time Structure - RTC 时间结构体"
  header: "linux/rtc.h"
  fields:
    - name: "tm_sec"
      type: "int"
      description: "秒 (0-59)"
    - name: "tm_min"
      type: "int"
      description: "分钟 (0-59)"
    - name: "tm_hour"
      type: "int"
      description: "小时 (0-23)"
    - name: "tm_mday"
      type: "int"
      description: "月中的天数 (1-31)"
    - name: "tm_mon"
      type: "int"
      description: "月份 (0-11, 注意从0开始)"
    - name: "tm_year"
      type: "int"
      description: "年份 (从 1900 年开始的年数)"

rtc_wkalrm:
  description: "RTC Wake Alarm Structure - RTC 唤醒闹钟结构体"
  header: "linux/rtc.h"
  fields:
    - name: "enabled"
      type: "unsigned char"
      description: "闹钟是否启用 (0 = 禁用, 1 = 启用)"
    - name: "pending"
      type: "unsigned char"
      description: "是否有待处理的闹钟事件"
    - name: "time"
      type: "struct rtc_time"
      description: "闹钟时间"


# ============================================================
# RTC SYSFS INTERFACE
# ============================================================

rtc_sysfs:
  description: "RTC Sysfs Interface - RTC sysfs 接口"
  path: "/sys/class/rtc/rtcN/"
  attributes:
    - name: "date"
      access: "ro"
      description: "当前日期 (YYYY-MM-DD)"
    - name: "time"
      access: "ro"
      description: "当前时间 (HH:MM:SS)"
    - name: "since_epoch"
      access: "ro"
      description: "自 1970 年以来的秒数"
    - name: "wakealarm"
      access: "rw"
      description: "唤醒闹钟时间 (自 epoch 的秒数)"
      usage: |
        # 设置 60 秒后唤醒
        echo +60 > /sys/class/rtc/rtc0/wakealarm
        # 取消唤醒闹钟
        echo 0 > /sys/class/rtc/rtc0/wakealarm


# ============================================================
# ADDITIONAL RTC EXAMPLES
# ============================================================

additional_examples:
  - description: "带电源管理的 RTC 驱动"
    kernel_version: "5.0+"
    code: |
      #include <linux/module.h>
      #include <linux/rtc.h>
      #include <linux/platform_device.h>
      #include <linux/pm.h>

      struct my_rtc_pm {
          struct rtc_device *rtc;
          void __iomem *base;
          int irq;
          bool wake_enabled;
      };

      static int my_rtc_suspend(struct device *dev)
      {
          struct my_rtc_pm *priv = dev_get_drvdata(dev);

          if (device_may_wakeup(dev)) {
              priv->wake_enabled = true;
              enable_irq_wake(priv->irq);
          }

          return 0;
      }

      static int my_rtc_resume(struct device *dev)
      {
          struct my_rtc_pm *priv = dev_get_drvdata(dev);

          if (priv->wake_enabled) {
              disable_irq_wake(priv->irq);
              priv->wake_enabled = false;
          }

          return 0;
      }

      static DEFINE_SIMPLE_DEV_PM_OPS(my_rtc_pm_ops, my_rtc_suspend, my_rtc_resume);

      static int my_rtc_probe(struct platform_device *pdev)
      {
          struct device *dev = &pdev->dev;
          struct my_rtc_pm *priv;

          priv = devm_kzalloc(dev, sizeof(*priv), GFP_KERNEL);
          if (!priv)
              return -ENOMEM;

          /* 启用唤醒能力 */
          device_init_wakeup(dev, true);
          platform_set_drvdata(pdev, priv);

          return devm_rtc_register_device(priv->rtc);
      }

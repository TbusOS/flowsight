# Device Tree / Open Firmware Knowledge Base
# Reference: https://www.kernel.org/doc/html/latest/devicetree/

# ============================================================
# DEVICE TREE BASICS
# ============================================================

device_tree:
  description: "Device Tree Framework"
  header: "linux/of.h"
  icon: "🌳"
  kernel_version: "2.6.26+"

  concepts:
    - name: "node"
      description: "设备树节点"
    - name: "property"
      description: "节点属性"
    - name: "phandle"
      description: "节点引用句柄"
    - name: "compatible"
      description: "兼容性字符串"

  standard_properties:
    - name: "compatible"
      description: "设备兼容性列表"
      example: 'compatible = "fsl,imx6ul-uart", "fsl,imx21-uart"'
    - name: "reg"
      description: "寄存器地址和大小"
      example: "reg = <0x02020000 0x4000>"
    - name: "interrupts"
      description: "中断描述"
    - name: "clocks"
      description: "时钟引用"
    - name: "status"
      description: "节点状态 (okay/disabled)"
    - name: "#address-cells"
      description: "子节点地址单元数"
    - name: "#size-cells"
      description: "子节点大小单元数"

# ============================================================
# OF MATCHING
# ============================================================

of_match:
  description: "Device Tree Matching"
  header: "linux/of_device.h"
  icon: "🔍"

  match_table:
    - pattern: 'static const struct of_device_id\s+(?P<name>\w+)\[\]'
      description: "OF 匹配表"
    - pattern: '\.compatible\s*=\s*"(?P<compat>[^"]+)"'
      description: "兼容性字符串"
    - pattern: '\.data\s*=\s*(?P<data>\w+)'
      description: "匹配数据"

  module_macros:
    - pattern: 'MODULE_DEVICE_TABLE\s*\(\s*of\s*,\s*(?P<table>\w+)\s*\)'
      description: "模块设备表"

  functions:
    - pattern: 'of_match_device\s*\('
      description: "匹配设备"
    - pattern: 'of_match_node\s*\('
      description: "匹配节点"
    - pattern: 'of_device_get_match_data\s*\('
      description: "获取匹配数据"

# ============================================================
# OF PROPERTY ACCESS
# ============================================================

of_property:
  description: "Device Tree Property Access"
  header: "linux/of.h"
  icon: "📋"

  read_functions:
    u32:
      - pattern: 'of_property_read_u32\s*\('
        description: "读取 u32 属性"
      - pattern: 'of_property_read_u32_array\s*\('
        description: "读取 u32 数组"
      - pattern: 'of_property_read_u32_index\s*\('
        description: "读取 u32 数组指定索引"

    u64:
      - pattern: 'of_property_read_u64\s*\('
        description: "读取 u64 属性"

    string:
      - pattern: 'of_property_read_string\s*\('
        description: "读取字符串属性"
      - pattern: 'of_property_read_string_array\s*\('
        description: "读取字符串数组"
      - pattern: 'of_property_read_string_index\s*\('
        description: "读取字符串数组指定索引"

    bool:
      - pattern: 'of_property_read_bool\s*\('
        description: "读取布尔属性"

    generic:
      - pattern: 'of_find_property\s*\('
        description: "查找属性"
      - pattern: 'of_property_count_elems_of_size\s*\('
        description: "计算属性元素数量"

# ============================================================
# OF NODE TRAVERSAL
# ============================================================

of_traversal:
  description: "Device Tree Node Traversal"
  header: "linux/of.h"
  icon: "🚶"

  find_functions:
    - pattern: 'of_find_node_by_name\s*\('
      description: "按名称查找节点"
    - pattern: 'of_find_node_by_path\s*\('
      description: "按路径查找节点"
    - pattern: 'of_find_node_by_phandle\s*\('
      description: "按 phandle 查找节点"
    - pattern: 'of_find_compatible_node\s*\('
      description: "按兼容性查找节点"

  iteration:
    - pattern: 'for_each_child_of_node\s*\('
      description: "遍历子节点"
    - pattern: 'for_each_available_child_of_node\s*\('
      description: "遍历可用子节点"
    - pattern: 'for_each_node_by_name\s*\('
      description: "按名称遍历"
    - pattern: 'for_each_compatible_node\s*\('
      description: "按兼容性遍历"

  reference_counting:
    - pattern: 'of_node_get\s*\('
      description: "增加节点引用"
    - pattern: 'of_node_put\s*\('
      description: "减少节点引用"

# ============================================================
# OF PLATFORM
# ============================================================

of_platform:
  description: "OF Platform Integration"
  header: "linux/of_platform.h"
  icon: "🏭"

  functions:
    - pattern: 'of_platform_populate\s*\('
      description: "从设备树创建平台设备"
    - pattern: 'of_platform_depopulate\s*\('
      description: "移除设备树创建的设备"
    - pattern: 'of_platform_device_create\s*\('
      description: "创建单个平台设备"

  driver_integration:
    - pattern: '\.of_match_table\s*=\s*(?P<table>\w+)'
      description: "驱动 OF 匹配表"
    - pattern: 'of_match_ptr\s*\(\s*(?P<table>\w+)\s*\)'
      description: "OF 匹配表指针宏"

# ============================================================
# OF RESOURCE ACCESS
# ============================================================

of_resource:
  description: "Device Tree Resource Access"
  icon: "📦"

  address:
    - pattern: 'of_address_to_resource\s*\('
      description: "地址转资源"
    - pattern: 'of_iomap\s*\('
      description: "映射 I/O 内存"
    - pattern: 'of_io_request_and_map\s*\('
      description: "请求并映射 I/O"

  interrupt:
    - pattern: 'of_irq_get\s*\('
      description: "获取中断号"
    - pattern: 'of_irq_get_byname\s*\('
      description: "按名称获取中断"
    - pattern: 'platform_get_irq\s*\('
      description: "平台设备获取中断"

  gpio:
    - pattern: 'of_get_named_gpio\s*\('
      description: "获取命名 GPIO"
    - pattern: 'devm_gpiod_get\s*\('
      description: "获取 GPIO 描述符"

  clock:
    - pattern: 'of_clk_get\s*\('
      description: "获取时钟"
    - pattern: 'of_clk_get_by_name\s*\('
      description: "按名称获取时钟"

  regulator:
    - pattern: 'of_get_regulator\s*\('
      description: "获取调节器"

  dma:
    - pattern: 'of_dma_controller_register\s*\('
      description: "注册 DMA 控制器"

# ============================================================
# OF OVERLAY
# ============================================================

of_overlay:
  description: "Device Tree Overlay"
  header: "linux/of.h"
  icon: "🎭"

  functions:
    - pattern: 'of_overlay_fdt_apply\s*\('
      description: "应用 FDT overlay"
    - pattern: 'of_overlay_remove\s*\('
      description: "移除 overlay"
    - pattern: 'of_overlay_notifier_register\s*\('
      description: "注册 overlay 通知"

  use_cases:
    - "运行时添加/移除设备"
    - "Cape/HAT 热插拔"
    - "FPGA 配置"

# ============================================================
# DEVICE TREE BINDINGS
# ============================================================

dt_bindings:
  description: "Device Tree Bindings Documentation"
  location: "Documentation/devicetree/bindings/"
  icon: "📚"

  binding_categories:
    - "arm/"
    - "bus/"
    - "clock/"
    - "display/"
    - "gpio/"
    - "i2c/"
    - "interrupt-controller/"
    - "mmc/"
    - "net/"
    - "phy/"
    - "pinctrl/"
    - "regulator/"
    - "serial/"
    - "spi/"
    - "usb/"

  yaml_schema:
    - "dt-schema"
    - "YAML bindings"
    - "make dt_binding_check"


# ============================================================
# DATA STRUCTURES
# ============================================================

data_structures:
  device_node:
    pattern: 'struct device_node\s*\{'
    description: "设备树节点结构"
    file: "include/linux/of.h"
    fields:
      - name: "name"
        type: "const char *"
        description: "节点名称"
      - name: "phandle"
        type: "phandle"
        description: "节点句柄"
      - name: "full_name"
        type: "const char *"
        description: "完整路径名"
      - name: "properties"
        type: "struct property *"
        description: "属性链表"
      - name: "parent"
        type: "struct device_node *"
        description: "父节点"
      - name: "child"
        type: "struct device_node *"
        description: "子节点"
      - name: "sibling"
        type: "struct device_node *"
        description: "兄弟节点"

  property:
    pattern: 'struct property\s*\{'
    description: "设备树属性结构"
    file: "include/linux/of.h"
    fields:
      - name: "name"
        type: "char *"
        description: "属性名"
      - name: "length"
        type: "int"
        description: "值长度"
      - name: "value"
        type: "void *"
        description: "属性值"
      - name: "next"
        type: "struct property *"
        description: "下一属性"

  of_device_id:
    pattern: 'struct of_device_id\s*\{'
    description: "OF 设备匹配结构"
    file: "include/linux/mod_devicetable.h"
    fields:
      - name: "compatible"
        type: "char []"
        description: "兼容性字符串"
      - name: "type"
        type: "char []"
        description: "设备类型"
      - name: "name"
        type: "char []"
        description: "设备名"
      - name: "data"
        type: "const void *"
        description: "匹配数据"


# ============================================================
# CALL CHAINS
# ============================================================

call_chains:
  of_platform_populate:
    description: "设备树设备创建流程"
    chain:
      - caller: "board init / of_platform_default_populate_init"
        callee: "of_platform_populate"
        description: "从设备树创建设备"
      - caller: "of_platform_populate"
        callee: "of_platform_bus_create"
        description: "创建总线设备"
      - caller: "of_platform_bus_create"
        callee: "of_platform_device_create_pdata"
        description: "创建平台设备"
      - caller: "of_platform_device_create_pdata"
        callee: "device_add"
        description: "添加到设备模型"

  of_driver_match:
    description: "设备树驱动匹配流程"
    chain:
      - caller: "platform_match"
        callee: "of_driver_match_device"
        description: "设备树匹配"
      - caller: "of_driver_match_device"
        callee: "of_match_device"
        description: "检查匹配表"
      - caller: "of_match_device"
        callee: "__of_match_node"
        description: "匹配 compatible"


# ============================================================
# EXAMPLES
# ============================================================

examples:
  - description: "平台驱动 OF 匹配示例"
    kernel_version: "5.0+"
    code: |
      #include <linux/module.h>
      #include <linux/platform_device.h>
      #include <linux/of.h>
      #include <linux/of_device.h>
      
      struct my_driver_data {
          int variant;
          const char *name;
      };
      
      static const struct my_driver_data variant_a = {
          .variant = 1,
          .name = "variant-a",
      };
      
      static const struct my_driver_data variant_b = {
          .variant = 2,
          .name = "variant-b",
      };
      
      static const struct of_device_id my_of_match[] = {
          { .compatible = "vendor,my-device-a", .data = &variant_a },
          { .compatible = "vendor,my-device-b", .data = &variant_b },
          { /* sentinel */ }
      };
      MODULE_DEVICE_TABLE(of, my_of_match);
      
      static int my_probe(struct platform_device *pdev)
      {
          const struct my_driver_data *data;
          struct device_node *np = pdev->dev.of_node;
          struct resource *res;
          void __iomem *regs;
          u32 value;
          int irq, ret;
          
          /* 获取匹配数据 */
          data = of_device_get_match_data(&pdev->dev);
          if (!data)
              return -ENODEV;
          
          dev_info(&pdev->dev, "Probing %s (variant %d)\n",
                   data->name, data->variant);
          
          /* 获取寄存器资源 */
          res = platform_get_resource(pdev, IORESOURCE_MEM, 0);
          regs = devm_ioremap_resource(&pdev->dev, res);
          if (IS_ERR(regs))
              return PTR_ERR(regs);
          
          /* 获取中断 */
          irq = platform_get_irq(pdev, 0);
          if (irq < 0)
              return irq;
          
          /* 读取设备树属性 */
          ret = of_property_read_u32(np, "my-property", &value);
          if (ret) {
              dev_warn(&pdev->dev, "Using default value\n");
              value = 100;
          }
          
          /* 检查布尔属性 */
          if (of_property_read_bool(np, "my-flag")) {
              dev_info(&pdev->dev, "Flag is set\n");
          }
          
          /* 读取字符串数组 */
          const char *str;
          int i = 0;
          while (of_property_read_string_index(np, "my-strings",
                                                i, &str) == 0) {
              dev_info(&pdev->dev, "String %d: %s\n", i, str);
              i++;
          }
          
          return 0;
      }
      
      static int my_remove(struct platform_device *pdev)
      {
          return 0;
      }
      
      static struct platform_driver my_driver = {
          .probe  = my_probe,
          .remove = my_remove,
          .driver = {
              .name = "my-driver",
              .of_match_table = my_of_match,
          },
      };
      module_platform_driver(my_driver);

  - description: "设备树遍历示例"
    kernel_version: "5.0+"
    code: |
      #include <linux/of.h>
      
      /* 遍历所有子节点 */
      static void iterate_children(struct device_node *parent)
      {
          struct device_node *child;
          
          for_each_child_of_node(parent, child) {
              const char *name;
              u32 reg;
              
              name = child->name;
              if (of_property_read_u32(child, "reg", &reg) == 0) {
                  pr_info("Child: %s @ 0x%x\n", name, reg);
              }
              
              /* 递归处理子节点 */
              iterate_children(child);
          }
      }
      
      /* 按 compatible 查找节点 */
      static void find_by_compatible(void)
      {
          struct device_node *np = NULL;
          
          while ((np = of_find_compatible_node(np, NULL,
                                                "vendor,my-device"))) {
              const char *status;
              
              if (of_property_read_string(np, "status", &status) == 0) {
                  if (strcmp(status, "disabled") == 0) {
                      pr_info("Node %pOF is disabled\n", np);
                      continue;
                  }
              }
              
              pr_info("Found: %pOF\n", np);
          }
      }

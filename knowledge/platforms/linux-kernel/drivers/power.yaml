# Power Supply Framework Knowledge Base
# Reference: https://www.kernel.org/doc/html/latest/power/power_supply_class.html

# ============================================================
# POWER SUPPLY CLASS
# ============================================================
power_supply:
  description: "Power Supply Class Driver"
  header: "linux/power_supply.h"
  icon: "🔋"
  kernel_version: "2.6.24+"
  registration:
    - pattern: 'power_supply_register\s*\(\s*(?P<dev>\w+)\s*,\s*(?P<desc>\w+)\s*,\s*(?P<cfg>\w+)\s*\)'
      description: "注册电源设备"
    - pattern: 'devm_power_supply_register\s*\(\s*(?P<dev>\w+)\s*,'
      description: "托管注册电源设备"
  unregistration:
    - pattern: 'power_supply_unregister\s*\(\s*(?P<psy>\w+)\s*\)'
      description: "注销电源设备"
  structure:
    name: "power_supply_desc"
    callbacks:
      get_property:
        pattern: '\.get_property\s*=\s*(?P<handler>\w+)'
        description: "获取电源属性"
        context: "process"
        can_sleep: true
      set_property:
        pattern: '\.set_property\s*=\s*(?P<handler>\w+)'
        description: "设置电源属性"
        context: "process"
        can_sleep: true
      property_is_writeable:
        pattern: '\.property_is_writeable\s*=\s*(?P<handler>\w+)'
        description: "检查属性可写性"
        context: "process"
        can_sleep: false
      external_power_changed:
        pattern: '\.external_power_changed\s*=\s*(?P<handler>\w+)'
        description: "外部电源变化通知"
        context: "workqueue"
        can_sleep: true
  helpers:
    - pattern: 'power_supply_changed\s*\(\s*(?P<psy>\w+)\s*\)'
      description: "通知电源状态变化"
    - pattern: 'power_supply_get_drvdata\s*\(\s*(?P<psy>\w+)\s*\)'
      description: "获取驱动私有数据"
    - pattern: 'power_supply_get_by_name\s*\('
      description: "按名称获取电源设备"
    - pattern: 'power_supply_put\s*\(\s*(?P<psy>\w+)\s*\)'
      description: "释放电源设备引用"
  properties:
    - POWER_SUPPLY_PROP_STATUS
    - POWER_SUPPLY_PROP_HEALTH
    - POWER_SUPPLY_PROP_PRESENT
    - POWER_SUPPLY_PROP_ONLINE
    - POWER_SUPPLY_PROP_VOLTAGE_NOW
    - POWER_SUPPLY_PROP_CURRENT_NOW
    - POWER_SUPPLY_PROP_CAPACITY
    - POWER_SUPPLY_PROP_TEMP

# ============================================================
# CHARGER MANAGER
# ============================================================
charger_manager:
  description: "Charger Manager Framework"
  header: "linux/power/charger-manager.h"
  icon: "🔌"
  patterns:
    - pattern: 'cm_notify_event\s*\(\s*(?P<psy>\w+)\s*,\s*(?P<type>\w+)\s*,'
      description: "通知充电事件"

# ============================================================
# BATTERY/FUEL GAUGE
# ============================================================
fuel_gauge:
  description: "Fuel Gauge Interface"
  header: "linux/power_supply.h"
  icon: "📊"
  patterns:
    - pattern: 'power_supply_get_battery_info\s*\(\s*(?P<psy>\w+)\s*,'
      description: "获取电池信息"
    - pattern: 'power_supply_put_battery_info\s*\(\s*(?P<psy>\w+)\s*,'
      description: "释放电池信息"
    - pattern: 'power_supply_temp2resist_simple\s*\('
      description: "温度到电阻转换"
    - pattern: 'power_supply_ocv2cap_simple\s*\('
      description: "OCV 到容量转换"

# ============================================================
# CALL CHAINS
# ============================================================
call_chains:
  power_supply_probe:
    description: "Power Supply Probe Flow"
    chain:
      - caller: "platform_driver.probe"
        callee: "devm_power_supply_register"
        description: "注册电源设备"
      - caller: "devm_power_supply_register"
        callee: "power_supply_register"
        description: "实际注册"
      - caller: "power_supply_register"
        callee: "device_add"
        description: "添加设备到系统"
  battery_changed:
    description: "Battery State Change"
    chain:
      - caller: "IRQ handler"
        callee: "power_supply_changed"
        description: "通知状态变化"
      - caller: "power_supply_changed"
        callee: "power_supply_changed_work"
        async: true
        mechanism: "workqueue"
      - caller: "power_supply_changed_work"
        callee: "kobject_uevent"
        description: "发送 uevent 到用户空间"


# ============================================================
# DATA STRUCTURES
# ============================================================

data_structures:
  power_supply:
    pattern: 'struct power_supply\s*\{'
    description: "电源设备结构"
    file: "include/linux/power_supply.h"
    fields:
      - name: "desc"
        type: "const struct power_supply_desc *"
        description: "设备描述"
      - name: "supplied_to"
        type: "char **"
        description: "供电目标列表"
      - name: "num_supplicants"
        type: "size_t"
        description: "供电目标数量"
      - name: "dev"
        type: "struct device"
        description: "内嵌设备"
      - name: "drv_data"
        type: "void *"
        description: "驱动私有数据"

  power_supply_desc:
    pattern: 'struct power_supply_desc\s*\{'
    description: "电源描述结构"
    file: "include/linux/power_supply.h"
    fields:
      - name: "name"
        type: "const char *"
        description: "电源名称"
      - name: "type"
        type: "enum power_supply_type"
        description: "电源类型"
      - name: "properties"
        type: "enum power_supply_property *"
        description: "支持的属性数组"
      - name: "num_properties"
        type: "size_t"
        description: "属性数量"
      - name: "get_property"
        type: "callback"
        description: "获取属性回调"
      - name: "set_property"
        type: "callback"
        description: "设置属性回调"


# ============================================================
# EXAMPLES
# ============================================================

examples:
  - description: "基本电源驱动示例"
    kernel_version: "5.0+"
    code: |
      #include <linux/module.h>
      #include <linux/power_supply.h>
      #include <linux/platform_device.h>
      
      struct my_battery {
          struct power_supply *psy;
          int capacity;
          int voltage;
          int status;
      };
      
      static enum power_supply_property my_battery_props[] = {
          POWER_SUPPLY_PROP_STATUS,
          POWER_SUPPLY_PROP_PRESENT,
          POWER_SUPPLY_PROP_VOLTAGE_NOW,
          POWER_SUPPLY_PROP_CAPACITY,
          POWER_SUPPLY_PROP_HEALTH,
      };
      
      static int my_battery_get_property(struct power_supply *psy,
                                         enum power_supply_property psp,
                                         union power_supply_propval *val)
      {
          struct my_battery *bat = power_supply_get_drvdata(psy);
          
          switch (psp) {
          case POWER_SUPPLY_PROP_STATUS:
              val->intval = bat->status;
              break;
          case POWER_SUPPLY_PROP_PRESENT:
              val->intval = 1;
              break;
          case POWER_SUPPLY_PROP_VOLTAGE_NOW:
              val->intval = bat->voltage;
              break;
          case POWER_SUPPLY_PROP_CAPACITY:
              val->intval = bat->capacity;
              break;
          case POWER_SUPPLY_PROP_HEALTH:
              val->intval = POWER_SUPPLY_HEALTH_GOOD;
              break;
          default:
              return -EINVAL;
          }
          return 0;
      }
      
      static const struct power_supply_desc my_battery_desc = {
          .name           = "my-battery",
          .type           = POWER_SUPPLY_TYPE_BATTERY,
          .properties     = my_battery_props,
          .num_properties = ARRAY_SIZE(my_battery_props),
          .get_property   = my_battery_get_property,
      };
      
      static int my_battery_probe(struct platform_device *pdev)
      {
          struct my_battery *bat;
          struct power_supply_config cfg = {};
          
          bat = devm_kzalloc(&pdev->dev, sizeof(*bat), GFP_KERNEL);
          if (!bat)
              return -ENOMEM;
          
          bat->capacity = 100;
          bat->voltage = 4200000; /* 4.2V in uV */
          bat->status = POWER_SUPPLY_STATUS_FULL;
          
          cfg.drv_data = bat;
          cfg.of_node = pdev->dev.of_node;
          
          bat->psy = devm_power_supply_register(&pdev->dev,
                                                 &my_battery_desc, &cfg);
          if (IS_ERR(bat->psy))
              return PTR_ERR(bat->psy);
          
          platform_set_drvdata(pdev, bat);
          return 0;
      }
      
      static struct platform_driver my_battery_driver = {
          .probe  = my_battery_probe,
          .driver = {
              .name = "my-battery",
          },
      };
      module_platform_driver(my_battery_driver);

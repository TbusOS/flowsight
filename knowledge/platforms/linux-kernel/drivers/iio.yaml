# EXAMPLES
# ============================================================

examples:
  - description: "简单 ADC 驱动 (直接模式)"
    kernel_version: "5.0+"
    code: |
      #include <linux/module.h>
      #include <linux/iio/iio.h>
      #include <linux/i2c.h>
      
      struct my_adc_data {
          struct i2c_client *client;
          struct mutex lock;
      };
      
      static int my_adc_read_raw(struct iio_dev *indio_dev,
                                  struct iio_chan_spec const *chan,
                                  int *val, int *val2, long mask)
      {
          struct my_adc_data *data = iio_priv(indio_dev);
          int ret;
          
          switch (mask) {
          case IIO_CHAN_INFO_RAW:
              mutex_lock(&data->lock);
              /* 从硬件读取原始值 */
              ret = i2c_smbus_read_word_data(data->client,
                                              0x00 + chan->channel);
              mutex_unlock(&data->lock);
              
              if (ret < 0)
                  return ret;
              
              *val = ret & 0xFFF;  /* 12-bit ADC */
              return IIO_VAL_INT;
              
          case IIO_CHAN_INFO_SCALE:
              /* 3.3V 参考电压, 12-bit */
              *val = 3300;
              *val2 = 12;
              return IIO_VAL_FRACTIONAL_LOG2;
              
          default:
              return -EINVAL;
          }
      }
      
      static const struct iio_chan_spec my_adc_channels[] = {
          {
              .type = IIO_VOLTAGE,
              .indexed = 1,
              .channel = 0,
              .info_mask_separate = BIT(IIO_CHAN_INFO_RAW),
              .info_mask_shared_by_type = BIT(IIO_CHAN_INFO_SCALE),
          },
          {
              .type = IIO_VOLTAGE,
              .indexed = 1,
              .channel = 1,
              .info_mask_separate = BIT(IIO_CHAN_INFO_RAW),
              .info_mask_shared_by_type = BIT(IIO_CHAN_INFO_SCALE),
          },
      };
      
      static const struct iio_info my_adc_info = {
          .read_raw = my_adc_read_raw,
      };
      
      static int my_adc_probe(struct i2c_client *client)
      {
          struct iio_dev *indio_dev;
          struct my_adc_data *data;
          
          indio_dev = devm_iio_device_alloc(&client->dev, sizeof(*data));
          if (!indio_dev)
              return -ENOMEM;
          
          data = iio_priv(indio_dev);
          data->client = client;
          mutex_init(&data->lock);
          
          indio_dev->name = "my-adc";
          indio_dev->info = &my_adc_info;
          indio_dev->channels = my_adc_channels;
          indio_dev->num_channels = ARRAY_SIZE(my_adc_channels);
          indio_dev->modes = INDIO_DIRECT_MODE;
          
          return devm_iio_device_register(&client->dev, indio_dev);
      }

  - description: "加速度计驱动 (带缓冲区和触发器)"
    kernel_version: "5.0+"
    code: |
      #include <linux/module.h>
      #include <linux/iio/iio.h>
      #include <linux/iio/buffer.h>
      #include <linux/iio/trigger.h>
      #include <linux/iio/trigger_consumer.h>
      #include <linux/iio/triggered_buffer.h>
      #include <linux/spi/spi.h>
      
      struct accel_data {
          struct spi_device *spi;
          struct iio_trigger *trig;
          /* 数据缓冲区: 3x16bit + padding + 64bit timestamp */
          struct {
              __be16 channels[3];
              s64 timestamp __aligned(8);
          } scan;
      };
      
      #define ACCEL_CHANNEL(axis, idx) {                       \
          .type = IIO_ACCEL,                                   \
          .modified = 1,                                       \
          .channel2 = IIO_MOD_##axis,                          \
          .info_mask_separate = BIT(IIO_CHAN_INFO_RAW),        \
          .info_mask_shared_by_type = BIT(IIO_CHAN_INFO_SCALE) \
                                    | BIT(IIO_CHAN_INFO_SAMP_FREQ), \
          .scan_index = idx,                                   \
          .scan_type = {                                       \
              .sign = 's',                                     \
              .realbits = 16,                                  \
              .storagebits = 16,                               \
              .endianness = IIO_BE,                            \
          },                                                   \
      }
      
      static const struct iio_chan_spec accel_channels[] = {
          ACCEL_CHANNEL(X, 0),
          ACCEL_CHANNEL(Y, 1),
          ACCEL_CHANNEL(Z, 2),
          IIO_CHAN_SOFT_TIMESTAMP(3),
      };
      
      static irqreturn_t accel_trigger_handler(int irq, void *p)
      {
          struct iio_poll_func *pf = p;
          struct iio_dev *indio_dev = pf->indio_dev;
          struct accel_data *data = iio_priv(indio_dev);
          int ret;
          
          /* 从硬件读取 X, Y, Z */
          ret = spi_read(data->spi, data->scan.channels,
                         sizeof(data->scan.channels));
          if (ret)
              goto done;
          
          /* 推送到缓冲区 */
          iio_push_to_buffers_with_timestamp(indio_dev, &data->scan,
                                             iio_get_time_ns(indio_dev));
      done:
          iio_trigger_notify_done(indio_dev->trig);
          return IRQ_HANDLED;
      }
      
      static int accel_read_raw(struct iio_dev *indio_dev,
                                struct iio_chan_spec const *chan,
                                int *val, int *val2, long mask)
      {
          struct accel_data *data = iio_priv(indio_dev);
          __be16 raw;
          int ret;
          
          switch (mask) {
          case IIO_CHAN_INFO_RAW:
              ret = iio_device_claim_direct_mode(indio_dev);
              if (ret)
                  return ret;
              
              /* 读取单个轴 */
              ret = spi_read(data->spi, &raw, sizeof(raw));
              
              iio_device_release_direct_mode(indio_dev);
              
              if (ret)
                  return ret;
              
              *val = sign_extend32(be16_to_cpu(raw), 15);
              return IIO_VAL_INT;
              
          case IIO_CHAN_INFO_SCALE:
              /* 2g 满量程, 16-bit */
              *val = 0;
              *val2 = 598;  /* 2 * 9.8 / 32768 * 1000000 */
              return IIO_VAL_INT_PLUS_MICRO;
              
          case IIO_CHAN_INFO_SAMP_FREQ:
              *val = 100;  /* 100 Hz */
              return IIO_VAL_INT;
          }
          
          return -EINVAL;
      }
      
      static const struct iio_info accel_info = {
          .read_raw = accel_read_raw,
      };
      
      static int accel_probe(struct spi_device *spi)
      {
          struct iio_dev *indio_dev;
          struct accel_data *data;
          int ret;
          
          indio_dev = devm_iio_device_alloc(&spi->dev, sizeof(*data));
          if (!indio_dev)
              return -ENOMEM;
          
          data = iio_priv(indio_dev);
          data->spi = spi;
          
          indio_dev->name = "my-accel";
          indio_dev->info = &accel_info;
          indio_dev->channels = accel_channels;
          indio_dev->num_channels = ARRAY_SIZE(accel_channels);
          indio_dev->modes = INDIO_DIRECT_MODE | INDIO_BUFFER_TRIGGERED;
          
          /* 设置触发缓冲区 */
          ret = devm_iio_triggered_buffer_setup(&spi->dev, indio_dev,
                                                NULL, /* top half */
                                                accel_trigger_handler,
                                                NULL); /* buffer ops */
          if (ret)
              return ret;
          
          /* 分配数据就绪触发器 */
          data->trig = devm_iio_trigger_alloc(&spi->dev, "%s-dev%d",
                                              indio_dev->name, indio_dev->id);
          if (!data->trig)
              return -ENOMEM;
          
          ret = devm_iio_trigger_register(&spi->dev, data->trig);
          if (ret)
              return ret;
          
          /* 设置默认触发器 */
          indio_dev->trig = iio_trigger_get(data->trig);
          
          return devm_iio_device_register(&spi->dev, indio_dev);
      }

  - description: "DAC 驱动 (输出通道)"
    kernel_version: "5.0+"
    code: |
      #include <linux/module.h>
      #include <linux/iio/iio.h>
      #include <linux/spi/spi.h>
      
      struct dac_data {
          struct spi_device *spi;
          unsigned int vref_mv;
      };
      
      static int dac_write_raw(struct iio_dev *indio_dev,
                               struct iio_chan_spec const *chan,
                               int val, int val2, long mask)
      {
          struct dac_data *data = iio_priv(indio_dev);
          u8 buf[2];
          
          switch (mask) {
          case IIO_CHAN_INFO_RAW:
              if (val < 0 || val > 4095)
                  return -EINVAL;
              
              /* 12-bit DAC */
              buf[0] = (val >> 8) & 0x0F;
              buf[1] = val & 0xFF;
              
              return spi_write(data->spi, buf, sizeof(buf));
          
          default:
              return -EINVAL;
          }
      }
      
      static int dac_read_raw(struct iio_dev *indio_dev,
                              struct iio_chan_spec const *chan,
                              int *val, int *val2, long mask)
      {
          struct dac_data *data = iio_priv(indio_dev);
          
          switch (mask) {
          case IIO_CHAN_INFO_SCALE:
              *val = data->vref_mv;
              *val2 = 12;  /* 12-bit */
              return IIO_VAL_FRACTIONAL_LOG2;
          
          default:
              return -EINVAL;
          }
      }
      
      static const struct iio_chan_spec dac_channels[] = {
          {
              .type = IIO_VOLTAGE,
              .indexed = 1,
              .channel = 0,
              .output = 1,  /* 输出通道 */
              .info_mask_separate = BIT(IIO_CHAN_INFO_RAW),
              .info_mask_shared_by_type = BIT(IIO_CHAN_INFO_SCALE),
          },
      };
      
      static const struct iio_info dac_info = {
          .read_raw = dac_read_raw,
          .write_raw = dac_write_raw,
      };

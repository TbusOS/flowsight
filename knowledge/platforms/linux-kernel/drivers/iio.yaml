# Linux Kernel IIO (Industrial I/O) Driver Framework Knowledge Base
#
# Reference: https://www.kernel.org/doc/html/latest/driver-api/iio/index.html

# ============================================================
# IIO CORE
# ============================================================

iio_core:
  description: "IIO Core - 工业 I/O 核心框架"
  header: "linux/iio/iio.h"
  icon: "📊"
  kernel_version: "3.0+"

  overview: |
    IIO (Industrial I/O) 子系统为各种传感器和转换器提供统一的内核接口:
    - ADC (模数转换器)
    - DAC (数模转换器)
    - 加速度计、陀螺仪、磁力计
    - 光传感器、距离传感器
    - 温度、湿度、压力传感器
    
    用户空间通过 sysfs 属性或字符设备 (/dev/iio:deviceX) 访问数据。

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true


# ============================================================
# IIO DEVICE ALLOCATION
# ============================================================

iio_device_alloc:
  description: "IIO Device Allocation - IIO 设备分配"
  header: "linux/iio/iio.h"

  bind_patterns:
    - pattern: 'iio_device_alloc\s*\(\s*(?P<parent>[^,]+)\s*,\s*(?P<sizeof_priv>\w+)\s*\)'
      description: "分配 IIO 设备 (新 API, 5.x+)"
      context: "process"

    - pattern: 'iio_device_alloc\s*\(\s*(?P<sizeof_priv>\w+)\s*\)'
      description: "分配 IIO 设备 (旧 API)"
      context: "process"
      deprecated: true

    - pattern: 'devm_iio_device_alloc\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<sizeof_priv>\w+)\s*\)'
      description: "分配 IIO 设备 (资源管理版，推荐)"
      context: "process"

    - pattern: 'iio_device_free\s*\(\s*(?P<indio_dev>[^)]+)\s*\)'
      description: "释放 IIO 设备"
      context: "process"

  helper_functions:
    - pattern: 'iio_priv\s*\(\s*(?P<indio_dev>[^)]+)\s*\)'
      description: "获取驱动私有数据指针"
      context: "any"

    - pattern: 'iio_device_set_drvdata\s*\(\s*(?P<indio_dev>[^,]+)\s*,\s*(?P<data>[^)]+)\s*\)'
      description: "设置驱动数据"
      context: "process"

    - pattern: 'iio_device_get_drvdata\s*\(\s*(?P<indio_dev>[^)]+)\s*\)'
      description: "获取驱动数据"
      context: "any"


# ============================================================
# IIO DEVICE REGISTRATION
# ============================================================

iio_device_register:
  description: "IIO Device Registration - IIO 设备注册"
  header: "linux/iio/iio.h"

  bind_patterns:
    - pattern: 'iio_device_register\s*\(\s*(?P<indio_dev>[^)]+)\s*\)'
      description: "注册 IIO 设备"
      context: "process"
      return_value:
        success: "0"
        failure: "-ERRNO"

    - pattern: 'devm_iio_device_register\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<indio_dev>[^)]+)\s*\)'
      description: "注册 IIO 设备 (资源管理版，推荐)"
      context: "process"

    - pattern: 'iio_device_unregister\s*\(\s*(?P<indio_dev>[^)]+)\s*\)'
      description: "注销 IIO 设备"
      context: "process"


# ============================================================
# IIO_DEV STRUCTURE
# ============================================================

iio_dev:
  description: "IIO Device Structure - IIO 设备结构"
  header: "linux/iio/iio.h"

  structure:
    pattern: 'struct iio_dev\s*\*\s*(?P<name>\w+)'
    description: "IIO 设备指针"
    fields:
      - name: "name"
        type: "const char *"
        description: "设备名称"
      - name: "info"
        type: "const struct iio_info *"
        description: "设备操作回调"
      - name: "channels"
        type: "const struct iio_chan_spec *"
        description: "通道定义数组"
      - name: "num_channels"
        type: "int"
        description: "通道数量"
      - name: "modes"
        type: "int"
        description: "支持的操作模式 (INDIO_DIRECT_MODE, INDIO_BUFFER_*)"
      - name: "currentmode"
        type: "int"
        description: "当前操作模式"
      - name: "dev"
        type: "struct device"
        description: "内嵌的设备结构"
      - name: "buffer"
        type: "struct iio_buffer *"
        description: "数据缓冲区"
      - name: "trig"
        type: "struct iio_trigger *"
        description: "关联的触发器"
      - name: "available_scan_masks"
        type: "const unsigned long *"
        description: "可用的扫描掩码"

  modes:
    INDIO_DIRECT_MODE: "直接模式 - 通过 sysfs 单次读取"
    INDIO_BUFFER_TRIGGERED: "触发缓冲模式"
    INDIO_BUFFER_SOFTWARE: "软件缓冲模式"
    INDIO_BUFFER_HARDWARE: "硬件缓冲模式"


# ============================================================
# IIO_INFO STRUCTURE - 核心回调
# ============================================================

iio_info:
  description: "IIO Info - IIO 设备操作回调"
  header: "linux/iio/iio.h"

  structure:
    pattern: 'static const struct iio_info\s+(?P<name>\w+)\s*=\s*\{'
    description: "IIO 信息结构体定义"

  callbacks:
    read_raw:
      pattern: '\.read_raw\s*=\s*(?P<handler>\w+)'
      description: "读取通道原始值"
      trigger: "sysfs 读取或用户空间请求"
      context: "process"
      can_sleep: true
      signature: |
        int (*)(struct iio_dev *indio_dev,
                struct iio_chan_spec const *chan,
                int *val, int *val2, long mask)
      return_value:
        IIO_VAL_INT: "整数值，使用 *val"
        IIO_VAL_INT_PLUS_MICRO: "val + val2/1000000"
        IIO_VAL_INT_PLUS_NANO: "val + val2/1000000000"
        IIO_VAL_FRACTIONAL: "val/val2"
        IIO_VAL_FRACTIONAL_LOG2: "val >> val2"
        negative: "-ERRNO"
      typical_actions:
        - "从硬件读取传感器数据"
        - "根据 mask 返回不同类型的值"

    read_raw_multi:
      pattern: '\.read_raw_multi\s*=\s*(?P<handler>\w+)'
      description: "批量读取通道值"
      context: "process"
      can_sleep: true
      signature: |
        int (*)(struct iio_dev *indio_dev,
                struct iio_chan_spec const *chan,
                int max_len, int *vals, int *val_len, long mask)

    read_avail:
      pattern: '\.read_avail\s*=\s*(?P<handler>\w+)'
      description: "读取可用值列表 (用于 _available sysfs)"
      context: "process"
      signature: |
        int (*)(struct iio_dev *indio_dev,
                struct iio_chan_spec const *chan,
                const int **vals, int *type, int *length, long mask)

    write_raw:
      pattern: '\.write_raw\s*=\s*(?P<handler>\w+)'
      description: "写入通道配置"
      trigger: "sysfs 写入"
      context: "process"
      can_sleep: true
      signature: |
        int (*)(struct iio_dev *indio_dev,
                struct iio_chan_spec const *chan,
                int val, int val2, long mask)
      typical_actions:
        - "设置采样率"
        - "设置增益/比例"
        - "配置硬件参数"

    write_raw_get_fmt:
      pattern: '\.write_raw_get_fmt\s*=\s*(?P<handler>\w+)'
      description: "获取写入值的格式"
      context: "process"
      signature: |
        int (*)(struct iio_dev *indio_dev,
                struct iio_chan_spec const *chan, long mask)

    read_event_config:
      pattern: '\.read_event_config\s*=\s*(?P<handler>\w+)'
      description: "读取事件配置"
      context: "process"
      signature: |
        int (*)(struct iio_dev *indio_dev,
                const struct iio_chan_spec *chan,
                enum iio_event_type type,
                enum iio_event_direction dir)

    write_event_config:
      pattern: '\.write_event_config\s*=\s*(?P<handler>\w+)'
      description: "写入事件配置"
      context: "process"
      signature: |
        int (*)(struct iio_dev *indio_dev,
                const struct iio_chan_spec *chan,
                enum iio_event_type type,
                enum iio_event_direction dir, int state)

    read_event_value:
      pattern: '\.read_event_value\s*=\s*(?P<handler>\w+)'
      description: "读取事件阈值"
      context: "process"

    write_event_value:
      pattern: '\.write_event_value\s*=\s*(?P<handler>\w+)'
      description: "写入事件阈值"
      context: "process"

    validate_trigger:
      pattern: '\.validate_trigger\s*=\s*(?P<handler>\w+)'
      description: "验证触发器"
      context: "process"
      signature: |
        int (*)(struct iio_dev *indio_dev, struct iio_trigger *trig)

    update_scan_mode:
      pattern: '\.update_scan_mode\s*=\s*(?P<handler>\w+)'
      description: "更新扫描模式"
      trigger: "缓冲使能前"
      context: "process"

    debugfs_reg_access:
      pattern: '\.debugfs_reg_access\s*=\s*(?P<handler>\w+)'
      description: "debugfs 寄存器访问"
      context: "process"
      signature: |
        int (*)(struct iio_dev *indio_dev,
                unsigned reg, unsigned writeval,
                unsigned *readval)


# ============================================================
# IIO_CHAN_SPEC - 通道定义
# ============================================================

iio_chan_spec:
  description: "IIO Channel Specification - IIO 通道定义"
  header: "linux/iio/iio.h"

  structure:
    pattern: 'static const struct iio_chan_spec\s+(?P<name>\w+)\[\]'
    description: "IIO 通道规格数组"
    fields:
      - name: "type"
        type: "enum iio_chan_type"
        description: "通道类型 (IIO_VOLTAGE, IIO_ACCEL, etc.)"
      - name: "channel"
        type: "int"
        description: "通道索引"
      - name: "channel2"
        type: "int"
        description: "差分通道的第二个索引，或修饰符 (X, Y, Z)"
      - name: "address"
        type: "unsigned long"
        description: "驱动私有地址 (如寄存器地址)"
      - name: "scan_index"
        type: "int"
        description: "缓冲区中的位置 (-1 表示不参与扫描)"
      - name: "scan_type"
        type: "struct {...}"
        description: "扫描类型定义"
      - name: "info_mask_separate"
        type: "long"
        description: "独立属性掩码"
      - name: "info_mask_shared_by_type"
        type: "long"
        description: "同类型共享属性掩码"
      - name: "info_mask_shared_by_dir"
        type: "long"
        description: "同方向共享属性掩码"
      - name: "info_mask_shared_by_all"
        type: "long"
        description: "全局共享属性掩码"
      - name: "modified"
        type: "unsigned:1"
        description: "是否使用修饰符 (X, Y, Z)"
      - name: "indexed"
        type: "unsigned:1"
        description: "是否使用索引"
      - name: "output"
        type: "unsigned:1"
        description: "是否为输出通道"
      - name: "differential"
        type: "unsigned:1"
        description: "是否为差分通道"

  scan_type_fields:
    - name: "sign"
      type: "char"
      description: "'s' 有符号, 'u' 无符号"
    - name: "realbits"
      type: "u8"
      description: "有效数据位数"
    - name: "storagebits"
      type: "u8"
      description: "存储位数 (含填充)"
    - name: "shift"
      type: "u8"
      description: "数据在存储中的位移"
    - name: "repeat"
      type: "u8"
      description: "重复次数 (0=1次)"
    - name: "endianness"
      type: "enum iio_endian"
      description: "字节序"

  channel_types:
    IIO_VOLTAGE: "电压"
    IIO_CURRENT: "电流"
    IIO_POWER: "功率"
    IIO_ACCEL: "加速度"
    IIO_ANGL_VEL: "角速度 (陀螺仪)"
    IIO_MAGN: "磁场强度"
    IIO_LIGHT: "光照强度"
    IIO_INTENSITY: "强度"
    IIO_PROXIMITY: "接近度"
    IIO_TEMP: "温度"
    IIO_INCLI: "倾角"
    IIO_ROT: "旋转"
    IIO_ANGL: "角度"
    IIO_TIMESTAMP: "时间戳"
    IIO_CAPACITANCE: "电容"
    IIO_ALTVOLTAGE: "交流电压"
    IIO_PRESSURE: "压力"
    IIO_HUMIDITYRELATIVE: "相对湿度"
    IIO_STEPS: "步数"
    IIO_DISTANCE: "距离"

  info_masks:
    IIO_CHAN_INFO_RAW: "原始值"
    IIO_CHAN_INFO_PROCESSED: "处理后的值"
    IIO_CHAN_INFO_SCALE: "比例因子"
    IIO_CHAN_INFO_OFFSET: "偏移量"
    IIO_CHAN_INFO_CALIBSCALE: "校准比例"
    IIO_CHAN_INFO_CALIBBIAS: "校准偏置"
    IIO_CHAN_INFO_PEAK: "峰值"
    IIO_CHAN_INFO_PEAK_SCALE: "峰值比例"
    IIO_CHAN_INFO_SAMP_FREQ: "采样频率"
    IIO_CHAN_INFO_FREQUENCY: "频率"
    IIO_CHAN_INFO_AVERAGE_RAW: "平均原始值"
    IIO_CHAN_INFO_OVERSAMPLING_RATIO: "过采样率"

  modifiers:
    IIO_MOD_X: "X 轴"
    IIO_MOD_Y: "Y 轴"
    IIO_MOD_Z: "Z 轴"
    IIO_MOD_LIGHT_RED: "红光"
    IIO_MOD_LIGHT_GREEN: "绿光"
    IIO_MOD_LIGHT_BLUE: "蓝光"
    IIO_MOD_LIGHT_IR: "红外光"


# ============================================================
# IIO BUFFER
# ============================================================

iio_buffer:
  description: "IIO Buffer - IIO 数据缓冲区"
  header: "linux/iio/buffer.h"

  overview: |
    IIO 缓冲区用于连续数据采集，支持:
    - kfifo 缓冲区 (软件)
    - DMA 缓冲区 (硬件)
    - 触发器驱动的采样

  bind_patterns:
    - pattern: 'iio_triggered_buffer_setup\s*\(\s*(?P<indio_dev>[^,]+)\s*,'
      description: "设置触发缓冲区 (简化版)"
      context: "process"

    - pattern: 'iio_triggered_buffer_setup_ext\s*\(\s*(?P<indio_dev>[^,]+)\s*,'
      description: "设置触发缓冲区 (扩展版)"
      context: "process"

    - pattern: 'devm_iio_triggered_buffer_setup\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<indio_dev>[^,]+)\s*,'
      description: "设置触发缓冲区 (资源管理版)"
      context: "process"

    - pattern: 'iio_triggered_buffer_cleanup\s*\(\s*(?P<indio_dev>[^)]+)\s*\)'
      description: "清理触发缓冲区"
      context: "process"

    - pattern: 'iio_push_to_buffers_with_timestamp\s*\(\s*(?P<indio_dev>[^,]+)\s*,\s*(?P<data>[^,]+)\s*,\s*(?P<timestamp>[^)]+)\s*\)'
      description: "推送数据到缓冲区 (带时间戳)"
      context: "any"

    - pattern: 'iio_push_to_buffers\s*\(\s*(?P<indio_dev>[^,]+)\s*,\s*(?P<data>[^)]+)\s*\)'
      description: "推送数据到缓冲区"
      context: "any"

  buffer_setup_ops:
    description: "缓冲区设置操作"
    structure:
      pattern: 'static const struct iio_buffer_setup_ops\s+(?P<name>\w+)'
      description: "缓冲区设置操作结构体"

    callbacks:
      preenable:
        pattern: '\.preenable\s*=\s*(?P<handler>\w+)'
        description: "缓冲区使能前回调"
        trigger: "用户使能缓冲区前"
        context: "process"
        can_sleep: true
        signature: "int (*)(struct iio_dev *)"
        typical_actions:
          - "配置硬件采样模式"
          - "设置 DMA"

      postenable:
        pattern: '\.postenable\s*=\s*(?P<handler>\w+)'
        description: "缓冲区使能后回调"
        trigger: "缓冲区使能后"
        context: "process"
        can_sleep: true
        signature: "int (*)(struct iio_dev *)"
        typical_actions:
          - "启动采样"
          - "使能触发器"

      predisable:
        pattern: '\.predisable\s*=\s*(?P<handler>\w+)'
        description: "缓冲区禁用前回调"
        trigger: "用户禁用缓冲区前"
        context: "process"
        can_sleep: true
        typical_actions:
          - "停止采样"
          - "禁用触发器"

      postdisable:
        pattern: '\.postdisable\s*=\s*(?P<handler>\w+)'
        description: "缓冲区禁用后回调"
        trigger: "缓冲区禁用后"
        context: "process"
        can_sleep: true
        typical_actions:
          - "清理 DMA"
          - "关闭硬件采样"

      validate_scan_mask:
        pattern: '\.validate_scan_mask\s*=\s*(?P<handler>\w+)'
        description: "验证扫描掩码"
        context: "process"
        signature: "bool (*)(struct iio_dev *, const unsigned long *)"


# ============================================================
# IIO TRIGGER
# ============================================================

iio_trigger:
  description: "IIO Trigger - IIO 触发器"
  header: "linux/iio/trigger.h"

  overview: |
    触发器控制数据采集的时机:
    - 硬件触发 (中断、定时器)
    - 软件触发 (sysfs)
    - 数据就绪触发

  bind_patterns:
    - pattern: 'iio_trigger_alloc\s*\(\s*(?P<parent>[^,]+)\s*,\s*(?P<fmt>[^)]+)\s*\)'
      description: "分配触发器"
      context: "process"

    - pattern: 'devm_iio_trigger_alloc\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<fmt>[^)]+)\s*\)'
      description: "分配触发器 (资源管理版)"
      context: "process"

    - pattern: 'iio_trigger_free\s*\(\s*(?P<trig>[^)]+)\s*\)'
      description: "释放触发器"
      context: "process"

    - pattern: 'iio_trigger_register\s*\(\s*(?P<trig>[^)]+)\s*\)'
      description: "注册触发器"
      context: "process"

    - pattern: 'devm_iio_trigger_register\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<trig>[^)]+)\s*\)'
      description: "注册触发器 (资源管理版)"
      context: "process"

    - pattern: 'iio_trigger_unregister\s*\(\s*(?P<trig>[^)]+)\s*\)'
      description: "注销触发器"
      context: "process"

    - pattern: 'iio_trigger_poll\s*\(\s*(?P<trig>[^)]+)\s*\)'
      description: "触发采样"
      context: "any (including hardirq)"

    - pattern: 'iio_trigger_poll_chained\s*\(\s*(?P<trig>[^)]+)\s*\)'
      description: "链式触发采样"
      context: "hardirq"

  trigger_ops:
    description: "触发器操作"
    structure:
      pattern: 'static const struct iio_trigger_ops\s+(?P<name>\w+)'
      description: "触发器操作结构体"

    callbacks:
      set_trigger_state:
        pattern: '\.set_trigger_state\s*=\s*(?P<handler>\w+)'
        description: "设置触发器状态 (使能/禁用)"
        trigger: "触发器绑定到设备时"
        context: "process"
        can_sleep: true
        signature: "int (*)(struct iio_trigger *trig, bool state)"
        typical_actions:
          - "使能/禁用硬件中断"
          - "启动/停止定时器"

      try_reenable:
        pattern: '\.try_reenable\s*=\s*(?P<handler>\w+)'
        description: "尝试重新使能触发器"
        context: "process"
        signature: "int (*)(struct iio_trigger *trig)"
        notes: "处理所有消费者后调用"

      validate_device:
        pattern: '\.validate_device\s*=\s*(?P<handler>\w+)'
        description: "验证设备是否可使用此触发器"
        context: "process"
        signature: "int (*)(struct iio_trigger *trig, struct iio_dev *indio_dev)"


# ============================================================
# IIO EVENT
# ============================================================

iio_event:
  description: "IIO Event - IIO 事件"
  header: "linux/iio/events.h"

  overview: |
    IIO 事件用于通知用户空间发生了特定条件:
    - 阈值超限
    - 数据就绪
    - 周期性事件

  bind_patterns:
    - pattern: 'iio_push_event\s*\(\s*(?P<indio_dev>[^,]+)\s*,\s*(?P<event_code>[^,]+)\s*,\s*(?P<timestamp>[^)]+)\s*\)'
      description: "推送事件到用户空间"
      context: "any"

    - pattern: 'IIO_EVENT_CODE\s*\(\s*(?P<chan_type>[^,]+)\s*,\s*(?P<diff>[^,]+)\s*,\s*(?P<modifier>[^,]+)\s*,\s*(?P<direction>[^,]+)\s*,\s*(?P<type>[^,]+)\s*,\s*(?P<chan>[^,]+)\s*,\s*(?P<chan1>[^,]+)\s*,\s*(?P<chan2>[^)]+)\s*\)'
      description: "生成事件代码"

    - pattern: 'IIO_UNMOD_EVENT_CODE\s*\('
      description: "生成无修饰符的事件代码"

    - pattern: 'IIO_MOD_EVENT_CODE\s*\('
      description: "生成带修饰符的事件代码"

  event_types:
    IIO_EV_TYPE_THRESH: "阈值事件"
    IIO_EV_TYPE_MAG: "幅度事件"
    IIO_EV_TYPE_ROC: "变化率事件"
    IIO_EV_TYPE_THRESH_ADAPTIVE: "自适应阈值"
    IIO_EV_TYPE_MAG_ADAPTIVE: "自适应幅度"

  event_directions:
    IIO_EV_DIR_EITHER: "双向"
    IIO_EV_DIR_RISING: "上升"
    IIO_EV_DIR_FALLING: "下降"


# ============================================================
# CALL CHAINS
# ============================================================

call_chains:
  iio_read_channel:
    description: "用户空间读取 IIO 通道"
    trigger: "读取 sysfs 属性 (如 in_voltage0_raw)"
    chain:
      - function: "iio_read_channel_info"
        file: "drivers/iio/industrialio-core.c"
        description: "sysfs 读取入口"
        context: "process"
      - function: "iio_read_channel_info_type"
        file: "drivers/iio/industrialio-core.c"
        description: "确定读取类型"
      - function: "indio_dev->info->read_raw"
        file: "用户代码"
        description: "驱动 read_raw 回调"
        is_user_entry: true

  iio_triggered_read:
    description: "触发器驱动的数据采集"
    trigger: "触发器触发 (中断、定时器等)"
    chain:
      - function: "iio_trigger_poll"
        file: "drivers/iio/industrialio-trigger.c"
        description: "触发器触发"
        context: "hardirq or softirq"

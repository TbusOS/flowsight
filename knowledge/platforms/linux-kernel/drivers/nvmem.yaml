# Linux Kernel NVMEM (Non-Volatile Memory) Driver Framework Knowledge Base
#
# Reference: https://www.kernel.org/doc/html/latest/driver-api/nvmem.html

# ============================================================
# NVMEM CORE
# ============================================================

nvmem_core:
  description: "NVMEM Core - 非易失性存储核心"
  header: "linux/nvmem.h"
  icon: "💾"
  kernel_version: "4.2+"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  bind_patterns:
    # nvmem_register - 注册 NVMEM
    - pattern: 'nvmem_register\s*\(\s*(?P<config>[^)]+)\s*\)'
      variable_capture: "config"
      description: "注册 NVMEM 设备"

    # nvmem_unregister - 注销 NVMEM
    - pattern: 'nvmem_unregister\s*\(\s*(?P<nvmem>[^)]+)\s*\)'
      variable_capture: "nvmem"
      description: "注销 NVMEM 设备"

    # devm_nvmem_register - 资源管理注册
    - pattern: 'devm_nvmem_register\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<config>[^)]+)\s*\)'
      variable_capture: "dev"
      description: "资源管理方式注册 NVMEM"


# ============================================================
# NVMEM CELL
# ============================================================

nvmem_cell:
  description: "NVMEM Cell - NVMEM 单元"
  header: "linux/nvmem.h"

  bind_patterns:
    # nvmem_cell_get - 获取 NVMEM 单元
    - pattern: 'nvmem_cell_get\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<name>[^)]+)\s*\)'
      variable_capture: "dev"
      description: "获取 NVMEM 单元"

    # nvmem_cell_put - 释放 NVMEM 单元
    - pattern: 'nvmem_cell_put\s*\(\s*(?P<cell>[^)]+)\s*\)'
      variable_capture: "cell"
      description: "释放 NVMEM 单元"

    # nvmem_cell_read - 读取 NVMEM 单元
    - pattern: 'nvmem_cell_read\s*\(\s*(?P<cell>[^)]+)\s*,\s*(?P<len>[^)]+)\s*\)'
      variable_capture: "cell"
      description: "读取 NVMEM 单元数据"

    # nvmem_cell_write - 写入 NVMEM 单元
    - pattern: 'nvmem_cell_write\s*\(\s*(?P<cell>[^)]+)\s*,\s*(?P<buf>[^)]+)\s*,\s*(?P<len>\w+)\s*\)'
      variable_capture: "cell"
      description: "写入 NVMEM 单元数据"


# ============================================================
# NVMEM DEVICE
# ============================================================

nvmem_device:
  description: "NVMEM Device - NVMEM 设备"
  header: "linux/nvmem.h"

  bind_patterns:
    # nvmem_device_find - 查找 NVMEM 设备
    - pattern: 'nvmem_device_find\s*\(\s*(?P<data>[^)]+)\s*,\s*(?P<match>\w+)\s*\)'
      variable_capture: "data"
      description: "查找 NVMEM 设备"

    # nvmem_device_get - 获取 NVMEM 设备
    - pattern: 'nvmem_device_get\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<name>[^)]+)\s*\)'
      variable_capture: "dev"
      description: "获取 NVMEM 设备"

    # nvmem_device_put - 释放 NVMEM 设备
    - pattern: 'nvmem_device_put\s*\(\s*(?P<nvmem>[^)]+)\s*\)'
      variable_capture: "nvmem"
      description: "释放 NVMEM 设备"


# ============================================================
# NVMEM LAYOUT
# ============================================================

nvmem_layout:
  description: "NVMEM Layout - NVMEM 布局"
  header: "linux/nvmem-provider.h"

  bind_patterns:
    # struct nvmem_layout
    - pattern: 'struct nvmem_layout\s*\{[^}]+\}'
      description: "NVMEM 布局结构"

  callbacks:
    probe:
      pattern: '\.probe\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "Probe 回调"

    remove:
      pattern: '\.remove\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "Remove 回调"


# ============================================================
# NVMEM CELL INFO
# ============================================================

nvmem_cell_info:
  description: "NVMEM Cell Info - NVMEM 单元信息"
  header: "linux/nvmem-provider.h"

  bind_patterns:
    # struct nvmem_cell_info
    - pattern: 'struct nvmem_cell_info\s*\{[^}]+\}'
      description: "NVMEM 单元信息结构"

    # nvmem_add_cell_otp - 添加 OTP 单元
    - pattern: 'nvmem_add_cell_otp\s*\(\s*(?P<nvmem>[^)]+)\s*,\s*(?P<info>[^)]+)\s*\)'
      variable_capture: "nvmem"
      description: "添加 OTP 单元"


# ============================================================
# NVMEM DEVICE TABLE
# ============================================================

nvmem_device_id:
  description: "NVMEM Device ID Table"
  header: "linux/mod_devicetable.h"

  bind_patterns:
    # NVMEM ID 表格定义
    - pattern: 'static struct nvmem_device_id\s+(?P<name>\w+)\s*\[\]\s*=\s*\{'
      variable_capture: "name"
      description: "NVMEM 设备 ID 表"


# ============================================================
# DATA STRUCTURES
# ============================================================

data_structures:
  nvmem_device:
    pattern: 'struct nvmem_device\s*\{'
    description: "NVMEM 设备结构"
    file: "include/linux/nvmem-provider.h"
    fields:
      - name: "name"
        type: "const char *"
        description: "设备名称"
      - name: "id"
        type: "int"
        description: "设备 ID"
      - name: "dev"
        type: "struct device"
        description: "内嵌设备"
      - name: "stride"
        type: "unsigned int"
        description: "最小访问粒度"
      - name: "word_size"
        type: "unsigned int"
        description: "字大小"
      - name: "size"
        type: "size_t"
        description: "总大小"
      - name: "read_only"
        type: "bool"
        description: "是否只读"
      - name: "cells"
        type: "struct list_head"
        description: "单元列表"

  nvmem_config:
    pattern: 'struct nvmem_config\s*\{'
    description: "NVMEM 配置结构"
    file: "include/linux/nvmem-provider.h"
    fields:
      - name: "dev"
        type: "struct device *"
        description: "父设备"
      - name: "name"
        type: "const char *"
        description: "设备名称"
      - name: "id"
        type: "int"
        description: "设备 ID"
      - name: "owner"
        type: "struct module *"
        description: "所属模块"
      - name: "cells"
        type: "const struct nvmem_cell_info *"
        description: "单元信息"
      - name: "ncells"
        type: "int"
        description: "单元数量"
      - name: "type"
        type: "enum nvmem_type"
        description: "NVMEM 类型"
      - name: "read_only"
        type: "bool"
        description: "是否只读"
      - name: "size"
        type: "size_t"
        description: "设备大小"
      - name: "reg_read"
        type: "callback"
        description: "读取回调"
      - name: "reg_write"
        type: "callback"
        description: "写入回调"
      - name: "priv"
        type: "void *"
        description: "私有数据"


# ============================================================
# CALL CHAINS
# ============================================================

call_chains:
  nvmem_register:
    description: "NVMEM 设备注册流程"
    chain:
      - caller: "driver probe"
        callee: "nvmem_register / devm_nvmem_register"
        description: "注册 NVMEM 设备"
      - caller: "nvmem_register"
        callee: "device_register"
        description: "注册到设备模型"
      - caller: "nvmem_register"
        callee: "nvmem_add_cells"
        description: "添加 NVMEM 单元"

  nvmem_cell_read:
    description: "NVMEM 单元读取流程"
    chain:
      - caller: "consumer driver"
        callee: "nvmem_cell_get"
        description: "获取 NVMEM 单元"
      - caller: "consumer driver"
        callee: "nvmem_cell_read"
        description: "读取单元数据"
      - caller: "nvmem_cell_read"
        callee: "nvmem->reg_read"
        description: "调用底层读取"


# ============================================================
# HELPER FUNCTIONS
# ============================================================

helpers:
  - pattern: 'nvmem_device_read\s*\(\s*(?P<nvmem>\w+)\s*,\s*(?P<offset>\w+)\s*,\s*(?P<bytes>\w+)\s*,\s*(?P<buf>\w+)\s*\)'
    variable_capture: "nvmem"
    description: "从 NVMEM 设备读取数据"
    context: "process"
    can_sleep: true

  - pattern: 'nvmem_device_write\s*\(\s*(?P<nvmem>\w+)\s*,\s*(?P<offset>\w+)\s*,\s*(?P<bytes>\w+)\s*,\s*(?P<buf>\w+)\s*\)'
    variable_capture: "nvmem"
    description: "向 NVMEM 设备写入数据"
    context: "process"
    can_sleep: true

  - pattern: 'of_nvmem_cell_get\s*\(\s*(?P<np>\w+)\s*,\s*(?P<id>[^)]+)\s*\)'
    variable_capture: "np"
    description: "从设备树获取 NVMEM 单元"


# ============================================================
# NVMEM EXAMPLES
# ============================================================

examples:
  - description: "NVMEM Provider 驱动示例（完整）"
    kernel_version: "5.0+"
    code: |
      #include <linux/module.h>
      #include <linux/nvmem-provider.h>
      #include <linux/platform_device.h>
      #include <linux/i2c.h>
      
      #define EEPROM_SIZE  256
      
      struct my_eeprom {
          struct i2c_client *client;
          struct nvmem_device *nvmem;
          struct mutex lock;
      };
      
      static int my_eeprom_read(void *priv, unsigned int off,
                                 void *val, size_t count)
      {
          struct my_eeprom *eeprom = priv;
          int ret;
          
          mutex_lock(&eeprom->lock);
          
          ret = i2c_smbus_read_i2c_block_data(eeprom->client,
                                               off, count, val);
          
          mutex_unlock(&eeprom->lock);
          
          return ret < 0 ? ret : 0;
      }
      
      static int my_eeprom_write(void *priv, unsigned int off,
                                  void *val, size_t count)
      {
          struct my_eeprom *eeprom = priv;
          int ret;
          
          mutex_lock(&eeprom->lock);
          
          ret = i2c_smbus_write_i2c_block_data(eeprom->client,
                                                off, count, val);
          
          /* EEPROM 写入需要等待 */
          if (ret == 0)
              msleep(10);
          
          mutex_unlock(&eeprom->lock);
          
          return ret;
      }
      
      static const struct nvmem_cell_info my_cells[] = {
          { .name = "mac-address", .offset = 0, .bytes = 6 },
          { .name = "serial-number", .offset = 6, .bytes = 16 },
          { .name = "board-revision", .offset = 22, .bytes = 2 },
      };
      
      static int my_eeprom_probe(struct i2c_client *client)
      {
          struct my_eeprom *eeprom;
          struct nvmem_config config = {};
          
          eeprom = devm_kzalloc(&client->dev, sizeof(*eeprom),
                                 GFP_KERNEL);
          if (!eeprom)
              return -ENOMEM;
          
          eeprom->client = client;
          mutex_init(&eeprom->lock);
          
          config.dev = &client->dev;
          config.name = "my-eeprom";
          config.id = NVMEM_DEVID_NONE;
          config.owner = THIS_MODULE;
          config.type = NVMEM_TYPE_EEPROM;
          config.read_only = false;
          config.root_only = false;
          config.size = EEPROM_SIZE;
          config.stride = 1;
          config.word_size = 1;
          config.reg_read = my_eeprom_read;
          config.reg_write = my_eeprom_write;
          config.cells = my_cells;
          config.ncells = ARRAY_SIZE(my_cells);
          config.priv = eeprom;
          
          eeprom->nvmem = devm_nvmem_register(&client->dev, &config);
          if (IS_ERR(eeprom->nvmem))
              return PTR_ERR(eeprom->nvmem);
          
          i2c_set_clientdata(client, eeprom);
          
          dev_info(&client->dev, "EEPROM registered (%d bytes)\n",
                   EEPROM_SIZE);
          return 0;
      }
      
      static const struct i2c_device_id my_eeprom_id[] = {
          { "my-eeprom", 0 },
          { }
      };
      MODULE_DEVICE_TABLE(i2c, my_eeprom_id);
      
      static struct i2c_driver my_eeprom_driver = {
          .driver = {
              .name = "my-eeprom",
          },
          .probe    = my_eeprom_probe,
          .id_table = my_eeprom_id,
      };
      module_i2c_driver(my_eeprom_driver);

  - description: "NVMEM Consumer 使用示例"
    kernel_version: "5.0+"
    code: |
      #include <linux/nvmem-consumer.h>
      
      static int my_driver_probe(struct platform_device *pdev)
      {
          struct nvmem_cell *cell;
          size_t len;
          u8 *mac;
          
          /* 获取 MAC 地址单元 */
          cell = nvmem_cell_get(&pdev->dev, "mac-address");
          if (IS_ERR(cell))
              return PTR_ERR(cell);
          
          /* 读取 MAC 地址 */
          mac = nvmem_cell_read(cell, &len);
          nvmem_cell_put(cell);
          
          if (IS_ERR(mac))
              return PTR_ERR(mac);
          
          if (len != 6) {
              kfree(mac);
              return -EINVAL;
          }
          
          /* 使用 MAC 地址 */
          dev_info(&pdev->dev, "MAC: %pM\n", mac);
          
          kfree(mac);
          return 0;
      }

  - description: "OTP (One-Time Programmable) 驱动示例"
    kernel_version: "5.10+"
    code: |
      #include <linux/module.h>
      #include <linux/nvmem-provider.h>
      #include <linux/platform_device.h>
      #include <linux/io.h>
      
      #define OTP_SIZE        256
      #define OTP_WORD_SIZE   4
      #define OTP_LOCK_BIT    BIT(31)
      
      struct my_otp {
          void __iomem *base;
          struct nvmem_device *nvmem;
          struct mutex lock;
          u32 shadow[OTP_SIZE / OTP_WORD_SIZE];
          bool programmed;
      };
      
      /* OTP 只能读取，不能写入（已烧录） */
      static int my_otp_read(void *priv, unsigned int offset,
                              void *val, size_t bytes)
      {
          struct my_otp *otp = priv;
          u32 *buf = val;
          int i, word_offset;
          
          if (offset % OTP_WORD_SIZE || bytes % OTP_WORD_SIZE)
              return -EINVAL;
          
          mutex_lock(&otp->lock);
          
          word_offset = offset / OTP_WORD_SIZE;
          for (i = 0; i < bytes / OTP_WORD_SIZE; i++) {
              /* 从影子寄存器读取（OTP 内容在启动时加载） */
              buf[i] = otp->shadow[word_offset + i];
          }
          
          mutex_unlock(&otp->lock);
          return 0;
      }
      
      /* OTP 烧录（不可逆操作） */
      static int my_otp_write(void *priv, unsigned int offset,
                               void *val, size_t bytes)
      {
          struct my_otp *otp = priv;
          u32 *buf = val;
          int i, word_offset;
          u32 status;
          
          if (offset % OTP_WORD_SIZE || bytes % OTP_WORD_SIZE)
              return -EINVAL;
          
          mutex_lock(&otp->lock);
          
          word_offset = offset / OTP_WORD_SIZE;
          for (i = 0; i < bytes / OTP_WORD_SIZE; i++) {
              /* 检查是否已锁定 */
              if (otp->shadow[word_offset + i] & OTP_LOCK_BIT) {
                  mutex_unlock(&otp->lock);
                  return -EPERM;
              }
              
              /* 启动烧录序列 */
              writel(OTP_PROG_ENABLE, otp->base + OTP_CTRL);
              writel(word_offset + i, otp->base + OTP_ADDR);
              writel(buf[i], otp->base + OTP_DATA);
              writel(OTP_PROG_START, otp->base + OTP_CTRL);
              
              /* 等待烧录完成 */
              do {
                  status = readl(otp->base + OTP_STATUS);
              } while (status & OTP_BUSY);
              
              if (status & OTP_ERROR) {
                  mutex_unlock(&otp->lock);
                  return -EIO;
              }
              
              /* 更新影子寄存器 */
              otp->shadow[word_offset + i] = buf[i];
          }
          
          mutex_unlock(&otp->lock);
          return 0;
      }
      
      /* OTP 单元定义 */
      static const struct nvmem_cell_info my_otp_cells[] = {
          { .name = "chip-id",      .offset = 0x00, .bytes = 8 },
          { .name = "security-key", .offset = 0x08, .bytes = 32 },
          { .name = "boot-config",  .offset = 0x28, .bytes = 4 },
          { .name = "mac-address0", .offset = 0x2C, .bytes = 6 },
          { .name = "mac-address1", .offset = 0x32, .bytes = 6 },
          { .name = "calibration",  .offset = 0x40, .bytes = 64 },
      };
      
      static int my_otp_probe(struct platform_device *pdev)
      {
          struct my_otp *otp;
          struct nvmem_config config = {};
          int i;
          
          otp = devm_kzalloc(&pdev->dev, sizeof(*otp), GFP_KERNEL);
          if (!otp)
              return -ENOMEM;
          
          otp->base = devm_platform_ioremap_resource(pdev, 0);
          if (IS_ERR(otp->base))
              return PTR_ERR(otp->base);
          
          mutex_init(&otp->lock);
          
          /* 启动时加载 OTP 内容到影子寄存器 */
          for (i = 0; i < OTP_SIZE / OTP_WORD_SIZE; i++)
              otp->shadow[i] = readl(otp->base + OTP_SHADOW(i));
          
          config.dev = &pdev->dev;
          config.name = "my-otp";
          config.id = NVMEM_DEVID_NONE;
          config.owner = THIS_MODULE;
          config.type = NVMEM_TYPE_OTP;
          config.read_only = false;  /* 允许烧录 */
          config.root_only = true;   /* 只有 root 可访问 */
          config.size = OTP_SIZE;
          config.stride = OTP_WORD_SIZE;
          config.word_size = OTP_WORD_SIZE;
          config.reg_read = my_otp_read;
          config.reg_write = my_otp_write;
          config.cells = my_otp_cells;
          config.ncells = ARRAY_SIZE(my_otp_cells);
          config.priv = otp;
          
          otp->nvmem = devm_nvmem_register(&pdev->dev, &config);
          if (IS_ERR(otp->nvmem))
              return PTR_ERR(otp->nvmem);
          
          platform_set_drvdata(pdev, otp);
          return 0;
      }

  - description: "NVMEM Layout 驱动示例"
    kernel_version: "5.15+"
    code: |
      #include <linux/module.h>
      #include <linux/nvmem-provider.h>
      #include <linux/of.h>
      
      /* 自定义布局：从二进制数据中解析结构化信息 */
      struct my_layout_header {
          u32 magic;
          u32 version;
          u32 data_offset;
          u32 data_size;
          u32 checksum;
      };
      
      #define MY_LAYOUT_MAGIC  0x4D594C54  /* "MYLT" */
      
      static int my_layout_add_cells(struct nvmem_device *nvmem,
                                      const struct nvmem_layout *layout)
      {
          struct device *dev = &nvmem->dev;
          struct my_layout_header header;
          struct nvmem_cell_info cell;
          u8 *data;
          size_t data_len;
          int ret;
          
          /* 读取头部 */
          ret = nvmem_device_read(nvmem, 0, sizeof(header), &header);
          if (ret < 0)
              return ret;
          
          /* 验证 magic */
          if (header.magic != MY_LAYOUT_MAGIC) {
              dev_err(dev, "Invalid layout magic: 0x%08x\n", header.magic);
              return -EINVAL;
          }
          
          /* 根据版本解析不同的布局 */
          switch (header.version) {
          case 1:
              /* V1 布局：固定偏移 */
              cell.name = "serial";
              cell.offset = 0x10;
              cell.bytes = 16;
              nvmem_add_one_cell(nvmem, &cell);
              
              cell.name = "mac-address";
              cell.offset = 0x20;
              cell.bytes = 6;
              nvmem_add_one_cell(nvmem, &cell);
              break;
              
          case 2:
              /* V2 布局：动态偏移 */
              cell.name = "serial";
              cell.offset = header.data_offset;
              cell.bytes = 16;
              nvmem_add_one_cell(nvmem, &cell);
              
              cell.name = "mac-address";
              cell.offset = header.data_offset + 16;
              cell.bytes = 6;
              nvmem_add_one_cell(nvmem, &cell);
              
              cell.name = "calibration";
              cell.offset = header.data_offset + 24;
              cell.bytes = header.data_size - 24;
              nvmem_add_one_cell(nvmem, &cell);
              break;
              
          default:
              dev_warn(dev, "Unknown layout version: %u\n", header.version);
              break;
          }
          
          return 0;
      }
      
      static int my_layout_probe(struct nvmem_layout *layout)
      {
          return my_layout_add_cells(layout->nvmem, layout);
      }
      
      static void my_layout_remove(struct nvmem_layout *layout)
      {
          /* 清理资源（如果有） */
      }
      
      static const struct of_device_id my_layout_of_match[] = {
          { .compatible = "my,nvmem-layout" },
          { }
      };
      MODULE_DEVICE_TABLE(of, my_layout_of_match);
      
      static struct nvmem_layout_driver my_layout_driver = {
          .driver = {
              .name = "my-nvmem-layout",
              .of_match_table = my_layout_of_match,
          },
          .probe = my_layout_probe,
          .remove = my_layout_remove,
      };
      module_nvmem_layout_driver(my_layout_driver);


# ============================================================
# ADVANCED DATA STRUCTURES
# ============================================================

advanced_data_structures:
  nvmem_cell:
    pattern: 'struct nvmem_cell\s*\{'
    description: "NVMEM 单元结构（内部）"
    file: "drivers/nvmem/core.c"
    fields:
      - name: "name"
        type: "const char *"
        description: "单元名称"
      - name: "offset"
        type: "unsigned int"
        description: "字节偏移"
      - name: "bytes"
        type: "unsigned int"
        description: "字节大小"
      - name: "bit_offset"
        type: "unsigned int"
        description: "位偏移"
      - name: "nbits"
        type: "unsigned int"
        description: "位数"
      - name: "np"
        type: "struct device_node *"
        description: "设备树节点"
      - name: "nvmem"
        type: "struct nvmem_device *"
        description: "所属 NVMEM 设备"
      - name: "node"
        type: "struct list_head"
        description: "链表节点"

  nvmem_cell_info:
    pattern: 'struct nvmem_cell_info\s*\{'
    description: "NVMEM 单元信息结构"
    file: "include/linux/nvmem-provider.h"
    fields:
      - name: "name"
        type: "const char *"
        description: "单元名称"
      - name: "offset"
        type: "unsigned int"
        description: "字节偏移"
      - name: "bytes"
        type: "unsigned int"
        description: "字节大小"
      - name: "bit_offset"
        type: "unsigned int"
        description: "位偏移（用于位域）"
      - name: "nbits"
        type: "unsigned int"
        description: "位数（0 表示整字节）"

  nvmem_layout:
    pattern: 'struct nvmem_layout\s*\{'
    description: "NVMEM 布局结构"
    file: "include/linux/nvmem-provider.h"
    fields:
      - name: "name"
        type: "const char *"
        description: "布局名称"
      - name: "of_match_table"
        type: "const struct of_device_id *"
        description: "设备树匹配表"
      - name: "add_cells"
        type: "int (*)(struct nvmem_device *, const struct nvmem_layout *)"
        description: "添加单元回调"
      - name: "nvmem"
        type: "struct nvmem_device *"
        description: "关联的 NVMEM 设备"

  nvmem_type:
    description: "NVMEM 类型枚举"
    file: "include/linux/nvmem-provider.h"
    values:
      - name: "NVMEM_TYPE_UNKNOWN"
        value: 0
        description: "未知类型"
      - name: "NVMEM_TYPE_EEPROM"
        value: 1
        description: "EEPROM"
      - name: "NVMEM_TYPE_OTP"
        value: 2
        description: "一次性可编程"
      - name: "NVMEM_TYPE_BATTERY_BACKED"
        value: 3
        description: "电池备份 RAM"
      - name: "NVMEM_TYPE_FRAM"
        value: 4
        description: "铁电 RAM"


# ============================================================
# ADVANCED CALL CHAINS
# ============================================================

advanced_call_chains:
  nvmem_layout_register:
    description: "NVMEM 布局注册流程"
    chain:
      - caller: "布局驱动"
        callee: "nvmem_layout_register"
        description: "注册布局驱动"
      - caller: "nvmem_register"
        callee: "nvmem_layout_get_match"
        description: "查找匹配的布局"
      - caller: "nvmem_layout_get_match"
        callee: "layout->add_cells"
        description: "调用布局添加单元"
      - caller: "add_cells"
        callee: "nvmem_add_one_cell"
        description: "添加单个单元"

  nvmem_cell_read_bits:
    description: "位域读取流程"
    chain:
      - caller: "consumer driver"
        callee: "nvmem_cell_get"
        description: "获取单元"
      - caller: "consumer driver"
        callee: "nvmem_cell_read"
        description: "读取单元"
      - caller: "nvmem_cell_read"
        callee: "__nvmem_cell_read"
        description: "内部读取"
      - caller: "__nvmem_cell_read"
        callee: "nvmem->reg_read"
        description: "读取原始数据"
      - caller: "__nvmem_cell_read"
        callee: "nvmem_shift_read_buffer_in_place"
        description: "位偏移处理"

  devm_nvmem_cell_get:
    description: "资源管理获取单元流程"
    chain:
      - caller: "consumer driver"
        callee: "devm_nvmem_cell_get"
        description: "资源管理获取"
      - caller: "devm_nvmem_cell_get"
        callee: "nvmem_cell_get"
        description: "获取单元"
      - caller: "devm_nvmem_cell_get"
        callee: "devm_add_action"
        description: "注册释放动作"
      - caller: "驱动卸载"
        callee: "devm_nvmem_cell_put"
        description: "自动释放"


# ============================================================
# SYSFS INTERFACE
# ============================================================

sysfs_interface:
  description: "NVMEM Sysfs 接口"
  
  device_attributes:
    - name: "/sys/bus/nvmem/devices/<name>/nvmem"
      description: "二进制访问接口"
      permissions: "根据 root_only 设置"
      operations: "read/write"
      
    - name: "/sys/bus/nvmem/devices/<name>/type"
      description: "NVMEM 类型"
      values: "EEPROM, OTP, Battery-backed, FRAM"
      
    - name: "/sys/bus/nvmem/devices/<name>/of_node"
      description: "设备树节点链接"
      
  usage_example: |
    # 读取 NVMEM 内容
    hexdump /sys/bus/nvmem/devices/my-eeprom/nvmem
    
    # 写入 NVMEM（如果允许）
    echo -n "data" | dd of=/sys/bus/nvmem/devices/my-eeprom/nvmem bs=1 seek=0
    
    # 查看类型
    cat /sys/bus/nvmem/devices/my-otp/type


# ============================================================
# DEVICE TREE BINDINGS
# ============================================================

device_tree_bindings:
  provider_example: |
    /* NVMEM Provider 设备树绑定 */
    eeprom@50 {
        compatible = "atmel,24c256";
        reg = <0x50>;
        
        /* NVMEM 属性 */
        #address-cells = <1>;
        #size-cells = <1>;
        
        /* 静态定义的单元 */
        mac_address: mac-address@0 {
            reg = <0x0 0x6>;
        };
        
        serial_number: serial@6 {
            reg = <0x6 0x10>;
        };
        
        calibration: calibration@20 {
            reg = <0x20 0x40>;
        };
    };

  consumer_example: |
    /* NVMEM Consumer 设备树绑定 */
    ethernet@12340000 {
        compatible = "vendor,ethernet";
        reg = <0x12340000 0x1000>;
        
        /* 引用 NVMEM 单元 */
        nvmem-cells = <&mac_address>;
        nvmem-cell-names = "mac-address";
    };

  layout_example: |
    /* NVMEM Layout 设备树绑定 */
    otp@1c3f0000 {
        compatible = "vendor,otp";
        reg = <0x1c3f0000 0x1000>;
        
        /* 使用自定义布局 */
        nvmem-layout {
            compatible = "my,nvmem-layout";
        };
    };



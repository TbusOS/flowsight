# ============================================================
# COMMON NVMEM TYPES
# ============================================================

common_nvmem_types:
  eeprom:
    description: "电可擦可编程只读存储器"
    characteristics:
      - "可擦写（有限次数，通常 10^6）"
      - "断电保持数据"
      - "字节/页面可写"
    common_chips:
      - "24Cxx 系列 (I2C)"
      - "93Cxx 系列 (SPI)"
      - "AT25xxx (SPI)"
    driver_files:
      - "drivers/misc/eeprom/at24.c"
      - "drivers/misc/eeprom/at25.c"

  otp:
    description: "一次性可编程存储器"
    characteristics:
      - "只能写入一次"
      - "常用于安全密钥、芯片 ID"
      - "熔丝或反熔丝技术"
    common_implementations:
      - "SoC 内置 eFuse"
      - "安全芯片 OTP"
    driver_files:
      - "drivers/nvmem/imx-ocotp.c"
      - "drivers/nvmem/rockchip-efuse.c"

  fram:
    description: "铁电随机存取存储器"
    characteristics:
      - "快速写入（无擦除延迟）"
      - "高耐久性（10^12+ 次）"
      - "断电保持"
    common_chips:
      - "FM24xxx (I2C)"
      - "FM25xxx (SPI)"


# ============================================================
# ERROR HANDLING
# ============================================================

error_handling:
  common_errors:
    ENOENT:
      description: "单元不存在"
      cause: "nvmem_cell_get() 找不到指定单元"
      fix: "检查设备树或静态单元定义"
      
    EPROBE_DEFER:
      description: "provider 尚未就绪"
      cause: "NVMEM provider 驱动未加载"
      fix: "检查驱动加载顺序"
      
    EINVAL:
      description: "无效参数"
      cause: "偏移/大小不满足 stride/word_size 要求"
      fix: "确保对齐要求"
      
    EPERM:
      description: "权限不足"
      cause: "尝试写入 read_only 设备或非 root 访问 root_only"
      fix: "检查权限配置"
      
    EIO:
      description: "I/O 错误"
      cause: "底层设备通信失败"
      fix: "检查硬件连接和设备状态"

  debugging_tips:
    - "检查 /sys/bus/nvmem/devices/ 确认设备注册"
    - "使用 dmesg | grep nvmem 查看内核消息"
    - "验证设备树节点正确性"
    - "确认 I2C/SPI 总线正常工作"

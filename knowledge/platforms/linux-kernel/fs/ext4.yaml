# ============================================================
# EXAMPLES
# ============================================================

examples:
  - description: "Ext4 extent 读取示例"
    kernel_version: "4.0+"
    code: |
      /* 查找 extent 并读取 */
      static int ext4_read_extent(struct inode *inode, ext4_lblk_t lblk)
      {
          struct ext4_ext_path *path = NULL;
          struct ext4_extent *ex;
          ext4_fsblk_t pblk;
          int depth;
          int err;

          /* 查找 extent */
          path = ext4_find_extent(inode, lblk, NULL, 0);
          if (IS_ERR(path))
              return PTR_ERR(path);

          depth = ext_depth(inode);
          ex = path[depth].p_ext;

          if (!ex) {
              /* 没有找到 extent，是空洞 */
              ext4_ext_drop_refs(path);
              kfree(path);
              return 0;
          }

          /* 获取物理块号 */
          pblk = ext4_ext_pblock(ex) + (lblk - le32_to_cpu(ex->ee_block));
          
          ext4_ext_drop_refs(path);
          kfree(path);
          
          return pblk;
      }

  - description: "Ext4 日志事务示例"
    kernel_version: "4.0+"
    code: |
      /* 在日志中修改元数据 */
      static int ext4_modify_metadata(struct inode *inode,
                                      struct buffer_head *bh)
      {
          handle_t *handle;
          int err;

          /* 开始事务，预留 2 个块 */
          handle = ext4_journal_start(inode, EXT4_HT_INODE, 2);
          if (IS_ERR(handle))
              return PTR_ERR(handle);

          /* 获取写访问权限 */
          err = ext4_journal_get_write_access(handle, bh);
          if (err)
              goto out;

          /* 修改数据 */
          /* ... 在 bh->b_data 中修改 ... */

          /* 标记脏 */
          err = ext4_handle_dirty_metadata(handle, inode, bh);

      out:
          ext4_journal_stop(handle);
          return err;
      }

  - description: "Ext4 块分配示例"
    kernel_version: "4.0+"
    code: |
      /* 分配新块 */
      static int ext4_alloc_block(struct inode *inode, 
                                  ext4_lblk_t lblk,
                                  ext4_fsblk_t *pblk)
      {
          struct ext4_map_blocks map;
          handle_t *handle;
          int ret;

          map.m_lblk = lblk;
          map.m_len = 1;
          map.m_flags = 0;

          handle = ext4_journal_start(inode, EXT4_HT_WRITE_PAGE, 
                                      EXT4_DATA_TRANS_BLOCKS(inode->i_sb));
          if (IS_ERR(handle))
              return PTR_ERR(handle);

          /* 分配块 */
          ret = ext4_map_blocks(handle, inode, &map, 
                                EXT4_GET_BLOCKS_CREATE);
          
          ext4_journal_stop(handle);
          
          if (ret > 0) {
              *pblk = map.m_pblk;
              return 0;
          }
          return ret;
      }

  - description: "Ext4 目录遍历示例"
    kernel_version: "4.0+"
    code: |
      /* 遍历目录条目 */
      static int ext4_iterate_dir(struct file *file, 
                                  struct dir_context *ctx)
      {
          struct inode *inode = file_inode(file);
          struct ext4_dir_entry_2 *de;
          struct buffer_head *bh = NULL;
          ext4_lblk_t block;
          unsigned int offset;
          int err = 0;

          while (ctx->pos < inode->i_size) {
              block = ctx->pos >> inode->i_blkbits;
              offset = ctx->pos & (inode->i_sb->s_blocksize - 1);

              bh = ext4_bread(NULL, inode, block, 0);
              if (IS_ERR(bh)) {
                  err = PTR_ERR(bh);
                  break;
              }
              if (!bh) {
                  ctx->pos += inode->i_sb->s_blocksize - offset;
                  continue;
              }

              de = (struct ext4_dir_entry_2 *)(bh->b_data + offset);
              
              while (offset < inode->i_sb->s_blocksize) {
                  if (de->inode) {
                      if (!dir_emit(ctx, de->name, de->name_len,
                                    le32_to_cpu(de->inode),
                                    get_dtype(de->file_type))) {
                          brelse(bh);
                          return 0;
                      }
                  }
                  ctx->pos += ext4_rec_len(de);
                  offset += ext4_rec_len(de);
                  de = (void *)de + ext4_rec_len(de);
              }
              brelse(bh);
          }
          return err;
      }

# ============================================================
# EXAMPLES (示例)
# ============================================================

examples:
  - description: "简单文件系统 file_operations"
    kernel_version: "4.0+"
    code: |
      static ssize_t myfs_read_iter(struct kiocb *iocb,
                                    struct iov_iter *to)
      {
          return generic_file_read_iter(iocb, to);
      }

      static ssize_t myfs_write_iter(struct kiocb *iocb,
                                     struct iov_iter *from)
      {
          return generic_file_write_iter(iocb, from);
      }

      static const struct file_operations myfs_file_operations = {
          .llseek         = generic_file_llseek,
          .read_iter      = myfs_read_iter,
          .write_iter     = myfs_write_iter,
          .mmap           = generic_file_mmap,
          .fsync          = generic_file_fsync,
          .splice_read    = generic_file_splice_read,
          .splice_write   = iter_file_splice_write,
      };

  - description: "文件系统挂载 (旧 API)"
    kernel_version: "2.6+"
    code: |
      static int myfs_fill_super(struct super_block *sb, void *data, int silent)
      {
          struct inode *root_inode;
          struct dentry *root;

          sb->s_magic = MYFS_MAGIC;
          sb->s_op = &myfs_super_operations;

          root_inode = myfs_make_inode(sb, S_IFDIR | 0755);
          if (!root_inode)
              return -ENOMEM;
          root_inode->i_op = &myfs_dir_inode_operations;
          root_inode->i_fop = &myfs_dir_operations;

          root = d_make_root(root_inode);
          if (!root)
              return -ENOMEM;
          sb->s_root = root;

          return 0;
      }

      static struct dentry *myfs_mount(struct file_system_type *fs_type,
                                       int flags, const char *dev_name, void *data)
      {
          return mount_nodev(fs_type, flags, data, myfs_fill_super);
      }

      static struct file_system_type myfs_fs_type = {
          .owner      = THIS_MODULE,
          .name       = "myfs",
          .mount      = myfs_mount,
          .kill_sb    = kill_litter_super,
      };

  - description: "文件系统挂载 (新 API, 4.16+)"
    kernel_version: "4.16+"
    code: |
      static int myfs_fill_super(struct super_block *sb,
                                 struct fs_context *fc)
      {
          struct myfs_context *ctx = fc->fs_private;
          struct inode *root_inode;

          sb->s_magic = MYFS_MAGIC;
          sb->s_op = &myfs_super_operations;
          sb->s_time_gran = 1;

          root_inode = myfs_make_inode(sb, S_IFDIR | 0755);
          if (!root_inode)
              return -ENOMEM;

          sb->s_root = d_make_root(root_inode);
          if (!sb->s_root)
              return -ENOMEM;

          return 0;
      }

      static int myfs_get_tree(struct fs_context *fc)
      {
          return get_tree_nodev(fc, myfs_fill_super);
      }

      static const struct fs_context_operations myfs_context_ops = {
          .free           = myfs_fc_free,
          .parse_param    = myfs_parse_param,
          .get_tree       = myfs_get_tree,
          .reconfigure    = myfs_reconfigure,
      };

      static int myfs_init_fs_context(struct fs_context *fc)
      {
          struct myfs_context *ctx;

          ctx = kzalloc(sizeof(*ctx), GFP_KERNEL);
          if (!ctx)
              return -ENOMEM;

          fc->fs_private = ctx;
          fc->ops = &myfs_context_ops;
          return 0;
      }

      static struct file_system_type myfs_fs_type = {
          .owner              = THIS_MODULE,
          .name               = "myfs",
          .init_fs_context    = myfs_init_fs_context,
          .kill_sb            = kill_litter_super,
      };

  - description: "dentry_operations 示例"
    kernel_version: "2.6+"
    code: |
      /* 网络文件系统的 dentry 验证 */
      static int nfs_d_revalidate(struct dentry *dentry, unsigned int flags)
      {
          struct inode *inode = d_inode(dentry);

          if (flags & LOOKUP_RCU)
              return -ECHILD;

          if (!inode)
              return 0;

          /* 检查是否过期 */
          if (time_after(jiffies, dentry->d_time + NFS_REVALIDATE_INTERVAL))
              return 0;

          return 1;
      }

      /* 大小写不敏感的比较 */
      static int ci_d_compare(const struct dentry *dentry,
                              unsigned int len, const char *str,
                              const struct qstr *name)
      {
          if (len != name->len)
              return 1;
          return strncasecmp(str, name->name, len);
      }

      static const struct dentry_operations myfs_dentry_ops = {
          .d_revalidate   = nfs_d_revalidate,
          .d_compare      = ci_d_compare,
      };

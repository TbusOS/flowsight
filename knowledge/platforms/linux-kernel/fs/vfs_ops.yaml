# VFS Operations Knowledge Base
# Reference: https://www.kernel.org/doc/html/latest/filesystems/vfs.html
# Kernel Version: 4.0+ (supports both old and new APIs)

# ============================================================
# MOUNT OPERATIONS (挂载详细)
# ============================================================

mount_operations:
  description: "Mount Operations - 文件系统挂载操作"
  header: "linux/fs.h"
  icon: "🗻"
  kernel_version: "2.6+"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  bind_patterns:
    # vfs_kern_mount
    - pattern: 'vfs_kern_mount\s*\(\s*(?P<type>[^,]+)\s*,\s*(?P<flags>[^,]+)\s*,\s*(?P<name>[^,]+)\s*,\s*(?P<data>[^)]+)\s*\)'
      variable_capture: "type"
      description: "内核挂载文件系统"

    # do_mount
    - pattern: 'do_mount\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<dir>[^,]+)\s*,\s*(?P<type>[^,]+)\s*,\s*(?P<flags>[^,]+)\s*,\s*(?P<data>[^)]+)\s*\)'
      variable_capture: "dev"
      description: "执行挂载操作"

    # mount_bdev
    - pattern: 'mount_bdev\s*\(\s*(?P<fs_type>[^,]+)\s*,\s*(?P<flags>[^,]+)\s*,\s*(?P<dev_name>[^,]+)\s*,\s*(?P<data>[^,]+)\s*,\s*(?P<fill_super>[^)]+)\s*\)'
      variable_capture: "fs_type"
      description: "挂载块设备文件系统"

    # mount_nodev
    - pattern: 'mount_nodev\s*\(\s*(?P<fs_type>[^,]+)\s*,\s*(?P<flags>[^,]+)\s*,\s*(?P<data>[^,]+)\s*,\s*(?P<fill_super>[^)]+)\s*\)'
      variable_capture: "fs_type"
      description: "挂载无设备文件系统"

    # mount_single
    - pattern: 'mount_single\s*\(\s*(?P<fs_type>[^,]+)\s*,\s*(?P<flags>[^,]+)\s*,\s*(?P<data>[^,]+)\s*,\s*(?P<fill_super>[^)]+)\s*\)'
      variable_capture: "fs_type"
      description: "挂载单例文件系统"

    # mount_ns
    - pattern: 'mount_ns\s*\(\s*(?P<fs_type>[^,]+)\s*,\s*(?P<flags>[^,]+)\s*,\s*(?P<data>[^,]+)\s*,\s*(?P<ns_ops>[^,]+)\s*,\s*(?P<ns>[^)]+)\s*\)'
      variable_capture: "fs_type"
      description: "挂载命名空间文件系统"

    # kill_litter_super
    - pattern: 'kill_litter_super\s*\(\s*(?P<sb>[^)]+)\s*\)'
      variable_capture: "sb"
      description: "卸载并清除临时文件系统"

    # kill_block_super
    - pattern: 'kill_block_super\s*\(\s*(?P<sb>[^)]+)\s*\)'
      variable_capture: "sb"
      description: "卸载块设备文件系统"

    # kill_anon_super
    - pattern: 'kill_anon_super\s*\(\s*(?P<sb>[^)]+)\s*\)'
      variable_capture: "sb"
      description: "卸载匿名文件系统"

  helper_functions:
    - pattern: 'vfs_kern_mount\s*\([^)]*\)'
      description: "内核空间挂载文件系统"
      context: "process"
      can_sleep: true

    - pattern: 'do_mount\s*\([^)]*\)'
      description: "执行挂载系统调用"
      context: "process"
      can_sleep: true

    - pattern: 'mount_bdev\s*\([^)]*\)'
      description: "挂载块设备文件系统辅助"
      context: "process"
      can_sleep: true

    - pattern: 'mount_nodev\s*\([^)]*\)'
      description: "挂载无设备文件系统辅助"
      context: "process"
      can_sleep: true

    - pattern: 'mount_single\s*\([^)]*\)'
      description: "挂载单例文件系统辅助"
      context: "process"
      can_sleep: true

    - pattern: 'mount_pseudo\s*\([^)]*\)'
      description: "挂载伪文件系统"
      context: "process"
      can_sleep: true

    - pattern: 'kill_block_super\s*\([^)]*\)'
      description: "卸载块设备文件系统"
      context: "process"
      can_sleep: true

    - pattern: 'kill_anon_super\s*\([^)]*\)'
      description: "卸载匿名文件系统"
      context: "process"
      can_sleep: true

    - pattern: 'kill_litter_super\s*\([^)]*\)'
      description: "卸载并清除内容"
      context: "process"
      can_sleep: true

    - pattern: 'deactivate_super\s*\([^)]*\)'
      description: "停用超级块"
      context: "process"
      can_sleep: true

    - pattern: 'deactivate_locked_super\s*\([^)]*\)'
      description: "停用已锁定的超级块"
      context: "process"
      can_sleep: true

    - pattern: 'sget\s*\([^)]*\)'
      description: "查找或创建超级块"
      context: "process"
      can_sleep: true

    - pattern: 'vfs_get_super\s*\([^)]*\)'
      description: "获取超级块"
      context: "process"
      can_sleep: true


# ============================================================
# FS_CONTEXT (新挂载 API, 4.16+)
# ============================================================

fs_context:
  description: "FS Context - 文件系统上下文 (新挂载 API)"
  header: "linux/fs_context.h"
  icon: "🔧"
  kernel_version: "4.16+"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  bind_patterns:
    # fs_context_for_mount
    - pattern: 'fs_context_for_mount\s*\(\s*(?P<fs_type>[^,]+)\s*,\s*(?P<sb_flags>[^)]+)\s*\)'
      variable_capture: "fs_type"
      description: "创建挂载用 fs_context"

    # fs_context_for_reconfigure
    - pattern: 'fs_context_for_reconfigure\s*\(\s*(?P<dentry>[^,]+)\s*,\s*(?P<sb_flags>[^,]+)\s*,\s*(?P<ms_flags>[^)]+)\s*\)'
      variable_capture: "dentry"
      description: "创建重配置用 fs_context"

    # fs_context_for_submount
    - pattern: 'fs_context_for_submount\s*\(\s*(?P<fs_type>[^,]+)\s*,\s*(?P<reference>[^)]+)\s*\)'
      variable_capture: "fs_type"
      description: "创建子挂载用 fs_context"

    # put_fs_context
    - pattern: 'put_fs_context\s*\(\s*(?P<fc>[^)]+)\s*\)'
      variable_capture: "fc"
      description: "释放 fs_context"

    # vfs_parse_fs_param
    - pattern: 'vfs_parse_fs_param\s*\(\s*(?P<fc>[^,]+)\s*,\s*(?P<param>[^)]+)\s*\)'
      variable_capture: "fc"
      description: "解析挂载参数"

    # vfs_parse_fs_string
    - pattern: 'vfs_parse_fs_string\s*\(\s*(?P<fc>[^,]+)\s*,\s*(?P<key>[^,]+)\s*,\s*(?P<value>[^,]+)\s*,\s*(?P<v_size>[^)]+)\s*\)'
      variable_capture: "fc"
      description: "解析字符串参数"

    # vfs_get_tree
    - pattern: 'vfs_get_tree\s*\(\s*(?P<fc>[^)]+)\s*\)'
      variable_capture: "fc"
      description: "获取文件系统树"

    # vfs_create_mount
    - pattern: 'vfs_create_mount\s*\(\s*(?P<fc>[^)]+)\s*\)'
      variable_capture: "fc"
      description: "创建挂载点"

    # fc_mount
    - pattern: 'fc_mount\s*\(\s*(?P<fc>[^)]+)\s*\)'
      variable_capture: "fc"
      description: "通过 fs_context 挂载"

  structure:
    name: "fs_context"
    description: "文件系统挂载上下文"
    fields:
      - name: "ops"
        type: "const struct fs_context_operations *"
        description: "上下文操作回调"
      - name: "uapi_mutex"
        type: "struct mutex"
        description: "用户 API 互斥锁"
      - name: "fs_type"
        type: "struct file_system_type *"
        description: "文件系统类型"
      - name: "root"
        type: "struct dentry *"
        description: "挂载根目录项"
      - name: "user_ns"
        type: "struct user_namespace *"
        description: "用户命名空间"
      - name: "net_ns"
        type: "struct net *"
        description: "网络命名空间"
      - name: "cred"
        type: "const struct cred *"
        description: "凭证"
      - name: "log"
        type: "struct p_log"
        description: "日志"
      - name: "source"
        type: "const char *"
        description: "挂载源"
      - name: "security"
        type: "void *"
        description: "安全数据"
      - name: "s_fs_info"
        type: "void *"
        description: "文件系统私有数据"
      - name: "sb_flags"
        type: "unsigned int"
        description: "超级块标志"
      - name: "sb_flags_mask"
        type: "unsigned int"
        description: "标志掩码"
      - name: "s_iflags"
        type: "unsigned int"
        description: "内部标志"
      - name: "purpose"
        type: "enum fs_context_purpose"
        description: "上下文用途"
      - name: "need_free"
        type: "bool"
        description: "是否需要释放"
      - name: "global"
        type: "bool"
        description: "是否全局可见"

  callbacks:
    free:
      pattern: '\.free\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "释放 fs_context"
      context: "process"
      can_sleep: true
      signature: "void (*)(struct fs_context *)"

    parse_param:
      pattern: '\.parse_param\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "解析挂载参数"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct fs_context *, struct fs_parameter *)"
      return_value:
        success: "0"
        failure: "负数错误码"

    parse_monolithic:
      pattern: '\.parse_monolithic\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "解析旧格式挂载选项"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct fs_context *, void *)"

    get_tree:
      pattern: '\.get_tree\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "获取/创建超级块和根 dentry"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct fs_context *)"
      return_value:
        success: "0，fc->root 已设置"
        failure: "负数错误码"
      typical_actions:
        - "调用 vfs_get_super() 或 get_tree_nodev()"
        - "填充超级块"
        - "创建根 inode 和 dentry"

    reconfigure:
      pattern: '\.reconfigure\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "重新配置已挂载的文件系统"
      context: "process"
      can_sleep: true
      signature: "int (*)(struct fs_context *)"

  helper_functions:
    - pattern: 'fs_context_for_mount\s*\([^)]*\)'
      description: "创建挂载用 fs_context"
      context: "process"
      can_sleep: true

    - pattern: 'fs_context_for_reconfigure\s*\([^)]*\)'
      description: "创建重配置用 fs_context"
      context: "process"
      can_sleep: true

    - pattern: 'put_fs_context\s*\([^)]*\)'
      description: "释放 fs_context"
      context: "process"
      can_sleep: true

    - pattern: 'vfs_parse_fs_param\s*\([^)]*\)'
      description: "解析单个参数"
      context: "process"
      can_sleep: true

    - pattern: 'vfs_get_tree\s*\([^)]*\)'
      description: "获取文件系统树"
      context: "process"
      can_sleep: true

    - pattern: 'vfs_create_mount\s*\([^)]*\)'
      description: "创建 vfsmount"
      context: "process"
      can_sleep: true

    - pattern: 'get_tree_nodev\s*\([^)]*\)'
      description: "无设备获取树辅助"
      context: "process"
      can_sleep: true

    - pattern: 'get_tree_single\s*\([^)]*\)'
      description: "单例获取树辅助"
      context: "process"
      can_sleep: true

    - pattern: 'get_tree_bdev\s*\([^)]*\)'
      description: "块设备获取树辅助"
      context: "process"
      can_sleep: true


# ============================================================
# DENTRY OPERATIONS
# ============================================================

dentry_operations:
  description: "Dentry Operations - 目录项操作"
  header: "linux/dcache.h"
  icon: "📂"
  kernel_version: "2.6+"

  context:
    type: "varies"
    can_sleep: "depends on operation"
    can_schedule: "depends on operation"
    preemptible: "depends on operation"

  bind_patterns:
    - pattern: 'static const struct dentry_operations\s+(?P<name>\w+)\s*=\s*\{'
      variable_capture: "name"
      description: "目录项操作结构定义"

  structure:
    name: "dentry_operations"
    callbacks:
      d_revalidate:
        pattern: '\.d_revalidate\s*=\s*(?P<handler>\w+)'
        handler_capture: "handler"
        description: "验证 dentry 是否仍然有效"
        context: "process"
        can_sleep: true
        signature: "int (*)(struct dentry *, unsigned int)"
        return_value:
          success: "1 (有效)"
          failure: "0 (无效)"
        typical_actions:
          - "检查 inode 是否变化 (网络文件系统)"
          - "验证权限"
          - "检查过期时间"

      d_weak_revalidate:
        pattern: '\.d_weak_revalidate\s*=\s*(?P<handler>\w+)'
        handler_capture: "handler"
        description: "弱验证 dentry"
        context: "process"
        can_sleep: true

      d_hash:
        pattern: '\.d_hash\s*=\s*(?P<handler>\w+)'
        handler_capture: "handler"
        description: "计算 dentry 哈希值"
        context: "atomic"
        can_sleep: false
        signature: "int (*)(const struct dentry *, struct qstr *)"

      d_compare:
        pattern: '\.d_compare\s*=\s*(?P<handler>\w+)'
        handler_capture: "handler"
        description: "比较两个 dentry 名称"
        context: "atomic"
        can_sleep: false
        signature: "int (*)(const struct dentry *, unsigned int, const char *, const struct qstr *)"

      d_delete:
        pattern: '\.d_delete\s*=\s*(?P<handler>\w+)'
        handler_capture: "handler"
        description: "决定是否删除 dentry"
        context: "atomic"
        can_sleep: false
        signature: "int (*)(const struct dentry *)"
        return_value:
          success: "1 (删除)"
          failure: "0 (保留)"

      d_init:
        pattern: '\.d_init\s*=\s*(?P<handler>\w+)'
        handler_capture: "handler"
        description: "初始化新 dentry"
        context: "process"
        can_sleep: true

      d_release:
        pattern: '\.d_release\s*=\s*(?P<handler>\w+)'
        handler_capture: "handler"
        description: "释放 dentry"
        context: "process"
        can_sleep: true

      d_prune:
        pattern: '\.d_prune\s*=\s*(?P<handler>\w+)'
        handler_capture: "handler"
        description: "dentry 即将被移除"
        context: "atomic"
        can_sleep: false

      d_iput:
        pattern: '\.d_iput\s*=\s*(?P<handler>\w+)'
        handler_capture: "handler"
        description: "释放 inode"
        context: "process"
        can_sleep: true

      d_dname:
        pattern: '\.d_dname\s*=\s*(?P<handler>\w+)'
        handler_capture: "handler"
        description: "动态生成 dentry 名称"
        context: "atomic"
        can_sleep: false

      d_automount:
        pattern: '\.d_automount\s*=\s*(?P<handler>\w+)'
        handler_capture: "handler"
        description: "自动挂载触发"
        context: "process"
        can_sleep: true

      d_manage:
        pattern: '\.d_manage\s*=\s*(?P<handler>\w+)'
        handler_capture: "handler"
        description: "管理挂载遍历"
        context: "process"
        can_sleep: true

      d_real:
        pattern: '\.d_real\s*=\s*(?P<handler>\w+)'
        handler_capture: "handler"
        description: "获取真实 dentry (overlayfs)"
        context: "process"
        can_sleep: true



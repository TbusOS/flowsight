# ============================================================
# SUPER BLOCK OPERATIONS
# ============================================================
super_operations:
  description: "Super Block Operations"
  header: "linux/fs.h"
  icon: "💿"
  structure:
    name: "super_operations"
    callbacks:
      alloc_inode:
        pattern: '\.alloc_inode\s*=\s*(?P<handler>\w+)'
        description: "分配 inode"
        context: "process"
        can_sleep: true
      destroy_inode:
        pattern: '\.destroy_inode\s*=\s*(?P<handler>\w+)'
        description: "销毁 inode"
        context: "process"
        can_sleep: true
      free_inode:
        pattern: '\.free_inode\s*=\s*(?P<handler>\w+)'
        description: "释放 inode（RCU 回调）"
        context: "softirq"
        can_sleep: false
      write_inode:
        pattern: '\.write_inode\s*=\s*(?P<handler>\w+)'
        description: "写入 inode"
        context: "process"
        can_sleep: true
      drop_inode:
        pattern: '\.drop_inode\s*=\s*(?P<handler>\w+)'
        description: "丢弃 inode"
        context: "process"
        can_sleep: false
      evict_inode:
        pattern: '\.evict_inode\s*=\s*(?P<handler>\w+)'

# ============================================================
# EXAMPLES
# ============================================================

examples:
  - description: "基本 BIO 分配和提交"
    kernel_version: "6.0+"
    code: |
      /* 同步读取一个页面 */
      static int read_page_sync(struct block_device *bdev,
                                sector_t sector, struct page *page)
      {
          struct bio *bio;
          int ret;
          
          /* 分配 bio，1 个 bio_vec */
          bio = bio_alloc(bdev, 1, REQ_OP_READ, GFP_KERNEL);
          if (!bio)
              return -ENOMEM;
          
          /* 设置起始扇区 */
          bio->bi_iter.bi_sector = sector;
          
          /* 添加页面 */
          if (bio_add_page(bio, page, PAGE_SIZE, 0) != PAGE_SIZE) {
              bio_put(bio);
              return -EIO;
          }
          
          /* 同步提交并等待 */
          ret = submit_bio_wait(bio);
          
          bio_put(bio);
          return ret;
      }

  - description: "异步 BIO 提交与完成回调"
    kernel_version: "6.0+"
    code: |
      struct my_io_context {
          struct completion done;
          blk_status_t status;
      };
      
      /* 完成回调 */
      static void my_bio_endio(struct bio *bio)
      {
          struct my_io_context *ctx = bio->bi_private;
          
          ctx->status = bio->bi_status;
          complete(&ctx->done);
          
          bio_put(bio);
      }
      
      /* 异步提交 */
      static int submit_async_read(struct block_device *bdev,
                                   sector_t sector, struct page *page)
      {
          struct my_io_context ctx;
          struct bio *bio;
          
          init_completion(&ctx.done);
          
          bio = bio_alloc(bdev, 1, REQ_OP_READ, GFP_KERNEL);
          bio->bi_iter.bi_sector = sector;
          bio_add_page(bio, page, PAGE_SIZE, 0);
          
          /* 设置完成回调 */
          bio->bi_end_io = my_bio_endio;
          bio->bi_private = &ctx;
          
          /* 异步提交 */
          submit_bio(bio);
          
          /* 等待完成 */
          wait_for_completion(&ctx.done);
          
          return blk_status_to_errno(ctx.status);
      }

  - description: "遍历 BIO 数据段"
    kernel_version: "5.0+"
    code: |
      /* 遍历并处理每个数据段 */
      static void process_bio_data(struct bio *bio)
      {
          struct bio_vec bvl;
          struct bvec_iter iter;
          void *data;
          
          bio_for_each_segment(bvl, bio, iter) {
              /* 映射页面获取数据指针 */
              data = kmap_local_page(bvl.bv_page);
              data += bvl.bv_offset;
              
              /* 处理数据 */
              pr_info("Segment: %p, len=%u, offset=%u\n",
                      data, bvl.bv_len, bvl.bv_offset);
              
              /* 如果是写操作，可以检查数据 */
              if (bio_data_dir(bio) == WRITE) {
                  /* 检查写入数据 */
              }
              
              kunmap_local(data);
          }
      }

  - description: "使用 bioset 创建带私有数据的 bio"
    kernel_version: "5.0+"
    code: |
      struct my_bio_private {
          struct work_struct work;
          void *driver_data;
          unsigned long flags;
      };
      
      static struct bio_set my_bioset;
      
      static int __init my_init(void)
      {
          /* 初始化 bioset，front_pad 用于私有数据 */
          return bioset_init(&my_bioset, 64,
                             offsetof(struct my_bio_private, work),
                             BIOSET_NEED_BVECS);
      }
      
      static struct bio *my_alloc_bio(struct block_device *bdev,
                                      int nr_vecs, blk_opf_t opf)
      {
          struct bio *bio;
          struct my_bio_private *priv;
          
          bio = bio_alloc_bioset(bdev, nr_vecs, opf,
                                 GFP_KERNEL, &my_bioset);
          if (!bio)
              return NULL;
          
          /* 获取私有数据指针 */
          priv = container_of(bio, struct my_bio_private, work);
          /* 注意：实际偏移取决于 front_pad 设置 */
          
          return bio;
      }
      
      static void __exit my_exit(void)
      {
          bioset_exit(&my_bioset);
      }

  - description: "BIO 拆分处理"
    kernel_version: "5.0+"
    code: |
      /* 堆叠设备驱动中的 bio 拆分 */
      static void my_make_request(struct bio *bio)
      {
          struct block_device *lower_bdev = get_lower_device(bio);
          unsigned int max_sectors = 256; /* 设备限制 */
          
          /* 如果 bio 太大，需要拆分 */
          while (bio_sectors(bio) > max_sectors) {
              struct bio *split;
              
              /* 拆分前半部分 */
              split = bio_split(bio, max_sectors,
                                GFP_NOIO, &my_bioset);
              if (!split) {
                  bio->bi_status = BLK_STS_RESOURCE;
                  bio_endio(bio);
                  return;
              }
              
              /* 链接以保持完成顺序 */
              bio_chain(split, bio);
              
              /* 提交前半部分 */
              bio_set_dev(split, lower_bdev);
              submit_bio_noacct(split);
          }
          
          /* 提交剩余部分 */
          bio_set_dev(bio, lower_bdev);
          submit_bio_noacct(bio);
      }

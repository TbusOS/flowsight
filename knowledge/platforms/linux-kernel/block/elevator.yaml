  header: "linux/elevator.h"
  icon: "🛠️"

  kernel_functions:
    elevator_switch:
      pattern: 'elevator_switch\s*\(\s*(?P<q>[^,]+)\s*,\s*(?P<new>[^)]+)\s*\)'
      description: "切换调度器"
      signature: "int elevator_switch(struct request_queue *q, struct elevator_type *new_e)"
      context: "process"
      can_sleep: true

    elevator_change:
      pattern: 'elevator_change\s*\(\s*(?P<q>[^,]+)\s*,\s*(?P<name>[^)]+)\s*\)'
      description: "按名称切换调度器"
      signature: "int elevator_change(struct request_queue *q, const char *name)"
      context: "process"
      can_sleep: true

    elv_rb_add:
      pattern: 'elv_rb_add\s*\(\s*(?P<root>[^,]+)\s*,\s*(?P<rq>[^)]+)\s*\)'
      description: "添加请求到红黑树"
      signature: "void elv_rb_add(struct rb_root *root, struct request *rq)"
      context: "softirq"
      can_sleep: false

    elv_rb_del:
      pattern: 'elv_rb_del\s*\(\s*(?P<root>[^,]+)\s*,\s*(?P<rq>[^)]+)\s*\)'
      description: "从红黑树删除请求"
      signature: "void elv_rb_del(struct rb_root *root, struct request *rq)"
      context: "softirq"
      can_sleep: false

    elv_rb_find:
      pattern: 'elv_rb_find\s*\(\s*(?P<root>[^,]+)\s*,\s*(?P<sector>\w+)\s*\)'
      description: "在红黑树中查找扇区"
      signature: "struct request *elv_rb_find(struct rb_root *root, sector_t sector)"
      context: "any"
      can_sleep: false

    elv_rqhash_add:
      pattern: 'elv_rqhash_add\s*\(\s*(?P<q>[^,]+)\s*,\s*(?P<rq>[^)]+)\s*\)'
      description: "添加请求到哈希表"
      signature: "void elv_rqhash_add(struct request_queue *q, struct request *rq)"
      context: "softirq"
      can_sleep: false

    elv_rqhash_del:
      pattern: 'elv_rqhash_del\s*\(\s*(?P<q>[^,]+)\s*,\s*(?P<rq>[^)]+)\s*\)'
      description: "从哈希表删除请求"
      signature: "void elv_rqhash_del(struct request_queue *q, struct request *rq)"
      context: "softirq"
      can_sleep: false

    blk_mq_sched_try_merge:
      pattern: 'blk_mq_sched_try_merge\s*\(\s*(?P<q>[^,]+)\s*,\s*(?P<bio>[^,]+)\s*,\s*(?P<nr_segs>\w+)\s*,\s*(?P<merged>[^)]+)\s*\)'
      description: "尝试合并 bio"
      signature: "bool blk_mq_sched_try_merge(struct request_queue *q, struct bio *bio, unsigned int nr_segs, struct request **merged_request)"
      context: "softirq"
      can_sleep: false


# ============================================================
# CALL CHAINS
# ============================================================

call_chains:
  scheduler_dispatch_chain:
    description: "调度器分发路径"
    trigger: "硬件队列需要请求"
    chain:
      - function: "blk_mq_do_dispatch_sched"
        file: "block/blk-mq-sched.c"
        description: "调度器分发入口"
        context: "softirq"
      - function: "e->type->ops.dispatch_request"
        file: "调度器代码"
        description: "调度器分发回调"
        is_user_entry: true
      - function: "blk_mq_dispatch_rq_list"
        file: "block/blk-mq.c"
        description: "分发请求列表"
      - function: "hctx->ops->queue_rq"
        file: "驱动代码"
        description: "驱动队列请求"

  scheduler_insert_chain:
    description: "调度器插入路径"
    trigger: "新请求需要调度"
    chain:
      - function: "blk_mq_sched_insert_request"
        file: "block/blk-mq-sched.c"
        description: "插入请求入口"
        context: "softirq/process"
      - function: "__blk_mq_sched_insert_request"
        file: "block/blk-mq-sched.c"
        description: "内部插入"
      - function: "e->type->ops.insert_requests"
        file: "调度器代码"
        description: "调度器插入回调"
        is_user_entry: true
      - function: "blk_mq_run_hw_queue"
        file: "block/blk-mq.c"
        description: "触发队列运行"

  scheduler_merge_chain:
    description: "调度器合并路径"
    trigger: "新 bio 可能合并"
    chain:
      - function: "blk_mq_sched_bio_merge"
        file: "block/blk-mq-sched.c"
        description: "合并检查入口"
        context: "softirq/process"
      - function: "e->type->ops.bio_merge"
        file: "调度器代码"
        description: "调度器合并回调"
        is_user_entry: true
      - function: "blk_try_merge"
        file: "block/blk-merge.c"
        description: "尝试合并"
      - function: "bio_attempt_back_merge"
        file: "block/blk-merge.c"
        description: "后向合并"


# ============================================================
# EXAMPLES
# ============================================================

examples:
  - description: "简单 I/O 调度器实现"
    kernel_version: "5.0+"
    code: |
      #include <linux/module.h>
      #include <linux/blkdev.h>
      #include <linux/elevator.h>
      #include <linux/blk-mq.h>
      
      struct my_sched_data {
          struct list_head queue;    /* 请求队列 */
          spinlock_t lock;
      };
      
      static int my_init_sched(struct request_queue *q,
                               struct elevator_type *e)
      {
          struct my_sched_data *sd;
          struct elevator_queue *eq;
          
          eq = elevator_alloc(q, e);
          if (!eq)
              return -ENOMEM;
          
          sd = kzalloc(sizeof(*sd), GFP_KERNEL);
          if (!sd) {
              kobject_put(&eq->kobj);
              return -ENOMEM;
          }
          
          INIT_LIST_HEAD(&sd->queue);
          spin_lock_init(&sd->lock);
          
          eq->elevator_data = sd;
          q->elevator = eq;
          
          return 0;
      }
      
      static void my_exit_sched(struct elevator_queue *e)
      {
          struct my_sched_data *sd = e->elevator_data;
          
          BUG_ON(!list_empty(&sd->queue));
          kfree(sd);
      }
      
      static void my_insert_requests(struct blk_mq_hw_ctx *hctx,
                                     struct list_head *list,
                                     bool at_head)
      {
          struct my_sched_data *sd = hctx->queue->elevator->elevator_data;
          struct request *rq, *next;
          
          spin_lock(&sd->lock);
          list_for_each_entry_safe(rq, next, list, queuelist) {
              list_del_init(&rq->queuelist);
              if (at_head)
                  list_add(&rq->queuelist, &sd->queue);
              else
                  list_add_tail(&rq->queuelist, &sd->queue);
          }
          spin_unlock(&sd->lock);
      }
      
      static struct request *my_dispatch_request(struct blk_mq_hw_ctx *hctx)
      {
          struct my_sched_data *sd = hctx->queue->elevator->elevator_data;
          struct request *rq = NULL;
          
          spin_lock(&sd->lock);
          if (!list_empty(&sd->queue)) {
              rq = list_first_entry(&sd->queue, struct request,
                                    queuelist);
              list_del_init(&rq->queuelist);
          }
          spin_unlock(&sd->lock);
          
          return rq;
      }
      
      static bool my_has_work(struct blk_mq_hw_ctx *hctx)
      {
          struct my_sched_data *sd = hctx->queue->elevator->elevator_data;
          
          return !list_empty(&sd->queue);
      }
      
      static struct elevator_type my_sched = {
          .ops = {
              .init_sched      = my_init_sched,
              .exit_sched      = my_exit_sched,
              .insert_requests = my_insert_requests,
              .dispatch_request = my_dispatch_request,
              .has_work        = my_has_work,
          },
          .elevator_name = "my-sched",
          .elevator_owner = THIS_MODULE,
      };
      
      static int __init my_sched_init(void)
      {
          return elv_register(&my_sched);
      }
      
      static void __exit my_sched_exit(void)
      {
          elv_unregister(&my_sched);
      }
      
      module_init(my_sched_init);
      module_exit(my_sched_exit);
      MODULE_LICENSE("GPL");

  - description: "带截止时间的调度器"
    kernel_version: "5.0+"
    code: |
      /* 带截止时间的调度器示例 */
      struct deadline_sched_data {
          struct rb_root sort_list[2];    /* 按扇区排序 */
          struct list_head fifo_list[2];  /* 按时间排序 */
          struct request *next_rq[2];     /* 下一个请求 */
          unsigned int batching;
          unsigned int fifo_expire[2];
      };
      
      static void dd_insert_request(struct blk_mq_hw_ctx *hctx,
                                    struct request *rq, bool at_head)
      {
          struct request_queue *q = hctx->queue;
          struct deadline_sched_data *dd = q->elevator->elevator_data;
          const int data_dir = rq_data_dir(rq);
          u64 deadline;
          
          /* 设置截止时间 */
          deadline = ktime_get_ns() + dd->fifo_expire[data_dir];
          rq->fifo_time = deadline;
          
          /* 添加到红黑树 (按扇区排序) */
          elv_rb_add(&dd->sort_list[data_dir], rq);
          
          /* 添加到 FIFO (按截止时间排序) */
          list_add_tail(&rq->queuelist, &dd->fifo_list[data_dir]);
      }
      
      static struct request *dd_dispatch_request(struct blk_mq_hw_ctx *hctx)
      {
          struct request_queue *q = hctx->queue;
          struct deadline_sched_data *dd = q->elevator->elevator_data;
          struct request *rq;
          int data_dir;
          
          /* 检查是否有过期请求 */
          for (data_dir = READ; data_dir <= WRITE; data_dir++) {
              if (!list_empty(&dd->fifo_list[data_dir])) {
                  rq = list_first_entry(&dd->fifo_list[data_dir],
                                        struct request, queuelist);
                  if (ktime_get_ns() >= rq->fifo_time) {
                      /* 请求已过期，优先处理 */
                      goto dispatch;
                  }
              }
          }
          
          /* 批量处理：继续当前方向 */
          if (dd->next_rq[READ])
              rq = dd->next_rq[READ];
          else if (dd->next_rq[WRITE])
              rq = dd->next_rq[WRITE];
          else
              return NULL;
          
      dispatch:
          data_dir = rq_data_dir(rq);
          
          /* 从队列移除 */
          list_del_init(&rq->queuelist);
          elv_rb_del(&dd->sort_list[data_dir], rq);
          
          /* 更新下一个请求 */
          dd->next_rq[data_dir] = elv_rb_latter_request(q, rq);
          
          return rq;
      }

  - description: "用户空间调度器配置"
    kernel_version: "4.0+"
    code: |
      /* 查看当前调度器 */
      $ cat /sys/block/sda/queue/scheduler
      [mq-deadline] kyber bfq none
      
      /* 切换调度器 */
      $ echo bfq > /sys/block/sda/queue/scheduler
      
      /* 查看 mq-deadline 参数 */
      $ ls /sys/block/sda/queue/iosched/
      fifo_batch  front_merges  read_expire  write_expire  writes_starved
      
      /* 调整读请求截止时间 */
      $ echo 100 > /sys/block/sda/queue/iosched/read_expire
      
      /* 启用低延迟模式 (BFQ) */
      $ echo 1 > /sys/block/sda/queue/iosched/low_latency
      
      /* 对于 NVMe，通常使用 none */
      $ echo none > /sys/block/nvme0n1/queue/scheduler
      
      /* 查看队列深度 */
      $ cat /sys/block/sda/queue/nr_requests
      256
      
      /* 调整队列深度 */
      $ echo 128 > /sys/block/sda/queue/nr_requests

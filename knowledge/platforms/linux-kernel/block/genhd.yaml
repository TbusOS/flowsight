# ============================================================
# EXAMPLES
# ============================================================

examples:
  - description: "完整的 gendisk 注册示例"
    kernel_version: "6.0+"
    code: |
      #include <linux/module.h>
      #include <linux/blkdev.h>
      
      #define MY_SECTOR_SIZE 512
      #define MY_SECTORS     (1024 * 2048)  /* 1GB */
      
      struct my_device {
          struct gendisk *disk;
          struct request_queue *queue;
          void *data;
          spinlock_t lock;
      };
      
      static struct my_device my_dev;
      
      static int my_open(struct gendisk *disk, blk_mode_t mode)
      {
          struct my_device *dev = disk->private_data;
          
          pr_info("my_dev: opened\n");
          return 0;
      }
      
      static void my_release(struct gendisk *disk)
      {
          struct my_device *dev = disk->private_data;
          
          pr_info("my_dev: released\n");
      }
      
      static int my_getgeo(struct block_device *bdev,
                          struct hd_geometry *geo)
      {
          geo->heads = 16;
          geo->sectors = 63;
          geo->cylinders = MY_SECTORS / (16 * 63);
          geo->start = 0;
          return 0;
      }
      
      static const struct block_device_operations my_fops = {
          .owner   = THIS_MODULE,
          .open    = my_open,
          .release = my_release,
          .getgeo  = my_getgeo,
      };
      
      static void my_submit_bio(struct bio *bio)
      {
          struct my_device *dev = bio->bi_bdev->bd_disk->private_data;
          struct bio_vec bvec;
          struct bvec_iter iter;
          sector_t sector = bio->bi_iter.bi_sector;
          void *buf;
          
          bio_for_each_segment(bvec, bio, iter) {
              buf = kmap_local_page(bvec.bv_page);
              buf += bvec.bv_offset;
              
              if (bio_data_dir(bio) == READ) {
                  memcpy(buf, dev->data + sector * MY_SECTOR_SIZE,
                         bvec.bv_len);
              } else {
                  memcpy(dev->data + sector * MY_SECTOR_SIZE,
                         buf, bvec.bv_len);
              }
              
              kunmap_local(buf);
              sector += bvec.bv_len / MY_SECTOR_SIZE;
          }
          
          bio_endio(bio);
      }
      
      static int __init my_init(void)
      {
          int ret;
          
          my_dev.data = vzalloc(MY_SECTORS * MY_SECTOR_SIZE);
          if (!my_dev.data)
              return -ENOMEM;
          
          spin_lock_init(&my_dev.lock);
          
          /* 分配磁盘 */
          my_dev.disk = blk_alloc_disk(NULL, NUMA_NO_NODE);
          if (IS_ERR(my_dev.disk)) {
              ret = PTR_ERR(my_dev.disk);
              goto err_data;
          }
          
          my_dev.queue = my_dev.disk->queue;
          
          /* 配置磁盘 */
          my_dev.disk->major = 0;  /* 动态分配 */
          my_dev.disk->first_minor = 0;
          my_dev.disk->minors = 16;  /* 最多 15 个分区 */
          my_dev.disk->fops = &my_fops;
          my_dev.disk->private_data = &my_dev;
          snprintf(my_dev.disk->disk_name, DISK_NAME_LEN, "mydev");
          
          /* 设置提交函数 (简单驱动) */
          my_dev.disk->fops->submit_bio = my_submit_bio;
          
          /* 配置队列限制 */
          blk_queue_logical_block_size(my_dev.queue, MY_SECTOR_SIZE);
          blk_queue_physical_block_size(my_dev.queue, MY_SECTOR_SIZE);
          blk_queue_max_hw_sectors(my_dev.queue, 1024);
          
          /* 设置容量 */
          set_capacity(my_dev.disk, MY_SECTORS);
          
          /* 添加到系统 */
          ret = add_disk(my_dev.disk);
          if (ret)
              goto err_disk;
          
          pr_info("my_dev: registered as /dev/%s\n",
                  my_dev.disk->disk_name);
          return 0;
          
      err_disk:
          put_disk(my_dev.disk);
      err_data:
          vfree(my_dev.data);
          return ret;
      }
      
      static void __exit my_exit(void)
      {
          del_gendisk(my_dev.disk);
          put_disk(my_dev.disk);
          vfree(my_dev.data);
          pr_info("my_dev: unregistered\n");
      }
      
      module_init(my_init);
      module_exit(my_exit);
      MODULE_LICENSE("GPL");

  - description: "可移动介质设备"
    kernel_version: "5.0+"
    code: |
      /* 可移动介质设备 (如 USB 存储) */
      static unsigned int my_check_events(struct gendisk *disk,
                                          unsigned int clearing)
      {
          struct my_device *dev = disk->private_data;
          unsigned int events = 0;
          
          if (dev->media_changed) {
              events |= DISK_EVENT_MEDIA_CHANGE;
              if (clearing & DISK_EVENT_MEDIA_CHANGE)
                  dev->media_changed = false;
          }
          
          return events;
      }
      
      static void my_unlock_native_capacity(struct gendisk *disk)
      {
          struct my_device *dev = disk->private_data;
          sector_t native_capacity;
          
          /* 获取设备原始容量 */
          native_capacity = my_get_native_capacity(dev);
          
          if (native_capacity > get_capacity(disk)) {
              set_capacity_and_notify(disk, native_capacity);
          }
      }
      
      static const struct block_device_operations my_removable_fops = {
          .owner              = THIS_MODULE,
          .open               = my_open,
          .release            = my_release,
          .getgeo             = my_getgeo,
          .check_events       = my_check_events,
          .unlock_native_capacity = my_unlock_native_capacity,
      };
      
      /* 配置为可移动设备 */
      static int setup_removable(struct my_device *dev)
      {
          dev->disk->flags |= GENHD_FL_REMOVABLE;
          dev->disk->events = DISK_EVENT_MEDIA_CHANGE |
                              DISK_EVENT_EJECT_REQUEST;
          dev->disk->async_events = DISK_EVENT_MEDIA_CHANGE;
          return 0;
      }

  - description: "打开块设备进行 I/O"
    kernel_version: "6.5+"
    code: |
      /* 内核模块中打开块设备 */
      static struct bdev_handle *open_block_device(const char *path)
      {
          struct bdev_handle *handle;
          
          handle = bdev_open_by_path(path, BLK_OPEN_READ | BLK_OPEN_WRITE,
                                     THIS_MODULE, NULL);
          if (IS_ERR(handle)) {
              pr_err("Failed to open %s: %ld\n", path, PTR_ERR(handle));
              return handle;
          }
          
          pr_info("Opened %s: %llu sectors\n", path,
                  bdev_nr_sectors(handle->bdev));
          
          return handle;
      }
      
      static void close_block_device(struct bdev_handle *handle)
      {
          bdev_release(handle);
      }
      
      /* 执行直接 I/O */
      static int do_sync_io(struct bdev_handle *handle,
                            sector_t sector, struct page *page,
                            bool write)
      {
          struct bio *bio;
          int ret;
          
          bio = bio_alloc(handle->bdev, 1,
                          write ? REQ_OP_WRITE : REQ_OP_READ,
                          GFP_KERNEL);
          bio->bi_iter.bi_sector = sector;
          bio_add_page(bio, page, PAGE_SIZE, 0);
          
          ret = submit_bio_wait(bio);
          bio_put(bio);
          
          return ret;
      }

# ============================================================
# EXAMPLES
# ============================================================

examples:
  - description: "ARM64 系统调用示例"
    kernel_version: "5.0+"
    code: |
      /* 用户空间调用 */
      mov x8, #__NR_write    /* 系统调用号 */
      mov x0, #1             /* fd = STDOUT */
      ldr x1, =message       /* buf */
      mov x2, #13            /* len */
      svc #0                 /* 触发系统调用 */
      
      /* 内核空间处理 */
      SYSCALL_DEFINE3(write, unsigned int, fd, const char __user *, buf,
                      size_t, count)
      {
          return ksys_write(fd, buf, count);
      }

  - description: "ARM64 中断处理程序注册"
    kernel_version: "5.0+"
    code: |
      #include <linux/interrupt.h>
      
      static irqreturn_t my_arm64_irq_handler(int irq, void *dev_id)
      {
          struct my_device *dev = dev_id;
          u64 status;
          
          /* 读取状态寄存器 */
          status = readq(dev->regs + IRQ_STATUS);
          if (!(status & IRQ_PENDING))
              return IRQ_NONE;
          
          /* 清除中断 */
          writeq(status, dev->regs + IRQ_CLEAR);
          
          /* 处理中断 */
          complete(&dev->completion);
          
          return IRQ_HANDLED;
      }
      
      static int my_arm64_probe(struct platform_device *pdev)
      {
          int irq, ret;
          
          irq = platform_get_irq(pdev, 0);
          if (irq < 0)
              return irq;
          
          ret = devm_request_irq(&pdev->dev, irq,
                                 my_arm64_irq_handler,
                                 IRQF_SHARED,
                                 "my-arm64-device", dev);
          return ret;
      }

  - description: "ARM64 内联汇编读取系统寄存器"
    kernel_version: "5.0+"
    code: |
      #include <asm/sysreg.h>
      
      /* 读取当前异常级别 */
      static inline u64 read_current_el(void)
      {
          u64 el;
          asm volatile("mrs %0, CurrentEL" : "=r" (el));
          return (el >> 2) & 3;
      }
      
      /* 读取 SCTLR_EL1 */
      static inline u64 read_sctlr_el1(void)
      {
          return read_sysreg(sctlr_el1);
      }
      
      /* 写入 TTBR0_EL1 */
      static inline void write_ttbr0_el1(u64 val)
      {
          write_sysreg(val, ttbr0_el1);
          isb();
      }
      
      /* 发送 IPI */
      static inline void send_ipi(u64 target_affinity)
      {
          u64 val = (target_affinity << 16) | (1 << 0);  /* SGI 0 */
          asm volatile("msr ICC_SGI1R_EL1, %0" : : "r" (val));
          isb();
      }

  - description: "ARM64 页表操作"
    kernel_version: "5.0+"
    code: |
      #include <asm/pgtable.h>
      #include <asm/tlbflush.h>
      
      /* 创建页表映射 */
      static void create_pte_mapping(pmd_t *pmd, unsigned long addr,
                                     unsigned long phys, pgprot_t prot)
      {
          pte_t *pte;
          
          pte = pte_offset_kernel(pmd, addr);
          set_pte(pte, pfn_pte(phys >> PAGE_SHIFT, prot));
      }
      
      /* 刷新 TLB */
      static void flush_tlb_page(struct vm_area_struct *vma,
                                 unsigned long addr)
      {
          /* ARMv8 TLBI 指令 */
          asm volatile(
              "dsb ishst\n"
              "tlbi vale1is, %0\n"
              "dsb ish\n"
              "isb"
              : : "r" (addr >> 12)
          );
      }
      
      /* 内存屏障 */
      #define dmb(opt)  asm volatile("dmb " #opt : : : "memory")
      #define dsb(opt)  asm volatile("dsb " #opt : : : "memory")
      #define isb()     asm volatile("isb" : : : "memory")


# ============================================================
# NOTES
# ============================================================

notes:
  - "ARM64 使用 ABI 标准 AAPCS64"
  - "异常级别切换需要使用 ERET 指令"
  - "Linux 内核运行在 EL1，可选支持 EL2 (KVM)"
  - "ARMv8.0 支持 48位 VA，ARMv8.2-LVA 支持 52位"
  - "ARMv8.1 引入 VHE (Virtualization Host Extensions)"
  - "ARMv8.3 引入指针认证 (PAC)"
  - "ARMv8.5 引入内存标记扩展 (MTE)"

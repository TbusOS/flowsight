notes:
  - "x86_64 使用 System V AMD64 ABI"
  - "SYSCALL/SYSRET 比 INT 0x80 快很多"
  - "KPTI (Meltdown 缓解) 需要两套页表"
  - "Spectre 缓解影响分支预测性能"
  - "PCID 可减少 TLB 刷新开销"
  - "5级页表支持 57位虚拟地址 (128PB)"
  - "x2APIC 通过 MSR 访问，更快更大"

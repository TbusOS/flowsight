# ============================================================
# EXAMPLES
# ============================================================

examples:
  - description: "x86_64 系统调用示例"
    kernel_version: "5.0+"
    code: |
      /* 用户空间汇编 */
      mov $1, %rax           /* __NR_write */
      mov $1, %rdi           /* fd = STDOUT */
      lea message(%rip), %rsi /* buf */
      mov $13, %rdx          /* len */
      syscall                /* 系统调用 */
      
      /* 内核空间系统调用定义 */
      SYSCALL_DEFINE3(write, unsigned int, fd,
                      const char __user *, buf,
                      size_t, count)
      {
          return ksys_write(fd, buf, count);
      }

  - description: "x86 中断处理程序"
    kernel_version: "5.0+"
    code: |
      #include <linux/interrupt.h>
      
      static irqreturn_t my_x86_irq_handler(int irq, void *dev_id)
      {
          struct my_device *dev = dev_id;
          u32 status;
          
          /* 读取状态 */
          status = inl(dev->io_base + STATUS_REG);
          if (!(status & IRQ_PENDING))
              return IRQ_NONE;
          
          /* 清除中断 */
          outl(status, dev->io_base + STATUS_REG);
          
          /* 唤醒等待队列 */
          wake_up(&dev->wait_queue);
          
          return IRQ_HANDLED;
      }
      
      static int my_x86_probe(struct pci_dev *pdev,
                              const struct pci_device_id *id)
      {
          int ret;
          
          /* 请求 MSI 中断 */
          ret = pci_alloc_irq_vectors(pdev, 1, 1, PCI_IRQ_MSI);
          if (ret < 0)
              return ret;
          
          ret = request_irq(pci_irq_vector(pdev, 0),
                            my_x86_irq_handler,
                            0, "my-x86-device", dev);
          return ret;
      }

  - description: "x86 内联汇编和 MSR 操作"
    kernel_version: "5.0+"
    code: |
      #include <asm/msr.h>
      
      /* 读取 MSR */
      static inline u64 read_msr(u32 msr)
      {
          u32 low, high;
          asm volatile("rdmsr" : "=a"(low), "=d"(high) : "c"(msr));
          return ((u64)high << 32) | low;
      }
      
      /* 写入 MSR */
      static inline void write_msr(u32 msr, u64 val)
      {
          u32 low = val;
          u32 high = val >> 32;
          asm volatile("wrmsr" : : "c"(msr), "a"(low), "d"(high));
      }
      
      /* 读取 TSC */
      static inline u64 rdtsc(void)
      {
          u32 low, high;
          asm volatile("rdtsc" : "=a"(low), "=d"(high));
          return ((u64)high << 32) | low;
      }
      
      /* 发送 IPI */
      static inline void send_ipi(int cpu, int vector)
      {
          u32 icr_low = vector | APIC_DEST_PHYSICAL;
          u32 icr_high = cpu << 24;
          
          /* 写入 ICR */
          apic_write(APIC_ICR2, icr_high);
          apic_write(APIC_ICR, icr_low);
      }

  - description: "x86 页表操作"
    kernel_version: "5.0+"
    code: |
      #include <asm/pgtable.h>
      #include <asm/tlbflush.h>
      
      /* 设置 PTE */
      static void set_pte_at_example(struct mm_struct *mm,
                                     unsigned long addr,
                                     pte_t *ptep, pte_t pte)
      {
          set_pte(ptep, pte);
      }
      
      /* 刷新单个页的 TLB */
      static inline void flush_tlb_one(unsigned long addr)
      {
          asm volatile("invlpg (%0)" : : "r"(addr) : "memory");
      }
      
      /* 刷新所有 TLB (切换 CR3) */
      static inline void flush_tlb_all(void)
      {
          unsigned long cr3 = __read_cr3();
          write_cr3(cr3);
      }
      
      /* 内存屏障 */
      #define mb()    asm volatile("mfence" ::: "memory")
      #define rmb()   asm volatile("lfence" ::: "memory")
      #define wmb()   asm volatile("sfence" ::: "memory")



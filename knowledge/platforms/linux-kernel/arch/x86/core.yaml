      - name: "iopl_emul"
        type: "unsigned int"
        description: "IOPL 模拟"

  tss_struct:
    description: "任务状态段"
    header: "arch/x86/include/asm/processor.h"
    fields:
      - name: "rsp0"
        type: "u64"
        description: "Ring 0 栈指针"
      - name: "rsp1"
        type: "u64"
        description: "Ring 1 栈指针"
      - name: "rsp2"
        type: "u64"
        description: "Ring 2 栈指针"
      - name: "ist[7]"
        type: "u64"
        description: "中断栈表"
      - name: "io_bitmap_base"
        type: "u16"
        description: "I/O 位图基址"

  desc_struct:
    description: "段描述符"
    header: "arch/x86/include/asm/desc_defs.h"



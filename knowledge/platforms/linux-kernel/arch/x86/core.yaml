        type: "unsigned short"
        description: "段寄存器"
      - name: "fsbase"
        type: "unsigned long"
        description: "FS 基址"
      - name: "gsbase"
        type: "unsigned long"
        description: "GS 基址"
      - name: "fsindex, gsindex"
        type: "unsigned short"
        description: "FS/GS 索引"
      - name: "io_bitmap"
        type: "struct io_bitmap *"

# ============================================================
# EXAMPLES
# ============================================================

examples:
  - description: "一致性 DMA 分配示例"
    kernel_version: "2.6+"
    code: |
      #include <linux/dma-mapping.h>
      
      struct my_device {
          void *desc_virt;           /* CPU 虚拟地址 */
          dma_addr_t desc_dma;       /* DMA 地址 */
          size_t desc_size;
      };
      
      static int alloc_descriptors(struct device *dev, struct my_device *priv)
      {
          priv->desc_size = 4096;
          
          /* 分配一致性 DMA 内存 - CPU 和设备始终看到相同内容 */
          priv->desc_virt = dma_alloc_coherent(dev, priv->desc_size,
                                               &priv->desc_dma, GFP_KERNEL);
          if (!priv->desc_virt)
              return -ENOMEM;
          
          pr_info("Allocated DMA: virt=%p dma=%pad\n",
                  priv->desc_virt, &priv->desc_dma);
          
          /* 直接使用，无需同步 */
          memset(priv->desc_virt, 0, priv->desc_size);
          
          /* 将 DMA 地址写入设备寄存器 */
          writel(lower_32_bits(priv->desc_dma), priv->regs + DESC_ADDR_LO);
          writel(upper_32_bits(priv->desc_dma), priv->regs + DESC_ADDR_HI);
          
          return 0;
      }
      
      static void free_descriptors(struct device *dev, struct my_device *priv)
      {
          if (priv->desc_virt) {
              dma_free_coherent(dev, priv->desc_size,
                               priv->desc_virt, priv->desc_dma);
              priv->desc_virt = NULL;
          }
      }

  - description: "流式 DMA 映射示例"
    kernel_version: "2.6+"
    code: |
      #include <linux/dma-mapping.h>
      
      static int dma_tx_buffer(struct device *dev, void *data, size_t len)
      {
          dma_addr_t dma_addr;
          
          /* 映射缓冲区 - 设备将读取 (DMA_TO_DEVICE) */
          dma_addr = dma_map_single(dev, data, len, DMA_TO_DEVICE);
          if (dma_mapping_error(dev, dma_addr)) {
              dev_err(dev, "DMA mapping failed\n");
              return -EIO;
          }
          
          /* 编程 DMA 控制器 */
          program_dma_controller(dma_addr, len);
          
          /* 启动传输 */
          start_dma_transfer();
          
          /* 等待完成... */
          wait_for_dma_complete();
          
          /* 取消映射 */
          dma_unmap_single(dev, dma_addr, len, DMA_TO_DEVICE);
          
          return 0;
      }
      
      static int dma_rx_buffer(struct device *dev, void *data, size_t len)
      {
          dma_addr_t dma_addr;
          
          /* 映射缓冲区 - 设备将写入 (DMA_FROM_DEVICE) */
          dma_addr = dma_map_single(dev, data, len, DMA_FROM_DEVICE);
          if (dma_mapping_error(dev, dma_addr))
              return -EIO;
          
          /* 编程并启动 DMA */
          program_dma_controller(dma_addr, len);
          start_dma_transfer();
          wait_for_dma_complete();
          
          /* 取消映射后 CPU 才能安全读取 */
          dma_unmap_single(dev, dma_addr, len, DMA_FROM_DEVICE);
          
          /* 现在可以安全访问 data */
          process_received_data(data, len);
          
          return 0;
      }

  - description: "DMA 同步示例 (不取消映射)"
    kernel_version: "2.6+"
    code: |
      #include <linux/dma-mapping.h>
      
      /* 重用映射的缓冲区 - 使用同步而非 unmap/map */
      static void streaming_reuse_example(struct device *dev,
                                         void *buf, size_t len,
                                         dma_addr_t dma_addr)
      {
          /* 假设缓冲区已经映射为 DMA_BIDIRECTIONAL */
          
          /* === 发送数据 === */
          /* 填充缓冲区 */
          memcpy(buf, tx_data, len);
          
          /* 同步：CPU 修改完毕，让设备可见 */
          dma_sync_single_for_device(dev, dma_addr, len, DMA_TO_DEVICE);
          
          /* 启动 DMA 发送 */
          start_tx_dma();
          wait_for_tx_complete();
          
          /* === 接收数据 === */
          /* 启动 DMA 接收 */
          start_rx_dma();
          wait_for_rx_complete();
          
          /* 同步：设备写完，让 CPU 可见 */
          dma_sync_single_for_cpu(dev, dma_addr, len, DMA_FROM_DEVICE);
          
          /* 现在 CPU 可以安全读取 */
          memcpy(rx_data, buf, len);
      }

  - description: "散列 DMA 示例"
    kernel_version: "2.6+"
    code: |
      #include <linux/dma-mapping.h>
      #include <linux/scatterlist.h>
      
      static int sg_dma_example(struct device *dev)
      {
          struct scatterlist sg[3];
          void *buf1, *buf2, *buf3;
          int nents, i;
          struct scatterlist *s;
          
          /* 分配缓冲区 */
          buf1 = kmalloc(1024, GFP_KERNEL);
          buf2 = kmalloc(2048, GFP_KERNEL);
          buf3 = kmalloc(512, GFP_KERNEL);
          
          /* 初始化散列表 */
          sg_init_table(sg, 3);
          sg_set_buf(&sg[0], buf1, 1024);
          sg_set_buf(&sg[1], buf2, 2048);
          sg_set_buf(&sg[2], buf3, 512);
          
          /* 映射散列表 */
          nents = dma_map_sg(dev, sg, 3, DMA_TO_DEVICE);
          if (nents == 0) {
              pr_err("SG DMA mapping failed\n");
              goto free_bufs;
          }
          
          /* 遍历映射后的散列表 */
          for_each_sg(sg, s, nents, i) {
              dma_addr_t dma_addr = sg_dma_address(s);
              unsigned int dma_len = sg_dma_len(s);
              
              pr_info("SG[%d]: dma=%pad len=%u\n", i, &dma_addr, dma_len);
              
              /* 编程 DMA 控制器处理这个段 */
              program_sg_entry(dma_addr, dma_len);
          }
          
          /* 启动 DMA 传输 */
          start_sg_dma_transfer();
          wait_for_dma_complete();
          
          /* 取消映射 */
          dma_unmap_sg(dev, sg, 3, DMA_TO_DEVICE);
          
      free_bufs:
          kfree(buf1);
          kfree(buf2);
          kfree(buf3);
          return 0;
      }

  - description: "DMA 池示例"
    kernel_version: "2.6+"
    code: |
      #include <linux/dmapool.h>
      
      struct my_driver {
          struct dma_pool *desc_pool;
      };
      
      /* 描述符结构 - 必须是 2 的幂大小 */
      struct dma_desc {
          __le32 control;
          __le32 status;
          __le64 addr;
          __le32 len;
          __le32 next;
      } __packed;
      
      static int create_dma_pool(struct device *dev, struct my_driver *drv)
      {
          /* 创建 DMA 池：名称、设备、大小、对齐、边界 */
          drv->desc_pool = dma_pool_create("my_desc_pool",
                                           dev,
                                           sizeof(struct dma_desc),
                                           32,   /* 32 字节对齐 */
                                           4096); /* 不跨 4K 边界 */
          if (!drv->desc_pool)
              return -ENOMEM;
          
          return 0;
      }
      
      static struct dma_desc *alloc_descriptor(struct my_driver *drv,
                                               dma_addr_t *dma_handle)
      {
          struct dma_desc *desc;
          
          /* 从池分配 */
          desc = dma_pool_zalloc(drv->desc_pool, GFP_KERNEL, dma_handle);
          if (!desc)
              return NULL;
          
          pr_debug("Allocated desc: virt=%p dma=%pad\n", desc, dma_handle);
          return desc;
      }
      
      static void free_descriptor(struct my_driver *drv,
                                  struct dma_desc *desc,
                                  dma_addr_t dma_handle)
      {
          dma_pool_free(drv->desc_pool, desc, dma_handle);
      }
      
      static void destroy_dma_pool(struct my_driver *drv)
      {
          if (drv->desc_pool) {
              dma_pool_destroy(drv->desc_pool);
              drv->desc_pool = NULL;
          }
      }

  - description: "设置 DMA 掩码示例"
    kernel_version: "2.6+"
    code: |
      #include <linux/dma-mapping.h>
      
      static int setup_dma_mask(struct device *dev)
      {
          int ret;
          
          /* 首先尝试 64 位 DMA */
          ret = dma_set_mask_and_coherent(dev, DMA_BIT_MASK(64));
          if (ret == 0) {
              dev_info(dev, "Using 64-bit DMA\n");
              return 0;
          }
          
          /* 回退到 32 位 DMA */
          ret = dma_set_mask_and_coherent(dev, DMA_BIT_MASK(32));
          if (ret == 0) {
              dev_info(dev, "Using 32-bit DMA\n");
              return 0;
          }
          
          dev_err(dev, "No suitable DMA available\n");
          return -EIO;
      }

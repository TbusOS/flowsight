# Linux Kernel DMA (Direct Memory Access) Knowledge Base
# Reference: https://www.kernel.org/doc/html/latest/core-api/dma-api.html
# Source: kernel/dma/*, include/linux/dma-mapping.h
# Completeness: 95%+ (KB-Memory Agent)

# ============================================================
# DMA OVERVIEW
# ============================================================

dma_overview:
  description: "DMA - 直接内存访问"
  header: "linux/dma-mapping.h"
  icon: "🔄"
  kernel_version: "2.6+"
  
  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true
  
  overview: |
    DMA 允许设备直接访问系统内存，无需 CPU 参与数据传输。
    - 一致性 DMA：CPU 和设备看到相同的内存内容
    - 流式 DMA：需要显式同步，性能更好
    - 必须使用 DMA API，不能直接使用物理地址
    - 注意 DMA 地址可能与物理地址不同 (IOMMU)

# ============================================================
# DATA STRUCTURES
# ============================================================

data_structures:
  dma_addr_t:
    pattern: 'dma_addr_t'
    description: "DMA 地址类型"
    file: "include/linux/types.h"
    note: "可能与物理地址不同 (IOMMU/SWIOTLB)"

  scatterlist:
    pattern: 'struct scatterlist\s*\{'
    description: "散列表结构"
    file: "include/linux/scatterlist.h"
    fields:
      - name: "page_link"
        type: "unsigned long"
        description: "页和标志"
      - name: "offset"
        type: "unsigned int"
        description: "页内偏移"
      - name: "length"
        type: "unsigned int"
        description: "长度"
      - name: "dma_address"
        type: "dma_addr_t"
        description: "DMA 地址"
      - name: "dma_length"
        type: "unsigned int"
        description: "DMA 长度"

  sg_table:
    pattern: 'struct sg_table\s*\{'
    description: "散列表集合"
    file: "include/linux/scatterlist.h"
    fields:
      - name: "sgl"
        type: "struct scatterlist *"
        description: "散列表数组"
      - name: "nents"
        type: "unsigned int"
        description: "实际条目数"
      - name: "orig_nents"
        type: "unsigned int"
        description: "原始条目数"

  dma_pool:
    pattern: 'struct dma_pool\s*\{'
    description: "DMA 内存池"
    file: "include/linux/dmapool.h"
    note: "用于小块 DMA 缓冲区分配"

# ============================================================
# DMA DIRECTION
# ============================================================

dma_direction:
  description: "DMA 传输方向"
  icon: "➡️"
  
  values:
    - name: "DMA_BIDIRECTIONAL"
      value: 0
      description: "双向传输 (设备读写)"
    
    - name: "DMA_TO_DEVICE"
      value: 1
      description: "CPU -> 设备 (设备读)"
    
    - name: "DMA_FROM_DEVICE"
      value: 2
      description: "设备 -> CPU (设备写)"
    
    - name: "DMA_NONE"
      value: 3
      description: "无方向 (调试用)"

# ============================================================
# COHERENT DMA ALLOCATION
# ============================================================

coherent_dma:
  description: "Coherent DMA - 一致性 DMA 分配"
  header: "linux/dma-mapping.h"
  icon: "🔗"

  bind_patterns:
    # dma_alloc_coherent - 分配一致性 DMA 内存
    - pattern: 'dma_alloc_coherent\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<size>[^,]+)\s*,\s*(?P<dma_handle>[^,]+)\s*,\s*(?P<gfp>[^)]+)\s*\)'
      variable_capture: "dev"
      description: "分配一致性 DMA 内存"
      context: "process"
      can_sleep: true
      return_value:
        success: "虚拟地址 (void *)"
        failure: "NULL"
      note: "CPU 和设备始终看到相同内容，无需同步"

    # dma_free_coherent - 释放一致性 DMA 内存
    - pattern: 'dma_free_coherent\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<size>[^,]+)\s*,\s*(?P<cpu_addr>[^,]+)\s*,\s*(?P<dma_handle>[^)]+)\s*\)'
      variable_capture: "dev"
      description: "释放一致性 DMA 内存"
      context: "process or softirq"
      can_sleep: false

    # dma_zalloc_coherent - 零初始化分配 (已废弃)
    - pattern: 'dma_zalloc_coherent\s*\('
      description: "零初始化一致性 DMA 分配 (已废弃，使用 dma_alloc_coherent)"
      deprecated: true

    # dma_alloc_wc - 分配 Write-Combining DMA 内存
    - pattern: 'dma_alloc_wc\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<size>[^,]+)\s*,\s*(?P<dma_handle>[^,]+)\s*,\s*(?P<gfp>[^)]+)\s*\)'
      variable_capture: "dev"
      description: "分配 Write-Combining DMA 内存"
      context: "process"
      can_sleep: true
      use_case: "帧缓冲等大块顺序写"

    # dma_free_wc - 释放 WC DMA 内存
    - pattern: 'dma_free_wc\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<size>[^,]+)\s*,\s*(?P<cpu_addr>[^,]+)\s*,\s*(?P<dma_handle>[^)]+)\s*\)'
      variable_capture: "dev"
      description: "释放 Write-Combining DMA 内存"

    # dma_alloc_attrs - 带属性的 DMA 分配
    - pattern: 'dma_alloc_attrs\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<size>[^,]+)\s*,\s*(?P<dma_handle>[^,]+)\s*,\s*(?P<gfp>[^,]+)\s*,\s*(?P<attrs>[^)]+)\s*\)'
      variable_capture: "dev"
      description: "带属性的 DMA 内存分配"

    # dma_free_attrs - 释放带属性的 DMA 内存
    - pattern: 'dma_free_attrs\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<size>[^,]+)\s*,\s*(?P<cpu_addr>[^,]+)\s*,\s*(?P<dma_handle>[^,]+)\s*,\s*(?P<attrs>[^)]+)\s*\)'
      variable_capture: "dev"
      description: "释放带属性的 DMA 内存"

# ============================================================
# STREAMING DMA MAPPING
# ============================================================

streaming_dma:
  description: "Streaming DMA - 流式 DMA 映射"
  header: "linux/dma-mapping.h"
  icon: "🌊"

  bind_patterns:
    # dma_map_single - 映射单个缓冲区
    - pattern: 'dma_map_single\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<ptr>[^,]+)\s*,\s*(?P<size>[^,]+)\s*,\s*(?P<dir>[^)]+)\s*\)'
      variable_capture: "ptr"
      description: "映射单个缓冲区供 DMA 使用"
      context: "any"
      can_sleep: false
      return_value:
        success: "dma_addr_t"
        failure: "使用 dma_mapping_error() 检查"
      note: "映射后 CPU 不应访问，直到 unmap 或 sync"

    # dma_unmap_single - 取消映射单个缓冲区
    - pattern: 'dma_unmap_single\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<dma_addr>[^,]+)\s*,\s*(?P<size>[^,]+)\s*,\s*(?P<dir>[^)]+)\s*\)'
      variable_capture: "dma_addr"
      description: "取消映射单个 DMA 缓冲区"
      context: "any"
      can_sleep: false

    # dma_map_page - 映射页面
    - pattern: 'dma_map_page\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<page>[^,]+)\s*,\s*(?P<offset>[^,]+)\s*,\s*(?P<size>[^,]+)\s*,\s*(?P<dir>[^)]+)\s*\)'
      variable_capture: "page"
      description: "映射页面供 DMA 使用"
      context: "any"
      can_sleep: false

    # dma_unmap_page - 取消映射页面
    - pattern: 'dma_unmap_page\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<dma_addr>[^,]+)\s*,\s*(?P<size>[^,]+)\s*,\s*(?P<dir>[^)]+)\s*\)'
      variable_capture: "dma_addr"
      description: "取消映射 DMA 页面"
      context: "any"
      can_sleep: false

    # dma_map_resource - 映射 MMIO 资源
    - pattern: 'dma_map_resource\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<phys_addr>[^,]+)\s*,\s*(?P<size>[^,]+)\s*,\s*(?P<dir>[^,]+)\s*,\s*(?P<attrs>[^)]+)\s*\)'
      variable_capture: "phys_addr"
      description: "映射 MMIO 资源供 DMA 使用"

    # dma_unmap_resource - 取消映射 MMIO 资源
    - pattern: 'dma_unmap_resource\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<dma_addr>[^,]+)\s*,\s*(?P<size>[^,]+)\s*,\s*(?P<dir>[^,]+)\s*,\s*(?P<attrs>[^)]+)\s*\)'
      variable_capture: "dma_addr"
      description: "取消映射 MMIO DMA 资源"

    # dma_mapping_error - 检查映射错误
    - pattern: 'dma_mapping_error\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<dma_addr>[^)]+)\s*\)'
      variable_capture: "dma_addr"
      description: "检查 DMA 映射是否失败"
      return_value:
        error: "非零"
        success: "0"

# ============================================================
# DMA SYNCHRONIZATION
# ============================================================

dma_sync:
  description: "DMA Synchronization - DMA 同步"
  header: "linux/dma-mapping.h"
  icon: "🔄"

  bind_patterns:
    # dma_sync_single_for_cpu - 同步给 CPU
    - pattern: 'dma_sync_single_for_cpu\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<dma_addr>[^,]+)\s*,\s*(?P<size>[^,]+)\s*,\s*(?P<dir>[^)]+)\s*\)'
      variable_capture: "dma_addr"
      description: "同步 DMA 缓冲区供 CPU 访问"
      context: "any"
      can_sleep: false
      note: "在 CPU 读取 DMA_FROM_DEVICE 数据前调用"

    # dma_sync_single_for_device - 同步给设备
    - pattern: 'dma_sync_single_for_device\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<dma_addr>[^,]+)\s*,\s*(?P<size>[^,]+)\s*,\s*(?P<dir>[^)]+)\s*\)'
      variable_capture: "dma_addr"
      description: "同步 DMA 缓冲区供设备访问"
      context: "any"
      can_sleep: false
      note: "在 CPU 修改 DMA_TO_DEVICE 数据后调用"

    # dma_sync_single_range_for_cpu - 范围同步给 CPU
    - pattern: 'dma_sync_single_range_for_cpu\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<dma_addr>[^,]+)\s*,\s*(?P<offset>[^,]+)\s*,\s*(?P<size>[^,]+)\s*,\s*(?P<dir>[^)]+)\s*\)'
      variable_capture: "dma_addr"
      description: "同步部分 DMA 缓冲区供 CPU 访问"

    # dma_sync_single_range_for_device - 范围同步给设备
    - pattern: 'dma_sync_single_range_for_device\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<dma_addr>[^,]+)\s*,\s*(?P<offset>[^,]+)\s*,\s*(?P<size>[^,]+)\s*,\s*(?P<dir>[^)]+)\s*\)'
      variable_capture: "dma_addr"
      description: "同步部分 DMA 缓冲区供设备访问"

# ============================================================
# SCATTER-GATHER DMA
# ============================================================

sg_dma:
  description: "Scatter-Gather DMA - 散列 DMA"
  header: "linux/dma-mapping.h"
  icon: "📊"

  bind_patterns:
    # dma_map_sg - 映射散列表
    - pattern: 'dma_map_sg\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<sg>[^,]+)\s*,\s*(?P<nents>[^,]+)\s*,\s*(?P<dir>[^)]+)\s*\)'
      variable_capture: "sg"
      description: "映射散列表供 DMA 使用"
      context: "any"
      can_sleep: false
      return_value:
        success: "映射的条目数 (可能合并)"
        failure: "0"

    # dma_unmap_sg - 取消映射散列表
    - pattern: 'dma_unmap_sg\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<sg>[^,]+)\s*,\s*(?P<nents>[^,]+)\s*,\s*(?P<dir>[^)]+)\s*\)'
      variable_capture: "sg"
      description: "取消映射散列 DMA"
      context: "any"
      can_sleep: false

    # dma_map_sg_attrs - 带属性映射散列表
    - pattern: 'dma_map_sg_attrs\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<sg>[^,]+)\s*,\s*(?P<nents>[^,]+)\s*,\s*(?P<dir>[^,]+)\s*,\s*(?P<attrs>[^)]+)\s*\)'
      variable_capture: "sg"
      description: "带属性映射散列表"

    # dma_unmap_sg_attrs - 取消带属性映射
    - pattern: 'dma_unmap_sg_attrs\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<sg>[^,]+)\s*,\s*(?P<nents>[^,]+)\s*,\s*(?P<dir>[^,]+)\s*,\s*(?P<attrs>[^)]+)\s*\)'
      variable_capture: "sg"
      description: "取消带属性的散列 DMA 映射"

    # dma_sync_sg_for_cpu - 散列表同步给 CPU
    - pattern: 'dma_sync_sg_for_cpu\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<sg>[^,]+)\s*,\s*(?P<nents>[^,]+)\s*,\s*(?P<dir>[^)]+)\s*\)'
      variable_capture: "sg"
      description: "同步散列表供 CPU 访问"

    # dma_sync_sg_for_device - 散列表同步给设备
    - pattern: 'dma_sync_sg_for_device\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<sg>[^,]+)\s*,\s*(?P<nents>[^,]+)\s*,\s*(?P<dir>[^)]+)\s*\)'
      variable_capture: "sg"
      description: "同步散列表供设备访问"

  sg_helpers:
    # sg_init_one - 初始化单个散列项
    - pattern: 'sg_init_one\s*\(\s*(?P<sg>[^,]+)\s*,\s*(?P<buf>[^,]+)\s*,\s*(?P<len>[^)]+)\s*\)'
      variable_capture: "sg"
      description: "初始化单个散列项"

    # sg_init_table - 初始化散列表
    - pattern: 'sg_init_table\s*\(\s*(?P<sg>[^,]+)\s*,\s*(?P<nents>[^)]+)\s*\)'
      variable_capture: "sg"
      description: "初始化散列表数组"

    # sg_set_buf - 设置散列项缓冲区
    - pattern: 'sg_set_buf\s*\(\s*(?P<sg>[^,]+)\s*,\s*(?P<buf>[^,]+)\s*,\s*(?P<len>[^)]+)\s*\)'
      variable_capture: "sg"
      description: "设置散列项的缓冲区"

    # sg_set_page - 设置散列项页面
    - pattern: 'sg_set_page\s*\(\s*(?P<sg>[^,]+)\s*,\s*(?P<page>[^,]+)\s*,\s*(?P<len>[^,]+)\s*,\s*(?P<offset>[^)]+)\s*\)'
      variable_capture: "sg"
      description: "设置散列项的页面"

    # sg_dma_address - 获取 DMA 地址
    - pattern: 'sg_dma_address\s*\(\s*(?P<sg>[^)]+)\s*\)'
      variable_capture: "sg"
      description: "获取散列项的 DMA 地址"

    # sg_dma_len - 获取 DMA 长度
    - pattern: 'sg_dma_len\s*\(\s*(?P<sg>[^)]+)\s*\)'
      variable_capture: "sg"
      description: "获取散列项的 DMA 长度"

    # for_each_sg - 遍历散列表
    - pattern: 'for_each_sg\s*\(\s*(?P<sglist>[^,]+)\s*,\s*(?P<sg>\w+)\s*,\s*(?P<nr>[^,]+)\s*,\s*(?P<i>\w+)\s*\)'
      variable_capture: "sglist"
      description: "遍历散列表中的每个条目"

    # for_each_sgtable_sg - 遍历 sg_table
    - pattern: 'for_each_sgtable_sg\s*\(\s*(?P<sgt>[^,]+)\s*,\s*(?P<sg>\w+)\s*,\s*(?P<i>\w+)\s*\)'
      variable_capture: "sgt"
      description: "遍历 sg_table 中的条目"

    # for_each_sgtable_dma_sg - 遍历 DMA 映射后的 sg_table
    - pattern: 'for_each_sgtable_dma_sg\s*\(\s*(?P<sgt>[^,]+)\s*,\s*(?P<sg>\w+)\s*,\s*(?P<i>\w+)\s*\)'
      variable_capture: "sgt"
      description: "遍历 DMA 映射后的 sg_table"

# ============================================================
# DMA POOL
# ============================================================

dma_pool:
  description: "DMA Pool - DMA 内存池"
  header: "linux/dmapool.h"
  icon: "🏊"

  bind_patterns:
    # dma_pool_create - 创建 DMA 池
    - pattern: 'dma_pool_create\s*\(\s*(?P<name>[^,]+)\s*,\s*(?P<dev>[^,]+)\s*,\s*(?P<size>[^,]+)\s*,\s*(?P<align>[^,]+)\s*,\s*(?P<boundary>[^)]+)\s*\)'
      variable_capture: "name"
      description: "创建 DMA 内存池"
      context: "process"
      can_sleep: true
      return_value:
        success: "struct dma_pool *"
        failure: "NULL"

    # dma_pool_destroy - 销毁 DMA 池
    - pattern: 'dma_pool_destroy\s*\(\s*(?P<pool>[^)]+)\s*\)'
      variable_capture: "pool"
      description: "销毁 DMA 内存池"
      context: "process"
      can_sleep: true

    # dma_pool_alloc - 从池分配
    - pattern: 'dma_pool_alloc\s*\(\s*(?P<pool>[^,]+)\s*,\s*(?P<gfp>[^,]+)\s*,\s*(?P<dma_handle>[^)]+)\s*\)'
      variable_capture: "pool"
      description: "从 DMA 池分配内存"
      context: "depends on gfp"

    # dma_pool_zalloc - 从池零初始化分配
    - pattern: 'dma_pool_zalloc\s*\(\s*(?P<pool>[^,]+)\s*,\s*(?P<gfp>[^,]+)\s*,\s*(?P<dma_handle>[^)]+)\s*\)'
      variable_capture: "pool"
      description: "从 DMA 池零初始化分配"

    # dma_pool_free - 释放回池
    - pattern: 'dma_pool_free\s*\(\s*(?P<pool>[^,]+)\s*,\s*(?P<vaddr>[^,]+)\s*,\s*(?P<dma_handle>[^)]+)\s*\)'
      variable_capture: "pool"
      description: "释放内存回 DMA 池"
      context: "any"
      can_sleep: false

# ============================================================
# DEVM DMA (DEVICE MANAGED)
# ============================================================

devm_dma:
  description: "Device Managed DMA - 设备管理的 DMA"
  header: "linux/dma-mapping.h"
  icon: "🔧"

  bind_patterns:
    # dmam_alloc_coherent - 设备管理的一致性分配
    - pattern: 'dmam_alloc_coherent\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<size>[^,]+)\s*,\s*(?P<dma_handle>[^,]+)\s*,\s*(?P<gfp>[^)]+)\s*\)'
      variable_capture: "dev"
      description: "设备管理的一致性 DMA 分配"
      context: "process"
      can_sleep: true
      note: "设备移除时自动释放"

    # dmam_free_coherent - 释放设备管理的 DMA
    - pattern: 'dmam_free_coherent\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<size>[^,]+)\s*,\s*(?P<vaddr>[^,]+)\s*,\s*(?P<dma_handle>[^)]+)\s*\)'
      variable_capture: "dev"
      description: "释放设备管理的一致性 DMA 内存"

    # dmam_alloc_attrs - 设备管理的带属性分配
    - pattern: 'dmam_alloc_attrs\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<size>[^,]+)\s*,\s*(?P<dma_handle>[^,]+)\s*,\s*(?P<gfp>[^,]+)\s*,\s*(?P<attrs>[^)]+)\s*\)'
      variable_capture: "dev"
      description: "设备管理的带属性 DMA 分配"

    # dmam_pool_create - 设备管理的 DMA 池
    - pattern: 'dmam_pool_create\s*\(\s*(?P<name>[^,]+)\s*,\s*(?P<dev>[^,]+)\s*,\s*(?P<size>[^,]+)\s*,\s*(?P<align>[^,]+)\s*,\s*(?P<allocation>[^)]+)\s*\)'
      variable_capture: "name"
      description: "创建设备管理的 DMA 池"

    # dmam_pool_destroy - 销毁设备管理的 DMA 池
    - pattern: 'dmam_pool_destroy\s*\(\s*(?P<pool>[^)]+)\s*\)'
      variable_capture: "pool"
      description: "销毁设备管理的 DMA 池"

# ============================================================
# DMA CAPABILITIES
# ============================================================

dma_capabilities:
  description: "DMA Capabilities - DMA 能力查询"
  header: "linux/dma-mapping.h"
  icon: "🔍"

  bind_patterns:
    # dma_set_mask - 设置 DMA 掩码
    - pattern: 'dma_set_mask\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<mask>[^)]+)\s*\)'
      variable_capture: "mask"
      description: "设置设备 DMA 地址掩码"
      return_value:
        success: "0"
        failure: "-ERRNO"

    # dma_set_coherent_mask - 设置一致性 DMA 掩码
    - pattern: 'dma_set_coherent_mask\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<mask>[^)]+)\s*\)'
      variable_capture: "mask"
      description: "设置一致性 DMA 地址掩码"

    # dma_set_mask_and_coherent - 同时设置两种掩码
    - pattern: 'dma_set_mask_and_coherent\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<mask>[^)]+)\s*\)'
      variable_capture: "mask"
      description: "同时设置流式和一致性 DMA 掩码"

    # dma_can_mmap - 检查是否支持 mmap
    - pattern: 'dma_can_mmap\s*\(\s*(?P<dev>[^)]+)\s*\)'
      variable_capture: "dev"
      description: "检查设备是否支持 DMA mmap"

    # dma_get_required_mask - 获取需要的掩码
    - pattern: 'dma_get_required_mask\s*\(\s*(?P<dev>[^)]+)\s*\)'
      variable_capture: "dev"
      description: "获取设备实际需要的 DMA 掩码"

    # dma_supported - 检查 DMA 支持
    - pattern: 'dma_supported\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<mask>[^)]+)\s*\)'
      variable_capture: "dev"
      description: "检查设备是否支持指定的 DMA 掩码"

  common_masks:
    - name: "DMA_BIT_MASK(32)"

# ============================================================
# DEBUG AND INFO
# ============================================================

debug_info:
  description: "Debug and Info - 调试信息"
  icon: "🔍"

  proc_files:
    - path: "/proc/vmallocinfo"
      description: "vmalloc 区域信息"
      fields:
        - "起始-结束地址"
        - "大小"
        - "调用者"
        - "页面数"
        - "用途 (vmalloc/vmap/ioremap)"

# ============================================================
# EXAMPLES
# ============================================================

examples:
  - description: "基本 vmalloc 使用"
    kernel_version: "2.6+"
    code: |
      #include <linux/vmalloc.h>
      #include <linux/module.h>
      
      static int __init my_init(void)
      {
          void *buf;
          
          /* 分配 1MB 虚拟连续内存 */
          buf = vmalloc(1024 * 1024);
          if (!buf) {
              pr_err("vmalloc failed\n");
              return -ENOMEM;
          }
          
          /* 使用内存 */
          memset(buf, 0, 1024 * 1024);
          
          /* 释放内存 */
          vfree(buf);
          return 0;
      }
      
      /* 零初始化版本 */
      static void vzalloc_example(void)
      {
          void *buf = vzalloc(PAGE_SIZE * 100);
          if (buf) {
              /* 内存已零初始化 */
              vfree(buf);
          }
      }

  - description: "vmap 映射已有页面"
    kernel_version: "2.6+"
    code: |
      #include <linux/vmalloc.h>
      #include <linux/mm.h>
      
      static void vmap_example(void)
      {
          struct page **pages;
          void *vaddr;
          int i, num_pages = 4;
          
          /* 分配页面数组 */
          pages = kmalloc(sizeof(struct page *) * num_pages, GFP_KERNEL);
          if (!pages)
              return;
          
          /* 分配各个页面 */
          for (i = 0; i < num_pages; i++) {
              pages[i] = alloc_page(GFP_KERNEL);
              if (!pages[i])
                  goto cleanup;
          }
          
          /* 将页面映射到连续虚拟地址 */
          vaddr = vmap(pages, num_pages, VM_MAP, PAGE_KERNEL);
          if (!vaddr)
              goto cleanup;
          
          /* 使用虚拟地址访问内存 */
          memset(vaddr, 0xAB, PAGE_SIZE * num_pages);
          
          /* 取消映射 */
          vunmap(vaddr);
          
      cleanup:
          for (i = 0; i < num_pages; i++) {
              if (pages[i])
                  __free_page(pages[i]);
          }
          kfree(pages);
      }

  - description: "ioremap 映射设备内存"
    kernel_version: "2.6+"
    code: |
      #include <linux/io.h>
      #include <linux/module.h>
      
      #define DEVICE_BASE_ADDR  0x10000000
      #define DEVICE_SIZE       0x1000
      
      struct my_device {
          void __iomem *regs;
      };
      
      static int map_device(struct my_device *dev)
      {
          /* 映射设备寄存器 */
          dev->regs = ioremap(DEVICE_BASE_ADDR, DEVICE_SIZE);
          if (!dev->regs) {
              pr_err("ioremap failed\n");
              return -ENOMEM;
          }
          
          /* 读取寄存器 */
          u32 val = readl(dev->regs + 0x00);
          pr_info("Device ID: 0x%08x\n", val);
          
          /* 写入寄存器 */
          writel(0x1, dev->regs + 0x04);
          
          return 0;
      }
      
      static void unmap_device(struct my_device *dev)
      {
          if (dev->regs) {
              iounmap(dev->regs);
              dev->regs = NULL;
          }
      }

  - description: "vmalloc_user 映射到用户空间"
    kernel_version: "2.6+"
    code: |
      #include <linux/vmalloc.h>
      #include <linux/mm.h>
      
      static void *shared_buf;
      static unsigned long shared_size = PAGE_SIZE * 4;
      
      static int my_mmap(struct file *file, struct vm_area_struct *vma)
      {
          unsigned long size = vma->vm_end - vma->vm_start;
          
          if (size > shared_size)
              return -EINVAL;
          
          /* 将 vmalloc 内存映射到用户空间 */
          if (remap_vmalloc_range(vma, shared_buf, 0))
              return -EAGAIN;
          
          return 0;
      }
      
      static int __init my_init(void)
      {
          /* 分配可映射到用户空间的内存 */
          shared_buf = vmalloc_user(shared_size);
          if (!shared_buf)
              return -ENOMEM;
          
          return 0;
      }
      
      static void __exit my_exit(void)
      {
          vfree(shared_buf);
      }

  - description: "memremap 通用映射"
    kernel_version: "4.3+"
    code: |
      #include <linux/io.h>
      
      static void memremap_example(void)
      {
          void *addr;
          phys_addr_t phys = 0x100000;  /* 1MB */
          size_t size = 0x1000;
          
          /* 尝试 Write-back 缓存映射 */
          addr = memremap(phys, size, MEMREMAP_WB);
          if (!addr) {
              /* 退而求其次使用 Write-through */
              addr = memremap(phys, size, MEMREMAP_WT);
          }
          if (!addr) {
              /* 最后尝试 Write-combining */
              addr = memremap(phys, size, MEMREMAP_WC);
          }
          
          if (addr) {
              /* 使用映射的内存 */
              memunmap(addr);
          }
      }

# ============================================================
# EXAMPLES
# ============================================================

examples:
  - description: "基本 ioremap 使用"
    kernel_version: "2.6+"
    code: |
      #include <linux/io.h>
      
      #define DEVICE_BASE  0x10000000
      #define DEVICE_SIZE  0x1000
      
      /* 寄存器偏移 */
      #define REG_CTRL     0x00
      #define REG_STATUS   0x04
      #define REG_DATA     0x08
      
      struct my_device {
          void __iomem *regs;
      };
      
      static int map_device(struct my_device *dev)
      {
          /* 映射设备寄存器 */
          dev->regs = ioremap(DEVICE_BASE, DEVICE_SIZE);
          if (!dev->regs) {
              pr_err("ioremap failed\n");
              return -ENOMEM;
          }
          
          /* 读取状态寄存器 */
          u32 status = readl(dev->regs + REG_STATUS);
          pr_info("Status: 0x%08x\n", status);
          
          /* 写入控制寄存器 */
          writel(0x01, dev->regs + REG_CTRL);
          
          /* 确保写入完成 */
          (void)readl(dev->regs + REG_CTRL);
          
          return 0;
      }
      
      static void unmap_device(struct my_device *dev)
      {
          if (dev->regs) {
              iounmap(dev->regs);
              dev->regs = NULL;
          }
      }

  - description: "推荐: devm_ioremap_resource"
    kernel_version: "3.5+"
    code: |
      #include <linux/io.h>
      #include <linux/platform_device.h>
      
      static int my_probe(struct platform_device *pdev)
      {
          struct resource *res;
          void __iomem *base;
          
          /* 获取并映射第一个内存资源 */
          base = devm_platform_ioremap_resource(pdev, 0);
          if (IS_ERR(base)) {
              dev_err(&pdev->dev, "ioremap failed\n");
              return PTR_ERR(base);
          }
          
          /* 或者使用 devm_ioremap_resource */
          res = platform_get_resource(pdev, IORESOURCE_MEM, 0);
          base = devm_ioremap_resource(&pdev->dev, res);
          if (IS_ERR(base))
              return PTR_ERR(base);
          
          /* 使用 base 访问寄存器 */
          u32 val = readl(base + 0x00);
          
          /* 无需手动 iounmap - 设备移除时自动处理 */
          return 0;
      }

  - description: "正确使用 relaxed 访问"
    kernel_version: "2.6+"
    code: |
      #include <linux/io.h>
      
      /* 使用 relaxed 版本提高性能 */
      static void fast_register_access(void __iomem *base)
      {
          int i;
          
          /* 批量写入 - 使用 relaxed 提高性能 */
          for (i = 0; i < 100; i++) {
              writel_relaxed(i, base + REG_DATA);
          }
          
          /* 最后一次写入确保所有之前的写入完成 */
          writel(0x100, base + REG_CTRL);
          
          /* 或者使用显式屏障 */
          writel_relaxed(0x100, base + REG_CTRL);
          wmb();  /* 写内存屏障 */
      }
      
      /* 读取时的 relaxed 使用 */
      static u32 fast_read_status(void __iomem *base)
      {
          u32 val;
          
          /* 读取前确保之前的写入对设备可见 */
          wmb();
          
          val = readl_relaxed(base + REG_STATUS);
          
          /* 使用值前确保读取完成 */
          rmb();
          
          return val;
      }

  - description: "PCI 设备映射"
    kernel_version: "2.6+"
    code: |
      #include <linux/pci.h>
      #include <linux/io.h>
      
      static int my_pci_probe(struct pci_dev *pdev,
                              const struct pci_device_id *id)
      {
          void __iomem *bar0, *bar1;
          int ret;
          
          /* 启用设备 */
          ret = pcim_enable_device(pdev);
          if (ret)
              return ret;
          
          /* 映射 BAR0 (MMIO) */
          bar0 = pcim_iomap(pdev, 0, 0);
          if (!bar0) {
              dev_err(&pdev->dev, "BAR0 iomap failed\n");
              return -ENOMEM;
          }
          
          /* 或使用 pcim_iomap_regions 映射多个 BAR */
          ret = pcim_iomap_regions(pdev, BIT(0) | BIT(1), "my_driver");
          if (ret)
              return ret;
          
          /* 获取映射表 */
          void __iomem * const *iomap = pcim_iomap_table(pdev);
          bar0 = iomap[0];
          bar1 = iomap[1];
          
          /* 使用 BAR */
          u32 val = readl(bar0 + 0x00);
          
          /* 无需手动 iounmap - 设备移除时自动处理 */
          return 0;
      }

  - description: "安全的寄存器访问封装"
    kernel_version: "2.6+"
    code: |
      #include <linux/io.h>
      
      struct my_hw {
          void __iomem *regs;
          spinlock_t lock;
      };
      
      /* 读寄存器 (可在中断中使用) */
      static inline u32 my_read_reg(struct my_hw *hw, u32 offset)
      {
          return readl(hw->regs + offset);
      }
      
      /* 写寄存器 (可在中断中使用) */
      static inline void my_write_reg(struct my_hw *hw, u32 offset, u32 val)
      {
          writel(val, hw->regs + offset);
      }
      
      /* 修改寄存器位 (需要锁保护) */
      static void my_set_bits(struct my_hw *hw, u32 offset, u32 bits)
      {
          unsigned long flags;
          u32 val;
          
          spin_lock_irqsave(&hw->lock, flags);
          val = readl(hw->regs + offset);
          val |= bits;
          writel(val, hw->regs + offset);
          spin_unlock_irqrestore(&hw->lock, flags);
      }
      
      static void my_clear_bits(struct my_hw *hw, u32 offset, u32 bits)
      {
          unsigned long flags;
          u32 val;
          
          spin_lock_irqsave(&hw->lock, flags);
          val = readl(hw->regs + offset);
          val &= ~bits;
          writel(val, hw->regs + offset);
          spin_unlock_irqrestore(&hw->lock, flags);
      }
      
      /* 带超时的状态轮询 */
      static int my_wait_status(struct my_hw *hw, u32 mask, u32 expected,
                                unsigned long timeout_us)
      {
          unsigned long deadline = jiffies + usecs_to_jiffies(timeout_us);
          u32 val;
          
          do {
              val = readl(hw->regs + REG_STATUS);
              if ((val & mask) == expected)
                  return 0;
              
              if (time_after(jiffies, deadline))
                  return -ETIMEDOUT;
              
              cpu_relax();
          } while (1);
      }

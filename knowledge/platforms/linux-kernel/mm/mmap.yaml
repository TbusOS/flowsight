    - name: "VM_MIXEDMAP"
      description: "混合 struct page 和 PFN"
    - name: "VM_HUGEPAGE"
      description: "启用 THP"
    - name: "VM_NOHUGEPAGE"
      description: "禁用 THP"
    - name: "VM_MERGEABLE"
      description: "可 KSM 合并"
    - name: "VM_ARCH_1"
      description: "架构特定标志 1"
    - name: "VM_WIPEONFORK"
      description: "fork 时清零"
    - name: "VM_DONTCOPY"
      description: "fork 时不复制"

# ============================================================
# MMAP INTERFACE
# ============================================================

mmap_interface:
  description: "Mmap Interface - mmap 系统调用接口"
  header: "linux/mm.h"
  icon: "📤"

  bind_patterns:
    # do_mmap - 内核 mmap 入口
    - pattern: 'do_mmap\s*\(\s*(?P<file>[^,]+)\s*,\s*(?P<addr>[^,]+)\s*,\s*(?P<len>[^,]+)\s*,\s*(?P<prot>[^,]+)\s*,\s*(?P<flags>[^,]+)\s*,\s*(?P<pgoff>[^,]+)\s*,'
      variable_capture: "file"
      description: "内核 mmap 主入口"
      context: "process"
      can_sleep: true

    # vm_mmap - 封装的 mmap
    - pattern: 'vm_mmap\s*\(\s*(?P<file>[^,]+)\s*,\s*(?P<addr>[^,]+)\s*,\s*(?P<len>[^,]+)\s*,\s*(?P<prot>[^,]+)\s*,\s*(?P<flags>[^,]+)\s*,\s*(?P<offset>[^)]+)\s*\)'
      variable_capture: "file"
      description: "内核 mmap 封装"

    # ksys_mmap_pgoff - 系统调用入口
    - pattern: 'ksys_mmap_pgoff\s*\('
      description: "mmap 系统调用入口"
      context: "syscall"

    # mmap_region - 创建映射区域
    - pattern: 'mmap_region\s*\(\s*(?P<file>[^,]+)\s*,\s*(?P<addr>[^,]+)\s*,'
      variable_capture: "addr"
      description: "创建新的映射区域"

    # do_munmap - 取消映射
    - pattern: 'do_munmap\s*\(\s*(?P<mm>[^,]+)\s*,\s*(?P<start>[^,]+)\s*,\s*(?P<len>[^,]+)\s*,'
      variable_capture: "start"
      description: "内核 munmap 主入口"

    # vm_munmap - 封装的 munmap
    - pattern: 'vm_munmap\s*\(\s*(?P<addr>[^,]+)\s*,\s*(?P<len>[^)]+)\s*\)'
      variable_capture: "addr"
      description: "内核 munmap 封装"

    # do_brk_flags - brk 实现
    - pattern: 'do_brk_flags\s*\(\s*(?P<addr>[^,]+)\s*,\s*(?P<len>[^,]+)\s*,\s*(?P<flags>[^,]+)\s*,'
      variable_capture: "addr"
      description: "brk 系统调用实现"

    # do_mremap - 重映射
    - pattern: 'do_mremap\s*\(\s*(?P<addr>[^,]+)\s*,\s*(?P<old_len>[^,]+)\s*,\s*(?P<new_len>[^,]+)\s*,'
      variable_capture: "addr"
      description: "mremap 实现"

# ============================================================
# VMA OPERATIONS
# ============================================================

vma_operations:
  description: "VMA Operations - VMA 操作函数"
  header: "mm/mmap.c"
  icon: "⚙️"

  bind_patterns:
    # find_vma - 查找 VMA
    - pattern: 'find_vma\s*\(\s*(?P<mm>[^,]+)\s*,\s*(?P<addr>[^)]+)\s*\)'
      variable_capture: "addr"
      description: "查找包含或在地址之后的 VMA"

    # find_vma_prev - 查找 VMA 和前一个
    - pattern: 'find_vma_prev\s*\(\s*(?P<mm>[^,]+)\s*,\s*(?P<addr>[^,]+)\s*,\s*(?P<pprev>[^)]+)\s*\)'
      variable_capture: "addr"
      description: "查找 VMA 同时返回前一个"

    # find_vma_intersection - 查找交叉 VMA
    - pattern: 'find_vma_intersection\s*\(\s*(?P<mm>[^,]+)\s*,\s*(?P<start>[^,]+)\s*,\s*(?P<end>[^)]+)\s*\)'
      variable_capture: "start"
      description: "查找与范围交叉的 VMA"

    # vma_merge - 合并 VMA
    - pattern: 'vma_merge\s*\(\s*(?P<mm>[^,]+)\s*,\s*(?P<prev>[^,]+)\s*,'
      variable_capture: "mm"
      description: "尝试合并相邻的 VMA"

    # split_vma - 分割 VMA
    - pattern: 'split_vma\s*\(\s*(?P<mm>[^,]+)\s*,\s*(?P<vma>[^,]+)\s*,\s*(?P<addr>[^,]+)\s*,\s*(?P<new_below>[^)]+)\s*\)'
      variable_capture: "addr"
      description: "在指定地址分割 VMA"

    # __split_vma - 内部分割
    - pattern: '__split_vma\s*\(\s*(?P<mm>[^,]+)\s*,\s*(?P<vma>[^,]+)\s*,\s*(?P<addr>[^,]+)\s*,\s*(?P<new_below>[^)]+)\s*\)'
      variable_capture: "addr"
      description: "内部 VMA 分割实现"

    # insert_vm_struct - 插入 VMA
    - pattern: 'insert_vm_struct\s*\(\s*(?P<mm>[^,]+)\s*,\s*(?P<vma>[^)]+)\s*\)'
      variable_capture: "vma"
      description: "插入 VMA 到 mm"

    # __vma_link - 链接 VMA
    - pattern: '__vma_link\s*\(\s*(?P<mm>[^,]+)\s*,\s*(?P<vma>[^,]+)\s*,'
      variable_capture: "vma"
      description: "链接 VMA 到链表和树"

    # __vma_unlink - 取消链接 VMA
    - pattern: '__vma_unlink\s*\(\s*(?P<mm>[^,]+)\s*,\s*(?P<vma>[^,]+)\s*,'
      variable_capture: "vma"
      description: "从链表和树移除 VMA"

    # get_unmapped_area - 获取未映射区域
    - pattern: 'get_unmapped_area\s*\(\s*(?P<file>[^,]+)\s*,\s*(?P<addr>[^,]+)\s*,\s*(?P<len>[^,]+)\s*,'
      variable_capture: "len"
      description: "获取可用的未映射地址"

    # unmap_region - 取消映射区域
    - pattern: 'unmap_region\s*\(\s*(?P<mm>[^,]+)\s*,'
      variable_capture: "mm"
      description: "取消映射并清理 VMA"

# ============================================================
# PAGE MAPPING OPERATIONS
# ============================================================

page_mapping:
  description: "Page Mapping Operations - 页映射操作"
  header: "linux/mm.h"
  icon: "📋"

  bind_patterns:
    # remap_pfn_range - 映射 PFN 范围
    - pattern: 'remap_pfn_range\s*\(\s*(?P<vma>[^,]+)\s*,\s*(?P<addr>[^,]+)\s*,\s*(?P<pfn>[^,]+)\s*,\s*(?P<size>[^,]+)\s*,\s*(?P<prot>[^)]+)\s*\)'
      variable_capture: "pfn"
      description: "映射物理页到用户空间"
      context: "process"
      can_sleep: true

    # io_remap_pfn_range - IO 映射
    - pattern: 'io_remap_pfn_range\s*\(\s*(?P<vma>[^,]+)\s*,\s*(?P<addr>[^,]+)\s*,\s*(?P<pfn>[^,]+)\s*,\s*(?P<size>[^,]+)\s*,\s*(?P<prot>[^)]+)\s*\)'
      variable_capture: "pfn"
      description: "映射 IO 内存到用户空间"

    # vm_insert_page - 插入页
    - pattern: 'vm_insert_page\s*\(\s*(?P<vma>[^,]+)\s*,\s*(?P<addr>[^,]+)\s*,\s*(?P<page>[^)]+)\s*\)'
      variable_capture: "page"
      description: "在 VMA 中插入单个页"

    # vm_insert_pages - 批量插入页
    - pattern: 'vm_insert_pages\s*\(\s*(?P<vma>[^,]+)\s*,\s*(?P<addr>[^,]+)\s*,\s*(?P<pages>[^,]+)\s*,\s*(?P<num>[^)]+)\s*\)'
      variable_capture: "pages"
      description: "批量插入多个页"

    # vm_insert_pfn - 插入 PFN
    - pattern: 'vm_insert_pfn\s*\(\s*(?P<vma>[^,]+)\s*,\s*(?P<addr>[^,]+)\s*,\s*(?P<pfn>[^)]+)\s*\)'
      variable_capture: "pfn"
      description: "在 VMA 中插入 PFN"

    # vm_insert_mixed - 混合插入
    - pattern: 'vm_insert_mixed\s*\(\s*(?P<vma>[^,]+)\s*,\s*(?P<addr>[^,]+)\s*,\s*(?P<pfn>[^)]+)\s*\)'
      variable_capture: "pfn"
      description: "混合插入页或 PFN"

    # remap_vmalloc_range - 映射 vmalloc
    - pattern: 'remap_vmalloc_range\s*\(\s*(?P<vma>[^,]+)\s*,\s*(?P<addr>[^,]+)\s*,\s*(?P<pgoff>[^)]+)\s*\)'
      variable_capture: "addr"
      description: "映射 vmalloc 内存到用户空间"

    # remap_vmalloc_range_partial - 部分映射 vmalloc
    - pattern: 'remap_vmalloc_range_partial\s*\(\s*(?P<vma>[^,]+)\s*,\s*(?P<uaddr>[^,]+)\s*,\s*(?P<kaddr>[^,]+)\s*,\s*(?P<pgoff>[^,]+)\s*,\s*(?P<size>[^)]+)\s*\)'
      variable_capture: "kaddr"
      description: "部分映射 vmalloc 内存到用户空间"

    # vm_iomap_memory - 映射 IO 内存
    - pattern: 'vm_iomap_memory\s*\(\s*(?P<vma>[^,]+)\s*,\s*(?P<start>[^,]+)\s*,\s*(?P<len>[^)]+)\s*\)'
      variable_capture: "start"
      description: "映射 IO 内存到用户空间 VMA"

    # dma_mmap_coherent - DMA 一致性映射
    - pattern: 'dma_mmap_coherent\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<vma>[^,]+)\s*,\s*(?P<cpu_addr>[^,]+)\s*,\s*(?P<dma_addr>[^,]+)\s*,\s*(?P<size>[^)]+)\s*\)'
      variable_capture: "cpu_addr"
      description: "将 DMA 一致性内存映射到用户空间"

    # dma_mmap_wc - DMA WC 映射
    - pattern: 'dma_mmap_wc\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<vma>[^,]+)\s*,\s*(?P<cpu_addr>[^,]+)\s*,\s*(?P<dma_addr>[^,]+)\s*,\s*(?P<size>[^)]+)\s*\)'
      variable_capture: "cpu_addr"
      description: "将 DMA Write-Combining 内存映射到用户空间"

    # dma_mmap_attrs - 带属性的 DMA 映射
    - pattern: 'dma_mmap_attrs\s*\(\s*(?P<dev>[^,]+)\s*,\s*(?P<vma>[^,]+)\s*,\s*(?P<cpu_addr>[^,]+)\s*,\s*(?P<dma_addr>[^,]+)\s*,\s*(?P<size>[^,]+)\s*,\s*(?P<attrs>[^)]+)\s*\)'
      variable_capture: "cpu_addr"
      description: "将 DMA 内存映射到用户空间（带属性）"

# ============================================================
# CALLBACKS
# ============================================================

callbacks:
  fault:
    pattern: '\.fault\s*=\s*(?P<handler>\w+)'
    description: "缺页异常处理"
    trigger: "访问未映射的页"
    context: "process"
    can_sleep: true
    signature: "vm_fault_t (*)(struct vm_fault *vmf)"
    return_value:
      success: "VM_FAULT_NOPAGE 或 0"
      failure: "VM_FAULT_SIGBUS, VM_FAULT_OOM, VM_FAULT_ERROR"
    typical_actions:
      - "分配或查找页"
      - "设置 vmf->page"

  page_mkwrite:
    pattern: '\.page_mkwrite\s*=\s*(?P<handler>\w+)'
    description: "页即将变为可写"
    trigger: "写时复制或共享写"
    context: "process"
    can_sleep: true
    signature: "vm_fault_t (*)(struct vm_fault *vmf)"
    return_value:
      success: "VM_FAULT_LOCKED"
      failure: "VM_FAULT_SIGBUS"

  open:
    pattern: '\.open\s*=\s*(?P<handler>\w+)'
    description: "VMA 被复制或创建"
    trigger: "fork, mmap"
    context: "process"
    can_sleep: true
    signature: "void (*)(struct vm_area_struct *area)"

  close:
    pattern: '\.close\s*=\s*(?P<handler>\w+)'
    description: "VMA 被删除"
    trigger: "munmap, exit"
    context: "process"
    can_sleep: true
    signature: "void (*)(struct vm_area_struct *area)"

# ============================================================
# CALL CHAINS
# ============================================================

call_chains:
  mmap_syscall:
    description: "mmap 系统调用路径"
    trigger: "用户调用 mmap()"
    chain:
      - function: "ksys_mmap_pgoff"
        file: "mm/mmap.c"
        description: "系统调用入口"
      - function: "vm_mmap_pgoff"
        file: "mm/util.c"
        description: "VM mmap 封装"
      - function: "do_mmap"
        file: "mm/mmap.c"
        description: "mmap 主实现"
      - function: "get_unmapped_area"
        file: "mm/mmap.c"
        description: "获取可用地址"
      - function: "mmap_region"
        file: "mm/mmap.c"
        description: "创建映射区域"
      - function: "call_mmap"
        file: "include/linux/fs.h"
        description: "调用文件 mmap"

  munmap_syscall:
    description: "munmap 系统调用路径"
    trigger: "用户调用 munmap()"
    chain:
      - function: "__do_sys_munmap"
        file: "mm/mmap.c"
        description: "系统调用入口"
      - function: "__vm_munmap"
        file: "mm/mmap.c"
        description: "munmap 封装"
      - function: "do_munmap"
        file: "mm/mmap.c"
        description: "munmap 主实现"
      - function: "__split_vma"
        file: "mm/mmap.c"
        description: "分割 VMA (如需要)"
      - function: "unmap_region"
        file: "mm/mmap.c"
        description: "取消映射区域"
      - function: "unmap_vmas"
        file: "mm/memory.c"
        description: "取消映射 VMA"

  page_fault:
    description: "缺页异常路径"
    trigger: "访问未映射页"
    chain:
      - function: "do_page_fault"
        file: "arch/*/mm/fault.c"
        description: "架构缺页入口"
      - function: "handle_mm_fault"
        file: "mm/memory.c"
        description: "MM 层缺页处理"
      - function: "__handle_mm_fault"
        file: "mm/memory.c"
        description: "内部处理"
      - function: "handle_pte_fault"
        file: "mm/memory.c"
        description: "PTE 层处理"
      - function: "do_fault"
        file: "mm/memory.c"
        description: "文件缺页"
      - function: "__do_fault"
        file: "mm/memory.c"
        description: "执行缺页处理"
      - function: "vma->vm_ops->fault"
        description: "用户 fault 回调"
        is_user_entry: true

  remap_pfn_range_path:

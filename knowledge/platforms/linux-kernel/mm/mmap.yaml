# ============================================================
# EXAMPLES
# ============================================================

examples:
  - description: "驱动 mmap 实现"
    kernel_version: "2.6+"
    code: |
      #include <linux/mm.h>
      #include <linux/fs.h>
      
      static vm_fault_t my_fault(struct vm_fault *vmf)
      {
          struct page *page;
          
          /* 分配页 */
          page = alloc_page(GFP_KERNEL | __GFP_ZERO);
          if (!page)
              return VM_FAULT_OOM;
          
          /* 设置页 */
          vmf->page = page;
          return 0;
      }
      
      static void my_open(struct vm_area_struct *vma)
      {
          pr_info("VMA opened: %lx-%lx\n", vma->vm_start, vma->vm_end);
      }
      
      static void my_close(struct vm_area_struct *vma)
      {
          pr_info("VMA closed: %lx-%lx\n", vma->vm_start, vma->vm_end);
      }
      
      static const struct vm_operations_struct my_vm_ops = {
          .open   = my_open,
          .close  = my_close,
          .fault  = my_fault,
      };
      
      static int my_mmap(struct file *file, struct vm_area_struct *vma)
      {
          vma->vm_ops = &my_vm_ops;
          vma->vm_flags |= VM_DONTEXPAND | VM_DONTDUMP;
          my_open(vma);
          return 0;
      }

  - description: "remap_pfn_range 映射物理内存"
    kernel_version: "2.6+"
    code: |
      #include <linux/mm.h>
      
      static int my_mmap_pfn(struct file *file, struct vm_area_struct *vma)
      {
          unsigned long pfn;
          unsigned long size = vma->vm_end - vma->vm_start;
          
          /* 获取物理地址的 PFN */
          pfn = my_phys_addr >> PAGE_SHIFT;
          
          /* 设置 VM_IO 标志表示 IO 内存 */
          vma->vm_flags |= VM_IO;
          
          /* 映射物理内存到用户空间 */
          if (remap_pfn_range(vma, vma->vm_start, pfn, size, vma->vm_page_prot))
              return -EAGAIN;
          
          return 0;
      }

  - description: "VMA 查找和遍历"
    kernel_version: "2.6+"
    code: |
      #include <linux/mm.h>
      #include <linux/sched.h>
      
      void show_vmas(struct task_struct *task)
      {
          struct mm_struct *mm = task->mm;
          struct vm_area_struct *vma;
          
          if (!mm)
              return;
          
          mmap_read_lock(mm);
          
          for (vma = mm->mmap; vma; vma = vma->vm_next) {
              pr_info("%lx-%lx %c%c%c%c %lx %s\n",
                      vma->vm_start, vma->vm_end,
                      vma->vm_flags & VM_READ ? 'r' : '-',
                      vma->vm_flags & VM_WRITE ? 'w' : '-',
                      vma->vm_flags & VM_EXEC ? 'x' : '-',
                      vma->vm_flags & VM_SHARED ? 's' : 'p',
                      vma->vm_pgoff,
                      vma->vm_file ? 
                          vma->vm_file->f_path.dentry->d_name.name : "");
          }
          
          mmap_read_unlock(mm);
      }

  - description: "内核空间 mmap"
    kernel_version: "2.6+"
    code: |
      #include <linux/mm.h>
      #include <linux/slab.h>
      
      /* 在内核中进行映射操作 */
      static int kernel_mmap_example(void)
      {
          struct file *file;
          unsigned long addr;
          unsigned long size = PAGE_SIZE * 4;
          
          file = filp_open("/tmp/test", O_RDWR, 0);
          if (IS_ERR(file))
              return PTR_ERR(file);
          
          /* 映射文件到内核地址空间 */
          addr = vm_mmap(file, 0, size, PROT_READ | PROT_WRITE,
                         MAP_SHARED, 0);
          if (IS_ERR_VALUE(addr)) {
              filp_close(file, NULL);
              return addr;
          }
          
          /* 使用映射的内存... */
          
          /* 取消映射 */
          vm_munmap(addr, size);
          filp_close(file, NULL);
          
          return 0;
      }

      description: "共享映射"
  
  behavior_flags:
    - name: "VM_GROWSDOWN"
      description: "向下增长 (栈)"
    - name: "VM_GROWSUP"
      description: "向上增长"
    - name: "VM_PFNMAP"
      description: "PFN 映射 (非 struct page)"
    - name: "VM_DENYWRITE"
      description: "禁止写入文件"
    - name: "VM_UFFD_MISSING"
      description: "userfaultfd 缺页"
    - name: "VM_UFFD_WP"
      description: "userfaultfd 写保护"
    - name: "VM_LOCKED"
      description: "锁定在内存"
    - name: "VM_IO"
      description: "IO 内存映射"
    - name: "VM_SEQ_READ"
      description: "顺序读取提示"
    - name: "VM_RAND_READ"
      description: "随机读取提示"
    - name: "VM_DONTCOPY"

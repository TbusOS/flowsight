# Linux Kernel Memory Mapping Knowledge Base
# Reference: https://www.kernel.org/doc/html/latest/mm/
# Source: mm/mmap.c
# Completeness: 95%+ (KB-Memory Agent)

# ============================================================
# MMAP OVERVIEW
# ============================================================

mmap_overview:
  description: "Memory Mapping - 内存映射"
  header: "linux/mm.h"
  icon: "🗺️"
  kernel_version: "2.6+"
  
  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true
  
  overview: |
    mmap 系统调用用于将文件或设备映射到进程地址空间。
    - 文件映射：将文件内容映射到内存
    - 匿名映射：分配不关联文件的内存
    - 共享映射：多进程共享同一映射
    - 私有映射：写时复制 (COW)

# ============================================================
# DATA STRUCTURES
# ============================================================

data_structures:
  vm_area_struct:
    pattern: 'struct vm_area_struct\s*\{'
    description: "虚拟内存区域结构"
    file: "include/linux/mm_types.h"
    fields:
      - name: "vm_start"
        type: "unsigned long"
        description: "区域起始地址"
      - name: "vm_end"
        type: "unsigned long"
        description: "区域结束地址"
      - name: "vm_next"
        type: "struct vm_area_struct *"
        description: "链表下一个"
      - name: "vm_prev"
        type: "struct vm_area_struct *"
        description: "链表上一个"
      - name: "vm_rb"
        type: "struct rb_node"
        description: "红黑树节点"
      - name: "vm_mm"
        type: "struct mm_struct *"
        description: "所属 mm"
      - name: "vm_page_prot"
        type: "pgprot_t"
        description: "页保护标志"
      - name: "vm_flags"
        type: "unsigned long"
        description: "VMA 标志"
      - name: "vm_ops"
        type: "const struct vm_operations_struct *"
        description: "VMA 操作函数"
      - name: "vm_pgoff"
        type: "unsigned long"
        description: "文件偏移(页单位)"
      - name: "vm_file"
        type: "struct file *"
        description: "映射的文件"
      - name: "vm_private_data"
        type: "void *"
        description: "私有数据"

  mm_struct:
    pattern: 'struct mm_struct\s*\{'
    description: "内存描述符"
    file: "include/linux/mm_types.h"
    fields:
      - name: "mmap"
        type: "struct vm_area_struct *"
        description: "VMA 链表头"
      - name: "mm_rb"
        type: "struct rb_root"
        description: "VMA 红黑树"
      - name: "mmap_base"
        type: "unsigned long"
        description: "mmap 区域基址"
      - name: "task_size"
        type: "unsigned long"
        description: "用户空间大小"
      - name: "pgd"
        type: "pgd_t *"
        description: "页全局目录"
      - name: "mm_users"
        type: "atomic_t"
        description: "用户计数"
      - name: "mm_count"
        type: "atomic_t"
        description: "引用计数"
      - name: "map_count"
        type: "int"
        description: "VMA 数量"
      - name: "mmap_lock"
        type: "struct rw_semaphore"
        description: "mmap 读写锁"
      - name: "start_code"
        type: "unsigned long"
        description: "代码段起始"
      - name: "end_code"
        type: "unsigned long"
        description: "代码段结束"
      - name: "start_data"
        type: "unsigned long"
        description: "数据段起始"
      - name: "end_data"
        type: "unsigned long"
        description: "数据段结束"
      - name: "start_brk"
        type: "unsigned long"
        description: "堆起始"
      - name: "brk"
        type: "unsigned long"
        description: "堆当前结束"
      - name: "start_stack"
        type: "unsigned long"
        description: "栈起始"
      - name: "arg_start"
        type: "unsigned long"
        description: "参数起始"
      - name: "arg_end"
        type: "unsigned long"
        description: "参数结束"
      - name: "env_start"
        type: "unsigned long"
        description: "环境变量起始"
      - name: "env_end"
        type: "unsigned long"
        description: "环境变量结束"

  vm_operations_struct:
    pattern: 'struct vm_operations_struct\s*\{'
    description: "VMA 操作结构"
    file: "include/linux/mm.h"
    fields:
      - name: "open"
        type: "void (*)(struct vm_area_struct *)"
        description: "VMA 打开回调"
      - name: "close"
        type: "void (*)(struct vm_area_struct *)"
        description: "VMA 关闭回调"
      - name: "may_split"
        type: "int (*)(struct vm_area_struct *, unsigned long)"
        description: "是否允许分割"
      - name: "mremap"
        type: "int (*)(struct vm_area_struct *)"
        description: "重映射回调"
      - name: "mprotect"
        type: "int (*)(struct vm_area_struct *, unsigned long, unsigned long, unsigned long)"
        description: "保护变更回调"
      - name: "fault"
        type: "vm_fault_t (*)(struct vm_fault *)"
        description: "缺页处理"
      - name: "huge_fault"
        type: "vm_fault_t (*)(struct vm_fault *, enum page_entry_size)"
        description: "大页缺页处理"
      - name: "map_pages"
        type: "vm_fault_t (*)(struct vm_fault *, pgoff_t, pgoff_t)"
        description: "批量映射页"
      - name: "page_mkwrite"
        type: "vm_fault_t (*)(struct vm_fault *)"
        description: "页变可写"
      - name: "pfn_mkwrite"
        type: "vm_fault_t (*)(struct vm_fault *)"
        description: "PFN 变可写"
      - name: "access"
        type: "int (*)(struct vm_area_struct *, unsigned long, void *, int, int)"
        description: "访问 VMA 内存"

# ============================================================
# VMA FLAGS
# ============================================================

vma_flags:

# Linux Kernel ASoC (ALSA SoC) Framework Knowledge Base
#
# Reference: https://www.kernel.org/doc/html/latest/sound/soc/index.html

# ============================================================
# ASoC CORE
# ============================================================

asoc_core:
  description: "ASoC Core - ALSA SoC 核心"
  header: "sound/soc.h"
  icon: "🔊"
  kernel_version: "2.6.26+"

  context:
    type: "process"
    can_sleep: true
    can_schedule: true
    preemptible: true

  bind_patterns:
    # snd_soc_register_component - 注册组件
    - pattern: 'snd_soc_register_component\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<ops>[^)]+)\s*,\s*(?P<dai>[^)]+)\s*,\s*(?P<num_dai>\w+)\s*\)'
      variable_capture: "dev"
      description: "注册 ASoC 组件"

    # snd_soc_unregister_component - 注销组件
    - pattern: 'snd_soc_unregister_component\s*\(\s*(?P<dev>[^)]+)\s*\)'
      variable_capture: "dev"
      description: "注销 ASoC 组件"

    # snd_soc_register_dais - 注册 DAI
    - pattern: 'snd_soc_register_dais\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<dai>[^)]+)\s*,\s*(?P<num_dai>\w+)\s*\)'
      variable_capture: "dev"
      description: "注册 DAI"

    # snd_soc_unregister_dais - 注销 DAI
    - pattern: 'snd_soc_unregister_dais\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<num_dai>\w+)\s*\)'
      variable_capture: "dev"
      description: "注销 DAI"

    # snd_soc_add_pcm_runtime - 添加 PCM 运行时
    - pattern: 'snd_soc_add_pcm_runtime\s*\(\s*(?P<card>[^)]+)\s*,\s*(?P<rtd>[^)]+)\s*\)'
      variable_capture: "card"
      description: "添加 PCM 运行时"


# ============================================================
# ASoC DAI
# ============================================================

asoc_dai:
  description: "DAI - Digital Audio Interface"
  header: "sound/soc-dai.h"
  icon: "🎛️"

  bind_patterns:
    # struct snd_soc_dai_driver
    - pattern: 'struct snd_soc_dai_driver\s*\{[^}]+\}'
      description: "DAI 驱动结构"

    # struct snd_soc_dai
    - pattern: 'struct snd_soc_dai\s*\{[^}]+\}'
      description: "DAI 实例结构"

    # probe/remove
    - pattern: '\.probe\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "DAI probe"

    - pattern: '\.remove\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "DAI remove"

  dai_ops:
    # 设置系统时钟
    set_sysclk:
      pattern: '\.set_sysclk\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "设置系统时钟"

    # 设置 PLL
    set_pll:
      pattern: '\.set_pll\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "设置 PLL"

    # 设置 FLL
    set_fll:
      pattern: '\.set_fll\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "设置 FLL"

    # 启动/停止
    startup:
      pattern: '\.startup\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "启动 DAI"

    shutdown:
      pattern: '\.shutdown\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "关闭 DAI"

    # 设置格式
    set_fmt:
      pattern: '\.set_fmt\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "设置格式"

    set_tdm_slot:
      pattern: '\.set_tdm_slot\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "设置 TDM 槽位"

    set_channel_map:
      pattern: '\.set_channel_map\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "设置通道映射"

    get_channel_map:
      pattern: '\.get_channel_map\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "获取通道映射"

  playback_ops:
    # 播放操作
    prepare:
      pattern: '\.prepare\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "准备播放"

    hw_params:
      pattern: '\.hw_params\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "设置硬件参数"

    hw_free:
      pattern: '\.hw_free\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "释放硬件资源"

    trigger:
      pattern: '\.trigger\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "触发播放"


# ============================================================
# ASoC PLATFORM
# ============================================================

asoc_platform:
  description: "ASoC Platform - 平台驱动"
  header: "sound/soc.h"

  bind_patterns:
    # snd_soc_register_platform - 注册平台
    - pattern: 'snd_soc_register_platform\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<platform>[^)]+)\s*\)'
      variable_capture: "dev"
      description: "注册平台驱动"

    # snd_soc_unregister_platform - 注销平台
    - pattern: 'snd_soc_unregister_platform\s*\(\s*(?P<dev>[^)]+)\s*\)'
      variable_capture: "dev"
      description: "注销平台驱动"


# ============================================================
# ASoC DAI LINK
# ============================================================

asoc_dai_link:
  description: "DAI Link - DAI 连接"
  header: "sound/soc.h"

  bind_patterns:
    # struct snd_soc_dai_link
    - pattern: 'struct snd_soc_dai_link\s*\{[^}]+\}'
      description: "DAI Link 结构"

    # 字段
    - pattern: '\.name\s*=\s*"[^"]*"'
      description: "Link 名称"
    - pattern: '\.stream_name\s*=\s*"[^"]*"'
      description: "流名称"
    - pattern: '\.cpus\s*=\s*'
      description: "CPU DAI"
    - pattern: '\.codecs\s*='
      description: "CODEC"
    - pattern: '\.platform\s*=\s*'
      description: "平台"
    - pattern: '\.dai_fmt\s*='
      description: "DAI 格式"


# ============================================================
# ASoC CARD
# ============================================================

asoc_card:
  description: "ASoC Card - 声卡"
  header: "sound/soc-card.h"
  icon: "📇"

  bind_patterns:
    # snd_soc_register_card - 注册声卡
    - pattern: 'snd_soc_register_card\s*\(\s*(?P<card>[^)]+)\s*\)'
      variable_capture: "card"
      description: "注册声卡"

    # snd_soc_unregister_card - 注销声卡
    - pattern: 'snd_soc_unregister_card\s*\(\s*(?P<card>[^)]+)\s*\)'
      variable_capture: "card"
      description: "注销声卡"

    # devm_snd_soc_register_card - 资源管理注册
    - pattern: 'devm_snd_soc_register_card\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<card>[^)]+)\s*\)'
      variable_capture: "dev"
      description: "资源管理注册声卡"

    # struct snd_soc_card
    - pattern: 'struct snd_soc_card\s*\{[^}]+\}'
      description: "声卡结构"

  card_callbacks:
    # late_probe
    late_probe:
      pattern: '\.late_probe\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "延迟探测"

    # suspend
    suspend:
      pattern: '\.suspend\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "挂起"

    # resume
    resume:
      pattern: '\.resume\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "恢复"

    # set_bias_level
    set_bias_level:
      pattern: '\.set_bias_level\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "设置偏置电平"


# ============================================================
# ASoC COMPONENT
# ============================================================

asoc_component:
  description: "ASoC Component - 组件"
  header: "sound/soc-component.h"

  bind_patterns:
    # struct snd_soc_component_driver
    - pattern: 'struct snd_soc_component_driver\s*\{[^}]+\}'
      description: "组件驱动结构"

  callbacks:
    # probe
    probe:
      pattern: '\.probe\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "组件 probe"

    # remove
    remove:
      pattern: '\.remove\s*=\s*(?P<handler>\w+)'
      handler_capture: "handler"
      description: "组件 remove"

    # 控件
    controls:
      pattern: '\.controls\s*='
      description: "控件数组"

    # DAPM 部件
    dapm_widgets:
      pattern: '\.dapm_widgets\s*='
      description: "DAPM 部件"

    # 路由
    dapm_routes:
      pattern: '\.dapm_routes\s*='
      description: "DAPM 路由"


# ============================================================
# ASoC PCM
# ============================================================

asoc_pcm:
  description: "ASoC PCM - 脉冲编码调制"
  header: "sound/soc-pcm.h"

  bind_patterns:
    # struct snd_soc_pcm_runtime
    - pattern: 'struct snd_soc_pcm_runtime\s*\{[^}]+\}'
      description: "PCM 运行时结构"

    # struct snd_soc_pcm_ops
    - pattern: 'struct snd_soc_pcm_ops\s*\{[^}]+\}'
      description: "PCM 操作结构"


# ============================================================
# ASoC DAPM
# ============================================================

asoc_dapm:
  description: "DAPM - Dynamic Audio Power Management"
  header: "sound/soc-dapm.h"
  icon: "⚡"

  bind_patterns:
    # snd_soc_dapm_new_controls - 新建控件
    - pattern: 'snd_soc_dapm_new_controls\s*\(\s*(?P<dapm>[^)]+)\s*,\s*(?P<widget>[^)]+)\s*,\s*(?P<num>[^)]+)\s*\)'
      variable_capture: "dapm"
      description: "新建 DAPM 控件"

    # snd_soc_dapm_add_routes - 添加路由
    - pattern: 'snd_soc_dapm_add_routes\s*\(\s*(?P<dapm>[^)]+)\s*,\s*(?P<route>[^)]+)\s*,\s*(?P<num>[^)]+)\s*\)'
      variable_capture: "dapm"
      description: "添加 DAPM 路由"

    # snd_soc_dapm_enable_pin - 使能引脚
    - pattern: 'snd_soc_dapm_enable_pin\s*\(\s*(?P<dapm>[^)]+)\s*,\s*(?P<pin>[^)]+)\s*\)'
      variable_capture: "dapm"
      description: "使能 DAPM 引脚"

    # snd_soc_dapm_disable_pin - 禁用引脚
    - pattern: 'snd_soc_dapm_disable_pin\s*\(\s*(?P<dapm>[^)]+)\s*,\s*(?P<pin>[^)]+)\s*\)'
      variable_capture: "dapm"
      description: "禁用 DAPM 引脚"

    # snd_soc_dapm_sync - 同步 DAPM
    - pattern: 'snd_soc_dapm_sync\s*\(\s*(?P<dapm>[^)]+)\s*\)'
      variable_capture: "dapm"
      description: "同步 DAPM"

    # snd_soc_dapm_force_enable_pin - 强制使能引脚
    - pattern: 'snd_soc_dapm_force_enable_pin\s*\(\s*(?P<dapm>[^)]+)\s*,\s*(?P<pin>[^)]+)\s*\)'
      variable_capture: "dapm"
      description: "强制使能 DAPM 引脚"

    # snd_soc_dapm_nc_pin - 断开引脚
    - pattern: 'snd_soc_dapm_nc_pin\s*\(\s*(?P<dapm>[^)]+)\s*,\s*(?P<pin>[^)]+)\s*\)'
      variable_capture: "dapm"
      description: "断开 DAPM 引脚"


# ============================================================
# ASoC DAPM WIDGETS
# ============================================================

asoc_dapm_widget:
  description: "DAPM Widget - DAPM 部件"
  header: "sound/soc-dapm.h"

  bind_patterns:
    # struct snd_soc_dapm_widget
    - pattern: 'struct snd_soc_dapm_widget\s*\{[^}]+\}'
      description: "DAPM 部件结构"

    # 注册控件
    - pattern: 'SND_SOC_DAPM_\w+\(\s*(?P<name>[^,]+)\s*,\s*(?P<sname>[^)]*)\s*\)'
      description: "DAPM 控件类型"

  widget_types:
    SND_SOC_DAPM_INPUT:
      pattern: 'SND_SOC_DAPM_INPUT'
      description: "输入"
    SND_SOC_DAPM_OUTPUT:
      pattern: 'SND_SOC_DAPM_OUTPUT'
      description: "输出"
    SND_SOC_DAPM_MIXER:
      pattern: 'SND_SOC_DAPM_MIXER'
      description: "混音器"
    SND_SOC_DAPM_MUX:
      pattern: 'SND_SOC_DAPM_MUX'
      description: "多路复用器"
    SND_SOC_DAPM_DAC:
      pattern: 'SND_SOC_DAPM_DAC'
      description: "DAC"
    SND_SOC_DAPM_ADC:
      pattern: 'SND_SOC_DAPM_ADC'
      description: "ADC"
    SND_SOC_DAPM_PGA:
      pattern: 'SND_SOC_DAPM_PGA'
      description: "PGA"
    SND_SOC_DAPM_OUT_DRV:
      pattern: 'SND_SOC_DAPM_OUT_DRV'
      description: "输出驱动"
    SND_SOC_DAPM_SUPPLY:
      pattern: 'SND_SOC_DAPM_SUPPLY'
      description: "电源"
    SND_SOC_DAPM_REGULATOR_SUPPLY:
      pattern: 'SND_SOC_DAPM_REGULATOR_SUPPLY'
      description: "稳压器电源"
    SND_SOC_DAPM_CLOCK_SUPPLY:
      pattern: 'SND_SOC_DAPM_CLOCK_SUPPLY'
      description: "时钟电源"


# ============================================================
# ASoC KCONTROLS
# ============================================================

asoc_kcontrol:
  description: "ASoC Controls - 控件"
  header: "sound/soc.h"

  bind_patterns:
    # struct snd_kcontrol_new
    - pattern: 'struct snd_kcontrol_new\s*\{[^}]+\}'
      description: "控件结构"

    # SOC_DOUBLE
    - pattern: 'SOC_DOUBLE\s*\([^)]+\)'
      description: "双通道控件"

    # SOC_SINGLE
    - pattern: 'SOC_SINGLE\s*\([^)]+\)'
      description: "单通道控件"

    # SOC_ENUM
    - pattern: 'SOC_ENUM\s*\([^)]+\)'
      description: "枚举控件"

    # snd_soc_add_codec_controls
    - pattern: 'snd_soc_add_codec_controls\s*\(\s*(?P<codec>[^)]+)\s*,\s*(?P<controls>[^)]+)\s*,\s*(?P<num>\w+)\s*\)'
      variable_capture: "codec"
      description: "添加 CODEC 控件"

    # snd_soc_add_platform_controls
    - pattern: 'snd_soc_add_platform_controls\s*\(\s*(?P<platform>[^)]+)\s*,\s*(?P<controls>[^)]+)\s*,\s*(?P<num>\w+)\s*\)'
      variable_capture: "platform"
      description: "添加平台控件"


# ============================================================
# ASoC MACHINE DRIVER
# ============================================================

asoc_machine:
  description: "ASoC Machine Driver - 机器驱动"
  header: "sound/soc.h"

  bind_patterns:
    # struct snd_soc_card
    - pattern: 'static struct snd_soc_card\s+(?P<name>\w+)\s*='
      variable_capture: "name"
      description: "声卡结构"

    # dai_link
    - pattern: '\.dai_link\s*='
      description: "DAI 链接"


# ============================================================
# ASoC CODEC
# ============================================================

asoc_codec:
  description: "ASoC CODEC - 编解码器"
  header: "sound/soc.h"

  bind_patterns:
    # snd_soc_register_codec - 注册 CODEC
    - pattern: 'snd_soc_register_codec\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<driver>[^)]+)\s*,\s*(?P<data>[^)]+)\s*,\s*(?P<size>\w+)\s*\)'
      variable_capture: "dev"
      description: "注册 CODEC"

    # snd_soc_unregister_codec - 注销 CODEC
    - pattern: 'snd_soc_unregister_codec\s*\(\s*(?P<dev>[^)]+)\s*\)'
      variable_capture: "dev"
      description: "注销 CODEC"


# ============================================================
# ASoC EXAMPLES
# ============================================================

examples:
  - description: "简单 ASoC 驱动"
    code: |
      /* CODEC 驱动 */
      static const struct snd_soc_dapm_widget my_dapm_widgets[] = {
          SND_SOC_DAPM_OUTPUT("HiFi Playback"),
          SND_SOC_DAPM_INPUT("HiFi Capture"),
      };

      static const struct snd_soc_dapm_route my_dapm_routes[] = {
          {"HiFi Playback", NULL, "DAC"},
          {"ADC", NULL, "HiFi Capture"},
      };

      static const struct snd_soc_component_driver my_codec = {
          .dapm_widgets = my_dapm_widgets,
          .num_dapm_widgets = ARRAY_SIZE(my_dapm_widgets),
          .dapm_routes = my_dapm_routes,
          .num_dapm_routes = ARRAY_SIZE(my_dapm_routes),
      };

      static struct snd_soc_dai_driver my_dai = {
          .name = "my-codec-dai",
          .playback = {
              .stream_name = "Playback",
              .channels_min = 1,
              .channels_max = 2,
              .rates = SNDRV_PCM_RATE_8000_48000,
              .formats = SNDRV_PCM_FMTBIT_S16_LE,
          },
          .capture = {
              .stream_name = "Capture",
              .channels_min = 1,
              .channels_max = 2,
              .rates = SNDRV_PCM_RATE_8000_48000,
              .formats = SNDRV_PCM_FMTBIT_S16_LE,
          },
      };

      static int my_codec_probe(struct snd_soc_component *component) {
          /* 初始化硬件 */
          my_codec_set_bias_level(component, SND_SOC_BIAS_STANDBY);
          return 0;
      }

      static const struct snd_soc_codec_driver soc_codec_dev_my = {
          .probe = my_codec_probe,
      };

      /* 机器驱动 */
      static struct snd_soc_dai_link my_dai_link = {
          .name = "my-codec",
          .stream_name = "my-codec HiFi",
          .codec_dai_name = "my-codec-dai",
          .dai_fmt = SND_SOC_DAIFMT_I2S | SND_SOC_DAIFMT_NB_NF,
      };

      static struct snd_soc_card my_card = {
          .name = "my-board",
          .dai_link = &my_dai_link,
          .num_links = 1,
      };

      static int my_probe(struct platform_device *pdev) {
          struct snd_soc_card *card = &my_card;
          int ret;

          /* 设置 card 私有数据 */
          platform_set_drvdata(pdev, card);

          /* 注册声卡 */
          ret = devm_snd_soc_register_card(&pdev->dev, card);
          if (ret)
              dev_err(&pdev->dev, "Failed to register card\n");

          return ret;
      }

  - description: "带有 DAPM 电源管理的驱动"
    code: |
      static int my_set_bias_level(struct snd_soc_component *component,
                                   enum snd_soc_bias_level level) {
          struct my_priv *priv = snd_soc_component_get_drvdata(component);

          switch (level) {
          case SND_SOC_BIAS_PREPARE:
              /* 准备偏置 */
              regulator_enable(priv->vdd);
              break;
          case SND_SOC_BIAS_STANDBY:
              /* 待机偏置 */
              if (snd_soc_component_get_bias_level(component) == SND_SOC_BIAS_PREPARE)
                  regulator_disable(priv->vdd);
              break;
          case SND_SOC_BIAS_OFF:
              regulator_disable(priv->vdd);
              break;
          default:
              break;
          }
          return 0;
      }

      static const struct snd_soc_component_driver my_codec = {
          .set_bias_level = my_set_bias_level,
          .controls = my_controls,
          .num_controls = ARRAY_SIZE(my_controls),
          .dapm_widgets = my_widgets,
          .num_dapm_widgets = ARRAY_SIZE(my_widgets),
          .dapm_routes = my_routes,
          .num_dapm_routes = ARRAY_SIZE(my_routes),
      };

  - description: "完整 CODEC 驱动示例"
    kernel_version: "5.10+"
    code: |
      #include <linux/module.h>
      #include <linux/i2c.h>
      #include <linux/regmap.h>
      #include <linux/regulator/consumer.h>
      #include <sound/soc.h>
      #include <sound/pcm_params.h>
      #include <sound/tlv.h>
      
      #define MY_CODEC_DAC_VOL     0x00
      #define MY_CODEC_ADC_VOL     0x01
      #define MY_CODEC_POWER_CTRL  0x02
      #define MY_CODEC_DAC_CTRL    0x03
      #define MY_CODEC_ADC_CTRL    0x04
      #define MY_CODEC_CLK_CTRL    0x05
      
      struct my_codec_priv {
          struct regmap *regmap;
          struct regulator *vdd;
          struct regulator *vddio;
          struct clk *mclk;
          int sysclk;
          int fmt;
      };
      
      /* 音量控制 TLV */
      static DECLARE_TLV_DB_SCALE(dac_vol_tlv, -12700, 100, 1);
      static DECLARE_TLV_DB_SCALE(adc_vol_tlv, -12700, 100, 1);
      
      /* 控件定义 */
      static const struct snd_kcontrol_new my_codec_controls[] = {
          SOC_SINGLE_TLV("DAC Playback Volume", MY_CODEC_DAC_VOL,
                         0, 127, 0, dac_vol_tlv),
          SOC_SINGLE_TLV("ADC Capture Volume", MY_CODEC_ADC_VOL,
                         0, 127, 0, adc_vol_tlv),
          SOC_SINGLE("DAC Mute", MY_CODEC_DAC_CTRL, 7, 1, 0),
          SOC_SINGLE("ADC Mute", MY_CODEC_ADC_CTRL, 7, 1, 0),
      };
      
      /* DAPM 部件 */
      static const struct snd_soc_dapm_widget my_codec_widgets[] = {
          /* 输入 */
          SND_SOC_DAPM_INPUT("LINEIN"),
          SND_SOC_DAPM_INPUT("MIC1"),
          SND_SOC_DAPM_INPUT("MIC2"),
          
          /* 输出 */
          SND_SOC_DAPM_OUTPUT("HPOUTL"),
          SND_SOC_DAPM_OUTPUT("HPOUTR"),
          SND_SOC_DAPM_OUTPUT("LINEOUT"),
          
          /* 电源 */
          SND_SOC_DAPM_SUPPLY("VREF", MY_CODEC_POWER_CTRL, 0, 0, NULL, 0),
          SND_SOC_DAPM_SUPPLY("VMID", MY_CODEC_POWER_CTRL, 1, 0, NULL, 0),
          
          /* ADC/DAC */
          SND_SOC_DAPM_ADC("ADC", "Capture", MY_CODEC_POWER_CTRL, 4, 0),
          SND_SOC_DAPM_DAC("DAC", "Playback", MY_CODEC_POWER_CTRL, 5, 0),
          
          /* 混音器 */
          SND_SOC_DAPM_MIXER("Output Mixer", MY_CODEC_POWER_CTRL, 6, 0,
                              NULL, 0),
          
          /* PGA */
          SND_SOC_DAPM_PGA("Input PGA", MY_CODEC_POWER_CTRL, 3, 0, NULL, 0),
          
          /* 耳机驱动 */
          SND_SOC_DAPM_OUT_DRV("HP Driver", MY_CODEC_POWER_CTRL, 7, 0,
                               NULL, 0),
      };
      
      /* DAPM 路由 */
      static const struct snd_soc_dapm_route my_codec_routes[] = {
          /* 输入路径 */
          {"Input PGA", NULL, "LINEIN"},
          {"Input PGA", NULL, "MIC1"},
          {"ADC", NULL, "Input PGA"},
          {"ADC", NULL, "VREF"},
          {"ADC", NULL, "VMID"},
          
          /* 输出路径 */
          {"Output Mixer", NULL, "DAC"},
          {"HP Driver", NULL, "Output Mixer"},
          {"HPOUTL", NULL, "HP Driver"},
          {"HPOUTR", NULL, "HP Driver"},
          {"LINEOUT", NULL, "Output Mixer"},
          
          /* 电源依赖 */
          {"DAC", NULL, "VREF"},
          {"DAC", NULL, "VMID"},
      };
      
      /* 设置系统时钟 */
      static int my_codec_set_sysclk(struct snd_soc_component *component,
                                      int clk_id, int source,
                                      unsigned int freq, int dir)
      {
          struct my_codec_priv *priv =
              snd_soc_component_get_drvdata(component);
          
          priv->sysclk = freq;
          return 0;
      }
      
      /* 设置 DAI 格式 */
      static int my_codec_set_fmt(struct snd_soc_dai *dai, unsigned int fmt)
      {
          struct snd_soc_component *component = dai->component;
          struct my_codec_priv *priv =
              snd_soc_component_get_drvdata(component);
          u8 ctrl = 0;
          
          /* 主/从模式 */
          switch (fmt & SND_SOC_DAIFMT_CLOCK_PROVIDER_MASK) {
          case SND_SOC_DAIFMT_CBC_CFC:
              /* Codec 是 slave */
              break;
          case SND_SOC_DAIFMT_CBP_CFP:
              /* Codec 是 master */
              ctrl |= 0x80;
              break;
          default:
              return -EINVAL;
          }
          
          /* 数据格式 */
          switch (fmt & SND_SOC_DAIFMT_FORMAT_MASK) {
          case SND_SOC_DAIFMT_I2S:
              ctrl |= 0x00;
              break;
          case SND_SOC_DAIFMT_LEFT_J:
              ctrl |= 0x01;
              break;
          case SND_SOC_DAIFMT_RIGHT_J:
              ctrl |= 0x02;
              break;
          case SND_SOC_DAIFMT_DSP_A:
              ctrl |= 0x03;
              break;
          default:
              return -EINVAL;
          }
          
          priv->fmt = fmt;
          return regmap_write(priv->regmap, MY_CODEC_CLK_CTRL, ctrl);
      }
      
      /* 设置硬件参数 */
      static int my_codec_hw_params(struct snd_pcm_substream *substream,
                                     struct snd_pcm_hw_params *params,
                                     struct snd_soc_dai *dai)
      {
          struct snd_soc_component *component = dai->component;
          struct my_codec_priv *priv =
              snd_soc_component_get_drvdata(component);
          u8 ctrl = 0;
          
          /* 位宽 */
          switch (params_width(params)) {
          case 16:
              ctrl |= 0x00;
              break;
          case 20:
              ctrl |= 0x10;
              break;
          case 24:
              ctrl |= 0x20;
              break;
          case 32:
              ctrl |= 0x30;
              break;
          default:
              return -EINVAL;
          }
          
          /* 采样率 - 计算分频 */
          /* ... */
          
          return regmap_update_bits(priv->regmap, MY_CODEC_DAC_CTRL,
                                     0x30, ctrl);
      }
      
      static const struct snd_soc_dai_ops my_codec_dai_ops = {
          .set_fmt = my_codec_set_fmt,
          .hw_params = my_codec_hw_params,
      };
      
      static struct snd_soc_dai_driver my_codec_dai = {
          .name = "my-codec-hifi",
          .playback = {
              .stream_name = "Playback",
              .channels_min = 1,
              .channels_max = 2,
              .rates = SNDRV_PCM_RATE_8000_192000,
              .formats = SNDRV_PCM_FMTBIT_S16_LE |
                         SNDRV_PCM_FMTBIT_S24_LE |
                         SNDRV_PCM_FMTBIT_S32_LE,
          },
          .capture = {
              .stream_name = "Capture",
              .channels_min = 1,
              .channels_max = 2,
              .rates = SNDRV_PCM_RATE_8000_96000,
              .formats = SNDRV_PCM_FMTBIT_S16_LE |
                         SNDRV_PCM_FMTBIT_S24_LE,
          },
          .ops = &my_codec_dai_ops,
      };
      
      static const struct snd_soc_component_driver my_codec_driver = {
          .set_sysclk = my_codec_set_sysclk,
          .controls = my_codec_controls,
          .num_controls = ARRAY_SIZE(my_codec_controls),
          .dapm_widgets = my_codec_widgets,
          .num_dapm_widgets = ARRAY_SIZE(my_codec_widgets),
          .dapm_routes = my_codec_routes,
          .num_dapm_routes = ARRAY_SIZE(my_codec_routes),
          .idle_bias_on = 1,
          .use_pmdown_time = 1,
          .endianness = 1,
      };
      
      static int my_codec_probe(struct i2c_client *client)
      {
          struct my_codec_priv *priv;
          int ret;
          
          priv = devm_kzalloc(&client->dev, sizeof(*priv), GFP_KERNEL);
          if (!priv)
              return -ENOMEM;
          
          priv->regmap = devm_regmap_init_i2c(client, &my_regmap_config);
          if (IS_ERR(priv->regmap))
              return PTR_ERR(priv->regmap);
          
          i2c_set_clientdata(client, priv);
          
          ret = devm_snd_soc_register_component(&client->dev,
                                                 &my_codec_driver,
                                                 &my_codec_dai, 1);
          return ret;
      }

  - description: "Platform 驱动示例 (I2S Controller)"
    kernel_version: "5.10+"
    code: |
      #include <linux/module.h>
      #include <linux/platform_device.h>
      #include <linux/clk.h>
      #include <linux/dma-mapping.h>
      #include <sound/soc.h>
      #include <sound/pcm_params.h>
      #include <sound/dmaengine_pcm.h>
      
      #define I2S_CTRL         0x00
      #define I2S_STAT         0x04
      #define I2S_FIFO         0x08
      #define I2S_CLK_DIV      0x0C
      
      struct my_i2s {
          void __iomem *base;
          struct clk *clk;
          struct clk *pclk;
          struct snd_dmaengine_dai_dma_data playback_dma_data;
          struct snd_dmaengine_dai_dma_data capture_dma_data;
      };
      
      static int my_i2s_set_fmt(struct snd_soc_dai *dai, unsigned int fmt)
      {
          struct my_i2s *i2s = snd_soc_dai_get_drvdata(dai);
          u32 ctrl = readl(i2s->base + I2S_CTRL);
          
          /* 主/从模式 */
          ctrl &= ~(0x3 << 4);
          switch (fmt & SND_SOC_DAIFMT_CLOCK_PROVIDER_MASK) {
          case SND_SOC_DAIFMT_CBC_CFC:
              ctrl |= (0x0 << 4);  /* Slave */
              break;
          case SND_SOC_DAIFMT_CBP_CFP:
              ctrl |= (0x3 << 4);  /* Master */
              break;
          default:
              return -EINVAL;
          }
          
          /* 数据格式 */
          ctrl &= ~(0x3 << 0);
          switch (fmt & SND_SOC_DAIFMT_FORMAT_MASK) {
          case SND_SOC_DAIFMT_I2S:
              ctrl |= (0x0 << 0);
              break;
          case SND_SOC_DAIFMT_LEFT_J:
              ctrl |= (0x1 << 0);
              break;
          case SND_SOC_DAIFMT_RIGHT_J:
              ctrl |= (0x2 << 0);
              break;
          default:
              return -EINVAL;
          }
          
          writel(ctrl, i2s->base + I2S_CTRL);
          return 0;
      }
      
      static int my_i2s_hw_params(struct snd_pcm_substream *substream,
                                   struct snd_pcm_hw_params *params,
                                   struct snd_soc_dai *dai)
      {
          struct my_i2s *i2s = snd_soc_dai_get_drvdata(dai);
          u32 ctrl = readl(i2s->base + I2S_CTRL);
          unsigned int channels = params_channels(params);
          unsigned int rate = params_rate(params);
          unsigned int div;
          
          /* 设置通道数 */
          ctrl &= ~(0x3 << 8);
          if (channels == 2)
              ctrl |= (0x1 << 8);
          
          /* 设置位宽 */
          ctrl &= ~(0x3 << 10);
          switch (params_width(params)) {
          case 16:
              ctrl |= (0x0 << 10);
              break;
          case 24:
              ctrl |= (0x1 << 10);
              break;
          case 32:
              ctrl |= (0x2 << 10);
              break;
          default:
              return -EINVAL;
          }
          
          writel(ctrl, i2s->base + I2S_CTRL);
          
          /* 设置时钟分频 */
          div = clk_get_rate(i2s->clk) / (rate * channels * 
                                           params_width(params) * 2);
          writel(div, i2s->base + I2S_CLK_DIV);
          
          return 0;
      }
      
      static int my_i2s_trigger(struct snd_pcm_substream *substream,
                                 int cmd, struct snd_soc_dai *dai)
      {
          struct my_i2s *i2s = snd_soc_dai_get_drvdata(dai);
          u32 ctrl = readl(i2s->base + I2S_CTRL);
          
          switch (cmd) {
          case SNDRV_PCM_TRIGGER_START:
          case SNDRV_PCM_TRIGGER_RESUME:
          case SNDRV_PCM_TRIGGER_PAUSE_RELEASE:
              if (substream->stream == SNDRV_PCM_STREAM_PLAYBACK)
                  ctrl |= (1 << 16);  /* TX Enable */
              else
                  ctrl |= (1 << 17);  /* RX Enable */
              break;
          case SNDRV_PCM_TRIGGER_STOP:
          case SNDRV_PCM_TRIGGER_SUSPEND:
          case SNDRV_PCM_TRIGGER_PAUSE_PUSH:
              if (substream->stream == SNDRV_PCM_STREAM_PLAYBACK)
                  ctrl &= ~(1 << 16);
              else
                  ctrl &= ~(1 << 17);
              break;
          default:
              return -EINVAL;
          }
          
          writel(ctrl, i2s->base + I2S_CTRL);
          return 0;
      }
      
      static int my_i2s_dai_probe(struct snd_soc_dai *dai)
      {
          struct my_i2s *i2s = snd_soc_dai_get_drvdata(dai);
          
          snd_soc_dai_init_dma_data(dai,
                                     &i2s->playback_dma_data,
                                     &i2s->capture_dma_data);
          return 0;
      }
      
      static const struct snd_soc_dai_ops my_i2s_dai_ops = {
          .set_fmt = my_i2s_set_fmt,
          .hw_params = my_i2s_hw_params,
          .trigger = my_i2s_trigger,
      };
      
      static struct snd_soc_dai_driver my_i2s_dai = {
          .name = "my-i2s",
          .probe = my_i2s_dai_probe,
          .playback = {
              .channels_min = 2,
              .channels_max = 2,
              .rates = SNDRV_PCM_RATE_8000_192000,
              .formats = SNDRV_PCM_FMTBIT_S16_LE |
                         SNDRV_PCM_FMTBIT_S24_LE |
                         SNDRV_PCM_FMTBIT_S32_LE,
          },
          .capture = {
              .channels_min = 2,
              .channels_max = 2,
              .rates = SNDRV_PCM_RATE_8000_96000,
              .formats = SNDRV_PCM_FMTBIT_S16_LE |
                         SNDRV_PCM_FMTBIT_S24_LE,
          },
          .ops = &my_i2s_dai_ops,
          .symmetric_rate = 1,
      };
      
      static const struct snd_soc_component_driver my_i2s_component = {
          .name = "my-i2s",
          .legacy_dai_naming = 1,
      };
      
      static int my_i2s_probe(struct platform_device *pdev)
      {
          struct my_i2s *i2s;
          struct resource *res;
          int ret;
          
          i2s = devm_kzalloc(&pdev->dev, sizeof(*i2s), GFP_KERNEL);
          if (!i2s)
              return -ENOMEM;
          
          i2s->base = devm_platform_ioremap_resource(pdev, 0);
          if (IS_ERR(i2s->base))
              return PTR_ERR(i2s->base);
          
          i2s->clk = devm_clk_get(&pdev->dev, "i2s");
          if (IS_ERR(i2s->clk))
              return PTR_ERR(i2s->clk);
          
          /* 配置 DMA */
          res = platform_get_resource(pdev, IORESOURCE_MEM, 0);
          i2s->playback_dma_data.addr = res->start + I2S_FIFO;
          i2s->playback_dma_data.maxburst = 4;
          i2s->capture_dma_data.addr = res->start + I2S_FIFO;
          i2s->capture_dma_data.maxburst = 4;
          
          platform_set_drvdata(pdev, i2s);
          
          ret = devm_snd_soc_register_component(&pdev->dev,
                                                 &my_i2s_component,
                                                 &my_i2s_dai, 1);
          if (ret)
              return ret;
          
          /* 注册 DMA PCM */
          return devm_snd_dmaengine_pcm_register(&pdev->dev, NULL, 0);
      }

  - description: "Machine 驱动示例"
    kernel_version: "5.10+"
    code: |
      #include <linux/module.h>
      #include <linux/platform_device.h>
      #include <linux/of.h>
      #include <sound/soc.h>
      #include <sound/jack.h>
      
      struct my_machine_priv {
          struct snd_soc_jack headphone_jack;
          struct gpio_desc *hp_det_gpio;
      };
      
      /* 耳机检测 */
      static struct snd_soc_jack_pin hp_jack_pins[] = {
          {
              .pin = "Headphone",
              .mask = SND_JACK_HEADPHONE,
          },
      };
      
      static struct snd_soc_jack_gpio hp_jack_gpios[] = {
          {
              .name = "headphone detect",
              .report = SND_JACK_HEADPHONE,
              .debounce_time = 200,
          },
      };
      
      /* DAI link 初始化 */
      static int my_machine_init(struct snd_soc_pcm_runtime *rtd)
      {
          struct snd_soc_card *card = rtd->card;
          struct my_machine_priv *priv = snd_soc_card_get_drvdata(card);
          struct snd_soc_component *codec = asoc_rtd_to_codec(rtd, 0)->component;
          int ret;
          
          /* 设置耳机插孔检测 */
          ret = snd_soc_card_jack_new_pins(card, "Headphone",
                                            SND_JACK_HEADPHONE,
                                            &priv->headphone_jack,
                                            hp_jack_pins,
                                            ARRAY_SIZE(hp_jack_pins));
          if (ret)
              return ret;
          
          /* 使用 GPIO 检测 */
          hp_jack_gpios[0].gpiod_dev = card->dev;
          ret = snd_soc_jack_add_gpios(&priv->headphone_jack,
                                        ARRAY_SIZE(hp_jack_gpios),
                                        hp_jack_gpios);
          
          return ret;
      }
      
      /* 声卡延迟初始化 */
      static int my_machine_late_probe(struct snd_soc_card *card)
      {
          /* 在所有组件探测完成后调用 */
          /* 可以做一些全局设置 */
          return 0;
      }
      
      /* DAI link 操作 */
      static int my_machine_hw_params(struct snd_pcm_substream *substream,
                                       struct snd_pcm_hw_params *params)
      {
          struct snd_soc_pcm_runtime *rtd = substream->private_data;
          struct snd_soc_dai *codec_dai = asoc_rtd_to_codec(rtd, 0);
          struct snd_soc_dai *cpu_dai = asoc_rtd_to_cpu(rtd, 0);
          unsigned int rate = params_rate(params);
          unsigned int mclk;
          int ret;
          
          /* 根据采样率设置 MCLK */
          if (rate % 8000 == 0)
              mclk = 12288000;  /* 48kHz 系列 */
          else
              mclk = 11289600;  /* 44.1kHz 系列 */
          
          ret = snd_soc_dai_set_sysclk(codec_dai, 0, mclk,
                                        SND_SOC_CLOCK_IN);
          if (ret)
              return ret;
          
          ret = snd_soc_dai_set_sysclk(cpu_dai, 0, mclk,
                                        SND_SOC_CLOCK_OUT);
          return ret;
      }
      
      static const struct snd_soc_ops my_machine_ops = {
          .hw_params = my_machine_hw_params,
      };
      
      /* DAI link 定义 */
      SND_SOC_DAILINK_DEFS(hifi,
          DAILINK_COMP_ARRAY(COMP_CPU("my-i2s")),
          DAILINK_COMP_ARRAY(COMP_CODEC("my-codec.0-001a", "my-codec-hifi")),
          DAILINK_COMP_ARRAY(COMP_PLATFORM("my-i2s")));
      
      static struct snd_soc_dai_link my_machine_dai_links[] = {
          {
              .name = "HiFi",
              .stream_name = "HiFi",
              .dai_fmt = SND_SOC_DAIFMT_I2S |
                         SND_SOC_DAIFMT_NB_NF |
                         SND_SOC_DAIFMT_CBC_CFC,
              .init = my_machine_init,
              .ops = &my_machine_ops,
              SND_SOC_DAILINK_REG(hifi),
          },
      };
      
      /* DAPM widgets（板级） */
      static const struct snd_soc_dapm_widget my_machine_widgets[] = {
          SND_SOC_DAPM_HP("Headphone", NULL),
          SND_SOC_DAPM_SPK("Speaker", NULL),
          SND_SOC_DAPM_MIC("Microphone", NULL),
      };
      
      /* DAPM routes（板级） */
      static const struct snd_soc_dapm_route my_machine_routes[] = {
          {"Headphone", NULL, "HPOUTL"},
          {"Headphone", NULL, "HPOUTR"},
          {"Speaker", NULL, "LINEOUT"},
          {"MIC1", NULL, "Microphone"},
      };
      
      static struct snd_soc_card my_machine_card = {
          .name = "My-Sound-Card",
          .owner = THIS_MODULE,
          .dai_link = my_machine_dai_links,
          .num_links = ARRAY_SIZE(my_machine_dai_links),
          .dapm_widgets = my_machine_widgets,
          .num_dapm_widgets = ARRAY_SIZE(my_machine_widgets),
          .dapm_routes = my_machine_routes,
          .num_dapm_routes = ARRAY_SIZE(my_machine_routes),
          .late_probe = my_machine_late_probe,
          .fully_routed = true,
      };
      
      static int my_machine_probe(struct platform_device *pdev)
      {
          struct my_machine_priv *priv;
          struct device_node *np = pdev->dev.of_node;
          struct device_node *codec_np, *cpu_np;
          int ret;
          
          priv = devm_kzalloc(&pdev->dev, sizeof(*priv), GFP_KERNEL);
          if (!priv)
              return -ENOMEM;
          
          /* 从设备树获取 codec 和 cpu 节点 */
          codec_np = of_parse_phandle(np, "audio-codec", 0);
          cpu_np = of_parse_phandle(np, "audio-cpu", 0);
          
          if (!codec_np || !cpu_np) {
              dev_err(&pdev->dev, "Missing phandle\n");
              return -EINVAL;
          }
          
          /* 更新 DAI link */
          my_machine_dai_links[0].codecs->of_node = codec_np;
          my_machine_dai_links[0].cpus->of_node = cpu_np;
          my_machine_dai_links[0].platforms->of_node = cpu_np;
          
          my_machine_card.dev = &pdev->dev;
          snd_soc_card_set_drvdata(&my_machine_card, priv);
          
          ret = devm_snd_soc_register_card(&pdev->dev, &my_machine_card);
          if (ret)
              dev_err(&pdev->dev, "Failed to register card: %d\n", ret);
          
          of_node_put(codec_np);
          of_node_put(cpu_np);
          
          return ret;
      }



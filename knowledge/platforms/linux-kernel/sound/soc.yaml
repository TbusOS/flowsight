# ADVANCED DATA STRUCTURES
# ============================================================

advanced_data_structures:
  snd_soc_dai_driver:
    pattern: 'struct snd_soc_dai_driver\s*\{'
    description: "DAI 驱动结构"
    file: "include/sound/soc-dai.h"
    fields:
      - name: "name"
        type: "const char *"
        description: "DAI 名称"
      - name: "probe"
        type: "int (*)(struct snd_soc_dai *)"
        description: "探测回调"
      - name: "remove"
        type: "void (*)(struct snd_soc_dai *)"
        description: "移除回调"
      - name: "playback"
        type: "struct snd_soc_pcm_stream"
        description: "播放能力"
      - name: "capture"
        type: "struct snd_soc_pcm_stream"
        description: "录制能力"
      - name: "ops"
        type: "const struct snd_soc_dai_ops *"
        description: "DAI 操作"
      - name: "symmetric_rate"
        type: "unsigned int"
        description: "播放/录制使用相同采样率"

  snd_soc_component_driver:
    pattern: 'struct snd_soc_component_driver\s*\{'
    description: "组件驱动结构"
    file: "include/sound/soc-component.h"
    fields:
      - name: "name"
        type: "const char *"
        description: "组件名称"
      - name: "probe"
        type: "int (*)(struct snd_soc_component *)"
        description: "探测回调"
      - name: "remove"
        type: "void (*)(struct snd_soc_component *)"
        description: "移除回调"
      - name: "controls"
        type: "const struct snd_kcontrol_new *"
        description: "控件数组"
      - name: "dapm_widgets"
        type: "const struct snd_soc_dapm_widget *"
        description: "DAPM 部件"
      - name: "dapm_routes"
        type: "const struct snd_soc_dapm_route *"
        description: "DAPM 路由"
      - name: "set_sysclk"
        type: "int (*)(struct snd_soc_component *, ...)"
        description: "设置系统时钟"
      - name: "set_bias_level"
        type: "int (*)(struct snd_soc_component *, ...)"
        description: "设置偏置电平"

  snd_soc_card:
    pattern: 'struct snd_soc_card\s*\{'
    description: "声卡结构"
    file: "include/sound/soc-card.h"
    fields:
      - name: "name"
        type: "const char *"
        description: "声卡名称"
      - name: "dai_link"
        type: "struct snd_soc_dai_link *"
        description: "DAI 连接数组"
      - name: "num_links"
        type: "int"
        description: "连接数量"
      - name: "dapm_widgets"
        type: "const struct snd_soc_dapm_widget *"
        description: "板级 DAPM 部件"
      - name: "dapm_routes"
        type: "const struct snd_soc_dapm_route *"
        description: "板级 DAPM 路由"
      - name: "late_probe"
        type: "int (*)(struct snd_soc_card *)"
        description: "延迟探测回调"
      - name: "fully_routed"
        type: "bool"
        description: "是否完全路由"


# ============================================================
# CALL CHAINS
# ============================================================

call_chains:
  asoc_probe:
    description: "ASoC 探测流程"
    chain:
      - caller: "platform_driver_probe"
        callee: "machine_probe"
        description: "Machine 驱动探测"
      - caller: "machine_probe"
        callee: "devm_snd_soc_register_card"
        description: "注册声卡"
      - caller: "snd_soc_register_card"
        callee: "snd_soc_instantiate_card"
        description: "实例化声卡"
      - caller: "snd_soc_instantiate_card"
        callee: "soc_bind_dai_link"
        description: "绑定 DAI 连接"
      - caller: "soc_bind_dai_link"
        callee: "codec_driver.probe"
        description: "CODEC 探测"
      - caller: "soc_bind_dai_link"
        callee: "platform_driver.probe"
        description: "Platform 探测"
      - caller: "snd_soc_instantiate_card"
        callee: "snd_soc_dapm_new_widgets"
        description: "创建 DAPM 部件"
      - caller: "snd_soc_instantiate_card"
        callee: "snd_card_register"
        description: "注册 ALSA 声卡"

  asoc_playback:
    description: "ASoC 播放流程"
    chain:
      - caller: "用户空间"
        callee: "snd_pcm_open"
        description: "打开 PCM"
      - caller: "用户空间"
        callee: "snd_pcm_hw_params"
        description: "设置硬件参数"
      - caller: "hw_params"
        callee: "soc_pcm_hw_params"
        description: "ASoC hw_params"
      - caller: "soc_pcm_hw_params"
        callee: "dai_link->ops->hw_params"
        description: "Machine hw_params"
      - caller: "soc_pcm_hw_params"
        callee: "codec_dai->driver->ops->hw_params"
        description: "CODEC hw_params"
      - caller: "soc_pcm_hw_params"
        callee: "cpu_dai->driver->ops->hw_params"
        description: "CPU hw_params"
      - caller: "用户空间"
        callee: "snd_pcm_writei"
        description: "写入数据"
      - caller: "用户空间"
        callee: "snd_pcm_start"
        description: "开始播放"
      - caller: "snd_pcm_start"
        callee: "trigger(START)"
        description: "触发播放"


# ============================================================
# KERNEL VERSION NOTES
# ============================================================

kernel_version_notes:
  v2_6_26:
    description: "ASoC 框架引入"
    changes:
      - "基本的 CODEC/Platform/Machine 分层"
      - "DAPM 支持"

  v3_0:
    description: "多组件支持"
    changes:
      - "一个 DAI link 可以有多个 CODEC"
      - "改进的 DAPM"

  v4_0:
    description: "组件化重构"
    changes:
      - "snd_soc_component 统一 CODEC 和 Platform"
      - "新的注册 API"

  v4_19:
    description: "DAI link 改进"
    changes:
      - "SND_SOC_DAILINK_DEFS 宏"
      - "简化的 DAI link 定义"

  v5_4:
    description: "时钟提供者"
    changes:
      - "SND_SOC_DAIFMT_CBC_CFC 等新常量"
      - "替代旧的 CBS_CFS"

  v5_10:
    description: "现代化"
    changes:
      - "移除废弃的 CODEC 驱动 API"
      - "改进的电源管理"

  v6_0:
    description: "进一步清理"
    changes:
      - "移除更多废弃 API"
      - "性能优化"


# ============================================================
# DEBUGGING
# ============================================================

debugging:
  debugfs:
    path: "/sys/kernel/debug/asoc/"
    files:
      - name: "codecs"
        description: "已注册的 CODEC"
      - name: "dais"
        description: "已注册的 DAI"
      - name: "<card>/"
        description: "声卡目录"
      - name: "<card>/dapm"
        description: "DAPM 状态"

  tracepoints:
    - name: "asoc:snd_soc_bias_level_start"
    - name: "asoc:snd_soc_bias_level_done"
    - name: "asoc:snd_soc_dapm_start"
    - name: "asoc:snd_soc_dapm_done"
    - name: "asoc:snd_soc_dapm_widget_power"

  common_issues:
    no_sound:
      symptom: "没有声音输出"
      debug_steps:
        - "检查 amixer 控件设置"
        - "查看 DAPM 状态（debugfs）"
        - "验证时钟配置"
        - "检查 DMA 传输"

    underrun:
      symptom: "播放时出现 XRUN"
      causes:
        - "缓冲区太小"
        - "DMA 配置问题"
        - "CPU 负载过高"

    # SOC_SINGLE
    - pattern: 'SOC_SINGLE\s*\([^)]+\)'
      description: "单通道控件"

    # SOC_ENUM
    - pattern: 'SOC_ENUM\s*\([^)]+\)'
      description: "枚举控件"

    # snd_soc_add_codec_controls
    - pattern: 'snd_soc_add_codec_controls\s*\(\s*(?P<codec>[^)]+)\s*,\s*(?P<controls>[^)]+)\s*,\s*(?P<num>\w+)\s*\)'
      variable_capture: "codec"
      description: "添加 CODEC 控件"

    # snd_soc_add_platform_controls
    - pattern: 'snd_soc_add_platform_controls\s*\(\s*(?P<platform>[^)]+)\s*,\s*(?P<controls>[^)]+)\s*,\s*(?P<num>\w+)\s*\)'
      variable_capture: "platform"
      description: "添加平台控件"


# ============================================================
# ASoC MACHINE DRIVER
# ============================================================

asoc_machine:
  description: "ASoC Machine Driver - 机器驱动"
  header: "sound/soc.h"

  bind_patterns:
    # struct snd_soc_card
    - pattern: 'static struct snd_soc_card\s+(?P<name>\w+)\s*='
      variable_capture: "name"
      description: "声卡结构"

    # dai_link
    - pattern: '\.dai_link\s*='
      description: "DAI 链接"


# ============================================================
# ASoC CODEC
# ============================================================

asoc_codec:
  description: "ASoC CODEC - 编解码器"
  header: "sound/soc.h"

  bind_patterns:
    # snd_soc_register_codec - 注册 CODEC
    - pattern: 'snd_soc_register_codec\s*\(\s*(?P<dev>[^)]+)\s*,\s*(?P<driver>[^)]+)\s*,\s*(?P<data>[^)]+)\s*,\s*(?P<size>\w+)\s*\)'
      variable_capture: "dev"
      description: "注册 CODEC"

    # snd_soc_unregister_codec - 注销 CODEC
    - pattern: 'snd_soc_unregister_codec\s*\(\s*(?P<dev>[^)]+)\s*\)'
      variable_capture: "dev"
      description: "注销 CODEC"


# ============================================================
# ASoC EXAMPLES
# ============================================================

examples:
  - description: "简单 ASoC 驱动"
    code: |
      /* CODEC 驱动 */
      static const struct snd_soc_dapm_widget my_dapm_widgets[] = {
          SND_SOC_DAPM_OUTPUT("HiFi Playback"),
          SND_SOC_DAPM_INPUT("HiFi Capture"),
      };

      static const struct snd_soc_dapm_route my_dapm_routes[] = {
          {"HiFi Playback", NULL, "DAC"},
          {"ADC", NULL, "HiFi Capture"},
      };

      static const struct snd_soc_component_driver my_codec = {
          .dapm_widgets = my_dapm_widgets,
          .num_dapm_widgets = ARRAY_SIZE(my_dapm_widgets),
          .dapm_routes = my_dapm_routes,
          .num_dapm_routes = ARRAY_SIZE(my_dapm_routes),
      };

      static struct snd_soc_dai_driver my_dai = {
          .name = "my-codec-dai",
          .playback = {
              .stream_name = "Playback",
              .channels_min = 1,
              .channels_max = 2,
              .rates = SNDRV_PCM_RATE_8000_48000,
              .formats = SNDRV_PCM_FMTBIT_S16_LE,
          },
          .capture = {
              .stream_name = "Capture",
              .channels_min = 1,
              .channels_max = 2,
              .rates = SNDRV_PCM_RATE_8000_48000,
              .formats = SNDRV_PCM_FMTBIT_S16_LE,
          },
      };

      static int my_codec_probe(struct snd_soc_component *component) {
          /* 初始化硬件 */
          my_codec_set_bias_level(component, SND_SOC_BIAS_STANDBY);
          return 0;
      }

      static const struct snd_soc_codec_driver soc_codec_dev_my = {
          .probe = my_codec_probe,
      };

      /* 机器驱动 */
      static struct snd_soc_dai_link my_dai_link = {
          .name = "my-codec",
          .stream_name = "my-codec HiFi",
          .codec_dai_name = "my-codec-dai",
          .dai_fmt = SND_SOC_DAIFMT_I2S | SND_SOC_DAIFMT_NB_NF,
      };

      static struct snd_soc_card my_card = {
          .name = "my-board",
          .dai_link = &my_dai_link,
          .num_links = 1,
      };

      static int my_probe(struct platform_device *pdev) {
          struct snd_soc_card *card = &my_card;
          int ret;

          /* 设置 card 私有数据 */
          platform_set_drvdata(pdev, card);

          /* 注册声卡 */
          ret = devm_snd_soc_register_card(&pdev->dev, card);
          if (ret)
              dev_err(&pdev->dev, "Failed to register card\n");

          return ret;
      }

  - description: "带有 DAPM 电源管理的驱动"
    code: |
      static int my_set_bias_level(struct snd_soc_component *component,
                                   enum snd_soc_bias_level level) {
          struct my_priv *priv = snd_soc_component_get_drvdata(component);

          switch (level) {
          case SND_SOC_BIAS_PREPARE:
              /* 准备偏置 */
              regulator_enable(priv->vdd);
              break;
          case SND_SOC_BIAS_STANDBY:
              /* 待机偏置 */
              if (snd_soc_component_get_bias_level(component) == SND_SOC_BIAS_PREPARE)
                  regulator_disable(priv->vdd);
              break;
          case SND_SOC_BIAS_OFF:
              regulator_disable(priv->vdd);
              break;
          default:
              break;
          }
          return 0;
      }

      static const struct snd_soc_component_driver my_codec = {
          .set_bias_level = my_set_bias_level,
          .controls = my_controls,
          .num_controls = ARRAY_SIZE(my_controls),
          .dapm_widgets = my_widgets,
          .num_dapm_widgets = ARRAY_SIZE(my_widgets),
          .dapm_routes = my_routes,
          .num_dapm_routes = ARRAY_SIZE(my_routes),
      };
